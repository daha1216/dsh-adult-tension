name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Validate content tables
        run: python scripts/check_content.py
      - name: Audit material inventory and pairings
        run: |
          python scripts/material_inventory.py --summary
          python scripts/check_material_compatibility.py --summary
          python scripts/sample_materials.py --summary
      - name: Check diff whitespace
        run: git diff --check
