name: quality

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Require semantic and real-model acceptance evidence
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Full quality checks
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
        run: python scripts/qa.py --full
      - name: Release acceptance gate
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release }}
        run: python scripts/qa.py --full --release
