<svg viewBox="0 0 390 32" width="390" height="32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>
    <linearGradient id="pillBdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="pillShdw" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.025" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0.1px;
    }
  </style>

  <!-- 纯白瓷质极细胶囊底板 -->
  <rect x="2" y="2" width="386" height="28" rx="14" fill="url(#pillBg)" stroke="url(#pillBdr)" stroke-width="1.1" filter="url(#pillShdw)" />

  <!-- 严格居中文字排布 (text-anchor="middle", x=195)，无任何圆点 -->
  <text x="195" y="20.5" class="font-sans" font-size="12.5" text-anchor="middle">
    <tspan font-weight="700" fill="#334155">原生 Agent Skill</tspan>
    <tspan font-weight="400" fill="#64748b"> · 专为 DeepSeek Harness 运行时打造</tspan>
  </text>
</svg>