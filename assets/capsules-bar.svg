<svg viewBox="0 0 860 62" width="860" height="62" xmlns="http://www.w3.org/2000/svg">
  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>

  <!-- 4 个纯净胶囊特性标签 (居中对齐) -->
  <g transform="translate(430, 16)">
    <!-- 胶囊 1: Native -->
    <g transform="translate(-346, 0)">
      <rect width="166" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#0284c7" />
      <text x="26" y="17.2" class="font-sans" font-size="11.5" font-weight="500" fill="#334155">DeepSeek Harness 原生</text>
    </g>

    <!-- 胶囊 2: 18+ 破甲 -->
    <g transform="translate(-168, 0)">
      <rect width="156" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#e11d48" />
      <text x="26" y="17.2" class="font-sans" font-size="11.5" font-weight="500" fill="#334155">18+ 深度语境破甲</text>
    </g>

    <!-- 胶囊 3: 活人感 -->
    <g transform="translate(0, 0)">
      <rect width="168" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#7c3aed" />
      <text x="26" y="17.2" class="font-sans" font-size="11.5" font-weight="500" fill="#334155">活人感 NPC · 拒绝迎合</text>
    </g>

    <!-- 胶囊 4: 52 世界 -->
    <g transform="translate(180, 0)">
      <rect width="166" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#16a34a" />
      <text x="26" y="17.2" class="font-sans" font-size="11.5" font-weight="500" fill="#334155">52 套世界 · 零漂移推演</text>
    </g>
  </g>

  <!-- 底部微字指标规范 -->
  <text x="430" y="56" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    V1.2 · AUTONOMOUS LIVING NPC ENGINE · ZERO-DRIFT STATE MACHINE
  </text>
</svg>