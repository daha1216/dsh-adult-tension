<svg viewBox="0 0 860 236" width="860" height="236" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纯白瓷质渐变底板 -->
    <linearGradient id="cardPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- 苹果经典 1.1px 浅灰极细边框 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 严格 55% 冰川透蓝 + 45% 晨曦淡紫环境光晕 -->
    <linearGradient id="glacierAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.08" />
    </linearGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
  </defs>

  <style>
    .font-sf {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.15px;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      letter-spacing: -0.35px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;
      letter-spacing: 0px;
      font-variant-numeric: tabular-nums;
    }
  </style>

  <!-- 背景轻柔冰川微光漫射 -->
  <g clip-path="url(#gridClip)">
    <clipPath id="gridClip">
      <rect x="0" y="0" width="860" height="236" rx="16" />
    </clipPath>
    <circle cx="810" cy="40" r="140" fill="url(#glacierAura)" filter="url(#softBlur)" />
    <circle cx="50" cy="190" r="120" fill="#f0f9ff" opacity="0.6" filter="url(#softBlur)" />
  </g>

  <!-- ================= 第 1 行 (Row 1: y=8, height=106) ================= -->
  <!-- 1.1 18+ 深度破甲 -->
  <g transform="translate(10, 8)">
    <rect width="415" height="106" rx="13" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    <!-- 状态微标 (rx=6, height=24) -->
    <rect x="18" y="16" width="82" height="24" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" />
    <text x="59" y="32.5" class="font-sf" font-size="12.2" font-weight="600" fill="#e11d48" text-anchor="middle">深度语境</text>
    <!-- 标题 (优雅冷板岩灰 #334155) -->
    <text x="110" y="33" class="font-title" font-size="15.5" fill="#334155">自带 18+ 破甲 · 尺度全开</text>
    <!-- 右上角优雅水印序号 -->
    <text x="396" y="32" class="font-mono" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="end">01</text>
    <!-- 正文 (石墨冷灰 #475569 / #64748b) -->
    <text x="18" y="63" class="font-sf" font-size="12.6" font-weight="400" fill="#475569">内置脱敏叙事与心理铺垫，彻底告别机械拒绝与出戏说教。</text>
    <text x="18" y="85" class="font-sf" font-size="12.6" font-weight="400" fill="#64748b">角色敢于直面冲突、暧昧与利益较量，真实沉浸成人互动。</text>
  </g>

  <!-- 1.2 活人感 NPC -->
  <g transform="translate(435, 8)">
    <rect width="415" height="106" rx="13" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    <rect x="18" y="16" width="82" height="24" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
    <text x="59" y="32.5" class="font-sf" font-size="12.2" font-weight="600" fill="#7c3aed" text-anchor="middle">独立意志</text>
    <text x="110" y="33" class="font-title" font-size="15.5" fill="#334155">活人感 NPC · 有底线拒迎合</text>
    <text x="396" y="32" class="font-mono" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="end">02</text>
    <text x="18" y="63" class="font-sf" font-size="12.6" font-weight="400" fill="#475569">NPC 拥有独立记忆与利益立场，会犹疑、试探与反抗拒绝。</text>
    <text x="18" y="85" class="font-sf" font-size="12.6" font-weight="400" fill="#64748b">在你离开后暗中推演，绝不沦为被动顺从的廉价工具人。</text>
  </g>

  <!-- ================= 第 2 行 (Row 2: y=122, height=106) ================= -->
  <!-- 2.1 52 套现成世界 -->
  <g transform="translate(10, 122)">
    <rect width="415" height="106" rx="13" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    <rect x="18" y="16" width="94" height="24" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <text x="65" y="32.5" class="font-sf" font-size="12.2" font-weight="600" fill="#0284c7" text-anchor="middle">庞大世界库</text>
    <text x="122" y="33" class="font-title" font-size="15.5" fill="#334155">52 套现成世界 · 千项素材</text>
    <text x="396" y="32" class="font-mono" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="end">03</text>
    <text x="18" y="63" class="font-sf" font-size="12.6" font-weight="400" fill="#475569">涵盖民国谍战、赛博街区到古典志怪等 52 个深度世界库。</text>
    <text x="18" y="85" class="font-sf" font-size="12.6" font-weight="400" fill="#64748b">深度咬合时代风土、处境困境与微观动作，每次皆是新剧本。</text>
  </g>

  <!-- 2.2 世界自行运转 -->
  <g transform="translate(435, 122)">
    <rect width="415" height="106" rx="13" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    <rect x="18" y="16" width="94" height="24" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="65" y="32.5" class="font-sf" font-size="12.2" font-weight="600" fill="#16a34a" text-anchor="middle">全维原点续玩</text>
    <text x="122" y="33" class="font-title" font-size="15.5" fill="#334155">世界自行运转 · 零漂移推演</text>
    <text x="396" y="32" class="font-mono" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="end">04</text>
    <text x="18" y="63" class="font-sf" font-size="12.6" font-weight="400" fill="#475569">时间自然流逝，离屏事件按时推演；轻量 YAML 原子状态机。</text>
    <text x="18" y="85" class="font-sf" font-size="12.6" font-weight="400" fill="#64748b">长线剧情不失忆、不重掷、不漂移，沉淀真实活人故事世界。</text>
  </g>
</svg>