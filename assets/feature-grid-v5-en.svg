<svg viewBox="0 0 860 228" width="860" height="228" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="flagshipAura" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fecdd3" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#fda4af" stop-opacity="0.18" />
      <stop offset="85%" stop-color="#bae6fd" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.1" />
    </linearGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.025" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      letter-spacing: -0.4px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <!-- Row 1: Flagship 18+ Desensitization (Full Width 840px) -->
  <g transform="translate(10, 6)">
    <rect width="840" height="106" rx="14" fill="url(#cardPlate)" stroke="#fecdd3" stroke-width="1.2" filter="url(#cardShadow)" />
    
    <g clip-path="url(#flagshipClipEn)">
      <clipPath id="flagshipClipEn">
        <rect width="840" height="106" rx="14" />
      </clipPath>
      <circle cx="760" cy="40" r="160" fill="url(#flagshipAura)" filter="url(#softBlur)" />
      <circle cx="80" cy="80" r="100" fill="#fff1f2" opacity="0.6" filter="url(#softBlur)" />
    </g>

    <rect x="22" y="18" width="96" height="25" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" />
    <circle cx="34" cy="30.5" r="3.5" fill="#e11d48" />
    <text x="64" y="35" class="font-sans" font-size="12" font-weight="700" fill="#e11d48" text-anchor="middle">FLAGSHIP</text>

    <text x="130" y="36" class="font-title" font-size="18" fill="#1e293b">Built-in 18+ Desensitization · Full Mature Freedom</text>

    <text x="816" y="35" class="font-mono" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="end" letter-spacing="1">FLAGSHIP · 01</text>

    <text x="22" y="68" class="font-sans" font-size="13" font-weight="500" fill="#334155">
      Context-aware narrative framing eliminates mechanical refusals, patronizing moralizing, and break-in-character lectures.
    </text>
    <text x="22" y="90" class="font-sans" font-size="12.5" font-weight="400" fill="#64748b">
      Characters authentically confront intense conflicts, psychological leverage, intimacy, and non-linear narrative stakes.
    </text>
  </g>

  <!-- Row 2: Secondary 3-Column Grid -->
  <!-- 2.1 Living NPCs -->
  <g transform="translate(10, 120)">
    <rect width="273" height="102" rx="12" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#cardShadow)" />
    <rect x="14" y="14" width="76" height="22" rx="5" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.9" />
    <text x="52" y="29" class="font-sans" font-size="11.5" font-weight="600" fill="#7c3aed" text-anchor="middle">Autonomy</text>
    <text x="98" y="29.5" class="font-title" font-size="14" fill="#334155">Living NPCs</text>
    <text x="258" y="29" class="font-mono" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="end">02</text>
    <text x="14" y="56" class="font-sans" font-size="11.8" font-weight="400" fill="#475569">Independent motives and boundaries;</text>
    <text x="14" y="74" class="font-sans" font-size="11.8" font-weight="400" fill="#475569">refuse, push back, and scheme off-screen,</text>
    <text x="14" y="92" class="font-sans" font-size="11.5" font-weight="400" fill="#94a3b8">never passive props or yes-men.</text>
  </g>

  <!-- 2.2 52 World Frameworks -->
  <g transform="translate(293, 120)">
    <rect width="274" height="102" rx="12" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#cardShadow)" />
    <rect x="14" y="14" width="80" height="22" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.9" />
    <text x="54" y="29" class="font-sans" font-size="11.5" font-weight="600" fill="#0284c7" text-anchor="middle">World Library</text>
    <text x="102" y="29.5" class="font-title" font-size="14" fill="#334155">52 Frameworks</text>
    <text x="259" y="29" class="font-mono" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="end">03</text>
    <text x="14" y="56" class="font-sans" font-size="11.8" font-weight="400" fill="#475569">From cyberpunk to historical espionage;</text>
    <text x="14" y="74" class="font-sans" font-size="11.8" font-weight="400" fill="#475569">era lore tightly interlocks with micro-actions,</text>
    <text x="14" y="92" class="font-sans" font-size="11.5" font-weight="400" fill="#94a3b8">each session is a fresh storyline.</text>
  </g>

  <!-- 2.3 Zero-Drift Timeline -->
  <g transform="translate(577, 120)">
    <rect width="273" height="102" rx="12" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#cardShadow)" />
    <rect x="14" y="14" width="76" height="22" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.9" />
    <text x="52" y="29" class="font-sans" font-size="11.5" font-weight="600" fill="#16a34a" text-anchor="middle">Zero-Drift</text>
    <text x="98" y="29.5" class="font-title" font-size="14" fill="#334155">State Machine</text>
    <text x="258" y="29" class="font-mono" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="end">04</text>
    <text x="14" y="56" class="font-sans" font-size="11.8" font-weight="400" fill="#475569">Lightweight atomic YAML state saving;</text>
    <text x="14" y="74" class="font-sans" font-size="11.8" font-weight="400" fill="#475569">natural time flow, zero drift or amnesia,</text>
    <text x="14" y="92" class="font-sans" font-size="11.5" font-weight="400" fill="#94a3b8">seamless long-term story persistence.</text>
  </g>
</svg>