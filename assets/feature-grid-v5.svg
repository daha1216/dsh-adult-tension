<svg viewBox="0 0 860 236" width="860" height="236" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 18+ 旗舰特权专属红晕与冰蓝交织微光 -->
    <linearGradient id="flagshipAura" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fecdd3" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#fda4af" stop-opacity="0.16" />
      <stop offset="85%" stop-color="#bae6fd" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.08" />
    </linearGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.025" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      letter-spacing: -0.3px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.1px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <!-- ================= 核心旗舰行：18+ 破甲 (独占整行全宽 840px, 纯粹居中排版, 零序号) ================= -->
  <g transform="translate(10, 6)">
    <rect width="840" height="110" rx="14" fill="url(#cardPlate)" stroke="#fecdd3" stroke-width="1.2" filter="url(#cardShadow)" />
    
    <g clip-path="url(#flagshipClip)">
      <clipPath id="flagshipClip">
        <rect width="840" height="110" rx="14" />
      </clipPath>
      <circle cx="760" cy="40" r="160" fill="url(#flagshipAura)" filter="url(#softBlur)" />
      <circle cx="80" cy="80" r="100" fill="#fff1f2" opacity="0.6" filter="url(#softBlur)" />
    </g>

    <!-- 顶部居中：胶囊徽标 + 大标题组合 (总宽约 440px, 居中起点 420) -->
    <g transform="translate(420, 32)">
      <!-- 胶囊徽标 (宽 84, 高 24) -->
      <g transform="translate(-215, -12)">
        <rect width="84" height="24" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" />
        <circle cx="14" cy="12" r="3.5" fill="#e11d48" />
        <text x="46" y="16.5" class="font-sans" font-size="11.5" font-weight="700" fill="#e11d48" text-anchor="middle">核心卖点</text>
      </g>
      <!-- 大标题文字 (紧随其后居中舒展) -->
      <text x="-115" y="6" class="font-title" font-size="18" fill="#1e293b">自带 18+ 深度破甲 · 尺度全开 · 真实成人互动</text>
    </g>

    <!-- 正文全居中 (字距舒展，行高 22px，呼吸感极佳) -->
    <text x="420" y="70" class="font-body" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">
      内置深度脱敏叙事框架与无痕心理铺垫，彻底告别主流模型机械生硬的直接拒绝、出戏说教与道德审判。
    </text>
    <text x="420" y="93" class="font-body" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">
      角色敢于直面激烈冲突、高张力暧昧拉扯与深层利益较量，带来真正无拘束、沉浸饱满的高质量成人互动叙事体验。
    </text>
  </g>

  <!-- ================= 次级 3 联排 (Row 2: y=124, 宽度 273px, 同样全居中排版, 零序号) ================= -->
  <!-- 2.1 活人感 NPC -->
  <g transform="translate(10, 124)">
    <rect width="273" height="106" rx="12" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#cardShadow)" />
    
    <!-- 顶部居中标签与标题 -->
    <g transform="translate(136.5, 26)">
      <rect x="-92" y="-11" width="66" height="22" rx="5" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.9" />
      <text x="-59" y="4" class="font-sans" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">独立意志</text>
      <text x="-16" y="4.5" class="font-title" font-size="14" fill="#334155">活人感 NPC</text>
    </g>

    <!-- 正文全部居中排版 -->
    <text x="136.5" y="56" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">有底线有立场，拒绝无脑顺从；</text>
    <text x="136.5" y="74" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">犹疑、试探、反击与离屏暗推演，</text>
    <text x="136.5" y="92" class="font-body" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">绝非被动配合的廉价工具人。</text>
  </g>

  <!-- 2.2 52 套现成世界 -->
  <g transform="translate(293, 124)">
    <rect width="274" height="106" rx="12" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#cardShadow)" />
    
    <g transform="translate(137, 26)">
      <rect x="-98" y="-11" width="72" height="22" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.9" />
      <text x="-62" y="4" class="font-sans" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">庞大素材库</text>
      <text x="-16" y="4.5" class="font-title" font-size="14" fill="#334155">52 套深度世界</text>
    </g>

    <text x="137" y="56" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">涵盖民国谍战、赛博到志怪；</text>
    <text x="137" y="74" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">时代风土与微观动作深度咬合，</text>
    <text x="137" y="92" class="font-body" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">每次开局皆是高张力新剧本。</text>
  </g>

  <!-- 2.3 世界自行运转 -->
  <g transform="translate(577, 124)">
    <rect width="273" height="106" rx="12" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#cardShadow)" />
    
    <g transform="translate(136.5, 26)">
      <rect x="-98" y="-11" width="72" height="22" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.9" />
      <text x="-62" y="4" class="font-sans" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">零漂移推演</text>
      <text x="-16" y="4.5" class="font-title" font-size="14" fill="#334155">自运行状态机</text>
    </g>

    <text x="136.5" y="56" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">轻量 YAML 原子状态全维沉淀；</text>
    <text x="136.5" y="74" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">长线剧情不失忆、不重掷、不漂移，</text>
    <text x="136.5" y="92" class="font-body" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">自然流逝沉淀鲜活故事世界。</text>
  </g>
</svg>