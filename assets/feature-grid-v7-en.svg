<svg viewBox="0 0 860 236" width="860" height="236" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="glacierAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.08" />
    </linearGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.025" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      letter-spacing: -0.3px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.1px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <g transform="translate(10, 6)">
    <rect width="840" height="110" rx="14" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#cardShadow)" />
    
    <g clip-path="url(#flagshipClipEn)">
      <clipPath id="flagshipClipEn">
        <rect width="840" height="110" rx="14" />
      </clipPath>
      <circle cx="780" cy="35" r="150" fill="url(#glacierAura)" filter="url(#softBlur)" />
      <circle cx="60" cy="85" r="90" fill="#f0f9ff" opacity="0.6" filter="url(#softBlur)" />
    </g>

    <g transform="translate(420, 32)">
      <g transform="translate(-230, -12)">
        <rect width="86" height="24" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
        <circle cx="14" cy="12" r="3.5" fill="#0284c7" />
        <text x="48" y="16.5" class="font-sans" font-size="11.5" font-weight="600" fill="#0284c7" text-anchor="middle">FLAGSHIP</text>
      </g>
      <text x="-132" y="6" class="font-title" font-size="18" fill="#334155">Built-in 18+ Desensitization · Full Mature Freedom</text>
    </g>

    <text x="420" y="70" class="font-body" font-size="13" font-weight="500" fill="#334155" text-anchor="middle">
      Context-aware narrative framing eliminates mechanical refusals, patronizing moralizing, and break-in-character lectures.
    </text>
    <text x="420" y="93" class="font-body" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">
      Characters authentically confront intense conflicts, psychological leverage, intimacy, and non-linear narrative stakes.
    </text>
  </g>

  <g transform="translate(10, 124)">
    <rect width="273" height="106" rx="12" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#cardShadow)" />
    
    <g transform="translate(136.5, 26)">
      <rect x="-92" y="-11" width="70" height="22" rx="5" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.9" />
      <text x="-57" y="4" class="font-sans" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">Autonomy</text>
      <text x="-12" y="4.5" class="font-title" font-size="14" fill="#334155">Living NPCs</text>
    </g>

    <text x="136.5" y="56" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">Independent motives and boundaries;</text>
    <text x="136.5" y="74" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">refuse, push back, and scheme off-screen,</text>
    <text x="136.5" y="92" class="font-body" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">never passive props or yes-men.</text>
  </g>

  <g transform="translate(293, 124)">
    <rect width="274" height="106" rx="12" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#cardShadow)" />
    
    <g transform="translate(137, 26)">
      <rect x="-106" y="-11" width="76" height="22" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.9" />
      <text x="-68" y="4" class="font-sans" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">World Library</text>
      <text x="-20" y="4.5" class="font-title" font-size="14" fill="#334155">52 Frameworks</text>
    </g>

    <text x="137" y="56" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">From cyberpunk to historical espionage;</text>
    <text x="137" y="74" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">era lore tightly interlocks with micro-actions,</text>
    <text x="137" y="92" class="font-body" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">each session is a fresh storyline.</text>
  </g>

  <g transform="translate(577, 124)">
    <rect width="273" height="106" rx="12" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#cardShadow)" />
    
    <g transform="translate(136.5, 26)">
      <rect x="-98" y="-11" width="70" height="22" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.9" />
      <text x="-63" y="4" class="font-sans" font-size="11" font-weight="600" fill="#16a34a" text-anchor="middle">Zero-Drift</text>
      <text x="-18" y="4.5" class="font-title" font-size="14" fill="#334155">State Machine</text>
    </g>

    <text x="136.5" y="56" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">Lightweight atomic YAML state saving;</text>
    <text x="136.5" y="74" class="font-body" font-size="11.8" font-weight="400" fill="#475569" text-anchor="middle">natural time flow, zero drift or amnesia,</text>
    <text x="136.5" y="92" class="font-body" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">seamless long-term story persistence.</text>
  </g>
</svg>