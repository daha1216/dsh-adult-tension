<svg viewBox="0 0 860 148" width="860" height="148" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 浅蓝/淡紫 极细边框 -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 语言切换开关胶囊底板 -->
    <linearGradient id="switchBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="pillPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>
  </defs>

  <style>
    .font-sf {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      letter-spacing: -0.6px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <!-- 居中标题与精致矢量戏剧面具图标 -->
  <g transform="translate(430, 42)">
    <!-- 精致面具矢量图标 (沉稳灰紫渐变) -->
    <g transform="translate(-168, -26) scale(0.95)">
      <!-- 左半脸 (喜悦) -->
      <path d="M12 4C6.5 4 2 8.5 2 14c0 6.6 4.4 12 10 12s10-5.4 10-12c0-5.5-4.5-10-10-10zm-3 8c.8 0 1.5.7 1.5 1.5S9.8 15 9 15s-1.5-.7-1.5-1.5S8.2 12 9 12zm6 0c.8 0 1.5.7 1.5 1.5s-.7 1.5-1.5 1.5-1.5-.7-1.5-1.5.7-1.5 1.5-1.5zm-3 8.5c-2.3 0-4.3-1.4-4.8-3.5h9.6c-.5 2.1-2.5 3.5-4.8 3.5z" fill="#475569" />
      <!-- 右半脸 (冷峻戏剧拉扯) -->
      <path d="M26 10c-.5 0-1 .1-1.5.2.8 1.4 1.3 3.1 1.3 5 0 2.8-1 5.3-2.6 7.2 1.3 1.1 2.8 1.6 4.4 1.6 4.6 0 8.4-4.5 8.4-10 0-4.6-3.8-8.4-8.4-8.4zm-1.5 6.5c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm4.8 0c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm-3.8 6c.4-1.2 1.5-2 2.8-2s2.4.8 2.8 2h-5.6z" fill="#64748b" opacity="0.85" />
    </g>

    <!-- 主标题文字 (冷板岩灰 #334155) -->
    <text x="-124" y="0" class="font-title" font-size="33" fill="#334155">dsh-adult-tension</text>
  </g>

  <!-- 4 个苹果现代无衬线瓷质胶囊标签 (居中对齐) -->
  <g transform="translate(430, 88)">
    <!-- 胶囊 1: Native Skill (width: 176) -->
    <g transform="translate(-340, 0)">
      <rect width="162" height="26" rx="13" fill="url(#pillPlate)" stroke="url(#pillBorder)" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#0284c7" />
      <text x="26" y="17.2" class="font-sf" font-size="11.5" font-weight="500" fill="#334155">DeepSeek Harness 原生</text>
    </g>

    <!-- 胶囊 2: 18+ 语境破甲 (width: 148) -->
    <g transform="translate(-166, 0)">
      <rect width="154" height="26" rx="13" fill="url(#pillPlate)" stroke="url(#pillBorder)" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#e11d48" />
      <text x="26" y="17.2" class="font-sf" font-size="11.5" font-weight="500" fill="#334155">18+ 深度语境不设限</text>
    </g>

    <!-- 胶囊 3: 52 套世界 (width: 154) -->
    <g transform="translate(0, 0)">
      <rect width="162" height="26" rx="13" fill="url(#pillPlate)" stroke="url(#pillBorder)" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#0891b2" />
      <text x="26" y="17.2" class="font-sf" font-size="11.5" font-weight="500" fill="#334155">52 套深度世界框架库</text>
    </g>

    <!-- 胶囊 4: 活人感独立意志 (width: 154) -->
    <g transform="translate(174, 0)">
      <rect width="166" height="26" rx="13" fill="url(#pillPlate)" stroke="url(#pillBorder)" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#7c3aed" />
      <text x="26" y="17.2" class="font-sf" font-size="11.5" font-weight="500" fill="#334155">活人感 NPC · 拒绝迎合</text>
    </g>
  </g>

  <!-- 底部细微状态：版本与架构特性 -->
  <text x="430" y="136" text-anchor="middle" class="font-mono" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    v1.2 · ZERO-DRIFT STATE MACHINE · LIVING NPCS · 52 WORLDS
  </text>
</svg>