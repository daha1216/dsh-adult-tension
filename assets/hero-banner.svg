<svg viewBox="0 0 860 178" width="860" height="178" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纯白瓷质渐变底板 -->
    <linearGradient id="heroPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- 苹果精细微灰边框 -->
    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 55% 冰川透蓝环境光晕 -->
    <linearGradient id="heroAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.08" />
    </linearGradient>

    <filter id="auraBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.025" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <!-- 纯白瓷质主卡底板 -->
  <rect x="2" y="2" width="856" height="174" rx="16" fill="url(#heroPlate)" stroke="url(#heroBorder)" stroke-width="1.1" filter="url(#cardShadow)" />

  <!-- 右上角 55% 冰川透蓝环境微光漫射 -->
  <g clip-path="url(#heroClip)">
    <clipPath id="heroClip">
      <rect x="2" y="2" width="856" height="174" rx="16" />
    </clipPath>
    <circle cx="790" cy="40" r="140" fill="url(#heroAura)" filter="url(#auraBlur)" />
    <circle cx="70" cy="140" r="100" fill="#f0f9ff" opacity="0.6" filter="url(#auraBlur)" />
  </g>

  <!-- 第 1 层：顶部精致面具徽标与主标题 -->
  <g transform="translate(430, 36)">
    <g transform="translate(-164, -20) scale(0.85)">
      <path d="M12 4C6.5 4 2 8.5 2 14c0 6.6 4.4 12 10 12s10-5.4 10-12c0-5.5-4.5-10-10-10zm-3 8c.8 0 1.5.7 1.5 1.5S9.8 15 9 15s-1.5-.7-1.5-1.5S8.2 12 9 12zm6 0c.8 0 1.5.7 1.5 1.5s-.7 1.5-1.5 1.5-1.5-.7-1.5-1.5.7-1.5 1.5-1.5zm-3 8.5c-2.3 0-4.3-1.4-4.8-3.5h9.6c-.5 2.1-2.5 3.5-4.8 3.5z" fill="#475569" />
      <path d="M26 10c-.5 0-1 .1-1.5.2.8 1.4 1.3 3.1 1.3 5 0 2.8-1 5.3-2.6 7.2 1.3 1.1 2.8 1.6 4.4 1.6 4.6 0 8.4-4.5 8.4-10 0-4.6-3.8-8.4-8.4-8.4zm-1.5 6.5c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm4.8 0c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm-3.8 6c.4-1.2 1.5-2 2.8-2s2.4.8 2.8 2h-5.6z" fill="#64748b" opacity="0.85" />
    </g>
    <text x="-124" y="2" class="font-title" font-size="28" fill="#334155">dsh-adult-tension</text>
  </g>

  <!-- 第 2 层：核心金句主标语 (工业级 Apple 排版 · 冷灰 #334155) -->
  <text x="430" y="80" class="font-title" font-size="18.5" fill="#334155" text-anchor="middle">
    专为高张力、强连续性的成人互动叙事打造
  </text>

  <!-- 第 3 层：4 个纯净胶囊特性标签 (独一份，绝无重复) -->
  <g transform="translate(430, 118)">
    <!-- 胶囊 1: Native -->
    <g transform="translate(-346, 0)">
      <rect width="166" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#0284c7" />
      <text x="26" y="17.2" class="font-sans" font-size="11.5" font-weight="500" fill="#334155">DeepSeek Harness 原生</text>
    </g>

    <!-- 胶囊 2: 18+ 破甲 -->
    <g transform="translate(-168, 0)">
      <rect width="156" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#e11d48" />
      <text x="26" y="17.2" class="font-sans" font-size="11.5" font-weight="500" fill="#334155">18+ 深度语境破甲</text>
    </g>

    <!-- 胶囊 3: 活人感 -->
    <g transform="translate(0, 0)">
      <rect width="168" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#7c3aed" />
      <text x="26" y="17.2" class="font-sans" font-size="11.5" font-weight="500" fill="#334155">活人感 NPC · 拒绝迎合</text>
    </g>

    <!-- 胶囊 4: 52 世界 -->
    <g transform="translate(180, 0)">
      <rect width="166" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="16" cy="13" r="3.5" fill="#16a34a" />
      <text x="26" y="17.2" class="font-sans" font-size="11.5" font-weight="500" fill="#334155">52 套世界 · 零漂移推演</text>
    </g>
  </g>

  <!-- 第 4 层：底部等宽微指标规约 -->
  <text x="430" y="162" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    V1.2 · AUTONOMOUS LIVING NPC ENGINE · ZERO-DRIFT STATE MACHINE
  </text>
</svg>