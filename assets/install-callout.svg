<svg viewBox="0 0 860 88" width="860" height="88" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纯白瓷质渐变底板 -->
    <linearGradient id="installPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- 苹果经典 1px 浅灰极细边框 -->
    <linearGradient id="installBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 柔和微光漫射 -->
    <linearGradient id="installAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.06" />
    </linearGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.025" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      letter-spacing: -0.3px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .live-dot {
      animation: pulse 2.6s infinite ease-in-out;
    }
  </style>

  <!-- 底板与细边框 (840 居中) -->
  <g transform="translate(10, 4)">
    <rect width="840" height="80" rx="13" fill="url(#installPlate)" stroke="url(#installBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    
    <!-- 浅蓝环境微光 -->
    <g clip-path="url(#instClip)">
      <clipPath id="instClip">
        <rect width="840" height="80" rx="13" />
      </clipPath>
      <circle cx="780" cy="20" r="100" fill="url(#installAura)" filter="url(#softBlur)" />
      <circle cx="50" cy="60" r="80" fill="#f0f9ff" opacity="0.6" filter="url(#softBlur)" />
    </g>

    <!-- 左侧：图标与架构标识 (x=24, y=26) -->
    <g transform="translate(24, 18)">
      <!-- 状态微标胶囊 -->
      <rect width="138" height="22" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.9" />
      <circle cx="12" cy="11" r="3" fill="#0284c7" class="live-dot" />
      <text x="24" y="15" class="font-sans" font-size="11" font-weight="600" fill="#0284c7">原生 SKILL 运行架构</text>
      
      <!-- 标题 -->
      <text x="148" y="16.5" class="font-title" font-size="14.5" fill="#334155">DeepSeek Harness 原生适配指南</text>
    </g>

    <!-- 正文指引 (两段工整对齐) -->
    <g transform="translate(24, 56)">
      <text class="font-sans" font-size="12" fill="#64748b">
        入口契约：<tspan class="font-mono" font-weight="600" fill="#0f172a">SKILL.md</tspan> · 专为 
        <tspan font-weight="600" fill="#334155">DeepSeek Harness</tspan> 深度打造。请
        <tspan font-weight="600" fill="#0284c7">完整克隆仓库</tspan> 使用，单拷文件缺少后台状态机推演脚本与 52 套世界数据将无法启动。
      </text>
    </g>

    <!-- 右侧终端代码胶囊徽标 (x=816 右对齐) -->
    <g transform="translate(816, 26)">
      <rect x="-172" y="-12" width="172" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.9" />
      <text x="-86" y="4" class="font-mono" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">
        git clone .../dsh-adult-tension
      </text>
    </g>
  </g>
</svg>