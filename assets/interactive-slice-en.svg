<svg viewBox="0 0 860 380" width="860" height="380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ceramic white gradient background -->
    <linearGradient id="bgPlateEn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- Subtle gray border -->
    <linearGradient id="bdrGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Subtle ambient aura -->
    <linearGradient id="softAuraEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02" />
    </linearGradient>

    <filter id="plateShadowEn" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", -system-ui, sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>

  <!-- Main Card Plate (840 centered) -->
  <g transform="translate(10, 6)">
    <rect width="840" height="368" rx="16" fill="url(#bgPlateEn)" stroke="url(#bdrGradEn)" stroke-width="1.1" filter="url(#plateShadowEn)" />

    <!-- Ambient Aura -->
    <g clip-path="url(#plateClipEn)">
      <clipPath id="plateClipEn">
        <rect width="840" height="368" rx="16" />
      </clipPath>
      <circle cx="800" cy="40" r="140" fill="url(#softAuraEn)" />
    </g>

    <!-- ================= 1. Top HUD: Real-time Telemetry (y=16) ================= -->
    <g transform="translate(24, 18)">
      <circle cx="5" cy="8" r="3.5" fill="#0284c7" />
      <text x="16" y="12" class="font-sans" font-size="12.5" font-weight="700" fill="#0f172a">Tang Dynasty · Dali Temple Archives</text>
      <text x="260" y="12" class="font-sans" font-size="12" font-weight="400" fill="#94a3b8">Curfew 02:45 AM</text>

      <text x="792" y="12" class="font-mono" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="end">
        Tension <tspan font-weight="700" fill="#e11d48">85%</tspan> · Dist <tspan font-weight="700" fill="#0284c7">0.4m</tspan> · Guards 2 turns away
      </text>
    </g>

    <!-- Divider Line -->
    <line x1="24" y1="46" x2="816" y2="46" stroke="#f1f5f9" stroke-width="1" />

    <!-- ================= 2. Confrontation Body (y=58) ================= -->
    <g transform="translate(24, 58)">

      <!-- Beat 1: Player Prompt -->
      <g transform="translate(792, 0)">
        <rect x="-310" y="0" width="310" height="28" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
        <text x="-298" y="18" class="font-sans" font-size="11" font-weight="700" fill="#64748b">YOU:</text>
        <text x="-264" y="18" class="font-mono" font-size="11.5" font-weight="500" fill="#1e293b">Initialize, Tang Dynasty Extreme Mode</text>
      </g>

      <!-- Beat 2: Living NPC Non-Compliance -->
      <g transform="translate(0, 40)">
        <rect width="792" height="136" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.9" />
        <rect x="0" y="14" width="3.5" height="108" rx="1.75" fill="#0284c7" />

        <g transform="translate(20, 16)">
          <text class="font-sans" font-size="12" font-weight="700" fill="#0f172a">Shen Qinglan</text>
          <text x="86" y="0" class="font-sans" font-size="11.5" font-weight="500" fill="#64748b">(Dali Temple Clerk · 21y)</text>
          <text x="246" y="0" class="font-sans" font-size="11.5" font-weight="400" fill="#94a3b8">
            Holding torn ledger tight against her silk sleeve, back to the heavy door
          </text>

          <g transform="translate(0, 30)">
            <text class="font-sans" font-size="14.5" font-weight="600" fill="#1e293b">
              Coldly eyeing your saber: “<tspan font-weight="700" fill="#0284c7">You are NOT on duty tonight... STOP!</tspan>”
            </text>
            <text y="24" class="font-sans" font-size="12.5" font-weight="400" fill="#475569">
              A faint metallic click—she latches the heavy brass bolt behind her. Retreat severed. Night patrol gongs echo outside.
            </text>
          </g>

          <g transform="translate(0, 84)">
            <rect width="752" height="22" rx="4" fill="#f8fafc" stroke="#f1f5f9" stroke-width="0.8" />
            <text x="10" y="15" class="font-mono" font-size="10.5" font-weight="500" fill="#64748b">
              ⚡ <tspan font-weight="700" fill="#0284c7">ZERO-DRIFT EVENT</tspan>: Interest Defense Triggered · Submission 0% (Override Rejected) · Door Locked
            </text>
          </g>
        </g>
      </g>

      <!-- Beat 3: Player Counter -->
      <g transform="translate(0, 190)">
        <rect width="792" height="66" rx="10" fill="#f0f9ff" fill-opacity="0.5" stroke="#bae6fd" stroke-width="1" />

        <g transform="translate(20, 16)">
          <text class="font-sans" font-size="12" font-weight="700" fill="#0284c7">YOU</text>
          <text x="32" y="0" class="font-sans" font-size="11.5" font-weight="500" fill="#64748b">(Breaking Safe Distance · 0.4m Spatial Pressure)</text>

          <g transform="translate(0, 24)">
            <text class="font-sans" font-size="13" font-weight="500" fill="#0f172a">
              Step into her alert boundary, slamming hand onto door beside her ear:
              <tspan font-weight="700" fill="#0369a1">“Hand over the ledger, or I take you out of here right now.”</tspan>
            </text>
          </g>
        </g>
      </g>
    </g>

    <!-- ================= 3. Bottom: Decision Fork ================= -->
    <g transform="translate(24, 328)">
      <text x="0" y="14" class="font-sans" font-size="11.5" font-weight="600" fill="#64748b">
        NPC Autonomous Decision Fork:
      </text>

      <g transform="translate(186, 0)">
        <text y="14" class="font-sans" font-size="11.5" fill="#475569">
          <tspan font-weight="600" fill="#334155">① Stab Hairpin / Seize Saber</tspan> <tspan font-family="'SF Mono', Menlo, monospace" font-size="10.5" fill="#94a3b8">35%</tspan>
          <tspan fill="#cbd5e1">   ·   </tspan>
          <tspan font-weight="600" fill="#0284c7">② Blackmail / Form Pact</tspan> <tspan font-family="'SF Mono', Menlo, monospace" font-size="10.5" fill="#0284c7">48%</tspan>
          <tspan fill="#cbd5e1">   ·   </tspan>
          <tspan font-weight="600" fill="#334155">③ Destroy &amp; Tear Ledger</tspan> <tspan font-family="'SF Mono', Menlo, monospace" font-size="10.5" fill="#94a3b8">17%</tspan>
        </text>
      </g>

      <text x="792" y="14" class="font-mono" font-size="10.5" font-weight="600" fill="#94a3b8" text-anchor="end">
        STATE MACHINE v3.0
      </text>
    </g>
  </g>
</svg>
