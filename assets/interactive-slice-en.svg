<svg viewBox="0 0 860 286" width="860" height="286" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sliceBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <linearGradient id="sliceBdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="sliceAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.06" />
    </linearGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <filter id="cardShdw" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-weight: 700;
      letter-spacing: -0.3px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <g transform="translate(10, 4)">
    <rect width="840" height="278" rx="16" fill="url(#sliceBg)" stroke="url(#sliceBdr)" stroke-width="1.1" filter="url(#cardShdw)" />
    
    <g clip-path="url(#sliceClipEn)">
      <clipPath id="sliceClipEn">
        <rect width="840" height="278" rx="16" />
      </clipPath>
      <circle cx="790" cy="40" r="140" fill="url(#sliceAura)" filter="url(#softBlur)" />
      <circle cx="50" cy="240" r="100" fill="#f0f9ff" opacity="0.6" filter="url(#softBlur)" />
    </g>

    <!-- Top Console Header -->
    <g transform="translate(24, 16)">
      <rect width="146" height="22" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.9" />
      <circle cx="12" cy="11" r="3" fill="#0284c7" />
      <text x="24" y="15" class="font-sans" font-size="11" font-weight="600" fill="#0284c7">Chang'an · Tension Duel</text>

      <text x="156" y="15.5" class="font-sans" font-size="12" font-weight="500" fill="#64748b">Live Interactive Slice</text>

      <text x="792" y="15" class="font-mono" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end">
        Vigilance 85% · Deadbolt Locked · Guards Approaching
      </text>
    </g>

    <line x1="24" y1="46" x2="816" y2="46" stroke="#f1f5f9" stroke-width="1" />

    <!-- Turn 1: User Start -->
    <g transform="translate(816, 56)">
      <rect x="-260" y="0" width="260" height="30" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.9" />
      <text x="-248" y="19" class="font-sans" font-size="11.5" font-weight="600" fill="#64748b">You:</text>
      <text x="-218" y="19" class="font-mono" font-size="12" font-weight="500" fill="#1e293b">Start, Chang'an High-Pressure</text>
    </g>

    <!-- Turn 2: Living NPC Stance & Response -->
    <g transform="translate(24, 96)">
      <rect width="792" height="106" rx="10" fill="#fafbfc" stroke="#f1f5f9" stroke-width="1" />
      
      <g transform="translate(16, 14)">
        <rect width="74" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8" />
        <text x="37" y="13" class="font-sans" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="middle">Worldview</text>
        <text x="82" y="13.5" class="font-sans" font-size="12" font-weight="400" fill="#475569">Tang Dynasty Chang'an. Curfew is imminent, the 600th night-watch drum fading into silence.</text>
      </g>

      <g transform="translate(16, 38)">
        <rect width="48" height="18" rx="4" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="0.8" />
        <text x="24" y="13" class="font-sans" font-size="10.5" font-weight="600" fill="#db2777" text-anchor="middle">NPC</text>
        <text x="56" y="13.5" class="font-sans" font-size="12" font-weight="600" fill="#1e293b">Shen Qinglan</text>
        <text x="146" y="13.5" class="font-sans" font-size="12" font-weight="400" fill="#64748b">(Court clerk, clutch torn ledger fragments, backing against archive doors)</text>
      </g>

      <g transform="translate(16, 68)">
        <text class="font-sans" font-size="12.5" fill="#334155">
          <tspan font-weight="600" fill="#0f172a">Narrative:</tspan>
          Warily eyeing your blade: "<tspan font-weight="700" fill="#0284c7">You weren't scheduled for patrol tonight... Halt.</tspan>" Deadbolt slid into place.
        </text>
        <text y="20" class="font-sans" font-size="11.5" fill="#94a3b8">
          (YAML State: Triggered defensive stance, refuses to comply, patrolling guards closing in...)
        </text>
      </g>
    </g>

    <!-- Turn 3: User Counter-Play -->
    <g transform="translate(816, 214)">
      <rect x="-530" y="0" width="530" height="38" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
      <text x="-516" y="23" class="font-sans" font-size="12" font-weight="700" fill="#0284c7">You:</text>
      <text x="-484" y="23" class="font-sans" font-size="12.5" font-weight="500" fill="#0f172a">
        I step forward, pressing my hand flat against the door panel: "Hand over the ledger, or I take you out now."
      </text>
    </g>
  </g>
</svg>