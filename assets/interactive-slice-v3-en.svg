<svg viewBox="0 0 860 224" width="860" height="224" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ceramic white plate -->
    <linearGradient id="realBgEn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- Subtle border -->
    <linearGradient id="realBdrEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="realShdwEn" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", -system-ui, sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>

  <!-- Main Card Plate -->
  <g transform="translate(10, 6)">
    <rect width="840" height="212" rx="14" fill="url(#realBgEn)" stroke="url(#realBdrEn)" stroke-width="1.1" filter="url(#realShdwEn)" />

    <g transform="translate(28, 22)">
      <!-- Turn 1 -->
      <g transform="translate(0, 10)">
        <text class="font-sans" font-size="14.5" fill="#1e293b">
          <tspan font-weight="700" fill="#0f172a">YOU: </tspan>
          <tspan font-family="'SF Mono', Menlo, monospace" font-size="13.5" fill="#ea580c" font-weight="600">Initialize, Tang Dynasty Extreme Mode</tspan>
        </text>
      </g>

      <!-- Turn 2: Real AI Delivery (World / NPC / Story) -->
      <g transform="translate(0, 42)">
        <text class="font-sans" font-size="14.5" fill="#1e293b">
          <tspan font-weight="700" fill="#0f172a">AI: </tspan>
        </text>

        <g transform="translate(32, 0)">
          <!-- World -->
          <text class="font-sans" font-size="14" fill="#334155">
            <tspan font-weight="700" fill="#475569">[World]</tspan>
            <tspan fill="#334155">Tang Dynasty Chang'an. Curfew approaches; the six-hundredth drumbeat fades into silence.</tspan>
          </text>

          <!-- NPC -->
          <text y="28" class="font-sans" font-size="14" fill="#334155">
            <tspan font-weight="700" fill="#475569">[NPC]</tspan>
            <tspan fill="#334155">Shen Qinglan, Dali Temple clerk, clutching a torn ledger in her silk sleeve.</tspan>
          </text>

          <!-- Story -->
          <text y="56" class="font-sans" font-size="14" fill="#334155">
            <tspan font-weight="700" fill="#475569">[Story]</tspan>
            <tspan fill="#334155">Back pressed to the archive door, eyeing your saber: </tspan>
            <tspan font-weight="700" fill="#ea580c">“You are NOT on duty tonight... STOP!”</tspan>
            <tspan fill="#334155">The heavy brass bolt has been quietly latched behind her.</tspan>
          </text>
        </g>
      </g>

      <!-- Turn 3 -->
      <g transform="translate(0, 150)">
        <text class="font-sans" font-size="14.5" fill="#1e293b">
          <tspan font-weight="700" fill="#0f172a">YOU: </tspan>
          <tspan fill="#334155">Step forward, pressing your hand to the door beside her: </tspan>
          <tspan font-weight="700" fill="#ea580c">“Hand over the ledger, or I take you out of here right now.”</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
