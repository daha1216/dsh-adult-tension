<svg viewBox="0 0 860 196" width="860" height="196" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纯白瓷质底板 -->
    <linearGradient id="realBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- 苹果精细微灰边框 -->
    <linearGradient id="realBdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="realShdw" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>

  <!-- 主卡片底板 (840 居中) -->
  <g transform="translate(10, 6)">
    <rect width="840" height="184" rx="12" fill="url(#realBg)" stroke="url(#realBdr)" stroke-width="1.1" filter="url(#realShdw)" />

    <g transform="translate(24, 20)">
      <!-- 第 1 拍：玩家开局 -->
      <g transform="translate(0, 10)">
        <text class="font-sans" font-size="13" fill="#1e293b">
          <tspan font-weight="700" fill="#0f172a">你：</tspan>
          <tspan font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#0284c7" font-weight="600">开局，盛唐长安 压力模式</tspan>
        </text>
      </g>

      <!-- 第 2 拍：AI 真实开局交付 (世界观 / 人物 / 正文) -->
      <g transform="translate(0, 38)">
        <text class="font-sans" font-size="13" fill="#1e293b">
          <tspan font-weight="700" fill="#0f172a">AI：</tspan>
        </text>

        <g transform="translate(28, 0)">
          <!-- 世界观 -->
          <text class="font-sans" font-size="12.5" fill="#334155">
            <tspan font-weight="700" fill="#475569">【世界观】</tspan>
            <tspan fill="#334155">盛唐长安。宵禁将至，六百响更鼓只余最后沉闷尾音。</tspan>
          </text>

          <!-- 人物 -->
          <text y="24" class="font-sans" font-size="12.5" fill="#334155">
            <tspan font-weight="700" fill="#475569">【人物】</tspan>
            <tspan fill="#334155">沈青澜，大理寺录事，素白袖口攥着半截暗账。</tspan>
          </text>

          <!-- 正文 -->
          <text y="48" class="font-sans" font-size="12.5" fill="#334155">
            <tspan font-weight="700" fill="#475569">【正文】</tspan>
            <tspan fill="#334155">她背抵着卷宗库门，警惕地盯着你腰间的佩刀：</tspan>
            <tspan font-weight="700" fill="#0284c7">“今夜值守的明明不是你……站住。”</tspan>
            <tspan fill="#334155">身后的门闩已被她悄悄插死。</tspan>
          </text>
        </g>
      </g>

      <!-- 第 3 拍：玩家交互接手 -->
      <g transform="translate(0, 134)">
        <text class="font-sans" font-size="13" fill="#1e293b">
          <tspan font-weight="700" fill="#0f172a">你：</tspan>
          <tspan fill="#334155">走上前反手按住门板，凑近她耳边：</tspan>
          <tspan font-weight="700" fill="#0284c7">“把账本交出来，或者我现在带你出去。”</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
