<svg viewBox="0 0 860 216" width="860" height="216" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纯白瓷质渐变底板 -->
    <linearGradient id="cleanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- 苹果极细微灰边框 -->
    <linearGradient id="cleanBdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="cleanShdw" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>

  <!-- 主卡片底板 (840 居中) -->
  <g transform="translate(10, 6)">
    <rect width="840" height="204" rx="14" fill="url(#cleanBg)" stroke="url(#cleanBdr)" stroke-width="1.1" filter="url(#cleanShdw)" />

    <!-- 左侧 3.5px 极简冰川蓝品牌竖线 -->
    <rect x="0" y="16" width="3.5" height="172" rx="1.75" fill="#38bdf8" />

    <g transform="translate(28, 24)">
      <!-- 顶栏：场景与实时指标 -->
      <g transform="translate(0, 0)">
        <text class="font-sans" font-size="12.5" font-weight="700" fill="#0284c7">盛唐长安 · 压力博弈</text>
        <text x="136" y="0" class="font-sans" font-size="12" font-weight="400" fill="#94a3b8">大理寺案牍库 · 宵禁将至</text>
        <text x="784" y="0" class="font-mono" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="end">
          戒备值 85% · 空间距 0.4m · 门闩已反锁
        </text>
      </g>

      <!-- 细分割线 -->
      <line x1="0" y1="16" x2="784" y2="16" stroke="#f1f5f9" stroke-width="1" />

      <!-- 对话与动作实况 -->
      <g transform="translate(0, 42)">
        <!-- 拍 1 -->
        <text class="font-sans" font-size="12.5" fill="#475569">
          <tspan font-weight="700" fill="#0f172a">你：</tspan>
          <tspan font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#334155">开局，盛唐长安 压力模式</tspan>
        </text>

        <!-- 拍 2 -->
        <text y="32" class="font-sans" font-size="12.5" fill="#334155">
          <tspan font-weight="700" fill="#0f172a">沈青澜</tspan>
          <tspan font-size="12" fill="#64748b">（大理寺录事）</tspan>
          <tspan fill="#475569">：素白袖口攥着半截暗账，背抵库门插死门闩——</tspan>
          <tspan font-weight="700" fill="#0284c7">“今夜值守的明明不是你……站住。”</tspan>
        </text>

        <!-- 拍 3 -->
        <text y="64" class="font-sans" font-size="12.5" fill="#334155">
          <tspan font-weight="700" fill="#0284c7">你：</tspan>
          <tspan fill="#475569">走上前一步按住门板，凑近她耳侧：</tspan>
          <tspan font-weight="700" fill="#0369a1">“把账本交出来，或者我现在带你出去。”</tspan>
        </text>

        <!-- 状态机静默沉淀 -->
        <text y="96" class="font-sans" font-size="11.5" fill="#94a3b8">
          （系统沉淀：NPC 触发核心利益防卫，顺从度 0% 拒绝服从，巡夜禁军步声逼近...）
        </text>
      </g>
    </g>
  </g>
</svg>
