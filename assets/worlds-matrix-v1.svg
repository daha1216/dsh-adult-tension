<svg viewBox="0 0 860 196" width="860" height="196" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纯白瓷质底板 -->
    <linearGradient id="cardPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- 苹果精细微灰边框 -->
    <linearGradient id="cardBdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="tileShdw" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <g transform="translate(10, 4)">
    <!-- ================= 第一行：3 张卡片 (各宽 268) ================= -->
    <!-- 卡片 1：历史正剧与风云 -->
    <g transform="translate(0, 0)">
      <rect width="268" height="88" rx="10" fill="url(#cardPlate)" stroke="url(#cardBdr)" stroke-width="1" filter="url(#tileShdw)" />
      <g transform="translate(14, 14)">
        <!-- 标头微标签 -->
        <rect width="22" height="18" rx="4" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="0.8" />
        <circle cx="11" cy="9" r="3" fill="#0d9488" />
        <text x="30" y="14" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">历史正剧与风云</text>
        <!-- 情境条目 -->
        <text y="38" class="font-sans" font-size="11.8" fill="#475569">
          盛唐夜市坊志 · 幕末町屋道场
        </text>
        <text y="56" class="font-sans" font-size="11.5" fill="#64748b">
          一九二八芝加哥禁酒期黑帮...
        </text>
      </g>
    </g>

    <!-- 卡片 2：近未来边缘科幻 -->
    <g transform="translate(286, 0)">
      <rect width="268" height="88" rx="10" fill="url(#cardPlate)" stroke="url(#cardBdr)" stroke-width="1" filter="url(#tileShdw)" />
      <g transform="translate(14, 14)">
        <rect width="22" height="18" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8" />
        <circle cx="11" cy="9" r="3" fill="#0284c7" />
        <text x="30" y="14" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">近未来与边缘科幻</text>
        <text y="38" class="font-sans" font-size="11.8" fill="#475569">
          赛博街区公共终端 · 星海边境站
        </text>
        <text y="56" class="font-sans" font-size="11.5" fill="#64748b">
          废土修补集市 · 寒冬避难所...
        </text>
      </g>
    </g>

    <!-- 卡片 3：异界契约与志怪 -->
    <g transform="translate(572, 0)">
      <rect width="268" height="88" rx="10" fill="url(#cardPlate)" stroke="url(#cardBdr)" stroke-width="1" filter="url(#tileShdw)" />
      <g transform="translate(14, 14)">
        <rect width="22" height="18" rx="4" fill="#fdf4ff" stroke="#f0abfc" stroke-width="0.8" />
        <circle cx="11" cy="9" r="3" fill="#c026d3" />
        <text x="30" y="14" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">异界契约与志怪</text>
        <text y="38" class="font-sans" font-size="11.8" fill="#475569">
          契约城非人街坊 · 旧町神怪灯会
        </text>
        <text y="56" class="font-sans" font-size="11.5" fill="#64748b">
          仙门藏书与驿镖 · 蜃景鬼市...
        </text>
      </g>
    </g>

    <!-- ================= 第二行：2 张长卡片 (各宽 411) ================= -->
    <!-- 卡片 4：当代行业与市井 -->
    <g transform="translate(0, 100)">
      <rect width="411" height="84" rx="10" fill="url(#cardPlate)" stroke="url(#cardBdr)" stroke-width="1" filter="url(#tileShdw)" />
      <g transform="translate(16, 14)">
        <rect width="22" height="18" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8" />
        <circle cx="11" cy="9" r="3" fill="#7c3aed" />
        <text x="30" y="14" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">当代行业与市井</text>
        <text y="38" class="font-sans" font-size="11.8" fill="#475569">
          传媒编辑室暗访 · 成年创作者艺术季 · 同人展录音协作
        </text>
        <text y="55" class="font-sans" font-size="11.5" fill="#64748b">
          夜校学分实验室 · 磁带与夜市 · 千禧网络街坊...
        </text>
      </g>
    </g>

    <!-- 卡片 5：都市暗流与高张力 -->
    <g transform="translate(429, 100)">
      <rect width="411" height="84" rx="10" fill="url(#cardPlate)" stroke="url(#cardBdr)" stroke-width="1" filter="url(#tileShdw)" />
      <g transform="translate(16, 14)">
        <rect width="22" height="18" rx="4" fill="#fff1f2" stroke="#fecdd3" stroke-width="0.8" />
        <circle cx="11" cy="9" r="3" fill="#e11d48" />
        <text x="30" y="14" class="font-sans" font-size="13" font-weight="700" fill="#0f172a">都市暗流与高张力</text>
        <text y="38" class="font-sans" font-size="11.8" fill="#475569">
          舞厅大班与乐台后台 · 片场棚与月份牌画室 · 私房写真
        </text>
        <text y="55" class="font-sans" font-size="11.5" fill="#64748b">
          打赏榜与最后一格 · 动捕棚与中之人 · 老澡堂打烊点...
        </text>
      </g>
    </g>
  </g>
</svg>
