id: mat-00c8740516f7519592b47bb547fe5c27
name: 远途休假与小镇停留
material:
  eras:
  - 远途休假季
  aesthetics:
  - 暖色生活流
  - 写实文学
  - 恋爱轻喜
  rule: 共同行程按各自能承受的节奏重排，谁都能只参加其中一段、先返程或整段退出，退出不等于关系降级；回程票与住宿记录会把真实选择留下来，债务到期与签证到期各有各的死线，谁都不必为对方改掉自己的那张票。
  social_rule: 共同费用与行程事先说明并各自确认，临时增加的支出由本人认账而非自动平摊；有人想独自活动时不必给理由；陌生地方暂时不追问来处，但回程票和住宿记录会留下真实选择，谁也不替对方表态。
  places:
    深夜机场候机区:
      details:
      - 充电座旁行李靠着长椅，登机屏静静翻页·深夜
      - 广播停了之后，只剩行李轮子压过地面的声响·深夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 按机场流程去登机口或办离场手续
        - 把行李从充电座挪开，回到值机柜台重新确认行程
        witnesses:
        - 值机服务人员与候机旅客
        affordances:
        - 交换沿途手账
        - 核对改签后的登机信息
        - 在登机口前先各自离开再约下一次
        pressure_modifiers:
        - 登机广播与电量
        - 深夜班次密度与改签台排队长度
    停电民宿客厅:
      details:
      - 电池应急灯照着窗框和保温壶·停电夜
      - 应急灯的备用电池摆在窗台上按剩余量排开·停电夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从房门经应急照明楼梯回接待处或自己客房
        - 把应急灯留在客厅桌上，摸黑回房不再添亮
        witnesses:
        - 屋主与受邀住客
        affordances:
        - 画一幅窗外轮廓
        - 清点应急灯剩余电量
        - 邀请留下再住一晚
        pressure_modifiers:
        - 应急灯电量与窗外能见度
        - 停电时长与保温壶存量
    偏远小镇唯一便利店:
      details:
      - 唯一便利店的明信片架旁有热水台·晚
      - 柜台角落的地图印章盒盖被反复开合·晚
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿营业店门回镇街
        - 把没买的明信片放回架上，空手离店
        witnesses:
        - 店主
        affordances:
        - 挑选地方明信片
        - 在地图角落盖当天的小印章
        - 司机提醒即将到站前结完账
        pressure_modifiers:
        - 库存和关店时刻
        - 热水台余量与末班车时间
    最后一班渡轮:
      details:
      - 末班渡轮的舱窗映出固定岸灯·夜
      - 甲板栏杆上结着一层薄盐霜·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 先回客舱休息，靠港后走客梯离船
        - 风浪未减时留在舱内，等靠港再上甲板
        witnesses:
        - 值班船员
        affordances:
        - 共记海面灯火
        - 比较岸上定灯与随船移动的灯
        pressure_modifiers:
        - 航程长度与甲板开放状态
        - 风浪延误与靠港时刻
    回程前的空车站:
      details:
      - 少有旅客的候车长凳正对车次屏·午
      - 候车长凳上摊着刚洗出来的一叠照片·午
      profile:
        privacy: low
        visibility: high
        exits:
        - 开车前从公共出口回站前广场，登车另按检票流程
        - 把照片收回相册，改去售票口问退票手续
        witnesses:
        - 值班站员
        affordances:
        - 整理回程照片
        - 核对各自回程票的班次
        - 旅行结束前最后一晚各自确认车次
        pressure_modifiers:
        - 发车时间与检票开放
        - 剩余票量与改签窗口
    海岛度假村:
      details:
      - 椰树荫下的散步岔路接到前台·午
      - 岔路口的距离牌被日晒晒得字迹发白·午
      profile:
        privacy: low
        visibility: high
        exits:
        - 走短路返回度假村接待厅
        - 在岔路口直接取消散步，各自回房
        witnesses:
        - 园区工作人员
        affordances:
        - 试走海岸树荫线
        - 按当天体力改走前台歇脚
        pressure_modifiers:
        - 日晒与个人体力
        - 岔路标示与实际步行距离
    露营营地:
      details:
      - 营地水台旁小桌放着食材和餐具·晨
      - 水桶边沿留着前一晚结下的薄冰·晨
      profile:
        privacy: low
        visibility: medium
        exits:
        - 沿营地步道回自己的帐篷或管理处
        - 把没吃完的食材收回各自包内，不留给邻客
        witnesses:
        - 营地邻客
        affordances:
        - 做一份营地早餐
        - 清点各自的饮水余量
        pressure_modifiers:
        - 饮水余量与个人饮食偏好
        - 清晨气温与食物储存条件
    高速公路服务区:
      details:
      - 服务区休息桌边停着装满纪念品的推车·午
      - 洗手台旁贴着限时停车的提示牌·午
      profile:
        privacy: low
        visibility: high
        exits:
        - 经人行通道回停车位，不步行上高速
        - 把推车锁回后备箱，改在服务区里多留一会儿
        witnesses:
        - 同行驾驶者与服务区人员
        affordances:
        - 商量下一站与轮休
        - 重估剩余油量与到住宿点的时长
        pressure_modifiers:
        - 驾驶疲劳与剩余油量
        - 限时停车与夜间行车视野
    夜航渡轮:
      details:
      - 夜航渡轮的观景层只在固定时段开放·夜
      - 海图桌上压着一支旧航海望远镜·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 观景时段结束前从内梯回自己舱位
        - 把望远镜交还值班船员，不再留在观景层
        witnesses:
        - 值班船员与同船旅伴
        affordances:
        - 辨认岸上定灯与移动船灯
        - 轮流用望远镜看固定参照
        pressure_modifiers:
        - 夜航时段与海面能见度
        - 甲板风浪与开放限制
    山顶观星台:
      details:
      - 观星台的护栏外是没有遮挡的整片夜空·夜
      - 石阶尽头放着一张被雨水泡软的旧星图·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 沿来时的石阶下撤，不开手机灯照路
        - 在云层压下来之前收起星图原路返回
        witnesses:
        - 同行的旅伴
        affordances:
        - 对着一张旧星图找当夜的方位
        - 比较山下的灯与天上的星
        pressure_modifiers:
        - 云层厚度与夜间气温
        - 下山石阶湿滑与天亮时间
    灯塔值守屋:
      details:
      - 值守屋的窗台摆着一排没寄出的明信片·夜
      - 灯室传动带在整点会发出规律的响声·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从值守屋侧门下到岸边石阶，回到村镇路面
        - 交还值守屋钥匙，改在屋外等到天亮再走
        witnesses:
        - 交接班的守塔人
        affordances:
        - 看灯室整点转动
        - 写一张不打算寄出的明信片
        pressure_modifiers:
        - 灯室值守时段与交班时刻
        - 夜间海雾与能见距离
    私人游艇:
      details:
      - 游艇后甲板的折叠桌上摊着海图和开了一半的酒·夜
      - 缆绳在系缆柱上留着一圈没解开的余量·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 经舷梯上码头，按原路回停车处
        - 让船主把缆绳重新系紧，改在船上等到天亮
        witnesses:
        - 船主与随行的旅伴
        affordances:
        - 在海图上标出今天走过的航线
        - 核对返航用油与靠港时间
        pressure_modifiers:
        - 气象预报与返航油量
        - 码头泊位时限与夜间视线
  pairs:
  - family: 艺术与传播
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 旅行手账作者
      function: 用亲历片段整理沿途记忆
      authority: 可决定自己手账内容，不代订同行者的票
      resource: 纸笔、离线行程与简单营地食材
      limitation: 不是导游，不保证陌生地点开放
      obligation: 共用花费事先问清，私事不写进他人游记
      exposure: 美化行程会让同伴觉得被当素材
      hidden: —
    player:
      identity: 地方路线摄影师
      baseline: 你曾删去一张他不想留的照片，他邀请你一起慢看小镇
      resources:
      - 相机、备用电池和实走短路线
      reputation: 地方路线摄影师，习惯看光线也会说累
    relationship_reason: 你曾删去一张他不想留的照片，他邀请你一起慢看小镇
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 退休渡轮船员
      function: 用多年夜航习惯帮旅伴分辨岸上定灯与移动船灯
      authority: 可决定自己在甲板和观景点的停留时长，不指挥船方也不代订同伴票务
      resource: 旧航海望远镜、岸灯方位口诀与一壶自泡浓茶
      limitation: 认得当值年代的旧航道，叫不准新开的度假村渡口
      obligation: 只讲自己跑过的航路，夜里不劝任何人单独上甲板
      exposure: 把当值时的老习惯当成现行船规，会让同伴白跑一层甲板
      hidden: —
    player:
      identity: 拼假自驾的公交夜线司机
      baseline: 末班渡轮因风浪延误那晚，你听他讲完认灯口诀，便邀他搭你的车走后段山路
      resources:
      - 一辆检过胎的旧车与错峰驾驶的作息
      - 后备箱里的两箱矿泉水
      reputation: 夜线司机出身，握惯方向盘也守得住休息频率
    relationship_reason: 末班渡轮因风浪延误那晚，你听他讲完认灯口诀，便邀他搭你的车走后段山路
  - family: 服务与手艺
    position: 相亲对象
    appellations:
    - 直呼其名
    npc:
      role: 民宿屋主
      function: 在停电夜按剩余电量安排公共客厅的照明与热水
      authority: 可决定公共区域的用电顺序，不能替住客改订或退掉任何一段行程
      resource: 应急灯、备用电池、保温壶与一本记着各房入住日期的登记本
      limitation: 不懂发电设备检修，也不介入住客之间的费用分摊
      obligation: 先把公共照明的剩余亮度讲清，再让住客自己选留客厅还是回房
      exposure: 把应急灯当人情分配，会让住客在退房时拿账单说事
      hidden: —
    player:
      identity: 旅行手账作者
      baseline: 停电那晚你把半张桌子让出来，屋主邀你各画一条还看得清的屋檐
      resources:
      - 纸笔与一本记着当天开销的手账
      - 两张还没写地址的明信片
      reputation: 手账作者，算得清公共开销也不代别人认账
    relationship_reason: 你在停电夜帮着把应急灯留给公共客厅而不是自己房间，屋主因此愿意把备用电池交给你点
  activities:
    交换沿途手账:
      places:
      - 深夜机场候机区
      pairs:
      - 0
      category: 信息交换
      action: '{npc}翻到一页空白，问你愿讲一个照片里没有的停留点吗。'
      beats:
        trigger: '{npc}翻到一页空白，问你愿讲一个照片里没有的停留点吗。'
        objective: 交换一次亲历而不索取完整私人行程
        choice: 讲一个片段；不翻手账去休息；或只聊当地吃食
        immediate: 空白页可留白，想分享的片段由讲述者自己选字
        near: 下次谈起旅程有共同参照，不自动公开对方经历
    画一幅窗外轮廓:
      places:
      - 停电民宿客厅
      pairs:
      - 1
      category: 日常接触
      action: '{npc}把应急灯朝纸面偏一点，邀你各画一条还能看清的屋檐。'
      beats:
        trigger: '{npc}把应急灯朝纸面偏一点，邀你各画一条还能看清的屋檐。'
        objective: 在停电的有限光线下共享安静时间
        choice: 画一条线；不画回房休息；或轮流口述窗外形状
        immediate: 两幅不完整轮廓留下不同视角，电池灯按需调低
        near: 来电后可比较也可不补画，缺失成为当天记忆
    挑选地方明信片:
      places:
      - 偏远小镇唯一便利店
      pairs:
      - 0
      category: 日常接触
      action: '{npc}拿起两张街景卡，问哪张更像今天散步时的感觉。'
      beats:
        trigger: '{npc}拿起两张街景卡，问哪张更像今天散步时的感觉。'
        objective: 挑一件愿意留下的小纪念
        choice: 选一张自己买；不买离店；或借店主允许的样卡看看
        immediate: 选中的纪念归自己，没人为凑满套装赶路
        near: 寄给谁由买卡人日后决定，不产生回信义务
    共记海面灯火:
      places:
      - 最后一班渡轮
      pairs:
      - 1
      category: 信息交换
      action: '{npc}示意你比较窗外一盏固定灯与一盏缓慢移动的船灯。'
      beats:
        trigger: '{npc}示意你比较窗外一盏固定灯与一盏缓慢移动的船灯。'
        objective: 学会区分岸上参照和移动光点
        choice: 一起辨认；回舱座位睡觉；或只听对方说明
        immediate: 能指出一个固定参照，不把随船移动错判为灯塔移位
        near: 以后夜航可以独自欣赏方位变化，不承担导航职责
    整理回程照片:
      places:
      - 回程前的空车站
      pairs:
      - 0
      category: 日常接触
      action: '{npc}把相册停在一张模糊合景上，问想用它记住什么。'
      beats:
        trigger: '{npc}把相册停在一张模糊合景上，问想用它记住什么。'
        objective: 决定这趟旅程在各自记忆里的结尾
        choice: 选一张保留；不看相册先候车；或只说一件想忘掉的小事
        immediate: 删留由照片所有者决定，旅伴无需给旅程打分
        near: 检票后各自回程，照片不绑定下一次约会
    试走海岸树荫线:
      places:
      - 海岛度假村
      pairs:
      - 1
      category: 空间与退出
      action: '{npc}在岔路口停下，问你走树荫短线还是到前台歇脚。'
      beats:
        trigger: '{npc}在岔路口停下，问你走树荫短线还是到前台歇脚。'
        objective: 按当天体力决定散步而非完成地图
        choice: 走短线；取消散步；或各走一段在前台会合
        immediate: 曝晒长线从共同计划移出，谁都可先返程
        near: 下一次可提前按步速分开约，不以陪走衡量关系
    做一份营地早餐:
      places:
      - 露营营地
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}摆出各自现有的面包和水果，问你要不要合做两份简单早餐。'
      beats:
        trigger: '{npc}摆出各自现有的面包和水果，问你要不要合做两份简单早餐。'
        objective: 用已经带来的食材解决一顿饭
        choice: 一起准备；各吃自己的；或只帮洗餐具不共餐
        immediate: 双方按实际食量分份，剩余食材各自收回
        near: 下次知道彼此饮食偏好，无需长期轮流做饭
    商量下一站与轮休:
      places:
      - 高速公路服务区
      pairs:
      - 1
      category: 空间与退出
      action: '{npc}把相机收进包，问下一站要看景还是让驾驶者多休息。'
      beats:
        trigger: '{npc}把相机收进包，问下一站要看景还是让驾驶者多休息。'
        objective: 让驾驶疲劳真实改变停靠安排
        choice: 延长休息；退出支线各自安排后段；或跳过景点直达住宿
        immediate: 当天少一个打卡点，驾驶者在充分休息后自行决定是否继续驾驶
        near: 返程总时长更可估，错过的景点不作为人情债
    夜航观景层认灯:
      places:
      - 夜航渡轮
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}把望远镜递给你，问观景层那盏一直不动的灯是不是岸上的参照。'
      beats:
        trigger: '{npc}把望远镜递给你，问观景层那盏一直不动的灯是不是岸上的参照。'
        objective: 在观景时段内确认固定参照，不把船身晃动读成灯位移动
        choice: 用望远镜看两次；只凭肉眼判断；或回舱位不去甲板
        immediate: 确认的参照记进口诀，观景时段结束前各自回舱，不留在甲板。
        near: 下一个夜航可以自己分辨方位变化，遇风浪延误时不必等人带路。
    留在亮处定行程:
      places:
      - 灯塔值守屋
      pairs:
      - 2
      category: 第三方与打断
      action: '{npc}在整点灯室响过之后推门进来，说镇上今晚只有这里还亮着。'
      beats:
        trigger: '{npc}在整点灯室响过之后推门进来，说镇上今晚只有这里还亮着。'
        objective: 在被打断之前先把各自的回程安排说清楚
        choice: 当场把行程写在明信片上；只说大概方向；或收起纸笔等他先讲来意
        immediate: 写下的行程各留一份，谁都不替对方许诺，第二天的车次另按票据确认。
        near: 被打断过的那一晚成了共同参照，下一次约见要先讲清是否有回程票。
    山顶辨认方位:
      places:
      - 山顶观星台
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}把旧星图摊在石阶上，问你山下那串灯该算在哪一页。'
      beats:
        trigger: '{npc}把旧星图摊在石阶上，问你山下那串灯该算在哪一页。'
        objective: 分清朝向与灯火位置，不被云层和湿滑石阶拖着走
        choice: 对着星图找方位；只记一处参照；或见云厚就地折返
        immediate: 能指认一处方位就下山，不拿夜路冒险换一张完整星图。
        near: 当地灯位变成各自认路的依据，下次上山先看云层再决定停留多久。
    核对返航与泊位:
      places:
      - 私人游艇
      pairs:
      - 1
      category: 信息交换
      action: '{npc}在海图上点出今天的航线，问你返航油量和码头泊位时限还够不够。'
      beats:
        trigger: '{npc}在海图上点出今天的航线，问你返航油量和码头泊位时限还够不够。'
        objective: 把返航条件算清，而不是靠船主一句没问题就出海
        choice: 一起算返航油量；只确认泊位时限；或上岸结束今天的水上行
        immediate: 算出的余量写在海图边上，条件不足就靠港，缆绳重新系紧后不强行解缆。
        near: 下一次上船前先交换气象与油量，谁都能以条件不足为理由留在岸上。
  customs:
  - 小镇商店在地图角落盖当天的小印章，但旅人不必为了集齐而赶路。
  - 同行的两人分开活动前会各自报一个会合点，不报就当各自回程。
  - 在镇上被熟人撞见时两人不必解释关系，只按当天各自订好的行程说话。
  - 旧人回归、异地恋最后一月、协议终止前最后一夜这类事，当事人自己决定说不说，同行者不代问也不代答。
  - 债务压身时把账目分开记，回程车票只剩一张时各自排队买自己那张，流言缠身也不靠对外统一口径。
  pressures:
    返程班次取消:
      source: 预定返程班次被取消
      engines:
      - 时限逼近
      - 资源锁定
      beats:
        trigger: '{npc}收到消息：预定返程班次被取消。'
        objective: 确认替代交通与各自可接受的停留时间
        choice: 查询其他班次，或分别安排回程
        immediate: 先核实取消的是尚未搭乘的航班或列车，不把已经在航行的渡轮写成中途取消。
        near: 替代班次和住宿分别报价，能先走者可独自回去。
      far_trigger: 替代班次跨过一人的返岗时间
      far_consequence: 该人可能选择更贵的交通，费用由本人确认而不自动平摊。
      exits:
      - 办理退票后各自订返程
      - 到服务台处理改签，不再参加照片或手账活动
      bindings:
      - activity: 交换沿途手账
        place: 深夜机场候机区
        pair: 0
      - activity: 整理回程照片
        place: 回程前的空车站
        pair: 0
    住宿账单项目不明:
      source: 退房账单多了一项未说明的费用
      engines:
      - 债务压力
      - 信任透支
      beats:
        trigger: '{npc}收到消息：退房账单多了一项未说明的费用。'
        objective: 核对约定并向店家询问
        choice: 出示原订房记录，或要求分项说明
        immediate: 不明费用从共同分摊中暂列出来，先结清双方认可的住宿项目。
        near: 订房人向屋主或前台问清，同行者只承担先前同意的项目。
      far_trigger: 店家在离店后仍按原争议项目扣款
      far_consequence: 订房人需依据订单向服务方提出复核，双方共同预算可能减少。
      exits:
      - 各自结算明确费用，不继续合订住宿
      - 提交分项复核给预订平台后离店，等待处理
      bindings:
      - activity: 画一幅窗外轮廓
        place: 停电民宿客厅
        pair: 1
      - activity: 试走海岸树荫线
        place: 海岛度假村
        pair: 1
    回程票只剩一张:
      source: 售票口显示本轮只剩一张能按期返岗的回程票
      engines:
      - 名额只能给一个人
      - 情感拉扯
      beats:
        trigger: '{npc}收到消息：售票口显示本轮只剩一张能按期返岗的回程票。'
        objective: 把选择权交给当事人自己说，不用迁就换人情
        choice: 各自排队买自己那张；当场说明谁先返岗；或一起改走更晚的班次
        immediate: 票按实际凭证卖给持票人，另一个人先查住宿续住，两人都不替对方退票。
        near: 谁先走由各自返岗时间定，留下的人不必把多留几晚算成付出。
      far_trigger: 两人都拖到末班票售完仍未决定谁来买
      far_consequence: 住处与班次都要重订，费用各按本人订单结算，关系按各自回程自然分开。
      exits:
      - 各自买下自己那张并分别订后续住宿
      - 一起改签到更晚的班次，共同等下一轮放票
      bindings:
      - activity: 核对返航与泊位
        place: 私人游艇
        pair: 1
      - activity: 留在亮处定行程
        place: 灯塔值守屋
        pair: 2
    民宿停电后的第二天:
      source: 停电夜过去，应急灯只剩最后一格电池，热水也停了
      engines:
      - 共处密闭
      - 资源锁定
      beats:
        trigger: '{npc}收到消息：停电夜过去，应急灯只剩最后一格电池，热水也停了。'
        objective: 把剩下的电和热水分清，同时不把昨夜共享的安静算成欠账
        choice: 按剩余电量排公共照明；各自回房用自己那份电池；或一起找屋主问恢复时间
        immediate: 公共照明按格数分配，热水先保住宿客人的基本用量，昨夜画过的纸各自收好。
        near: 屋主公布恢复时间后各自安排白天行程，没人以昨夜作陪为由要求今天的让步。
      far_trigger: 停电再持续一天而屋主仍说不出恢复时间
      far_consequence: 住客可要求退掉剩余房晚另找住处，账单按实际入住夜数结算。
      exits:
