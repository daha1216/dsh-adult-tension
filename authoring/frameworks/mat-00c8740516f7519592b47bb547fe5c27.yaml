        immediate: 面签日写进各自的行程底稿，车次按倒推结果改订，改订费用由提出的人认账。
        near: 能赶上的人自行返程，赶不上的人改约面签，同行段到此自然结束。
      far_trigger: 车次延误导致面签当天无法到场
