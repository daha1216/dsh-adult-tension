        "hidden": "—"
      "player":
        "identity": "地方路线摄影师"
        "baseline": "你曾删去一张他不想留的照片，他邀请你一起慢看小镇"
        "resources":
          - "相机、备用电池和实走短路线"
        "reputation": "地方路线摄影师，习惯看光线也会说累"
      "relationship_reason": "你曾删去一张他不想留的照片，他邀请你一起慢看小镇"
    -
      "family": "服务与手艺"
      "position": "同侪"
      "appellations":
        - "直呼其名"
      "npc":
        "role": "退休渡轮船员"
        "function": "用多年夜航习惯帮旅伴分辨岸上定灯与移动船灯"
        "authority": "可决定自己在甲板和观景点的停留时长，不指挥船方也不代订同伴票务"
        "resource": "旧航海望远镜、岸灯方位口诀与一壶自泡浓茶"
        "limitation": "认得当值年代的旧航道，叫不准新开的度假村渡口"
        "obligation": "只讲自己跑过的航路，夜里不劝任何人单独上甲板"
        "exposure": "把当值时的老习惯当成现行船规，会让同伴白跑一层甲板"
        "hidden": "—"
      "player":
        "identity": "拼假自驾的公交夜线司机"
        "baseline": "末班渡轮因风浪延误那晚，你听他讲完认灯口诀，便邀他搭你的车走后段山路"
        "resources":
          - "一辆检过胎的旧车与错峰驾驶的作息"
          - "后备箱里的两箱矿泉水"
        "reputation": "夜线司机出身，握惯方向盘也守得住休息频率"
      "relationship_reason": "末班渡轮因风浪延误那晚，你听他讲完认灯口诀，便邀他搭你的车走后段山路"
  "activities":
    "交换沿途手账":
      "places":
        - "深夜机场候机区"
      "pairs":
        - 0
      "category": "信息交换"
      "action": "{npc}翻到一页空白，问你愿讲一个照片里没有的停留点吗。"
      "beats":
        "trigger": "{npc}翻到一页空白，问你愿讲一个照片里没有的停留点吗。"
        "objective": "交换一次亲历而不索取完整私人行程"
        "choice": "讲一个片段；不翻手账去休息；或只聊当地吃食"
        "immediate": "空白页可留白，想分享的片段由讲述者自己选字"
        "near": "下次谈起旅程有共同参照，不自动公开对方经历"
    "画一幅窗外轮廓":
      "places":
        - "停电民宿客厅"
      "pairs":
        - 1
      "category": "日常接触"
      "action": "{npc}把应急灯朝纸面偏一点，邀你各画一条还能看清的屋檐。"
      "beats":
        "trigger": "{npc}把应急灯朝纸面偏一点，邀你各画一条还能看清的屋檐。"
        "objective": "在停电的有限光线下共享安静时间"
        "choice": "画一条线；不画回房休息；或轮流口述窗外形状"
        "immediate": "两幅不完整轮廓留下不同视角，电池灯按需调低"
        "near": "来电后可比较也可不补画，缺失成为当天记忆"
    "挑选地方明信片":
      "places":
        - "偏远小镇唯一便利店"
      "pairs":
        - 0
      "category": "日常接触"
      "action": "{npc}拿起两张街景卡，问哪张更像今天散步时的感觉。"
      "beats":
        "trigger": "{npc}拿起两张街景卡，问哪张更像今天散步时的感觉。"
        "objective": "挑一件愿意留下的小纪念"
        "choice": "选一张自己买；不买离店；或借店主允许的样卡看看"
        "immediate": "选中的纪念归自己，没人为凑满套装赶路"
        "near": "寄给谁由买卡人日后决定，不产生回信义务"
    "共记海面灯火":
      "places":
        - "最后一班渡轮"
      "pairs":
        - 1
      "category": "信息交换"
      "action": "{npc}示意你比较窗外一盏固定灯与一盏缓慢移动的船灯。"
      "beats":
        "trigger": "{npc}示意你比较窗外一盏固定灯与一盏缓慢移动的船灯。"
        "objective": "学会区分岸上参照和移动光点"
        "choice": "一起辨认；回舱座位睡觉；或只听对方说明"
        "immediate": "能指出一个固定参照，不把随船移动错判为灯塔移位"
        "near": "以后夜航可以独自欣赏方位变化，不承担导航职责"
    "整理回程照片":
      "places":
        - "回程前的空车站"
      "pairs":
        - 0
      "category": "日常接触"
      "action": "{npc}把相册停在一张模糊合景上，问想用它记住什么。"
      "beats":
        "trigger": "{npc}把相册停在一张模糊合景上，问想用它记住什么。"
        "objective": "决定这趟旅程在各自记忆里的结尾"
        "choice": "选一张保留；不看相册先候车；或只说一件想忘掉的小事"
        "immediate": "删留由照片所有者决定，旅伴无需给旅程打分"
        "near": "检票后各自回程，照片不绑定下一次约会"
    "试走海岸树荫线":
      "places":
        - "海岛度假村"
      "pairs":
        - 1
      "category": "空间与退出"
      "action": "{npc}在岔路口停下，问你走树荫短线还是到前台歇脚。"
      "beats":
        "trigger": "{npc}在岔路口停下，问你走树荫短线还是到前台歇脚。"
        "objective": "按当天体力决定散步而非完成地图"
        "choice": "走短线；取消散步；或各走一段在前台会合"
        "immediate": "曝晒长线从共同计划移出，谁都可先返程"
        "near": "下一次可提前按步速分开约，不以陪走衡量关系"
    "做一份营地早餐":
      "places":
        - "露营营地"
      "pairs":
        - 0
      "category": "照护与修复"
      "action": "{npc}摆出各自现有的面包和水果，问你要不要合做两份简单早餐。"
      "beats":
        "trigger": "{npc}摆出各自现有的面包和水果，问你要不要合做两份简单早餐。"
        "objective": "用已经带来的食材解决一顿饭"
        "choice": "一起准备；各吃自己的；或只帮洗餐具不共餐"
        "immediate": "双方按实际食量分份，剩余食材各自收回"
        "near": "下次知道彼此饮食偏好，无需长期轮流做饭"
    "商量下一站与轮休":
      "places":
        - "高速公路服务区"
      "pairs":
        - 1
      "category": "空间与退出"
      "action": "{npc}把相机收进包，问下一站要看景还是让驾驶者多休息。"
      "beats":
        "trigger": "{npc}把相机收进包，问下一站要看景还是让驾驶者多休息。"
        "objective": "让驾驶疲劳真实改变停靠安排"
        "choice": "延长休息；退出支线各自安排后段；或跳过景点直达住宿"
        "immediate": "当天少一个打卡点，驾驶者在充分休息后自行决定是否继续驾驶"
        "near": "返程总时长更可估，错过的景点不作为人情债"
  "customs":
    - "小镇商店在地图角落盖当天的小印章，但旅人不必为了集齐而赶路。"
  "pressures":
    "返程班次取消":
      "source": "预定返程班次被取消"
      "engines":
        - "时限逼近"
        - "资源锁定"
      "beats":
        "trigger": "{npc}收到消息：预定返程班次被取消。"
        "objective": "确认替代交通与各自可接受的停留时间"
        "choice": "查询其他班次，或分别安排回程"
        "immediate": "先核实取消的是尚未搭乘的航班或列车，不把已经在航行的渡轮写成中途取消。"
        "near": "替代班次和住宿分别报价，能先走者可独自回去。"
      "far_trigger": "替代班次跨过一人的返岗时间"
      "far_consequence": "该人可能选择更贵的交通，费用由本人确认而不自动平摊。"
      "exits":
        - "办理退票后各自订返程"
        - "到服务台处理改签，不再参加照片或手账活动"
      "bindings":
        -
          "activity": "交换沿途手账"
          "place": "深夜机场候机区"
          "pair": 0
        -
          "activity": "整理回程照片"
          "place": "回程前的空车站"
          "pair": 0
    "住宿账单项目不明":
      "source": "退房账单多了一项未说明的费用"
      "engines":
        - "债务压力"
        - "信任透支"
      "beats":
        "trigger": "{npc}收到消息：退房账单多了一项未说明的费用。"
        "objective": "核对约定并向店家询问"
        "choice": "出示原订房记录，或要求分项说明"
        "immediate": "不明费用从共同分摊中暂列出来，先结清双方认可的住宿项目。"
        "near": "订房人向屋主或前台问清，同行者只承担先前同意的项目。"
      "far_trigger": "店家在离店后仍按原争议项目扣款"
      "far_consequence": "订房人需依据订单向服务方提出复核，双方共同预算可能减少。"
      "exits":
        - "各自结算明确费用，不继续合订住宿"
        - "提交分项复核给预订平台后离店，等待处理"
      "bindings":
        -
          "activity": "画一幅窗外轮廓"
          "place": "停电民宿客厅"
          "pair": 1
        -
          "activity": "试走海岸树荫线"
          "place": "海岛度假村"
          "pair": 1
