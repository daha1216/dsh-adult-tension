      - 不接账页也不到场，按泊位流程退出这条货线
    后座雪茄与账本缺的那一页:
      source: 车行维修位上那本交货账本摊在防弹轿车后座，缺的那一页正是上码头那晚的出货数；他点着雪茄腾不出手，司机与修车人都在车外，递烟的这一刻他问缺页记了谁的名字。
