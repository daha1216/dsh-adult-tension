      - 时限逼近
      beats:
        trigger: '{npc}打开冰匣时发现最后一支血清已经温热，伤口那边还在等着这一针。'
        objective: 在药性彻底失效前决定这一针给谁打，或者承认谁也打不上
        choice: 可把最后一针给伤最重的那一个，剩下的人按物理降温硬扛；可拆开两支分给两人各一半，赌半剂也能压住；也可以谁都不动，先把人送去相熟医生那里重开方子
        immediate: 冰水当场倒掉，空匣子交还给带药的船，谁打了这一针要在当夜货位簿的背面记一笔
        near: 分掉半剂的人两天内会重新烧起来，码头这边下一趟船至少要等一周
      far_trigger: 下一趟船带药前又有人在同一处伤口上倒下
      far_consequence: 做过分药决定的人要自己扛下这个顺序，往后同一批人里谁先谁后都会被拿来问他
      bindings:
      - activity: 陪码头工人歇一班
        place: 密歇根湖畔私酒卸货码头
        pair: 0
      exits:
      - 把空药匣交还带药的人，按码头班次安排各自休息
      - 不再决定用药顺序，把人交给相熟医生自己退开
    破晓第一缕晨光落在末版上:
      source: 末版必须在天亮前印完，而清晨的第一班巡警会在同一时刻沿这条街挨家查门。
      engines:
      - 时限逼近
