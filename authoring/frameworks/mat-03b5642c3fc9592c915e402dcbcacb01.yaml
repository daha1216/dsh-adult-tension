        objective: 在清样上机器之前决定这段要不要留
        choice: 可请记者把转述改成实名并当面记一次；可只要求把这一段挪出头条、内容照旧；也可以什么都不说，让报纸自己承担
        immediate: 清样还在台子上，改一段就要重排一版，谁改的排字工当晚就会被人记住
