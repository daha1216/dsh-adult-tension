      - activity: 在查获清单上读出对照名字
        place: 湖上巡警扣押泊位
        pair: 2
      exits:
      - 在清单前把当夜交接说清并请值岗巡警留档
      - 不解释也不更正，直接沿湖岸步道离开泊位
    采访提纲提前泄露:
      source: 次日要用的采访提纲被人从报馆清样里抄走，落到了一个正准备拿它去谈价的人手里。
      engines:
