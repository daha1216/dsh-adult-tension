id: "mat-03b5642c3fc9592c915e402dcbcacb01"
name: "禁酒期爵士与报纸"
material:
  eras:
    - "一九二八芝加哥禁酒期"
  aesthetics:
    - "禁酒令爵士黑帮"
    - "芝加哥暗夜交锋"
    - "黑色电影"
  rule: "爵士演出、码头工人和地方报纸共享街区，人们在监管与谋生之间寻找空间。"
  social_rule: "采访和演出都需要本人同意，传闻不能直接充当指控。"
  places:
    理发店暗门后地下酒吧:
      details:
        - "理发店暗门后通往尚未开场的地下舞台"
        - "钢琴旁的谱架被反复改调，来客须经店方允许"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "从店方确认可用的楼梯回理发店前厅离开"
        witnesses:
          - "排练乐手与当班领班"
        affordances:
          - "试合一段旧曲"
          - "轮换领奏与伴奏"
        pressure_modifiers:
          - "乐手可排练时长"
          - "场地方是否允许开门"
    密歇根湖畔私酒卸货码头:
      details:
        - "湖风吹过卸货码头休息棚"
        - "普通工人的热咖啡壶放在远离吊货范围的长凳边"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "沿岸侧人行道离开，不穿过装卸吊臂"
        witnesses:
          - "休班码头工人"
        affordances:
          - "陪码头工人歇一班"
          - "在休息棚喝咖啡听短故事"
        pressure_modifiers:
          - "换班钟点"
          - "受访者是否愿意谈工作"
    黑帮教父防弹老爷车:
      details:
        - "当时仍在使用的防护轿车停在车行维修位"
        - "厚车门旁放着修车人获准展示的铰链旧件"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "车辆停稳时从车行步行门离开，不随车出发"
        witnesses:
          - "受雇修车人与司机"
        affordances:
          - "辨认轿车修补痕"
          - "比较照片与获准展示的旧件"
        pressure_modifiers:
          - "车主允许展示的部位"
          - "司机接车时间"
  pairs:
    -
      family: "艺术与传播"
      position: "同侪"
      appellations:
        - "先生"
      npc:
        role: "地方记者"
        function: "采访街区劳动与演出，区分观察和转述"
        authority: "能选择自己提交的稿件，刊发和标题由编辑决定"
        resource: "纸质采访笔记、报馆电话与剪报"
        limitation: "不能保证报纸照单刊登，更无权替警方作结论"
        obligation: "引用前确认原意，不把休息聊天默认写成采访"
        exposure: "失实引语会断掉下次受访渠道"
      player:
        identity: "爵士乐谱整理人"
        baseline: "你听得出一段旋律的留白，想让记者知道台下休息也是生活的一部分。"
        resources:
          - "获得使用许可的分谱"
          - "节拍练习经验"
        reputation: "肯把独奏位置让给真正熟曲的人"
      relationship_reason: "记者上次把乐手的即兴改段写成抄错，谱师耐心带他听完第二遍；两人后来约在排练时重试这段曲子。"
    -
      family: "艺术与传播"
      position: "同侪"
      appellations:
        - "先生"
      npc:
        role: "爵士乐谱整理人"
        function: "整理手写分谱并协助乐手试调"
        authority: "可改自己的誊写稿，演出曲目仍由领奏决定"
        resource: "乐手允许使用的旧分谱与钢琴排练时段"
        limitation: "不能替全团接演出，也不是码头工序或汽车结构专家"
        obligation: "标清他人旋律出处，改调后让演奏者试过"
        exposure: "抄错分谱会耽误有工钱的排练"
      player:
        identity: "地方记者"
        baseline: "你会记笔记，也愿意在别人休息时合上本子，不要求每次见面都产生报道。"
        resources:
          - "采访本与铅笔"
          - "约好使用的报馆电话"
        reputation: "会把听错的句子当面改正"
      relationship_reason: "谱师曾请记者帮忙归还码头工人遗落的谱夹；如今两人认识休息棚的人，能不带采访任务地坐一会。"
  activities:
    试合一段旧曲:
      places:
        - "理发店暗门后地下酒吧"
      pairs:
        - 1
      category: "信息交换"
      action: "{npc}把旧曲的两种结尾弹给你听，邀请你用拍手试着留出伴奏空隙。"
      beats:
        trigger: "{npc}把旧曲的两种结尾弹给你听，邀请你用拍手试着留出伴奏空隙。"
        objective: "听懂领奏与伴奏如何轮换"
        choice: "可拍一轮节奏、只听两版；不想排练就回前厅等候"
        immediate: "抢拍会盖住结尾，留空则让领奏接上，两人据声音调整"
        near: "下次可以带来一首自己想听的曲子，不承诺上台演出"
    陪码头工人歇一班:
      places:
        - "密歇根湖畔私酒卸货码头"
      pairs:
        - 0
      category: "日常接触"
      action: "{npc}合上采访本，问你要不要和休班工人一起喝完这壶咖啡。"
      beats:
        trigger: "{npc}合上采访本，问你要不要和休班工人一起喝完这壶咖啡。"
        objective: "给一段不以产出新闻为目标的休息留空间"
        choice: "可闲聊天气、安静喝咖啡；工人不想说话就各自休息"
        immediate: "不做采访意味着故事不进稿件，参与者可以只分享自己的近况"
        near: "熟悉感来自下次见面能打招呼，不形成提供线索的义务"
    辨认轿车修补痕:
      places:
        - "黑帮教父防弹老爷车"
      pairs:
        - 0
      category: "调查与核验"
      action: "{npc}请在场修车人指出旧铰链更换前后的区别，再问你照片里哪处真能看清。"
      beats:
        trigger: "{npc}请在场修车人指出旧铰链更换前后的区别，再问你照片里哪处真能看清。"
        objective: "分开可见维修痕迹与对车辆来历的猜测"
        choice: "可比较已获准照片、只听修车人解释，或不看车内直接离开"
        immediate: "只能确认展示部件的磨损，不能由车主身份推断每处凹痕的原因"
        near: "需要报道时另征采访许可，当前观察不提供行车路线或犯罪结论"
  customs:
    - "乐手会在节目单边上记一首观众点过却尚未演的曲子。"
  pressures:
    演出报道被断章引用:
      source: "排练乐手拿来的报纸把谈即兴的原话截成了贬低同伴的句子。"
      engines:
        - "名声保卫"
        - "信任透支"
      beats:
        trigger: "{npc}发现排练乐手拿来的报纸把谈即兴的原话截成了贬低同伴的句子。"
        objective: "让当事人选择如何补回原意，不强求公开对质"
        choice: "请记者带原笔记向编辑申请更正；或先让乐手私下解释并暂不再受访"
        immediate: "谱师暂不把争议句印上节目单，排练仍可只谈音乐"
        near: "报纸更正要等版面，乐手可决定是否出席下一次采访"
      far_trigger: "下一场合奏前同伴仍只看到截断引语"
      far_consequence: "乐团可能不再互给独奏空间，私下澄清也可能先于纸报恢复合作"
      bindings:
        -
          activity: "试合一段旧曲"
          place: "理发店暗门后地下酒吧"
          pair: 1
      exits:
        - "退出后续采访，只按已约定的音乐工作合作"
        - "将更正请求交记者与编辑，其他乐手结束讨论回排练"
    街区演出场地停用:
      source: "领班告知地下舞台当前不能向观众开放，原订场次需另安排。"
      engines:
        - "资源锁定"
        - "债务压力"
      beats:
        trigger: "{npc}发现领班告知地下舞台当前不能向观众开放，原订场次需另安排。"
        objective: "保住乐手工钱与观众退票路径，不把场所背景写成自动通行许可"
        choice: "联系无酒精演出的合规场地；或取消场次，由收款方退票"
        immediate: "排练只进行到店方许可时间，乐手取走自己的谱与乐器"
        near: "另租场地增加成本，取消则需结清已做排练，谱师无权替全团答应"
      far_trigger: "结算周仍要求乐手免费补演抵消场租"
      far_consequence: "乐手可能离团找其他工作；明确工钱与另谈补演可保住下一站阵容"
      bindings:
        -
          activity: "试合一段旧曲"
          place: "理发店暗门后地下酒吧"
          pair: 1
      exits:
        - "取消本次演出并按收款关系退款结算"
        - "乐手拒绝免费补演，取走个人器物离场"
  legacy_sources:
    eras:
      - "一九二八芝加哥禁酒期"
    aesthetics:
      - "禁酒令爵士黑帮"
      - "芝加哥暗夜交锋"
      - "黑色电影"
    places:
      - "理发店暗门后地下酒吧"
      - "密歇根湖畔私酒卸货码头"
      - "黑帮教父防弹老爷车"
  themes:
    - "爵士合奏中给别人留空间"
    - "禁酒年代普通劳动者的休息"
    - "记者笔下名声与本人意图"
  technology_boundary: "1928年芝加哥使用电话、纸报、打字机、唱片和照片；没有便携磁带录音、即时发布或现代复古车展。地点名中的老爷车指当时仍使用的加装防护轿车，修车人与司机称其为轿车，改装不等于无敌。"
  bridge_status: "not_required"
