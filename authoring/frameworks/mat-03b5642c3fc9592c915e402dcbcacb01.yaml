        objective: 在提纲上了别人的价码桌之前找出它从谁手里出去的
        choice: 可把昨夜留过夜的人逐一并排比对；可只把换版办法先定下来，让提纲内容当天失效；也可以不查，直接放弃这一期
        immediate: 清样收进抽屉，废纸筐里的作废校样被翻过一遍，问过话的人第二天都会知道被问过
        near: 提纲作废就等于这一期的采访全空，报馆的版面缺口要另找人补，补上的人会顺着这条线找回来
      far_trigger: 提纲内容在别家报纸先登，署名却不是原采访者
      far_consequence: 原采访者失去这条线，报馆夜班里从此多出一个不能交出清样的人
      bindings:
      - activity: 把手写引语并排比对末版清样
        place: 报馆夜班排字房
        pair: 1
      exits:
