      beats:
        trigger: '{npc}发现窗外街面已经泛白，排字房里还有一整段没排，巡警的查门从街口开始了。'
        objective: 在印完与不留痕之间选一个先后
        choice: 可先把这一版印完再收摊；可把还没排的段落整段撤下，天亮后再补；也可以现在就把灯熄了，让这一夜算作没发生过
        immediate: 装版台上的清样要么进机器要么进废纸筐，侧梯的门锁着，脚步声从街口一间一间过来
        near: 撤掉的段落要在下一版补回来，补的时候别人会问起昨夜这盏灯为什么亮到最后
      far_trigger: 查门的人在废纸筐里翻到未印的段落
