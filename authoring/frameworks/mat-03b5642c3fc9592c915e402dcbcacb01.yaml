id: mat-03b5642c3fc9592c915e402dcbcacb01
name: 禁酒期爵士与报纸
material:
  eras:
  - 一九二八芝加哥禁酒期
  aesthetics:
  - 禁酒令爵士黑帮
  - 芝加哥暗夜交锋
  - 黑色电影
  rule: 爵士演出、码头工人和地方报纸共享街区，人们在监管与谋生之间寻找空间。湖畔码头、理发店暗门与报馆夜班共用一套暗号与交接手势，暗号连报三次错误即由码头管事按当夜名单带走送交湖上巡警，不再返回原班；私酒库房看绿灯行事，灯灭三十秒内未排空则整套货品、账页与经手人名一起落到查获清单上。
  social_rule: 采访和演出都需要本人同意，传闻不能直接充当指控。当场付现是唯一通行凭证，赊账、口头担保与人情垫付一律不被受理，欠款按周计息并登记在经手人名下，警方与帮派都只认现金与登记簿上的那个名字。
  places:
    理发店暗门后地下酒吧:
      details:
      - 理发店暗门后通往尚未开场的地下舞台
      - 钢琴旁的谱架被反复改调，来客须经店方允许
      - 暗号板挂在门内侧，连报三次错误的客人被请回前厅
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从店方确认可用的楼梯回理发店前厅离开
        witnesses:
        - 排练乐手与当班领班
        affordances:
        - 试合一段旧曲
        - 轮换领奏与伴奏
        - 核对当夜暗号与开门时段
        pressure_modifiers:
        - 乐手可排练时长
        - 场地方是否允许开门
        - 暗号是否已换过一轮
    密歇根湖畔私酒卸货码头:
      details:
      - 湖风吹过卸货码头休息棚
      - 普通工人的热咖啡壶放在远离吊货范围的长凳边
      - 库房门内侧挂着只亮绿灯的排空信号
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿岸侧人行道离开，不穿过装卸吊臂
        witnesses:
        - 休班码头工人
        affordances:
        - 陪码头工人歇一班
        - 在休息棚喝咖啡听短故事
        - 跟着绿灯核一遍当夜货位
        pressure_modifiers:
        - 换班钟点
        - 受访者是否愿意谈工作
        - 绿灯何时熄灭
    黑帮教父防弹老爷车:
      details:
      - 当时仍在使用的防护轿车停在车行维修位
      - 厚车门旁放着修车人获准展示的铰链旧件
      - 后座夹层里锁着当夜要审的账页副本
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 车辆停稳时从车行步行门离开，不随车出发
        witnesses:
        - 受雇修车人与司机
        affordances:
        - 辨认轿车修补痕
        - 比较照片与获准展示的旧件
        - 核对夹层里的账页副本
        pressure_modifiers:
        - 车主允许展示的部位
        - 司机接车时间
        - 司机的行程记忆
    报馆夜班排字房:
      details:
      - 凌晨的排字房只留两盏罩灯，铅字盘按末版顺序摆开
      - 当日清样叠在装版台角，未付印的段落另放一边
      - 废纸筐里的作废校样要到天亮才统一处理
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从装版台后的侧梯下到街面后巷，不带出未印清样
        witnesses:
        - 同班排字工与守夜校样
        affordances:
        - 核对一段引语是否照原话排出
        - 把作废校样单独收进废纸筐
        - 比对末版与早版的名次
        pressure_modifiers:
        - 末版截稿钟点
        - 当晚在场谁能看到清样
        - 废纸筐是否已被翻动
    湖上巡警扣押泊位:
      details:
      - 湖岸线外侧的巡逻船泊位设有没收货品的临时堆放区
      - 当日查获清单钉在泊位办公室外墙，署名一栏并不写全
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿湖岸步道退到码头外栅栏，不靠近扣押船身
        witnesses:
        - 值岗巡警与送交货物的码头管事
        affordances:
        - 读当日查获清单的署名
        - 辨认送交货物的经手人
        pressure_modifiers:
        - 清单挂出的钟点
        - 管事是否在场交接
  pairs:
  - family: 艺术与传播
    position: 同侪
    appellations:
    - 先生
    npc:
      role: 地方记者
      function: 采访街区劳动与演出，区分观察和转述
      authority: 能选择自己提交的稿件，刊发和标题由编辑决定
      resource: 纸质采访笔记、报馆电话与剪报
      limitation: 不能保证报纸照单刊登，更无权替警方作结论
      obligation: 引用前确认原意，不把休息聊天默认写成采访
      exposure: 失实引语会断掉下次受访渠道
    player:
      identity: 爵士乐谱整理人
      baseline: 你听得出一段旋律的留白，想让记者知道台下休息也是生活的一部分。
      resources:
      - 获得使用许可的分谱
      - 节拍练习经验
      reputation: 肯把独奏位置让给真正熟曲的人
    relationship_reason: 记者上次把乐手的即兴改段写成抄错，谱师耐心带他听完第二遍；两人后来约在排练时重试这段曲子。
  - family: 艺术与传播
    position: 同侪
    appellations:
    - 先生
    npc:
      role: 爵士乐队誊谱师
      function: 誊清乐手改动的段落并陪试两种结尾
      authority: 可改自己誊清的谱页，演哪一版由领奏当场定
      resource: 誊谱钢笔、琴房后门的备用钥匙与一册写满换气记号的范本
      limitation: 无权替店方开门迎客，也不能替乐手答应下一场
      obligation: 乐手没当场试过的改段不誊进正式谱夹
      exposure: 誊错一处换气记号，整段就得停下重排
    player:
      identity: 报馆夜班排字工
      baseline: 大雪封街那晚你排完末版绕路琴房，他添炉留你听完一段；此后你的歇班日成了排练的旁听席。
      resources:
      - 排字工的午歇时段
      - 缝补过的袖套与一小袋炒栗子
      reputation: 认得出倒字，也等得起慢板
    relationship_reason: 大雪封街那晚你排完末版绕路琴房，他添炉留你听完一段；此后你的歇班日成了排练的旁听席。
  - family: 地下与灰色地带
    position: 旧识
    appellations:
    - 老板
    npc:
      role: 私酒库房管库人兼码头交货经手
      function: 按绿灯信号放货、记货位，并在查获时交出当晚经手名单
      authority: 可决定这一夜放哪一柜货，不能改查获清单上的署名规则
      resource: 当夜货位簿、库房钥匙与一套只在本船间通用的暗号手势
      limitation: 报警和扣押流程不由他停止，他只能选择先报谁的名字
      obligation: 绿灯熄灭三十秒内必须把该柜排空，否则账页与他自己的名字一起交出去
      exposure: 一旦署名落到查获清单上，下一趟船不会再来找他
    player:
      identity: 报馆夜班排字工
      baseline: 你替报馆排过查获清单的死信，认得那栏署名留白的写法，也知道被写上名字的人后来去了哪里。
      resources:
      - 排字房夜里能留人的角落与一副干净袖套
      - 几份过期的查获清单抄件
      reputation: 认得出倒字，也守得住一张嘴
    relationship_reason: 你排过他那条被查获的货，发现清单上的署名栏是空的，你私下还了他一份抄件；此后他交货前会绕到报馆后巷看一眼灯还亮不亮。
  activities:
    试合一段旧曲:
      places:
      - 理发店暗门后地下酒吧
      pairs:
      - 1
      category: 信息交换
      action: '{npc}把旧曲的两种结尾弹给你听，邀请你用拍手试着留出伴奏空隙。'
      beats:
        trigger: '{npc}把旧曲的两种结尾弹给你听，邀请你用拍手试着留出伴奏空隙。'
        objective: 听懂领奏与伴奏如何轮换
        choice: 可拍一轮节奏、只听两版；不想排练就回前厅等候
        immediate: 抢拍会盖住结尾，留空则让领奏接上，两人据声音调整
        near: 下次可以带来一首自己想听的曲子，不承诺上台演出
    陪码头工人歇一班:
      places:
      - 密歇根湖畔私酒卸货码头
      pairs:
      - 0
      category: 日常接触
      action: '{npc}合上采访本，问你要不要和休班工人一起喝完这壶咖啡。'
      beats:
        trigger: '{npc}合上采访本，问你要不要和休班工人一起喝完这壶咖啡。'
        objective: 给一段不以产出新闻为目标的休息留空间
        choice: 可闲聊天气、安静喝咖啡；工人不想说话就各自休息
        immediate: 不做采访意味着故事不进稿件，参与者可以只分享自己的近况
        near: 熟悉感来自下次见面能打招呼，不形成提供线索的义务
    辨认轿车修补痕:
      places:
      - 黑帮教父防弹老爷车
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}请在场修车人指出旧铰链更换前后的区别，再问你照片里哪处真能看清。'
      beats:
        trigger: '{npc}请在场修车人指出旧铰链更换前后的区别，再问你照片里哪处真能看清。'
        objective: 分开可见维修痕迹与对车辆来历的猜测
        choice: 可比较已获准照片、只听修车人解释，或不看车内直接离开
        immediate: 只能确认展示部件的磨损，不能由车主身份推断每处凹痕的原因
        near: 需要报道时另征采访许可，当前观察不提供行车路线或犯罪结论
    对着绿灯核一遍当夜货位:
      places:
      - 密歇根湖畔私酒卸货码头
      pairs:
      - 2
      category: 调查与核验
      action: '{npc}把货位簿摊在休息棚长凳上，让你对一遍今晚哪几柜按绿灯走。'
      beats:
        trigger: '{npc}把货位簿摊在休息棚长凳上，让你对一遍今晚哪几柜按绿灯走。'
        objective: 在灯灭前记住哪一柜要最先排空
        choice: 可核完再走；也可只记柜号不碰簿子；或直接回宿舍不接这一夜
        immediate: 核过的柜号单独折角，簿子当场收回他怀里，不到换班不进别人的手
        near: 你知道哪一柜最急，但簿子上的名字始终只写经手人一个
    按暗号连报三次开门:
      places:
      - 理发店暗门后地下酒吧
      pairs:
      - 2
      category: 空间与退出
      action: '{npc}按住暗门，要你把当夜暗号按顺序报三遍，错一遍就不开。'
      beats:
        trigger: '{npc}按住暗门，要你把当夜暗号按顺序报三遍，错一遍就不开。'
        objective: 在不报错的前提下决定今晚进不进去
        choice: 可照暗号报满三遍；可承认记不全请他从后巷接；也可以今晚就站在门外
        immediate: 报错一次门不开，报满三遍才让过，进门前他要先看清你身后有没有人跟
        near: 暗号一轮一换，今晚记住了不等于下周还能进这扇门
    把手写引语并排比对末版清样:
      places:
      - 报馆夜班排字房
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}把采访笔记压在清样旁边，问你排出的这句和原话差在哪里。'
      beats:
        trigger: '{npc}把采访笔记压在清样旁边，问你排出的这句和原话差在哪里。'
        objective: 在被截断的引语印出去之前找出改动的那半句
        choice: 可逐字并排比对；可只标出可疑处交他自己决定；也可以天亮再说
        immediate: 可疑段落从末版抽下单独放，作废校样照旧进废纸筐，不改动别人的署名段落
        near: 截稿钟点不等人，改与不改都要在印前定，改晚了只剩下一版更正
    在查获清单上读出对照名字:
      places:
      - 湖上巡警扣押泊位
      pairs:
      - 2
      category: 第三方与打断
      action: '{npc}指着泊位外墙上新钉的查获清单，让你读出经手人那一栏填了什么。'
      beats:
        trigger: '{npc}指着泊位外墙上新钉的查获清单，让你读出经手人那一栏填了什么。'
        objective: 看清名单上写的是谁，再决定这一趟要不要替他说话
        choice: 可当众读完那栏；可只看不说先记下来；也可以转身走开不认这份交情
        immediate: 读出口的瞬间你也进了值岗巡警的视野，管事站在旁边等你接不接这句话
        near: 名字一旦念出来就传得快，下一趟船靠岸前全码头都会知道谁替谁说了话
    替她把雪茄递到唇边:
      places:
      - 黑帮教父防弹老爷车
      pairs:
      - 2
      category: 日常接触
      action: '{npc}在车行维修位点着一支雪茄，抬手示意你送到他唇边，自己腾不出双手。'
      beats:
        trigger: '{npc}在车行维修位点着一支雪茄，抬手示意你送到他唇边，自己腾不出双手。'
        objective: 在不越界的前提下接住这份刻意的亲近
        choice: 可递到唇边再接回；可把雪茄放在车门旧件上看他自己拿；也可以说手不稳不接
        immediate: 递与不递他都记在心里，车门旁还站着受雇修车人与司机两个见证
        near: 这一次接住了，下一趟有些话就会先对你说，而不是先记账
  customs:
  - 乐手会在节目单边上记一首观众点过却尚未演的曲子。
  - 码头交接前先对一遍当夜暗号，暗号不对不谈货。
  - 报馆夜班的作废校样要到天亮才统一处理，谁都不许提前翻废纸筐。
  pressures:
    演出报道被断章引用:
      source: 排练乐手拿来的报纸把谈即兴的原话截成了贬低同伴的句子。
      engines:
      - 名声保卫
      - 信任透支
      beats:
        trigger: '{npc}发现排练乐手拿来的报纸把谈即兴的原话截成了贬低同伴的句子。'
        objective: 让当事人选择如何补回原意，不强求公开对质
        choice: 请记者带原笔记向编辑申请更正；或先让乐手私下解释并暂不再受访
        immediate: 谱师暂不把争议句印上节目单，排练仍可只谈音乐
        near: 报纸更正要等版面，乐手可决定是否出席下一次采访
      far_trigger: 下一场合奏前同伴仍只看到截断引语
      far_consequence: 乐团可能不再互给独奏空间，私下澄清也可能先于纸报恢复合作
      bindings:
      - activity: 试合一段旧曲
        place: 理发店暗门后地下酒吧
        pair: 1
      exits:
      - 退出后续采访，只按已约定的音乐工作合作
      - 将更正请求交记者与编辑，其他乐手结束讨论回排练
    街区演出场地停用:
      source: 领班告知地下舞台当前不能向观众开放，原订场次需另安排。
      engines:
      - 资源锁定
      - 债务压力
      beats:
        trigger: '{npc}发现领班告知地下舞台当前不能向观众开放，原订场次需另安排。'
        objective: 保住乐手工钱与观众退票路径，不把场所背景写成自动通行许可
        choice: 联系无酒精演出的合规场地；或取消场次，由收款方退票
        immediate: 排练只进行到店方许可时间，乐手取走自己的谱与乐器
        near: 另租场地增加成本，取消则需结清已做排练，谱师无权替全团答应
      far_trigger: 结算周仍要求乐手免费补演抵消场租
      far_consequence: 乐手可能离团找其他工作；明确工钱与另谈补演可保住下一站阵容
      bindings:
      - activity: 试合一段旧曲
        place: 理发店暗门后地下酒吧
        pair: 1
      exits:
      - 取消本次演出并按收款关系退款结算
      - 乐手拒绝免费补演，取走个人器物离场
    两千箱货在湖上被同行截走:
      source: 同行的船在湖心把当晚该靠岸的货连船带账一起截走，交货时限只剩到天亮的换班钟。
      engines:
      - 资源锁定
      - 时限逼近
      beats:
        trigger: '{npc}从泊位打来电话：湖心那一船货连账页一起被人截走，天亮换班前交不出来。'
        objective: 在换班钟响前决定补齐还是认下这一船缺口
        choice: 可先按绿灯序号把库里剩的柜子调出来顶账；可只补一部分并当场说明缺口归谁；也可以让这一趟认赔，等下一船重排货位
        immediate: 货位簿当场重新折角，被顶出去的那一柜不再挂回原号，谁签的字就记在谁名下
        near: 截货的那一方会在两天内放出风声抬价，经手人这一栏若写成经手人自己，下一趟就没人再替他押船
      far_trigger: 三天后同一批货在黑市换了名字重新出现
      far_consequence: 码头管事要按当夜登记的名字追一笔复利账，愿意补一半的人可以换到延期，没补的人从此上不了这条船
      bindings:
      - activity: 对着绿灯核一遍当夜货位
        place: 密歇根湖畔私酒卸货码头
        pair: 2
      exits:
      - 按绿灯序号补出能补的部分，其余缺口当场写明经手人
      - 不接这一趟的顶账安排，交回货位簿走岸侧人行道离场
    伤口发炎引出的高烧夜:
      source: 上一趟在甲板上落的刀伤已经发炎，体温一夜高过一夜，而巡警的查获清单正等着一个签名。
      engines:
      - 伤病互护
      - 身份风险
      beats:
        trigger: '{npc}的伤口肿到握不住货位簿，说话开始错行，泊位外的查获清单已经钉上墙了。'
        objective: 在有人发现病历之前把人藏住并把这一夜的货交代完
        choice: 可留在库房里替他按绿灯放完今晚的柜子；可只把人送到相熟医生那里再把簿子交给接班的人；也可以天亮前把他送出湖岸，剩下的事不再过问
        immediate: 发烧的人离开岗位就得有人替他在当夜暗号上署名，货位簿不能空着，替签的人从此挂在这条货线上
        near: 查获清单每两天重钉一次，病中的人只要再被提起一次，报馆的夜班就会多排一行别人的名字
      far_trigger: 查获清单第二次挂出仍然带着同一个署名
      far_consequence: 替他签名的人要么接下整条货线，要么在泊位上被同行当成新的话事人；烧退的人则要靠一笔复利账换回自己的名字
      bindings:
      - activity: 对着绿灯核一遍当夜货位
        place: 密歇根湖畔私酒卸货码头
        pair: 2
      exits:
      - 把货位簿交回库房并送他就医，今夜不再接货
      - 当夜不再露面，按泊位流程把自己从这趟船的名册上退出
    名声被查获清单挂上泊位外墙:
      source: 泊位外墙的查获清单第一次把经手人的全名钉了出来，本地报纸当晚会抄走这一栏。
