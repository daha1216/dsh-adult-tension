        choice: 可把报馆那一班辞掉，从此只走货线；可把库房的名字换成别人的、自己退到只认暗号不进簿子；也可以两边都留着，先编一个过得去的说法应付过去
        immediate: 无论选哪一边，另一方当天就能感到这个人变了，问过话的同班会在排字房里多看他几眼
        near: 两边都留的人要靠一次次圆谎撑下去，撑不住的第一次就会是最后一次
      far_trigger: 报馆同班与码头管事在同一个钟点出现在同一条街上
      far_consequence: 被对上的人要么彻底换名换街，要么按被记下的那个名字接下两边的账
      bindings:
