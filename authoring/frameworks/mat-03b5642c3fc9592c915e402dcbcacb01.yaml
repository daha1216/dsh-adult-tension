        choice: 可当众在清单前把当夜交接重述一遍；可只把交接时辰写在纸上交值岗巡警留档；也可以名字照旧不解释，等报纸抄完再说
        immediate: 在场的人各自记住了你说没说过这句话，泊位办公室的留档改不了，但报纸那一栏还来得及空着
        near: 认下这个名字就得从此按全名接货；改口的人下一趟要靠别人代署，代署的人会在名单上留印
      far_trigger: 下一期报纸的未出版清样里出现同一栏名字
      far_consequence: 名字一旦印出去，报馆那条街上的老主顾会先断掉联络，赎回自己的名字需要另一条更贵的路
