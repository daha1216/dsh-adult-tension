        immediate: 收与不收都只争到几分钟，敲到这一间时谁站在门后是唯一还能定的事
        near: 查门的人会记住这一间开过几扇门，往后这条街上的熟人都会按那次的情形待他们
      far_trigger: 下一次查门时邻屋的人主动提起这一间
