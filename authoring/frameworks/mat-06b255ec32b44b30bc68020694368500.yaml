        choice: 可按行规双签后入柜；可在「底片归客」那栏交袋出柜，或当着两个人的面拆开重封
        immediate: 袋子封上，卷就归了持袋人——柜里多一格或手上多一袋，都在这一按之间
        near: 双签的袋子按卷号入柜，登记簿各记一行；交出去的那袋，往后加不加洗都由不得按快门的人
