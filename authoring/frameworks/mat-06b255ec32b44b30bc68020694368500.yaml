id: mat-06b255ec32b44b30bc68020694368500
name: 私房写真与底片归属
material:
  eras:
  - 当代都市
  aesthetics:
  - 克制冷峻
  - 旧年代质感
  - 黑色电影
  rule: 快门是合意的——私房写真按一卷一约成交：委托单四栏（用途、张数、加洗与否、底片归谁）谈清才开灯；胶片拍完当场封袋、袋上双签，封袋之后底片全归持袋人——「底片归客」勾了，袋子就得交出去，交出底片等于交出定价权。显影必须主人在场，看到底片之前谁也无权先洗，包括按快门的人；「不再加洗」是本行最重的承诺，底片在谁手里，这句承诺就由谁说了算。烧掉即绝版，烧卷须双人在场、灰烬入袋；名册只记花名与卷号，花名永不与真名同页。这套规矩与打赏榜那一类的付费墙相反——那边价目全公开、争的是记录之外的兑现，这里价目从来不是争点，钱在委托单上一次结清，争的是那卷唯一的东西躺进谁的柜子、这段形象归谁定价；与「谁先看到材料归谁讲」的行当也不同——底片不是材料，是两个人共同拍下、只打算彼此看见的东西，先看到不解决任何问题（谁先看到都得等显影），归属条款才是全部；与偷拍登报的那一路更相反——被拍的人自己站进帘内、自己点头开灯，快门之前没有争议，张力全在快门之后。片场棚与月份牌争的是署名与番位——镜头前的名分；动捕棚争的是皮套与账号——套在身上的公司资产；这里私房卷本来就没有署名，底片上就是她本人的脸，争的是快门之后本人形象的归属，无番位、无中之人、无继承换人。
  social_rule: 这个圈子认卷号不认名字——花名、卷号、指纹封袋是全部凭证；拍过的人街头相遇不点头，认出来也不算认识。「他拍过我」这句话说出口，说话的人自己先掉价——所以把柄从不兑现，存在就是全部；同行相见只问「你的柜子锁得好不好」，不问「你柜子里有谁」。模特可以要求看样、烧片、买断，但「买断之后反悔」没有行规可依——烧了的卷才是干净的卷。
  places:
    临街样片橱窗与接待卡座:
      details:
      - 橱窗里只挂风光与静物，人像一张不挂，玻璃上贴着一排冲印价目·日间
      - 卡座桌上永远摊着空白委托单，胶带压着四角，谁进来谁先看单子·傍晚
      profile:
        privacy: low
        visibility: medium
        exits:
        - 推门就是巷子，看完价目不进去坐，也没人追问
        witnesses:
        - 坐卡座等样的老客
        - 进来问价的生客
        affordances:
        - 橱窗前接待一位生客
        - 在空白委托单上先看懂那四栏
        pressure_modifiers:
        - 今日卡座上坐了几张生面孔
        - 橱窗里还挂着几张样片
    棚灯白幕影棚:
      details:
      - 灯架、白幕、反光板各归各位，工作日常态有三个人在场·日间
      - 谁的影子投到白幕上，帘内的人隔着帘也数得清·午后
      profile:
        privacy: low
        visibility: medium
        exits:
        - 影棚侧门直通一层后过道，出来正对底片柜那面墙
        witnesses:
        - 布光的助手
        - 来试光的客人
        affordances:
        - 布一盏帘内的灯
        - 在白幕前替客人试一档灯位
        pressure_modifiers:
        - 今天棚里排了几组客
        - 白幕上还剩几档灯位
    私房布光间·内帘:
      details:
      - 一盏持续灯、一道内帘，帘后挂着一排拍过即封的防光袋·夜
      - 帘内只允许两种人——被拍的与按快门的，第三个人的脚步声一响，灯就得重新谈·深夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 帘后小门直通器材间，出去不必穿过影棚
        witnesses:
        - 帘外偶尔经过的助手脚步
        affordances:
        - 按下一次快门
        - 当场封袋双签
        - 布一盏帘内的灯
        pressure_modifiers:
        - 这卷胶片还剩几张
        - 帘内那句「可以吗」说没说出口
    暗房与显影盘:
      details:
      - 红灯、三只显影盘、一排夹子，定影液的酸味从门缝里渗出去·夜
      - 红灯下不许说话是规矩，药水里浮出来那三十秒，屋里只听得见计时钟·深夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 暗房两道门仓式进出，出来先过一层后过道
        witnesses:
        - 拿着钥匙来排队的同行
        affordances:
        - 显影一位主人到场的卷
        - 在红灯下守完一整卷的计时
        pressure_modifiers:
        - 今晚暗房排到几号
        - 药水是新配的还是续用的
    底片柜与指纹封袋架:
      details:
      - 铁柜一格一卷，防光袋封口那两枚指纹印对着日光灯·午后
      - 柜子不上锁，锁的是名册对卷号那本小簿——权力不在铁皮在索引·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 底片柜背后就是后门，搬柜子得两个人抬
        witnesses:
        - 对柜取卷的助手
        - 来查存根的老客
        affordances:
        - 当场封袋双签
        - 在封袋上按上第二枚指纹
        pressure_modifiers:
        - 柜里还剩几个空格
        - 那本卷号小簿今晚在谁兜里
    会客室与委托单抽屉:
      details:
      - 谈约的方桌，抽屉里是过去七年的委托单存根，按年捆扎·午后
      - 四栏一次谈清才开灯，谈不清的单子当场撕掉重来·傍晚
      profile:
        privacy: medium
        visibility: low
        exits:
        - 会客室窗对着巷内天井，谈崩了可以从天井那边下楼
        witnesses:
        - 陪着来签约的引荐人
        affordances:
        - 谈一份一卷一约
        - 在存根捆里翻出某一年的那一联
        pressure_modifiers:
        - 抽屉里压着几份没谈完的委托单
        - 存根按第几年捆到第几卷
    选片灯箱台:
      details:
      - 底片搁上灯箱，灯一开一格一格过，放大镜压着裁角剪刀·夜
      - 哪张进样册、哪张当场裁角，灯箱前每个决定都是终局·深夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 灯箱台靠着二楼里间，关灯出门就是会客室
        witnesses:
        - 被请来帮掌眼的助手
        affordances:
        - 灯箱上一格一格选片
        - 把放大镜递到她手边再等一息
        pressure_modifiers:
        - 这一卷还剩几格没过
        - 裁角剪刀离哪一格最近
    器材间与倒片台:
      details:
      - 缠片轴、剪片剪、清洁液一排，手上的活多，话就慢·午后
      - 倒片倒错一格就是一卷事故，暗袋里的手全凭指头记数·傍晚
      profile:
        privacy: low
        visibility: medium
        exits:
        - 器材间小窗对着后巷，倒片倒到一半谁也不能进来
        witnesses:
        - 来还器材的助手
        - 搭伙用暗房的同行
        affordances:
        - 器材间里倒一卷带
        - 在暗袋里替她数完最后几格
        pressure_modifiers:
        - 今晚暗袋里还压着几卷没倒完
        - 倒片台前排队的卷号
    地下车库的取景车:
      details:
      - 外拍归来，卷没倒完的车里顶灯一盏一盏灭，牛皮纸袋搁在挡把上·深夜
      - 进口闸的行车记录仪正对着车位，交卷的三十秒比红灯下还长·凌晨
      profile:
        privacy: low
        visibility: medium
        exits:
        - 车库侧梯直上巷口，代驾在闸外等着
        witnesses:
        - 巡夜的保安
        - 闸外等活的代驾
        affordances:
        - 深夜车库交一卷底片
        - 把车挪出记录仪那半格再说话
        pressure_modifiers:
        - 记录仪今晚转没转
        - 车里还剩几卷没交割
  pairs:
  - family: 屏幕与镜头
    position: 服务提供者
    appellations:
    - 老师
    - 制作人
    npc:
      role: 私房写真工作室的主理人
      function: 布光、掌机、把每位客人最想留住的样子收进一卷胶片
      authority: 那面底片柜和行内二十年没出过一次泄露的口碑
      resource: 一柜双签封袋与整墙老客的卷号
      limitation: 数码时代肯等显影的客人越来越少
      obligation: 显影须主人到场，名册不记真名
      exposure: 花名一旦与真名同页，全行口碑一夜清零
      hidden: 她替一位已过世的老客保管着一卷「永远不许显影」的底片——柜钥有两把，另一把随葬了
    player:
      identity: 她唯一还接私房约的掌机搭子，今晚这一卷封袋上要签两个人的名
      baseline: 柜子、口碑、行规都姓她的姓，你只是今晚执机的人。
      resources:
      - 一台用惯的机械机身和手感最熟的那支定焦
      - 一双在暗袋里能数出第三十七格的手
      reputation: 快门落下之前必先问一句「可以吗」的掌机
    relationship_reason: 你是她唯一还接私房约的掌机搭子，两家档期排到同一晚，今晚这一卷封袋上要签两个人的名——柜子、口碑、行规都姓她的姓，你只是今晚执机的人。
  - family: 成人行业与感官服务
    position: 同侪
    appellations:
    - 前辈
    - 直呼其名
    npc:
      role: 隔街工作室的当家女摄影师
      function: 排期、布光、替客人把「想被看见的样子」谈成条款
      authority: 一份行内通用的边界清单和两家共用的暗房钥匙
      resource: 比你多三年的卷号与花名记忆
      limitation: 手上没有稳定掌机，好约接不住
      obligation: 客人的花名与卷号永不见面
      exposure: 被坐实「翻拍过别人的底片」就再进不了这个圈子
      hidden: 她名册里有个花名每季度拍一次、七年没断——是她自己
    player:
      identity: 和她共用一间暗房、卷号排着用的同街摄影师
      baseline: 两本卷号簿互为对方的镜像，她比你厚三年。
      resources:
      - 两家共用那间暗房的一把钥匙
      - 一卷卷号和她挨着的同期客人底片
      reputation: 卷号记得清、暗房出来从不带出一格
    relationship_reason: 两家工作室共用一间暗房，卷号排着用——她拍过的人你可能也拍过，两本卷号簿互为对方的镜像；她比你厚三年，你比她多一双稳的手。
  - family: 私密撮合与契约中介
    position: 初次见面的网友
    appellations:
    - 老板
    - 客人
    npc:
      role: 圈内私房约拍的引荐人
      function: 验双方、传话、把「想拍」和「敢拍」配上对
      authority: 一本只记花名的引荐簿和圈内二十年的信用
      resource: 两边工作室的档期暗账
      limitation: 从不经手底片，也不碰约定之外的东西
      obligation: 引荐只到门口，帘内的事一概不认
      exposure: 引荐簿见光，半个圈子的花名一起完
      hidden: 簿子里有三个花名，其实是同一个人
    player:
      identity: 和她聊了三个月、今晚被带进这条巷子学掌机的新人
      baseline: 第一件事是学签委托单，第二件事是学会等显影。
      resources:
      - 三个月聊出来的信任和一册入门胶片功课
      - 引荐人手写的那张进巷子的路条
      reputation: 网上问得细、线下签得慢的新掌机
    relationship_reason: 聊了三个月，引荐人终于把你带进这条巷子——第一件事是学签委托单；她握名册与客源，你握镜头与手艺，今晚之前谁也不欠谁。
  - family: 医疗与照护
    position: 被求助者
    appellations:
    - 先生
    - 老师
    npc:
      role: 病愈后来拍「还给自己的照片」的客人
      function: 把病中不敢照镜子的日子，一卷一卷拍回去
      authority: 委托单上「底片归客」那一栏的勾
      resource: 主治医师的一句「可以了」和攒了半年的勇气
      limitation: 灯一亮就发抖，快门响一次停三次
      obligation: 到场、签字、看见显影——三样一件不能少
      exposure: 那道疤一旦被认出来，朋友圈里的人就知道她瞒了两年
      hidden: 她真正想拍的不是现在的身体，是手术前那晚没来得及告别的那个
    player:
      identity: 病愈的她托人辗转找到的私房摄影师
      baseline: 你能推迟、能作证、能把门关上，她的勇气只有一次。
      resources:
      - 一整套可以慢到她节奏的布光方案
      - 那句永远有效的「今天就到这儿」
      reputation: 圈里传的能把快门等到她自己点头的那位先生
    relationship_reason: 病愈的她托人找到你，想拍一组只给自己的照片——按不按快门，永远由帘内的人说了算；你能推迟、能作证、能把门关上，她的勇气只有一次。
  activities:
    谈一份一卷一约:
      places:
      - 会客室与委托单抽屉
      pairs:
      - 0
      - 2
      category: 信息交换
      action: '{npc}把一份空白委托单推过方桌，说四栏一次谈清——用途、张数、加洗、底片归谁，哪一栏空着，今晚的灯就不开。'
      beats:
        trigger: '{npc}把一份空白委托单推过方桌，说四栏一次谈清——用途、张数、加洗、底片归谁，哪一栏空着，今晚的灯就不开。'
        objective: 在开灯之前把四栏谈定，尤其最后一栏——这卷胶片往后睡进谁的柜子
        choice: 可当场在「底片归客」一栏落笔；可留白改日再签，或按行内默认让袋子留在主理人的柜里
        immediate: 四栏签满，单子入抽屉存根，灯才算谈开了；空着任何一栏的单子当场撕掉，谁也不欠谁
        near: 存根按年捆进抽屉，往后任何一卷的归属都有得查；今晚没敢签的那一栏，改日重谈时分量就不一样了
    布一盏帘内的灯:
      places:
      - 私房布光间·内帘
      - 棚灯白幕影棚
      pairs:
      - 0
      - 2
      - 3
      category: 日常接触
      action: '{npc}把灯位从她脸上挪到手上，再从手上挪回肩线，一边调一边轻声问这里亮不亮——布光就是谈话。'
      beats:
        trigger: '{npc}把灯位从她脸上挪到手上，再从手上挪回肩线，一边调一边轻声问这里亮不亮——布光就是谈话。'
        objective: 在帘内亮起让她敢站进去的那一盏灯
        choice: 可顺她的意思把灯再压暗半档；可请她亲手调最后一格，或先把灯转到白幕那侧、让影棚里的人先退场
        immediate: 灯落定的那一刻，站位就定了——她站在哪一半光里，快门就往哪一半等
        near: 灯位记进她的卷号备注，下一次续拍照这一盏来；替她调过灯的手，往后每一卷都多一分熟
    按下一次快门:
      places:
      - 私房布光间·内帘
      pairs:
      - 0
      - 2
      - 3
      category: 身体靠近
      action: '{npc}在快门响之前先问出那句「可以吗」，帘内安静下来，只剩取景框里的她和捏着快门线的你。'
      beats:
        trigger: '{npc}在快门响之前先问出那句「可以吗」，帘内安静下来，只剩取景框里的她和捏着快门线的你。'
        objective: 把「可以吗」之后的那一下快门按得干净，让合意落在胶片上
        choice: 可应声后按下这一格；可先放下相机让她缓一缓，或只过片不拍——空一格也是一格
        immediate: 快门一响，这一格就从两个人变成了一个卷；反悔的窗口到封袋为止
        near: 这一卷剩下的张数越拍越少，每一格都比上一格更重；帘内那句「可以吗」，往后每一卷都要重新问
    当场封袋双签:
      places:
      - 私房布光间·内帘
      - 底片柜与指纹封袋架
      pairs:
      - 0
      - 1
      category: 空间与退出
      action: '{npc}把倒完的胶卷装进防光袋，封口摊开在灯下，等你把拇指按上同一行——两枚指纹，一行日期。'
      beats:
