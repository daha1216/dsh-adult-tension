        trigger: '{npc}的伤口在第三夜肿起来，体温计就放在窗口边上，报与不报都要当场定。'
        objective: 在体温被量出来之前决定由谁替这一队承担后果
        choice: 可当场走去复核窗口报清伤口与接触过的时段；可先自己按物理降温撑过今夜，明早再报；也可以把伤口交给队里另一个人替他报，自己留在住处等结果
        immediate: 报上去的人当晚就被带离所属区域单独观察；不报的人体温一过线，整队当周配给票一起作废
        near: 报过的人名下从此多一份可查的记录，替人报的那个人要在整队复核完成前顶下所有人的追问
      far_trigger: 伤口第二次肿起来或同队又一人在同一处受伤
