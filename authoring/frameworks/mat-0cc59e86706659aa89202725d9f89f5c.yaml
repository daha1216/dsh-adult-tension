      far_consequence: 供应负责人需联系替代渠道或退回对应费用，生活区调整订购数量而非要求居民冒险自取。
      exits:
      - 取消未到货的自愿订购项并按实际情况退款
      - 把配送联络交正式接班员，结束本班工作
      bindings:
      - activity: 交接夜班服务问答
        place: 夜班值班室
        pair: 0
    供给线被上游掐断:
      source: 生活区这一周的外采线路被上游单方面停掉，余下的耐储菜按人头只够三天，配给票册还押在对方手里。
      engines:
      - 配给断供
      - 资源锁定
      beats:
        trigger: '{npc}收到上游来的短讯：这一周的线路停掉，什么时候恢复要等通知。'
        objective: 在三天里决定把余量按什么口径分下去
        choice: 可照人头平均分并当场把配给票收上来重排；可先把成人份额压到最低，给有几口人的住户留出余地；也可以维持原数目分完为止，之后各户自己想办法
        immediate: 分法一出口当天就按新口径领，票册上多出来的那几行不再补回，谁提出分法谁的名字记在交接簿那一栏
        near: 三天之后断供是否解除都会先看这一次的分法，分得平均的人接下来几周都要被按同一套口径问一遍
      far_trigger: 第四天供应仍未接上，同时有人拿着旧票册要求补领
      far_consequence: 提出分法的人要么接下整条外采线路去谈，要么在下次领物时被要求让出自己的份额
      bindings:
      - activity: 在复核窗口核对一张带编号记录
        place: 感染检疫隔离点
        pair: 2
      exits:
      - 按新口径分完余量并把配给票册交回正式登记
      - 不接分法，把票册与余量一并交回生活区登记处
    发电机燃油只剩几格:
      source: 发电机房的油桶壁上只剩三格，一格撑一班电，而夜班的值守与远程复课都排在通宵时段。
      engines:
      - 资源锁定
      - 时限逼近
      beats:
        trigger: '{npc}数完油桶只剩三格，值班表上今夜到后夜都排着要用机的时段。'
        objective: 把这三班电分给谁，并让被砍掉的人当场知道
        choice: 可先保夜班值守与复核窗口，把远程复课推到白天；可把三班按人头切成六段，每户都短一点；也可以今晚整夜不开，等油料补给到了再排
        immediate: 时段当场重排并写在值班记录上，被砍掉时段的住户当晚就知道自己明天要改哪一件事
        near: 油料补给按周来，这一夜被砍掉的时段要等下一趟才能补回来，切得太碎的人会连着几天办不成事
      far_trigger: 补给到达前又有一夜排不出电
      far_consequence: 排时段的人要么接下与上游谈油料的差事，要么在下一轮排表时被拿掉说话的位置
      bindings:
      - activity: 在发电机房对一遍还够几班的油
        place: 空置楼栋后侧发电机房
        pair: 1
      exits:
      - 按重排后的时段表供电，油料余量照实记进值班记录
      - 今夜不开机，把时段改到补给到达之后
    体温复核窗口排到了熟人:
      source: 复核窗口当班的带离记录本上出现了一个熟悉的户号，这个户号昨天还来领过东西。
      engines:
