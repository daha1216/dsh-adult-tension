id: mat-0cc59e86706659aa89202725d9f89f5c
name: 检疫站旁的生活区
material:
  eras:
  - 感染爆发初期
  aesthetics:
  - 感染隔离区
  - 末日求生纪实
  rule: 检疫站旁保留独立生活区域，居民以真实通告而非传闻安排往来。体温异常按零容错处置：检测超过警戒线的人由诊疗侧按流程带离所属区域并单独观察，不经过生活区、不在原住处理，生活区只接到一张带编号的带离记录；瞒报伤口或检测结果的人，本人连同他所在那一队的全队口粮配额一并停发，直到整队完成复核为止，队里其余人须自行决定是否替他补上缺的那一份。
  social_rule: 检测与诊疗由专业人员负责，私人关系不能更改检疫记录。伤口一律要先报后处理，报过的人的配额与通行时段由诊疗侧统一留下记录，往后按记录走。
  places:
    感染检疫隔离点:
      details:
      - 隔离点生活区外侧的取物引导牌对着等候线·午
      - 等候线外侧单设一条不带编号的复核通道，体温异常者只走这一条
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿非诊疗侧通道回生活区；受正式隔离者按站方流程返回所属区域
        witnesses:
        - 生活区引导员
        affordances:
        - 试读非诊疗区指示牌
        - 核对待核名单上的编号
        pressure_modifiers:
        - 分区边界与领取时段
        - 复核通道是否已有人在排
    家中厨房:
      details:
      - 自家灶台旁手机开着免提，现有菜蔬放在案板上·晚
      - 米缸和油壶都只剩一层底，配给票按周叠在碗柜上层
      profile:
        privacy: high
        visibility: low
        exits:
        - 结束通话后留在自己住所，不为退场穿越分区
        witnesses:
        - 仅同住且在场的家人，远端只有通话者
        affordances:
        - 远程合做一顿家常饭
        - 把配给票摊开对一遍本周数目
        pressure_modifiers:
        - 食材余量与家庭作息
        - 本周配给票已用掉几张
    夜班值班室:
      details:
      - 非诊疗夜班联络室里电话旁放着待交接的服务问题·夜
      - 接班登记簿摊在桌角，未接完的号码单独画圈
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经生活区走廊回值班休息处，不进入诊疗区
        witnesses:
        - 接班生活服务员
        affordances:
        - 交接夜班服务问答
        - 把深夜来电的诉求逐条记进交接簿
        pressure_modifiers:
        - 夜班疲劳与电话接续数量
        - 交接簿上还画着几个圈
    空置楼栋后侧发电机房:
      details:
      - 封闭楼栋后侧的发电机房只在傍晚开一次门·黄昏
      - 油桶用粉笔在桶壁上划着剩下的格数，一格代表一班电
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从后侧铁门退回楼栋院墙内侧，不翻越围挡
        witnesses:
        - 轮值的楼栋电工
        affordances:
        - 核一遍油桶上还剩几格
        - 记下这一班开机的起止钟点
        pressure_modifiers:
        - 油料余量还够几班
        - 哪几户必须在通电时段办事
    闭环小区临街快递分拣棚:
      details:
      - 单排分拣棚在傍晚收班前后最忙·暮
      - 厚纸箱板裁下的垫板叠在门口，站点收班钟点写在铁皮墙上
      profile:
        privacy: low
        visibility: medium
        exits:
        - 沿站点外侧便道离开小区，不进入封控楼栋
        witnesses:
        - 同班分拣员与站点值守
        affordances:
        - 核一遍当日待派件数
        - 把收班钟点写在铁皮墙上
        pressure_modifiers:
        - 当日待派件数与收班钟点
        - 封控楼栋名单是否又变
    避难所入口防爆门:
      details:
      - 生活区外侧的避难入口是一道厚重的防爆门，落锁前会先响三声短铃·夜
      - 门外登记牌上写明今夜落锁钟点，落锁后只能走诊疗侧的正式通道
      profile:
        privacy: low
        visibility: high
        exits:
        - 落锁前从门外退回生活区；落锁后按站方流程走诊疗侧正式通道
        witnesses:
        - 门口值岗的居民志愿者
        affordances:
        - 核一遍今夜登记牌上的落锁钟点
        - 确认同行的人是否都已在门内
        pressure_modifiers:
        - 距离落锁还剩多久
        - 今夜还有谁没进门
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 生活区物资联络员
      function: 联系日用品配送并安排非诊疗交接
      authority: 可提出领取时段与配送问题，不能变更检疫通行或诊疗记录
      resource: 配送联络电话、实际库存和交接时段
      limitation: 不是医护，不能保证供应方准点到达
      obligation: 如实报缺并区分已到货与预计到货
      exposure: 错报到货会让居民白等
      hidden: —
    player:
      identity: 公共通知校对人
      baseline: 你上次把一条含糊取物通告改得能看懂，他邀请你试读新指引
      resources:
      - 当前通告副本、纸质排版工具和家庭菜谱
      reputation: 公共通知校对人，会查版本但不决定诊疗和隔离
    relationship_reason: 你上次把一条含糊取物通告改得能看懂，他邀请你试读新指引
  - family: 学术与专业
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 居家办公的成人夜校数学教员
      function: 为封闭楼栋里想补课的成年学员远程上晚间数学课
      authority: 可决定自己课表的时段，改不了配送窗口也开不出入证明
      resource: 按周配给的耐储菜、阳台泡沫箱里的一把小葱与一摞演算草稿
      limitation: 修不了楼里坏掉的水管，也调不动封闭的天数
      obligation: 上课不聊小区传闻，邻里的传言不进课堂
      exposure: 把等菜的时间都排成课表，会让同屋人觉得休假也是任务
      hidden: —
    player:
      identity: 闭环小区的快递分拣员
      baseline: 他的晚间数学课缺人搬桌椅，你在分拣间隙搭了把手；他记下你收工的钟点，每周三约你远程同吃一顿晚饭
      resources:
      - 一部省电模式的旧手机与提前调好的闹钟
      - 分拣棚里裁下的厚纸箱板
      reputation: 快递分拣员，搬得动桌椅也守得住站点的收班时间
    relationship_reason: 他的晚间数学课缺人搬桌椅，你在分拣间隙搭了把手；他记下你收工的钟点，每周三约你远程同吃一顿晚饭
  - family: 秩序与执法
    position: 避难所检疫员
    appellations:
    - 主任
    npc:
      role: 生活区检验复核岗
      function: 按名册核验体温与伤口申报记录，把超线的人按流程带离所属区域
      authority: 可停掉一队当周的口粮配额并把人送进单独观察，改不了检测标准也开不出一份合规证明
      resource: 带编号的带离记录本、一支共用体温计与复核通道的当班钥匙
      limitation: 不进生活区住所、不替人解释病情，只能在复核窗口当班的那几小时内办事
      obligation: 每一份带离记录都要写清编号与经手人，事后按编号可查
      exposure: 漏报一次复核，整队下一周的配额都要跟着重排
      hidden: —
    player:
      identity: 生活区配送志愿登记员
      baseline: 你替生活区登记过几轮配送名单，认得哪些名字一周里反复出现；复核岗要找的是一个肯按编号记、不替人说话的人。
      resources:
      - 当周配送登记表与一本手抄的户号册
      - 一部只能打生活区内部短号的旧手机
      reputation: 登记员，认得户号但不管放行，也不替人签过任何一份单
    relationship_reason: 上一轮配送名单里有一户的户号和实际住的人对不上，你按编号追到复核窗口，他没有替你通融，只是把记录本的编号规则讲给你听；此后你们在窗口前后各守一头。
  - family: 地下与灰色地带
    position: 黑市药贩
    appellations:
    - 医生
    npc:
      role: 黑市药品转手人
      function: 把私家藏下或外流出来的药品拆成小份转手，只认当期用的票据不认人
      authority: 可决定这一份药当天给谁，换不换得来下一次补货不由他保证
      resource: 几支拆散编号的抗生素、一本只记代号不记名的换货账，以及一辆跑得动的旧电动车
      limitation: 没有正规来源，货一断就得等下一次外流，也进不了诊疗区更碰不到正式配给
      obligation: 出货前先讲清这一份够不够一个疗程，不替买家判断要不要用
      exposure: 一旦有人拿着他的药去申报，换货账上的代号会先被翻出来
      hidden: —
    player:
      identity: 闭环小区的快递分拣员
      baseline: 你在站点见过有人用一摞配给票换一支拆散编号的药，也见过换回去的人第二天照旧来分拣。
      resources:
      - 站点临街的作息表与一辆能跑夜路的旧三轮
      - 分拣棚里认得人脸的几个同班
      reputation: 分拣员，收班准时，不问别人纸包里装了什么
    relationship_reason: 上一轮封控里你替他把一包东西从站点送到临街，没拆过也没问过；他从那以后只在你收班的那个钟点出现，从不进站点大门。
  activities:
    试读非诊疗区指示牌:
      places:
      - 感染检疫隔离点
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}在生活区一侧指着领取箭头，请你按字面说出自己会走到哪里。'
      beats:
        trigger: '{npc}在生活区一侧指着领取箭头，请你按字面说出自己会走到哪里。'
        objective: 发现会把人误导到诊疗边界的写法
        choice: 复述并核对；不测试留在所属区域；或请引导员说明
        immediate: 含糊箭头提交负责人确认后换版，旧牌收走，实际分区不改
        near: 下一轮领取减少误走，校对者不获得放行权限
    远程合做一顿家常饭:
      places:
      - 家中厨房
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}从自己的厨房发起语音，问你愿不愿用各自现有的菜做一顿相似的晚饭。'
      beats:
        trigger: '{npc}从自己的厨房发起语音，问你愿不愿用各自现有的菜做一顿相似的晚饭。'
        objective: 在不共用食材和厨具的情况下照顾各自晚餐
        choice: 边聊边做；拒绝通话自己吃；或只交换一个家常搭配就挂断
        immediate: 两边各自完成适合自己的饭，不要求同份量、同菜谱
        near: 之后可自愿再约，不把缺席看成身体状况的证据
    交接夜班服务问答:
      places:
      - 夜班值班室
      pairs:
      - 0
      category: 第三方与打断
      action: '{npc}请接班服务员到非诊疗桌边，把尚未回答的取物问题逐件交接。'
      beats:
        trigger: '{npc}请接班服务员到非诊疗桌边，把尚未回答的取物问题逐件交接。'
        objective: 让未解决问题有明确接手人，原班能休息
        choice: 帮忙复述一项；不接班直接离开；或把专业问题转给有职责的窗口
        immediate: 接班者复述已接事项，原班停止接续电话，诊疗问题不在此解答
        near: 居民知道下次问谁，联络员有完整轮休而不必整夜在线
    在复核窗口核对一张带编号记录:
      places:
      - 感染检疫隔离点
      pairs:
      - 2
      category: 第三方与打断
      action: '{npc}把当班的带离记录本推到窗口中间，让你看这一夜已经开出去几张。'
      beats:
        trigger: '{npc}把当班的带离记录本推到窗口中间，让你看这一夜已经开出去几张。'
        objective: 看清今夜谁被带离、按哪一条编号走
        choice: 可只看已开的编号不谈姓名；可当面问清其中一条对应的是哪一队；也可以不看，直接离开窗口
        immediate: 本子只看不带走，问过的编号会在交接簿上多一行备注，窗口这边不替任何人解释病情
        near: 复核窗口每班重开一次，今夜看过的人在下一班的名字不会被特意记住
    在落锁前核一遍进门的人:
      places:
      - 避难所入口防爆门
      pairs:
      - 2
      category: 空间与退出
      action: '{npc}站在门外登记牌旁边，让你按名单确认今夜还有谁没有进门。'
      beats:
        trigger: '{npc}站在门外登记牌旁边，让你按名单确认今夜还有谁没有进门。'
        objective: 在短铃响完之前决定为谁留门、为谁不留
        choice: 可照名单核完再进；可留一次门给一个还没到的人，自己站在门边等；也可以按钟点进门，名单上剩下的人留给诊疗侧通道
        immediate: 三声短铃一过门就落，站在门里门外是当场唯一还能改的事，落了锁就只能走诊疗侧那条正式通道
        near: 为谁留过门这件事门口的值岗会记住，往后同一个人再晚到都会被先问一句
    在发电机房对一遍还够几班的油:
      places:
      - 空置楼栋后侧发电机房
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}拿粉笔敲了敲油桶，让你自己数桶壁上还剩几格。'
      beats:
        trigger: '{npc}拿粉笔敲了敲油桶，让你自己数桶壁上还剩几格。'
        objective: 把剩下的电量按夜里的几件事排一个先后
        choice: 可数完照实报给轮值电工；可只记下格数不说给谁先通电；或直接不排，按原时段照常开
        immediate: 格数当夜就会写进值班记录，谁家今晚通电由原时段表决定，不由数桶的人定
        near: 油料什么时候见底会被提前两三天看出来，看出来的那个人这几天会一直被问
    在分拣棚按待派件数重排收班:
      places:
      - 闭环小区临街快递分拣棚
      pairs:
      - 3
      category: 日常接触
      action: '{npc}把今天的待派件数报给你，问你要不要先动一批压在棚角的。'
      beats:
        trigger: '{npc}把今天的待派件数报给你，问你要不要先动一批压在棚角的。'
        objective: 在不进出封控楼栋的前提下把当日件数压下去
        choice: 可先动临街的那一批；可只把棚角的件码清点一遍，收班钟点到就走；也可以今天不加这一趟
        immediate: 动过的件当场记上钟点，收班时间写在铁皮墙上就不改，封控楼栋那几单仍旧不派
        near: 压在棚角的那几件会一天一天往后挪，挪到有人来问的时候才有人去碰
  customs:
  - 公告栏同时留有手写版，让无法使用手机的人也能读到更新。
  - 换岗前先对一遍复核窗口的编号，编号对不上就不交接。
  - 落锁前门口会响三声短铃，听到铃的人都往门里走，不为谁多停。
  pressures:
    旧版通告仍在流传:
      source: 社区群转发了已被替换的服务通知
      engines:
      - 旧事追索
      - 信任透支
      beats:
        trigger: '{npc}收到消息：社区群转发了已被替换的服务通知。'
        objective: 标明更新时间并通知受影响的人
        choice: 请管理员置顶更正版；或将更替信息交所属区服务员，由其按现行分区规则告知
        immediate: 发现流传的旧版取物时段已失效；现行通告改为次日下午两点到四点在同一领取点取物，先指出哪一项失效，不扩写感染传闻。
        near: 管理员置顶更正版（取物时段改为次日下午两点到四点），线下牌同步换版；无手机者由所属区服务员告知，不擅自逐户越区。
      far_trigger: 下一个领取周期仍有人依旧版来到旧点
      far_consequence: 需增加两版更替说明和现场引导，联络员的重复解释工作增加。
      exits:
      - 提交新旧版本对照后交给正式通告负责人
      - 暂停代转消息，只告知可查的正式窗口
      bindings:
      - activity: 试读非诊疗区指示牌
        place: 感染检疫隔离点
        pair: 0
      - activity: 交接夜班服务问答
        place: 夜班值班室
        pair: 0
    生活物资交接延迟:
      source: 生活区日用品交接没有按约到达
      engines:
      - 资源锁定
      - 时限逼近
      beats:
        trigger: '{npc}收到消息：生活区日用品交接没有按约到达。'
        objective: 确认已到货与待到货状态，由正式接班人接续配送联络
        choice: 联系供应方，或公布延迟领取安排
        immediate: 尚未到达的日用品不记作已领，接班员先接收供货方的准确状态。
        near: 可分已到货与待到货两批安排，居民自主选后续领取时段，不凭私人关系插队。
