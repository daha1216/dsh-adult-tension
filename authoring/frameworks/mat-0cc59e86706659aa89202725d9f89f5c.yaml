        place: 感染检疫隔离点
        pair: 2
      exits:
      - 按流程走复核通道，把当周配给交回整队重排
      - 退出本队登记，交由诊疗侧按编号带走处理
    父母突然来住处:
      source: 没有预约的探望从城外赶到，隔着一道封控线站在小区门口，而屋里那张床睡的是两个人。
      engines:
