      - 照编号念完当班记录，之后回生活区不必再谈
      - 请当班的人接续这一条，自己退开窗口
    伤口在第三夜发炎起烧:
      source: 手上那道伤口拖到第三夜开始发炎起烧，自己报上去要停发全队当周配额，队里另外几个人正在等着领东西。
      engines:
