      - 对等试探
      beats:
        trigger: '{npc}在带离记录本上认出那个户号，编号已经开出去，人还在窗口外面等着。'
        objective: 在不改记录的前提下把自己的立场讲清楚
        choice: 可照编号念完这一条、不做任何补充；可当外面的人问起时只说记录上写了什么，不替他解释；也可以请当班的人来念这一条，自己退到窗口侧面
        immediate: 编号一旦念出来就当班生效，窗口外的队伍里会有人认出那个户号，当班的人不进生活区也不解释病情
        near: 认得这个户号的人往后几周都会被队伍里的人多看几眼，念过编号的人自己也进过这份记录
      far_trigger: 同一位熟人的户号在下一班记录里再次出现
      far_consequence: 念过编号的人要么从此避开复核窗口的班，要么接下这一段的当班位置
      bindings:
