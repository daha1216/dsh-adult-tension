  themes:
  - 服务信息失真如何增加生活负担
  - 检疫边界内仍然可以选择自己的日常
  - 有限食材和夜班休息的互助
  - 看得见的配给口径决定谁承担风险
  - 复核记录上的编号与人的生活距离
  technology_boundary: 感染初期仍可使用手机、社区群、电话与公共告示；生活区与诊疗区有实体边界，联络员和校对员没有诊断或放行权。厨房交流采用远程语音，不假定隔窗递物天然满足防疫条件。配给凭纸质票册按周登记，复核以纸质带编号记录留档，封控楼栋的远程复课用手机免提与语音，没有集中播报或电子身份系统；防疫服与面罩按当日班次配发，不设个人专属装备。
  bridge_status: not_required
