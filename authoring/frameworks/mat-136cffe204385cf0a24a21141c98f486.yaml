        "objective": "弄清回程位置的实情，以及改签各自要付什么"
        "choice": "当场核对班次；只看自己那张；或把改签的事留到检票口再问"
        "immediate": "两程的时刻被写在同一张纸上，谁的票进谁的口袋"
        "near": "改签窗口通宵排队，先到的人拿到的不是照顾，只是先排队"
