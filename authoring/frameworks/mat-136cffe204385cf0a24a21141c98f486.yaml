"id": "mat-136cffe204385cf0a24a21141c98f486"
"name": "海岸渡船与观测旅行"
"material":
  "eras":
    - "远途休假季"
  "aesthetics":
    - "暖色生活流"
    - "写实文学"
  "rule": "旅人沿海岸与观测点停留，船期是计划依据，不必成为每次相遇的危机；但一程只发一张回程票，票与住宿记录会替人说出真实选择，天气、签证与封路的时限不与人商量，行程一旦错开，是否同路就得各自重新决定。"
  "social_rule": "乘船与观测遵从实际开放安排，同行人各自决定是否继续行程；回程票和住宿记录会留下真实选择，口头改签不作数，观星、登山与自驾一律以当日公告为准，谁也不欠谁一个留下来不走。"
  "places":
    "夜航渡轮":
      "details":
        - "甲板挡风玻璃映着岸灯与航迹·夜"
        - "船舱广播反复播着靠港时刻，末班船的座位号撕掉了后一半·夜"
      "profile":
        "privacy": "low"
        "visibility": "high"
        "exits":
          - "可回客舱停止交谈；离船仅在靠港后走客梯"
        "witnesses":
          - "值班水手与旅客"
        "affordances":
          - "记录港湾夜景"
        "pressure_modifiers":
          - "甲板风力和靠港时间"
          - "这一班是不是当天最后一班"
    "回程前的空车站":
      "details":
        - "凌晨的候车厅只开一半灯，时刻表上列车晚点四十分钟·夜"
        - "行李房已落锁，长椅上散着几张被丢下的换乘小票"
      "profile":
        "privacy": "low"
        "visibility": "high"
        "exits":
          - "出站口通向出租车排班点，进站验票仍开放"
        "witnesses":
          - "值夜售票员与零星过班旅客"
        "affordances":
          - "核对两张回程票的班次"
        "pressure_modifiers":
          - "末班车时刻与检票口是否还有人值守"
          - "站台只开一侧，改签窗口通宵排队"
    "最后一班渡轮":
      "details":
        - "末班渡轮的甲板已经空了，船舷边上只剩两个系缆桩和一台没关的广播·夜"
        - "客舱灯一盏盏灭下去，水手开始收扶手边的救生圈"
      "profile":
        "privacy": "medium"
        "visibility": "low"
        "exits":
          - "靠港后从客梯下船，航行中不开放离船"
        "witnesses":
          - "值班水手一人，多数旅客已回舱"
        "affordances":
          - "在甲板上把话说到底"
        "pressure_modifiers":
          - "靠港倒计时与下一班船的开航日"
          - "末班船不设返程座位"
    "海岛度假村":
      "details":
        - "淡季度假村的前台只剩一盏值班灯，房卡插在柜面的木牌上·夜"
        - "泳池已放空，躺椅叠在墙角，海风穿过空房的门"
      "profile":
        "privacy": "medium"
        "visibility": "medium"
        "exits":
          - "经前台取卡回房，或沿车位走到岛内班车站"
        "witnesses":
          - "值夜前台一人"
        "affordances":
          - "补订一间加住房"
        "pressure_modifiers":
          - "淡季房态与退房结算时间"
          - "班车一天两趟，误点只能等次日"
    "露营营地":
      "details":
        - "登记处的防潮灯照着当晚的营位板，空位用红钉标出·夜"
        - "营地边缘的淋浴间十点断水，洗衣房整夜亮着"
      "profile":
        "privacy": "low"
        "visibility": "high"
        "exits":
          - "沿营道回登记处，夜里出营仍可走正门"
        "witnesses":
          - "营地管理员与相邻营位住客"
        "affordances":
          - "在营位板上调整同住安排"
        "pressure_modifiers":
          - "营位与人数的限额、熄灯后是否允许继续交谈"
          - "夜间登记处只处理紧急换位"
    "高速公路服务区":
      "details":
        - "封路告示牌立在服务区入口，货车停满外侧车位·夜"
        - "便利店通宵营业，热水机前排着队"
      "profile":
        "privacy": "low"
        "visibility": "high"
        "exits":
          - "走天桥回对面车位，封路段不可步行下高速"
        "witnesses":
          - "值班路政员与同批滞留司机"
        "affordances":
          - "打听封路段是否已放行"
        "pressure_modifiers":
          - "封路解除时间与油量是否够撑到放行"
          - "卫生间和热水是这里唯一不涨价的东西"
    "签证面签候谈室":
      "details":
        - "候谈室的叫号屏停在当前号，纸质材料按窗口分堆·午"
        - "值班台的印章没干，旁边压着几张快过期的一次签"
      "profile":
        "privacy": "medium"
        "visibility": "high"
        "exits":
          - "从叫号口回公共走廊，未叫到号可随时离场"
        "witnesses":
          - "签证官与候谈的同批申请者"
        "affordances":
          - "当场核对待办清单"
        "pressure_modifiers":
          - "号序与当日剩余受理名额"
          - "一次签的入境期限，过期就作废"
    "灯塔值守屋":
      "details":
        - "预约参观桌上放着褪色灯塔照片·午"
        - "值守屋的留言簿摊开着，前一页记着某年封路的日期·午"
      "profile":
        "privacy": "medium"
        "visibility": "medium"
        "exits":
          - "沿参观走廊回到塔外步道，不进值守设备间"
        "witnesses":
          - "灯塔讲解员"
        "affordances":
          - "整理公开灯塔照片"
        "pressure_modifiers":
          - "预约结束时间与照片保存状况"
          - "天气转坏时看守人是否提前闭馆"
    "私人游艇":
      "details":
        - "停泊游艇的侧甲板留着一条未铺垫的通道·午"
        - "舱内吧台留着一张写了两行字的便条，字迹停在半句上·暮"
      "profile":
        "privacy": "medium"
        "visibility": "medium"
        "exits":
          - "经船主开放的舷梯回码头"
        "witnesses":
          - "船主或受托看船人"
        "affordances":
          - "试走停泊参观路线"
        "pressure_modifiers":
          - "潮位与舷梯坡度"
          - "船主几时回船，停泊参观的许可到哪一刻为止"
    "山顶观星台":
      "details":
        - "红光灯旁的望远镜遮罩挂着露珠·夜"
        - "上山的接驳车每天最后一趟停在半山，错过只能沿步道走下来·夜"
      "profile":
        "privacy": "low"
        "visibility": "medium"
        "exits":
          - "沿标识山径回接驳停车点"
        "witnesses":
          - "观测志愿者"
        "affordances":
          - "标记夜空方位"
        "pressure_modifiers":
          - "云量、暗适应与末班接驳时间"
          - "那一晚之后是否还有下一个晴夜"
  "pairs":
    -
      "family": "服务与手艺"
      "position": "同侪"
      "appellations":
        - "直呼其名"
      "npc":
        "role": "海岸徒步领队"
        "function": "带预约小队辨认近岸路径与接驳点"
        "authority": "能缩短自己带队的步行段，不能调整船期；封路与接驳改线只能替队员登记诉求，不能替任何人留住座位"
        "resource": "实走坡度表、潮汐公告与接驳联系人"
        "limitation": "不会驾驶客船，也不能保证观星成功；当日的封路与面签名额都在他职权之外，他只能陪着排队"
        "obligation": "在分路前说明最后接驳点；封路或改港时把实情一次说清，不劝人留下也不劝人先走"
        "exposure": "走得过快会让队员错过休息；为等一个队员而压掉别人的接驳，这一队往后不会再有人跟着他走慢线"
        "hidden": "—"
      "player":
        "identity": "自然景观摄影师（受雇于旅行线路）"
        "baseline": "你拍的转弯地标替他补齐一条难认的路，他邀请你慢走重拍"
        "resources":
          - "长焦镜头、旧照片拷贝与指北罗盘"
          - "记熟的两条绕行公路与一次改签名额"
          - "能在服务区和码头说上话的接驳联系人"
        "reputation": "构图耐心但会明确返程时间"
      "relationship_reason": "你拍的转弯地标替他补齐一条难认的路，他邀请你慢走重拍"
    -
      "family": "艺术与传播"
      "position": "同侪"
      "appellations":
        - "直呼其名"
      "npc":
        "role": "海岸星空摄影师"
        "function": "重摄不同年代的岸线照并教旅伴用星定向"
        "authority": "可决定自己底片与延时素材的去留，不外借未冲洗的卷；观测改期只影响她自己的机位，不改同行者的行程"
        "resource": "赤道仪、快门线与一张覆膜星图"
        "limitation": "改期只能她自己补拍，不代同行者订房加住；等云期间她不能替任何人改签或退票"
        "obligation": "翻拍馆藏旧照先注明馆方授权，认星前先问同行者能等多久；等云超过约定时限必须收工，不能拿天气当拖延的理由"
        "exposure": "为等一片云隙会拖过末班接驳，让同行者两难；错过之后下山的路只能走步道，走不动的人要由她自己背下来"
        "hidden": "—"
      "player":
        "identity": "海岸徒步领队"
        "baseline": "末班接驳只剩两个座位，你们让犹豫的团友先走，在停车场把两程时刻表对成一张；此后他拍延时，你守集合点"
        "resources":
          - "备用登山杖与一次性雨衣"
          - "记熟的三条下撤线"
        "reputation": "带得住慢队，也敢当众删掉赶时间的路段"
      "relationship_reason": "末班接驳只剩两个座位，你们让犹豫的团友先走，在停车场把两程时刻表对成一张；此后他拍延时，你守集合点"
  "activities":
    "记录港湾夜景":
      "places":
        - "夜航渡轮"
      "pairs":
        - 0
        - 1
      "category": "日常接触"
      "action": "{npc}把靠窗的空位让给你，问要不要一起等岸灯转过船尾；再过一段，这艘船就要靠港了。"
      "beats":
        "trigger": "{npc}把靠窗的空位让给你，问要不要一起等岸灯转过船尾；再过一段，这艘船就要靠港了。"
        "objective": "共享一段慢看的时间而不凑拍摄清单，也不把它当成必须留到靠港的约定"
        "choice": "一起看灯；独自回舱休息；或各选一个方向安静拍摄；也可先问清下一班船是哪天"
        "immediate": "停留者找到喜欢的一段灯影，离开者不欠补拍或解释；靠港后再没有回这趟船的位子"
        "near": "到港后可交换一张自选照片，也可各走行程；错过末班船的人只能等次日或改走陆路"
    "在候车厅核对两张票":
