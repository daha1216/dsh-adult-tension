  technology_boundary: 动捕阵列、实时渲染、声纹比对、全息演出与数据热力墙真实可用，但每一套系统都有权限层级、缓存窗口和维护时段，维护时段里再大的事故也只能排队。不存在意识读取、零成本完美换声或一键换脸——皮套的维护必须走物理工坊，织物打印与伺服件换不了代际就换不了人。声纹比对只给相似度不给唯一解，机器只能怀疑，定罪要靠人；数据也不自动执行任何东西：注销要人按，封存要人签，热力墙红了也只会红着。
