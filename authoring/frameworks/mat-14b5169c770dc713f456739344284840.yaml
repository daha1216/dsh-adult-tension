id: mat-14b5169c770dc713f456739344284840
name: 动捕棚与中之人
material:
  eras:
  - 近未来都市
  aesthetics:
  - 日系同人音声物语
  - 隔音录音棚暗夜私语
  - 克制冷峻
  rule: 虚拟皮套账号与直播间后台归公司永续经营，设定、称呼与纪念日互动全量继承，换人不断档；合同只锁皮套不锁人——中之人可以走，走的那天声纹、动捕数据与全部权限当场注销，人可以走，皮套不许停。中之人匿名执业，真脸、真名与台本外的真声线都是事故源，粉丝爱的名字不指向任何一个真人；泄露不是收不回的副本，只是一场要按流程处置的压力事件。皮套对粉丝的承诺由公司代为兑现，周年庆、生日回、礼物企划照常营业，中之人对「她被怎样爱着」没有处份权；候补常驻训练，第七任之后可以有第八任。这里没有信用分，也没有自动续期的服务合同，皮套不是她的脸，是公司账上的一笔资产；要争的从来不是署名归谁，而是「下一个」这两个字落在谁头上。
  social_rule: 台词之外的声音一律算事故；这里怕的不是内容流出，是身份被钉死——一段录音的授权范围可以谈，一条声纹比对帖追到真人就没有退路，经纪人在棚外敲门查岗那一套在这里换成声纹溯源查到真人。中之人之间不互认身份，认了也不许说破；运营群里只叫工号不叫名字，这样换人的那一天谁都不用改口。皮套与真人的物理隔离由所有人共同看守：看见素颜的人有义务忘掉，听出真声的人有义务装作没听出。
  places:
    动作捕捉主棚:
      details:
      - 反光标记点贴满受力服，悬吊架从棚顶垂下，阵列灯在网格地面上铺出坐标·夜
      - 主棚侧的安全门贴着「录制中勿入」，门边挂着备用心率手环
      profile:
        privacy: low
        visibility: medium
        exits:
        - 从棚侧安全门退到设备走廊，录制中不放人
        witnesses:
        - 动捕工程师
        - 场记
        affordances:
        - 校准标记点与吊架配重
        - 试走位到标记点全部亮起
        - 动捕棚校准半小时
        - 结束活动并离开
        pressure_modifiers:
        - 吊架配重上限
        - 心率手环读数
    隔音舱休息室:
      details:
      - 声学棉上贴着倒计时便利贴，负压门一关，外面的世界只剩空调低鸣·午后
      - 舱内没有摄像头，唯一的光源是一盏可以调到极暗的灯
      profile:
        privacy: high
        visibility: low
        exits:
        - 刷双卡开负压门，从设备走廊一侧离开
        witnesses:
        - 没有常驻证人，门禁双卡记录替楼层数着进出
        affordances:
        - 睡一个午觉
        - 不说话待一会儿
        - 隔音舱里睡一个午觉
        - 结束活动并离开
        pressure_modifiers:
        - 静默时段长度
        - 门禁双卡在谁手里
    皮套维护工坊:
      details:
      - 3D织物打印机整夜吐着布料，伺服件按代际排在柜子里，第七代的标签还没撕·夜
      - 工作台上摊着补了一半的猫耳发箍，维护日志摊开在昨天那一页
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从工坊后门下货运坡道，绕开正门的人流
        witnesses:
        - 皮套工程师
        affordances:
        - 换件与补色
        - 写维护日志
        - 动捕棚校准半小时
        - 结束活动并离开
        pressure_modifiers:
        - 代际兼容清单
        - 备件库存水位
    数据复盘室:
      details:
      - 弹幕热力墙把三小时的直播烧成一片红蓝，时间轴拖到哪里，哪里就安静下来·夜
      - 复盘桌两头各一块屏，一边是加密报表，一边是还能导出的原始流
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从复盘室门退回运营区主走廊
        witnesses:
        - 数据分析师
        - 运营专员
        affordances:
        - 拖时间轴核对一场直播
        - 标出弹幕热力的异常点
        - 复盘一场直播的数据
        - 结束活动并离开
        pressure_modifiers:
        - 热力峰值时段
        - 原始数据留存期限
    应急作战室:
      details:
      - 事故推演屏轮播着十种崩坏预案，分色流程卡插在桌沿，谁认领哪格就抽走哪张·夜
      - 双通道门一边通走廊一边通机房，通报级别决定开哪一边
      profile:
        privacy: medium
        visibility: high
        exits:
        - 走双通道门的走廊一侧离开，机房一侧需要通报级别
        witnesses:
        - 值班主任
        - 法务
        affordances:
        - 过一遍响应流程
        - 认领一格职责
        - 换皮套的排期会
        - 结束活动并离开
        pressure_modifiers:
        - 响应时限
        - 通报级别
    全息彩排台:
      details:
      - 升降价盘把皮套影像抬到真人三倍高，她抬手，那个更大的她也抬手·夜
      - 台侧升降口下面是特效师的地堡，走位标记贴一直铺到观众席第一排
      profile:
        privacy: low
        visibility: high
        exits:
        - 从台侧升降口降到地堡层，再经货运通道离开
        witnesses:
        - 走位导演
        - 特效师
        affordances:
        - 走位与对光
        - 试一次价盘行程
        - 全息彩排走位
        - 事故演练变成真事故
        - 结束活动并离开
        pressure_modifiers:
        - 价盘行程余量
        - 影像延迟毫秒数
    中之人匿名公寓:
      details:
      - 无门牌的月付公寓，现金交租，快递只到两条街外的驿站·深夜
      - 窗帘是加厚的，日程表压在枕头下面，烧掉它只需要一个打火机
      profile:
        privacy: high
        visibility: low
        exits:
        - 走消防通道下楼，不碰有摄像头的大门
        witnesses:
        - 没有证人，驿站老板娘只记得取件时间
        affordances:
        - 收拾东西
        - 烧掉旧日程表
        - 竞业到期夜收拾东西
        - 结束活动并离开
        pressure_modifiers:
        - 月付周期到哪一天
        - 房东从不登记
    深夜小电台机房:
      details:
      - 47人频道的旧调音台还亮着，手缝的话筒罩磨出了毛边，录音红灯一闪整个机房都看得见·深夜
      - 双人连线只架两副耳机，第二副是留给今晚客人的
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从机房铁门退到楼梯间，铁门里侧贴着「红灯亮时不叫任何名字」
        witnesses:
        - 频主（你）
        affordances:
        - 双人连线
        - 念一封听众来信
        - 声纹帖的来路查到机房
        - 小电台的双人连线
        - 结束活动并离开
        pressure_modifiers:
        - 频道在线人数
        - 录音红灯亮着与否
    候补训练室:
      details:
      - 第二皮套的试衣架立在镜子旁边，镜角贴着「练习用」的标签·黄昏
      - 台本架上是她的前辈们用同一种姿势翻烂的页码
      profile:
        privacy: low
        visibility: medium
        exits:
        - 从训练室门退回带教走廊
        witnesses:
        - 带教教练
        affordances:
        - 练直播节奏
        - 对一遍台本
        - 换皮套的排期会
        - 结束活动并离开
        pressure_modifiers:
        - 排期优先级
        - 镜子朝向
  pairs:
  - family: 屏幕与镜头
    position: 初次见面的网友
    appellations:
    - 直呼其名
    - 哥哥
    npc:
      role: 虚拟主播顶流中之人
      function: 动捕直播、声线切换、在百万粉丝面前维系软萌人设
      authority: 虚拟皮套账号与直播间后台管理权
      resource: 一份未公开的录播母带与动捕工程文件
      limitation: 经纪公司天价竞业协议与不许恋爱的死规定
      obligation: 现实身份与皮套绝对物理隔离
      exposure: 现实素颜与私生活一旦流出当场社死解约
      hidden: 关掉麦克风后，是个习惯叼着薄荷糖叹气的疲惫御姐
    player:
      identity: 聊了很久、今晚才第一次见面的网友
      baseline: 声音和头像都对上了，坐在对面的真人反而陌生。
      resources:
      - 几个月攒下的聊天记录
      - 一个你们都还在的线上小圈子
      reputation: 网上说话算数、线下第一次赴约的那个人
    relationship_reason: 半年前一个旧ID进了你的47人频道，连线聊到今晚才第一次线下见面——她的声音你在百万人的直播里听过，在47个人的频道里也听过，你一直没说破，她也没问过你听没听出来。
  - family: 学术与专业
    position: 战队专属战术分析师
    appellations:
    - 老师
    - 前辈
    npc:
      role: 动捕棚的夜间值守工程师
      function: 校准动捕阵列、值守夜间录制、守住原始数据的边界
      authority: 动捕阵列与录制系统的夜间设备权限
      resource: 一份未导出的原始动捕工程文件
      limitation: 数据调阅要走双人复核，她一个人看不了全部
      obligation: 台本外的录制内容不外传
      exposure: 私自导出数据一旦被查出，行业里再没有棚敢用她
      hidden: 她修得好每一代皮套，却始终调不出自己声音的那一版
    player:
      identity: 被项目借调来的战术分析师，掌数据底牌
      baseline: 屏幕上的每一秒都在你眼里；这台机器你们各掌一半。
      resources:
      - 未加密的直播原始数据与报表
      - 出场名单的最终否决建议权
      reputation: 洞察敏锐、极度理智、项目背后的操盘手
    relationship_reason: 你们各自掌着这台机器的一半——数据权限在你手里，设备权限在她手里，夜间校准要两个人同时在场才开得动。
  - family: 商业与产业
    position: 下属
    appellations:
    - 制作人
    - 主任
    npc:
      role: 企划运营总监
      function: 主持「皮套永续计划」，把每一份皮套当资产并购案来运营
      authority: 直播项目与皮套资产的全部运营决策权
      resource: 七任中之人的完整交接档案
      limitation: 永续计划的续期不由她一人拍板，董事会盯着她
      obligation: 对公司资产负责，不对任何一个真人负责
      exposure: 任何一任中之人出事，第一个被问责的都是她
      hidden: 她抽屉里锁着第一任的告别直播母带，谁也没提过要归档
    player:
      identity: 今晚被她叫来帮忙的运营组执行
      baseline: 事情早办完了，你没有起身，她也没有赶你走。
      resources:
      - 一张经你的手发出去的排期表
      - 今晚帮她跑腿攒下的情分
      reputation: 办事妥帖、从不多嘴的下属
    relationship_reason: 你是新调来的执行，全组的排期表经你的手发出去——第七任之后还有没有第八任，她的方案要先过你这一层。
  - family: 屏幕与镜头
    position: 上司
    appellations:
    - 教练
    - 制作人
    npc:
      role: 皮套候补中之人
      function: 在候补训练室按录像练直播节奏、对台本，等着轮到自己
      authority: 候补期仅有的练习用镜像账号权限
      resource: 一整柜前辈们的直播录像和标注笔记
      limitation: 未上岗不得以任何形式露出真容，训练也要背对监控
      obligation: 候补条例与保密协议压在训练室抽屉里
      exposure: 谁把「下一个是谁」说出去，她的候补资格当场作废
      hidden: 她背得出皮套全部纪念日，包括还没轮到她的那些
    player:
      identity: 靠录像与数据带候补练节奏的带教教练
      baseline: 你的排期表决定谁能上场，今晚这间房里只剩你和那个还在改动作的人。
      resources:
      - 一份本赛季的轮换与训练排期
      - 训练录像的分段剪辑权
      reputation: 只认场上表现、不拿私交换位置、说改动作就陪着练到改完
    relationship_reason: 你按录像与数据带她练直播节奏——她是不是「下一个」，你的排期表比你先知道。
  activities:
    复盘一场直播的数据:
      places:
      - 数据复盘室
      pairs:
      - 0
      - 1
      - 2
      category: 调查与核验
      action: '{npc}把热力墙的时间轴拖到出事的那三分钟'
      beats:
        trigger: '{npc}把热力墙的时间轴拖到出事的那三分钟'
        objective: 核对一条完整的时间线，把事故前后的每一格数据对上
        choice: 让对方标出数据里未经证实的部分，还是由你先说出你看到的那一版
        immediate: 时间轴对上了，但有一格热力峰值谁都解释不了
        near: 你们各自把那格峰值记在了自己的本子上
    动捕棚校准半小时:
      places:
      - 动作捕捉主棚
      - 皮套维护工坊
      pairs:
      - 1
      - 3
      category: 照护与修复
      action: '{npc}把受力服递给你，标记点还差最后三颗没贴'
      beats:
        trigger: '{npc}把受力服递给你，标记点还差最后三颗没贴'
        objective: 半小时内把阵列与吊架配重全部校准，误差压回许可线
        choice: 教她一个能省一半时间的动作，还是先用酒精棉按住她指尖渗出的血
        immediate: 阵列全部亮起绿灯，她的心率手环还停在报警线边缘
        near: 校准记录归档时，多了一段谁也没安排过的空跑轨迹
    声纹帖的来路查到机房:
      places:
      - 深夜小电台机房
      pairs:
      - 0
      - 1
      category: 调查与核验
      action: '{npc}把那条声纹比对帖的截图摊在调音台上'
      beats:
        trigger: '{npc}把那条声纹比对帖的截图摊在调音台上'
        objective: 查清帖子里那段音频是从哪次连线流出去的
        choice: 询问谁还知道这件事，还是先把帖子里未经证实的消息标为待核实
        immediate: 来路查到了机房，录音红灯亮着的那晚名单很短
        near: 名单上的每一个人，都开始用另一种眼神看你
    换皮套的排期会:
      places:
      - 应急作战室
      - 候补训练室
      pairs:
      - 2
      - 3
      category: 信息交换
      action: '{npc}把两版排期方案推到桌子中间，只署了工号'
      beats:
        trigger: '{npc}把两版排期方案推到桌子中间，只署了工号'
        objective: 在散会前把换皮套的排期定成哪一版
        choice: 摆出两个选项让桌子自己选，还是当面把账拆开算清楚
        immediate: 排期定了，名单上有一个名字被划掉又写回
        near: 被划掉又写回的那个人，开始按新排期训练
    隔音舱里睡一个午觉:
      places:
      - 隔音舱休息室
      pairs:
      - 0
      - 1
      category: 日常接触
      action: '{npc}把负压门关上，倒计时便利贴贴到下一格'
      beats:
        trigger: '{npc}把负压门关上，倒计时便利贴贴到下一格'
        objective: 在静默时段里各自歇一口气，谁也不提外面的事
        choice: 给她留一盏灯，还是把灯调到只剩一线
        immediate: 静默时段结束的提示音响起时你们同时醒了，谁也没先动
        near: 从那天起，隔音舱的预约表上开始出现连续两格同一个工号
    全息彩排走位:
      places:
      - 全息彩排台
      pairs:
      - 0
      - 2
      category: 日常接触
      action: '{npc}站上升降价盘，三倍高的皮套影像随她抬手'
      beats:
        trigger: '{npc}站上升降价盘，三倍高的皮套影像随她抬手'
        objective: 把今晚的走位对完，价盘行程一寸都不能错
        choice: 替她扶正歪掉的猫耳发箍，还是把宽大队服递过去让她换下受力服
        immediate: 走位一次过，影像延迟在最后一秒跳了一下
        near: 监控里那一跳被单独截出来，标进了维护清单
    竞业到期夜收拾东西:
      places:
      - 中之人匿名公寓
      pairs:
      - 0
      - 1
      category: 空间与退出
      action: '{npc}把行李箱摊开在没铺床单的床垫上'
      beats:
        trigger: '{npc}把行李箱摊开在没铺床单的床垫上'
        objective: 天亮前把这些年收拾进一只箱子
        choice: 把关键物品留在原地后离开，还是先各自离开再约下一次
        immediate: 烧掉日程表的那点火光，照亮的房间比想象里小
        near: 驿站老板娘第二天照常给那个空格口留了一格
    事故演练变成真事故:
      places:
      - 全息彩排台
      pairs:
      - 2
      - 3
      category: 第三方与打断
      action: '{npc}按预案卡摘下监听耳机，广播里却没有念「演练结束」'
      beats:
        trigger: '{npc}按预案卡摘下监听耳机，广播里却没有念「演练结束」'
        objective: 按分色流程卡把真事故当演练处置完
