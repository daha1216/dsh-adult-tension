        pair: 3
      - activity: 用掌心温热腕上冰凉的翡翠玉镯
        place: 平康坊顶层花魁琴房
        pair: 2
      - activity: 整理地方碑录
        place: 宗族祠堂
        pair: 0
    拍卖夜信托解冻前:
      source: 委托给拍行的那批旧藏已进库待估，信托文书上写着解冻日就在本夜交时之前，过期未认领即按无主入拍。
      engines:
      - 时限逼近
      - 债务压力
      beats:
        trigger: '{npc}把信托文书推到案上，指给你看解冻的时辰就落在今夜。'
        objective: 在交时前决定这批旧藏认领、续托还是让它入拍
        choice: 当场认领并补足差额；或只续托一期；也可先只估一件看行价再定
        immediate: 账台按文书上的时辰记下处理去向，灯火一过交时便不再改。
        near: 入拍的旧藏取不回来，续托的要另付一期费用，认领的须当场兑出差额。
      far_trigger: 这批旧藏出现在公开拍卖场上或信托再次到期时
      far_consequence: 认领的人保住旧藏却空掉手头的现银，入拍的日后只能从买家手里按行价回购；拖着不办的，价由拍行按无主定。
      exits:
      - 结清信托费用后取回旧藏离场
      - 让文书到期作废，不承担本期保管费
      bindings:
      - activity: 查对未结的走货牌
        place: 镖局
        pair: 3
      - activity: 在纱帘隔间谈一笔买卖
        place: 胡姬八角琉璃酒肆
        pair: 4
      - activity: 替她系松开的盘扣
        place: 平康坊顶层花魁琴房
        pair: 2
    婚事被家长拍板:
      source: 两家已把庚帖换过，婚书上的名字由家长代填，本人只在成礼前有一次当面说明的机会，过了这一夜就再无更改的名目。
      engines:
      - 旧礼束身
      - 第三方施压
      beats:
        trigger: '{npc}把填好名字的婚书摊开，说成礼前只留这一次当面说明。'
        objective: 在婚书落定前把本人的意思说成有人认账的话
        choice: 请家长当面重填名字；或只请人在旁见证这句说明；也可什么都不说就此作罢
        immediate: 婚书要么重抄一份，要么照旧收进匣里，当面说过的话由在座者记住。
        near: 成礼之后再说便是悔婚，两家都要有说法，届时改的不是名字而是名分。
      far_trigger: 成礼之日临近或两家再议合婚细则时
      far_consequence: 当面说清的人可以谈条件、换次序甚至退婚，但要把话担到族中说去；没说的人婚后多出一句谁都替她讲了的意思。
      exits:
      - 把婚书交还家长，当晚退出议事厅
      - 只在婚书副本上留一行附记，不参与成礼
      bindings:
      - activity: 让可信任的人见证条件
        place: 胡姬八角琉璃酒肆
        pair: 4
      - activity: 摆出两个选项
        place: 宗族祠堂
        pair: 3
    山外搜山枪声逼近:
      source: 山外搜山的号令已推到第三道坡，路口设了卡，山内粮袋按人按日递减，出山的几条路都在搜检之内。
      engines:
      - 秘密暴露倒计时
      - 资源锁定
      beats:
        trigger: '{npc}伏在岩后听完坡外那一轮号令，说搜检的圈子又收了一圈。'
        objective: 在粮袋见底前定下是连夜翻出还是往深处挪
        choice: 趁夜色从熟路出山；或往深处挪等搜检过一轮；也可先分出两个人的口粮拖几日
        immediate: 干粮按人头分过一遍，路上要带的只留一份，其余原地埋藏。
        near: 搜检再推一层就保不住了，往深处的路只有本人才认得。
      far_trigger: 搜检推到筑在山根的那道关卡或粮袋真的见底时
      far_consequence: 出山的人脱身但从此有案在身，留在山里的人只等搜检退去；被中途截下的，藏身与带路的人一并被问出来。
      exits:
      - 趁夜色沿熟路出山，不与任何人通消息
      - 退回山深处，把随身物埋妥等待搜检撤围
      bindings:
      - activity: 试探悬空栈道承重
        place: 悬空神殿
        pair: 5
      - activity: 在旧铺位上安置随身物
        place: 龙门客栈地窖
        pair: 3
    巡沙狼骑号角逼近:
      source: 沙线上的号角一夜响过三次，狼骑按水井位置分段巡沙，下一段就压到歇脚的土垒；骑手卸鞍即搜水。
      engines:
      - 时限逼近
      - 秘密暴露倒计时
      beats:
        trigger: '{npc}伏在土垒后数完第三声号角，说狼骑巡沙的下一段正对着这里。'
        objective: 在号角再响之前决定弃垒走沙还是留下装作常住的商队
        choice: 连夜拔营换水井；或就地收起行装装作商队；也可留下一个人守垒另两人先走
        immediate: 水囊重新装满，沙面上的脚印用驼毡拖过一遍，垒里的火压成暗的。
        near: 狼骑到这一段时要么扑空、要么撞上守垒的人，下次巡沙的间隔就更短了。
      far_trigger: 狼骑改按夜巡或水井被全部标记时
      far_consequence: 走沙的人失去这一处水源要另找井，守垒的被搜出随身的旧物；装商队撑过一次，下次再装就不会有人信。
      exits:
      - 收起行装沿沙脊转向下一处水井
      - 留下守垒的人与过路商队合流，退出沙线
      bindings:
      - activity: 比对沙层走位与旧图
        place: 流沙回廊炼金暗房
        pair: 5
      - activity: 查对未结的走货牌
        place: 镖局
        pair: 3
    火折子消耗殆尽:
      source: 火折子只剩三支，前两支已在回廊里点过，暗房里剩下的路按旧图还有两段，走完须一支不剩地回到入口。
      engines:
      - 资源锁定
      - 共处密闭
      beats:
        trigger: '{npc}把剩下的三支火折子摊在掌心，说照旧图还得走两段才能回到入口。'
        objective: 用剩下这几支灯定下还要不要往深处去
        choice: 按旧图走完两段；或只探一段就退；也可熄火摸黑沿边墙退回
        immediate: 点过的那一支烧到一半，另两支收进铁匣，回身的路先在心里数一遍。
        near: 火折子见底就再没有第二回，暗房深处这一段只能等下次备足再来。
      far_trigger: 回廊再开或旧图上那两段经人改动时
      far_consequence: 走完的人拿到了他想看的那一处，却从此没有照明可用；半途退的还能重来，摸黑退回的会在图上留下错的一步。
      exits:
      - 携剩余火折子退回回廊入口并熄掉明火
      - 把未探的段落记在旧图边上，当日不再深入
      bindings:
      - activity: 比对沙层走位与旧图
        place: 流沙回廊炼金暗房
        pair: 5
      - activity: 读取石坛未磨去的刻痕
        place: 长安地底暗渠方士石坛
        pair: 5
      - activity: 替她系松开的盘扣
        place: 龙门客栈地窖
        pair: 4
    父母突访:
      source: 父母未通书信便到了门下，随身带着一纸议好的亲事与两箱聘礼，口称只住三日，三日之内要见着人点头。
      engines:
      - 第三方施压
      - 旧礼束身
      beats:
        trigger: '{npc}把两箱聘礼停在门前，说只住三日，三日内要见着人点头。'
        objective: 在三日之内把自己那一边的意思摆到桌面上
        choice: 当面把话摊开讲；或先安顿他们住下再慢慢说；也可请族中长辈出面转圜
        immediate: 聘礼要么搬进偏院，要么仍停在门外，三日之期从落脚的这一夜算起。
        near: 三日一到就要给回话，搬进来的东西再抬出去，就是两家都要传的闲话。
      far_trigger: 三日期满或议定的亲家上门催复时
      far_consequence: 当面拒了的人落一个不孝的说法却保住了自己的事；含糊拖过三日的人被当成默许，往后每一步都要拿亲身去抵。
      exits:
      - 在三日期满前把聘礼原样送出门
      - 安排父母住下，自己先避开这几日的当面相逼
      bindings:
      - activity: 摆出两个选项
        place: 宗族祠堂
        pair: 3
      - activity: 用掌心温热腕上冰凉的翡翠玉镯
        place: 胡姬八角琉璃酒肆
        pair: 4
    铜钱罗盘指针乱颤:
      source: 罗盘在三处石坛上各自乱颤一次，指针偏的方位都在暗渠同一段上，方士那份旧例与石坛刻痕两头对不拢。
      engines:
      - 身份风险
      - 旧事追索
      beats:
        trigger: '{npc}把罗盘摊在石坛面上，指针在三个方位各颤一次便停不下来。'
        objective: 定下这次按旧例走还是按石坛的刻痕走
        choice: 照方士的旧例收坛；或按刻痕另改一段；也可先把两份说法都抄下来不动坛面
        immediate: 罗盘收进匣中，坛面不动，改与不改都先记在抄本上。
        near: 两份说法并排留着，谁先动坛面谁就要担下城里那一段渠的旧例。
      far_trigger: 下次开坛或暗渠那一段出了状况时
      far_consequence: 认定旧例的能保住名分，却在出状况时说不清缘由；改过刻痕的人一旦被查出擅动坛面，从此不能再入暗渠。
      exits:
      - 收起罗盘与抄本，退出暗渠回城
      - 把两份说法交方士留档，本人不再参与开坛
      bindings:
      - activity: 读取石坛未磨去的刻痕
        place: 长安地底暗渠方士石坛
        pair: 5
      - activity: 塔顶清点可携经卷
        place: 大雁塔顶避风藏经阁
        pair: 3
    前任婚礼前夜:
      source: 喜帖送到门上的当夜，旧交的那一方托人捎话说想在成礼之前见一面，见与不见都会在第二天的席面上被人拿去说。
      engines:
      - 旧情重逢
      - 名声保卫
      beats:
        trigger: '{npc}把喜帖与捎来的那句话一并放在案上，问你去不去见这一面。'
        objective: 在成礼之前把这一面见成什么样子说清楚
        choice: 当面去见说清旧话；或只捎回一句回话不见面；也可托可靠的人在旁陪着
        immediate: 去或不去都在次日席面之前定下，捎话的人带回来的只有一个字。
        near: 见过的人第二天要在席上端得住脸色，避开的则要在往后的场合里一直避开。
      far_trigger: 成礼当日或旧交另托人再捎话时
      far_consequence: 说清旧话的可以在席面上坦然，被人撞见私会的则连主家的名分一起赔进去；始终不见的，往后每一次同场都要重新躲一遍。
      exits:
      - 趁天色未明离开这条街，不赴次日的席
      - 把喜帖原样退回，只留一句道贺的话
      bindings:
      - activity: 听一支只弹给一个人听的曲子
        place: 平康坊顶层花魁琴房
        pair: 4
      - activity: 递过斟满葡萄美酒的金樽
        place: 胡姬八角琉璃酒肆
        pair: 4
      - activity: 对弈时让半子
        place: 老茶馆
        pair: 3
    婚约在身:
      source: 婚约的庚帖已压在两家案上，本人在外仍是自由身，只须一句旁人不能证实的私下承诺，就能让两头的说法各自成立。
      engines:
      - 名分悬置
      - 共同秘密
      beats:
        trigger: '{npc}问起你婚约那件事，说只须一句没人在场的话，两边的说法就都能站住。'
        objective: 决定要不要给出那句无人作证的承诺
        choice: 当面给一句口头的话；或请人见证说得明白；也可只说这一处不谈此事
        immediate: 说过的话只留在这一间里，案上那张庚帖一个字都没动。
        near: 无人见证的那句话日后谁都可以不认，两头的庚帖却始终压在案上。
      far_trigger: 两家换庚帖或婚约的一方上门问起这段来往时
      far_consequence: 留了那句私话的人随时可以被反口，也能随时反口；把事情说在明处的人失去了眼下的方便，却省下日后一场无法自证的对质。
      exits:
      - 只在这一处谈完即走，不留凭据
      - 把话说全请人记下，再退出这一场
      bindings:
      - activity: 听一支只弹给一个人听的曲子
        place: 平康坊顶层花魁琴房
        pair: 4
      - activity: 让可信任的人见证条件
        place: 镖局
        pair: 3
      - activity: 对弈时让半子
        place: 园林
        pair: 3
    戏班交割夜:
      source: 班主的地契与戏箱的典当文书在同一夜到期，戏班按旧约归行会另派，箱里的行头有三成是伶人自己垫钱添的。
      engines:
      - 组织更迭
      - 债务压力
      beats:
        trigger: '{npc}把到期的那两份文书摆在台侧，说过了今夜戏班就归行会另派。'
        objective: 在交割之前分清哪些行头是班中的、哪些是伶人垫的
        choice: 当场清点戏箱并立单据；或只认自己垫的那几件；也可什么都不要随班子一起交割
        immediate: 戏箱按单分作两堆，贴上签的搬走，没贴签的连箱一起归行。
        near: 交割之后这一班的人就散了，垫过钱的只有那张单据能替他们说话。
      far_trigger: 行会另派班底或原班主再开新戏箱时
      far_consequence: 立过单据的人日后能把垫的钱讨回来，没立的人再开箱时那几件行头已经算作班产；整班交出的人连行头带人一并归了新主，旧戏本上的名字也要改写。
      exits:
      - 持单据取走自己垫的行头，退出这一班
      - 把行头留在箱中，随班子交割，另寻门路
      bindings:
      - activity: 核对旧戏本
        place: 戏楼
        pair: 1
      - activity: 让可信任的人见证条件
        place: 胡姬八角琉璃酒肆
        pair: 4
    还俗前夜:
      source: 离寺的度牒已批下，寺中器物须在次日早课前归库，本人入寺前的那份俗家婚约还在原来的族中挂着，两边的名分只留这一夜没对上。
      engines:
      - 身份错位
      - 旧事追索
      beats:
        trigger: '{npc}把批下的度牒摊在经案上，说寺中的器物明早课前就要归库。'
        objective: 在归库之前决定这一身该还的是器物还是那句旧约
        choice: 交清器物当日下山；或留一夜再想清楚；也可请寺中人作证只还器物不论俗事
        immediate: 经卷与法器逐件点过归库，人从僧籍上划去，俗家那边还一个字没动。
        near: 下山之后寺中不再管此人，俗家那份婚约却在等着对上他现在的身份。
      far_trigger: 俗家族中来人查问此人的下落或婚约要换人时
      far_consequence: 当日下山的人要自己应付旧约那边，把寺中名分留着的人虽可暂避，却再也拿不到一张清楚的度牒；两头都拖的，最后两边都不认。
      exits:
      - 早课前交清器物，持度牒走出寺门
      - 把度牒留在经案上，暂留一夜再定
      bindings:
      - activity: 塔顶清点可携经卷
        place: 大雁塔顶避风藏经阁
        pair: 3
      - activity: 在旧铺位上安置随身物
        place: 龙门客栈地窖
        pair: 3
