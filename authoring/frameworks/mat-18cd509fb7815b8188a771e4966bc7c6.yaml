id: mat-18cd509fb7815b8188a771e4966bc7c6
name: 王朝百业与书院
material:
  eras:
  - 架空王朝
  aesthetics:
  - 工笔华服
  - 水墨写意
  - 盛唐诡谲奇谭
  - 长安夜行风物
  rule: 城内百业由行会与书院共同维系，手艺、学问和人情各有来路；名分大过心意，情面要当场结清，恩怨一律记在账上，承诺出口即作数；坊门落锁后仍在街心奔走者按夜禁罚则羁押候审，越界者照律受罚。
  social_rule: 行会许可只管营生，不决定私人交往；家族利益高于个人取舍，血统定贵贱而等级分明，联姻当生意谈，师徒名分大过天，礼数大于实话。
  places:
    古籍书店:
      details:
      - 版心残页摊在软毡上·日间
      - 窗边纸样匣远离茶炉·日间
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 书铺临街门
        witnesses:
        - 书铺掌柜
        affordances:
        - 辨认残卷版式
        - 结束活动并离开
        pressure_modifiers:
        - 纸张湿度
        - 可借版本
    戏楼:
      details:
      - 木台边留着演员退场口·午后
      - 油灯未点时排演的空台·午后
      profile:
        privacy: low
        visibility: high
        exits:
        - 台侧通道至前院
        witnesses:
        - 排练的成年伶人
        affordances:
        - 核对旧戏本
        - 结束活动并离开
        pressure_modifiers:
        - 戏班排练时辰
        - 台口尺寸
    宗族祠堂:
      details:
      - 廊下软毡承着干拓片·日间
      - 碑旁立着不可倚靠的木栏·日间
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 祠堂前院大门
        witnesses:
        - 守祠人
        affordances:
        - 整理地方碑录
        - 结束活动并离开
        pressure_modifiers:
        - 祭祀占用时辰
        - 拓片干湿
    园林:
      details:
      - 入口亭与深处凉亭遥相可见·午后
      - 短径边有能坐下歇脚的石凳·午后
      profile:
        privacy: low
        visibility: high
        exits:
        - 入口短径折返园门
        witnesses:
        - 园丁
        - 散步来客
        affordances:
        - 设计读书小径
        - 结束活动并离开
        pressure_modifiers:
        - 日晒
        - 石径雨后湿滑
    老茶馆:
      details:
      - 茶炉边传来评话声·傍晚
      - 窗边小桌压着一册掌故·傍晚
      profile:
        privacy: low
        visibility: high
        exits:
        - 茶馆前门
        witnesses:
        - 茶博士
        - 邻桌茶客
        affordances:
        - 共读地方掌故
        - 结束活动并离开
        pressure_modifiers:
        - 评话声量
        - 座位空缺
    江心画舫:
      details:
      - 停泊画舫舱壁摆着矮案·日间
      - 舷梯旁留着整条空道·日间
      profile:
        privacy: low
        visibility: high
        exits:
        - 停泊时经舷梯上岸
        - 航行时可结束谈话坐回舱内，在下一约定码头下船
        witnesses:
        - 船家
        - 同场读者
        affordances:
        - 布置水上书会
        - 结束活动并离开
        pressure_modifiers:
        - 水位风向
        - 船家确认的载客数与靠岸时辰
    大雁塔顶避风藏经阁:
      details:
      - 塔顶层级间只留一处背风角，经卷用麻绳束在木架上·夜
      - 梯口窄到只容一人顺序上下，下去的人会挡住上来的人·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 顺塔内楼梯逐层下撤，出塔门即入寺墙范围
        witnesses:
        - 守塔的僧人
        affordances:
        - 清点可携出的经卷
        - 辨认风从哪一侧的缝隙灌入
        pressure_modifiers:
        - 塔外风势与能见度
        - 僧人允许通行的更次
    悬空神殿:
      details:
      - 栈道钉在崖壁上，木板每隔数步就有替换的新料·黄昏
      - 殿门只朝东开一处，退路就是来时那一条栈道·黄昏
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 沿栈道回撤至崖下平台
        witnesses:
        - 值守的香火执事
        affordances:
        - 试探栈道承重
        - 在殿内向执事问清供奉旧例
        pressure_modifiers:
        - 栈道新旧与承重
        - 崖下灯火是否已亮起
    流沙回廊炼金暗房:
      details:
      - 回廊地面能听见流沙在板下走，脚步落点都记在门侧的旧图里·深夜
      - 暗房药柜按毒性分格，火种另收在铁匣中·深夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 循旧图退回回廊入口，撤出前须熄掉明火
        witnesses:
        - 掌钥匙的方士
        affordances:
        - 核对药柜上的旧封条
        - 比对沙层走位与旧图
        pressure_modifiers:
        - 流沙走位与板下承重
        - 明火与药性相冲
    胡姬八角琉璃酒肆:
      details:
      - 八角厅四面都能望见同一座中庭，隔间只拉一层纱帘·夜
      - 后厨与酒窖在同一道木梯上，上下都要经过账台·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 由账台侧门退入夜市巷口
        witnesses:
        - 当值的酒肆掌柜
        - 隔间来客
        affordances:
        - 在纱帘后谈一桩不便外传的买卖
        - 让账台出面记一笔赊账
        pressure_modifiers:
        - 隔间纱帘与邻座距离
        - 赊账是否已到销账日
    镖局:
      details:
      - 镖旗与走货牌挂在正厅两次，未结的走货牌压在账房案头·晨
      - 后院栓着备用的脚力，出车顺序写在门背木牌上·晨
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 由镖局正门退到街口，押货者另走出货侧门
        witnesses:
        - 当值的镖头
        affordances:
        - 查对未结的走货牌
        - 核验镖旗与押货人姓名是否对得上
        pressure_modifiers:
        - 走货牌结算期限
        - 路上关卡与匪情传闻
    长安地底暗渠方士石坛:
      details:
      - 石坛刻痕被水流磨去一半，灌水的沟槽还通着暗渠·深夜
      - 坛外只留一处提灯位，灯火照不到渠口转弯处·深夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 沿来时的暗渠铁梯原路退回城内下水口
        witnesses:
        - 同行的方士
        affordances:
        - 读取石坛未磨去的刻痕
        - 试探沟槽水位
        pressure_modifiers:
        - 暗渠水位与城中雨情
        - 提灯可照见的范围
    龙门客栈地窖:
      details:
      - 地窖酒坛沿墙排开，门从外头能上横闩·夜
      - 角落留一处旧铺位，住客名册在上头梯口柜中·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 沿地窖梯子上到灶间，再经客栈后门出巷
        witnesses:
        - 当值的店伙
        affordances:
        - 清点名册上的住客登记
        - 在地窖中换一处安置随身物
        pressure_modifiers:
        - 横闩由谁掌着
        - 灶间是否还留着人走动的响动
    平康坊顶层花魁琴房:
      details:
      - 顶层只此一间，向街的窗能合上，琴案压在窗边·夜
      - 楼下楼梯口有人应门，出入都须经那一处·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 由楼梯口下楼，经应门处退出坊门
        witnesses:
        - 坊中当值的成年乐伎
        affordances:
        - 听一支只弹给一个人听的曲子
        - 在窗前商定下次见面的时辰
        pressure_modifiers:
        - 坊中当值者的应门规矩
        - 窗是合上还是留着
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 古籍修补师
      function: 判断纸性并修补残卷与拓片
      authority: 决定自己经手残页的支撑和补纸工序
      resource: 补纸、软毡和数种版心样页
      limitation: 无法凭残字确定整卷真伪，也无权擅拆借书
      obligation: 保留原有字迹，不为完整外观补造正文
      exposure: 补错纸性会留下不可逆折痕，需赔付自己的工料
      hidden: —
    player:
      identity: 书院藏书整理人
      baseline: 你曾替修补师借到一册同版书，使其免于错补；这次由你管卷次，他管纸性。
      resources:
      - 书院旧目录
      - 向藏书人借取同版残本的介绍
      reputation: 你爱求全，但会把缺卷明写出来
    relationship_reason: 你曾替修补师借到一册同版书，使其免于错补；这次由你管卷次，他管纸性。
  - family: 学术与专业
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 书院藏书整理人
      function: 管理书院借阅并组织读书与戏本共读
      authority: 安排书院自有书册借期与书会书目
      resource: 借阅簿、戏本异文抄件与共读书目
      limitation: 不能约束戏班演法，也不能替船家决定航行
      obligation: 还书时核对页次，不把异文删成唯一版本
      exposure: 卷次失查会使后续读者借不到所需书册
      hidden: —
    player:
      identity: 戏班的司鼓老艺人
      baseline: 书会借戏楼午前空台读戏文，你按锣鼓点替他掐准每段的停顿；他便邀你同管下一次的水上书会。
      resources:
      - 用了半辈子的鼓楗与怀板
      - 一肚子随口能起的锣鼓点
      reputation: 老司鼓，起得住快板，也等得起慢词
    relationship_reason: 书会借戏楼午前空台读戏文，你按锣鼓点替他掐准每段的停顿；他便邀你同管下一次的水上书会。
  - family: 家族与继承
    position: 贴身侍从兼掌眼人
    appellations:
    - 少爷
    - 公子
    npc:
      role: 废嫡的千金
      function: 在家族内争中保住自己那一份嫁资与名分
      authority: 可支配自己名下的嫁资与陪嫁人役
      resource: 母亲留下的一匣首饰、半份未交割的嫁资文书
      limitation: 族中已夺其嫡位，无法以自己的名义在外签任何借据
      obligation: 动手前须让贴身人知道代价记在谁头上
      exposure: 一旦以陪嫁物抵债，就被坐实败家的名分
      hidden: —
    player:
      identity: 贴身侍从兼掌眼人
      baseline: 你替她辨器物的成色，也替她记着哪一笔是能认、哪一笔认下就再翻不了身。
      resources:
      - 认得成色的眼力
      - 她名下的嫁资文书副本
      reputation: 认得出真假，也认得出该不该接
    relationship_reason: 她自族中被逐出嫡位后只剩你可用；你替她掌眼看价，她替你挡族中问话，两人都知道这份差事本身没有名分。
  - family: 家族与继承
    position: 共同遗产继承人
    appellations:
    - 少爷
    npc:
      role: 同族的伯父
      function: 代管族产并按房分派每年例钱
      authority: 可中止任何一房的例钱发放与族中往来
      resource: 族产簿、各房借据与祠堂的账房钥匙
      limitation: 不能单独处置祭田，卖出须祠堂合议
      obligation: 例钱与借据须当面记入族产簿，不留白条
      exposure: 账目一旦被查出短少，他那一房的名分先倒
      hidden: —
    player:
      identity: 被废嫡的族中少爷
      baseline: 你被从嫡位拿下来之后仍挂着少爷的称呼，族中要的只是你这一房的印与份额。
      resources:
      - 一份抵出去又赎回来的房契
      - 族中旧账的抄本
      reputation: 还挂着少爷的名号，账面上却已经空了一半
    relationship_reason: 伯父代管族产，每年例钱由他手发；你被摘下嫡位后仍须在他面前签押，两人谈的是账，低头认的是同一套名分。
  - family: 传统与雅艺
    position: 服务提供者
    appellations:
    - 师傅
    - 掌柜
    npc:
      role: 胡姬酒肆的掌柜
      function: 经营八角琉璃厅的席面并给来客记赊账
      authority: 可决定谁能在纱帘隔间落座，也可当场销一笔旧账
      resource: 赊账册、隔间纱帘与后厨酒窖的门钥
      limitation: 坊中规例不许留客过夜，出面替人作保也须另立字据
      obligation: 赊账当面记在册上，不替来客隐瞒名姓
      exposure: 账册一旦被坊中执事查走，隔间里的买卖全数曝光
      hidden: —
    player:
      identity: 借酒肆谈事的中间人
      baseline: 你替两边的买卖挑见面的地方，坐哪一间、谁先到都由你排；掌柜只看你谁带来，不看你要谈什么。
      resources:
      - 一间能说上话的常座
      - 几处买卖双方的传话门路
      reputation: 排得住席面，也守得住哪句该在哪间说
    relationship_reason: 你替人挑酒肆谈事，掌柜替你把席面与赊账都记在册上；两人一致的是彼此都不问对方手里那桩买卖到底归谁。
  - family: 秩序与执法
    position: 上司
    appellations:
    - 长官
    - 团长
    npc:
      role: 巡夜校尉
      function: 督掌坊门落锁与夜间巡防的交接
      authority: 可当场羁押夜禁中仍在街面奔走的人，也可放行持凭者
      resource: 坊门钥匙、巡防更次簿与羁押候审的签牌
      limitation: 放人须留下凭据，擅放要自己承担名分
      obligation: 羁押前须问清来处，放行前须记明何人所持
      exposure: 错放一人，其责落在签牌上，不落在被放走的人身上
      hidden: —
    player:
      identity: 带队巡夜的队长
      baseline: 你带一队人走夜巡，签牌在你手里，出了坊门那一段街面就没有别的人替你说话。
      resources:
      - 一队听令的巡卒
      - 写着自己名字的签牌
      reputation: 巡夜时按凭据放人，不按熟脸放人
    relationship_reason: 校尉督掌更次，你的签牌须经他复核；两人生意上都认名分，故彼此都把话留在规矩里说。
  activities:
    辨认残卷版式:
      places:
      - 古籍书店
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}铺开两页残卷，请你将版心、行数和缺口逐一比对。'
      beats:
        trigger: '{npc}铺开两页残卷，请你将版心、行数和缺口逐一比对。'
        objective: 判断两页能否属于同一卷
        choice: 比对版心，或只替残页压边；不作判断也可看修补示范
        immediate: 两页的相合处与矛盾处分开，不能只凭纸色拼成完整来历。
        near: 存疑页暂不合订，藏书人可以再借同版残本比照。
    核对旧戏本:
      places:
      - 戏楼
      pairs:
      - 1
      category: 信息交换
      action: '{npc}在戏楼空台上照抄本念一段，请你试走纸上写的退场方向。'
      beats:
        trigger: '{npc}在戏楼空台上照抄本念一段，请你试走纸上写的退场方向。'
        objective: 分辨唱词异文与走位需要
        choice: 念一角对白，或只看演员示范；也可坐到台下听
        immediate: 一次走台显出原抄本的退场冲突，台词可保留两种演法。
        near: 书院保存原抄本，戏班自选排演版本，不把舞台改动冒充古本原文。
    整理地方碑录:
      places:
      - 宗族祠堂
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}把已晾干的拓片移到软毡上，邀你用衬纸隔开两张卷边。'
      beats:
        trigger: '{npc}把已晾干的拓片移到软毡上，邀你用衬纸隔开两张卷边。'
        objective: 让地方碑录可以翻阅而不继续磨损
        choice: 托住衬纸，或只辨认地名交由修补师整理；可拒绝处理脆片
        immediate: 卷边获得支撑，磨损处不再相互摩擦，缺字仍留空。
        near: 祠堂留下可翻阅副本，原拓片收在干燥匣中，不为补全地名描造缺字。
    设计读书小径:
      places:
      - 园林
      pairs:
      - 1
      category: 空间与退出
      action: '{npc}带你沿园林短径走到第一处亭子，问这一段是否已够。'
      beats:
        trigger: '{npc}带你沿园林短径走到第一处亭子，问这一段是否已够。'
        objective: 选出可随时折返的共读路线
        choice: 试走一亭，或留在入口等候；也可选全程坐读
        immediate: 停点按阴凉、座位和脚程调整，长短两路从入口就能分开。
        near: 下次书会分别安排亭中坐读与步行组，不要求众人走同一圈。
    共读地方掌故:
      places:
      - 老茶馆
      pairs:
