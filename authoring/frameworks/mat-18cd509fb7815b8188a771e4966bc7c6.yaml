          - "台口尺寸"
    宗族祠堂:
      details:
        - "廊下软毡承着干拓片·日间"
        - "碑旁立着不可倚靠的木栏·日间"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "祠堂前院大门"
        witnesses:
          - "守祠人"
        affordances:
          - "整理地方碑录"
          - "结束活动并离开"
        pressure_modifiers:
          - "祭祀占用时辰"
          - "拓片干湿"
    园林:
      details:
        - "入口亭与深处凉亭遥相可见·午后"
        - "短径边有能坐下歇脚的石凳·午后"
      profile:
