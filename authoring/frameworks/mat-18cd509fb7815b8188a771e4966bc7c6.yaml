  - 书会来客可以只听不读，离席前将借用书签放回竹筒。
  - 在纱帘隔间谈过的买卖，出门时由账台出面记一笔赊账，双方都不留下姓名。
  - 夜禁落锁后街面上不再有闲人，持签牌者按更次通过坊门。
