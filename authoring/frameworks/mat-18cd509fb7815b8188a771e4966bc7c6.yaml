    公馆暖阁寒疾夜:
      source: 寒疾在三更重犯，暖阁只剩一炉将尽的炭；药须连夜去城外药铺取，而取药的人一出公馆门就要向族中报备去处。
      engines:
      - 时限逼近
      - 伤病互护
