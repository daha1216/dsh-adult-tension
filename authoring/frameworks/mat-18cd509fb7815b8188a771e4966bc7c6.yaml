  aesthetics:
    - "工笔华服"
    - "水墨写意"
  rule: "城内百业由行会与书院共同维系，手艺、学问和人情各有来路。"
  social_rule: "行会许可只管营生，不决定私人交往。"
  places:
    古籍书店:
      details:
        - "版心残页摊在软毡上·日间"
