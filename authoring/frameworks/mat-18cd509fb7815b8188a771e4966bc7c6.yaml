        objective: 在炭尽之前决定由谁出门取药、又该怎么向族中报备这趟去处
        choice: 自己连夜出城取药；或先差人传话再走；也可只守着炉子等她熬过这一夜
        immediate: 炭添过一回，暖阁里留住一点热气，出门的人须在天亮前赶回。
        near: 天亮后族中会问这一夜谁不在馆里，取药这件事本身就是去处。
      far_trigger: 下一次寒疾重犯且族中已在打听夜里出入时
      far_consequence: 取药的人被记住行踪，她的病反而成了族中议她名分的由头；把取药托给外人则可断了这条线，却要当面欠下一份人情。
      exits:
      - 趁更次未换先出门取药，天亮前回馆
      - 把药方托给不属公馆的脚夫，自己留在暖阁不动
