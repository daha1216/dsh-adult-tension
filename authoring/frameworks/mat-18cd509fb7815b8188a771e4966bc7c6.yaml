  themes:
  - 珍本保存与活态传习
  - 宗族记忆中的异文
  - 书会对不同读者的开放
  - 名分与心意在婚约中的错位
  - 夜禁与坊门下的行踪
  - 旁门百业里的债务与交割
  technology_boundary: 架空王朝使用雕版、手抄、拓印、罗盘与舟运；灯火靠油灯与火折子，夜行按坊门落锁与更次通行，不使用电气照明、法术复原或即时通信。
  bridge_status: not_required
