        objective: 决定领回半份保住名分，还是拒签把整份留作日后拆账
        choice: 当场签押领回半份；或拒签并请人作证；也可先只看文书不落笔
        immediate: 签过的那一份天亮就要入族产簿，不签则院中物什当天搬空。
        near: 签押之后她在族中的名分就定在那半份上，日后再提嫡位也没了凭据。
