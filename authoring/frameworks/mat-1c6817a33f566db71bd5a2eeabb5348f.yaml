id: mat-1c6817a33f566db71bd5a2eeabb5348f
name: 量体尺与尺寸档案
material:
  eras:
    - "维多利亚雾都"
  aesthetics:
    - "工笔华服"
    - "行当正剧"
    - "暗潮涌动"
  rule: "这间铺子的软尺没有误差争议——数是真的，谁都不怀疑数，争的是谁有权知道、谁有权让它继续写下去；档册把号换回名字，知情权不靠任何人的裁量，只看簿子在谁手里。在这座把人变成一枚铜号的雾都里，只有这一间定制铺把人变回「一串只属于她的数字」。定制行当以三次试身交付一件衣：初量、毛样、光样。量体须亲手执尺、当面读数、当场落簿；读数落簿不可涂改——旧数不划掉，新数写在下面，身体的日子一页一页自己开口；胖瘦孕瞒得过全家，瞒不过一页上下相邻的两行。档册记身不记钱：钱的账在账房另一本，档册只写身体——「谁的名字在哪一页」本身就是亲密的等级。档册不出二楼；可档册会继承、会被默写、会被「献档合编」征走——档案的每次移动，都是一整墙身体知情权的移动。试身以三次回针为接触的合法刻度：毛样试身时针在布面之下走，第一针示意该收的收了，第二针示意布面之下还有余量，第三针落下之前客人随时可以叫停，叫停不收费也不记档——身体接触的合法性不在谁同意，在针数。代办量体的读数回铺当众誊档。成衣交割即两讫，但档册留底——再做第二件，永远要重新翻开那一页；裁页带走是行内最重的断交——那一页裁走，这间铺子从此「量不到她」。这门手艺与别处的规矩界线分明：课时铃的两端把边界写在钟上、铃响归零；这里没有下课铃——第三针是刻度不是终点，落簿的数永不归零，写下的日子永远有效力。片场棚与月份牌画室争的是署名与形象归属，影像复制品拍得出第二张；这里的档册是数字与身体史，是不可复制的原初记录——影像可以翻拍，旧数只此一行。舞厅大班与乐台后台的暗潮在台上台下之间流转，靠演出秩序压住；这里的暗潮压在柜子里——档册天天躺在二楼，谁都看得见，争的从来不是看不看，是让它继续写、停写，还是裁走。"
  social_rule: "这条街不问「她最近怎么了」，只问「她还是不是老尺寸」。体面人家不自己取衣——替谁量体本身就是一种亲密的授权。街面以「合身」为最高恭维：夸容貌失礼，夸手艺等于夸穿的人的眼力。档册的暗记只有执尺人认得——外行拿到簿子，也只看得见一栏一栏的数。"
  places:
    "铺面与料样架":
      details:
        - "临街玻璃擦得发亮，成捆料样挂满一面墙，量体预约当众记在台历上·日间"
        - "打烊前店伙当街翻台历销单，路人抬头就能看见谁的名字划给了哪一天·黄昏"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "推开临街玻璃门即入店堂"
          - "台历摊在柜台最外侧，谁都能指到自己的名字"
        witnesses:
          - "踩着梯子换料样的店伙"
          - "隔街呢绒庄记账的伙计"
          - "进门取衣顺便看一眼台历的老主顾"
        affordances:
          - "当众预约、改期、销单"
          - "摸料样比价"
          - "把某位小姐的名字念出声"
        pressure_modifiers:
          - "一切预约摊在街面上——想瞒下某次量体，先得过路人抬头这一关"
          - "名字上过台历，流言就有了日期"
    "裁衣大案厅":
      details:
        - "一张丈二大案居中，粉线、皮尺、剪刀吊在案头，学徒在此学「读数落簿」·日间"
        - "打烊后只剩一盏灯，师傅独自在大案上把白日的读数誊进正档·深夜"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "侧门通试身廊"
          - "后门下三级台阶即后院"
        witnesses:
          - "同案画样的学徒——手上都是活，谁也没空看谁"
          - "送扣子来的杂货伙计在门口报一声就走"
        affordances:
          - "共案各写各档"
          - "学徒对着旧档练暗记"
          - "两份手折并排比对"
        pressure_modifiers:
          - "共案而互不相看是默契不是规矩——谁停了针，谁就先起疑"
          - "学徒的眼睛是最便宜的证人，也是最贵的流言源头"
    "量体间与三面镜":
      details:
        - "三面镜、一排按长度挂的软尺、一盏侧灯，门闩装在客人手边·午后"
        - "灯只剩侧灯时，镜子里三个影子只有一个在动·夜"
      profile:
        privacy: "high"
        visibility: "low"
        exits:
          - "门闩在客人手边——进出由里侧说了算"
          - "侧门直通试身廊布帘后"
        witnesses:
          - "没有第三个人——只有三面镜里不肯错开的三双眼睛"
          - "门外的学徒，只听得见软尺滑过呢料的响"
        affordances:
          - "亲手执尺当面读数"
          - "当场落簿"
          - "叫停一次量体"
        pressure_modifiers:
          - "制度承认的身体凝视发生地——闩一落，礼法退到门外"
          - "读数出口即落簿——想咽回去的那半寸，纸比人先记住"
    "试身廊与回针线迹":
      details:
        - "一道布帘、一面立镜、一张试身凳，帘杆上留着经年的针痕·日间"
        - "帘外过针线的响动听得一清二楚，帘内的话却传不过一层呢料·傍晚"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "布帘即门——掀开即回大案厅"
          - "试身凳旁的小铃，摇一下就有人来"
        witnesses:
          - "帘外别针的学徒——只进来说「第二针好了」"
          - "在廊下等下一位试身的别家管家"
        affordances:
          - "毛样试身回三针"
          - "隔帘对话"
          - "抬手叫停"
        pressure_modifiers:
          - "帘子挡得住视线挡不住针脚声——三次回针的刻度在这里"
          - "叫停不收费也不记档，可叫停的理由写在攥着布边的指节上"
    "二楼档册室":
      details:
        - "尺寸簿按姓氏分柜，一架木梯、一盏绿灯；档册不出此室·日间"
        - "绿灯亮到后半夜，守梯的学徒换了一班，名字又添一个·深夜"
      profile:
        privacy: "high"
        visibility: "low"
        exits:
          - "木梯是唯一通道——要有人守梯"
          - "绿灯熄了，谁都别再上去"
        witnesses:
          - "守梯的学徒——上去的人都留下了名字"
          - "按约上楼看自家那一页的老主顾"
        affordances:
          - "翻档对页"
          - "默写誊抄"
          - "裁页断交"
        pressure_modifiers:
          - "档册不出二楼——每一条出路都得先把簿子挪动这个事实瞒过去"
          - "上过梯子的名字本身就是一份可被索取的名单"
    "账房与取衣柜台":
      details:
        - "钱账一本、身账一本，柜台后是叠好的成衣匣·日间"
        - "打烊盘账，两本簿子一盏灯，钱身两讫各归各柜·夜"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "柜台正面即出口——银货两讫就走"
          - "账房小门通铺面后廊"
        witnesses:
          - "柜台上的伙计——付清在柜台，从不多问楼上"
          - "等着结账的别家采买"
        affordances:
          - "结清一单"
          - "交割成衣匣"
          - "代办读数回此誊档"
        pressure_modifiers:
          - "钱与身在此制度性分家——想在钱上做文章的，最后总要上楼"
          - "柜台从不问身，可柜台见过每一只取衣的手"
    "后院裁断台与旧衬仓":
      details:
        - "拆旧改新的地方，天井雨水齐脚踝，旧衣拆出的衬里藏着上一具身体的旧数·日间"
        - "学徒把拆下的旧衬扎成捆，墨手在裁断台上按出一枚枚印子·午后"
      profile:
        privacy: "low"
        visibility: "medium"
        exits:
          - "后门即通雾巷"
          - "天井踏步上二楼后窗——公认不许走的路"
        witnesses:
          - "蹲在裁断台边拆衬的学徒"
          - "翻墙进来的邻家猫和它身后偶尔的人影"
        affordances:
          - "拆亡衣对衬里旧数"
          - "旧料改新"
          - "把不该留的东西缝进衬里"
        pressure_modifiers:
          - "最不设防的地方放着最旧的数——旧衬离院一步就是雾巷"
          - "拆出来的东西没上过档——它只属于先看见它的那双手"
    "雾巷后门与送衣马车":
      details:
        - "后巷常年积雾，马车帘一放，这一单从台历上消失·夜"
        - "车夫数着灯柱等交接，雾里认人只认靴声·深夜"
      profile:
        privacy: "low"
        visibility: "low"
        exits:
          - "马车即出口——帘一放就出巷"
          - "后门回院，铁闩从里侧落下"
        witnesses:
          - "数灯柱的车夫——他从不多看包裹"
          - "雾里同样在等的别家送衣人"
        affordances:
          - "无痕交付"
          - "帘内换衣"
          - "把一句话递进城里任何一扇后门"
        pressure_modifiers:
          - "有些主顾不能从正门取衣——交付的过渡带也是流言的出发地"
          - "雾里错过一次交接，这一单就得在巷子里过夜"
    "宅邸门厅的代办量体":
      details:
        - "东城宅邸的门厅、一盏枝形灯、管家立在第三级台阶上·日间"
        - "灯只剩枝形灯一盏，软尺在镜前比出影子，管家退到门厅另一头·傍晚"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "门厅正门——从马车直入，不经过街面"
          - "侧门通账房式的交割间"
        witnesses:
          - "立在第三级台阶上的管家——读数要过他的耳朵"
          - "端茶进来的女仆——放下就走，眼睛留在托盘上"
        affordances:
          - "代办量体"
          - "誊读数入手折"
          - "当着管家的面把某一栏念出声"
        pressure_modifiers:
          - "档册制度够不到的地方，读数第一次只凭良心"
          - "手折上的数回铺才誊档——路上那一夜，改一寸只有软尺知道"
