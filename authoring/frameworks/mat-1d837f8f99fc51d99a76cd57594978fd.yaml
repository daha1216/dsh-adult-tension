id: mat-1d837f8f99fc51d99a76cd57594978fd
name: 传媒编辑室与公开记录
material:
  eras:
  - 传媒舆论危机期
  aesthetics:
  - 都市轻悬疑
  - 暗潮涌动
  - 行当正剧
  rule: 新闻、直播与公共声明相互影响，完整记录比短片段更难被看见；私密录音、底片与未核实提纲一经导出就进了可被引用的流通链，谁能拿到原始母本，谁就握着改写公开版本的那支笔。
  social_rule: 事实、推测与评论分开标记，发布须遵守当事人授权范围；原始记录比剪辑版本更有权威，审查随时可能发生——被清算的名声同样会连带掏空同行与平台的分成，于是公开版本会替所有人的判断先落一版。
  places:
    直播平台危机会议室:
      details:
      - 待核实栏边放着未接通直播的问答提纲·午
      - 白板一角贴着尚未发出的下播声明与法务待签页·深夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 推门到平台办公走廊
        witnesses:
        - 值班编辑
        - 法务待命同事
        affordances:
        - 设计公开事实问答
        - 结束活动并离开
        pressure_modifiers:
        - 直播排期与资料权限
        - 待核实栏的空白格数
    录音棚控制室:
      details:
      - 控制台两只耳机之间亮着分轨时间线·晚
      - 监听母带贴着当日序号封条躺在机柜上层·深夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 停止回放后从隔音门去休息区
        witnesses:
        - 录音师
        affordances:
        - 编排采访章节
        - 结束活动并离开
        pressure_modifiers:
        - 棚时和监听疲劳
        - 母带封存与导出时间
    美术馆:
      details:
      - 展签旁的长凳与窗口形成一条自然采光线·午
      - 闭馆后只剩应急灯亮着的一段展线·深夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿开放展线回大厅
        witnesses:
        - 馆员与观众
        affordances:
        - 校订展览导览词
        - 关掉录音一起看一件作品
        - 结束活动并离开
        pressure_modifiers:
        - 讲解场次与展厅声量
        - 闭馆清场时间
    危机公关值班室:
      details:
      - 桌机与两部手机并排摆着，屏幕上滚动着待回应的热搜词条·深夜
      - 墙上贴着按小时更新的传播量手写表，红线已经画到表格外面·深夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从防火门下的电梯通道撤离值班室
        witnesses:
        - 值班助理
        - 通宵守着的舆情监控人
        affordances:
        - 核对舆论处置时间线
        - 结束活动并离开
        pressure_modifiers:
        - 热搜衰减周期
        - 平台私密内容处理时限
    律师楼会议间:
      details:
      - 长桌尽头摊着一张按传播量算赔偿的核算草表·午
      - 会客室里只有一台录音机被允许开机，红灯亮着·日晚
      profile:
        privacy: high
        visibility: low
        exits:
        - 由接待员带出电梯间回街上
        witnesses:
        - 对方当事人
        - 记录席职员
        affordances:
        - 逐条核对和解条款
        - 结束活动并离开
        pressure_modifiers:
        - 诉讼时效与举证期限
        - 赔偿核算的传播量口径
    老式公寓的公用厨房:
      details:
      - 灶台边并排摆着两只写名字的搪瓷缸与一张催缴单·晚
      - 窗外隔一条窄巷就是邻栋同层住户的灯·深夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 穿过公用走廊退回自己那间屋子
        witnesses:
        - 同层住户
        affordances:
        - 核对合住开销与租约
        - 结束活动并离开
        pressure_modifiers:
        - 隔音差与开门声响
        - 同层住户是否在家
    媒体圈小宴馆的包间:
      details:
      - 圆桌上摆着没动的酒瓶与一张写在餐巾上的采访提纲·晚
      - 包间门缝外能听见大堂里同行说话的声音·深夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从包间侧门绕到后巷避开大堂
        witnesses:
        - 同桌的其他媒体人
        affordances:
        - 交换一条未公开的消息
        - 结束活动并离开
        pressure_modifiers:
        - 在场者会不会转头就把话带出去
        - 席散之后还能追到谁
    通宵直播的化妆间:
      details:
      - 化妆镜前摆着两台待上播的补光灯与一张写满问题的荧光便签·深夜
      - 柜子里锁着一卷还没剪的底片与一张手写授权页·深夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 在导演组点名之前从消防楼梯下楼
        witnesses:
        - 化妆师
        affordances:
        - 核对出镜与授权范围
        - 结束活动并离开
        pressure_modifiers:
        - 开播倒计时
        - 底片授权页是否已经签字
    学术机构的通宵阅读室:
      details:
      - 长桌上摊着前一夜没看完的手稿与两张并排的借阅证·深夜
      - 走廊尽头亮着一条按小时记的巡夜灯·深夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 走廊尽头刷卡出楼，门禁会记下离开时间
        witnesses:
        - 巡夜的管理员
        affordances:
        - 核对稿件归属与致谢
        - 结束活动并离开
        pressure_modifiers:
        - 闭馆清场与门禁记录
        - 稿酬与版面归属
  pairs:
  - family: 艺术与传播
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 事实核查编辑
      function: 核对事实问答的来源与不确定性
      authority: 可否决自己负责稿件的无证表述，最终发布由值班主编决定
      resource: 原始访问副本、来源联系人与版本对照
      limitation: 不能从剪辑推定当事人动机，也没有所有内部档案
      obligation: 将事实、推测、评论分开
      exposure: 漏核会让被报道者和节目共同受损
      hidden: —
    player:
      identity: 公共节目策划人
      baseline: 你上次保住一段必要前提让他的核查有用，他愿陪你试节目节奏
      resources:
      - 棚时、分轨工程与主持人联络
      reputation: 公共节目策划人，能调节目时长但不代来源作证
    relationship_reason: 你上次保住一段必要前提让他的核查有用，他愿陪你试节目节奏
  - family: 艺术与传播
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 公共节目策划人
      function: 组织采访章节和可听的节目节奏
      authority: 可调整本节目试剪，不能擅改受访者原意
      resource: 整季选题板、受访者的回听预约与片头音乐小样
      limitation: 没有无限补录预算，不能保证澄清被同样广泛传播
      obligation: 保留必要前提并约定受访者复核范围
      exposure: 生硬剪接会让受访者停止合作
      hidden: —
    player:
      identity: 事实核查编辑
      baseline: 你逐条追过她三季节目的更正并附上自己的核查注，她约你在美术馆长凳上先看一件作品再谈节目
      resources:
      - 历次更正栏的合订页
      - 按来源可靠度分色的标签册
      reputation: 事实核查编辑，查得慢但每个标签都敢回查
    relationship_reason: 你逐条追过她三季节目的更正并附上自己的核查注，她约你在美术馆长凳上先看一件作品再谈节目
  - family: 屏幕与镜头
    position: 危机公关处理人
    appellations:
    - 直呼其名
    npc:
      role: 直播平台签约主持人
      function: 靠镜头换通告费，也靠公共形象维持商务报价
      authority: 能决定自己镜头前的说法与出镜范围，不能替平台删帖或封锁搜索
      resource: 账号后台的原始素材、一份尚未到期的排他合约与律师联络
      limitation: 被外流的内容一旦上传就无法真正回收，平台可随时按合约条款降权
      obligation: 把外流内容与原素材分开说明，不拿公众同情换流量
      exposure: 一次私密内容外流就要赔付所有品牌解约金，账号可能被直接冻结
      hidden: 她手上还有一份没交出去的备份，一直没告诉经纪团队
    player:
      identity: 被临时叫来的危机公关处理人
      baseline: 平台在事发两小时内叫到你的电话，你手里只有一份还没核实的传播路径图和一段不可转发的托付；你被要求先给出可以立刻执行的处置动作。
      resources:
      - 三条平台的内部沟通线路
      - 已经核到一半的传播路径图
      reputation: 你在热搜上收过场，也因一次强行删帖被同行记过
    relationship_reason: 你在热搜上收过场，她这次只给你两个小时和一段不能转发的原素材；你压下的每一条都在替她担责任。
  - family: 学术与专业
    position: 旧识
    appellations:
    - 直呼其名
    npc:
      role: 跑过同一条线的调查记者
      function: 追同一案子的公开记录与来源链条
      authority: 能决定自己的署名与发稿时机，不能叫停别人的跟进
      resource: 跨年度的剪报合订本、线人联络与一条自己走出来的采访路径
      limitation: 旧案的关键证人已经失联，手里的复印件不能当作原始件递出
      obligation: 写明每处推断的来源层级，不把线人暴露成证据本身
      exposure: 旧案被翻出来时第一个被找上的是当年发第一篇的那个人
      hidden: 他留着一份当年没敢发出去的稿件，谁都不知道
    player:
      identity: 当年一起跑过这条线的编辑
      baseline: 当年你们一起跑过这条线，一人跟源另一人守稿；如今旧案被翻出来，两边的说法都指向对方手里那份没交出来的东西。
      resources:
      - 当年的采访笔记与用稿记录
      - 还肯接电话的两个线人
      reputation: 你发稿前会问对方一句，也会在稿子出事时站到前面去
    relationship_reason: 当年你们一人跟源一人守稿，合写过一篇互相署名的报道；如今旧案重开，两人谁先把话说全，谁就先被记到第一篇上面。
  - family: 屏幕与镜头
    position: 竞争者
    appellations:
    - 前辈
    npc:
      role: 同时段的另一档节目主笔
      function: 以同类选题与更快的上片节奏争夺同一批观众
      authority: 能决定自家选题与播出档期，不能插手本台排期
      resource: 更高的预算与一台随时待命的后期机房
      limitation: 想挖你的来源却拿不到你的原始素材，只能靠公开信息反推
      obligation: 引用他人节目时标清出处，不把推断当既成事实发出去
      exposure: 抢跑一次误报，整个时段的口碑会连招牌一起赔进去
      hidden: 他已经拿到了片段，还留着一版更完整的核对稿没放出来
    player:
      identity: 被临时补位的栏目主笔
      baseline: 你被临时补到这个时段，手里的选题板还没填满；对方先在公开场合把你的来源名单念了一遍，而你的时间只够做出一次回应。
      resources:
      - 本时段的选题板与一次补录预算
      - 还没被对方念出来的两个来源
      reputation: 你会为了保住来源放弃一条能上热搜的稿子，同事常说这是吃亏
    relationship_reason: 他在公开场合念过你还没核实的来源名单，你手上留着一条能证明那份名单出处的消息；谁先动谁就先失去选择权。
  - family: 屏幕与镜头
    position: 知情不报者
    appellations:
    - 老板
    npc:
      role: 直播平台的公关负责人
      function: 在平台规则与公众情绪之间选一个先保住的说法
      authority: 能决定平台是否下架与限流，不能替执法或法务作出定性
      resource: 平台内容处理后台、法务咨询通道与一份可用的品牌口径
      limitation: 处置动作都要留档，一次违规干预会连带运营线一起被审计
      obligation: 说明每次处置的依据并把记录留存
      exposure: 干预不当会把平台拖进连带责任，处置记录一旦留档就再擦不掉
      hidden: 他早知道这条内容会外流，压着没有提前上报
    player:
      identity: 被平台临时挂上的外部顾问
      baseline: 平台把你挂成外部顾问，后台权限开到一半就停了；你在两天前其实已经看见过外流苗头，却没告诉任何人。
      resources:
      - 半个后台的处置权限
      - 两天前留下的浏览记录
      reputation: 你把每一次处置都写进过工作留痕，唯独这次没有
    relationship_reason: 他把你挂成外部顾问却只给半个权限，你两天前看到的苗头没上报；现在每走一步都可能把对方和自己一起留进审计记录。
  - family: 学术与专业
    position: 被求助者
    appellations:
    - 老师
    npc:
      role: 负责稿件归属与版面安排的学术期刊编辑
      function: 核定署名顺序与版权条款
      authority: 能决定期刊的署名与版面，不能替作者分配私人恩怨
      resource: 版面容期、一份待签的版权转让书与两组复核意见
      limitation: 不能替任何一方改动已经归档的投稿时间戳，也无法挡下不属于本刊的转载
      obligation: 把每处修改的来源写清，署名顺序按实际贡献与投稿时间双重核对
      exposure: 署名顺序错一次，作者的学术声誉与期刊的公信力一起受损
      hidden: 有一版文稿的投稿时间，她自己记的纸面和系统记录不一致
    player:
      identity: 在期刊做校对的旧识
      baseline: 你替这本期刊校过几年稿，在通宵阅读室的灯下和对方并排看过同一份手稿；这次争议绕到你校过的那一版上，纸面上的时间与系统里的对不上。
      resources:
      - 历次校样的留档
      - 一份能说明当时改动理由的邮件
      reputation: 你校过的稿子出问题，你会主动把自己的名字交出去一起核
    relationship_reason: 你们在通宵阅读室里并排看过同一份手稿；如今争议绕回你校过的那一版，纸面的时间与系统记录对不上，先开口的人要先担一份署名责任。
  activities:
    设计公开事实问答:
      places:
      - 直播平台危机会议室
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}圈出提纲里一句全称判断，请你指出它需要哪些证据才成立。'
      beats:
        trigger: '{npc}圈出提纲里一句全称判断，请你指出它需要哪些证据才成立。'
        objective: 缩小问题到现有材料真的能回答的范围
        choice: 逐句查证；不加入本稿；或仅留下来源待询问题
        immediate: 一条断言改为有条件表述，空栏保留待核实
        near: 下一次采访有可追问的缺口，不需强作即时结论
    编排采访章节:
      places:
      - 录音棚控制室
      pairs:
      - 1
      category: 信息交换
      action: '{npc}切换两版试剪，请你听受访者转折前是否缺了呼吸和前提。'
      beats:
        trigger: '{npc}切换两版试剪，请你听受访者转折前是否缺了呼吸和前提。'
        objective: 找到不误导原意的可听节奏
        choice: 比较试剪；不参与监听去休息；或请录音师连播原段
        immediate: 一个剪口前移，前提保留，节目多出十几秒由策划决定取舍
        near: 主持人可据此补过渡句，不迫使受访者重说答案
    校订展览导览词:
      places:
      - 美术馆
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}拿着馆方图录，请你把展签年份对回作品登记项。'
      beats:
        trigger: '{npc}拿着馆方图录，请你把展签年份对回作品登记项。'
        objective: 确认一处导览词是否混淆创作与展出年份
        choice: 核对登记；不校稿正常看展；或把疑问交馆员查询
        immediate: 两种年份拆开，不用猜测填满展签
        near: 馆方能针对具体行修订，整场展览无需暂停
    关掉录音一起看一件作品:
      places:
      - 美术馆
      pairs:
      - 0
      category: 日常接触
      action: '{npc}收起采访设备，在长凳上问你这幅画让你先想到什么。'
      beats:
        trigger: '{npc}收起采访设备，在长凳上问你这幅画让你先想到什么。'
        objective: 在不产出节目的时间里交换私人审美
        choice: 聊一会；独自看别处；或安静并坐
        immediate: 评论不录入节目提纲，允许和专业判断不同
        near: 下次合作多一个非工作话题，不产生采访授权
    在隔音棚外等门里那句录完:
      places:
      - 录音棚控制室
      pairs:
      - 2
      category: 身体靠近
      action: '{npc}把监听耳机只分你一只，问你隔着这层玻璃听不听得清里面那句话。'
      beats:
