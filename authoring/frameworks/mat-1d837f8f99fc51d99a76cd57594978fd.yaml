        - "直播平台危机会议室"
      "pairs":
        - 0
      "category": "调查与核验"
      "action": "{npc}圈出提纲里一句全称判断，请你指出它需要哪些证据才成立。"
      "beats":
        "trigger": "{npc}圈出提纲里一句全称判断，请你指出它需要哪些证据才成立。"
        "objective": "缩小问题到现有材料真的能回答的范围"
        "choice": "逐句查证；不加入本稿；或仅留下来源待询问题"
        "immediate": "一条断言改为有条件表述，空栏保留待核实"
        "near": "下一次采访有可追问的缺口，不需强作即时结论"
    "编排采访章节":
