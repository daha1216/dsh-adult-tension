        "objective": "确认一处导览词是否混淆创作与展出年份"
        "choice": "核对登记；不校稿正常看展；或把疑问交馆员查询"
        "immediate": "两种年份拆开，不用猜测填满展签"
        "near": "馆方能针对具体行修订，整场展览无需暂停"
    "关掉录音一起看一件作品":
      "places":
        - "美术馆"
      "pairs":
        - 0
