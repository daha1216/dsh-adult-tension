id: "mat-232c29d387b257da9f10218587eba099"
name: "民国报馆与手艺街"
material:
  eras:
    - "旧式民国都市"
  aesthetics:
    - "旧年代质感"
    - "黑色电影"
    - "行当正剧"
    - "禁酒令爵士黑帮"
    - "芝加哥暗夜交锋"
  rule: "报馆、作坊和街坊以纸面广告与当面交接维持城市生活；体面靠自己撑，名分大过心意，声誉即资本，代价可分期偿还；恩怨都记在账上，旧情不许重提，有些名字不能提。"
  social_rule: "采访必须区分受访者原话与编辑意见；人情网络优先，潜规则重于明文，家族利益优先，联姻当生意谈；外人闲话能砸饭碗，名声会被清算，审查随时可能发生，金钱通行，公开版本会影响所有人的判断。"
  places:
    民国公馆:
      details:
        - "胶片建筑照片靠在壁炉边·午后"
        - "住户在有窗的会客室口述旧事·午后"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "会客室通往前厅与临街大门"
        witnesses:
          - "应邀讲述的住户"
          - "带路的管家"
        affordances:
          - "整理老建筑专页"
          - "结束活动并离开"
