        place: 保姆车后座
        pair: 0
      - activity: 保姆车里对完台本
        place: 保姆车后座
        pair: 3
    点名前的空床位:
      source: 熄灯点名前她的床位空着，宿管手电已上楼梯
      engines:
      - 天亮失效
      - 共同秘密
