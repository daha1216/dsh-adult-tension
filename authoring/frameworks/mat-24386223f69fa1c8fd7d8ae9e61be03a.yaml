        trigger: '{npc}收到消息：熄灯点名前她的床位还空着，宿管的手电已经上到二楼。'
        objective: 在手电照到走廊尽头之前把人送回房
        choice: 替她在点名册上应付过去，或陪她把今晚的事说完再回去；也可以先回自己房间装睡
        immediate: 声控灯一亮一灭之间，替人应付的那一行字就成了共同秘密的第一笔。
        near: 天亮之后谁也不记得点名册上那行字，但两个人都记得走廊里说了什么。
      far_trigger: 下一次点名她再不在床上时
      far_consequence: 帮着瞒的人从今晚起一起承担「知情」两个字——在条款的世界里，知情与违约同价。
