  technology_boundary: 千禧年前后的娱乐工业栈：短信打榜、电台热线、纸质票根、胶片底片、寻呼机与手写信件并存；热度以周榜位次、杂志销量、电台点歌次数与歌友会售票速度度量。不预设智能手机、实时热搜、社交媒体、GPS定位或云端备份；绯闻的传播靠周刊印刷周期与口碑慢慢发酵。底片只有实体一份，既是威胁也是护城河——烧掉它，谁都别想再洗出第二张。
  bridge_status: not_required
