id: mat-24386223f69fa1c8fd7d8ae9e61be03a
name: 恋爱禁令与歌友会
material:
  eras:
  - 千禧年前后
  aesthetics:
  - 旧年代质感
  - 温柔颓丧
  - 暗潮涌动
  rule: 艺人合约第七条：合约期内禁止真实恋爱，被拍到即触发违约流程——违约金、冻结期、道歉记者会，价目写在附页，违约可以定价，心动不可以。但这一行卖的恰恰是恋爱的可能性：表演性亲密须事先报备，核准的不算恋爱；官方CP台本、公司安排的相亲饭局与联姻考察都是核准项，是能盖章的假恋爱，唯一被禁的是不报备的真心。粉丝信件、应援物与歌友会环节属于商品，粉丝也是条款的共同执行人。绯闻从传出到登刊有七天窗口，按下去还是递出去各有各的价。这份禁令护的不是人、是人设资产：违反的后果是金融性的索赔与解约，不是行政性的转出安置；要藏的也从来不是身份——脸对全国公开，藏的只是感情本身。
  social_rule: 台上感谢粉丝只说「大家」，握手三秒、签名竖排，超时的体面由保安的轻拍提醒。圈内默认假绯闻当宣传放、真绯闻花钱压，价目随版面走。前辈后辈的账分开算：谁替谁挡过事，比谁爱谁更值得记住。
  places:
    事务所练习室:
      details:
      - 整面镜墙把灯下的动作照成双份，前台贴着门禁时刻表·夜
      - 音响单曲循环到副歌，地板上叠着两瓶没开的水·夜
      profile:
        privacy: low
        visibility: medium
        exits:
        - 消防通道
        - 经前台门禁的正门
        witnesses:
        - 值班练习生
        - 编舞师
        affordances:
        - 把一组动作加练到熟
        - 对一遍走位
        pressure_modifiers:
        - 门禁时间
        - 镜子里谁在看
    企划部小会议室:
      details:
      - 白板上还留着没擦的档期表，长桌一端摞着待签的续约文件·日间
      - 传真机吐出周刊的联络函，法务把条款夹翻到附页那栏·日间
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 走廊
        witnesses:
        - 企划总监
        - 法务
        affordances:
        - 对口径
        - 改条款
        pressure_modifiers:
        - 白板公示
        - 续约季
    歌友会签售通道:
      details:
      - 铁马围出的通道贴满应援色纸，会员牌在门口排成纵队·午后
      - 签字桌后竖排码着待签的专辑，纸巾盒压在桌角·午后
      profile:
        privacy: low
        visibility: high
        exits:
        - 安检口
        witnesses:
        - 保安
        - 会员粉丝
        affordances:
        - 签名
        - 握手三秒
        pressure_modifiers:
        - 队列长度
        - 应援规矩
    保姆车后座:
      details:
      - 深色车帘拉上后只剩一角街灯，前排椅背挂着台本与一副耳机线·夜
      - 车载电台放着别台的点歌节目，后视镜上挂着她送的平安符·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 车门
        witnesses:
        - 司机（只听不看）
        affordances:
        - 对台本
        - 闭眼歇十分钟
        pressure_modifiers:
        - 行车路线
        - 途中记者
    电台导播间:
      details:
      - 推子面板上贴着延时七秒的红标，热线灯一排编号·深夜
      - 念到一半的听众来信折着角压在台本底下·深夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 导播门
        witnesses:
        - 导播
        - 值班主持
        affordances:
        - 掐掉半句话
        - 念听众来信
        pressure_modifiers:
        - 延时七秒
        - 热线灯
    合宿楼熄灯走廊:
      details:
      - 声控灯只亮到走廊中段，各房门牌下压着当日点名回执·深夜
      - 楼梯间的铁门虚掩着，宿管的手电光在楼下晃·深夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 楼梯间
        witnesses:
        - 宿管阿姨
        - 同团体成员
        affordances:
        - 把人送回房
        - 门口道晚安
        pressure_modifiers:
        - 点名时刻
        - 走廊声控灯
    周刊社门口停车场:
      details:
      - 发车前夜班出租排成一列打着表，街口报刊亭的卷帘门落了一半·夜
      - 对面楼顶有一小块反光不对，保安亭的灯照不到那个角度·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 街口
        witnesses:
        - 狗仔
        - 保安
        - 夜班司机
        affordances:
        - 认镜头
        - 绕路走
        pressure_modifiers:
        - 发车时间
        - 闪光灯
    跨年舞台后台通道:
      details:
      - 快换架上挂着下一场的亮片裙，对讲机里倒数声混着场内的喊声·深夜
      - 通道顶灯白得照出每个人的脸色，舞台口的风一阵阵灌进来·深夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 舞台口
        witnesses:
        - 舞台监督
        - 快换师
        affordances:
        - 换装
        - 候场
        pressure_modifiers:
        - 对讲频道
        - 倒计时
    旧练舞房屋顶天台:
      details:
      - 晾衣绳上还挂着谁忘收的旧练功服，水塔边的矮墙正对写字楼顶层的灯·深夜
      - 唯一的消防门从里面闩着，风把天台上的灰吹成一道细线·深夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 唯一的消防门
        witnesses:
        - 无人常至（消防门从里面闩上）
        affordances:
        - 把真话说完
        - 看一会儿夜景
        pressure_modifiers:
        - 门只从里面开
        - 夜里风大
  pairs:
  - family: 屏幕与镜头
    position: 上司
    appellations:
    - 制作人
    - 前辈
    npc:
      role: 国民度顶点的玉女歌手
      function: 录音棚里磨专辑、上周榜节目、在歌友会里维持零绯闻的国民初恋形象
      authority: 宣传口径的一票否决权——从通稿标题到台本删减，她点头才算数
      resource: 几个尚未官宣的顶级代言与来年巡演的档期
      limitation: 团队严防任何绯闻苗头，狗仔比粉丝更清楚她的行程
      obligation: 维持清纯无瑕的人设，绯闻坐实即触发第七条违约流程
      exposure: 底片外流即全行业封杀，违约金按剩余合约年限翻倍
      hidden: 叛逆清冷的骨子里，对被强势公关彻底支配有隐秘依赖——条款压得越紧，越想有人替她拿一次主意
    player:
      identity: 她的经纪人条线直属上级，入行第三年，白天替她签字定档期
      baseline: 白天的职权不带进这扇门，你知道她也在看你懂不懂这一点。
      resources:
      - 一张能定她档期与调休的签字权
      - 对她合约与绩效的正式评价权
      reputation: 从不占用艺人私人时间的上级——正是这一点让她今晚只问你一个人
    relationship_reason: 出道三年你替她签下每一张定档期的字，今晚她把一通电话递到你面前，只问你要按哪条处理。
  - family: 商业与产业
    position: 相亲对象
    appellations:
    - 老师
    - 直呼其名
    npc:
      role: 财阀联姻考察对象
      function: 出席唱片公司安排的饭局与慈善晚会，替家族评估这桩拓展性合作的账面
      authority: 家族基金在唱片公司债权结构里的一席，续约谈判桌上有她的座次
      resource: 介绍人的双重背书与一份体面退出的台阶
      limitation: 联姻考察以家族账目为凭，动真感情即出局
      obligation: 维持考察期的得体——不追问、不表态、不给周刊留一个字
      exposure: 考察报告里写下「行为不检」，两家合作当场作废
      hidden: 她比谁都清楚这是假恋爱通行证，偶尔想把「核准过的」演成真的
    player:
      identity: 事务所安排的拓展性会面对象，第一次见面
      baseline: 双方都被介绍人夸张过，今晚是第一次核对真实版本。
      resources:
      - 介绍人那边的双重背书
      - 一个可以体面退出的台阶
      reputation: 条件拿得出手、也不勉强人的相亲对象
    relationship_reason: 事务所把饭局订成「拓展性会面」，介绍人双重背书——核准过的不算恋爱，你们各自都清楚这张通行证的有效期。
  - family: 艺术与传播
    position: 前任
    appellations:
    - 直呼其名
    - 前辈
    npc:
      role: 出道前的同练习生、现任编舞总监
      function: 排巡回的舞、定站位、把主创要的效果一帧一帧抠出来
      authority: 排练表与站位表的定夺——主创一句话就能换人，她就是那句话的执行者
      resource: 只有两人知道的出道前旧事，与对你这些年完整的见证
      limitation: 主创一句话就能换人，她的定夺权同样是借来的
      obligation: 巡演没散场不能换人，台上的分寸台下的规矩
      exposure: 出道前那段旧情被写成练习生宿舍丑闻，两个人一起完
      hidden: 八年前那晚先转身的是她，此后她的每支舞你都认得出出处
    player:
      identity: 分手多年后重新站到排练表同一边的人
      baseline: 身体和习惯都还记得，身份却已经没了，一切要重新谈。
      resources:
      - 练习室储物柜那把她一直没换的旧锁钥匙
      - 对她出道前到如今这些年的完整见证
      reputation: 分得体面、也没在外人面前说过她坏话的那一任
    relationship_reason: 出道选拔那晚分手，八年后她拿着编舞总监的排练表走回来——她成了能决定你留不留在行业里的人。
  - family: 服务与手艺
    position: 知情不报者
    appellations:
    - 哥哥
    - 直呼其名
    npc:
      role: 巡回演出的跟妆造型师
      function: 上台前修脸、中场补妆、把艺人最狼狈的样子挡在镜子与门之间
      authority: 化妆间的门与镜前灯归她管，跟妆椅上坐着的时刻谁也不能打扰
      resource: 一只跟了三张巡演的旧化妆箱，和化妆单背面随手记的时间线
      limitation: 手艺跟着巡演走，这一季结束下一站在哪她说了不算
      obligation: 妆前的素颜与镜子里听到的话，不出这间化妆间
      exposure: 被写成替谁递话传信，往后没艺人敢让她近身
      hidden: 那条录音带她一直没转交——不是没机会，是想先听你打算怎么办
    player:
      identity: 镜子前听见那通电话、认出那件外套的人
      baseline: 她知道你知道，今晚跟妆的十分钟里她要确认你的沉默是有价还是出于私心。
      resources:
      - 未公开的关键对话纸质凭证
      - 一条还没转交的录音带
      reputation: 嘴极严、但一旦被逼到绝境会毫无保留交底
    relationship_reason: 镜子跟前你听见她压低声音的那通电话，又认出她替人收进箱底的那件外套——她知道你知道，跟妆椅成了你们唯一能独处的十分钟。
  activities:
    对一遍明天的官方口径:
      places:
      - 企划部小会议室
      pairs:
      - 0
      - 1
      - 2
      category: 信息交换
      action: '{npc}把明天的通稿和台本在长桌上摊开，说口径要一条一条过，问你有哪条要先改。'
      beats:
        trigger: '{npc}把明天的通稿和台本在长桌上摊开，说口径要一条一条过，问你有哪条要先改。'
        objective: 在法务下班前把口径与条款对齐，把不该说漏的那条圈出来
        choice: 把关键问题写在纸上逐项确认，或只口头过一遍；有疑问可先压下不签
        immediate: 白板上的定稿多出一行框住的字，纸上不留任何人的名字。
        near: 明天照新口径答，圈出的那条没人再提，写过字的纸当场销掉。
    练习室加练到锁门:
      places:
      - 事务所练习室
      pairs:
      - 0
      - 2
      category: 照护与修复
      action: '{npc}把音响倒回副歌那一节，说再来一遍就走，眼神却落在门禁表上。'
      beats:
        trigger: '{npc}把音响倒回副歌那一节，说再来一遍就走，眼神却落在门禁表上。'
        objective: 在门禁之前把这一段磨顺，也把今晚谁都没说破的事放一放
        choice: 教她一个发力的小动作，或只把热的那份便当推过去；累到极处也可以提前收
        immediate: 镜子里两个人的喘息对上又分开，地板上的脚印多了一层。
        near: 门禁到点消防通道的门在背后合上，明天排练表照贴，今晚这一遍不记考勤。
    签售通道走完最后一排:
      places:
      - 歌友会签售通道
      pairs:
      - 0
      - 1
      category: 日常接触
      action: '{npc}在最后一排粉丝面前签下竖排的名字，抬眼看见你还站在铁马外。'
      beats:
        trigger: '{npc}在最后一排粉丝面前签下竖排的名字，抬眼看见你还站在铁马外。'
        objective: 把最后一排签完，也让通道里的每一秒都符合应援规矩
        choice: 先开口叫她的名字，或只把纸巾递过铁马；也可以退到安检口外等
        immediate: 握手三秒被保安的轻拍收束，最后一张专辑上多了一句手写的谢字。
        near: 散场后队列名册归档，谁在最后一刻开口叫了名字，明天的应援信里就会有人提起。
    保姆车里对完台本:
      places:
      - 保姆车后座
      pairs:
      - 0
      - 1
      - 3
      category: 身体靠近
      action: '{npc}把台本摊在座椅上，说还有两页，司机今晚只听不看。'
      beats:
        trigger: '{npc}把台本摊在座椅上，说还有两页，司机今晚只听不看。'
        objective: 到场馆之前把台本对完，也把帘子这一侧的时间用完
        choice: 替她挡下一通打来的电话，或分一只耳机各听各的；也可以各自闭眼歇十分钟
        immediate: 电话被你按掉的那一秒她的肩膀松了半寸，台本上勾掉一行。
        near: 车到场馆门口帘子拉开，后排的话留在车里，司机不会回头看后排。
    导播间掐掉半句话:
      places:
      - 电台导播间
      pairs:
      - 0
      - 2
      category: 第三方与打断
      action: '{npc}坐进热线位，红灯亮起前回头问你，今晚这段要不要留成录音。'
      beats:
        trigger: '{npc}坐进热线位，红灯亮起前回头问你，今晚这段要不要留成录音。'
        objective: 在延时七秒里把不该播的那半句处理干净
        choice: 让对方决定是否打开录音，或示意导播把话题转回事务；也可以只按报备过的口径念
        immediate: 推子落下的那半秒里只有你们知道少了哪半句，热线灯照常闪。
        near: 节目播完母带归档，掐掉的那段只有导播间里的三个人知道存在过。
    熄灯前把人送回走廊:
      places:
      - 合宿楼熄灯走廊
      pairs:
      - 0
      - 3
      category: 空间与退出
      action: '{npc}在声控灯亮起的走廊尽头站定，说就送到这，点名之前还有十分钟。'
      beats:
        trigger: '{npc}在声控灯亮起的走廊尽头站定，说就送到这，点名之前还有十分钟。'
        objective: 在宿管的手电上楼之前把人送回房，把今晚的事收个尾
        choice: 坐到离楼梯间更近的位置等她进门，或在门口把当晚互动明确收束再走
        immediate: 声控灯灭了一盏又亮一盏，房门合上的那一声比道晚安更响。
        near: 点名册上她的名字被画上勾，走廊恢复安静，谁也没再提楼下那半小时。
    停车场里认出长焦镜头:
      places:
      - 周刊社门口停车场
      pairs:
      - 2
      - 3
      category: 调查与核验
      action: '{npc}在夜班出租车队旁边忽然放缓脚步，说街口那块反光不对。'
      beats:
        trigger: '{npc}在夜班出租车队旁边忽然放缓脚步，说街口那块反光不对。'
        objective: 在闪光灯亮起之前确认镜头在等谁
        choice: 当场核对一条时间线，或先说明自己不知道什么；也可以拉着她绕路走
        immediate: 绕开的两个街口把话走没了，长焦有没有拍到只有洗出底片的人知道。
        near: 发车时间一到底片跟着车走，七天窗口从今晚开始数。
    后台通道里换一次装:
      places:
      - 跨年舞台后台通道
      pairs:
      - 0
      - 2
      category: 身体靠近
      action: '{npc}在快换架前背过身张开手臂，说还有八分钟，拉链在后背。'
      beats:
        trigger: '{npc}在快换架前背过身张开手臂，说还有八分钟，拉链在后背。'
        objective: 在对讲机报幕之前把这一身换完
        choice: 替她拉上背后的拉链，或把外套先披在她肩上；她也可能下意识揪住你的后衣角
        immediate: 拉链到顶的那一下两个人的手都停了半拍，对讲里喊了下一组。
        near: 散场后这身亮片裙挂回快换架，通道里谁拉过谁的拉链没人看见，倒计时也不会记。
    天台上把真话说完:
      places:
      - 旧练舞房屋顶天台
      pairs:
      - 0
      - 2
      category: 日常接触
      action: '{npc}推开消防门把风放进天台，说门从里面开，今晚想把一句话说完。'
      beats:
        trigger: '{npc}推开消防门把风放进天台，说门从里面开，今晚想把一句话说完。'
        objective: 在风把话吹散之前把这一句说完，或者就此不说
        choice: 承认自己紧张，或问一句不该问的；也可以只陪她看一会儿夜景
        immediate: 说出口的那句没有回音，只有对面写字楼顶层的灯还亮着。
        near: 消防门从里面重新闩上之前谁都没先走，下楼的一切照旧口径。
  customs:
  - 歌友会握手三秒，超时保安轻拍椅背，全场都当没看见。
  - 保姆车前排不回头看后排，「司机只听不看」是全行业的默契。
  pressures:
    发车前七天的底片:
      source: 周刊社手里多了停车场长焦底片，发车前还有七天
      engines:
      - 秘密暴露倒计时
      - 名声保卫
      beats:
        trigger: '{npc}收到消息：周刊社手里多了停车场那卷长焦底片，发车前还有七天。'
        objective: 在底片上机印刷之前决定按下去还是买回来
        choice: 花钱托人把底片买断，或放它登出来看谁先慌；也可以先查拍到的到底是谁
        immediate: 买断的钱走宣传预算的暗账，登出来的话七天窗口从见报那天起算。
        near: 底片只有实体一份，落在谁手里谁就握着下一季的定价权。
      far_trigger: 第七天凌晨印刷机开机前
      far_consequence: 按下去的登成跨年第一期头条，买回来的连同一纸封口协议锁进保险柜——价签从此挂在她合约的附页上。
      exits:
      - 把底片原件交到她本人手里后退出这场交易
      - 照常发刊，从此不再接周刊社的电话
      bindings:
      - activity: 停车场里认出长焦镜头
        place: 周刊社门口停车场
        pair: 2
      - activity: 停车场里认出长焦镜头
        place: 周刊社门口停车场
        pair: 3
    官方CP加印三页:
      source: 企划部把官方CP剧本加三页，牵手环节提进歌友会
      engines:
      - 伪装情侣营业
      - 绝对禁止恋爱条约
      beats:
        trigger: '{npc}收到消息：企划部把官方CP的台本加了三页，牵手环节提进歌友会。'
        objective: 在报备单签字之前决定这三页是生意还是圈套
        choice: 照单核准把假情侣演满，或划掉牵手那行改走位；也可以借口嗓子罢录
        immediate: 核准盖章的那份进了法务抽屉，按条款这是营业不是恋爱——写在纸上确实不算。
        near: 歌友会当天台下举的应援牌按CP色做了，散场后谁先松手谁付话术的账。
      far_trigger: CP环节第一次真人牵手那天
      far_consequence: 演得像的拿走续约的糖，演砸的上违约条款清单——心跳不在报备范围里，这恰恰是第七条最毒的地方。
      exits:
      - 在报备单上签「仅限台本」并留底
      - 退回三页台本，接手别的企划
      bindings:
      - activity: 导播间掐掉半句话
        place: 电台导播间
        pair: 0
      - activity: 导播间掐掉半句话
        place: 电台导播间
        pair: 2
    签约晚宴的旧人:
      source: 相亲饭局订在签约当晚，坐进来的是八年前那个人
      engines:
      - 旧情重逢
      - 身份错位
      beats:
        trigger: '{npc}收到消息：事务所订的相亲饭局就在签约当晚，而介绍人报上来的名字是八年前那个人。'
        objective: 在介绍人敬酒之前把这顿饭吃成饭
        choice: 照核准流程把这顿饭走完，或提前离席把台阶让给她；也可以当作从未认识
        immediate: 双重背书在桌上摆着，这顿饭在报表里是拓展性会面——核准过的不算恋爱，你们比谁都熟这套话术。
        near: 饭局纪要次日进企划部档案，两位当事人的旧账只活在没有纪要的那部分。
      far_trigger: 两家开始交换合作意向书时
      far_consequence: 联姻考察和旧情只能留一个在台面上，另一个转入只有你们知道的地下层。
      exits:
      - 按介绍人口径体面收场，各自回家
      - 当场退掉这桌饭，向事务所报备「未成」
      bindings:
      - activity: 对一遍明天的官方口径
        place: 企划部小会议室
        pair: 1
      - activity: 对一遍明天的官方口径
        place: 企划部小会议室
        pair: 0
    重组名单只留一个位:
      source: 团体重组名单下来，C位只有一个伴舞位有三个
      engines:
      - 名额只能给一个人
      - 组织更迭
      beats:
        trigger: '{npc}收到消息：重组名单下来了，C位只有一个，伴舞位有三个。'
        objective: 在名单公示上墙之前把位置的事说清
        choice: 把名额让出去换一个留下的位子，或正面争这一个；也可以先退团把选择权拿回来
        immediate: 名单在排练厅传阅的那一圈里，谁跟谁走得近第一次写进了别人的评估。
        near: 落选的人转去别的团，留下的那个欠的人情按圈内规矩记账——谁替谁挡过事，比谁爱谁更值得记住。
      far_trigger: 新名单第一次合练那天
      far_consequence: 让出去的人从此在每一份站位表上排后面，争到的人从此每个深夜都欠一个解释。
      exits:
      - 签字确认新名单后照常归队
      - 拒签重组附页，转入个人发展轨道
      bindings:
      - activity: 练习室加练到锁门
        place: 事务所练习室
        pair: 0
      - activity: 练习室加练到锁门
        place: 事务所练习室
        pair: 2
    热线里多说的那半句:
      source: 电台热线她把「我」说成「我们」，延时器只掐住一半
      engines:
      - 消息误发
      - 两副面孔
      beats:
        trigger: '{npc}收到消息：热线里她把「我」说成了「我们」，延时七秒只掐住一半。'
        objective: 在下周杂志的听写栏登出来之前统一口径
        choice: 承认口误请求剪掉存档，或把「我们」圆成团称；也可以让导播吞掉整段
        immediate: 掐掉的半句躺在导播间的母带里，播出去的半句已经进了听众的收音机。
        near: 点歌台的留言开始猜「我们」是谁，猜中的人写信来只写名字不写理由。
      far_trigger: 那期节目被做成周年重播时
      far_consequence: 剪掉的母带成为呈堂的旧账，没剪的那半句成为粉丝之间传了十年的暗号。
      exits:
      - 申请销毁那段母带并登更正启事
      - 照常重播，从此电台只接事务性连线
      bindings:
