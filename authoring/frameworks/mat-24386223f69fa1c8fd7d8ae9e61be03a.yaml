        immediate: 排练表上你的名字排在她手下第一个，八年前先转身的人如今拿着笔。
        near: 每一个八拍的纠正都像在还一句旧话，练功服湿透的时候谁都装不了不认识。
      far_trigger: 巡演首演谢幕那天
      far_consequence: 站位表定稿那一刻谁欠谁一句八年前的解释就定了——台上一个眼神，台下再无对质的机会。
      exits:
      - 按新排练表归队，旧事不谈
      - 递交换组申请，把旧案留在排练厅外
      bindings:
