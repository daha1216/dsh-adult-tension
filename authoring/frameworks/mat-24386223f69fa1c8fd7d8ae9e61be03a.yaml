      - activity: 熄灯前把人送回走廊
        place: 合宿楼熄灯走廊
        pair: 3
    违约条款抬高一档:
      source: 续约夜法务把违约条款又抬一档，签字笔递过来
      engines:
      - 债务压力
      - 信任透支
      beats:
        trigger: '{npc}收到消息：续约夜法务把违约条款又抬了一档，签字笔已经递到面前。'
        objective: 在笔落到纸上之前算清这一档加在谁身上
        choice: 当场签下换资源，或划掉那一档再谈；也可以把笔放下改约明年
        immediate: 抬高的那一档数字写在附页，心的部分不写——违约金可以定价，心动从没进过价目表。
        near: 签了的人在下一季处处小心，没签的那位把话筒留在桌上走出会议室。
      far_trigger: 第一次有人按新条款被索赔时
      far_consequence: 抬高的价码落在每个后辈的合约上，那晚递笔与接笔的两个人再见面只谈档期。
      exits:
      - 划掉新增条款后签字留底
      - 拒签并当场要回旧约原件
