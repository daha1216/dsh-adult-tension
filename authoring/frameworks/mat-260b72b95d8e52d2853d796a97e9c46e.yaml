        - "婚礼宴会厅"
      "pairs":
        - 0
      "category": "空间与退出"
      "action": "{npc}请家庭代表在场，邀你从入口走一遍纪念照片之间的通道。"
      "beats":
        "trigger": "{npc}请家庭代表在场，邀你从入口走一遍纪念照片之间的通道。"
        "objective": "让不同身高与步速的来客都能自行观看"
        "choice": "试走移架；不参与布置；或只做坐姿视线检查"
        "immediate": "展架避开入口，照片间留出转身位置"
        "near": "家庭可选择是否举办，不因试摆生成宴会消费"
  "customs":
    - "活动结束可以直接离开，也可以在留言纸上写下下一次想做的事。"
  "pressures":
    "共享会客区临时维修":
      "source": "预约空间需要临时关闭检修"
      "engines":
        - "资源锁定"
        - "债务压力"
      "beats":
        "trigger": "{npc}收到消息：预约空间需要临时关闭检修。"
        "objective": "另选参与者都愿意去的地点"
        "choice": "询问替代场地，或延期取消"
        "immediate": "屋主暂停本次会客，借来的折椅先不搬入；退费与换址分开询问。"
        "near": "愿意改地点的人重新确认费用，其余人退出不承担新增场租。"
      "far_trigger": "维修跨过原定包月活动期"
      "far_consequence": "书会可转为轮流邀请或停办，协调员需退回未用共同款项。"
      "exits":
        - "取消本次书会并归还折椅"
        - "仅自愿者去免费公共阅读区，各自承担交通"
      "bindings":
        -
          "activity": "试排共享书会"
          "place": "高级公寓"
          "pair": 0
