        choice: 当面问清缺页记着谁；新册另起，旧册原样封存
        immediate: 观影单的宾客栏空着，旧记录合在案上，庭院的幕布已经挂起
        near: 新册每记一位客人都过你的眼，旧缺页仍由她一个人守着
      far_trigger: 观影会当天有宾客认出旧册缺的那一夜
      far_consequence: 缺页被外人翻出来，管家的去留就成了家宴上的议题；封存旧册则那一夜的门内事仍只在她手里
      bindings:
      - activity: 设计庭院观影单
        place: 私家宅邸
        pair: 2
      - activity: 在擦背隔间里交出一样东西
        place: 洗浴中心
        pair: 0
      exits:
      - 新册另起并注明旧册封存，缺页之事不再追
      - 当晚只谈选片，宾客名单改日再定
    加钟的单子越过了服务栏:
      source: 熟客把加钟单上的项目写过了服务栏的边界，前台按流程只认签字；单子退了丢的是钟点，签了过界的就是她自己，收市前这张单必须落个去处。
      engines:
      - 两副面孔
      - 名声保卫
      beats:
        trigger: '{npc}把那张加钟单推过夹板，越界的那一栏被指甲划了一道。'
        objective: 在前台锁柜之前决定这一单退掉还是补记
        choice: 按退单流程当场作废；在备注栏补记越界一句再签
        immediate: 单子压在登记夹最底下，隔间的水声停了，谁都没先开口
        near: 退单与投诉分头走流程，下一张钟点单照旧由她签字排
      far_trigger: 前台月底核单时发现这一单空着
      far_consequence: 空单要对上那位熟客的名字，她当月的黄金钟点先停；补记越界则单子本身替她作证
      bindings:
      - activity: 收市前核对最后一个钟点单
        place: 洗浴中心
        pair: 3
      - activity: 反手反锁包厢的门
        place: 夜场会所
        pair: 0
      exits:
      - 按流程作废这一单并知会当班经理
      - 把单子还给熟客自填，本人不再接这一钟点
    琴盖下那份未签的家族文件:
      source: 庄园把一批藏琴与文契请东家掌眼，琴盖下那份未签的文契一旦鉴定为真，宅子的抵押续期就压到这一周；东家按行规只认物证，宅里两房都在等她开口。
      engines:
      - 遗产之争
      - 时限逼近
      beats:
        trigger: 管家巡楼的脚步停在走廊尽头，{npc}的指尖还压在那份未签的文件上。
        objective: 在巡楼间隔里决定这份文件要被看见还是被按住
        choice: 先弹完这一曲再谈文件；当场问清签名栏留的是谁的名字
        immediate: 琴声接着走下去，文件在琴盖上没动，脚步声退回了楼梯口
        near: 管家下一轮巡看会把琴房状态如实报给宅里的人，两房的电话都在路上
      far_trigger: 抵押续期到限而文契真伪仍无一句落纸
      far_consequence: 续期一断庄园就要挂牌，两房的账都算到掌眼人头上；按行规落纸则她只担物证之责，签名之争回到两房自己手里
      bindings:
      - activity: 替她试琴时锁上整层
        place: 豪门庄园顶楼琴房
        pair: 1
      exits:
      - 把文件原样压回琴盖，掌眼意见只口头留给两房
      - 当场封鉴定物证退宅，续期之事交两房自行了断
