        "objective": "把有限晚间留给双方真想看的影片"
        "choice": "选片观看；不观影先走；或分开看后再聊"
        "immediate": "音量与结束时间定下，落选影片不变成补课"
        "near": "之后可轮流选片，不必统一口味"
    "试走海岸歇脚线":
      "places":
        - "海边步道"
      "pairs":
        - 1
      "category": "空间与退出"
      "action": "{npc}在岔口停下，邀请你试走有长椅的短环线。"
      "beats":
        "trigger": "{npc}在岔口停下，邀请你试走有长椅的短环线。"
        "objective": "按实际体力决定同行长度"
        "choice": "走短环线；到公交站离开；或坐长椅等对方独走"
        "immediate": "路线按慢者体力缩短，各自回程点清楚"
        "near": "下一次不必以走完全程证明愿意同行"
