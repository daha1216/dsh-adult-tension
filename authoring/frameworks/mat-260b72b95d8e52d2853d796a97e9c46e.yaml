      "beats":
        "trigger": "{npc}指向场馆划定的慢泳道，请你决定下水还是留岸边休息。"
        "objective": "选择适合自己的运动量与结束时刻"
        "choice": "按泳馆要求下水慢泳；不游直接离馆；或先在休息区等"
        "immediate": "同伴不再互相计圈，按各自体力结束"
