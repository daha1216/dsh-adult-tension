        "objective": "先确认本人意愿再决定使用"
        "choice": "删除该照片，或仅保留不识别个人的场景照"
        "immediate": "涉及个人的照片先不进入相册分享或试展，景物部分可以继续。"
        "near": "只向本人确认想保留的图，不以多数人同意覆盖个人决定。"
      "far_trigger": "未获同意的照片已被外部账号转发"
      "far_consequence": "上传者需联系撤回，之后可能只获准参加无摄影活动。"
      "exits":
        - "撤掉人物照片，仅保留风景或空展位"
        - "本人取回照片并退出展览，不退出其他休闲往来"
      "bindings":
