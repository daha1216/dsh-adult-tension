        "trigger": "{npc}把旧台灯放到店主指定的试用位，请你核对它是否还能正常亮。"
        "objective": "让交换者知道物品的实际状态"
        "choice": "试用并说明瑕疵；不交换收回物品；或请店主代验"
        "immediate": "能用、待修和不交换的物品分开，口头条件由当事人确认"
        "near": "接手者知道需要修什么，闲置者可改日再来"
