      "action": "{npc}读了自己选的一小段书，留一个空位问你想读、听还是各看各的。"
      "beats":
        "trigger": "{npc}读了自己选的一小段书，留一个空位问你想读、听还是各看各的。"
        "objective": "找到不用轮流发言也能共处的书会节奏"
        "choice": "读一段；婉拒入席离开；或只带自己的书安静看"
        "immediate": "座位按谈话与静读分开，沉默不再被催促"
        "near": "下次可按偏好选席，不承担固定分享任务"
