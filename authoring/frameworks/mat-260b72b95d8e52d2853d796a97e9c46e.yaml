id: mat-260b72b95d8e52d2853d796a97e9c46e
name: 城市休闲与共享会客
material:
  eras:
  - 当代都市
  aesthetics:
  - 写实文学
  - 暖色生活流
  - 日系同人音声物语
  - 都市妖异奇谭
  rule: 城市居民在预约空间里安排运动、看景与小型聚会，休闲不必服务于紧迫目标；但共享场地按合同收费，押金与违约条款写明，谁带来的人由谁负责，私人招待不因场地公共就变成公用，越界的部分要有人自己认下来。
  social_rule: 活动参与和费用分开确认，临时邀约不等于同意额外安排；涉及金钱、名分或住处的承诺必须当面说清并留凭据，沉默不构成同意。
  places:
    高级公寓:
      details:
      - 屋主会客区的书桌旁留着折椅·晚
      profile:
        privacy: high
        visibility: low
        exits:
        - 玄关通往楼道与电梯
        witnesses:
        - 屋主及受邀书友
        affordances:
        - 试排共享书会
        pressure_modifiers:
        - 座位数量与住户安静时段
    酒店套房:
      details:
      - 套房会客桌上摊着旅途冲印照·午
      profile:
        privacy: high
        visibility: low
        exits:
        - 玄关回酒店公共走廊和电梯
        witnesses:
        - 受邀旅伴，酒店人员按需到门口
        affordances:
        - 筹备旅行照片交换
        pressure_modifiers:
        - 退房时间与受邀范围
    私家宅邸:
      details:
      - 庭院投影幕前摆着两排户外椅·暮
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 沿主人开放的庭院门到街侧
        witnesses:
        - 屋主与观影来客
        affordances:
        - 设计庭院观影单
        pressure_modifiers:
        - 风声和邻居休息时间
    海边步道:
      details:
      - 防浪墙边有背风长椅和饮水点·晨
      - 防浪墙下的长椅背风，几步外就是没有护栏的堤面·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 从步道岔口回公交站
        witnesses:
        - 散步居民
        affordances:
        - 试走海岸歇脚线
        pressure_modifiers:
        - 日晒与步行体力
        - 末班车时刻与潮位
        - 夜里的空旷让争执无处遮掩
    健身房:
      details:
      - 教练示范区外摆着预约等候凳·晚
      profile:
        privacy: low
        visibility: high
        exits:
        - 经前台回商场走廊
        witnesses:
        - 值班教练
        affordances:
        - 预约教练体验课
        pressure_modifiers:
        - 课程间隔与个人体力
    室内夜泳馆:
      details:
      - 泳池岸边慢泳道旁亮着计时钟·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿湿区通道更衣后回接待厅
        witnesses:
        - 救生员
        affordances:
        - 选择慢泳与岸边休息
        pressure_modifiers:
        - 泳道速度分组与闭馆时间
    打烊后的买手店:
      details:
      - 店主打烊后开放的交换桌上摆着旧灯与布包·晚
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经仍可开启的店门回街道
        witnesses:
        - 店主与交换者
        affordances:
        - 布置旧物交换桌
        pressure_modifiers:
        - 收店时间与物件状况
    黄昏天台:
      details:
      - 护栏内画板对着暮色中的楼群·黄昏
      profile:
        privacy: low
        visibility: medium
        exits:
        - 天台门经楼梯回公共门厅
        witnesses:
        - 同行画友
        affordances:
        - 绘制城市天际线
        pressure_modifiers:
        - 落日角度与天台开放时段
    婚礼宴会厅:
      details:
      - 未办婚宴的试摆区放着可移动纪念展架·午
      profile:
        privacy: medium
        visibility: high
        exits:
        - 经宴会厅主门回接待前厅
        witnesses:
        - 场地管理员与家庭代表
        affordances:
        - 试排公共纪念展
        pressure_modifiers:
        - 后续宴会布场时间
    夜场会所:
      details:
      - VIP 包厢门在身后反锁，走廊侍应按分钟记录进出·夜
      - 酒水单第二页压着一张不记名结账单·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 由侍应引导经后门车道离开
        witnesses:
        - 包厢侍应与守夜经理
        affordances:
        - 谈一笔不宜落纸的价码
        - 在散场前确认谁替谁买单
        pressure_modifiers:
        - 包厢最低消费与结账时限
        - 谁持有结账凭证
    洗浴中心:
      details:
      - 大池边竹帘后有单独擦背隔间·夜
      - 储物柜手牌与宾客登记本分开保管·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 沿更衣通道从侧门回街面
        witnesses:
        - 擦背师傅与更衣间值守
        affordances:
        - 在无监控隔间里交换不便过手的东西
        pressure_modifiers:
        - 毛巾服务排班与包厢转场时间
        - 手牌可追溯的出入记录
    livehouse:
      details:
      - 演出后场地清空，调音台还亮着待机灯·夜
      - 后台通道堆着待签的巡演物料纸箱·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经后台通道到卸货口，或走观众席正门
        witnesses:
        - 场地技监与散场安保
        affordances:
        - 在清场后单独试音
        - 核对巡演结算单
        pressure_modifiers:
        - 场地超时计费与安保清场节点
        - 巡演方与场地方的票务对账
    偏远小镇唯一便利店:
      details:
      - 冷柜运转声盖过店里唯一的收银机提示音·深夜
      - 凌晨班只有一名店员，门外国道没有路灯·深夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿国道等过路长途车，班次按天计
        witnesses:
        - 值夜店员与偶尔进店的卡车司机
        affordances:
        - 在班车到达前把话说完
        pressure_modifiers:
        - 每天仅数趟过路车
        - 店内监控与零钱储备
    停电民宿客厅:
      details:
      - 整片街区跳闸，客厅只靠应急灯和手机电筒·停电夜
      - 壁炉边的两台设备指示灯全灭，共同素材都停在本地·停电夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 摸黑经玄关下到民宿门厅，路口无照明
        witnesses:
        - 无（整片街区跳闸停电，无人在场旁观）
        affordances:
        - 在无信号无监控的夜里把话摊开
        pressure_modifiers:
        - 恢复供电时间未知
        - 手机电量与何时能重新联网
    桌游店:
      details:
      - 包间牌子上写着已续时到打烊·夜
      - 隔音不够，隔壁桌的笑声透过薄板传进来·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经店里主通道到收银台，或由消防梯下到后巷
        witnesses:
        - 巡场店员与隔壁包间客人
        affordances:
        - 借开局为名叫停一场谈判
        pressure_modifiers:
        - 续时计费与包间隔音
        - 店员的巡场频率
    朋友客厅:
      details:
      - 沙发缝里塞着主人的旧杂志与一张写满名单的便签·夜
      - 阳台门开着，楼下能听见这条街的宵夜摊收摊·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经玄关或阳台外梯离开，主人会把门留一道缝
        witnesses:
        - 在场共同朋友
        affordances:
        - 在熟人场子里试探别人知道多少
        pressure_modifiers:
        - 还有谁会来，主人留人的方式
        - 共同朋友的在场时间
    老旧小区:
      details:
      - 楼道声控灯半层才亮一次，防盗门上贴着过期的缴费单·夜
      - 对门住户的电视声隔着薄墙传进来，走道堆着旧家具·夜
      profile:
        privacy: low
        visibility: medium
        exits:
        - 沿楼梯到门洞，或等唯一一部旧电梯
        witnesses:
        - 对门邻居与楼下遛弯的老住户
        affordances:
        - 在邻居眼皮底下办一件想低调的事
        pressure_modifiers:
        - 楼里大多是长住户，谁进出都被记住
        - 旧电梯随时停用
    豪门庄园顶楼琴房:
      details:
      - 整层只有琴房亮灯，门外走廊铺着吸音地毯·夜
      - 三角琴盖上压着一份未签的家族文件·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 经主人专用的东侧楼梯到车库
        witnesses:
        - 管家会在固定时刻上楼巡看
        - 值班佣人按铃到门口
        affordances:
        - 在无人打扰的一层里谈家产与去留
        pressure_modifiers:
        - 管家巡楼的固定时刻
        - 家族的访客登记与用车调度
    清晨菜市场:
      details:
      - 批摊位开始收摊，冲洗地面的水漫到脚边·清晨
      - 摊主边收边给熟客留货，赊账记在摊板背面·清晨
      profile:
        privacy: low
        visibility: high
        exits:
        - 从市场两个口出去，一个通向早班公交站
        witnesses:
        - 相熟摊主与送货的批发商
        affordances:
        - 在人多处装作偶遇把话说开
        pressure_modifiers:
        - 收摊时间与是否有人替你挡话
        - 摊主的赊账记录
    电竞俱乐部:
      details:
      - 训练室白板上写着今天的复盘顺序与替补名单·夜
      - 赞助商 logo 贴在隔音玻璃上，工位后排留着一台关机的机位·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经基地门禁刷卡到写字楼电梯间
        witnesses:
        - 值班教练与留守替补
        affordances:
        - 看复盘记录确认谁被换掉
        pressure_modifiers:
        - 转会窗口与赞助条款
        - 训练室门禁的刷卡记录
  pairs:
  - family: 服务与手艺
    position: 前任
    appellations:
    - 直呼其名
    npc:
      role: 共享空间值班店长
      function: 排定预约时段、核收场地押金，也盯店里损耗与欠账单
      authority: 可取消自发活动并按合同扣押金，不能把私人住宅当公用场地
      resource: 预约系统权限、可借折椅与小额活动预算
      limitation: 不是健身教练，不能替住户破例；押金归财务流程，他不能一笔勾销
      obligation: 说明费用与违约条款，并按约收场
      exposure: 替人擅自加项目会失去邀约信任，欠款跟到他自己头上
      hidden: —
    player:
      identity: 危机公关处理人
      baseline: 你替人处理过好几起塌房与赔偿，靠的不是嘴，是知道哪条记录能翻出来。他请你来试一个可以旁听的书会，也想知道你手里那份东西要什么价。
      resources:
      - 相机、便携画板与熟悉的海边休息点
      - 一叠没交出去的旧通稿与一段未剪的录音
      reputation: 会照顾画面之外的人，也会替人把话说到不能收回
    relationship_reason: 你曾让一次聚会停止强制合照，他请你来试一个可以旁听的书会；他手上那笔亏空其实是你经手压下去的旧案，两人都知道对方手里有半张底牌。
  - family: 学术与专业
    position: 相亲对象
    appellations:
    - 直呼其名
    - 哥哥
    npc:
      role: 掌眼的鉴定行东家
      function: 替人断真伪与估价，也放账给周转不开的老客
      authority: 可决定自己的鉴定意见是否落纸，不代场馆确认拍摄许可
      resource: 针管笔、描图纸、手机里没修完的旅拍原图，以及一本记着谁欠他多少的账册
      limitation: 登高只到开放天台，泳池与场馆规则他不替人破例；他出的意见不担保回报率
      obligation: 同行先问对方今天想走多远，看过的东西该写多细由物主定
      exposure: 看错一次就要自己赔，账册上的人情也会一起被翻出来
      hidden: —
    player:
      identity: 社区图书馆夜班管理员
      baseline: 深夜泳馆闭馆音乐响起时你们常是最后离场的两位，他画暮色楼群，你数完最后一圈；同一段夜班公交把你们送到同一个站。他看你的手比看画久，你也没把手收回去。
      resources:
      - 错峰出行的交通月卡
      - 随身保温杯与一副老花镜
      - 一份记着谁进过闭架书库的夜班日志
      reputation: 夜班管理员，坐得住长椅，也守得住闭馆时间
    relationship_reason: 深夜泳馆闭馆音乐响起时你们常是最后离场的两位，他画暮色楼群，你数完最后一圈；同一段夜班公交把你们送到同一个站。他掌眼走了半辈子，最近却要你替他在日志上补一个不存在的到馆时间。
  - family: 侍奉与身契
    position: 上司
    appellations:
    - 少爷
    npc:
      role: 私人宅邸的长期管家
      function: 管门禁、排日程，替主人挡下不愿见光的邀约
      authority: 宅门钥匙与用人调度都在她手上，动账须东家会签
      resource: 一份不入账的访客记录
      limitation: 离开这栋宅子就没有署名权，家宴的座次也轮不到她坐
      obligation: 宅门内外的口风都由她负责，访客记录不外传
      exposure: 一次外泄就能被立刻替换，连推荐信都不会有
      hidden: —
    player:
      identity: 刚接下这栋宅子的年轻东家
      baseline: 你接过宅子的第一个月就发现，管家每晚报门时总把访客记录压在最底下，而这晚她把那几页抽了出来。
      resources:
      - 宅契与用人的任免权
      - 前任东家留下的一封未拆的信
      reputation: 新东家三把火，先烧规矩还是先烧人，人人都在看
    relationship_reason: 交接宅邸的头一个月里，她按旧例每晚向你报一次门；你留意到访客记录少了一页，而她比你先知道那一页记着谁。
  - family: 成人行业与感官服务
    position: 同侪
    appellations:
    - 老板
    npc:
      role: 洗浴中心的资深擦背理疗师
      function: 排擦背隔间的钟点单，替熟客做肩背理疗并记录服务单
      authority: 可停接加钟要求，隔间服务单由她签字才算数
      resource: 一柜只有她能开的理疗登记夹与当日钟点总表
      limitation: 顾客投诉能让她当月排不到黄金钟点，辞退只差一纸
      obligation: 服务单上写清项目与时长，越界要求当场退单
      exposure: 被写成隔间里什么都做，这行就再没人敢把钟点给她
      hidden: —
    player:
      identity: 同一条街上夜班收尾的足疗师
      baseline: 你总订她最后一个钟点，两人收市时间咬得上，谁都知道这行的单子怎么写才算干净。
      resources:
      - 自己柜里同样一格服务单
      - 前台当班经理的熟脸
      reputation: 钟点到期就走，从不多要一分钟
    relationship_reason: 整月的末班钟点都是你们俩对着排的，她记得你手上哪块旧伤不能碰；今晚收市她把一张加钟的单子按在玻璃上，指节没松。
  activities:
    试排共享书会:
      places:
      - 高级公寓
      pairs:
      - 0
      category: 日常接触
      action: '{npc}读了自己选的一小段书，留一个空位问你想读、听还是各看各的。'
      beats:
        trigger: '{npc}读了自己选的一小段书，留一个空位问你想读、听还是各看各的。'
        objective: 找到不用轮流发言也能共处的书会节奏
        choice: 读一段；婉拒入席离开；或只带自己的书安静看
        immediate: 座位按谈话与静读分开，沉默不再被催促
        near: 下次可按偏好选席，不承担固定分享任务
    筹备旅行照片交换:
      places:
      - 酒店套房
      pairs:
      - 1
      category: 信息交换
      action: '{npc}选一张没拍好的旅途照，请你说说自己也记错过的一个地点。'
      beats:
        trigger: '{npc}选一张没拍好的旅途照，请你说说自己也记错过的一个地点。'
        objective: 交换照片外的个人经历
        choice: 讲一段；不分享只听；或只谈景物不谈同行者
        immediate: 照片得到不同的旅行解释，未选择的图仍留在各自相册
        near: 下次邀约知道对方在意的是慢走还是拍照
    设计庭院观影单:
      places:
      - 私家宅邸
      pairs:
      - 0
      - 2
      category: 日常接触
      action: '{npc}试播两个短片开头，问今晚愿意看完哪一部。'
      beats:
        trigger: '{npc}试播两个短片开头，问今晚愿意看完哪一部。'
        objective: 把有限晚间留给双方真想看的影片
        choice: 选片观看；不观影先走；或分开看后再聊
        immediate: 音量与结束时间定下，落选影片不变成补课
        near: 之后可轮流选片，不必统一口味
    试走海岸歇脚线:
