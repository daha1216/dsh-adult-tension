id: mat-295d0099c528557f847e965c60eeefe5
name: 同人街区与录音协作
material:
  eras:
  - 秋叶原架空街区
  aesthetics:
  - 亚文化地下物语
  - 日系轻喜GAL风
  rule: 创作者、配音者与店铺围绕公开活动协作，作品归属和休息时间同样重要。录音红灯亮起时进棚严禁发出台词外的杂音，监听母带一经导出即刻封存母盘，私下试录的留存范围由到场者本人确认。
  social_rule: 只制作获得授权的非露骨作品，参与者姓名与录音公开范围由本人确认，其中原始记录比剪辑版本更有权威，凭它可核对到场人与实际录制范围。
  places:
    声优录音棚:
      details:
      - 话筒旁的短篇样稿贴着换气纸签·晚
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从录音间经隔音门到休息区
        witnesses:
        - 录音师与自愿配音者
        affordances:
        - 试录地方故事
        pressure_modifiers:
        - 棚时和嗓音疲劳
    女仆咖啡厅后厨:
      details:
      - 备餐后获店主允许的工作台上放着主题菜单样张·下午
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经后厨指定通道回店内接待区，不占出餐口
        witnesses:
        - 店主与厨房员工
        affordances:
        - 校对活动菜单
        pressure_modifiers:
        - 食品区使用范围和下一轮备餐
    同人展备用更衣室:
      details:
      - 确认无人使用的备用间临时摆着路线牌材料·开场前
      profile:
        privacy: high
        visibility: low
        exits:
        - 经走廊到展会大厅；恢复更衣用途前立即归还空间
        witnesses:
        - 场务管理员
        affordances:
        - 试摆展会路线牌
        pressure_modifiers:
        - 用途切换时刻与纸牌占地
    电竞基地训练室:
      details:
      - 训练室访客位的屏幕停在一场已公开的比赛·午
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经访客通道回接待前台
        witnesses:
        - 队务与成年选手
        affordances:
        - 复看公开赛的一次配合
        pressure_modifiers:
        - 训练空档和回放许可
    Cosplay暗房:
      details:
      - 道具暗房的遮光台上只有纸甲样件与反光板·晚
      profile:
        privacy: medium
        visibility: low
        exits:
        - 停止拍摄后经遮光帘外走廊离开
        witnesses:
        - 道具作者与摄影协作者
        affordances:
        - 给道具底座加可拆支撑
        pressure_modifiers:
        - 遮光状态与样件稳定性
    录音棚控制室:
      details:
      - 控制室监听桌上两版环境音工程交替亮起·晚
      profile:
        privacy: medium
        visibility: low
        exits:
        - 关小监听后去棚外休息区
        witnesses:
        - 录音师
        affordances:
        - 试听环境音节目
        pressure_modifiers:
        - 监听音量与耳疲劳
    同人社团通宵排稿室:
      details:
      - 长桌上摊着装订到一半的合志毛样与分工表·夜
      - 墙角纸箱上压着印厂的压盘回单·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 经后门楼梯离开展会场地，不留人单独守夜
        witnesses:
        - 同社团的成年作者
        affordances:
        - 校对合志分工表
        - 试合压盘毛样
        pressure_modifiers:
        - 压盘截止时刻与剩余页数
        - 通宵值守的人手轮换
    展前临时寄存间:
      details:
      - 锁柜上贴着展位号的寄存票据·开场前
      - 角落推车上摞着待取的道具箱，箱主署名朝外·开场前
      profile:
        privacy: medium
        visibility: low
        exits:
        - 凭票据经场务值班台取件离开
        witnesses:
        - 凭票值班的场务管理员
        affordances:
        - 清点寄存道具箱
        - 核对票据与展位号
        pressure_modifiers:
        - 值班交接时段
        - 票据是否对得上箱主
    女仆咖啡厅接待区:
      details:
      - 靠窗的双人座位旁立着主题菜单的今日限定牌·下午
      - 值班店员把点单夹抱在身前，随时会走过来·下午
      profile:
        privacy: low
        visibility: high
        exits:
        - 结清点单后经临街正门离开
        witnesses:
        - 值班店员与同席的成年顾客
        affordances:
        - 按主题菜单点一份当日限定
        - 试戴主题展演配饰
        pressure_modifiers:
        - 高峰翻台与排队号
        - 店员随时经过的视线
    深夜展馆后门装卸口:
      details:
      - 卷帘门外停着等装车的小货车，车厢灯没关·深夜
      - 装卸台边堆着贴好展位号的纸箱，手推车靠墙·深夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 搬完经后门回展馆，或直接搭车离开
        witnesses:
        - 货运司机与夜班值班的场务
        affordances:
        - 核对待运的成品箱数
        - 与司机确认装车顺序
        pressure_modifiers:
        - 司机等待的计费时间
        - 货车载量与剩余趟数
  pairs:
  - family: 艺术与传播
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 独立刊物编辑
      function: 协调样稿内容与作者署名
      authority: 能退改本刊稿件，不能决定作者其他作品授权
      resource: 作者联络、校样和手工装订工具
      limitation: 不是职业配音导演，也不能替店主承诺菜单原料
      obligation: 在送印前逐人确认署名
      exposure: 漏署名会让幕后协作者失去可展示的成果
      hidden: —
    player:
      identity: 音频节目制作人
      baseline: 你曾用声音保留一段难排版的停顿，他请你来试录地方短篇
      resources:
      - 分轨录音、便携监听与可预约棚时
      reputation: 音频节目制作人，有录音技能但不代作者决定内容
    relationship_reason: 你曾用声音保留一段难排版的停顿，他请你来试录地方短篇
  - family: 艺术与传播
    position: 初次见面的网友
    appellations:
    - 直呼其名
    npc:
      role: 音频节目制作人
      function: 录制、试听和组织小型音频节目
      authority: 可调整自己的素材与试听安排，不决定店铺或选手排班
      resource: 采样器里的商店街环境声素材、一台老磁带机与两版未定稿的环境音节目
      limitation: 不会修所有道具，也没有无限重录预算
      obligation: 按约留休息并交付可用版本
      exposure: 赶录会让配音者声音状态变差
      hidden: —
    player:
      identity: 受托绘制主题菜单的插画师
      baseline: 你为店里画暑期菜单的那几周，她每周三来后厨录备餐声；你们共用一张工作台的角落，从点头之交处成互相留位的朋友
      resources:
      - 菜单打样的水彩小样
      - 一小盒随身携带的备用墨水
      reputation: 插画师，改稿不超约定轮次，也守交稿的日子
    relationship_reason: 你为店里画暑期菜单的那几周，她每周三来后厨录备餐声；你们共用一张工作台的角落，从点头之交处成互相留位的朋友
  - family: 艺术与传播
    position: 同人社团原案脚本师
    appellations:
    - 直呼其名
    npc:
      role: 同人社团主催
      function: 排定社团合志的分工与展位，核对每位作者愿意公开到什么程度
      authority: 能定自己的排期与展位分配，不能替作者决定笔名是否对应真名
      resource: 合志分工表、展位押金收据与仅内部流转的母带目录
      limitation: 不是职业经纪人，也压不住印厂和物流的档期
      obligation: 压盘前逐人确认分工，未经本人同意不外传任何录音
      exposure: 私下的试录一旦外流，社团队伍会先散在她这一届
      hidden: —
    player:
      identity: 同人社团原案脚本师
      baseline: 你替社团写了三年的原案，主催把这一届的合志压在你交稿的那一周；你们共用一间通宵的排稿室，习惯按截稿日分配彼此的睡眠
      resources:
      - 原案分镜本与改稿记录
      - 社团内部共用的排稿室钥匙
      reputation: 交稿从不拖到印厂关门，笔下人物的关系走向只写自己认得的
    relationship_reason: 你替社团写了三年的原案，主催把这一届的合志压在你交稿的那一周；你们共用一间通宵的排稿室，习惯按截稿日分配彼此的睡眠
  - family: 屏幕与镜头
    position: 知情不报者
    appellations:
    - 直呼其名
    npc:
      role: 棚内录音师
      function: 操作调音台与监听，记录每一轨的实际录制时间与人
      authority: 可以拒绝重录和删掉自己的工程文件，不能替制作人决定发布范围
      resource: 工程文件、棚时台账与只有自己看过的原始轨
      limitation: 手上的台账能还原当晚，却没有权力替谁瞒下去
      obligation: 如实记录到场人与录制范围，不外传未授权素材
      exposure: 一旦被要求改台账，下一个被叫去问话的就是她
      hidden: —
    player:
      identity: 棚外等候的音频节目制作人
      baseline: 你在棚外等自己的棚时，听过不止一次不该听的实景录制；录音师知道你知道，两人都还没说到那一步
      resources:
      - 自己那档节目的棚时预约单
      - 一份能对上时间线的监听回放
      reputation: 听得出来哪一轨是私下的，也从不把听来的说给第三个人
    relationship_reason: 你在棚外等自己的棚时，听过不止一次不该听的实景录制；录音师知道你知道，两人都还没说到那一步
  - family: 侍奉与身契
    position: 同侪
    appellations:
    - 学长
    - 会长
    npc:
      role: 女仆咖啡厅以全年早晚班合约抵债的驻店店员
      function: 顶满早晚两个高峰的台面与后厨杂务，兼接店方的街区宣传单
      authority: 能自己排换班表上的空档，合约里的陪席场次换不掉
      resource: 店长签字的工时折抵单和一把后厨钥匙
      limitation: 全年合约押着她的学费欠款，中途解约按剩余月份全赔
      obligation: 台前维持元气待客设定，工时折抵逐日让店长落章
      exposure: 合约里捆着的陪席条款被同学看见，这份工就做不下去
      hidden: —
    player:
      identity: 同店签约的夜间收货班接单人
      baseline: 你和她签的是同一家店的合约，你那份没捆陪席，她的捆了，你一直知道差在哪一栏。
      resources:
      - 自己那份可对照的合约文本
      - 店长许可的换班申请格
      reputation: 收货点数不含糊，不替店方传话
    relationship_reason: 两人常在后厨交接早晚班的钥匙，她替你顶过一次迟到的收货，你替她对照过合约里两处不一样的条款；这次她在菜单校对的间隙把折抵单摊开了。
  - family: 成人行业与感官服务
    position: 同侪
    appellations:
    - 前辈
    npc:
      role: 同人音声社团的成年签约声优
      function: 录制深夜档音声剧的耳语音轨，兼审听样带的杂音
      authority: 可拒录未写进委托单的台词，档期改动须双方签认
      resource: 一份签明许可边界的录制委托与样带封存柜的钥匙
      limitation: 合约押着社团的展期摊位费，越界录音一旦流出只能她自己担
      obligation: 每条样带落款许可范围，未剪母带当场封存
      exposure: 深夜档音声与本名挂上钩，正职与社团两头都保不住
      hidden: —
    player:
      identity: 同社团协作的收音与剪辑接单人
      baseline: 你负责她的轨收音和样带封存，清楚哪几句是她自己加的，也清楚封存柜钥匙不该只有一把。
      resources:
      - 录制委托单的副本
      - 封存柜的第二把钥匙
      reputation: 母带不外流，加录必见单
    relationship_reason: 两人在棚里合录过三档深夜音声，她信你收音不收话；这晚试录地方故事的间隙，她把委托单上新增的一条划线递到你面前。
  activities:
    试录地方故事:
      places:
      - 声优录音棚
      pairs:
      - 0
      - 5
      category: 信息交换
      action: '{npc}将获准短篇读出两种节奏，请你试一个能自然接话的停顿。'
      beats:
        trigger: '{npc}将获准短篇读出两种节奏，请你试一个能自然接话的停顿。'
        objective: 找到叙述者与录音者都能复现的节奏
        choice: 试录一小段；不录只听；或只标换气点
        immediate: 留下两版可比较的小样，试错不会自动计入正式作品
        near: 下次可从选定速度开始，不要求当晚录完整篇
    校对活动菜单:
      places:
      - 女仆咖啡厅后厨
      pairs:
      - 1
      - 4
      category: 调查与核验
      action: '{npc}请店主在场，把主题菜名与实际出品说明逐项对应。'
      beats:
        trigger: '{npc}请店主在场，把主题菜名与实际出品说明逐项对应。'
        objective: 避免主题文案让顾客误解份量或原料
        choice: 核对文字；不参加回接待区；或请厨房员工解释一处原料
        immediate: 夸张菜名旁补上真实说明，食品判断由店方确认
        near: 活动日少一次临时解释，创作者不代店家作承诺
    试摆展会路线牌:
      places:
      - 同人展备用更衣室
      pairs:
      - 0
      category: 空间与退出
      action: '{npc}确认备用间无人更衣后，请你把纸牌试立在门外场务指定点。'
      beats:
        trigger: '{npc}确认备用间无人更衣后，请你把纸牌试立在门外场务指定点。'
        objective: 让指路牌离开更衣空间也能发挥作用
        choice: 试摆并走一遍；不布置回大厅；或只剪纸牌交给场务
        immediate: 箭头经实走校正，工具在恢复更衣用途前收走
        near: 展会开场后访客按牌走，不需进入备用间问路
    复看公开赛的一次配合:
      places:
      - 电竞基地训练室
      pairs:
      - 1
      category: 信息交换
      action: '{npc}停在一次公开赛配合前，请你先猜队员下一步再一起看结果。'
      beats:
        trigger: '{npc}停在一次公开赛配合前，请你先猜队员下一步再一起看结果。'
        objective: 理解配合选择而非只剪高光
        choice: 说出预测；不看去休息；或让队务解释已公开的信息
        immediate: 误判与实际选择对照，内部训练战术不进入讨论
        near: 下一次剪辑可把关键铺垫保留，玩家学会看配合
    给道具底座加可拆支撑:
      places:
      - Cosplay暗房
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}经作者同意递来泡棉，请你垫稳拍摄台上总歪倒的纸甲样件。'
      beats:
        trigger: '{npc}经作者同意递来泡棉，请你垫稳拍摄台上总歪倒的纸甲样件。'
        objective: 让道具站稳且不改变作者原形
        choice: 试垫支撑；不碰样件只看；或请作者换原装底座
        immediate: 样件可直立，泡棉随时取下，照片不需伪装修掉倒伏
        near: 带去展会时可复用支撑，作者自己决定保留
    试听环境音节目:
      places:
      - 录音棚控制室
      pairs:
      - 1
      category: 日常接触
      action: '{npc}把监听调到舒适音量，问想先听街口雨声还是收店时的门铃。'
      beats:
        trigger: '{npc}把监听调到舒适音量，问想先听街口雨声还是收店时的门铃。'
        objective: 共享一段不必评审打分的声音时间
        choice: 听一段；暂停离席休息；或只听无解说原声
        immediate: 双方选出各自喜欢的转场，意见不同可保留两版
        near: 节目制作人决定正式版本，试听者没有无偿长期审稿义务
    校对合志分工表:
      places:
      - 同人社团通宵排稿室
      pairs:
      - 2
      category: 调查与核验
      action: '{npc}把分了一夜的分工表推过来，请你逐行认哪些署名还没得到本人回话。'
      beats:
        trigger: '{npc}把分了一夜的分工表推过来，请你逐行认哪些署名还没得到本人回话。'
        objective: 在压盘前把没确认的署名与分工挑出来
        choice: 逐行核对分工；只列出待回话的那几行；先把已确认部分交印厂报备
        immediate: 未确认的署名被单独圈出，分工表复印一份留在排稿室备查
        near: 缺席的作者可以在压盘前要求改署名或撤稿，社团不替任何人补一个名字
    清点寄存道具箱:
      places:
      - 展前临时寄存间
      pairs:
      - 0
      category: 信息交换
      action: '{npc}凭票打开对应锁柜，请你把箱主的展位号与寄存票据逐箱对上。'
      beats:
        trigger: '{npc}凭票打开对应锁柜，请你把箱主的展位号与寄存票据逐箱对上。'
        objective: 让每只箱子都能凭票找回自己的主人
        choice: 核对票据与箱号；只清点不开箱；请场务到场做见证
        immediate: 对不上的箱子当场封存待核，能对上的逐箱登记后放行
        near: 开场后凭票取件，错领的箱子可追到场务值班记录
    试戴主题展演配饰:
      places:
      - 女仆咖啡厅接待区
      pairs:
      - 1
      category: 身体靠近
      action: '{npc}从值班台借来一副主题发箍，问你要不要趁空档先试一下松紧。'
      beats:
        trigger: '{npc}从值班台借来一副主题发箍，问你要不要趁空档先试一下松紧。'
        objective: 确认展演配饰在正式上场前不会松脱或夹痛
        choice: 当场试戴并调整；只看她试，或请店员代为确认卡扣
        immediate: 发箍的松紧当场被调到可维持一整场，试戴只是试戴，不代客人答应任何加时
        near: 上场前用同一副配饰复检一次，随时可交还值班台
    盯住装车顺序:
      places:
      - 深夜展馆后门装卸口
      pairs:
      - 3
      category: 空间与退出
      action: '{npc}把成品箱的编号念给你听，请你按展位顺序把要装车的先挑出来。'
      beats:
        trigger: '{npc}把成品箱的编号念给你听，请你按展位顺序把要装车的先挑出来。'
        objective: 在司机等待计费走完之前把必到的箱子先装上车
        choice: 先挑必到的那几箱；只点数不下手；与司机谈下一趟的先后
        immediate: 先装车的箱子当场贴在副驾驶座旁的单子上，其余留在装卸台等下一趟
        near: 下一趟的顺序可由到场的人自己认领，缺的箱子按寄存票据追回
  customs:
  - 每场活动实际完成后，才会给幕后协作者留一页可自行填写的记录；留痕不替代活动本身。
  pressures:
    样刊署名缺漏:
      source: 印前样刊遗漏了一位协作者
      engines:
      - 名声保卫
      - 时限逼近
      beats:
        trigger: '{npc}收到消息：印前样刊遗漏了一位协作者。'
        objective: 确认署名并修正待印文件
        choice: 联系本人核对，或暂缓送印
        immediate: 与试录配套的印前短篇校样暂缓送印，先找出漏掉的配音或音频协作者。
        near: 编辑问本人希望署何名，制作人只证明具体参与内容，不代填真名。
      far_trigger: 送印后才补齐署名而首批样刊已经售出
      far_consequence: 编辑需承担补印署名页与联系购买者的成本，协作者可拒绝下期参与。
      exits:
      - 本期撤下对应篇章，停止相关试录
      - 双方确认最小署名页后由编辑独自完成送印
      bindings:
      - activity: 试录地方故事
        place: 声优录音棚
        pair: 0
    场地预约突然改变:
      source: 原定公开节目场地取消了预约
      engines:
      - 资源锁定
      - 时限逼近
      beats:
        trigger: '{npc}收到消息：原定公开节目场地取消了预约。'
        objective: 商量替代场地或延期通知
        choice: 联系其他空间，或公布改期
        immediate: 原定节目场地取消后，本次棚内练习仍可按已有预约完成，不擅自把录音棚当演出场。
        near: 制作人提供改为小样或延期两案，配音者重新选择是否参与。
      far_trigger: 替代场地可用日期超过主创共同空档
      far_consequence: 节目可拆成自愿提交的单段作品，已付场租按实际合同处理。
      exits:
      - 取消公开节目，仅保留本人同意的小样
      - 退回未用共同款项，各自结束这一期合作
      bindings:
      - activity: 试录地方故事
        place: 声优录音棚
        pair: 0
      - activity: 试听环境音节目
        place: 录音棚控制室
        pair: 1
    同人展压盘只剩一夜:
      source: 压盘截止在明天早上八点，分工表上还有四行署名没等到本人回话。
      engines:
      - 同人展截稿死线
      - 时限逼近
      beats:
        trigger: '{npc}把印厂的回执摊在排稿桌上：明天早上八点压盘，四行署名还空着。'
        objective: 在压盘前把没确认的署名处理成不用补名字也能送印的形态
        choice: 删掉没确认的那几篇保住页数，或留出空位等早上再定
        immediate: 分工表上四行被分开标注，未确认的篇目先抽出不装订
        near: 缺席的作者可在压盘前要求撤稿或改署名，整册页数随之重排
      far_trigger: 印厂开机后才发现某位作者从没同意过署名方式
      far_consequence: 整批成品要贴条或销毁重印，费用由社团自担；主催这一届的信用会压到下一届招不满人。
      exits:
      - 抽掉未确认篇目，按剩余页数照常压盘
      - 整批改期到下一场展会，先退还已收的预售款
      bindings:
      - activity: 校对合志分工表
        place: 同人社团通宵排稿室
        pair: 2
    私下的那一轨要被公开:
      source: 社团打算把棚里试录的一轨当特典随册附送，可那一轨录的时候说好只留内部。
      engines:
      - 梦话泄密
      - 名声保卫
      beats:
        trigger: '{npc}在监听台前停住：打算随册送出的那一轨，当初说好只留社团内部。'
        objective: 在不惊动台面上任何人的前提下决定这一轨的去向
        choice: 先问棚里的人同不同意，或自己直接把那一轨另存封起来
        immediate: 工程文件被单独另存，特典目录上那一行先划掉
        near: 录音师按台账核对到场人与录制范围，只有本人同意才能重新列入
      far_trigger: 特典随册流出后被听出是私下那一晚
      far_consequence: 录音师先被叫去问台账，社团失去可以再借棚的信用；当时同意过的人可要求追回已发出去的每一份。
      exits:
      - 撤掉这一轨，特典改用公开录制的一段补足长度
      - 由录音师封存原始工程，社团另想办法凑够特典
      bindings:
      - activity: 试听环境音节目
        place: 录音棚控制室
        pair: 1
      - activity: 盯住装车顺序
        place: 深夜展馆后门装卸口
        pair: 3
      - activity: 复看公开赛的一次配合
        place: 电竞基地训练室
        pair: 1
    经纪人在棚外敲门查岗:
      source: 门外的人按着门铃不放，要清点棚里此刻到底有几个人、录的是什么。
      engines:
      - 第三方施压
      - 身份风险
      beats:
        trigger: '{npc}听到门外的人按着门铃不放，要清点棚里此刻有几个人。'
        objective: 把正在录的东西收拾成一份经得起当面看的台账
        choice: 开门把台账摊在门口，或让录音师先出面顶这一趟
        immediate: 监听被关小，台面上的工程切到可外放的那一版
        near: 查岗的人会比对棚时台账，前后对不上的部分要由在场的人自己解释
      far_trigger: 下一次被要求出示完整的棚时与录制记录
      far_consequence: 对不上的记录会让录音师被停掉排班，制作人的名字从这一期署位上撤下。
      exits:
      - 当场交出可外放的版本，私下录的部分自己带走
      - 结束当晚的录制，把棚时让给对方要用的人
      bindings:
      - activity: 试录地方故事
        place: 声优录音棚
        pair: 0
      - activity: 校对合志分工表
        place: 同人社团通宵排稿室
        pair: 2
    防窥帘外的视线:
      source: 隔音棚的帘子被从外面拉开一道缝，外面的人正对着防喷罩往里看。
      engines:
      - 共处密闭
      - 隔音棚声学私密共振
      beats:
        trigger: '{npc}察觉隔音棚的帘子被从外面拉开一道缝，有人正往里看。'
        objective: 决定这一晚还要不要留在这间棚里继续
        choice: 把帘子拉严让对方知道里面看得见，或干脆收工离开这间棚
        immediate: 帘子被拉严，防喷罩前的东西被归位，录制停在一个可以收尾的点上
        near: 棚方会按当次预约核对进出记录，留下来的人可以要求换成可视性更高的棚
      far_trigger: 同一个人第二次在同一时段出现在帘外
      far_consequence: 两人要重新商定棚时与谁在场，录音师可以拒绝再单独留棚。
      exits:
      - 结束当晚录制，把棚时改到白天有人在的时段
      - 换到控制室把剩下的部分当听感讨论，不再进棚
      bindings:
      - activity: 试录地方故事
        place: 声优录音棚
        pair: 0
    展位号对不上箱子:
      source: 寄存柜里有一只箱子写着别人的展位号，票据还压在值班台。
      engines:
      - 旧事追索
      - 信任透支
      beats:
        trigger: '{npc}凭票打开锁柜，发现里面那只箱子写的展位号不是自己的。'
        objective: 在不把别人的东西交出去的前提下把这只箱子认回原主
        choice: 把这只箱子封存登记等场务，或先照票据自己找箱主问一声
        immediate: 对不上的箱子被单独封存登记，能对上的逐箱放行
        near: 场务会按值班记录追查交错件的时段，票据齐全的一方先取件
      far_trigger: 失主在开场后发现箱子被错领
      far_consequence: 寄存间要按箱内申报价赔付，值班的场务与经手取件的人各担一半；错了的那一步会留在记录里。
      exits:
      - 把不符的箱子交场务封存，只带走自己那一只
      - 退出寄存流程，改为开场前亲手交接
      bindings:
      - activity: 清点寄存道具箱
        place: 展前临时寄存间
        pair: 0
    主题菜单上的那一栏改了价:
      source: 主题菜单的限定栏临时改了价，点单夹里的单子还按旧价在收。
      engines:
      - 资源锁定
      - 败犬青梅复仇战
      beats:
        trigger: '{npc}发现点单夹里的一叠单子还按旧价在收，限定牌的价已经换了。'
        objective: 在打烊前把已经点过的单子按哪一档结清楚
        choice: 把限定牌取下来重写、已上桌的不追价，或叫店长出来定这一栏
        immediate: 限定牌被取下重写，已上桌的不追价，点单夹里未下单的几张先撕掉
        near: 店方会按当班记录核对差额，插画师那一栏的文案要不要跟着改由本人决定
      far_trigger: 展会当天限定栏被顾客按错价投诉
      far_consequence: 差额由当班的人自付，店员被扣一班；挂在菜单上的插画与文案可能被整栏撤下。
      exits:
      - 把限定栏撤掉，当班只卖明码的常规单
      - 结清差额后退出这一档合作，不再供稿给主题菜单
      bindings:
      - activity: 试戴主题展演配饰
        place: 女仆咖啡厅接待区
        pair: 1
    货车要按趟计费:
      source: 司机按趟计费且不肯等，装不上的箱子只能留在装卸台过夜。
      engines:
      - 时限逼近
      - 资源锁定
      beats:
        trigger: '{npc}被司机告知按趟计费，装不上的箱子今晚没人再看管。'
        objective: 把展会开场前必须到的那几箱先装上车
        choice: 先装开场前必到的那几箱，或当场跟司机谈下一趟的价
        immediate: 先装车的箱子列了单子，装卸台上剩下的推到靠里的位置
        near: 下一趟的费用与时间当场谈定，留下的箱子按寄存票据逐箱登记
      far_trigger: 开场时仍有展位领不到成品册
      far_consequence: 社团要按预售量赔付并现场退票，司机的下一趟排到别家；装卸记录上的经手人要一起解释少了哪几箱。
      exits:
      - 只装必到的那几箱，其余改由作者自取
      - 结清当晚的趟费收工，剩下的箱子退回归属的展位
      bindings:
      - activity: 盯住装车顺序
        place: 深夜展馆后门装卸口
        pair: 3
    合约把陪席场次折进了工时:
      source: 店方新季菜单把陪席场次折进工时折抵单，折抵单按日落章；她的全年合约按剩余月份计赔，这一季签下去，陪席就从可选变成默认。
      engines:
      - 表面体面破裂
      - 债务压力
      beats:
        trigger: '{npc}把折抵单压在菜单校样底下，指给你看新增的那一栏。'
        objective: 在店主落章之前弄清这一栏把什么折了进去
        choice: 当场把陪席栏划回可选并注明；先签下这一季再谈改约
        immediate: 折抵单与菜单并排放在后厨台面上，店长的那枚章还没盖
        near: 划注过的单子要送店方回签，她的合约年内仍按原条款走
      far_trigger: 季末结工时店主按折抵单把陪席计入默认排班
      far_consequence: 默认排班一落章，中途退出就按剩余月份全赔；划回可选则她仍可只接台面班，欠款照旧按月还
      exits:
      - 当场划注并要求店方回签后再上岗
      - 把折抵单拍照留底，今晚的班交还店长另排
      bindings:
      - activity: 校对活动菜单
        place: 女仆咖啡厅后厨
        pair: 4
    委托单上新划的那一道线:
      source: 新季委托单在许可范围一栏多划了一道线，把「耳语」扩成了「贴耳收音」，样带仍要当夜封存；签认或划回都只能在开录前落笔。
      engines:
      - 对等试探
      - 秘密暴露倒计时
      beats:
        trigger: '{npc}把划过线的委托单推到谱架下，等你先开口。'
        objective: 在开录之前把这道线划回双方都认的范围
        choice: 划回原范围并双方签认；按新线录但母带加锁另存
        immediate: 委托单夹在谱架上，话筒还罩着防喷罩，谁都没碰开关
        near: 签认过的委托单存档一份，下季再改线就得两个人都到场
      far_trigger: 封存柜里那卷按新线录的样带被社团提走剪片
      far_consequence: 样带一旦进了流通剪片，越界部分就得她本人担责；加锁另存则这卷母带始终出不了封存柜
      exits:
      - 划回原范围签认后再开录
      - 把今晚棚时退掉，委托单交社团重谈
      bindings:
      - activity: 试录地方故事
        place: 声优录音棚
        pair: 5
    防窥帘外的滞留者:
      source: 闭馆前的备用更衣室只剩一张防窥帘隔着换装位，场务清场单上多出一个未登记的滞留者，帘外的脚步声停在配饰架旁没有走。
      engines:
      - 共处密闭
      - 皮套掉落危机
      beats:
        trigger: '{npc}听着帘外的脚步声停在配饰架旁，把手里的纸牌捏出了一道折痕。'
        objective: 在不惊动滞留者的前提下把人清出去或把自己送出去
        choice: 按场务渠道报清场；两人一前一后从主通道离开
        immediate: 纸牌立在门外原处，帘内的换装位空着，脚步声退向了货运通道
        near: 清场单上补上滞留者一笔，展后场务要核对当夜的门禁记录
      far_trigger: 次日展馆门禁记录与清场单对不上
      far_consequence: 对不上的那一笔落到谁头上谁就进黑名单；当场报清场则只是多留了一页记录
      exits:
      - 报场务清场后随工作人员从主通道离场
      - 当晚不再使用备用间，换装改到馆外据点
      bindings:
      - activity: 试摆展会路线牌
        place: 同人展备用更衣室
        pair: 0
    暗房红灯下多出一卷底片:
      source: 暗房红灯下晾着的样片里多出一卷不属于任何登记单的底片，登记单上只有你们两个的签名，展前封箱就要开箱。
      engines:
      - 秘密暴露倒计时
      - 旧事追索
      beats:
        trigger: '{npc}用夹子把那卷多余的底片从晾绳上取下来，对着红灯看片基的编号。'
        objective: 在封箱之前弄清这卷底片是谁放的、拍到了谁
        choice: 按登记单逐卷核对并登记这卷的来处；当面封存不开封
        immediate: 底片装进避光袋压在登记单下面，红灯还亮着，门外的布展人还在走动
        near: 封存袋上写明经手人，展后由登记单上的两个人一起开封
      far_trigger: 展前开箱时这卷底片混进公开样片
      far_consequence: 底片上的人像一旦展出就要当众追认拍摄许可；封存登记则责任停在放底片的人身上
      exits:
      - 把避光袋交场务登记台封存，展后当面对开
      - 退出暗房布展，这卷底片的来处交社团主催查
      bindings:
      - activity: 给道具底座加可拆支撑
        place: Cosplay暗房
        pair: 0
