id: mat-2bfa7ee5ec9a5289aa2ca12c4af25323
name: 湘西山路与乡志
material:
  eras:
  - 晚清民初湘西密林
  aesthetics:
  - 中式民俗志怪
  - 古墓探险硬派风
  rule: 山路、村寨、义庄与地宫入口交织，乡志同时保留目击与口述的差别。涉墓规矩由乡志与看山人口传：鸡鸣灯灭、长明灯灭即撤，乱动墓中起尸；生人不得回看身后影，破封后太岁黑气外溢，须按旧例补土回镇并通报合族共议。
  social_rule: 记录习俗前先征求当地人的意愿，不把传闻当作定论；外乡人渡口落店自带嫌疑，须由熟人引荐作保，生地方暂时不追问来处。
  places:
    破败义庄:
      details:
      - 义庄完好的门廊能看到新旧梁接痕，破损内间以木栏隔开
      - 油灯放在门侧，来客不触动寄放的棺具
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从已查验门廊退到村道，不进坍损内间找捷径
        witnesses:
        - 受托看屋的村民
        affordances:
        - 试辨旧屋营造痕
        - 从门廊比较修补年代
        pressure_modifiers:
        - 日间查验过的地面范围
        - 地方看守允许观察的部位
    寺庙后院:
      details:
      - 寺庙后院石凳围着一张乘凉矮桌
      - 说话人坐在熟人之间，可随时换谈收成或家常
      profile:
        privacy: low
        visibility: medium
        exits:
        - 从侧门走回寨路，暮后是否同行另行商量
        witnesses:
        - 自愿在场的讲述人和寺中执事
        affordances:
        - 听讲乡俗与回应
        - 不用落笔地听完一段故事
        pressure_modifiers:
        - 讲述人愿意公开的范围
        - 方言与编纂用语的差别
    医馆后堂:
      details:
      - 医馆后堂把诊疗柜与旅人物品桌分开
      - 行囊、干袜和包扎布放在靠门处，药材不作外来者试吃物
      profile:
        privacy: medium
        visibility: low
        exits:
        - 收好个人行囊经前堂离馆，不经过诊疗隔间
        witnesses:
        - 当班医者或药铺伙计
        affordances:
        - 整理采药行囊
        - 按已确认行程分配背负
        pressure_modifiers:
        - 当日渡桥与天气
        - 每人实际脚程与负重
    义庄纸库与停灵棚:
      details:
      - 义庄停灵棚以竹席隔出通铺位，纸扎人靠墙立在门口内侧·夜
      - 借宿人按旧例把鞋尖朝外摆，油灯整夜不许熄·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 天亮后经门廊退到村道，夜里不得独自离开纸库范围
        witnesses:
        - 受托看屋的村民或同宿的赶路人
        affordances:
        - 按旧例安排共宿位次
        - 清点纸扎与灯油存量
        pressure_modifiers:
        - 纸人摆放是否被人动过
        - 灯油够烧到鸡鸣的余量
    地宫断龙石夹道:
      details:
      - 断龙石落到一半，夹道只剩侧身能过的缝隙·夜
      - 石槽里的滑轨积着旧土，头顶落尘能听出余石还在动·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 在石落到底前退回前室，不抢从缝隙挤过去
        witnesses:
        - 同队进墓的其余人
        affordances:
        - 量石缝净宽与通过时间
        - 试推卡榫看石是否还会续落
        pressure_modifiers:
        - 断龙石自落到底的剩余时辰
        - 夹道里能站几个人
    古墓地宫入口:
      details:
      - 墓道口封土被雨水泡开一道口子，砖缝往外渗凉气·夜
      - 长明灯的灯膛还立着，灯芯只剩指长一截·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 沿放绳的原路退回坡上，不在雨里二次下墓
        witnesses:
        - 守墓人家与同队进墓的人
        affordances:
        - 量灯油余量与灯芯长度
        - 看封土渗水与山洪来路
        pressure_modifiers:
        - 暴雨到沟口的时间
        - 长明灯还能烧多久
    山腰义庄药棚:
      details:
      - 药棚把诊疗柜与棺木寄放棚隔开，前棚晾着待晒的草药·晨
      - 采药人把自用包袱放在门侧，药材不作外客试吃物·晨
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 收好磨好的药末经棚前小路下寨，不留在棺木棚过夜
        witnesses:
        - 当班药婆或帮工
        affordances:
        - 动手碾药与分包药末
        - 说出哪几味是自己采的
        pressure_modifiers:
        - 当日采到的药量与成色
        - 药婆肯不肯动手替换
    暴雨中的山神庙:
      details:
      - 山神像倒向一侧，供桌挪到墙角腾出一块干地·夜
      - 庙檐漏水成线，门外雨声压过人说话·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 等雨势转小沿石阶下山，不在雨里抢过沟
        witnesses:
        - 同队避雨的人或守庙人家
        affordances:
        - 清点干火种与干粮余量
        - 商量谁先离庙探路
        pressure_modifiers:
        - 檐下还能挤几个人
        - 火种还够不够取一次火
  pairs:
  - family: 学术与专业
    position: 同侪
    appellations:
    - 先生
    - 公子
    npc:
      role: 地方乡志编纂人
      function: 整理地方营造与口述资料，标出资料来自谁
      authority: 可删改自己的稿页，不能代表全寨解释习俗
      resource: 经过允许的旧屋草图与逐次访谈稿
      limitation: 不是营造匠或医者，未知结构和药性要请当地专业者确认
      obligation: 让讲述人知道拟公开哪些句子，避免混淆传闻和亲见
      exposure: 错述会让讲述人停止往来并影响乡志可信度
    player:
      identity: 山路向导
      baseline: 你照顾路上的人，也希望别人明白慢一点不是胆小。
      resources:
      - 近期走过的路径记忆
      - 备用干袜和自用水壶
      reputation: 不为证明本事让别人硬赶路
    relationship_reason: 编纂人上次因把旧屋传说当作结构说明被向导提醒，后来两人约好先看实物再听故事。
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 师傅
    npc:
      role: 山路向导
      function: 判断当日脚程、分配行囊并联系船家
      authority: 可拒绝带队走自己不能确认的路
      resource: 雨季水情的记性、过渡船家的口信与一副随身的背架
      limitation: 生寨的火塘不能随便坐，他引路只到熟人肯接的地方
      obligation: 出发前说明歇脚点与折返办法
      exposure: 赶行程伤了同行者会失去村寨托付
    player:
      identity: 受碑帖商托付下乡的拓碑客
      baseline: 你为义庄外那块断碑多留了三天，他每日替你问渡船；你们把碑上漫漶的字一行行对过去，也对清了彼此的脚程。
      resources:
      - 拓包、棕刷与两刀熟宣
      - 碑帖商预付的三成定钱
      reputation: 拓碑客，碑面没干透绝不起纸
    relationship_reason: 你为义庄外那块断碑多留了三天，他每日替你问渡船；你们把碑上漫漶的字一行行对过去，也对清了彼此的脚程。
  - family: 商业与产业
    position: 同侪
    appellations:
    - 先生
    npc:
      role: 出资收山货的客商
      function: 出本钱定下收山货的路数，也管着进墓的采买与发放
      authority: 可决定这一趟的工钱与货价，不能替村寨答应让路
      resource: 赊在山寨的账、随队的挑夫和现银
      limitation: 自己不认路不入墓，进山要靠向导与本地人带
      obligation: 出门前把工钱与分成讲在明处，不拖到出山再改口
      exposure: 货折在路上要自己贴本，且下一趟没人肯再跟着走
    player:
      identity: 有家学底子的赶山客
      baseline: 你识得旧墓格局与山中药性，却把家学当作祖上旧账，愿拿它换来一份真金白银，也换来能同行的伴。
      resources:
      - 祖上留下的半卷风水口诀与朱砂
      - 赶山用的背架与随身的铜钱罗盘
      reputation: 认得墓口却不拿它当炫耀的本事
    relationship_reason: 客商出本钱收山货，赶山客认路认药；两人在山寨前把分成和退路一次讲清，此后同进同出。
  - family: 终点与殡葬
    position: 外来者
    appellations:
    - 先生
    npc:
      role: 义庄守棺的仵作后人
      function: 看守停灵棚与棺前长明灯，替丧家按旧例守夜
      authority: 停灵棚的出入由他点头，逾例停灵须丧家按手印
      resource: 一本历代停灵簿与灯油添换的旧例
      limitation: 动不了义庄的地契，也管不了山外的官非
      obligation: 棺前的话不出棚，长明灯不灭是他的责任
      exposure: 逾例的事被写进乡志，义庄这行当就要断了传人
    player:
      identity: 受托续修乡志的外来笔客
      baseline: 你为义庄那一页旧例而来，守棺人却先问你能替逝者保守多少不写进书的门内事。
      resources:
      - 乡志的手抄底稿
      - 丧家托你带来的一封谢帖
      reputation: 记下的都给当事人过目，门内的话不落纸
    relationship_reason: 守棺人替你认过草稿上一处停灵旧例的误抄，你替他把一段不肯落纸的门内事从底稿里划了出去；这晚他掀开停灵棚的帘，让你看第七日还没下葬的那口棺。
  activities:
    试辨旧屋营造痕:
      places:
      - 破败义庄
      pairs:
      - 0
      - 3
      category: 调查与核验
      action: '{npc}站在获准门廊，邀你对照旧草图看哪一处木接痕显然较新。'
      beats:
        trigger: '{npc}站在获准门廊，邀你对照旧草图看哪一处木接痕显然较新。'
        objective: 从可见痕迹提出疑问，不凭旧图确认整屋稳固
        choice: 可对照一处；可请看屋人解释修补经过，或留在村道等候
        immediate: 看得见的更换痕迹与无法接近的部位分开，未查内间不写结论
        near: 下次如要详测须另请营造匠，今天的观察不授权拆物
    听讲乡俗与回应:
      places:
      - 寺庙后院
      pairs:
      - 0
      category: 日常接触
      action: '{npc}把稿本放到一旁，请在场讲述人选今天想讲的旧事，也问你想听还是聊家常。'
      beats:
        trigger: '{npc}把稿本放到一旁，请在场讲述人选今天想讲的旧事，也问你想听还是聊家常。'
        objective: 让讲述人决定故事的意义和谈话走向
        choice: 可听完说自己的感受；可问一句不涉及秘仪的词义，或只谈天气收成
        immediate: 叙述可以有不同版本，今夜不要求谁代表全寨给标准答案
        near: 愿意整理时另行征求讲述人意见，不因今晚相聚自动获得发表许可
    整理采药行囊:
      places:
      - 医馆后堂
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}将水壶、干袜和包扎布放在旅人物品桌，请你试背半日行囊。'
      beats:
        trigger: '{npc}将水壶、干袜和包扎布放在旅人物品桌，请你试背半日行囊。'
        objective: 让每个人带得动自己的日用物，不替医者决定采什么药
        choice: 可试背减重；可只准备留馆看书的茶水，或今天不同行
        immediate: 重新分放后肩带不再勒住一侧，超出脚程的远段先不列入计划
        near: 出发前再确认桥况和医者安排，试好行囊不构成必须出发的承诺
    按旧例分纸人旁的铺位:
      places:
      - 义庄纸库与停灵棚
      pairs:
      - 0
      category: 空间与退出
      action: '{npc}把纸扎人往墙里挪半尺，问你先挑哪一头铺位。'
      beats:
        trigger: '{npc}把纸扎人往墙里挪半尺，问你先挑哪一头铺位。'
        objective: 在不碰倒纸人的前提下把两处铺位分定
        choice: 先挑靠门那头；或按旧例由看屋人指位，各睡一头
        immediate: 铺位与鞋向当场定下，纸人位置不动
        near: 定下的位次决定这一夜谁先开口，改位要重走旧例
    试推断龙石卡榫:
      places:
      - 地宫断龙石夹道
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}侧身挤在石缝里，请你隔着石面听一下余石还在不在动。'
      beats:
        trigger: '{npc}侧身挤在石缝里，请你隔着石面听一下余石还在不在动。'
        objective: 判断石是停住了还是还会续落
        choice: 贴着石面听一段；或直接退回前室另想办法
        immediate: 听到的动静决定此刻是否有人留在夹道
        near: 石若续落，退路要提前定，不许靠硬挤抢时间
    数长明灯灯油余量:
      places:
      - 古墓地宫入口
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}把灯芯拨亮一截，请你按灯膛里的油面估算还能烧几个时辰。'
      beats:
        trigger: '{npc}把灯芯拨亮一截，请你按灯膛里的油面估算还能烧几个时辰。'
        objective: 把撤出时辰压在灯熄之前
        choice: 照实报出估算；或请守墓人核一遍再定时间
        immediate: 估算当场成为撤出节点，不靠猜
        near: 灯比估的烧得快，就要提前一轮撤，不许临时改口
    把采药人换下的药碾过一遍:
      places:
      - 山腰义庄药棚
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}把别处采来的药末倒进铜碾，请你手上过一遍看成色。'
      beats:
        trigger: '{npc}把别处采来的药末倒进铜碾，请你手上过一遍看成色。'
        objective: 分清哪几味是本人采的，哪几味是别处来的
        choice: 动手碾一遍并说出判断；或只交药不评成色
        immediate: 分出来的药末当场分开装，混装的另放一处
        near: 药末一旦混装就要整包重碾，药材损失记在动手的人身上
    在暴雨里点一次干火种:
      places:
      - 暴雨中的山神庙
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}把最后一撮干火种倒在瓦片上，请你在漏雨的檐下试一次能否取火。'
      beats:
        trigger: '{npc}把最后一撮干火种倒在瓦片上，请你在漏雨的檐下试一次能否取火。'
        objective: 把火留在庙里，不让队伍在雨里走散
        choice: 接过来试一次；或把火种原样交回，改用干粮硬撑
        immediate: 取火成败当场见分晓，取不到就不再耗第二撮
        near: 火种断在此夜，之后各人的去留得靠火把以外的东西谈
    当客商面分清祖上与自己的:
      places:
      - 山腰义庄药棚
      pairs:
      - 2
      category: 信息交换
      action: '{npc}把祖上留下的半卷口诀摊在药碾旁，问这份东西算本钱还是算你抵来的工。'
      beats:
        trigger: '{npc}把祖上留下的半卷口诀摊在药碾旁，问这份东西算本钱还是算你抵来的工。'
        objective: 把祖上的名气和自己出的力分开算
        choice: 当场把口诀收进自己怀里；或照客商的意思折成这一趟的本钱
        immediate: 谁的归谁当场分开，账上写的名字由出钱的人认
        near: 分开算的以后各凭本事，折成本钱的路子往后每一趟都要跟着客商走
  customs:
  - 讲述人可以在故事旁留下自己的别称，也可以要求不署名。
  pressures:
    渡桥修缮改变归途:
      source: 向导收到船家口信，原计划返程经过的渡桥当天停止通行。
      engines:
      - 资源锁定
      - 时限逼近
      beats:
        trigger: '{npc}发现向导收到船家口信，原计划返程经过的渡桥当天停止通行。'
        objective: 在离馆前确认可承受的返程时间
        choice: 另问当天船班并缩短采药段；或留馆休息等桥况明确
        immediate: 行囊按缩短行程保留必需品，不因准备好就硬出发
        near: 改乘船可能多一笔费用，是否同行各自决定，向导不垫无限船钱
      far_trigger: 第二天仍不能确认桥船而有人催走远段
      far_consequence: 远段计划取消，医馆调整取材安排；确认短路后再议，不用想象近道替代实况
      bindings:
      - activity: 整理采药行囊
        place: 医馆后堂
        pair: 1
      exits:
      - 取消今天同行，退回未用的借物
      - 改为馆内整理日用物，向导把带路安排交下一班
    乡俗记录出现异议:
      source: 讲述人在院中指出上一版未刊稿把祭日的家族惯例写成全寨规矩。
      engines:
      - 名声保卫
      - 信任透支
      beats:
        trigger: '{npc}发现讲述人在院中指出上一版未刊稿把祭日的家族惯例写成全寨规矩。'
        objective: 把家族叙述的范围还给本人，不逼其为整寨作证
        choice: 请本人指出愿保留的范围；或整段撤稿，继续普通聊天
        immediate: 争议页不送刊，讲述人不需要交出更多私事来证明自己
        near: 编纂人自己承担改稿，不要求向导替其他家族表态
      far_trigger: 付印前仍沿用全寨统一的错误说法
      far_consequence: 其他讲述人也可能收回合作，乡志失去地方依据；如实限定范围则可保留多种经验
      bindings:
      - activity: 听讲乡俗与回应
        place: 寺庙后院
        pair: 0
      exits:
      - 撤下本段并停止本次访谈
      - 讲述人结束话题离院，编纂人自行处理改稿
    太岁黑气外溢封土口:
      source: 封土被雨水冲开的当晚，太岁黑气外溢，散在口子上，靠得近就头晕、物件蒙上暗霜。
      engines:
      - 感染倒计时
      - 身份风险
      beats:
        trigger: '{npc}发觉封土口散出的黑气一夜之间低垂到过道，人一靠近就头晕。'
        objective: 在气还没漫到村寨之前把口子回镇
        choice: 照旧例补土回镇；或引开旁人只做封口，不解释来由
        immediate: 口子暂封，头晕的人被挪到上风处
        near: 气往下沉就得出山通报，瞒到合族问起更难收场
      far_trigger: 黑气漫到山腰水源或寨中有人开始失魂
      far_consequence: 合族追到封土口查旧事，乡志被列为首证而赶山客的家学底子成了债；依旧例先行回镇则可保留解释权
      bindings:
      - activity: 数长明灯灯油余量
        place: 古墓地宫入口
        pair: 0
      - activity: 按旧例分纸人旁的铺位
        place: 义庄纸库与停灵棚
        pair: 0
      exits:
      - 撤出墓外围，把回镇的事交给守墓人家与合族共议
      - 退出解封，任旧例照原样执行
    暴雨山洪倒灌地宫:
      source: 上游连日暴雨，山洪到沟口就能沿墓道倒灌；沟里两处岔口淹水顺序不同，退不出去就得先认下哪条是活路。
      engines:
      - 时限逼近
      - 生门死门风水罗盘抉择
      beats:
        trigger: '{npc}听见沟里水声变了调，墓道口开始往外冒浑水。'
        objective: 在倒灌前定下撤出的一条路
        choice: 照罗盘取一道口子硬撤；或退回高处等水落再走
        immediate: 定下的路当场走人，绳索与器械原地弃下
        near: 水涨到夹道就再没有第二条，救不回来的东西只得认下
      far_trigger: 同日深夜水位越过夹道，或者有人擅自折返取落下的家伙
      far_consequence: 折返的人被水堵在夹道，墓里取出的东西一件都带不出；按定下的路撤走则人货两全，只是这趟白干
      bindings:
      - activity: 试推断龙石卡榫
        place: 地宫断龙石夹道
        pair: 1
      - activity: 在暴雨里点一次干火种
        place: 暴雨中的山神庙
        pair: 1
      exits:
      - 弃下重物沿高处退到庙里再议
      - 把绳索器械留在墓里，人先出沟
    身体透支:
      source: 连着两夜没合眼，手上的绳结开始打颤，指节磨破又冻住；再顶一段就是手一松把人摔下去。
      engines:
      - 伤病互护
      - 咬痕瞒到了极点
      beats:
        trigger: '{npc}发现你系绳的手在抖，绳结第二遍才系紧。'
        objective: 决定谁下、谁守绳，别把命押在一双抖手上
        choice: 交绳换手歇一炷香；或明说自己在撑，让对方决定下不下
        immediate: 绳交到谁手上当场定下，抖手的人退到守绳位
        near: 歇下的时辰要拿夜里的干粮补，硬撑则下一段无人敢同绳
      far_trigger: 第三夜仍无人换手，或者坚持要自己下竖井
      far_consequence: 摔下去的不只是自己，同行者要么跟着赔命要么当场散伙；换过手则可把这一趟走完
      bindings:
      - activity: 按旧例分纸人旁的铺位
        place: 义庄纸库与停灵棚
        pair: 0
      - activity: 把采药人换下的药碾过一遍
        place: 山腰义庄药棚
        pair: 1
      exits:
      - 退回坪上养手，把下井的安排交给同行的人
      - 交还绳索与器械，退出这一趟
    铜钱罗盘指针乱颤:
      source: 铜钱罗盘一进墓道就指针乱颤，认不出南北；守墓人认灯位，赶山客认方位，两套说法各指一条口子。
      engines:
      - 生门死门风水罗盘抉择
      - 同行队伍里的身份疑云
      beats:
        trigger: '{npc}发现铜钱罗盘一进墓道就指针乱颤，认不出南北。'
        objective: 在罗盘失灵前定下听谁指路
        choice: 照罗盘取一条路；或全队听守墓人的灯位走
        immediate: 当场只认一套走法，另一套说法的人留在原处不跟
        near: 走错一次就要重走全套，认错人也一样要重走
      far_trigger: 下一段岔口两套说法再相持，或者有人趁暗改了标记
      far_consequence: 队伍在岔口上分道，走散的人未必能回来；当场只认一套则可整队出去
      bindings:
      - activity: 试推断龙石卡榫
        place: 地宫断龙石夹道
        pair: 1
      - activity: 数长明灯灯油余量
        place: 古墓地宫入口
        pair: 0
      exits:
      - 退出墓道，把路线的争执带回寨里再定
      - 交出罗盘，只跟着灯位走
    义庄纸人借宿夜:
      source: 纸扎人立在门内侧，旧例说借宿人不许挪动纸人、鞋尖须朝外；挪了就是留客，人走了纸人替。
      engines:
      - 共处密闭
      - 共同秘密
      beats:
        trigger: '{npc}发现纸人不在原位，鞋尖也没按旧例朝外。'
        objective: 在鸡鸣之前把旧例补齐，不让谁独自顶下这桩事
        choice: 两人一起把纸人回位；或当场说清是谁挪的，按旧例各自补过
        immediate: 纸人与鞋向当场归位，值班看屋人只记这一夜
        near: 这一夜谁挪的纸人只有两人知道，出庄后说法各一就要当场对质
      far_trigger: 次日纸人被谁再动一次，或出庄后有人先说出这一夜
      far_consequence: 翻出的不只是纸人位置，还有这一夜两人为何不分开睡；自行回位则旧例照旧，谁也不必替谁认
      bindings:
      - activity: 按旧例分纸人旁的铺位
        place: 义庄纸库与停灵棚
        pair: 0
      - activity: 在暴雨里点一次干火种
        place: 暴雨中的山神庙
        pair: 1
      exits:
      - 天亮即告辞，不等村寨传话
      - 把纸人交还看屋人处置，自己不再进停灵棚
    地宫断龙石落下一半:
      source: 断龙石已经落到一半，夹道只剩侧身过的缝；石还在慢慢续落，再从缝里挤就得赌它在这几息里停住。
      engines:
      - 共处密闭
      - 时限逼近
      beats:
        trigger: '{npc}发现断龙石又往下落了一小截，缝隙只够侧身。'
        objective: 在放手前让每个人都退到石外侧
        choice: 两人一起顶住石槽抢最后一个过；或只放一个人先过，另一人另寻退路
        immediate: 放手还是顶住当场定下，卡榫位置留出来
        near: 顶过的人手肘要养些时日，没能过的另寻退路，出不来就再没消息
      far_trigger: 石落到底封死夹道，或者有人回去搬石
      far_consequence: 封死之后再无通路，队伍只能从前室另找出口；两人同时退出则财物尽弃而人都还在
      bindings:
      - activity: 试推断龙石卡榫
        place: 地宫断龙石夹道
        pair: 1
      - activity: 数长明灯灯油余量
        place: 古墓地宫入口
        pair: 0
      exits:
      - 两人一起退出地宫前室，不再回头取东西
      - 封好夹道标记留给后来人，径直回寨
    寻亲有果:
      source: 那户人家对上了祖上旧账的凭据，认下这趟来的人；可凭据上写的那桩旧事，正压在村寨不肯提的那一页乡志里。
      engines:
      - 旧事追索
      - 双重马甲互掉现场
      beats:
        trigger: '{npc}把祖上旧账的凭据摊在桌上，问谁肯当场认下这趟来路。'
        objective: 认下亲缘又不把村寨的忌讳翻到台面上
        choice: 当场认凭据；或只认物件不认那桩旧事的说法
        immediate: 认与不认当场给出，凭据留在桌上不作抵押
        near: 认下的名分以后要担着，回避则这门亲缘也就到此
      far_trigger: 乡志付印月里那桩旧事被人翻出来对照
      far_consequence: 认下的亲缘被卷进村寨的旧账，写乡志的人两头为难；当场只认物件的则仍可保留退路
      bindings:
      - activity: 把采药人换下的药碾过一遍
        place: 山腰义庄药棚
        pair: 1
      - activity: 按旧例分纸人旁的铺位
        place: 义庄纸库与停灵棚
        pair: 0
      - activity: 当客商面分清祖上与自己的
        place: 山腰义庄药棚
        pair: 2
      exits:
      - 认下亲缘，把旧事另约一处在寨外说
      - 只收凭据不留话，连夜下山
    停灵逾例的第七日:
      source: 义庄停灵棚里那口棺停到了旧例上限的第七日，棺前长明灯的灯油只够一夜，丧家两房为下葬吉时相持不下，停灵簿这一页等着有人落笔。
      engines:
      - 长明灯灭与起尸倒计时
      - 旧事追索
      beats:
        trigger: '{npc}把停灵簿翻到空着的那一页，灯芯又短了一截。'
        objective: 在灯油耗尽与旧例上限之前定下这一页记谁的名字
        choice: 按旧例请两房长辈进棚当面落笔；把簿子合上等丧家自己谈拢
        immediate: 长明灯续了半盏，棺还停在原处，棚外的两房都没散
        near: 第七日一过，逾例停灵就得写明缘由，看过这一页的人都脱不开
      far_trigger: 灯油燃尽而停灵簿仍无一字
      far_consequence: 逾例之记会追到守棺人头上，义庄的传人就此换人；赶在灯灭前落笔则旧例可续，门内的话仍不出棚
      bindings:
      - activity: 试辨旧屋营造痕
        place: 破败义庄
        pair: 3
      exits:
      - 搁笔出棚，把落页之事交还丧家两房
      - 只记灯油与日期，不记名姓，乡志仍留白
  legacy_sources:
    eras:
    - 晚清民初湘西密林
    aesthetics:
    - 中式民俗志怪
    - 古墓探险硬派风
    places:
    - 破败义庄
    - 寺庙后院
    - 医馆后堂
  themes:
  - 乡志书写和当地人的自我解释
  - 山路知识中的季节与身体负担
  - 旧建筑与民俗不只是猎奇素材
  technology_boundary: 晚清民初湘西山地以油灯、绳尺、手抄行路簿、口信和渡船往来；医馆日常仍由当地医者决定，不因写乡志而获得诊疗能力。志怪传闻可作为人物经验，但不能用灵验符号代替桥况、路程或药物辨识。
  bridge_status: not_required
