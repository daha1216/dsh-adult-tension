id: mat-33ffa06662dd50978821b62840ae86f4
name: 地下管廊与城市修理局
material:
  eras:
  - 当代都市
  aesthetics:
  - 行当正剧
  - 暖色生活流
  - 都市妖异奇谭
  - 隔音录音棚暗夜私语
  rule: 城市把地下设施的维修记录向居民开放；现场作业由合格人员承担，公众可以核实影响范围并提出优先顺序；地面展示厅与值班室之外，管廊作业隔离段、夜间闭馆场馆与产权待转的旧店面一律按作业或转让状态限人进入，任何在场者都不得替未露面的一方署名。
  social_rule: 公共服务中断必须说明范围和恢复安排；参观者不进入作业隔离区。
  customs:
  - 修理局会把换下来的零件做成剖面展品。
  places:
    管廊地面展示厅:
      details:
      - 透明支线模型旁摆着可移动门牌块·日间
      - 公开报修摘要隐去了住户姓名·日间
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿地面通道回到服务大厅
        witnesses:
        - 值守讲解员
        - 前来问询的居民
        affordances:
        - 比对支线模型与报修点
        - 结束活动并离开
        pressure_modifiers:
        - 模型更新日期
        - 报修摘要已核实范围
    公共修理台:
      details:
      - 断电旧灯外壳和试装护边分放零件盘·日间
      - 未做电气检验的标识挂在灯座旁·日间
      profile:
        privacy: low
        visibility: high
        exits:
        - 台前开放等候区与服务大厅
        witnesses:
        - 旧器修复工
        - 等候领物的住户
        affordances:
        - 给旧灯外壳补一块护边
        - 结束活动并离开
        pressure_modifiers:
        - 主人同意的修补范围
        - 可用护边材料
    居民报修茶桌:
      details:
      - 旧街设施照片与茶杯分放长桌两端·傍晚
      - 旁边留着不填写问卷也能坐的椅子·傍晚
      profile:
        privacy: low
        visibility: high
        exits:
        - 服务中心门厅
        witnesses:
        - 自愿留坐的居民
        - 收桌志愿者
        affordances:
        - 交换一处街角设施的记忆
        - 结束活动并离开
        pressure_modifiers:
        - 参与者愿意分享的经历
        - 茶桌收场时间
    管廊作业隔离段:
      details:
      - 地面展示厅下方的主廊作业段由防爆闸门与检修灯分段隔开·夜班
      - 各段氧含量与通风状态显示在地下值班室面板上，隔离段实行双人进场·夜班
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 沿检修梯回到地面值班室
        - 经双人签退从换气井口离开
        witnesses:
        - 当值班长
        - 同段作业的搭班人员
        affordances:
        - 核对一段支线的现场标识与旧图差异
        - 把通风状态读给地面值班室
        pressure_modifiers:
        - 各段氧含量与通风读数
        - 夜间作业许可的剩余时段
    地下值班室:
      details:
      - 绿色警示台灯与工单屏分放长桌两端，人员进出登记簿压在灯座下·夜班
      - 裁员名单与末位约谈排期表贴在门内侧，只用工号不用姓名·夜班
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经地面楼梯回到服务大厅
        - 从维修通道直接进入管廊作业隔离段
        witnesses:
        - 当值班长
        - 同班交接的检修调度员
        affordances:
        - 调阅本人名下未结工单与复查报告进度
        - 把一段支线的疑点写进交接记录
        pressure_modifiers:
        - 绿色警示台灯的通断指示
        - 排期表上本人所在名次
    旧街屋顶平台:
      details:
      - 居民投诉的信箱群在楼下一层，屋顶只留晒衣绳与水塔·傍晚
      - 平台无护栏的一段被旧砖压着，是这一片唯一能单独抽烟的地方·傍晚
      profile:
        privacy: medium
        visibility: low
        exits:
        - 经消防梯回到顶层走廊
        - 从内楼梯退到楼下单元门
        witnesses:
        - 上来收衣服的邻居
        affordances:
        - 避开屋里的人单独接一通电话
        - 把没处放的旧物暂存在水塔下
        pressure_modifiers:
        - 屋里是否有人等门
        - 这一片邻居互相看得见的程度
    居民楼道与顶层隔断间:
      details:
      - 老旧小区的顶楼隔断间按床位出租，走廊公共厨房的煤气罐旁堆着各户的纸箱·夜
      - 隔断间没有独立门牌，快递与催收都是先找到楼下一层再喊上来·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿公共楼梯下到单元门
        - 从顶层连廊退到隔壁单元的疏散口
        witnesses:
        - 同层合租的住户
        - 来收欠费的房东或催收人
        affordances:
        - 找到一处按周结算的临时落脚
        - 向同层住户打听谁最近搬走了
        pressure_modifiers:
        - 欠租天数与房东上门的频率
        - 同层住户愿不愿意替你留口信
    社区诊所夜诊室:
      details:
      - 挂号窗口已关，夜诊室只留一盏台灯与一张处置床·夜
      - 药柜按处方锁着，值班医生的私人物品都收进抽屉·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 经走廊尽头的夜间出口离开
        - 从分诊台旁的侧门退到室外
        witnesses:
        - 夜班值守医生
        affordances:
        - 处理一处不便走正规流程的旧伤
        - 问清某类药的用法与上限
        pressure_modifiers:
        - 值班医生愿不愿意留下书面记录
        - 药柜里还剩下多少可用剂量
    医院住院部走廊:
      details:
      - 陪护椅沿走廊排开，探视时间过后只剩床头灯与输液泵的提示音·夜
      - 住院押金与自费药清单夹在护士站文件架上，只家属可调阅·夜
      profile:
        privacy: medium
        visibility: high
        exits:
        - 经电梯厅离开住院部
        - 从楼梯间退到楼下急诊入口
        witnesses:
        - 值守护士
        - 同层其他病人的家属
        affordances:
        - 在探视时段外短暂陪一次床
        - 向护士站问清下一笔费用的截止日
        pressure_modifiers:
        - 下一笔押金与自费药的截止日
        - 科室床位周转与转科排期
    通宵营业的桌游店包间:
      details:
      - 包间按小时计费，桌面下压着上一桌留下的记分纸·夜
      - 隔间只用布帘分隔，店长随时可以掀帘查场·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 结掉台费从店门离开
        - 从后巷的员工通道退走
        witnesses:
        - 巡场的店长
        - 隔壁包间的熟人
        affordances:
        - 用一局牌把话说开而不留记录
        - 在布帘后面交出一件不方便带在身上的东西
        pressure_modifiers:
        - 台费结算到几点
        - 隔壁包间坐着谁
    通宵后的清晨菜市场:
      details:
      - 凌晨四点的批发行先卸货，摊主各自占位，收市前谁先到谁先挑·清晨
      - 隔夜未结的账款用粉笔写在摊位木板上，抹掉就算认下·清晨
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿市场后门退到居民区小巷
        - 从主通道回到早班公交站
        witnesses:
        - 邻摊的摊主
        - 来批货的熟客
        affordances:
        - 用现金结一笔不走账的往来
        - 打听昨晚出事的那条街的真实说法
        pressure_modifiers:
        - 摊位木板上未抹掉的欠账
        - 收市时间与当天的进货量
    停工的老旧剧院后台:
      details:
      - 剧院停业待改，后台只剩一面化妆镜与几排落灰的衣架·夜
      - 侧门锁早被换过，看场人把钥匙交给谁只有他自己清楚·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 从后台侧门退到剧院后巷
        - 经观众席侧廊退到前厅防火门
        witnesses:
        - 受托看场的人
        affordances:
        - 借一处不会有闲人进来的地方把话说完
        - 在化妆镜下当面看清对方的神色
        pressure_modifiers:
        - 侧门钥匙掌握在谁手上
        - 改建动工还有几天
    已停业的私人健身房器械间:
      details:
      - 会员卡早已停售，器械蒙着防尘布，跑步机电源被锁在总闸·夜
      - 更衣室储物柜还有几个没清空，锁是会员自己带来的·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 经器械间消防通道退到后院
        - 从前台侧门离开回到街面
        witnesses:
        - 持钥匙的旧会员
        affordances:
        - 在无人处处理一处复发旧伤的固定与拉伸
        - 把一份文件当面交到对方手上而不被第三人看见
        pressure_modifiers:
        - 谁还留着进门的钥匙
        - 旧伤复发到能承受到哪一步
    夜间闭馆的室内泳馆:
      details:
      - 泳池闭馆后只留水下照明，池边湿度很高、声音贴水传得远·夜
      - 救生台已收，水线浮标停在浅水侧，更衣室只开一条通道·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 从更衣通道退到泳馆侧门
        - 经设备间走廊回到前台大厅
        witnesses:
        - 闭馆前最后清场的管理员
        affordances:
        - 在水里做一段无法被别人打断的对话
        - 让身上的旧伤与体能在水里显出真实上限
        pressure_modifiers:
        - 闭馆后管理员还会不会回来查场
        - 水里能撑住的长度
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 管网检修调度员
      function: 核实居民报修与现场记录
      resource: 地面支线模型、带更新日期的公开检修图与值班联络渠道
      authority: 协调补充巡检信息并提出顺序建议，停复供由当值授权人员确认
      limitation: 不能让未受训人员操作设备
      obligation: 将居民自述与已核实供区分开，再交合格人员安排检修
      exposure: 遗漏支线会让同一处故障再次出现
      hidden: —
    player:
      identity: 社区设施联络员
      baseline: 你们曾共同追查一段反复停水的支线，现在约好整理居民反馈。
      resources:
      - 居民授权汇总的报修时间与影响范围
      reputation: 调度员记得你提供过可核对的住户反馈。
    relationship_reason: 你们曾共同追查一段反复停水的支线，现在约好整理居民反馈。
  - family: 服务与手艺
    position: 旧识
    appellations:
    - 直呼其名
    npc:
      role: 旧器修复工
      function: 说明可修与不可修的部分
      resource: 两种护边材料、断电示范件与报废零件剖面
      authority: 决定展示品的修复方案
      limitation: 修复练习不等于实用设备验收
      obligation: 说明补外壳与电气合格的区别，拆下旧件交还主人
      exposure: 不说明损耗会让人误以为旧物已经恢复可靠
      hidden: —
    player:
      identity: 带来旧台灯的住户
      baseline: 你曾向修复工讲述旧灯的来历，对方邀请你看看留下的结构。
      resources:
      - 自己带来的断电旧台灯与使用经历
      reputation: 修复工听过旧灯的来历，尚未完成这次修复。
    relationship_reason: 你曾向修复工讲述旧灯的来历，对方邀请你看看留下的结构。
  - family: 服务与手艺
    position: 上司
    appellations:
    - 主任
    npc:
      role: 修理局运维主管
      function: 核定值班排班、绩效名次与末位约谈名单
      resource: 值班排班表、绩效名次表与末位约谈排期
      authority: 决定谁留在夜班名单上，无权越过规程改动停复供授权
      limitation: 名单只有建议权，最终去留要走复核会
      obligation: 先把口径讲明白再约谈，不拿名单当私器使
      exposure: 被写成拿名次换人情，整班人都不会再替他说话
      hidden: 排期表上留了三个空位，名字还没填
    player:
      identity: 夜班检修调度员
      baseline: 你在夜班名单上排中游，这次约谈被排在最后一个，说明还有余地。
      resources:
      - 自己名下未结工单与响应时间记录
      reputation: 主管知道你从没漏报过一处支线，但也不知道你为什么急着要这个名额。
    relationship_reason: 你们在同一值班室里交接了两年工单，名单贴出来那天他先让你看，只说了句「先想想」
  - family: 服务与手艺
    position: 被求助者
    appellations:
    - 先生
    npc:
      role: 旧街设施的常住户
      function: 说清一处设施十几年里的实际用法和它坏过几次
      resource: 历年报修的回执、旧街照片和一把还能开单元门的钥匙
      authority: 对自家楼道的通行与留宿与否说得算
      limitation: 他的证言不能替代检修记录，进不了隔离段
      obligation: 只讲自己亲眼见过的，不替别人编时间线
      exposure: 话讲偏一次，整段街坊的证言都会被调度疑问
      hidden: 他自己就是当年那次改线的知情人之一
    player:
      identity: 社区设施联络员
      baseline: 你要问的是一段支线，他讲的却全是这十几年里楼下那盏灯什么时候灭过。
      resources:
      - 居民授权的报修时间与影响范围汇总
      reputation: 他愿意让你进门，是因为你上一次把话说清了才走。
    relationship_reason: 你们在茶桌上交换过一处街角设施的记忆，之后他说有事可以上楼找他，不必等问卷。
  - family: 地下与灰色地带
    position: 旧识
    appellations:
    - 直呼其名
    npc:
      role: 管廊施工的匿名代接人
      function: 替不露面的雇主转交委托，只谈范围、工期和钱，不留名
      resource: 一份只写代号的施工单、一条只接单不回拨的号码
      authority: 能敲定委托范围与尾款时点，改不了停复供授权
      limitation: 雇主不露面，出了事只能他自己顶上
      obligation: 开工前把谁签字、出了问题找谁写在纸上
      exposure: 被写成居中吃差价，两边渠道都会先断他
      hidden: 他知道雇主是谁，但那份委托单上确实没有名字
    player:
      identity: 接私活的持证检修工
      baseline: 你接过他的单，也知道这类单子最后出问题时，署名的人从来不是雇主。
      resources:
      - 自己的作业证与可承揽的范围说明
      reputation: 他找你是看重你不问多余的话，可他也不确定你这次还肯不肯。
    relationship_reason: 上一段支线的活是他转给你的，尾款比你报的多了三天就结清，从那以后他单线联系你。
  - family: 地下与灰色地带
    position: 知情不报者
    appellations:
    - 直呼其名
    npc:
      role: 同段的搭班检修工
      function: 与你同班作业，替你在交班记录上签字
      resource: 两把隔离段钥匙中的一把与一份未上报的巡检底稿
      authority: 能在现场叫停作业，不能改动已归档的工单
      limitation: 一旦被查，他手上那份底稿就是全部证据
      obligation: 同段双人进场，谁先发现异常谁先说
      exposure: 底稿见光会牵出两个人，他最怕的还是家里那位先知道
      hidden: 他早在一周前就看出那段标识对不上，没说
    player:
      identity: 夜班检修调度员
      baseline: 你们搭班两年，你一直以为交班记录上的签名是他写的，直到那天笔迹不对。
      resources:
      - 本人值班权限与交接记录
      - 对那段支线走向的独立判断
      reputation: 他信你不会把这事捅上去，可你也知道不捅上去自己就得扛。
    relationship_reason: 你们在同一个隔离段值过最长的夜班，他把备用钥匙给过你一次，那晚谁也没提为什么。
  - family: 动物与驯养
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 市政管网巡检犬训导员
      function: 带犬走管廊，用犬只反应标出燃气与渗漏疑点
      resource: 一条只认他口令的巡检犬、一箱见底的镇静剂和犬只健康台账
      authority: 能决定这条犬今天下不下去，改不了任何停复供安排
      limitation: 犬只状态不合格就得整段停检，他没有替补犬
      obligation: 用药与作业时长都要上账，不带疲犬进廊
      exposure: 台账对不上，先被停的是他和这条犬的搭档资格
      hidden: 镇静剂剩量比台账上写的更少，是他自己省出来的
    player:
      identity: 持证检修工
      baseline: 你不养犬，但你知道这条犬今天的状态决定你那段能不能查完。
      resources:
      - 本人作业证与一段支线的现场判断
      reputation: 他愿意与你搭班，是因为你从不催一条走不动的犬。
