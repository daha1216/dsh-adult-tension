id: "mat-33ffa06662dd50978821b62840ae86f4"
name: "地下管廊与城市修理局"
material:
  eras:
    - "当代都市"
  aesthetics:
    - "行当正剧"
    - "暖色生活流"
  rule: "城市把地下设施的维修记录向居民开放；现场作业由合格人员承担，公众可以核实影响范围并提出优先顺序。"
  social_rule: "公共服务中断必须说明范围和恢复安排；参观者不进入作业隔离区。"
  customs:
    - "修理局会把换下来的零件做成剖面展品。"
  places:
    管廊地面展示厅:
      details:
        - "透明支线模型旁摆着可移动门牌块·日间"
        - "公开报修摘要隐去了住户姓名·日间"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "沿地面通道回到服务大厅"
        witnesses:
          - "值守讲解员"
          - "前来问询的居民"
        affordances:
          - "比对支线模型与报修点"
          - "结束活动并离开"
        pressure_modifiers:
          - "模型更新日期"
          - "报修摘要已核实范围"
    公共修理台:
      details:
        - "断电旧灯外壳和试装护边分放零件盘·日间"
        - "未做电气检验的标识挂在灯座旁·日间"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "台前开放等候区与服务大厅"
        witnesses:
          - "旧器修复工"
          - "等候领物的住户"
        affordances:
          - "给旧灯外壳补一块护边"
          - "结束活动并离开"
        pressure_modifiers:
          - "主人同意的修补范围"
          - "可用护边材料"
    居民报修茶桌:
      details:
        - "旧街设施照片与茶杯分放长桌两端·傍晚"
        - "旁边留着不填写问卷也能坐的椅子·傍晚"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "服务中心门厅"
        witnesses:
          - "自愿留坐的居民"
          - "收桌志愿者"
        affordances:
          - "交换一处街角设施的记忆"
          - "结束活动并离开"
        pressure_modifiers:
          - "参与者愿意分享的经历"
          - "茶桌收场时间"
  pairs:
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "直呼其名"
      npc:
        role: "管网检修调度员"
        function: "核实居民报修与现场记录"
        resource: "地面支线模型、带更新日期的公开检修图与值班联络渠道"
        authority: "协调补充巡检信息并提出顺序建议，停复供由当值授权人员确认"
        limitation: "不能让未受训人员操作设备"
        obligation: "将居民自述与已核实供区分开，再交合格人员安排检修"
        exposure: "遗漏支线会让同一处故障再次出现"
        hidden: "—"
      player:
        identity: "社区设施联络员"
        baseline: "你们曾共同追查一段反复停水的支线，现在约好整理居民反馈。"
        resources:
          - "居民授权汇总的报修时间与影响范围"
        reputation: "调度员记得你提供过可核对的住户反馈。"
      relationship_reason: "你们曾共同追查一段反复停水的支线，现在约好整理居民反馈。"
    -
      family: "服务与手艺"
      position: "旧识"
      appellations:
        - "直呼其名"
      npc:
        role: "旧器修复工"
        function: "说明可修与不可修的部分"
        resource: "两种护边材料、断电示范件与报废零件剖面"
        authority: "决定展示品的修复方案"
        limitation: "修复练习不等于实用设备验收"
        obligation: "说明补外壳与电气合格的区别，拆下旧件交还主人"
        exposure: "不说明损耗会让人误以为旧物已经恢复可靠"
        hidden: "—"
      player:
        identity: "带来旧台灯的住户"
        baseline: "你曾向修复工讲述旧灯的来历，对方邀请你看看留下的结构。"
        resources:
          - "自己带来的断电旧台灯与使用经历"
        reputation: "修复工听过旧灯的来历，尚未完成这次修复。"
      relationship_reason: "你曾向修复工讲述旧灯的来历，对方邀请你看看留下的结构。"
  activities:
    比对支线模型与报修点:
      places:
        - "管廊地面展示厅"
      pairs:
        - 0
      category: "调查与核验"
      action: "{npc}在地面模型上亮起一条支线，请你把两处居民报修的时刻放在对应门牌边。"
      beats:
        trigger: "{npc}在地面模型上亮起一条支线，请你把两处居民报修的时刻放在对应门牌边。"
        objective: "判断相邻报修是否真的属于同一支线"
        choice: "对照一处门牌，或只看讲解；不参与可把已授权摘要交回"
        immediate: "两条表面相近的报修按供区与时间分开，遗漏门牌留待调度核实，不碰实际阀门。"
        near: "调度据此决定先向哪段补问信息，居民联络员无需留下等全线修完。"
    给旧灯外壳补一块护边:
      places:
        - "公共修理台"
      pairs:
        - 1
      category: "照护与修复"
      action: "{npc}把已断电旧灯的两种护边试放在破口边，请你看看是补平还是保留一段旧磨痕。"
      beats:
        trigger: "{npc}把已断电旧灯的两种护边试放在破口边，请你看看是补平还是保留一段旧磨痕。"
        objective: "让外壳缺口不再刮手且留下主人认可的旧貌"
        choice: "试放一段护边，或只比较材料；不修可原样带回"
        immediate: "外壳试装后能比较边缘是否平顺，但仍挂着未做电气检验的标识。"
        near: "住户可留作纪念或另约专业检验，今晚补护边不自动变成整灯维修合同。"
    交换一处街角设施的记忆:
      places:
        - "居民报修茶桌"
      pairs:
        - 0
        - 1
      category: "日常接触"
      action: "{npc}在茶桌上翻出一张旧路灯照片，先说那时等车的习惯，问你愿不愿也讲一个。"
      beats:
        trigger: "{npc}在茶桌上翻出一张旧路灯照片，先说那时等车的习惯，问你愿不愿也讲一个。"
        objective: "理解同一处设施对不同人的意义"
        choice: "讲一段，或只看照片；不想回忆可聊今天的散步路线"
        immediate: "一盏灯可以是回家路标也可以是嫌亮的窗外物，双方不必给出统一评价。"
        near: "闲聊结束不生成报修工单，愿意另留展览口述时再问一次用途。"
  pressures:
    两处报修争用同一组工时:
      source: "一支维修队收到两条同等级工单"
      engines:
        - "资源锁定"
        - "第三方施压"
      beats:
        trigger: "{npc}看到服务中心公开的两条同等级报修摘要，处理顺序尚未公布。"
        objective: "补充影响范围，供值班调度安排响应"
        choice: "整理受影响住户的反馈，或向值班调度询问增援排期"
        immediate: "两条同等级工单都未获先行承诺，调度先确认现有替代服务能覆盖哪些住户。"
        near: "联络员只补自己获授权的影响范围，调度据实际队伍位置询问增援或顺序，居民可结束等待。"
      far_trigger: "同批工单完工核对响应时间时"
      far_consequence: "长距离往返或缺漏供区会改变后续排班；本次先修的一方不取得长期优先权。"
      exits:
        - "把已授权摘要交给当值调度便离开"
        - "不继续代问居民，给出本人可回访的时间后结束协助"
      bindings:
        -
          activity: "比对支线模型与报修点"
          place: "管廊地面展示厅"
          pair: 0
    地下旧图与现场标识冲突:
      source: "设施旧图漏记了一次改线"
      engines:
        - "旧事追索"
        - "名声保卫"
      beats:
        trigger: "{npc}带来已公开的旧图与现场标识对照页，指出一处不一致。"
        objective: "核实改线来源而非猜测责任"
        choice: "查阅维修档案，或请上一班说明"
        immediate: "涉及改线的检查点暂不凭旧图操作，地面模型继续作为疑点展示。"
        near: "当值检修队核对实际走向并追查改线来源，联络员只补门牌变化，不需进入管廊。"
      far_trigger: "新的改线图正式交到下一班时"
      far_consequence: "下一班用带来源的新图，旧图仅供追溯；若仍缺依据则相关作业保持待核，不能靠公众猜测恢复。"
      exits:
        - "仅确认本人知道的门牌变动，退出核查"
        - "转回地面普通展示，不参与专业改线判定"
      bindings:
        -
          activity: "比对支线模型与报修点"
          place: "管廊地面展示厅"
          pair: 0
  themes:
    - "看不见的设施如何影响生活"
    - "维修优先顺序的真实代价"
    - "旧物修复与可靠使用的区别"
  technology_boundary: "当代城市的公开模型、居民授权报修摘要和检修图只用于地面理解；实际管网操作、停复供与设备验收由合格人员承担，旧灯练习断电且不代表通电合格。"
  bridge_status: "not_required"
