        objective: 在身体彻底撑不住之前看清自己现在还能承受多少
        choice: 可当场把最近的排班与用药如实说出来；可只答应减掉一半私活；也可什么都不说，游完就上去
        immediate: 水位不到深水线，本人按自己感觉决定停在哪一段，上岸后不接任何临时加排的电话。
        near: 说清楚会被盯着休息丢一段排期，不说则下周连顶两班，这一晚就是最后的余量。
      far_trigger: 下一次被叫去替班的那天早上
      far_consequence: 身体见底进隔离段判断力下降本身就是事故条件，提前减量丢的是钱不是资格。
      exits:
      - 当场交出部分私活，只留本职排班
      - 保持现状，但把自评标准写进交接记录
      bindings:
      - activity: 闭馆泳馆里把话说到底
        place: 夜间闭馆的室内泳馆
        pair: 2
    匿名的那一头始终不露面:
      source: 雇主始终不露面，所有范围、工期与尾款都由代接人口头传，出了问题署名的人只能是自己。
      engines:
      - 身份风险
      - 攻守易位
      beats:
        trigger: '{npc}又带来一句口头传话，说范围加一截但署名处照旧空着。'
        objective: 在不得到雇主真实身份的前提下把责任边界钉在纸上
        choice: 可要求口头加项一律写成补充条款；可直接说不接这种改法；也可按口头范围先做但只做不可逆之前的部分
        immediate: 补充范围不落纸就不动那一段，本人的作业证不签任何代号位置，今晚工地上不留本段痕迹。
        near: 写进条款的单子下次换人送来，不写则每次加项都由本人口头认下。
      far_trigger: 这段工作交付并进入验收那天
      far_consequence: 验收要有签字的人，把边界写在纸上的人这时才拿得出凭据。
      exits:
      - 要求补充条款落纸，否则只做原范围
      - 退回委托，把已做部分的说明交回代接人
      bindings:
      - activity: 受理一单不署名的委托
        place: 地下值班室
        pair: 4
      - activity: 收摊的菜市场里说清尾款
        place: 通宵后的清晨菜市场
        pair: 4
