id: mat-39d6515fec4ac776e1bd0854b6c45305
name: 征信所与保人堂
material:
  eras:
  - 旧式民国都市
  aesthetics:
  - 克制冷峻
  - 旧年代质感
  - 市井烟火
  rule: 征信所接委托只认委托状上按的那个手印，一份委托出一个结论，同一件事换一个委托人就要另出一份，两份结论不一致时两份都算数；报告一律留正副两纸，正纸交委托人、副纸留所封存三十天，封存期内对结论有异议的人须另出一份委托才能调阅副纸；中人具结只在保人堂的案上做，出门不补办，具结过的保额不许加、不许减、不许换人；同一名调查员不得在同一件事上先后接受两位委托人，而落笔之前没有人查得出来。
  social_rule: 这条街上不认真相这个词，只认雇主、手印、保额三样；同业之间可以互相打听行情，但不替同行认下一份不是自己经手的报告；问一件事之前要先报自己替谁问，不报来处的问，街上的铺子一律不答；被查的人的体面也是要算钱的，查得太细、写得太平都是坏了行规，行里会自己来收这笔账；外人闲话能砸饭碗，名声会被清算，金钱通行，公开版本会影响所有人的判断。
  places:
    征信所接案台:
      details:
      - 柜台上压着一叠空白委托状，印泥盒的盖一直开着·日间
      - 后墙的等位凳坐满了人，接案的空档只够喝完一碗茶·午后
      profile:
        privacy: low
        visibility: high
        exits:
        - 临街玻璃门，后侧角门通保人街后巷
        witnesses:
        - 当班的接案先生
        - 排在后头的等位人
        affordances:
        - 接一份委托状
        - 保人具结
        - 结束活动并离开
        pressure_modifiers:
        - 印泥干得快慢
        - 当天能排到的接案次序
    征信所撰稿间:
      details:
      - 三张并排的写字桌，桌与桌之间只隔一道矮挡板·午后
      - 桌上摊着同一件事的三份不同草稿，谁写哪一份不写在纸面上·黄昏
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 前门通接案台，后门直下保人街后巷
        witnesses:
        - 同室另两位撰稿人
        - 送茶兼送稿的学徒
        affordances:
        - 对同一件事写两份结论
        - 商团侧厅对账
        - 结束活动并离开
        pressure_modifiers:
        - 同一件事的委托人还坐着几位
        - 封存期还剩几天
    保人堂案桌:
      details:
      - 一张厚案、一本具结簿、一支只蘸一种墨的笔·日间
      - 案角压着上一家留下的保额单，墨迹还没完全干透·午后
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 堂门临保人街，东侧便门通商团会馆侧厅
        witnesses:
        - 保人堂的具结人
        - 被请来做第三人的旁观者
        affordances:
        - 接一份委托状
        - 保人具结
        - 结束活动并离开
        pressure_modifiers:
        - 第三人愿不愿意当场留下
        - 这一笔保额能不能当场认下
    旧当铺二楼账房:
      details:
      - 楼梯又窄又陡，二楼只开一扇朝后巷的窗·日间
      - 窗下压着两本赎回簿，上一本已经翻到卷边·深夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 窄梯下到当铺号房，窗只能通到后巷半空
        witnesses:
        - 当铺朝奉本人
        - 楼下偶然上来的估衣师傅
        affordances:
        - 当铺二楼认物件
        - 结束活动并离开
        pressure_modifiers:
        - 两本赎回簿对得上几页
        - 楼下有几人听见上楼的声音
    同业茶室:
      details:
      - 八张方桌各说各的行情，跑堂的只管添水·午后
      - 靠里的两张桌收得早，坐进去的人多半只要一壶·黄昏
      profile:
        privacy: low
        visibility: high
        exits:
        - 茶室正门临保人街，后院小门通后巷
        witnesses:
        - 跑堂的伙计
        - 邻桌的同行
        affordances:
        - 同业茶室打听行情
        - 后巷递话
        - 结束活动并离开
        pressure_modifiers:
        - 昨天谁问过同一句话
        - 跑堂的愿不愿意替你压一句口信
    保人街后巷:
      details:
      - 巷子窄到两个人错身要贴墙，墙头晾着各家衣物·黄昏
      - 两头都有窗口亮着灯，巷里的脚步声一响就有人探头·深夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 北口接保人街正街，南口通商团会馆后门
        witnesses:
        - 墙头晾衣的住户
        - 在巷口等活的脚夫
        affordances:
        - 后巷递话
        - 同业茶室打听行情
        - 结束活动并离开
        pressure_modifiers:
        - 两头窗口各亮着几盏灯
        - 这一句能被几个人听见
    后街私立诊室:
      details:
      - 一张诊疗床、一个上锁的药柜、一本只写症状不写姓名的诊簿·日间
      - 诊簿翻开停在昨天那一页，最后一行被划掉过·深夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 诊室正门开在后街，侧门通保人街后巷
        witnesses:
        - 坐诊的医生本人
        - 陪诊的那位家属
        affordances:
        - 诊察室问伤势
        - 结束活动并离开
        pressure_modifiers:
        - 诊簿上这一行能不能留
        - 今晚还有几个人要来
    商团会馆侧厅:
      details:
      - 侧厅里摆一张长桌，两边椅子一样高·日间
      - 桌上摊着几家的货单与保额单，压角的是同一副铜镇纸·午后
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 侧厅通会馆正厅，西便门接保人街后巷
        witnesses:
        - 会馆的司事
        - 在窗边候着的两家账房
        affordances:
        - 商团侧厅对账
        - 接一份委托状
        - 对同一件事写两份结论
        - 货栈验箱留字据
        - 结束活动并离开
        pressure_modifiers:
        - 两家的货单对不对得上
        - 会馆肯留人到什么时辰
  pairs:
  - family: 学术与专业
    position: 同侪
    appellations:
    - 先生
    npc:
      role: 征信所同席撰稿人
      function: 接同一条街上的委托，把问来的话写成一份能交出去的结论
      authority: 决定自己经手那一份报告的取舍与详略
      resource: 一叠还没署名的草稿与几份旧报告的副纸抄件
      limitation: 不能替所里改别人的结论，也调不出封存未满的副纸
      obligation: 落笔前把来处与疑问点记清楚，交件时向委托人念一遍
      exposure: 写出两份对不上的结论，行里只当她没能耐
      hidden: 同一件事她已经先后接过两位雇主，草稿压在抽屉最底下
    player:
      identity: 征信所撰稿人
      baseline: 你和她在同一间撰稿间各写一份，写的是同一件事，交给两个不同的委托人；两边都还没到交件那天。
      resources:
      - 这一条街上认得的人
      - 所里分给你的一张写字桌
      reputation: 你落笔留余地，不替委托人把话说满
    relationship_reason: 同一间撰稿间里，你们各自写过一件事的两份结论，交件前谁也没提过对方那一份。
  - family: 商业与产业
    position: 上司
    appellations:
    - 掌柜
    npc:
      role: 征信所接案先生
      function: 在柜台上认委托状的手印，排接案的次序，决定哪一件先落笔
      authority: 决定今晚哪一份委托印不印手印
      resource: 一本接案登记簿与柜上那一盒用了半盒的印泥
      limitation: 不能替委托人改结论，也不能压住已经印了手印的那一页
      obligation: 收委托状时把雇主的名头与前一份报告的封存期一并报出来
      exposure: 收下同一件事的第二份委托而被指出来，坏的是所里的招牌
      hidden: 柜上这本登记簿里记着几位雇主问过却没印手印的事
    player:
      identity: 征信所撰稿人
      baseline: 她管接案台上的手印与委托状，你管撰稿；今晚这份委托印不印手印，她说得上一句话。
      resources:
      - 写到一半的两份草稿
      - 同业茶室里认得的几位老先生
      reputation: 你写的报告有人肯认，但你从不催接案台
    relationship_reason: 她替你压过一次不该当晚印的委托状，你替她把一份交出去的结论重排过一遍。
  - family: 地下与灰色地带
    position: 被求助者
    appellations:
    - 师傅
    npc:
      role: 保人堂具结人
      function: 在保人堂的案上做中人、铺保与具结，认下这一笔保额
      authority: 认不认这份保额的一句话，以及具结簿上落笔的那一格
      resource: 一本具结簿与一支只蘸一种墨的笔
      limitation: 认下之后保额不许加、不许减、不许换人，出门也不补办
      obligation: 具结前把保额与责任向在场两人念清，出门之后不再改口
      exposure: 认错了这笔保额，这条街上的中人再也轮不到她
      hidden: 她自己做过一次具结，那笔保额至今还挂在具结簿上没销
    player:
      identity: 代人递送委托状的跑街
      baseline: 你带来的保额她认不认，决定你这趟白不白跑；而你手上的委托状恰好是同一件事的第二份。
      resources:
      - 委托人给的定金
      - 保人街上认得的几家铺子
      reputation: 你只递件不作保，也不替委托人催中人
    relationship_reason: 你替她把一份字迹不清的具结重抄过一遍，她因而肯在你等保额的空档里多说两句。
  - family: 秩序与执法
    position: 知情不报者
    appellations:
    - 长官
    npc:
      role: 巡捕房的查案员
      function: 跟着报案走路子，查问往来的人与当出去的物件
      authority: 当场传人问话，也可以只把这一趟记在自己的记事本上
      resource: 一本随身记事本与几份还没归档的报案纸
      limitation: 不能直接查征信所的封存副纸，须按手续另出委托
      obligation: 问过的话要记下来，传人须当场说明缘故
      exposure: 该报的事压在自己本子里，位置就保不住
      hidden: 那件被当了两次的物件，她早就听人提过一回
    player:
      identity: 旧当铺二楼的账房
      baseline: 你在旧当铺二楼见过那件被当了两次的物件，而它正出现在你手上那两份报告的清单里。
      resources:
      - 两本赎回簿的抄件
      - 当铺里认得的几位朝奉
      reputation: 你认物件不认人，写账时连自己经手的也照记
    relationship_reason: 她曾在当铺门外汇兑过一次错记的当期，你在二楼翻出那两页替她对上了。
  activities:
    接一份委托状:
      places:
      - 征信所接案台
      - 保人堂案桌
      - 商团会馆侧厅
      pairs:
      - 0
      - 1
      - 2
      - 3
      category: 信息交换
      action: '{npc}把空白委托状推到你面前，问你这一件要按谁的名头往下写。'
      beats:
        trigger: '{npc}把空白委托状推到你面前，问你这一件要按谁的名头往下写。'
        objective: 在落笔之前把这一件的雇主与来处定下来
        choice: 报出雇主与来处，或只问清这一件要不要印手印；不便出面可把委托状留在案上
        immediate: 印了手印的这一份当场进接案簿，没印的先压在案角等下一个来问的人。
        near: 接案簿上这一行定下这一件的归属，撰稿间按名头排先后；同一件事再来一个雇主，另起一行。
    对同一件事写两份结论:
      places:
      - 征信所撰稿间
      - 商团会馆侧厅
      pairs:
      - 0
      - 1
      - 2
      - 3
      category: 调查与核验
      action: '{npc}把两份草稿并排摊在写字桌上，请你先说明这一份是替谁写的。'
      beats:
        trigger: '{npc}把两份草稿并排摊在写字桌上，请你先说明这一份是替谁写的。'
        objective: 把两份结论各自归到自己的委托人名下
        choice: 逐句说明来处，或只标出两处对不上的地方；也可以只写其中一份
        immediate: 两份都留下的，行里只认手印与封存期；只写一份的，另一份留成没户头的草稿。
        near: 交件那天正纸出门、副纸入柜封存三十天，两份都不撤，谁也不替谁改。
    保人具结:
      places:
      - 保人堂案桌
      - 征信所接案台
      pairs:
      - 0
      - 2
      category: 信息交换
      action: '{npc}把具结簿翻到空白那一格，请第三个人看着，问你这一笔保额报多少。'
      beats:
        trigger: '{npc}把具结簿翻到空白那一格，请第三个人看着，问你这一笔保额报多少。'
        objective: 在场把保额定死，出门不再改口
        choice: 当场报数让第三人看着落笔，或先按实际写少一档；不愿作保可只签名见证
        immediate: 落笔的一格当场定下，鞋底没出堂门之前还能反悔，出了门就加不了减不了。
        near: 这一笔保额挂在具结簿上等着被认或被追，换人须另出一份委托，不许改字。
    当铺二楼认物件:
      places:
      - 旧当铺二楼账房
      pairs:
      - 1
      - 3
      category: 调查与核验
      action: '{npc}把两本赎回簿并排推到窗下，请你对一遍同一件东西写在哪几页上。'
      beats:
        trigger: '{npc}把两本赎回簿并排推到窗下，请你对一遍同一件东西写在哪几页上。'
        objective: 在两本簿子上把这一件物件的来路认清
        choice: 逐页核对两本簿子，或只记下哪一件被写了两次；也可只看不上手
        immediate: 被写了两次的那一件单独抄出来，赎价与到期日当面念给楼下听。
        near: 抄件留在二楼等赎回期到，两本簿子照旧挂着账，谁也不替物主认下来路。
    同业茶室打听行情:
      places:
      - 同业茶室
      - 保人街后巷
      pairs:
      - 0
      - 2
      category: 第三方与打断
      action: '{npc}先把茶碗推过来，再问你今天替谁打听这一句。'
      beats:
        trigger: '{npc}先把茶碗推过来，再问你今天替谁打听这一句。'
        objective: 在报出来处之后换到一句能用的行情
        choice: 报出雇主再问，或只打听这一条街上的通行价；不愿报来处可放下茶钱就走
        immediate: 报了来处的，邻桌该听的都听见了；没报的，跑堂的添完水就不再过来。
        near: 行情在茶室里过了一遍才轮到用，谁先问过这一句，第二天全街都知道。
    后巷递话:
      places:
      - 保人街后巷
      - 同业茶室
      pairs:
      - 1
      - 3
      category: 空间与退出
      action: '{npc}在巷子中间停住，只说了半句，等你先决定要不要听完整。'
      beats:
        trigger: '{npc}在巷子中间停住，只说了半句，等你先决定要不要听完整。'
        objective: 在半句之内决定这句话要不要接下去
        choice: 接下去问完，或只把半句记住；也可以转身先回街上，等下一次再碰
        immediate: 接完话的两头窗口都亮着灯，只记住半句的，这句话今天就停在这里。
        near: 递出去的话按谁听谁记往下走，巷子两头各留一个知道半句的人。
    诊察室问伤势:
      places:
      - 后街私立诊室
      pairs:
      - 2
      - 0
      category: 调查与核验
      action: '{npc}把诊簿推到药柜边上，只指着一行症状，问你这一行要不要留。'
      beats:
        trigger: '{npc}把诊簿推到药柜边上，只指着一行症状，问你这一行要不要留。'
        objective: 让这一行症状留下而名字不留下
        choice: 照症状记下去，或只口头说明不上簿；不便露面的可只把伤处指给医生
        immediate: 诊簿上多出一行不挂名的症状，来过的痕迹只留在医生眼里。
        near: 这一行不挂名的症状日后能被认出来源，诊簿照旧不写姓名，问的人须自己报来处。
    商团侧厅对账:
      places:
      - 商团会馆侧厅
      - 征信所撰稿间
      pairs:
      - 3
      - 1
      category: 调查与核验
      action: '{npc}把两家的货单与保额单摊在同一张长桌上，请你对一遍哪几笔对不上。'
      beats:
        trigger: '{npc}把两家的货单与保额单摊在同一张长桌上，请你对一遍哪几笔对不上。'
        objective: 在两家都在场的时候把对不上的几笔摆出来
        choice: 逐笔对读两家的单子，或只圈出对不上的几笔；也可只把自己那一页交回撰稿间
        immediate: 对不上的几笔当场另列一张纸，两边的椅子照旧一样高，谁也没多坐一分。
        near: 会馆按另列的那张纸往下走，保额挂在具结簿上不动，结论仍归各自的委托人。
    货栈验箱留字据:
      places:
      - 商团会馆侧厅
      pairs:
      - 0
      - 1
      - 2
      - 3
      category: 第三方与打断
      action: '{npc}把箱侧的货号念出来，请你跟着对一遍，念错一个字就要重新来过。'
