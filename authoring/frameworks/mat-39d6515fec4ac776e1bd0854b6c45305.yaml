  customs:
  - 交件那天，正纸由委托人带走，副纸当着交件人的面入柜，柜门上写封存到期的那一天。
  - 同业之间问一句话之前先报自己替谁问；不报来处的问，铺子一律不答。
  - 接案相熟的人过门喝茶不必让坐，站着把话说完就走，茶钱压在碗底。
  pressures:
    同一件事来了两个雇主:
      source: 前天出的那份报告还没封存满三十天，今天另一个雇主拿着同一件事的委托状坐到柜台前
      engines:
      - 匿名委托
      - 身份风险
      beats:
        trigger: '{npc}收到消息：前天出的那份报告还没封存满三十天，今天另一个雇主拿着同一件事的委托状坐到柜台前。'
        objective: 在第二份手印按下去之前定下这一件归谁
        choice: 照手印另起一行接案，或先把两件事摆出来让雇主自己选；也可只把前一份的封存期报给来人听
        immediate: 接案簿上这一件的雇主换了名字，前一份仍在柜里封着，两份都还没有交件。
        near: 两份各自往下走，写出来的结论不一致时两份都算数，行里只认各自那一枚手印。
      far_trigger: 两份都交件之后被人摆到同一张桌上时
      far_consequence: 照手印各认各的，行里只当这条街上的常事；把前一份说成被人冒用，则封存柜前从此要看两遍委托状。
      exits:
      - 把第二份委托状推回柜台，只做前一份
      - 交出自己手上这一份草稿，退出这一件
      bindings:
      - activity: 接一份委托状
        place: 征信所接案台
        pair: 0
      - activity: 对同一件事写两份结论
        place: 征信所撰稿间
        pair: 1
    报告被人拿去改了一个字:
