  themes:
  - 成年人的经验如何获得承认
  - 失败作品中的可传授知识
  - 共享仪器与个人学习节奏
  - 匿名与署名之间的取舍
  - 同一份时间是两个人的开销
  technology_boundary: 当代成人夜校使用低压教学模型、普通测量工具和可拆试件；练习不模拟高风险实用工程，日志有帮助但不自动证明全部贡献，成果辅导不等于学分审批。匿名辅导席以人工登记的代号牌运行，牌面只存当夜代号，与真名、证件或评价材料不建立勾连，也没有任何检索代号背后身份的流程；当夜在场的判定由走廊指示灯与值班簿人工记录，不联网、不留影音。
  bridge_status: not_required
