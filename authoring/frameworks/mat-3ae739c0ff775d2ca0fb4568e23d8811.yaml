id: mat-3ae739c0ff775d2ca0fb4568e23d8811
name: 夜校学分与开放实验室
material:
  eras:
  - 当代都市
  aesthetics:
  - 行当正剧
  - 暖色生活流
  - 都市轻悬疑
  - 温柔颓丧
  - 日系同人音声物语
  rule: 夜校只接收成年学员，工作经历可以申请成果认定；实验记录归贡献者共同署名，不以资历代替证据；夜校另设匿名辅导与封闭考核两类席位，匿名席只认当夜登记的代号，封闭考核期间教室里的人不得中途离场，退出须由本人走到登记台当面注销，代号一经注销即不再保留对应的署名与补救资格。
  social_rule: 公共仪器按预约共享，原始记录与个人评价分开保管；匿名辅导不进入任何署名、评定或对外说明的流转环节。
  customs:
  - 结课时每个人带来一件失败的作品，讲清下一次会改哪里。
  - 匿名席位的学员在离场前把自己的代号牌翻面放回登记台，下一位才知道这个位置空出来了。
  places:
    夜校拆装教室:
      details:
      - 低压教学台露出可反复插拔的连接·夜
      - 测量表旁另留未下结论的空格·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 教学楼主走廊
        witnesses:
        - 等待试做的成年学员
        affordances:
        - 排查教学模型的断点
        - 结束活动并离开
        pressure_modifiers:
        - 开放台预约长度
        - 可重复故障的状态
    开放实验室样品台:
      details:
      - 三种回收材料分放在零件盘内·夜
      - 无胶死的小样接头可以反复拆开·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 样品间外的休息区
        witnesses:
        - 器材管理员
        - 旁观的成年学员
        affordances:
        - 制作一件可拆解的小样
        - 结束活动并离开
        pressure_modifiers:
        - 回收材料余量
        - 归还工具时间
    夜校作品交流廊:
      details:
      - 失败作品与改进草图并排的展墙·夜
      - 廊边长椅能坐下聊两句·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 校园开放步道
        witnesses:
        - 下课后自愿看展的成年同学
        affordances:
        - 交换失败作品的故事
        - 结束活动并离开
        pressure_modifiers:
        - 作者愿意分享的部分
        - 交流廊开放时间
    24小时自习室:
      details:
      - 长桌隔断内的台灯各自亮着，谁也不看谁的屏幕·深夜
      - 门口的登记板写着当夜的座位号与清场时段·深夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 把桌面恢复原状后从正门登记离场
        witnesses:
        - 值守的夜班管理员
        - 隔断后同样来赶进度的成年自修者
        affordances:
        - 在隔断里核对自己的进度
        - 结束活动并离开
        pressure_modifiers:
        - 当夜清场时刻
        - 隔断的私密程度
    室内夜泳馆:
      details:
      - 闭馆后的水面只剩救生灯的一列反光·夜
      - 池边计时板停在上一场的成绩，未及清零·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经更衣通道回到门厅，交还储物手环后离场
        witnesses:
        - 留在池边的救生员
        affordances:
        - 在水线边把话说完
        - 结束活动并离开
        pressure_modifiers:
        - 闭馆清场的剩余时间
        - 水线与池边的距离
    夜校行政走廊:
      details:
      - 两侧是编号的教务室，门上的状态牌写着在办或空置·夜
      - 走廊尽头的成绩公示栏贴到一半，下半张仍卷着·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从楼梯口下到门厅，登记后离开
        witnesses:
        - 值夜班的教务人员
        affordances:
        - 送交或取回一份认定材料
        - 结束活动并离开
        pressure_modifiers:
        - 对外办公的最后受理时刻
        - 材料是否齐全
    夜校共同公寓:
      details:
      - 两间卧室共用一个水槽，墙上贴着分摊表·深夜
      - 冰箱上压着本月的缴费单与一张未署名的便条·深夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 带上门钥匙从楼道下到街面
        witnesses:
        - 另一位合租的成年住户
        affordances:
        - 把本月分摊算清
        - 结束活动并离开
        pressure_modifiers:
        - 分摊比例是否谈拢
        - 押金退还条件
    直播平台危机会议室:
      details:
      - 长桌上摊着未公开的截图与一份拟定中的声明·夜
      - 投屏停在舆情曲线最高处，谁都没按下一张·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从会议室玻璃门退到公共电梯厅
        witnesses:
        - 在场的公关与法务人员
        affordances:
        - 逐条核对可公开与不可公开的部分
        - 结束活动并离开
        pressure_modifiers:
        - 对外发布的时间窗
        - 尚有多少条未经证实
    夜校地下排练厅:
      details:
      - 镜墙贴着尚未揭下的旧海报，音响的电源灯亮着·夜
      - 地板上用胶带标着走位，角落堆着换下来的便装·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 拉开侧门经消防通道离场
        witnesses:
        - 留下来收场地的成年社团成员
        affordances:
        - 把今晚的走位再走一遍
        - 结束活动并离开
        pressure_modifiers:
        - 场地租用到点时刻
        - 隔壁是否还在使用
    洋装裁缝铺:
      details:
      - 试衣镜前留着一副未拆的别针与粉线·黄昏
      - 打烊后只剩工作台的一盏灯，帘子半拉·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从店门退出，卷帘由店主自己落下
        witnesses:
        - 留下收尾的裁缝师傅
        affordances:
        - 把尺寸当场改到合身
        - 结束活动并离开
        pressure_modifiers:
        - 当天的交件期限
        - 布料余量是否够改
    夜校档案室:
      details:
      - 档案柜按年份排列，最底一层堆着未归档的旧卷·夜
      - 桌上留着一台老式裁纸机与半盒封条·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 锁好柜门，从走廊的门禁处登记离开
        witnesses:
        - 值夜班的档案员
        affordances:
        - 按流程调阅一份旧记录
        - 结束活动并离开
        pressure_modifiers:
        - 调阅需要几级签批
        - 封条是否已被动过
  pairs:
  - family: 学术与专业
    position: 同侪
    appellations:
    - 同学
    - 直呼其名
    npc:
      role: 夜校实验助教
      function: 教会新学员分辨测量与猜测
      resource: 可重复故障的低压模型与两套测量探头
      authority: 安排开放实验台的使用顺序
      limitation: 不能替学员认定学分，开放练习不作为正式成绩
      obligation: 把测量现象、假设和结论分开讲，旁听不生成考核记录
      exposure: 记录混乱会让学员的成果无法被追溯
      hidden: —
    player:
      identity: 返校进修的仪器技师
      baseline: 你曾帮助助教找回一份漏记的测量表，这次约在夜校开放活动时段交流。
      resources:
      - 自己整理的测量步骤与故障排查笔记
      reputation: 助教记得你补齐测量表的帮助，但不据此评定你的学分。
    relationship_reason: 你曾帮助助教找回一份漏记的测量表，这次约在夜校开放活动时段交流。
  - family: 学术与专业
    position: 外来者
    appellations:
    - 先生
    - 直呼其名
    npc:
      role: 成果认定辅导员
      function: 帮助来访者说明自己的实际贡献
      resource: 公开的成果认定流程与贡献说明样例
      authority: 解释认定程序并安排交流
      limitation: 不能替申请人代写贡献说明，也不能以辅导关系影响认定顺序
      obligation: 区分可提交的贡献材料与不供认定的私人经历
      exposure: 把闲聊误收作评价材料会让转业学员不再愿意说明真实困难
      hidden: —
    player:
      identity: 带来作品集的成年转业者
      baseline: 你预约了一次作品交流，辅导员准备听你解释旧工作的技术细节。
      resources:
      - 一份保留修改痕迹的作品集
      reputation: 辅导员只见过你的预约说明，尚未核实作品贡献。
    relationship_reason: 你预约了一次作品交流，辅导员准备听你解释旧工作的技术细节。
  - family: 学术与专业
    position: 上司
    appellations:
    - 主任
    - 直呼其名
    - 会长
    npc:
      role: 夜校教务主管
      function: 决定课程资源、考核名额与匿名席位的分配口径
      resource: 排课表、考核名额的原始分配单与往期结业名录
      authority: 可调整本轮名额与课程资源的去向，须留档并说明理由
      limitation: 不能替学员认定贡献，也不能以行政口径改写已留档的实验记录
      obligation: 在名额下压前说明被划掉的是谁、依据是什么
      exposure: 名额口径一旦被私下改动，下一轮所有学员都会先来打听而不是先来上课
      hidden: —
    player:
      identity: 夜校兼课讲师
      baseline: 你在这轮课程里带固定的学员，教务主管约你在课程结束后单独谈这一轮的名额。
      resources:
      - 学员出勤与作业记录
      - 自己排的一份课程进度表
      reputation: 教务主管知道你不肯替人改记录，所以这次只谈名额，不谈成绩。
    relationship_reason: 你带的那期课程刚好卡在名额紧张的窗口，教务主管要你当面听一遍分配口径，再决定要不要替学员说话。
  - family: 学术与专业
    position: 同侪
    appellations:
    - 前辈
    - 直呼其名
    npc:
      role: 同期结业的匿名辅导席学员
      function: 以登记代号接受辅导，不与真实身份或评价材料挂钩
      resource: 当夜登记的代号牌与一份不署名的进度记录
      authority: 可决定何时翻牌注销并离场，他人无权代为注销
      limitation: 不能代人注销代号，也不能以辅导内容要求对方说明真实身份
      obligation: 离场前把代号牌翻面放回登记台，进度记录不带出教室
      exposure: 代号一旦被对上真名，这间教室下一次就不会再有人来登记
      hidden: 本人另有白天的职业身份，与夜校无关，教室里不提
    player:
      identity: 同样登记了代号的夜校学员
      baseline: 你在这一期也用了代号，今晚的辅导结束后，你们在走廊里碰上，谁都没先叫对方的真名。
      resources:
      - 写着自己代号的登记牌
      - 一份只记现象不记结论的进度记录
      reputation: 对方只知道你的代号，也只打算知道代号。
    relationship_reason: 你们是这一期仅有的两个连续到场的匿名席学员，谁先注销代号，剩下的那个人就要独自面对空下来的位置。
  activities:
    排查教学模型的断点:
      places:
      - 夜校拆装教室
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}让低压模型停在同一处故障上，请你选先看连接还是先比较两端读数。'
      beats:
        trigger: '{npc}让低压模型停在同一处故障上，请你选先看连接还是先比较两端读数。'
        objective: 用能重复的现象淘汰一个故障假设
        choice: 测一组读数，或只观察示范；不继续可断电交还模型
        immediate: 两个假设中至少一个获得支持或被排除；测不出时保留未知，不靠助教一句对错结题。
        near: 选定下一次要改变的单一条件，今天不用交完整故障报告或换取课程分数。
    制作一件可拆解的小样:
      places:
      - 开放实验室样品台
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}把两种不用胶死的小样接头拆开，请你选一种装回，再试换一块回收料。'
      beats:
        trigger: '{npc}把两种不用胶死的小样接头拆开，请你选一种装回，再试换一块回收料。'
        objective: 做出能再次拆开且不毁材料的小样
        choice: 替换一块，或只比较拆开的接头；不做可把材料归盘
        immediate: 形成一件可重新拆开的试样，连接松动可当场复原，不把外观整齐当作性能达标。
        near: 下一位可继续换件，制作者保留自己设计的用途说明，不将练习件当实用承重品交付。
    交换失败作品的故事:
      places:
      - 夜校作品交流廊
      pairs:
      - 0
      - 1
      category: 日常接触
      action: '{npc}看着展墙上一件失败作品，先讲自己当时不愿承认的判断，问你想聊还是只看看。'
      beats:
        trigger: '{npc}看着展墙上一件失败作品，先讲自己当时不愿承认的判断，问你想聊还是只看看。'
        objective: 认识彼此面对失败的方式
        choice: 讲一个自己愿讲的片段，或只听；不聊作品可看完直接离开
        immediate: 对话可以停在有趣或难堪的一小段，助教与辅导员都不把倾诉记入评分材料。
        near: 愿意才约互看下一版作品，今天没有新的学分材料和自我证明作业。
    当面排掉争议的署名顺序:
      places:
      - 夜校作品交流廊
      pairs:
      - 0
      - 1
      - 3
      category: 信息交换
      action: '{npc}把两版署名完全不同的成果页并排摊在长椅上，递出一支笔，问你先改哪一版。'
      beats:
        trigger: '{npc}把两版署名完全不同的成果页并排摊在长椅上，递出一支笔，问你先改哪一版。'
        objective: 在两版署名里挑出一版能当面站住的
        choice: 先划掉自己那一栏等对方落笔；或只把两版差异圈出来，不当场改任何一版
        immediate: 两版署名同时留在桌上，谁都不抢先签名，改过的那一版由落笔的人自己认。
        near: 争议件暂停提交，落笔的人在下一节课前自行决定是否保留这一版。
    提报成果认定并当面摊牌:
      places:
      - 夜校行政走廊
      pairs:
      - 1
      - 2
      category: 信息交换
      action: '{npc}把一份填好的认定申请表推到你面前，同时递出一支笔，问你是现在签还是先听他说完名额的事。'
      beats:
        trigger: '{npc}把一份填好的认定申请表推到你面前，同时递出一支笔，问你是现在签还是先听他说完名额的事。'
        objective: 弄清这份材料签下去会把谁的名字挤掉
        choice: 先要一份名额分配的原件再签字；或只取回空白表，今天不作答复
        immediate: 表格留在桌上不收走，签与不签都留档，当下不改动已公示的名单。
        near: 受理窗口在下一次办公时段截止，逾期要重新排一轮。
    核对可公开的那一部分:
      places:
      - 直播平台危机会议室
      pairs:
      - 1
      - 2
      category: 调查与核验
      action: '{npc}把未公开的截图与拟定声明并排推过来，请你逐条标出哪一句还不能对外。'
      beats:
        trigger: '{npc}把未公开的截图与拟定声明并排推过来，请你逐条标出哪一句还不能对外。'
        objective: 把能公布的与只能留在室内的分开
        choice: 逐条标注待核；或只圈出一条最不该出现的，其余不动
        immediate: 未证实的部分留在会议室，声明暂不发布，谁的名字都不先挂上去。
        near: 对外时间窗照旧在走，室内多留一晚不改变已定的发布时点。
    在闭馆水线边把话说完:
      places:
      - 室内夜泳馆
      pairs:
      - 0
      - 2
      category: 空间与退出
      action: '{npc}已经上了岸，坐在水线边把毛巾搭在膝上，问你还有没有话要在清场前讲完。'
      beats:
        trigger: '{npc}已经上了岸，坐在水线边把毛巾搭在膝上，问你还有没有话要在清场前讲完。'
        objective: 在清场广播之前把这一件事收束
        choice: 当场把话说完再各自离场；或改约下一次，今晚只到水线为止
        immediate: 救生灯的下一轮熄灭前必须离场，留下的话不再由谁代为转述。
        near: 下一次约在同一时段，是否来由各自决定，不因此产生新的名分。
    结课夜留到清场之后:
      places:
      - 24小时自习室
      pairs:
      - 0
      - 3
      category: 空间与退出
      action: '{npc}把隔断的台灯压低，问你今晚是打算把这一段做完，还是先处理掉手边那件现实的事。'
      beats:
        trigger: '{npc}把隔断的台灯压低，问你今晚是打算把这一段做完，还是先处理掉手边那件现实的事。'
        objective: 在清场前决定今晚只处理哪一件事
        choice: 先把现实事务处理掉再回来；或只做到清场，剩余部分留给下一次
        immediate: 台灯按各人自己的节奏关掉，谁也不必向对方交代今晚做完了什么。
