id: "mat-3ae739c0ff775d2ca0fb4568e23d8811"
name: "夜校学分与开放实验室"
material:
  eras:
    - "当代都市"
  aesthetics:
    - "行当正剧"
    - "暖色生活流"
  rule: "夜校只接收成年学员，工作经历可以申请成果认定；实验记录归贡献者共同署名，不以资历代替证据。"
  social_rule: "公共仪器按预约共享，原始记录与个人评价分开保管。"
  customs:
    - "结课时每个人带来一件失败的作品，讲清下一次会改哪里。"
  places:
    夜校拆装教室:
      details:
        - "低压教学台露出可反复插拔的连接·夜"
        - "测量表旁另留未下结论的空格·夜"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "教学楼主走廊"
        witnesses:
          - "等待试做的成年学员"
        affordances:
          - "排查教学模型的断点"
          - "结束活动并离开"
        pressure_modifiers:
          - "开放台预约长度"
          - "可重复故障的状态"
    开放实验室样品台:
      details:
        - "三种回收材料分放在零件盘内·夜"
        - "无胶死的小样接头可以反复拆开·夜"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "样品间外的休息区"
        witnesses:
          - "器材管理员"
          - "旁观的成年学员"
        affordances:
          - "制作一件可拆解的小样"
          - "结束活动并离开"
        pressure_modifiers:
          - "回收材料余量"
          - "归还工具时间"
    夜校作品交流廊:
      details:
        - "失败作品与改进草图并排的展墙·夜"
        - "廊边长椅能坐下聊两句·夜"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "校园开放步道"
        witnesses:
          - "下课后自愿看展的成年同学"
        affordances:
          - "交换失败作品的故事"
          - "结束活动并离开"
        pressure_modifiers:
          - "作者愿意分享的部分"
          - "交流廊开放时间"
  pairs:
    -
      family: "学术与专业"
      position: "同侪"
      appellations:
        - "同学"
        - "直呼其名"
      npc:
        role: "夜校实验助教"
        function: "教会新学员分辨测量与猜测"
        resource: "可重复故障的低压模型与两套测量探头"
        authority: "安排开放实验台的使用顺序"
        limitation: "不能替学员认定学分，开放练习不作为正式成绩"
        obligation: "把测量现象、假设和结论分开讲，旁听不生成考核记录"
        exposure: "记录混乱会让学员的成果无法被追溯"
        hidden: "—"
      player:
        identity: "返校进修的仪器技师"
        baseline: "你曾帮助助教找回一份漏记的测量表，这次约在夜校开放活动时段交流。"
        resources:
          - "自己整理的测量步骤与故障排查笔记"
        reputation: "助教记得你补齐测量表的帮助，但不据此评定你的学分。"
      relationship_reason: "你曾帮助助教找回一份漏记的测量表，这次约在夜校开放活动时段交流。"
    -
      family: "学术与专业"
      position: "外来者"
      appellations:
        - "先生"
        - "直呼其名"
      npc:
        role: "成果认定辅导员"
        function: "帮助来访者说明自己的实际贡献"
        resource: "公开的成果认定流程与贡献说明样例"
        authority: "解释认定程序并安排交流"
        limitation: "没有权力承诺审核结果"
        obligation: "区分可提交的贡献材料与不供认定的私人经历"
        exposure: "把闲聊误收作评价材料会让转业学员不再愿意说明真实困难"
        hidden: "—"
      player:
        identity: "带来作品集的成年转业者"
        baseline: "你预约了一次作品交流，辅导员准备听你解释旧工作的技术细节。"
        resources:
          - "一份保留修改痕迹的作品集"
        reputation: "辅导员只见过你的预约说明，尚未核实作品贡献。"
      relationship_reason: "你预约了一次作品交流，辅导员准备听你解释旧工作的技术细节。"
  activities:
    排查教学模型的断点:
      places:
        - "夜校拆装教室"
      pairs:
        - 0
      category: "调查与核验"
      action: "{npc}让低压模型停在同一处故障上，请你选先看连接还是先比较两端读数。"
      beats:
        trigger: "{npc}让低压模型停在同一处故障上，请你选先看连接还是先比较两端读数。"
        objective: "用能重复的现象淘汰一个故障假设"
        choice: "测一组读数，或只观察示范；不继续可断电交还模型"
        immediate: "两个假设中至少一个获得支持或被排除；测不出时保留未知，不靠助教一句对错结题。"
        near: "选定下一次要改变的单一条件，今天不用交完整故障报告或换取课程分数。"
    制作一件可拆解的小样:
      places:
        - "开放实验室样品台"
      pairs:
        - 0
      category: "照护与修复"
      action: "{npc}把两种不用胶死的小样接头拆开，请你选一种装回，再试换一块回收料。"
      beats:
        trigger: "{npc}把两种不用胶死的小样接头拆开，请你选一种装回，再试换一块回收料。"
        objective: "做出能再次拆开且不毁材料的小样"
        choice: "替换一块，或只比较拆开的接头；不做可把材料归盘"
        immediate: "形成一件可重新拆开的试样，连接松动可当场复原，不把外观整齐当作性能达标。"
        near: "下一位可继续换件，制作者保留自己设计的用途说明，不将练习件当实用承重品交付。"
    交换失败作品的故事:
      places:
        - "夜校作品交流廊"
      pairs:
        - 0
        - 1
      category: "日常接触"
      action: "{npc}看着展墙上一件失败作品，先讲自己当时不愿承认的判断，问你想聊还是只看看。"
      beats:
        trigger: "{npc}看着展墙上一件失败作品，先讲自己当时不愿承认的判断，问你想聊还是只看看。"
        objective: "认识彼此面对失败的方式"
        choice: "讲一个自己愿讲的片段，或只听；不聊作品可看完直接离开"
        immediate: "对话可以停在有趣或难堪的一小段，助教与辅导员都不把倾诉记入评分材料。"
        near: "愿意才约互看下一版作品，今天没有新的学分材料和自我证明作业。"
  pressures:
    署名顺序出现争议:
      source: "同一份小组成果出现两版署名"
      engines:
        - "名声保卫"
        - "信任透支"
      beats:
        trigger: "{npc}收到两份不同署名的成果页。"
        objective: "保留每人的贡献证据"
        choice: "先对照日志，或请组员共同说明"
        immediate: "有争议的小组成果暂停提交，个人练习与作品闲聊不被一并停止。"
        near: "助教只保管相关操作片段，辅导员另约愿意参加的组员说明贡献，不从展廊闲聊摘取证词。"
      far_trigger: "修订后的成果页正式申请认定时"
      far_consequence: "清楚划分贡献才继续审核，未达成者可分别提交本人部分，合作成果可能不再整体认定。"
      exits:
        - "只交本人贡献说明，退出共同提交"
        - "不参加当面协调，撤回本人在争议版本上的署名"
      bindings:
        -
          activity: "制作一件可拆解的小样"
          place: "开放实验室样品台"
          pair: 0
        -
          activity: "交换失败作品的故事"
          place: "夜校作品交流廊"
          pair: 1
    设备预约被重复登记:
      source: "两个课程预约了同一台仪器"
      engines:
        - "资源锁定"
        - "第三方施压"
      beats:
        trigger: "{npc}发现预约表上叠着两个班的时段。"
        objective: "安排双方都能接受的替代方案"
        choice: "借用示教模型，或协商错峰"
        immediate: "需用同一仪器的测量先停，桌面接头练习还能继续，不按谁资历老抢占。"
        near: "管理员确认错峰时间，不能等的人改做示教模型或把原预约移到自选时段。"
      far_trigger: "下一轮开放仪器预约开始时"
      far_consequence: "增加冲突复核后恢复可预约时段，本次让位不换取以后无限优先权。"
      exits:
        - "退掉今天的仪器时段，收好个人材料离开"
        - "转做不占仪器的拆装小样，到下课结束"
      bindings:
        -
          activity: "排查教学模型的断点"
          place: "夜校拆装教室"
          pair: 0
        -
          activity: "制作一件可拆解的小样"
          place: "开放实验室样品台"
          pair: 0
  themes:
    - "成年人的经验如何获得承认"
    - "失败作品中的可传授知识"
    - "共享仪器与个人学习节奏"
  technology_boundary: "当代成人夜校使用低压教学模型、普通测量工具和可拆试件；练习不模拟高风险实用工程，日志有帮助但不自动证明全部贡献，成果辅导不等于学分审批。"
  bridge_status: "not_required"
