      engines:
      - 债务压力
      - 资源锁定
      beats:
        trigger: '{npc}收到消息：驿站柜台的租约到期，续约要有人签字并当场付清。'
        objective: 把谁签这张纸、谁付这笔配给券说清楚，不靠仓库里那批药垫付
        choice: 当场清点券数再签；只签自己那一半；或先不续等下一批补给
        immediate: 签字的人与付券的人当作两条记录写进册子，短缺部分不转成对私人的欠账。
        near: 不续约则柜台上的上锁货架由公库收回，短缺数与暂押药品一并复核。
      far_trigger: 续约的券被挪用去买回暂押的抗生素
      far_consequence: 租约作废，双方都要在册上说明券的去向，私藏药品的把柄从此公开。
      exits:
