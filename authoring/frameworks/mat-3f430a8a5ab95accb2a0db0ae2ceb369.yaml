  themes:
  - 集中供暖里的个人休息权
  - 修补劳动如何换来共同生活的余裕
  - 封闭聚落中的自愿参与
  - 登记册与配额下的人情消耗
  - 体温依赖与尸潮围困中的取暖资格
  technology_boundary: 避难所保有轮班供暖、低功率照明、机械闸门和有限维修设备；燃料与零件有限，无无限能源或万能修复。闸门前是内部等候区，退出活动不等于放行到外部寒区。登记册、体温计与配给券存根是唯一的官方记录手段，没有电子身份系统或即时通信；废土驿站在被封路段之外，往返需按当次路况另行安排。
  bridge_status: bridge_required
  bridge_explanation: 废土驿站位于避难所封闭区域之外、被封路段另一侧，不是居住层内的房间。进入驿站活动必须另行写出队、按路况折返或经搜刮队带路的经过；不能从避难所内廊直接走到驿站柜台。
