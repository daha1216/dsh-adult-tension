        pair: 2
      - activity: 分一条毛毯抵过长夜
        place: 雪山木屋
        pair: 0
    撤离名额二选一:
      source: 撤离车只带回一个名额，名单要当晚定下来
      engines:
      - 名额只能给一个人
      - 信任透支
      beats:
