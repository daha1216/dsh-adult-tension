        place: 避难所防爆闸门前
        pair: 2
      - activity: 试摆闸门内等候座位
        place: 避难所防爆闸门前
        pair: 0
    瞒报咬伤的连带:
      source: 有人袖口下的齿痕被同桌修补者先看见
      engines:
      - 秘密暴露倒计时
      - 咬痕瞒到了极点
      beats:
        trigger: '{npc}收到消息：有人袖口下的齿痕被同桌修补者先看见。'
        objective: 在伤口被公开前把申报责任落到具体的人
        choice: 当场劝其申报；先私下问明来路；或直接把记录交给检疫员
        immediate: 被看见的那条齿痕当场登记，同队人一起进复检名单，谁都不替谁隐瞒。
        near: 瞒报者若坚持否认，下一轮复检会连坐到整支搜刮队，出队资格一并暂停。
      far_trigger: 伤口在复检窗口前发炎高烧
      far_consequence: 整队被解除出队资格并进入清退名单，最先知情不报的人承担与瞒报者相同的处置。
      exits:
      - 接受当场登记并进入复检名单
      - 把记录交出去后退出同队搭档关系
      bindings:
      - activity: 缝制共用收纳袋
        place: 工作室
        pair: 0
      - activity: 核对今日放行登记
        place: 避难所防爆闸门前
        pair: 2
    私藏抗生素的把柄:
      source: 驿站上锁货架的库存与公库册上记的数对不上
      engines:
      - 债务压力
      - 第三方施压
      beats:
        trigger: '{npc}收到消息：驿站上锁货架的库存与公库册上记的数对不上。'
        objective: 把差额落到具体的人和具体的兑换记录上
        choice: 当面重数并补记；先查这段时段的兑换存根；或把存疑部分暂押等核验
        immediate: 短缺数量当场入册，暂押药品不进流通，私藏者要先说明用途才谈兑换。
        near: 谁碰过那把锁就成了谁在这件事上的把柄，疗程依赖者下次断药时会先来找他。
      far_trigger: 疗程依赖者在下一次配给日仍拿不到核定剂量的抗生素
      far_consequence: 持把柄者可以按次索要交换条件，一旦差额被公开则双方同时进清退名单。
      exits:
      - 把短缺数补记入册并交出暂押部分
      - 交还配给券，退出本轮兑换不再经手药品
      bindings:
      - activity: 清点上缴公库物资
        place: 废土驿站
        pair: 3
    尸潮封门第一夜:
      source: 闸门外传来成片的撞击声，第一夜的尸群堵住了唯一的出口
      engines:
      - 尸潮封门
      - 共处密闭
      beats:
        trigger: '{npc}收到消息：闸门外传来成片的撞击声，第一夜的尸群堵住了唯一的出口。'
        objective: 在开闸时段与封锁之间把人点清，不让任何人替集体决定谁出去
        choice: 按册复点人数；只确认本铺位的人；或先把守闸轮次排出来
        immediate: 闸门按册封死，未登记在册的人当晚不进居住层，值守按轮次排而不靠自愿顶替。
