id: mat-3f430a8a5ab95accb2a0db0ae2ceb369
name: 寒冬避难所公共生活
material:
  eras:
  - 避难所管制期
  aesthetics:
  - 寒冬避难所
  - 废土粗粝
  - 感染隔离区
  rule: 入夜严禁声光引尸，闸门落锁后不得擅自开门，值夜的人只按册核身份、不替任何人做主；体温异常者当即带离复检而非当场处置，瞒报感染连带全队，避难所不留无用之人。
  social_rule: 伤口与体温必须当场申报，瞒报者被带离并解除隔离资格；配给券与口粮凭票据当场核销，不得私下转让；搜刮所得须全数上缴公库再按需配给，宵禁令下擅自开门者与开门对象同罪。
  places:
    避难所防爆闸门前:
      details:
      - 防爆闸门内侧的等候长凳旁挂着保温帘·午
      - 闸门缝里漏进的雪粒在长凳脚下积成薄薄一层·午
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿内侧走廊返回居住层，不擅自启闭外闸
        - 退回闸门员身后的登记桌，把名字从今日放行表划掉
        witnesses:
        - 值守闸门员
        affordances:
        - 试摆闸门内等候座位
        - 核对今日放行登记
        - 值班人员要求确认身份
        - 主动把门打开
        pressure_modifiers:
        - 开闸时段与等候区热量流失
        - 闸外风雪与人流长度
    幸存者地下避难所:
      details:
      - 地下公共暖房里旧书围着低功率灯摆开·晚
      - 暖房墙上的配给券兑换表被反复涂改·晚
      profile:
        privacy: low
        visibility: high
        exits:
        - 经内廊回个人铺位，保持保温门随手关
        - 把没读完的书按编号放回原架，下次再看
        witnesses:
        - 自愿读者与暖房值班者
        affordances:
        - 筹划公共读书夜
        - 比对配给券与口粮名册
        - 留一盏灯
        - 侧身挡住通风口的风
        pressure_modifiers:
        - 座位容量与安静休息需求
        - 夜间声光管控与照明额度
    工作室:
      details:
      - 工作室缝补桌边放着不同厚度的旧布·午
      - 墙钩上挂着已缝好的保温帘半成品·午
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 收好针具后经内门回居住走廊
        - 把未缝完的旧布卷起交回共用保管册
        witnesses:
        - 同桌修补者
        affordances:
        - 缝制共用收纳袋
        - 试缝可拆卸的保温内衬
        pressure_modifiers:
        - 针线余量与工作照明时段
        - 旧布厚薄与可拆缝法耗时
    废土驿站:
      details:
      - 驿站柜台后的货架上锁着抗生素与燃料罐·晚
      - 驿站门外的雪地上留有刚被踩乱的脚印·晚
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从驿站正门回到被封路段，按来路折返
        - 交还暂押的配给券，取回自己的空水壶
        witnesses:
        - 驿站掌柜与同行的搜刮队搭档
        affordances:
        - 清点本轮搜刮所得
        - 核对上缴公库的物资清单
        pressure_modifiers:
        - 风雪封路与补给车到达时间
        - 柜台后上锁货架的库存余量
    雪山木屋:
      details:
      - 断电的木屋里只剩壁炉余温，毛毯叠在离火最近的长凳上·夜
      - 窗玻璃内侧结着化开又冻上的水痕·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 天亮后沿被雪压出的脚印退回主路，独自夜行不算选项
        - 把门重新闩上退回屋内，等风雪停了再谈去留
        witnesses:
        - 同行的避雪者
        affordances:
        - 分一条毛毯抵过长夜
        - 掀开毛毯把人整个裹进来抵住夜寒
        - 清点剩下的柴火与食物
        pressure_modifiers:
        - 炉火熄灭时间与体温流失
        - 屋外风雪与尸群活动声
    避难所检疫区:
      details:
      - 检疫区的隔断帘把床位分成一格一格，帘外摆着一张登记桌·夜
      - 隔离床位旁的托盘里放着未拆封的抗生素与体温计·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 复检结果为阴性后经内廊回居住层，不绕过登记桌
        - 在复检窗口关闭前留在隔离位，不出检疫区自行走动
        witnesses:
        - 检疫员与复检登记员
        affordances:
        - 核对本轮的复检名单
        - 清点抗生素与体温计的领用记录
        - 核对避难所清退名单
        - 核查私藏救命药的把柄
        pressure_modifiers:
        - 复检窗口关闭时间与床位容量
        - 清退名单上的顺序与体温读数
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 公共暖房轮值协调员
      function: 协调暖房时段与内部等候秩序
      authority: 能提议换时段，不能减少拒绝活动者的基本取暖份额
      resource: 暖房钥匙、座位排布与轮班联络
      limitation: 不是供暖技师，也没有闸门放行权
      obligation: 让基本休息和自愿活动分开安排
      exposure: 把热源当奖惩会失去居民信任
      hidden: —
    player:
      identity: 旧物修补匠
      baseline: 你补好的保温帘让等候区暖了一点，他邀你一起试摆座位
      resources:
      - 针线、旧布和可拆缝法
      reputation: 旧物修补匠，会缝补但不承担无资质供暖抢修
    relationship_reason: 你补好的保温帘让等候区暖了一点，他邀你一起试摆座位
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 旧物修补匠
      function: 把旧布和小工具修成可继续使用的生活用品
      authority: 可决定接哪件修补，不能接替专业供暖检修
      resource: 共用针具的保管册、自备的低功率针线灯与夜读时能腾出的半张桌
      limitation: 不能凭手艺制造短缺零件，眼睛和手也需要休息
      obligation: 说清能修到什么程度并收好共用针具
      exposure: 过度承诺会让居民错过替代用品
      hidden: —
    player:
      identity: 公共暖房轮值协调员
      baseline: 你曾保留不参加读书也能坐的暖位，她愿带着针线来听一章旧书
      resources:
      - 读书夜攒下的书目
      - 自愿朗读者的联络名单
      reputation: 暖房协调员，懂轮班但不指挥他人手艺
    relationship_reason: 你曾保留不参加读书也能坐的暖位，她愿带着针线来听一章旧书
  - family: 秩序与执法
    position: 避难所检疫员
    appellations:
    - 房客
    npc:
      role: 避难所登记员
      function: 按册核对入所者的体温、伤口与配给券额度，记录当日进出
      authority: 可当场拒绝体温异常者入内并叫值守带离，不能自行决定处置轻重
      resource: 登记册、体温计、配给券存根与内闸钥匙的一次性授权
      limitation: 只认册上记录，不能凭个人判断给谁加份额，也不懂供暖与检修
      obligation: 每次登记都要念出条款编号与理由，让被登记者自己确认
      exposure: 漏记一次伤口申报，全队按瞒报连带，登记员本人也进清退名单
      hidden: —
    player:
      identity: 避难所检疫员
      baseline: 你按册核对体温与伤口，登记员在你落笔前会先念一遍条款编号
      resources:
      - 当日验伤记录与已签的隔离单
      - 闸门员给的一次性内闸放行凭条
      reputation: 检疫员，按册办事也肯把条款念给人听
    relationship_reason: 你把一名瞒报咬伤者的记录如实归档后，登记员愿意先念条款再让你落笔
  - family: 服务与手艺
    position: 外来者
    appellations:
    - 师傅
    npc:
      role: 驿站掌柜
      function: 清点搜刮队交回的物资并按公库册登记上缴，兑换配给券
      authority: 可暂押来路不明物资等候核验，不能私自截留或加价兑换
      resource: 上锁货架、公库登记册与一柜用配给券兑换的抗生素
      limitation: 不做诊断也不当家，遇上撤离名额这类决定只能上报
      obligation: 当面念出上缴清单与兑换数，让搜刮队自己核对余数
      exposure: 私藏救命药一旦被查出，把柄会跟着他后半程，谁也保不住他
      hidden: —
    player:
      identity: 外来者
      baseline: 你带着一队搜刮所得走进驿站，掌柜先让你把清单念完再上锁
      resources:
      - 本轮搜刮所得与上缴清单
      - 一张写着自己来路的口述凭据
      reputation: 外来者，肯全数上缴也还没拿到长期铺位
    relationship_reason: 你在门口被要求确认身份时如实报了来路，掌柜因此愿意先记账再收物资
  activities:
    试摆闸门内等候座位:
      places:
      - 避难所防爆闸门前
      pairs:
      - 0
      category: 空间与退出
      action: '{npc}请你从居住层走到内侧长凳，看看保温帘是否挡住返回通道。'
      beats:
        trigger: '{npc}请你从居住层走到内侧长凳，看看保温帘是否挡住返回通道。'
        objective: 减少等候吹风并保留返回居住层的路径
        choice: 试走挪凳；不等候返回铺位；或只请闸门员确认动线
        immediate: 座位避开门缝，返回走廊看得见，外闸权限不变
        near: 下一轮居民可坐等或晚些再来，不靠站队保持取暖资格
    筹划公共读书夜:
      places:
      - 幸存者地下避难所
      pairs:
      - 1
      category: 日常接触
      action: '{npc}翻开一本旧书，说今晚可以边听边缝，也可以只坐着。'
      beats:
        trigger: '{npc}翻开一本旧书，说今晚可以边听边缝，也可以只坐着。'
        objective: 让暖房里的人有不被要求表现的共同消遣
        choice: 读一段；不参加回铺位；或只听不发言
        immediate: 谈话与安静席分开，书没读完可合上
        near: 下次可自愿续读，取暖和座位不会以出勤为条件
    缝制共用收纳袋:
      places:
      - 工作室
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}把旧布交给你这位修补匠，问能否试缝一个不易漏小工具的内袋。'
      beats:
        trigger: '{npc}把旧布交给你这位修补匠，问能否试缝一个不易漏小工具的内袋。'
        objective: 用可拆内袋减少工具散失
        choice: 试缝并由本人检查；不接这件活；或只教协调员一段粗缝
        immediate: 内袋装进工具篮试提，松线处拆回重缝，不靠登记替代实物试用
        near: 下一班能整篮交接工具，修补者按约结束不被追加任务
    核对今日放行登记:
      places:
      - 避难所防爆闸门前
      pairs:
      - 2
      category: 调查与核验
      action: '{npc}把登记册推到你面前，让你逐条听清今日放行条款编号与理由。'
      beats:
        trigger: '{npc}把登记册推到你面前，让你逐条听清今日放行条款编号与理由。'
        objective: 确认谁被放行、依据哪一条，且不把疑问留到闸门落锁后
        choice: 逐条核对；只看自己那一行；或要求把条款原文念完整
        immediate: 有疑问的那一行当场标出，闸门落锁前不放未经记录的人出去
        near: 闸门员换班可对照同一册记录，被拒者可当场追问理由而非站队求情
    清点上缴公库物资:
      places:
      - 废土驿站
      pairs:
      - 3
      category: 信息交换
      action: '{npc}当着你念出上缴清单，问剩下的余数是否与搜刮所得对得上。'
      beats:
        trigger: '{npc}当着你念出上缴清单，问剩下的余数是否与搜刮所得对得上。'
        objective: 把私人所得与公库账目当场对齐，不靠私下默契补齐差额
        choice: 逐项核对补报；只报能确认的部分；或把存疑物品暂押等核验
        immediate: 差额当场写进清单，暂押物品另行登记，不折算成人情
        near: 下次出队可据同一册核对配额，私藏药物一旦对上账就成公开把柄
    分一条毛毯抵过长夜:
      places:
      - 雪山木屋
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}把最厚的那条毛毯掀开，问你要不要一起裹进离火最近的位置。'
      beats:
        trigger: '{npc}把最厚的那条毛毯掀开，问你要不要一起裹进离火最近的位置。'
        objective: 靠体温把雪山木屋断电长夜熬过去，同时不把取暖变成单方面的迁就
        choice: 分毯同裹；各自守一边火；或只轮流添柴不共毯
        immediate: 毛毯按实际人数分过，谁离火近轮流换位，进屋的人不因分到位置欠下人情。
        near: 下一夜仍可按同样的办法分位，取暖安排不必以亲近程度为前提。
    复检与隔离登记:
      places:
      - 避难所检疫区
      pairs:
      - 2
      category: 调查与核验
      action: '{npc}把隔离名单摊在登记桌上，让你看着体温读数决定谁进复检栏。'
      beats:
        trigger: '{npc}把隔离名单摊在登记桌上，让你看着体温读数决定谁进复检栏。'
        objective: 按体温与伤口记录决定复检顺序，不让声音大的人插队
        choice: 照读数逐条登记；只核对自己负责的床位；或要求当场复测有争议的那一条
        immediate: 有争议的读数当场复测并写入记录，未复检者不出检疫区，抗生素领用另册登记。
        near: 清退名单按本轮记录顺序更新，复检为阴性的人才回居住层，谁都不能凭人情换栏位。
  customs:
  - 读书夜允许自带手工活，不要求每个人发言。
  - 入所者沿走廊把配给券存根按顺序插进门口存根板，次日再换新券。
  - 请求庇护的人在闸门内侧长凳上等到值夜的人核完身份，不敲门也不报熟人的名字。
  - 配给券按当日核销，明天的份今天不定，资源凭配给券兑换且资源按需配给，不预支下一天。
  - 规矩只管没退路的人，信任稀缺，伤口瞒报者当场驱逐；没有铺位的人连排队的资格都要先问过值夜的人。
  - 体温异常即抹杀不是当场处置，而是当即带离复检；这条规矩只在人还有退路时讲得通。
  - 宵禁令下擅自开门同罪，搜刮物资须全数上缴公库，配给券不得私下转让，违者按册连坐。
  pressures:
    公共房间预约重复:
      source: 两组居民同时预约了唯一的暖房
      engines:
      - 资源锁定
      - 对等试探
      beats:
        trigger: '{npc}收到消息：两组居民同时预约了唯一的暖房。'
        objective: 讨论分时使用或替代场所
        choice: 核对原预约，或协商轮换
        immediate: 读书活动不先占满暖位，另一组的基本休息需求留出。
        near: 可分前后半场或取消朗读保留静坐，修补匠不能凭出勤决定座位。
      far_trigger: 连续数晚同一小组占住暖房最佳时段
      far_consequence: 居民会要求轮换或停止组织活动，协调员需接受新的排班而非削减异议者取暖。
      exits:
      - 取消本次朗读但保留所有人的基本暖位
      - 转为在个人铺位看书，不再参与暖房活动安排
      bindings:
      - activity: 筹划公共读书夜
        place: 幸存者地下避难所
        pair: 1
    维修轮班需要替换:
      source: 原定维修人员无法按期到场
      engines:
      - 资源锁定
      - 时限逼近
      beats:
        trigger: '{npc}收到消息：原定维修人员无法按期到场。'
        objective: 找到有资质的替班而不强迫无经验者接手
        choice: 联系备班，或调整非必要活动
        immediate: 通知明确缺的是供暖设备维修岗，缝补者不接带压或电气检修。
        near: 协调员联系合资格备班，缝补工作可停下归还工具，非必要开放顺延。
      far_trigger: 专业备班在下一次供暖检修窗口仍不能到岗
      far_consequence: 受影响公共房间按技术人员确认的范围缩短开放，居民转到仍可用的暖区。
      exits:
      - 归还针线结束缝补，由协调员继续联络备班
      - 暂停该房间非必要活动，转移到已确认可用的取暖区
      bindings:
      - activity: 缝制共用收纳袋
        place: 工作室
        pair: 0
    发电机燃油告罄:
      source: 供暖发电机的燃料表指针已压到红线
      engines:
      - 资源锁定
      - 共处密闭
      beats:
        trigger: '{npc}收到消息：供暖发电机的燃料表指针已压到红线。'
        objective: 按登记册核定取暖额度，而不是由谁声大谁先领
        choice: 查公库余量；压缩公共区时段保个人铺位；或让值班员先确认实际读数
        immediate: 公共暖房缩短开放时段，个人铺位额定取暖不动，库房出入全部登记。
        near: 囤油的人会被要求在册上说明用途，配给断供前先耗掉公共区的富余额。
      far_trigger: 燃油按表耗尽而新的补给车仍被风雪封在路段外
      far_consequence: 公共区先停暖，居民挤回个人铺位，密闭空间里的体温依赖变成唯一的取暖来源，清退名单随之被重新提起。
      exits:
      - 把公共区时段压缩到最低并登记说明
      - 退出公共区值守，回个人铺位自行安排取暖
      bindings:
      - activity: 筹划公共读书夜
        place: 幸存者地下避难所
        pair: 1
    防爆门即将落锁:
      source: 值守闸门员开始按册点名，闸门还有半小时落锁
      engines:
      - 时限逼近
      - 身份风险
      beats:
        trigger: '{npc}收到消息：值守闸门员开始按册点名，闸门还有半小时落锁。'
        objective: 在落锁前把身份、伤口与配额三类记录一次性核对清楚
        choice: 当场补报体温与伤口；只确认自己那条；或要求闸门员念完整条款
        immediate: 未记录者不得留在闸内侧，已被带离者当晚不进居住层，闸门按册落锁。
        near: 第二夜仍无记录的人不占配额，搜刮队出队前会先看登记册挑搭档。
      far_trigger: 连续数夜有人靠人情绕过点名留在闸内
      far_consequence: 闸门员被追责换班，登记条款收紧到每夜复点，滞留者按清退名单顺序处理。
      exits:
      - 当晚接受带离并在隔离区等待复检
      - 要求闸门员当场念出条款后自行退出等候区
      bindings:
