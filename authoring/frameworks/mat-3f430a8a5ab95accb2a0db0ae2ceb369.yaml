      far_trigger: 尸群持续封门而补给与撤离车都无法按期到达
      far_consequence: 燃油与口粮消耗快于预期，撤离名额与清退名单被重新提起，密闭空间里的人和事都无处回避。
      exits:
      - 按册封闸并接受值守轮次安排
      - 退出值守，回个人铺位不再经手闸门
      bindings:
