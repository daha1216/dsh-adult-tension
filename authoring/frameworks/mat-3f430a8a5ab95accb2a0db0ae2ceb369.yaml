        objective: 让被列名的人看到据以列名的记录，而不是只看到结果
        choice: 当场翻记录核对；只查自己那一行；或先去问能不能补做一次复检
        immediate: 每条列名旁附上条款编号与记录页，有争议的当场建复核条目，不把人直接赶出去。
        near: 复核通过者可回居住层，落选的人按序等下一轮配额，第三方施压不再改变顺序。
      far_trigger: 连续两季有人靠人情从名单上被划掉
      far_consequence: 值守者被要求交出记录接受复核，公库与床位重新按册分配，私下的庇护关系一并作废。
      exits:
