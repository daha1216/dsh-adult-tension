        objective: 把名额交回当事人自己争，不让值守者私下许诺或代替判断
        choice: 按登记顺序公开念名单；只报自己那一栏；或把名额留到下一趟车
        immediate: 名额按册当众定下，谁被留下都当场知道理由，私下的许诺一律不认。
        near: 留下的那个人下次排位靠前，值守者不能拿名额换任何东西。
      far_trigger: 私下许诺过的名额在第二趟车上被翻出来
      far_consequence: 许诺者失去居民信任并被换班，被挤掉的人按其记录重排位次，公库账目一并复核。
      exits:
