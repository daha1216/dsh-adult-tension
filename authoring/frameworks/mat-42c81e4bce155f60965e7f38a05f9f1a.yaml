  technology_boundary: 山路靠步行、驮运与纸图传递；悬空神殿由本地阵法承托，巡礼仍走栈桥。阵法不能自动辨伪旧志或瞬送货物，无现代通信与印刷终端。地宫以断龙石与石槽封口，出入只靠石阶与旧盗洞；当铺凭纸质当票与手印挂账，真名交割以画押留档，凡人对地脉的知觉只来自地气与行路经验，不借助任何器物测探。
