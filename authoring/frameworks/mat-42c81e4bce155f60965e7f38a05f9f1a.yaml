id: mat-42c81e4bce155f60965e7f38a05f9f1a
name: 仙门藏书与驿镖
material:
  eras:
  - 东方玄幻大陆
  aesthetics:
  - 水墨写意
  - 工笔华服
  - 中式民俗志怪
  - 古墓探险硬派风
  - 异世界冒险纪实
  - 敦煌异色幻梦
  rule: 修行之外，藏书、路图和镖运维持各地往来，凡人的手艺同样进入行会记录。抄本上的真名与地里的话都带着旧规矩：真名一旦被人握住，签下的交割就不再有反悔的余地；地脉被镇妖大阵压着走，阵一逆流，最先知道该往哪条路撤的反而是常走山路的人，而仙门的号令只认本门的令符。
  social_rule: 借阅与护送按委托说明办理，师门身份不替代具体许可。镇里对外来客的规矩是先不问从来处，也不替人认亲，谁要问，得先把自己那一份凭据拿出来。
  places:
    藏经阁:
      details:
      - 油灯下压着虫蛀山志的长案·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 贯通阁门与山门的石廊
        witnesses:
        - 守卷弟子
        affordances:
        - 校对山川旧志
        pressure_modifiers:
        - 原卷借期与墨迹干燥程度
    悬空神殿:
      details:
      - 阵纹照亮悬台边的路签架·暮
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿有扶栏的栈桥返回山门，不从悬台跃下
        witnesses:
        - 守桥人和巡礼客
        affordances:
        - 整理巡礼路签
        pressure_modifiers:
        - 桥上风势与开放方向
    镖局:
      details:
      - 驮架旁堆着草绳与防潮油布的院坪·晨
      profile:
        privacy: low
        visibility: high
        exits:
        - 镖局正门通往驿街
        witnesses:
        - 装货伙计
        affordances:
        - 核对普通货物路单
        - 给驮架加防磨垫
        pressure_modifiers:
        - 驮架承重与出镖顺序
    倒悬石梁地宫:
      details:
      - 断龙石卡在半途，石梁下的祭台还摆着香炉与未燃尽的香·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 沿来时的那条石阶退回地宫口
        - 从祭台后面的旧盗洞另寻出路，出口未必通到同一处
        witnesses:
        - 同队的行脚人与留守在地宫口的接应者
        affordances:
        - 在祭台前核一遍木匣上的封泥与刻字
        - 照着地气走向辨一条可用石阶
        pressure_modifiers:
        - 断龙石离落定还剩多久
        - 黑气漫过第几级台阶
    地宫外山道车马棚:
      details:
      - 车马棚的木栏只拴得住两匹走骡，草料槽里剩最后半槽干草·黄昏
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 沿东侧小径下坡，绕开镇妖大阵压住的那一条官道
        - 退回地宫口，等接应的驮队回头
        witnesses:
        - 车马棚的看棚伙计与同队押货人
        affordances:
        - 把走不了的货与驮具重新分装
        - 核一遍东侧小径上还剩几处能让骡子喘气的地方
        pressure_modifiers:
        - 小径的坡度与可歇处
        - 两匹走骡的脚力还剩多少
    街口当铺:
      details:
      - 柜台的灯只照着台面，封条与旧账册按年份堆在里侧货架·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从营生门回到街上
        - 赎期未到也可以当面折价退回，账上另记一行
        witnesses:
        - 当铺朝奉与一并到场的中人
        affordances:
        - 辨认当票上的名字与物件
        - 问清赎期与过期的后果
        pressure_modifiers:
        - 赎期还剩几日
        - 这一件今日按几成折价
    仙门驿铺:
      details:
      - 堂前墙上挂着并排的驿名木牌，几面写着同一处简称·晨
      profile:
        privacy: low
        visibility: medium
        exits:
        - 把货退在驿铺仓前，人从侧门出到官道
        - 等委托人回信期间留在驿铺过夜，次日再定
        witnesses:
        - 驿铺的登记文书与同来交货的过路客商
        affordances:
        - 在木牌前逐字比对两处简称
        - 翻一遍当季的通行信与回条
        pressure_modifiers:
        - 委托人回信要几日
        - 下一趟出驮的脚程
  pairs:
  - family: 学术与专业
    position: 公会契约使魔
    appellations:
    - 直呼其名
    npc:
      role: 藏书校勘人
      function: 辨认地志异文并维护借卷
      authority: 可批准自己经管抄本的借阅，原卷出阁须守卷人同意
      resource: 两版有批注的地志与辨认旧地名的经验
      limitation: 没有踏查所有山路，不能以古籍替代当季路况
      obligation: 归还原卷并区分推断与见闻
      exposure: 错定渡口会让护送者白走山路
      hidden: —
    player:
      identity: 驿路护送文书
      baseline: 你带回的驿路里程曾纠正他抄本上的山名，今日再约核对
      resources:
      - 驿站回条、驮架尺寸和当季通行见闻
      reputation: 肯走实路，但不肯给未经踏查的路线担保
    relationship_reason: 你带回的驿路里程曾纠正他抄本上的山名，今日再约核对
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    - 师兄
    npc:
      role: 驿路护送文书
      function: 安排驮货去向与巡礼分流
      authority: 能改自接委托的装载次序，不能替镖头放行
      resource: 防潮油布与旧毡等打包余料、亲测多季的栈桥分岔走向
      limitation: 不懂古文字，载重与脚程不能靠师门名号增加
      obligation: 按完整驿名交货并说明延迟
      exposure: 错装会占掉伙计一次往返脚程
      hidden: —
    player:
      identity: 藏书校勘人
      baseline: 他的镖队常年替你捎回各地的地志抄本，交接单上互留的按语攒了一沓；这次趁交卷，他约你在悬空神殿栈桥口一起整理巡礼路签
      resources:
      - 为路签补写工整字样的底稿
      - 留异文不轻断的笺注习惯
      reputation: 考据细致，遇到缺证宁可留下空栏
    relationship_reason: 他的镖队常年替你捎回各地的地志抄本，交接单上互留的按语攒了一沓；这次趁交卷，他约你在悬空神殿栈桥口一起整理巡礼路签
  - family: 学术与专业
    position: 被求助者
    appellations:
    - 大夫
    - 直呼其名
    npc:
      role: 行走山道的大夫
      function: 走出山道各镇，替人看伤换药，随身的药箱只够撑到下一处集镇
      authority: 可当场处置外伤与认得出药性，改不了仙门的验伤册，也开不出一条能过哨卡的验状
      resource: 一只装到半满的药箱、几味认得准的草药，以及一处只收熟客的旧客栈
      limitation: 认不得镇妖阵的阵纹，被查的人只要身上带着非人的东西，他一概看不出来
      obligation: 换药前先说清自己只能治到哪里，别的一种不许代劳
      exposure: 替不该治的人上了药，往后这一条山道上的哨卡都会先查他的药箱
      hidden: —
    player:
      identity: 受本门令符差遣、掌着一处行会契约的成年仙门人士
      baseline: 你手上那枚本门的令符能过哨卡却压不住地脉，而这次同行的人里有一个伤势瞒不住，只有这一个大夫看得出要上什么药。
      resources:
      - 一枚可过哨卡的令符与一页行会契约
      - 一处落脚用的旧客栈与一条只在夜里走的近路
      reputation: 镇里的人认得你的令符，不认得你的名字，也不问你要往哪里去。
    relationship_reason: 一道只有一处哨卡能过的山道把你和他放在同一条路上：你的令符过得去人过不去伤，他的药箱压得住伤却压不住阵，两个人只能一起走完这一程。
  activities:
    校对山川旧志:
      places:
      - 藏经阁
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}展开两份渡口异文，请你用实走里程辨认哪一处山名。'
      beats:
        trigger: '{npc}展开两份渡口异文，请你用实走里程辨认哪一处山名。'
        objective: 区分旧名、别名与尚未踏查的渡口
        choice: 比对里程；不参加校勘而读别卷；或只口述一次实走见闻
        immediate: 吻合项贴上可移纸签，缺证项保留两说，原卷不改
        near: 下一位借卷者能区分可用地名与待访路线
    整理巡礼路签:
      places:
      - 悬空神殿
      pairs:
      - 1
      category: 空间与退出
      action: '{npc}把两块路签挂到分岔口，请你从栈桥来路试走一遍。'
      beats:
        trigger: '{npc}把两块路签挂到分岔口，请你从栈桥来路试走一遍。'
        objective: 让上行巡礼客与返程客不挤在同一窄段
        choice: 试走后换向；谢绝上桥留在山门；或只检查签面辨识度
        immediate: 一组路签转向，返程客能看见下山入口，未试走段不开放
        near: 下回可独自选短线巡礼，不必绑定护送行程
    核对普通货物路单:
      places:
      - 镖局
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}拿着地志站在驮架边，请你把路单上的终点与三包日用品逐一对上。'
      beats:
        trigger: '{npc}拿着地志站在驮架边，请你把路单上的终点与三包日用品逐一对上。'
        objective: 让终点和货包匹配后再交伙计装驮
        choice: 逐包核验；不接核验由伙计处理；或先挑出终点未明的一包
        immediate: 已确认货包移到对应驮架，疑包留仓不混装
        near: 接货驿站按包点收，少一次翻卸重装
    给驮架加防磨垫:
      places:
      - 镖局
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}递来旧毡，请你在空驮架的磨痕处试一块软垫。'
      beats:
        trigger: '{npc}递来旧毡，请你在空驮架的磨痕处试一块软垫。'
        objective: 利用余料减轻货箱与驮架相互磨损
        choice: 试缝可拆毡垫；不动手只看；或请伙计换一副合尺寸驮架
        immediate: 试装货箱后垫片不再滑动；不合尺寸的撤回不勉强使用
        near: 下一程可检查磨痕决定留用，缝坏也只损失一块旧毡
    在断龙石落定前清一遍木匣:
      places:
      - 倒悬石梁地宫
      pairs:
      - 2
      category: 调查与核验
      action: '{npc}把祭台上那三只木匣推到香炉旁边，让你在石落定之前决定先开哪一只。'
      beats:
        trigger: '{npc}把祭台上那三只木匣推到香炉旁边，让你在石落定之前决定先开哪一只。'
        objective: 在断龙石压下来之前把要带走的那一只挑出来
        choice: 三只都开一遍；只带上封泥完好的一只；或一只都不动，照原样退回石阶
        immediate: 开过的匣子封泥当场就碎，碎过的这一只往后谁都不认它是原封；退回石阶的那一只还按原样摆着。
        near: 地宫口守着的接应者只认带出来的是哪一只，认不出的那几只往后都算在开匣的人名下。
    在地宫外山道重排驮具:
      places:
      - 地宫外山道车马棚
      pairs:
      - 2
      category: 空间与退出
      action: '{npc}把草料槽里最后半槽干草指给你看，让你决定这两匹走骡先驮谁、谁跟着走下山路。'
      beats:
        trigger: '{npc}把草料槽里最后半槽干草指给你看，让你决定这两匹走骡先驮谁、谁跟着走下山路。'
        objective: 在骡子倒下之前把人和货分到两条路上
        choice: 按货的轻重分装并自己跟骡子走；让伤重的人骑上骡背，货留在棚里；或两匹都不动，整队退回地宫口等接应
        immediate: 骡背上一坐人，货就得留在棚里过夜，留在棚里的那几件次日还剩不剩谁也说不准。
        near: 东侧小径只够走一趟，走完这一趟棚里的东西要么有人回来取，要么从此算丢了。
    在柜面上认出当票上的名字:
      places:
      - 街口当铺
      pairs:
      - 2
      category: 信息交换
      action: '{npc}把一张当票压到灯下，票面上那一行名字跟你手上的令符只差一个字。'
      beats:
        trigger: '{npc}把一张当票压到灯下，票面上那一行名字跟你手上的令符只差一个字。'
        objective: 弄清这一件是谁押的、赎期还剩几天
        choice: 当场问清朝奉这一票的来路；只记下票面编号改日再查；或掉头就走，这票不认
        immediate: 问过一遍的人当场就知道赎期在几日，转身走掉的人这一票往后跟谁都没关系。
        near: 当铺按票面挂账，赎期一到就折价出售，认过这张票的人下一次进门会被先问来意。
    在驿名木牌前对一处简称:
      places:
      - 仙门驿铺
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}把你领到并排的驿名木牌前，让你在两处写着同一简称的牌子上找出该走哪一面。'
      beats:
        trigger: '{npc}把你领到并排的驿名木牌前，让你在两处写着同一简称的牌子上找出该走哪一面。'
        objective: 在出驮之前弄清委托人写的是两处驿站里的哪一处
        choice: 逐面比对刻字与里程；只报一处等委托人回信；或先把货压在驿铺，人先上路
        immediate: 对不上的那一面包留仓占一格驮位，另外两包照常发走；没比过就动身的人要在下一处重新问一次。
        near: 委托人回信前只按已确认的驿名交货，留仓的费用另外议；比对过的人往后接这一类木牌会先看刻字再听人念。
  customs:
  - 藏书人用可取下的纸签记录疑问，不直接涂改原卷。
  - 结队走山路的人入夜前对一遍水囊与火折，对不上就不动身。
  - 押物进出当铺，票面只写名字与物件，不问押物人的来路。
  pressures:
    护送终点名称重名:
      source: 两处驿站使用相同简称
      engines:
      - 资源锁定
      - 信任透支
      beats:
        trigger: '{npc}收到消息：两处驿站使用相同简称。'
        objective: 向委托人确认终点再出发
        choice: 核对地形图，或等待委托人回信
        immediate: 终点未明的一包留仓，占用一格驮位；其他货物仍可发走。
        near: 委托人回信前双方只能承诺已确认货物，留仓费由重新议定的委托承担。
      far_trigger: 若回信到达时原定镖队已经出发
      far_consequence: 疑包须改走下一队，委托人可取消该包护送；不会拖住全部驿路。
      exits:
      - 将疑包退回委托人并结清已做装卸
      - 交由镖头另派文书，自己仅交还已核验路单
      bindings:
      - activity: 核对普通货物路单
        place: 镖局
        pair: 0
      - activity: 在地宫外山道重排驮具
        place: 地宫外山道车马棚
        pair: 2
      - activity: 在驿名木牌前对一处简称
        place: 仙门驿铺
        pair: 0
    旧志抄本互相矛盾:
      source: 两份山川志记录了不同的渡口
      engines:
      - 旧事追索
      - 名声保卫
      beats:
        trigger: '{npc}收到消息：两份山川志记录了不同的渡口。'
        objective: 注明来源并核实可用路线
        choice: 询问最近过路者，或暂列未确认
        immediate: 争议渡口不进入推荐路线，可信的山段仍可供借阅。
        near: 校勘人等待近期过路者见闻，护送者可改用已核验的长路。
      far_trigger: 下一季地志抄写前仍无人能复核两处渡口
      far_consequence: 新版保留异文并缩小推荐范围，校勘人的详尽名声让位于路线可靠性。
      exits:
      - 只保留异文，不参加踏查
      - 把核验委托转给熟悉该渡口的行脚人，归还原卷
      bindings:
      - activity: 校对山川旧志
        place: 藏经阁
        pair: 0
    地脉黑气已经漫到第二级台阶:
      source: 镇妖大阵逆流之后山里的地脉开始往外冒黑气，如今已经漫到地宫口第二级台阶，按这个势头天亮之前会淹到祭台
      engines:
      - 天枢锁妖大阵灵气逆流
      - 时限逼近
      beats:
        trigger: 黑气贴上第二级台阶的时候，石梁下的香还在烧，脚下只剩往上的那条石阶。
        objective: 在天亮前决定带谁往哪一条路退，哪一件留在祭台上
        choice: 带着木匣沿石阶原路退回；走祭台后的旧盗洞赌一条没走过的路；或把带不走的留在原处，空手往上撤
        immediate: 选定的那条路一走上去就只剩一个方向，留在祭台上的东西当天就归了地脉，谁也回不来取。
        near: 撤出来的人会把这一条路的走法讲给下一个人，盗洞那一条若是通的，往后就会有人在夜里照着走。
      far_trigger: 下一季阵纹重排之前
      far_consequence: 走过这条路的人往后被请去替人带路，没走成的留在下面，名字只留在这一季的行脚名册上。
      exits:
      - 按已探明的那条石阶退出地宫口
      - 整队撤回地宫口外，等阵纹重排后再入
      bindings:
      - activity: 在断龙石落定前清一遍木匣
        place: 倒悬石梁地宫
        pair: 2
      - activity: 整理巡礼路签
        place: 悬空神殿
        pair: 1
    断龙石落到一半就卡住了:
      source: 断龙石落到一半卡在石槽上，底下这一段还过得去人，而上面的人以为门已经封死，接应的驮队天亮就要走
      engines:
      - 时限逼近
      - 资源锁定
      beats:
        trigger: 石头卡在半途，石缝里只够一个人弯腰过去，外头的人已经在收驮子。
        objective: 在驮队开走之前把能带出去的东西带过这条石缝
        choice: 把木匣先递出去自己再钻；只身钻出去，东西留在里面；或退回去等石头彻底落定，走另一条路
        immediate: 递出去的东西当场就脱了手，钻出去的人腰上只剩自己那件；退回去的人再过一次石缝就来不及了。
        near: 驮队走后的第二天，石缝还在不在谁也说不准，递出去的那一只往后归接应的人管。
      far_trigger: 同一季里第二队驮脚按原路进地宫
      far_consequence: 钻过石缝的人会被请去给第二队讲这一路，留在里面的人则要在名册上单独记一行。
      exits:
      - 按石缝递出物件后各自从地宫口撤出
      - 整队退回祭台，等断龙石重新抬起
      bindings:
      - activity: 在地宫外山道重排驮具
        place: 地宫外山道车马棚
        pair: 2
      - activity: 给驮架加防磨垫
        place: 镖局
        pair: 1
    真名被第三方查到:
      source: 有人拿着抄本上的旧名去镇上对过一份真名册，查到之后这一册就会按名字发到各处哨卡
      engines:
      - 旧事追索
      - 身份风险
      beats:
        trigger: 抄本的那一页被人翻到，名字已经抄出去一份。
        objective: 在名字发到哨卡之前决定这一段抄本怎么处置
        choice: 当场把那一页揭下来销毁；把原本退回藏经阁连同抄件一并撤回；或什么都不动，等哨卡的册子发下来再说
        immediate: 揭下来的那一页一烧就没了，但抄出去的那一份还在；不动的人从这一刻起要按发下来的册子过日子。
        near: 哨卡的册子按季更新，名字在上面的人往后每一次过关都要先被叫住；撤过抄本的人则要替这一段写清楚凭什么撤。
      far_trigger: 下一季真名册重新抄发
      far_consequence: 撤过这一段的人往后经手的抄本都要先过一遍名字；没撤的人要在册子发下来的那一个月里替自己解释一遍。
      exits:
      - 把涉及真名的抄件连同登记一并交回藏经阁
      - 退出本次校勘，不再经手含真名的抄本
      bindings:
      - activity: 校对山川旧志
        place: 藏经阁
        pair: 0
    同一个人身上验出两重身份:
      source: 大夫按伤开药的时候认出这人早年在镇上用过另一个名字，如今那一头的人也在找他，而驿路上只认这一趟的令符
      engines:
      - 身份错位
      - 信任透支
      beats:
        trigger: 药箱摊在地上，两边的说法已经对上了名字，只差有人先开口。
        objective: 在下一个哨卡之前决定这一程按哪一个名字走
        choice: 按现在的令符继续走，把旧名压下去；当场把两个名字都讲出来；或分头走，各按各的说法过卡
        immediate: 名字一旦讲出来，同路的人当场就要挑一个跟着走；压下去的那一个往后每一次过卡都要重新压一遍。
        near: 哨卡按当季册子认人，认错的那一次会留在当班文书的手记里，往后同一队的人过关都会被多看两眼。
      far_trigger: 旧名那一头的人追到同一条山道上
      far_consequence: 认下来的这一头往后要替这个人作保；压下去的那一头则要在某个哨卡前自己把话说破。
      exits:
      - 按这一程的令符走完，旧名之事另作交代
      - 当场分道，各自按自己的来路下山
      bindings:
      - activity: 在柜面上认出当票上的名字
        place: 街口当铺
        pair: 2
    真名交割只等一个手印:
      source: 当铺里那一件被押的旧物上拴着一段真名，赎期将到，朝奉只留到今夜，画了押就不再有异议的余地
      engines:
      - 真名契约与记忆典当交割
      - 时限逼近
      beats:
        trigger: 当票摊在灯下，押字的那一栏空着，朝奉的手已经按在印泥上。
        objective: 在铺子下闩之前决定这一个手印画不画
        choice: 当场画押把旧物赎回；只赎物件不认那一段真名；或起身离座，让这一件从此折价出售
        immediate: 画过的手印当场就干在票面上，这一件回了谁手上，那一段真名也就跟着谁走；不画的人天亮前还能反悔一次。
        near: 赎期一过，当铺按折价把这一件摆上柜台，买走它的人拿到的不是物件，是那一行名字。
      far_trigger: 这一件在下一个赎期之前被转手
      far_consequence: 押过这一件的人要么拿别的东西把它换回来，要么从此在这一带换一个名字做事。
      exits:
      - 结清当票本息，把旧物与那一段真名一并赎回
      - 不认这一段交割，把物件留柜按折价处理
      bindings:
      - activity: 在柜面上认出当票上的名字
        place: 街口当铺
        pair: 2
    血脉压着的那件镇物被人先拿在手上:
      source: 祭台上那只镇物认的是血脉，同队里另外一个人先一步把它托在掌心里，剩下的路要听掌物的人说话
      engines:
      - 血脉压制的镇物争夺
      - 攻守易位
      beats:
        trigger: 镇物已经在别人手上，掌物的人开口第一句就是往下怎么走。
        objective: 在下一处岔路口之前决定这件东西该在谁手上
        choice: 当场讨过来自己拿；认下这一路的处置由掌物的人定；或把这一件留在原处，谁都不带
        immediate: 东西在谁手里当场就看得出来，跟着走的人往后每一步都要先问掌物的人一句；留在原处的那一次往后谁也回不来取。
        near: 出了这一段地宫，掌物的人在这一条山路上说话就算数；把东西留在原处的队伍回去要按丢件另记一笔。
      far_trigger: 镇物在山道上第一个人多的岔口被外人看见
      far_consequence: 拿着它的人要么交出这一件，要么接下从此走夜路的那一条；交出来的人往后不再被请进这一队。
      exits:
      - 按掌物的人定的路走完这一程，出山后再论归属
      - 把镇物留在原处，两队各自下山
      bindings:
      - activity: 在断龙石落定前清一遍木匣
        place: 倒悬石梁地宫
        pair: 2
    金吾卫封了整条朱雀大街:
      source: 金吾卫以查真名为由封了整条朱雀大街，通行只认当夜的令符，走不过去的一律押到坊里等天亮再审
      engines:
      - 第三方施压
      - 身份风险
      beats:
        trigger: 坊门在身后落闩，街上只剩两队人走动，令符要一张一张看过去。
        objective: 在天亮之前决定这一程按谁的身份过这道街
        choice: 亮出令符照直走；绕小巷从坊的另一头出去；或退回坊里过夜，等封解了再走
        immediate: 令符一亮当场就要对册，对不上的人押到坊里过夜；退回坊里的人第二天仍要从同一道门出来。
        near: 封街按夜算，连着几夜走不通的人要么改走山路，要么在这一带先落下脚。
      far_trigger: 第二夜封街的范围往外扩到相邻的坊
      far_consequence: 走过这道街的人往后进出都要按同一份令符，绕道的人则要在别人还睡着的时辰动身。
      exits:
      - 按当夜令符过街，回原处等封解
      - 退回坊内过夜，次日再定行程
      bindings:
      - activity: 在断龙石落定前清一遍木匣
        place: 倒悬石梁地宫
        pair: 2
