        "exposure": "错装会占掉伙计一次往返脚程"
        "hidden": "—"
      "player":
        "identity": "藏书校勘人"
        "baseline": "他的镖队常年替你捎回各地的地志抄本，交接单上互留的按语攒了一沓；这次趁交卷，他约你在悬空神殿栈桥口一起整理巡礼路签"
        "resources":
          - "为路签补写工整字样的底稿"
          - "留异文不轻断的笺注习惯"
        "reputation": "考据细致，遇到缺证宁可留下空栏"
      "relationship_reason": "他的镖队常年替你捎回各地的地志抄本，交接单上互留的按语攒了一沓；这次趁交卷，他约你在悬空神殿栈桥口一起整理巡礼路签"
  "activities":
    "校对山川旧志":
      "places":
        - "藏经阁"
      "pairs":
        - 0
      "category": "调查与核验"
      "action": "{npc}展开两份渡口异文，请你用实走里程辨认哪一处山名。"
      "beats":
        "trigger": "{npc}展开两份渡口异文，请你用实走里程辨认哪一处山名。"
        "objective": "区分旧名、别名与尚未踏查的渡口"
        "choice": "比对里程；不参加校勘而读别卷；或只口述一次实走见闻"
        "immediate": "吻合项贴上可移纸签，缺证项保留两说，原卷不改"
        "near": "下一位借卷者能区分可用地名与待访路线"
    "整理巡礼路签":
      "places":
        - "悬空神殿"
      "pairs":
        - 1
      "category": "空间与退出"
      "action": "{npc}把两块路签挂到分岔口，请你从栈桥来路试走一遍。"
      "beats":
        "trigger": "{npc}把两块路签挂到分岔口，请你从栈桥来路试走一遍。"
        "objective": "让上行巡礼客与返程客不挤在同一窄段"
        "choice": "试走后换向；谢绝上桥留在山门；或只检查签面辨识度"
        "immediate": "一组路签转向，返程客能看见下山入口，未试走段不开放"
        "near": "下回可独自选短线巡礼，不必绑定护送行程"
    "核对普通货物路单":
      "places":
        - "镖局"
      "pairs":
        - 0
      "category": "调查与核验"
      "action": "{npc}拿着地志站在驮架边，请你把路单上的终点与三包日用品逐一对上。"
      "beats":
        "trigger": "{npc}拿着地志站在驮架边，请你把路单上的终点与三包日用品逐一对上。"
        "objective": "让终点和货包匹配后再交伙计装驮"
        "choice": "逐包核验；不接核验由伙计处理；或先挑出终点未明的一包"
        "immediate": "已确认货包移到对应驮架，疑包留仓不混装"
        "near": "接货驿站按包点收，少一次翻卸重装"
    "给驮架加防磨垫":
      "places":
        - "镖局"
      "pairs":
        - 1
      "category": "照护与修复"
      "action": "{npc}递来旧毡，请你在空驮架的磨痕处试一块软垫。"
      "beats":
        "trigger": "{npc}递来旧毡，请你在空驮架的磨痕处试一块软垫。"
        "objective": "利用余料减轻货箱与驮架相互磨损"
        "choice": "试缝可拆毡垫；不动手只看；或请伙计换一副合尺寸驮架"
        "immediate": "试装货箱后垫片不再滑动；不合尺寸的撤回不勉强使用"
        "near": "下一程可检查磨痕决定留用，缝坏也只损失一块旧毡"
  "customs":
    - "藏书人用可取下的纸签记录疑问，不直接涂改原卷。"
  "pressures":
    "护送终点名称重名":
      "source": "两处驿站使用相同简称"
      "engines":
        - "资源锁定"
        - "信任透支"
      "beats":
        "trigger": "{npc}收到消息：两处驿站使用相同简称。"
        "objective": "向委托人确认终点再出发"
        "choice": "核对地形图，或等待委托人回信"
        "immediate": "终点未明的一包留仓，占用一格驮位；其他货物仍可发走。"
        "near": "委托人回信前双方只能承诺已确认货物，留仓费由重新议定的委托承担。"
      "far_trigger": "若回信到达时原定镖队已经出发"
      "far_consequence": "疑包须改走下一队，委托人可取消该包护送；不会拖住全部驿路。"
      "exits":
        - "将疑包退回委托人并结清已做装卸"
        - "交由镖头另派文书，自己仅交还已核验路单"
      "bindings":
        -
          "activity": "核对普通货物路单"
          "place": "镖局"
          "pair": 0
    "旧志抄本互相矛盾":
      "source": "两份山川志记录了不同的渡口"
      "engines":
        - "旧事追索"
        - "名声保卫"
      "beats":
        "trigger": "{npc}收到消息：两份山川志记录了不同的渡口。"
        "objective": "注明来源并核实可用路线"
        "choice": "询问最近过路者，或暂列未确认"
        "immediate": "争议渡口不进入推荐路线，可信的山段仍可供借阅。"
        "near": "校勘人等待近期过路者见闻，护送者可改用已核验的长路。"
      "far_trigger": "下一季地志抄写前仍无人能复核两处渡口"
      "far_consequence": "新版保留异文并缩小推荐范围，校勘人的详尽名声让位于路线可靠性。"
      "exits":
        - "只保留异文，不参加踏查"
        - "把核验委托转给熟悉该渡口的行脚人，归还原卷"
      "bindings":
        -
          "activity": "校对山川旧志"
          "place": "藏经阁"
          "pair": 0
