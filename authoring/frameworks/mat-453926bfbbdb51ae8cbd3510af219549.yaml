id: "mat-453926bfbbdb51ae8cbd3510af219549"
name: "退休勇者之城"
material:
  eras:
    - "剑与魔法大陆"
  aesthetics:
    - "奇幻迷宫慢生活"
    - "市井烟火"
  rule: "大战结束后，昔日勇者和魔族共同经营城市，旧功勋不自动换来新特权。"
  social_rule: "城务按居民身份表决，旧军阶不用于日常差遣。"
  places:
    冒险者旧会馆:
      details:
        - "圆桌上的旧地图压着两种文字的街名条·午后"
        - "褪色会徽旁挂着今日开门时段·午后"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "会馆前厅大门"
        witnesses:
          - "轮值居民"
          - "归还旧图的探路人"
        affordances:
          - "给旧地图补地名"
          - "结束活动并离开"
        pressure_modifiers:
          - "地图核实年代"
          - "会馆开放时段"
    退役勇者酒馆:
      details:
        - "退役徽章挂在围裙钩上·傍晚"
        - "厨房门外小桌摆着两碗试汤·傍晚"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "酒馆街门"
        witnesses:
          - "酒馆厨师"
          - "等候晚餐的居民"
        affordances:
          - "试做远征锅的新口味"
          - "结束活动并离开"
        pressure_modifiers:
          - "厨师允许的试锅时间"
          - "本地食材用量"
    城墙花园:
      details:
        - "城墙角的香草与观赏花分畦种着·午后"
        - "缓坡入口旁留有观花座位·午后"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "沿缓坡回到街口"
        witnesses:
          - "当值园丁"
          - "散步居民"
        affordances:
          - "给城墙花圃挂牌"
          - "结束活动并离开"
        pressure_modifiers:
          - "花畦间通道"
          - "植物实际长势"
  pairs:
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "直呼其名"
      npc:
        role: "战利品修复师"
        function: "修复战后居民愿意保留的纪念旧物"
        authority: "可决定自己接修物件的可逆补配工序"
        resource: "开放修复台、旧件样品与材料工具"
        limitation: "不能凭旧徽章裁定功勋或物权"
        obligation: "保留旧痕并交还拆下部件"
        exposure: "过度修复会抹去委托人的个人记忆"
        hidden: "—"
      player:
        identity: "退役探路人"
        baseline: "你托修复师补过探路手札的封皮，他保留了你划错的旧路；此后常一起核对街道改名。"
        resources:
          - "多年旅行手札"
          - "仍记得的旧路入口"
        reputation: "你认识旧路，也承认战后有些路已不通"
      relationship_reason: "你托修复师补过探路手札的封皮，他保留了你划错的旧路；此后常一起核对街道改名。"
    -
      family: "语言与传译"
      position: "旧识"
      appellations:
        - "直呼其名"
      npc:
        role: "魔族社区译员"
        function: "解释双语地名并翻译居民各自的说法"
        authority: "可澄清译文与原话差别，不替魔族全体发言"
        resource: "双语地名索引与本人记得的迁居路线"
        limitation: "不能消除战争记忆分歧，也不能以译员身份代投居民票"
        obligation: "把带立场的旧称说明出处，保留本人自称"
        exposure: "错译会让某群居民拒绝再由其转述"
        hidden: "—"
      player:
        identity: "口述史整理者"
        baseline: "你曾请译员保留受访者不愿换掉的旧地名，双方因此约好每次同时听原声与释义。"
        resources:
          - "已获授权的口述提纲"
          - "能联系到的受访人"
        reputation: "你愿意容纳不同说法，不以单一口述判功过"
      relationship_reason: "你曾请译员保留受访者不愿换掉的旧地名，双方因此约好每次同时听原声与释义。"
  activities:
    给旧地图补地名:
      places:
        - "冒险者旧会馆"
      pairs:
        - 0
        - 1
      category: "调查与核验"
      action: "{npc}展开战后地图，把同一条巷的两种称呼并列，邀你指认真实入口。"
      beats:
        trigger: "{npc}展开战后地图，把同一条巷的两种称呼并列，邀你指认真实入口。"
        objective: "让旧地图能被不同族群拿来走路"
        choice: "核对一条巷，或只听两种发音；不清楚就保留未核标记"
        immediate: "一条已改名巷道获得双语对应，废弃入口从散步路线中排除。"
        near: "居民可按新旧两种称呼问路，地图不裁定谁的战争记忆更真。"
    试做远征锅的新口味:
      places:
        - "退役勇者酒馆"
      pairs:
        - 0
        - 1
      category: "照护与修复"
      action: "{npc}征得酒馆厨师同意，把远征锅里一勺汤分成两碗，问哪种本地食材更合口。"
      beats:
        trigger: "{npc}征得酒馆厨师同意，把远征锅里一勺汤分成两碗，问哪种本地食材更合口。"
        objective: "让战时耐放口味适合今日一餐"
        choice: "尝半碗，或帮分餐；不尝可聊当年带锅的经历"
        immediate: "盐味与份量随实际食客调整，习惯不同的人可另加调料。"
        near: "酒馆只试卖一小锅，不把退役者必须吃旧味当作怀旧规矩。"
    给城墙花圃挂牌:
      places:
        - "城墙花园"
      pairs:
        - 0
        - 1
      category: "空间与退出"
      action: "{npc}拿着两种文字的木牌，在城墙花圃外请你试走到香草取用处。"
      beats:
        trigger: "{npc}拿着两种文字的木牌，在城墙花圃外请你试走到香草取用处。"
        objective: "让邻居认得植物并能顺路靠近"
        choice: "摆一块牌或试走短径，也可留在入口看花"
        immediate: "木牌移到枝叶外侧，采摘点与只供观赏区分开，狭处不插新牌。"
        near: "园丁确认后保留摆位，不会因立了牌就允许任意采摘或要求写牌者常来除草。"
  customs:
    - "城里最受欢迎的店铺，往往挂着褪色的战旗和普通人的菜单。"
    - "许多人把战功徽章改成围裙扣，不再按军阶相称。"
    - "每月的旧物日允许只讲故事、不出售物件。"
  pressures:
    旧功勋账册争议:
      source: "会馆收到一份与旧功勋名册不符的证词"
      engines:
        - "旧事追索"
        - "名声保卫"
      beats:
        trigger: "{npc}带来消息：会馆收到一份与旧功勋名册不符的证词。"
        objective: "核对证词并保护未被证实的当事人"
        choice: "约见证人，或先查公开记录"
        immediate: "涉及个人功勋的说明先不挂上地图展，散步路线仍可照常核对。"
        near: "证词按原话核对，译员不替证人补动机，修复师只说明旧物的可见痕迹。"
      far_trigger: "会馆下一次重印功勋说明时"
      far_consequence: "有可核对依据才更正，争议未明则并列注明，现行居民使用权不随旧军功增减。"
      exits:
        - "仅提供自己经历的路段，退出功勋争议"
        - "暂停本人的展出授权，交会馆另找核验者"
      bindings:
        -
          activity: "给旧地图补地名"
          place: "冒险者旧会馆"
          pair: 0
        -
          activity: "给旧地图补地名"
          place: "冒险者旧会馆"
          pair: 1
    会馆用途表决:
      source: "旧会馆拟改作收费会场"
      engines:
        - "组织更迭"
        - "资源锁定"
      beats:
        trigger: "{npc}带来消息：旧会馆拟改作收费会场。"
        objective: "提出居民仍能使用会馆的安排"
        choice: "召集住户，或比较两份改建方案"
        immediate: "收费提案尚未生效，现有开放时段不被提前取消。"
        near: "居民比较保留免费短时段与转去酒馆小桌的方案，旧军阶不能多占一票。"
      far_trigger: "新用途表决生效并开始预约时"
      far_consequence: "保留免费时段可继续小组核图；全收费则自愿组迁出，旧会馆不再是默认聚点。"
      exits:
        - "不参与表决筹备，只使用现行已预约时段"
        - "退回后续会馆预约，改约酒馆自付茶饭"
      bindings:
        -
          activity: "给旧地图补地名"
          place: "冒险者旧会馆"
          pair: 0
        -
          activity: "给旧地图补地名"
          place: "冒险者旧会馆"
          pair: 1
  themes:
    - "战后功勋与平等居民身份"
    - "双语地名下的共同生活"
    - "远征习惯如何变成家常日子"
  technology_boundary: "剑与魔法大陆已结束大战；地图靠步行核路与双语口述校对，厨房和花圃仍需常规劳动，不引入读心证词、时光回溯或自动复原旧物的万能魔法。"
  bridge_status: "not_required"
