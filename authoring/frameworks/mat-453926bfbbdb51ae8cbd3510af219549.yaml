id: mat-453926bfbbdb51ae8cbd3510af219549
name: 退休勇者之城
material:
  eras:
  - 剑与魔法大陆
  aesthetics:
  - 奇幻迷宫慢生活
  - 市井烟火
  rule: 大战结束后，昔日勇者和魔族共同经营城市，旧功勋不自动换来新特权。
  social_rule: 城务按居民身份表决，旧军阶不用于日常差遣。
  places:
    冒险者旧会馆:
      details:
      - 圆桌上的旧地图压着两种文字的街名条·午后
      - 褪色会徽旁挂着今日开门时段·午后
      profile:
        privacy: low
        visibility: high
        exits:
        - 会馆前厅大门
        witnesses:
        - 轮值居民
        - 归还旧图的探路人
        affordances:
        - 给旧地图补地名
        - 结束活动并离开
        pressure_modifiers:
        - 地图核实年代
        - 会馆开放时段
    退役勇者酒馆:
      details:
      - 退役徽章挂在围裙钩上·傍晚
      - 厨房门外小桌摆着两碗试汤·傍晚
      profile:
        privacy: low
        visibility: high
        exits:
        - 酒馆街门
        witnesses:
        - 酒馆厨师
        - 等候晚餐的居民
        affordances:
        - 试做远征锅的新口味
        - 结束活动并离开
        pressure_modifiers:
        - 厨师允许的试锅时间
        - 本地食材用量
    城墙花园:
      details:
      - 城墙角的香草与观赏花分畦种着·午后
      - 缓坡入口旁留有观花座位·午后
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿缓坡回到街口
        witnesses:
        - 当值园丁
        - 散步居民
        affordances:
        - 给城墙花圃挂牌
        - 结束活动并离开
        pressure_modifiers:
        - 花畦间通道
        - 植物实际长势
    石堡偏院客房:
      details:
      - 偏院客房在石堡东侧的马厩旧楼上，窗子开向城墙花园一侧·夜
      - 屋内只有一张床与一口木箱，箱子据说是前一位客居者留下的·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 经偏院侧梯下到石堡后门，出入都记在门房的客居簿上
        witnesses:
        - 石堡门房管事
        - 隔壁轮到值守的侍从
        affordances:
        - 在箱子侧面写下借用者的名字
        - 把带来的旧物摊在床上清点
        pressure_modifiers:
        - 客居簿上还剩的日子
        - 偏院当夜有几间亮着灯
        - 门房是否记得你今晚出过门
    冰裂岩壁旧矿道:
      details:
      - 旧矿道的支撑木在结霜后弯向一侧，壁上留着当年运矿石的浅槽·晨
      - 尽头一段塌在岩壁裂口处，缝隙夜里会透出白气·晨
      profile:
        privacy: low
        visibility: medium
        exits:
        - 沿来路木梯上到岩壁口，塌方段不作出口
        witnesses:
        - 同队下去的探路人
        - 在岩壁口等消息的助手
        affordances:
        - 沿浅槽判断当年矿脉走向
        - 在支撑木上做承重记号
        pressure_modifiers:
        - 支撑木结霜的厚度
        - 裂缝透出白气的时段
        - 队里带的火把剩余支数
    领主石堡契约厅:
      details:
      - 契约厅的长案上同时摊着家族旧契与城务发下的新券·午
      - 厅角立着一只带锁的旧钱箱，钥匙按例由在场两人分别执掌·午
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 交还当日的两把钥匙，从石堡前厅离开
        witnesses:
        - 石堡书记员
        - 持另一把钥匙的族人
        affordances:
        - 把旧契与新券逐条对读
        - 当着两人核点箱内封存的旧物
        pressure_modifiers:
        - 旧契上写的还债年限
        - 当日到场的族人数量
        - 书记员记下的争议条文
    炉火旁的棋盘小厅:
      details:
      - 棋盘小厅隔着石堡厨房一道短廊，炉膛的余温一直维持到夜里·黄昏
      - 棋盘与两盒棋子放在窗下的矮几上，几边留着一盏续灯的油·黄昏
      profile:
        privacy: low
        visibility: medium
        exits:
        - 沿短廊回到石堡客堂，散局各自回去
        witnesses:
        - 添炉的厨房帮工
        - 经过短廊的旧日同行
        affordances:
        - 留一局棋等对方来收
        - 在几面上摆出被让的那半子
        pressure_modifiers:
        - 炉火还能维持的时辰
        - 对弈时是否有人在旁边看着
        - 两人各自还挂着的班次
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 战利品修复师
      function: 修复战后居民愿意保留的纪念旧物
      authority: 可决定自己接修物件的可逆补配工序
      resource: 开放修复台、旧件样品与材料工具
      limitation: 不能凭旧徽章裁定功勋或物权
      obligation: 保留旧痕并交还拆下部件
      exposure: 过度修复会抹去委托人的个人记忆
      hidden: —
    player:
      identity: 退役探路人
      baseline: 你托修复师补过探路手札的封皮，他保留了你划错的旧路；此后常一起核对街道改名。
      resources:
      - 多年旅行手札
      - 仍记得的旧路入口
      reputation: 你认识旧路，也承认战后有些路已不通
    relationship_reason: 你托修复师补过探路手札的封皮，他保留了你划错的旧路；此后常一起核对街道改名。
  - family: 语言与传译
    position: 旧识
    appellations:
    - 直呼其名
    npc:
      role: 魔族社区译员
      function: 解释双语地名并翻译居民各自的说法
      authority: 可澄清译文与原话差别，不替魔族全体发言
      resource: 双语地名索引与本人记得的迁居路线
      limitation: 不能消除战争记忆分歧，也不能以译员身份代投居民票
      obligation: 把带立场的旧称说明出处，保留本人自称
      exposure: 错译会让某群居民拒绝再由其转述
      hidden: —
    player:
      identity: 口述史整理者
      baseline: 你曾请译员保留受访者不愿换掉的旧地名，双方因此约好每次同时听原声与释义。
      resources:
      - 已获授权的口述提纲
      - 能联系到的受访人
      reputation: 你愿意容纳不同说法，不以单一口述判功过
    relationship_reason: 你曾请译员保留受访者不愿换掉的旧地名，双方因此约好每次同时听原声与释义。
  - family: 家族与继承
    position: 共同遗产继承人
    appellations:
    - 少爷
    npc:
      role: 石堡旧契执掌人
      function: 替客居者与族人保管旧契、在契约厅逐条对读并说明偿还年限
      authority: 可暂不开旧钱箱，决定本日是否当面核点封存的旧物
      resource: 家族旧契、城务新券与分执的两把钥匙之一
      limitation: 不能凭旧军阶裁断功勋或物权，也不能单独开箱
      obligation: 对读时把两种文书的出入逐字指出，钥匙当日归还石堡
      exposure: 读错一条会让被废的那一支拿着旧契再上一次门
      hidden: —
    player:
      identity: 退役的黑夜佣兵统帅
      baseline: 你打完那场仗就解了队，回城时才发现旧军衔在石堡的账上不值一行字。
      resources:
      - 自己那份旧契抄件
      - 还认得的几条进城旧路
      reputation: 你按居民身份办事，不拿当年的战功换院子
    relationship_reason: 你带着旧契抄件到石堡对账，执掌人照着箱子上的划痕说出你名下的那几件旧物；此后每次偿期将近，两个人都要就着同一盏灯逐条读。
  activities:
    给旧地图补地名:
      places:
      - 冒险者旧会馆
      pairs:
      - 0
      - 1
      category: 调查与核验
      action: '{npc}展开战后地图，把同一条巷的两种称呼并列，邀你指认真实入口。'
      beats:
        trigger: '{npc}展开战后地图，把同一条巷的两种称呼并列，邀你指认真实入口。'
        objective: 让旧地图能被不同族群拿来走路
        choice: 核对一条巷，或只听两种发音；不清楚就保留未核标记
        immediate: 一条已改名巷道获得双语对应，废弃入口从散步路线中排除。
        near: 居民可按新旧两种称呼问路，地图不裁定谁的战争记忆更真。
    试做远征锅的新口味:
      places:
      - 退役勇者酒馆
      pairs:
      - 0
      - 1
      category: 照护与修复
      action: '{npc}征得酒馆厨师同意，把远征锅里一勺汤分成两碗，问哪种本地食材更合口。'
      beats:
        trigger: '{npc}征得酒馆厨师同意，把远征锅里一勺汤分成两碗，问哪种本地食材更合口。'
        objective: 让战时耐放口味适合今日一餐
        choice: 尝半碗，或帮分餐；不尝可聊当年带锅的经历
        immediate: 盐味与份量随实际食客调整，习惯不同的人可另加调料。
        near: 酒馆只试卖一小锅，不把退役者必须吃旧味当作怀旧规矩。
    给城墙花圃挂牌:
      places:
      - 城墙花园
      pairs:
      - 0
      - 1
      category: 空间与退出
      action: '{npc}拿着两种文字的木牌，在城墙花圃外请你试走到香草取用处。'
      beats:
        trigger: '{npc}拿着两种文字的木牌，在城墙花圃外请你试走到香草取用处。'
        objective: 让邻居认得植物并能顺路靠近
        choice: 摆一块牌或试走短径，也可留在入口看花
        immediate: 木牌移到枝叶外侧，采摘点与只供观赏区分开，狭处不插新牌。
        near: 园丁确认后保留摆位，不会因立了牌就允许任意采摘或要求写牌者常来除草。
    替对方收留下那一局:
      places:
      - 炉火旁的棋盘小厅
      pairs:
      - 2
      category: 日常接触
      action: '{npc}把让出的半子留在几面上，问你这一局要不要就这么收着。'
      beats:
        trigger: '{npc}把让出的半子留在几面上，问你这一局要不要就这么收着。'
        objective: 把这一局的让法说成两个人之间的规矩
        choice: 接着下完；或把半子推回去重开，也可以留着下次再收
        immediate: 让出去的那半子按说定的摆法留在一角，输赢当夜不定。
        near: 往后照这个让法开局，谁提旧战绩都不算理由，输的一方按例去添一回炉。
    教她把护腕扣上:
      places:
      - 炉火旁的棋盘小厅
      pairs:
      - 2
      category: 照护与修复
      action: '{npc}把一只旧护腕搁在几面上，让你教她怎么自己扣紧而不夹到腕骨。'
      beats:
        trigger: '{npc}把一只旧护腕搁在几面上，让你教她怎么自己扣紧而不夹到腕骨。'
        objective: 让她能一个人把护腕扣稳并自己解开
        choice: 上手替她扣一遍再让她自己来；或只在旁边说步骤，也可以先扣自己的给她看
        immediate: 扣好的护腕她自己解一次确认不夹手，扣不成的那副放回几上。
        near: 往后出门她自己扣护腕，教过的那一遍算成两个人共有的手艺，不算谁欠谁一个人情。
    在冰裂矿道清点旧矿:
      places:
      - 冰裂岩壁旧矿道
      pairs:
      - 2
      category: 调查与核验
      action: '{npc}用火把照着支撑木上的浅槽，让你沿槽子认一认当年矿脉往哪走。'
      beats:
        trigger: '{npc}用火把照着支撑木上的浅槽，让你沿槽子认一认当年矿脉往哪走。'
        objective: 认出一段还能立住人的矿道，不往塌方那头试探
        choice: 沿浅槽往前认一段；或只在入口做承重记号，也可以原地记完就上来
        immediate: 认过的路段做上记号，塌方那头照旧封着，火把按支数算着用。
        near: 做过记号的一段下次可以带工具再来，没做记号的地方不入任何地图。
    在契约厅对读旧契:
      places:
      - 领主石堡契约厅
      pairs:
      - 2
      category: 信息交换
      action: '{npc}把家族旧契与城务新券并排摊开，请你把还债那一条逐字对读一遍。'
      beats:
        trigger: '{npc}把家族旧契与城务新券并排摊开，请你把还债那一条逐字对读一遍。'
        objective: 找出旧契与新券在还债年限上的出入并写清出处
        choice: 逐字对读一遍；或只抄有出入的那几句，也可以请书记员另约一次当面对读
        immediate: 有出入的条文各自标出来源，旧钱箱当夜不开，封存的旧物不动。
        near: 对出的出入按原话记进当日的书记簿；约下次的人按原定年限办事，不因对读而当夜被索债。
    在偏院客房清点旧物:
      places:
      - 石堡偏院客房
      pairs:
      - 2
      category: 空间与退出
      action: '{npc}把木箱里留下的旧物摊在床上，问哪些是你自己带来的、哪些不是。'
      beats:
        trigger: '{npc}把木箱里留下的旧物摊在床上，问哪些是你自己带来的、哪些不是。'
        objective: 把不属于自己的旧物单独封好，等门房登记后再处置
        choice: 当场分成两堆；或只清点带来的那几件，也可以原样放回箱子等门房来点
        immediate: 不属于自己的几件单独封在一角，门房当夜登记，谁都不带走。
        near: 客居簿上照原定日子记着，封好的旧物由门房保管到有人认领为止，借箱子的人不留话。
  customs:
  - 城里最受欢迎的店铺，往往挂着褪色的战旗和普通人的菜单。
  - 许多人把战功徽章改成围裙扣，不再按军阶相称。
  - 每月的旧物日允许只讲故事、不出售物件。
  pressures:
    旧功勋账册争议:
      source: 会馆收到一份与旧功勋名册不符的证词
      engines:
      - 旧事追索
      - 名声保卫
      beats:
        trigger: '{npc}带来消息：会馆收到一份与旧功勋名册不符的证词。'
        objective: 核对证词并保护未被证实的当事人
        choice: 约见证人，或先查公开记录
        immediate: 涉及个人功勋的说明先不挂上地图展，散步路线仍可照常核对。
        near: 证词按原话核对，译员不替证人补动机，修复师只说明旧物的可见痕迹。
      far_trigger: 会馆下一次重印功勋说明时
      far_consequence: 有可核对依据才更正，争议未明则并列注明，现行居民使用权不随旧军功增减。
      exits:
      - 仅提供自己经历的路段，退出功勋争议
      - 暂停本人的展出授权，交会馆另找核验者
      bindings:
      - activity: 给旧地图补地名
        place: 冒险者旧会馆
        pair: 0
      - activity: 给旧地图补地名
        place: 冒险者旧会馆
        pair: 1
    会馆用途表决:
      source: 旧会馆拟改作收费会场
      engines:
      - 组织更迭
      - 资源锁定
      beats:
        trigger: '{npc}带来消息：旧会馆拟改作收费会场。'
        objective: 提出居民仍能使用会馆的安排
        choice: 召集住户，或比较两份改建方案
        immediate: 收费提案尚未生效，现有开放时段不被提前取消。
        near: 居民比较保留免费短时段与转去酒馆小桌的方案，旧军阶不能多占一票。
      far_trigger: 新用途表决生效并开始预约时
      far_consequence: 保留免费时段可继续小组核图；全收费则自愿组迁出，旧会馆不再是默认聚点。
      exits:
      - 不参与表决筹备，只使用现行已预约时段
      - 退回后续会馆预约，改约酒馆自付茶饭
      bindings:
      - activity: 给旧地图补地名
        place: 冒险者旧会馆
        pair: 0
      - activity: 给旧地图补地名
        place: 冒险者旧会馆
        pair: 1
    旧契的欠额滚到新券上:
      source: 家族旧契上的欠额按复利滚到本轮偿还年，城务新券只认当期数额，差额要在石堡当面谈。
      engines:
      - 债务压力
      - 遗产之争
      beats:
        trigger: '{npc}把旧契与新券并排推开，指着两处数字让你先认哪一个是当期的。'
        objective: 把当期该还的与旧账滚出来的部分分开写清
        choice: 照新券先还当期；或要求把滚出的差额另立一纸缓期，也可以只认自己签过字的那一笔
        immediate: 旧钱箱当夜不开，认下的那一笔写进书记簿，其余挂账不计息。
        near: 按书记簿约定的那几日还，滚出来的差额另议；不认的部分下次对读时再摊开。
      far_trigger: 下一个偿还年到而差额仍未议定时
      far_consequence: 按期还当期的人保住石堡客居的床位与旧物处置权；拒不认账的人被移出客居簿，只能按城务外来户的路子另租住处。
      bindings:
      - activity: 在契约厅对读旧契
        place: 领主石堡契约厅
        pair: 2
      - activity: 试做远征锅的新口味
        place: 退役勇者酒馆
        pair: 0
      exits:
      - 退出对读，把旧契抄件留在书记员处
      - 让出偏院客房，改在城内自租住处
    废嫡的人回来了:
      source: 被废的那一支回到石堡做客，家族把继承顺序重新摆到台面上，客居者的去留也跟着要重议。
      engines:
      - 遗产之争
      - 组织更迭
      beats:
        trigger: '{npc}带来消息：被废的那一支已经进了石堡大门，明日要在契约厅重排顺序。'
        objective: 在顺序重排之前把自己手上那份凭据理清
        choice: 当面把凭据摊开；或先只交出抄件，也可以暂不表态只守着现住的屋子
        immediate: 当晚石堡的名册不动，客居簿照旧记着原定的日子。
        near: 重排期间偏院的屋子谁也不被清出去，等到书记簿落定再论去留。
      far_trigger: 家族名册正式重排公示之后
      far_consequence: 早有抄件的人可以照旧客居或另议住处；空手站着的人只能按新任当家的安排搬去偏屋，旧物处置也跟着转手。
      bindings:
      - activity: 在契约厅对读旧契
        place: 领主石堡契约厅
        pair: 2
      - activity: 在偏院客房清点旧物
        place: 石堡偏院客房
        pair: 2
      exits:
      - 交出客居的屋子，进城另找住处
      - 只留下自己的旧物，退出继承顺序的争议
    石堡里那间屋子只剩一夜:
      source: 客居簿上写的日子到头，石堡不再自动续住，而带回来的旧物还没清点完。
      engines:
      - 迁居倒计时
      - 资源锁定
      beats:
        trigger: '{npc}把客居簿翻到当页，指给你看这一栏写的是最后一天。'
        objective: 在天亮前把要带的与要留的分开，让每一件都有个去处
        choice: 当夜清点装箱；或把留下的部分交门房登记，也可以当面求宽限几日再议
        immediate: 当夜分好的两堆各写一张清单，偏院的屋子在天亮前仍归你使用。
        near: 门房按清单放行；求了宽限的按新定的日子续住，多出来的日子从下月的修缮活计里扣。
      far_trigger: 下一季客居簿重新复核时
      far_consequence: 按清单交代清楚的人可以再申请偏院的屋子；没交代的清退后旧物并入公库，认领时须两人作证。
      bindings:
      - activity: 在偏院客房清点旧物
        place: 石堡偏院客房
        pair: 2
      - activity: 给城墙花圃挂牌
        place: 城墙花园
        pair: 1
      exits:
      - 天亮前清空偏院客房，把清单交门房
      - 留下未清的旧物，先搬进城内的短租房
    矿道里那只没人认的手套:
      source: 矿道塌方那头透出白气的缝里卡着一只旧手套，与当年留在石堡名册上的人对得上。
      engines:
      - 旧事追索
      - 共同秘密
      beats:
        trigger: '{npc}从矿道入口升上来，把手套放在棋盘几面上，问你认不认得这是谁的。'
        objective: 在往下走之前决定这件事说给谁听
        choice: 先只告诉同行的人；或把东西交石堡书记员登记，也可以带回名册去逐个对
        immediate: 手套当夜收在棋盘几下的匣里，塌方那头照旧不去动。
        near: 认得出来的人自己去名册上核，塌方段待石堡派工再开，两人照常下棋不再提这件事。
      far_trigger: 石堡下一次派工清理矿道塌方时
      far_consequence: 先前登记过手套的人可以跟着下矿道认人；私下带走的人会被名册上那一支追问来路，往后石堡的活计不再派给他。
      bindings:
      - activity: 在冰裂矿道清点旧矿
        place: 冰裂岩壁旧矿道
        pair: 2
      - activity: 给城墙花圃挂牌
        place: 城墙花园
        pair: 0
      exits:
      - 把手套留在原地，退出矿道的清理
      - 只交出自己记下的支撑木记号，不再下去
    那个名字如今叫不出口:
      source: 两个人在棋盘几前坐了一夜，谁都没把当年那个称呼叫出声，而城里已经按居民身份重新相称。
      engines:
      - 旧情重逢
      - 名分悬置
      beats:
        trigger: '{npc}收棋子时停了一下，问你往后是照名字叫，还是照城里的规矩称。'
        objective: 在散局前把两个人的称呼定下来
        choice: 当面把名字叫出来；或照城务的规矩相称，也可以什么都不定就这么散局
        immediate: 当夜照说定的那种叫法收局，几上的灯由后离开的人熄。
        near: 往后在城里碰上按那一种称呼打招呼；没定下来的照居民身份相称，旧军阶的词谁也不提。
      far_trigger: 城里下一次居民名册更新时
      far_consequence: 把称呼定下来的两个人按各自的写法登记；没定的按城区分册，往后碰面用哪一句招呼由先到的人决定。
      bindings:
      - activity: 替对方收留下那一局
        place: 炉火旁的棋盘小厅
        pair: 2
      - activity: 教她把护腕扣上
        place: 炉火旁的棋盘小厅
        pair: 2
      - activity: 试做远征锅的新口味
        place: 退役勇者酒馆
        pair: 1
      exits:
      - 散局后各自回去，不再约下一次
      - 把棋子留给对方收，改日再谈
  themes:
