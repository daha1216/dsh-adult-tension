id: "mat-4851892aeeda5d819ed8ec1123084cef"
name: "废墟复兴小镇"
material:
  eras:
    - "废土末世"
  aesthetics:
    - "市井烟火"
    - "暖色生活流"
  rule: "灾难已经过去，居民以修复、交换和共同维护代替旧时代的紧急管制。"
  social_rule: "紧急管制已经结束，公共重建由居民协商，旧物可以自愿捐出或带回。"
  places:
    旧影院工地:
      details:
        - "已修好的影院门厅摆着断电招牌小样·日间"
        - "通往未验收影厅的门仍封着·日间"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "门厅大门回到开放街面"
        witnesses:
          - "当值修复工"
          - "在门厅看小样的居民"
        affordances:
          - "试亮旧影院的招牌"
          - "结束活动并离开"
        pressure_modifiers:
          - "回收件尺寸"
          - "独立测试电源余量"
    复兴集市:
      details:
        - "交换长桌分出只展、可借与可换区域·午后"
        - "来历卡旁放着可随主人带回的旧物·午后"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "集市主通道与地面街口"
        witnesses:
          - "邻摊摊主"
          - "自愿换物的居民"
        affordances:
          - "为旧物写一张来历卡"
          - "结束活动并离开"
        pressure_modifiers:
          - "主人愿意转让的范围"
          - "闭市时间"
    蓄水塔平台:
      details:
        - "已开放观景平台的护栏内能看见新街区·日间"
        - "楼梯入口另留一处地面看图板·日间"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "沿已开放楼梯返回地面"
          - "不登高者从地面看图板直接离开"
        witnesses:
          - "平台值守员"
          - "散步居民"
        affordances:
          - "给重建街区画一张新图"
          - "结束活动并离开"
        pressure_modifiers:
          - "平台开放状态"
          - "可见范围与楼梯体力需求"
  pairs:
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "直呼其名"
      npc:
        role: "公共建筑修复师"
        function: "修复公共建筑中已明确范围的可用部件"
        authority: "安排本人负责的门厅小件修复并停止不可靠试装"
        resource: "损坏测绘图、回收件量具与独立测试电源"
        limitation: "不能仅凭招牌试亮宣布结构验收或征用私人零件"
        obligation: "区分展示试装、日常使用与待验收区域"
        exposure: "误把试件当成可交付件会让居民再次失去公共空间"
        hidden: "—"
      player:
        identity: "老放映设备爱好者"
        baseline: "你提供的旧零件曾让门厅一盏灯亮起来，修复师只用了你同意捐出的那一件，这次仍先问用途。"
        resources:
          - "保存下来的放映零件"
          - "对原影院字形和设备的记忆"
        reputation: "你愿意拿出备件，不把个人收藏一概捐作公用"
      relationship_reason: "你提供的旧零件曾让门厅一盏灯亮起来，修复师只用了你同意捐出的那一件，这次仍先问用途。"
    -
      family: "艺术与传播"
      position: "旧识"
      appellations:
        - "直呼其名"
      npc:
        role: "社区档案整理员"
        function: "整理居民自愿保留的重建故事与物件来历"
        authority: "可以整理获准副本，不决定物件拆用或转让"
        resource: "带来源标签的档案柜与只展物件借条"
        limitation: "不能以公共记忆为由扣留原物，也无施工签字权"
        obligation: "将借出、捐出和口述许可分开询问"
        exposure: "错收原物会使摊主拒绝再向档案室提供线索"
        hidden: "—"
      player:
        identity: "旧物交换摊主"
        baseline: "你曾把不愿卖的一件旧物借给档案员短展，对方按时归还；如今再谈另一件是否适合交换。"
        resources:
          - "自己准备交换或只展的旧物"
          - "熟悉集市借用区的关系"
        reputation: "你肯说旧物来历，也能明确哪些只借不卖"
      relationship_reason: "你曾把不愿卖的一件旧物借给档案员短展，对方按时归还；如今再谈另一件是否适合交换。"
  activities:
    试亮旧影院的招牌:
      places:
        - "旧影院工地"
      pairs:
        - 0
      category: "照护与修复"
      action: "{npc}把断电的旧招牌小样放到门厅桌上，请你挑一片尺寸合适的回收灯片。"
      beats:
        trigger: "{npc}把断电的旧招牌小样放到门厅桌上，请你挑一片尺寸合适的回收灯片。"
        objective: "让一个旧字在独立小电源上重新亮起"
        choice: "试装灯片，或只选保留的旧字形；不碰器材可坐着看试亮"
        immediate: "灯片由修复师检查固定后短时试亮，只证明小样可用，不宣布影院竣工。"
        near: "可用件收回专用盒等后续安装，住户今天看过亮字就能离开，不默认加入施工队。"
    为旧物写一张来历卡:
      places:
        - "复兴集市"
      pairs:
        - 1
      category: "信息交换"
      action: "{npc}拿着空白来历卡，请你先说这件旧物愿交换、只借出还是只讲故事。"
      beats:
        trigger: "{npc}拿着空白来历卡，请你先说这件旧物愿交换、只借出还是只讲故事。"
        objective: "让别人了解物件用途与主人愿意给出的范围"
        choice: "讲用途并写一行，或只展示不留卡；临时不想换也可带回"
        immediate: "可借、可换与只展的旧物分开，写卡不会自动改变所有权。"
        near: "有意交换者另谈具体物件，档案员只留获准副本，原物由主人决定去向。"
    给重建街区画一张新图:
      places:
        - "蓄水塔平台"
      pairs:
        - 0
        - 1
      category: "空间与退出"
      action: "{npc}在已开放的蓄水塔观景平台摊开新图，邀你从护栏内找一条回集市的路。"
      beats:
        trigger: "{npc}在已开放的蓄水塔观景平台摊开新图，邀你从护栏内找一条回集市的路。"
        objective: "把重建地图化成可选择的散步路线"
        choice: "从平台辨认或只看图，也可不登高，在地面入口会合"
        immediate: "断头街和开放路段被分开，想离开的人沿已开放楼梯返回，不跨工地抄近路。"
        near: "实走过的路段才补入导览；看不清处保持待查，地图不充施工验收图。"
  customs:
    - "每一面新砌的墙都嵌着一件旧物，镇民把重建当作共同记忆。"
    - "修复好的公共建筑会留一小块旧墙供人辨认。"
    - "集市有不标价的借用区，物件按约归还即可。"
  pressures:
    旧街保留方案讨论:
      source: "重建方案拟拆除居民仍在使用的旧街"
      engines:
        - "组织更迭"
        - "旧事追索"
      beats:
        trigger: "{npc}带来消息：重建方案拟拆除居民仍在使用的旧街。"
        objective: "比较修复成本与居民使用需求"
        choice: "整理使用记录，或提出分区保留方案"
        immediate: "拆除提案还未执行，仍在用的旧街照常通行，不把居民使用说成妨碍重建。"
        near: "从平台与地面短线比对实际用途，提出分区修复或绕行替代，结构可行性交有资质的工队判断。"
      far_trigger: "下一期施工范围批准并开工前"
      far_consequence: "保留段需承担持续维护，拆除段则须先接通替代路；并非记录越多就一定整街保留。"
      exits:
        - "仅提供自家使用的一段路线后离开"
        - "不参与方案争论，选择已确认的替代通道"
      bindings:
        -
          activity: "给重建街区画一张新图"
          place: "蓄水塔平台"
          pair: 0
        -
          activity: "给重建街区画一张新图"
          place: "蓄水塔平台"
          pair: 1
    公共材料分配争议:
      source: "两项公共工程申请同一批回收材料"
      engines:
        - "资源锁定"
        - "信任透支"
      beats:
        trigger: "{npc}带来消息：两项公共工程申请同一批回收材料。"
        objective: "排出透明且可调整的施工顺序"
        choice: "核算各自用量，或邀请居民共同协商"
        immediate: "同批回收料先不拆分加工，影院小样可继续看，正式装配顺序待定。"
        near: "核对两项工程的实需与可替代件，愿意后做的一方得到明确下一批材料条件，而非空口优先。"
      far_trigger: "下一批回收料入库并安排施工时"
      far_consequence: "先做工程恢复一项服务，后做工程承担实际等待；未兑现后续份额会使下次共同收料失败。"
      exits:
        - "撤回本人尚未交出的私人零件"
        - "交还公用工具后退出施工协商，不承担持续筹料"
      bindings:
        -
          activity: "试亮旧影院的招牌"
          place: "旧影院工地"
          pair: 0
  themes:
    - "重建中的实用与记忆"
    - "旧物交换不等于征用"
    - "公共工程先后顺序的代价"
  technology_boundary: "废土灾后已恢复协商生活，依靠回收零件、有限电源、纸图与步行测绘；旧影院仅开放已修门厅，未验收结构不能靠修复招牌便视为可用，无万能物资复制。"
  bridge_status: "not_required"
