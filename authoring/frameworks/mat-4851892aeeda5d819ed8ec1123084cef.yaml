id: "mat-4851892aeeda5d819ed8ec1123084cef"
name: "废墟复兴小镇"
material:
  eras:
    - "废土末世"
  aesthetics:
    - "市井烟火"
    - "暖色生活流"
    - "末日求生纪实"
    - "感染隔离区"
  rule: "灾难已经过去，居民以修复、交换和共同维护代替旧时代的紧急管制。"
  social_rule: "紧急管制已经结束，公共重建由居民协商，旧物可以自愿捐出或带回。"
  places:
    旧影院工地:
      details:
        - "已修好的影院门厅摆着断电招牌小样·日间"
        - "通往未验收影厅的门仍封着·日间"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "门厅大门回到开放街面"
        witnesses:
          - "当值修复工"
          - "在门厅看小样的居民"
        affordances:
          - "试亮旧影院的招牌"
          - "结束活动并离开"
        pressure_modifiers:
          - "回收件尺寸"
          - "独立测试电源余量"
    复兴集市:
      details:
        - "交换长桌分出只展、可借与可换区域·午后"
        - "来历卡旁放着可随主人带回的旧物·午后"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "集市主通道与地面街口"
        witnesses:
          - "邻摊摊主"
          - "自愿换物的居民"
        affordances:
          - "为旧物写一张来历卡"
          - "结束活动并离开"
        pressure_modifiers:
          - "主人愿意转让的范围"
          - "闭市时间"
    蓄水塔平台:
      details:
        - "已开放观景平台的护栏内能看见新街区·日间"
        - "楼梯入口另留一处地面看图板·日间"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "沿已开放楼梯返回地面"
          - "不登高者从地面看图板直接离开"
        witnesses:
          - "平台值守员"
          - "散步居民"
        affordances:
          - "给重建街区画一张新图"
          - "结束活动并离开"
        pressure_modifiers:
          - "平台开放状态"
          - "可见范围与楼梯体力需求"
    废弃搜刮药房:
      details:
        - "重建后重新启用的旧药房柜台摆着分格药屉和手写价签·午后"
        - "后间换了新锁，但仍留着上一轮清空的封条痕迹·午后"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "从侧门经已清障的后巷回集市主通道"
        witnesses:
          - "当值配药人与零星来换药的居民"
        affordances:
          - "按存量分装常用药"
          - "当面清点药的来路"
        pressure_modifiers:
          - "药的存量与凭券限购的数"
          - "后间封条是否被人动过"
  pairs:
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "直呼其名"
      npc:
        role: "公共建筑修复师"
        function: "修复公共建筑中已明确范围的可用部件"
        authority: "安排本人负责的门厅小件修复并停止不可靠试装"
        resource: "损坏测绘图、回收件量具与独立测试电源"
        limitation: "不能仅凭招牌试亮宣布结构验收或征用私人零件"
        obligation: "区分展示试装、日常使用与待验收区域"
        exposure: "误把试件当成可交付件会让居民再次失去公共空间"
        hidden: "—"
      player:
        identity: "老放映设备爱好者"
        baseline: "你提供的旧零件曾让门厅一盏灯亮起来，修复师只用了你同意捐出的那一件，这次仍先问用途。"
        resources:
          - "保存下来的放映零件"
          - "对原影院字形和设备的记忆"
        reputation: "你愿意拿出备件，不把个人收藏一概捐作公用"
      relationship_reason: "你提供的旧零件曾让门厅一盏灯亮起来，修复师只用了你同意捐出的那一件，这次仍先问用途。"
    -
      family: "艺术与传播"
      position: "旧识"
      appellations:
        - "直呼其名"
      npc:
        role: "社区档案整理员"
        function: "整理居民自愿保留的重建故事与物件来历"
        authority: "可以整理获准副本，不决定物件拆用或转让"
        resource: "带来源标签的档案柜与只展物件借条"
        limitation: "不能以公共记忆为由扣留原物，也无施工签字权"
        obligation: "将借出、捐出和口述许可分开询问"
        exposure: "错收原物会使摊主拒绝再向档案室提供线索"
        hidden: "—"
      player:
        identity: "旧物交换摊主"
        baseline: "你曾把不愿卖的一件旧物借给档案员短展，对方按时归还；如今再谈另一件是否适合交换。"
        resources:
          - "自己准备交换或只展的旧物"
          - "熟悉集市借用区的关系"
        reputation: "你肯说旧物来历，也能明确哪些只借不卖"
      relationship_reason: "你曾把不愿卖的一件旧物借给档案员短展，对方按时归还；如今再谈另一件是否适合交换。"
    -
      family: "地下与灰色地带"
      position: "黑市药贩"
      appellations:
        - "掌柜"
      npc:
        role: "重建镇配药人"
        function: "按存量分装常用药并登记每一剂的来路"
        authority: "可拒发来路不明的药，也能停掉本人负责的柜台"
        resource: "分格药屉、手写价签与配药登记册"
        limitation: "不掌握复产条件，也不能替镇里批准用药资格"
        obligation: "把自留和上缴的部分分开记，价签与实际份量对得上"
        exposure: "一旦被查出私留成色好的药，整间柜台都会被封"
        hidden: "—"
      player:
        identity: "旧物交换摊主"
        baseline: "你把收来的一批旧药瓶当旧物转给了配药人，他用得上，却坚持先问清这批瓶子是从哪条街收来的"
        resources:
          - "自己准备交换或只展的旧物"
          - "熟悉集市借用区的关系"
        reputation: "你肯说旧物来历，也能明确哪些只借不卖"
      relationship_reason: "你把收来的一批旧药瓶当旧物转给了配药人，他用得上，却坚持先问清这批瓶子是从哪条街收来的"
  activities:
    试亮旧影院的招牌:
      places:
        - "旧影院工地"
      pairs:
        - 0
      category: "照护与修复"
      action: "{npc}把断电的旧招牌小样放到门厅桌上，请你挑一片尺寸合适的回收灯片。"
      beats:
        trigger: "{npc}把断电的旧招牌小样放到门厅桌上，请你挑一片尺寸合适的回收灯片。"
        objective: "让一个旧字在独立小电源上重新亮起"
        choice: "试装灯片，或只选保留的旧字形；不碰器材可坐着看试亮"
        immediate: "灯片由修复师检查固定后短时试亮，只证明小样可用，不宣布影院竣工。"
        near: "可用件收回专用盒等后续安装，住户今天看过亮字就能离开，不默认加入施工队。"
    为旧物写一张来历卡:
      places:
        - "复兴集市"
      pairs:
        - 1
      category: "信息交换"
      action: "{npc}拿着空白来历卡，请你先说这件旧物愿交换、只借出还是只讲故事。"
      beats:
        trigger: "{npc}拿着空白来历卡，请你先说这件旧物愿交换、只借出还是只讲故事。"
        objective: "让别人了解物件用途与主人愿意给出的范围"
        choice: "讲用途并写一行，或只展示不留卡；临时不想换也可带回"
        immediate: "可借、可换与只展的旧物分开，写卡不会自动改变所有权。"
        near: "有意交换者另谈具体物件，档案员只留获准副本，原物由主人决定去向。"
    给重建街区画一张新图:
      places:
        - "蓄水塔平台"
      pairs:
        - 0
        - 1
      category: "空间与退出"
      action: "{npc}在已开放的蓄水塔观景平台摊开新图，邀你从护栏内找一条回集市的路。"
      beats:
        trigger: "{npc}在已开放的蓄水塔观景平台摊开新图，邀你从护栏内找一条回集市的路。"
        objective: "把重建地图化成可选择的散步路线"
        choice: "从平台辨认或只看图，也可不登高，在地面入口会合"
        immediate: "断头街和开放路段被分开，想离开的人沿已开放楼梯返回，不跨工地抄近路。"
        near: "实走过的路段才补入导览；看不清处保持待查，地图不充施工验收图。"
    按存量分装常用药:
      places:
        - "废弃搜刮药房"
      pairs:
        - 2
      category: "照护与修复"
      action: "{npc}在分格药屉前把两堆药并排放好，请你先挑出今天该先发出去的那一堆。"
      beats:
        trigger: "{npc}在分格药屉前把两堆药并排放好，请你先挑出今天该先发出去的那一堆。"
        objective: "让有限的存量按症状而不是按交情分下去"
        choice: "按登记册排序；把成色好的留着以备重伤；或如实说明只剩这么多"
        immediate: "先发的这堆当面记上册子，剩下的份量数清后一起封存，不私留一格。"
        near: "下批药到前仍按册发，等不及的可以登记排队，不承诺没有的储备。"
  customs:
    - "每一面新砌的墙都嵌着一件旧物，镇民把重建当作共同记忆。"
    - "修复好的公共建筑会留一小块旧墙供人辨认。"
    - "集市有不标价的借用区，物件按约归还即可。"
  pressures:
    旧街保留方案讨论:
      source: "重建方案拟拆除居民仍在使用的旧街"
      engines:
        - "组织更迭"
        - "旧事追索"
      beats:
        trigger: "{npc}带来消息：重建方案拟拆除居民仍在使用的旧街。"
        objective: "比较修复成本与居民使用需求"
        choice: "整理使用记录，或提出分区保留方案"
        immediate: "拆除提案还未执行，仍在用的旧街照常通行，不把居民使用说成妨碍重建。"
        near: "从平台与地面短线比对实际用途，提出分区修复或绕行替代，结构可行性交有资质的工队判断。"
      far_trigger: "下一期施工范围批准并开工前"
      far_consequence: "保留段需承担持续维护，拆除段则须先接通替代路；并非记录越多就一定整街保留。"
      exits:
        - "仅提供自家使用的一段路线后离开"
        - "不参与方案争论，选择已确认的替代通道"
      bindings:
        -
          activity: "给重建街区画一张新图"
          place: "蓄水塔平台"
          pair: 0
        -
          activity: "给重建街区画一张新图"
          place: "蓄水塔平台"
          pair: 1
    公共材料分配争议:
      source: "两项公共工程申请同一批回收材料"
      engines:
        - "资源锁定"
        - "信任透支"
      beats:
        trigger: "{npc}带来消息：两项公共工程申请同一批回收材料。"
        objective: "排出透明且可调整的施工顺序"
        choice: "核算各自用量，或邀请居民共同协商"
        immediate: "同批回收料先不拆分加工，影院小样可继续看，正式装配顺序待定。"
        near: "核对两项工程的实需与可替代件，愿意后做的一方得到明确下一批材料条件，而非空口优先。"
      far_trigger: "下一批回收料入库并安排施工时"
      far_consequence: "先做工程恢复一项服务，后做工程承担实际等待；未兑现后续份额会使下次共同收料失败。"
      exits:
        - "撤回本人尚未交出的私人零件"
        - "交还公用工具后退出施工协商，不承担持续筹料"
      bindings:
        -
          activity: "试亮旧影院的招牌"
          place: "旧影院工地"
          pair: 0
    台风导致交通中断:
      source: "台风把通往镇外的便桥冲断了，赶集的人和药都进不来"
      engines:
        - "风雪封路"
        - "资源锁定"
      beats:
        trigger: "{npc}带来消息：台风把通往镇外的便桥冲断了，赶集的人和药都进不来。"
        objective: "在存量见底前把药和粮食的先后排出来"
        choice: "按登记册缩额发放；先保重伤再谈慢病；或绕行已勘过的山路试运一趟"
        immediate: "已到镇的存量按册发放，价签不改，缺口当众说明，不把责任推给没来的人。"
        near: "配药人与修复师各自核一遍实需，愿意走山路的另议这一趟，路线未经勘验不推荐。"
      far_trigger: "下批药到期而便桥仍未抢通"
      far_consequence: "柜台缩到只发急症，慢病按症状排队；绕行成功则恢复部分供应，但山路维护要计入下一期工。"
      exits:
        - "把自己那份药退回柜台后退出排队"
        - "只做自己的事，不参与这趟绕行"
      bindings:
        -
          activity: "按存量分装常用药"
          place: "废弃搜刮药房"
          pair: 2
        -
          activity: "为旧物写一张来历卡"
          place: "复兴集市"
          pair: 1
    巡夜队火把已围住长街:
      source: "巡夜队举着火把把长街两头都堵上了，正在一间间问来历"
      engines:
        - "身份风险"
        - "第三方施压"
      beats:
        trigger: "{npc}带来消息：巡夜队举着火把把长街两头都堵上了，正在一间间问来历。"
        objective: "在当地居民上门的当口把物件与人的来路说清"
        choice: "拿出写好的来历卡；把只展不出让的物件收回里间；或请当值修复工出面作证"
        immediate: "能对上来历卡的照常摆着，说不清的当场收进里间，不替谁圆话也不交人出去。"
        near: "巡夜队按册登记这一晚的问话，事后不改名册；来历卡写得清的下次少问一遍。"
      far_trigger: "下一轮巡夜仍有人说不清物件来历"
      far_consequence: "集市收摊时间被提前，只展区可能整体取消；来历卡齐全则只留书面记录。"
      exits:
        - "把摊位收了，带着自己的东西先走"
        - "只留下可换的那几件，其余带走不再摆"
      bindings:
        -
          activity: "为旧物写一张来历卡"
          place: "复兴集市"
          pair: 1
        -
          activity: "按存量分装常用药"
          place: "废弃搜刮药房"
          pair: 2
  themes:
    - "重建中的实用与记忆"
    - "旧物交换不等于征用"
    - "公共工程先后顺序的代价"
    - "灾后补给受限时的用药顺序"
    - "来历卡与巡夜问话之间的信任"
  technology_boundary: "废土灾后已恢复协商生活，依靠回收零件、有限电源、纸图与步行测绘；旧影院仅开放已修门厅，未验收结构不能靠修复招牌便视为可用，无万能物资复制。药房是重建后重新启用的旧柜台，按手写价签与登记册发放存量药，没有复产能力、没有电子处方，也不存在治愈感染的万能药。"
  bridge_status: "not_required"
