id: mat-4b174f7c066b02aead0779c1356ef3cb
name: 老澡堂与打烊后的钟点
material:
  eras:
  - 千禧年前后
  aesthetics:
  - 暖色生活流
  - 市井烟火
  - 温柔颓丧
  rule: 白天一票一柜：番台售票、票根进柜上手写本，一块柜牌换一个人；打烊后整池可包——不立合同、不押金、没有服务单、也不写寄存簿，价钱当面点给看池人，钟点从打烊起算、封炉即止。钟点之内，夜池的规矩由包场的人定：谁下池、外人进不进、几点封炉；封炉之后，夜里讲定的一切随水凉一起作废。这里没有网名与头像要对——白天认柜牌，打烊后认钟头。搓澡床照疗程单排床，先来后到，插床须经床上的人点头。
  social_rule: 这条街不问「夜里谁来过」，只问「水开不开」；看池人夜里收的钟点钱与白天卖的票一样干净——白天与打烊后是两种合法，不是一明一暗。番台上没有赊账，茶水台边全是人情；对面砍价不还价：还价就等于承认自己撑不过这个冬。
  places:
    番台与鞋柜高凳:
      details:
      - 一张收钱桌、一面顶到房梁的鞋柜墙，手写本上只记白天的票·日间
      - 打烊后本子合上，桌角那盏灯还亮着，是留给夜世界的一盏·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 通往街面的正门与棉门帘
        - 退进更衣长凳与柜钥匙墙
        witnesses:
        - 白天坐帐的番台大娘
        - 排队买票的街坊与歇脚的熟客
        - 借高凳系鞋带的过路人
        affordances:
        - 买一张白天的票并领柜牌
        - 点一遍手写本上的票根
        - 在番台前替人挡一次说和
        - 结束活动并离开
        pressure_modifiers:
        - 打烊时刻
        - 柜牌剩余数目
        - 手写本被翻动的痕迹
    更衣长凳与柜钥匙墙:
      details:
      - 一排竹柜、一串拴皮筋的号码牌，两条包浆发亮的杉木长凳·日间
      - 打烊后竹柜不上锁，只剩看池人腰上那串钥匙还响着·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 回到番台与鞋柜高凳
        - 进大池与桑拿房的湿区门
        witnesses:
        - 换衣的街坊
        - 找错柜牌的客人
        - 巡柜牌的搓澡师傅
        affordances:
        - 领牌开柜存取衣物
        - 在长凳上坐下来说话
        - 数一遍墙上缺了的柜牌
        - 结束活动并离开
        pressure_modifiers:
        - 柜牌剩余数目
        - 号码牌皮筋的松紧
        - 湿区门帘晃动的方向
    大池·白日场:
      details:
      - 白天的公共客厅，晕池的让位、递水都在众目之下·日间
      - 暮色里最后一场客人起身，池水慢慢沉静下来等着打烊·暮
      profile:
        privacy: low
        visibility: medium
        exits:
        - 退回更衣长凳与柜钥匙墙
        - 进桑拿房的小木门
        witnesses:
        - 泡澡的众街坊
        - 大池边搭手的老师傅
        - 念着疗程单日子的老主顾
        affordances:
        - 下池泡着听闲话
        - 扶一个晕池的人出大池
        - 给晕池的人让出池沿的位置
        - 结束活动并离开
        pressure_modifiers:
        - 水温与煤火
        - 满池人数
        - 谁和谁恰好同池
    桑拿房:
      details:
      - 小黑屋一瓢水、一炉烧透的石头，沙漏计时谁也不看表·日间
      - 雾汽最浓时这里最接近「无名」，称呼都留在门外·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 推门退回大池·白日场
        - 侧门通搓澡床与理疗间
        witnesses:
        - 同一屋雾汽里的沉默客人
        - 偶尔进来看一眼沙漏的看池人
        affordances:
        - 舀一瓢水浇在石头上
        - 给屋里的人递一壶凉白开
        - 在雾汽里说一句白天说不出口的话
        - 结束活动并离开
        pressure_modifiers:
        - 沙漏翻转的次数
        - 石头的火候
        - 雾汽的浓度
    搓澡床与理疗间:
      details:
      - 两张窄床、一叠热毛巾，墙上夹子别着一页页疗程单·日间
      - 最后一张床空出来时只留一盏灯，热毛巾还冒着气·暮
      profile:
        privacy: medium
        visibility: low
        exits:
        - 掀帘回大池·白日场
        - 侧门通休息大厅与茶水台
        witnesses:
        - 搓澡的女师傅
        - 排床的老主顾
        - 等着插床的客人
        affordances:
        - 上床先拍三下床沿等师傅应声
        - 在床上替人搓一次背
        - 对一遍疗程单上的日子
        - 结束活动并离开
        pressure_modifiers:
        - 疗程单页数
        - 排床顺序
        - 热毛巾的余量
    休息大厅与茶水台:
      details:
      - 躺椅、大茶壶、一台收音机，消息在这里比水干得快·日间
      - 打烊后茶炉封成小火，只给夜里留下的人续水·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 回大池·白日场的干区门
        - 侧门通搓澡床与理疗间
        witnesses:
        - 躺着听广播的街坊
        - 茶水台当值
        - 把闲话递来递去的常客
        affordances:
        - 倒一杯热茶坐下来听
        - 把一句闲话递到
        - 替人占住靠暖汽的躺椅
        - 结束活动并离开
        pressure_modifiers:
        - 收音机里的天气与路况
        - 茶炉的火苗
        - 消息走漏的速度
    锅炉房与看池人的后门:
      details:
      - 看池人的领地：炉膛的火色、水线表、一把封炉的火钩·夜
      - 白天她在这儿添煤，夜里这扇后门只认打烊后的钟点·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 后门通后院水塔与煤堆
        - 内门通更衣长凳与柜钥匙墙
        witnesses:
        - 看池人
        - 替班修锅炉的师傅
        - 送煤的车把式
        affordances:
        - 看一眼炉膛的火色
        - 巡一遍夜池的水线
        - 把封炉的火钩挪个位置
        - 结束活动并离开
        pressure_modifiers:
        - 封炉倒计时
        - 煤与水的余量
        - 后门闩上没上
    打烊后的包场池:
      details:
      - 同一方大池只剩一盏灯，水汽贴着水皮走，钟点归你·夜
      - 灯影外的长凳空着，说话声被水吸走，出了池沿就不算数·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 经锅炉房与看池人的后门离场
        - 等水凉自散、天亮作废的正门
        witnesses:
        - 守在锅炉房一侧的看池人
        - 钟点之内包场人带来的客
        affordances:
        - 包下半个池子并定夜里的规矩
        - 在水凉之前把话说完
        - 让来的人下池或请他离水
        - 结束活动并离开
        pressure_modifiers:
        - 封炉倒计时
        - 水温下降的快慢
        - 灯剩几盏
        - 钟点内有几个人
    后院水塔与煤堆:
      details:
      - 煤与水在此中转，水塔的影子压着几户人家的屋顶·日间
      - 拆迁办的红线桩打进来那天，煤堆边的脚印多了好几串·晨
      profile:
        privacy: low
        visibility: high
        exits:
        - 进锅炉房与看池人的后门
        - 沿后巷出街面
        witnesses:
        - 卸煤的车把式
        - 量地的人
        - 借水塔晾衣的邻户
        affordances:
        - 清点煤与水的余量
        - 巡看红线桩的位置
        - 帮着卸一车煤
        - 结束活动并离开
        pressure_modifiers:
        - 煤与水的余量
        - 红线桩的数目
        - 后巷里生面孔的出入
  pairs:
  - family: 服务与手艺
    position: 知情不报者
    appellations:
    - 客人
    - 直呼其名
    npc:
      role: 老澡堂的看池人
      function: 看炉、看池，也看打烊后的钟点
      authority: 包场钟点的定价与准入，由她一句话说了算
      resource: 一串柜钥匙与一把封炉的火钩
      limitation: 柜上白天那本账，她一个字都不能动
      obligation: 包场时段进来的人，要能平平安安地出去
      exposure: 收错一个钟点的钱，白天卖的票也会跟着失信
      hidden: 有几个钟点她没收钱，也没记在任何地方
    player:
      identity: 在这池子里泡了半辈子的街坊，某个夜里撞见了不该来包场的人，至今没说
      baseline: 你认得每一块柜牌的响法，她认得你沉默的分量——今晚你们都在等对方先开口。
      resources:
      - 泡了半辈子攒下的街坊脸面
      - 那个夜里看见的人影与时刻
      reputation: 嘴严得出奇的老街坊，看池人夜里敢把钥匙留给他
    relationship_reason: 她掌着夜池的准入，你掌着她夜世界的一角沉默——这份默契谁也不敢先用尽。
  - family: 服务与手艺
    position: 服务提供者
    appellations:
    - 师傅
    - 师兄
    npc:
      role: 搓澡理疗的女师傅
      function: 排床、搓背，替老主顾把疗程的日子记下去
      authority: 疗程单夹子与排床的顺序，都攥在她手里
      resource: 一双认得旧伤的手与一夹子疗程单
      limitation: 腰上有旧伤的手艺人，自己弯不下腰
      obligation: 床上听到的话，不出理疗间这道帘
      exposure: 疗程单上少记一笔，老主顾的信任就薄一层
      hidden: 疗程单里有两页，是她自己垫的钱
    player:
      identity: 今晚被请来替班修锅炉的师傅，这座锅炉连着她的热水
      baseline: 她管床、你管炉；今晚水热不热，全看你手上的活。
      resources:
      - 一整套修炉的家伙与多年的手艺
      - 锅炉房进出的方便
      reputation: 手上稳、话不多的锅炉师傅，澡堂里人人都给面子
    relationship_reason: 她管床、你管炉，两门手艺在同一座热水上碰头——谁也离不开谁，谁也不欠谁。
  - family: 医疗与照护
    position: 被求助者
    appellations:
    - 客人
    - 先生
    npc:
      role: 社区诊所的夜班医生
      function: 看急诊、压化验、写值班记录
      authority: 执业证与值班章
      resource: 化验单延迟出结果的窗口
      limitation: 夜间登记要过得了晨会的核对
      obligation: 病人隐私止于门内
      exposure: 漏记一次可被停值班
      hidden: 复查单锁在抽屉里，报告她一直没敢拆
    player:
      identity: 澡堂的人晕池、烫伤、咳了半个月——她今晚来找的人是你
      baseline: 她要的记录在你嘴上和身上；给不给全，你自己定。
      resources:
      - 满池人晕过池、烫过伤的第一手经过
      - 替人垫过药钱的单据
      reputation: 夜里医生敲门他会开门的街坊，讲情义也讲分寸
    relationship_reason: 澡堂的暖汽与诊所的值班灯隔街相望；她掌着体检报告与工伤证明，你掌着让它们成立的第一手经过。
  - family: 家族与继承
    position: 债主
    appellations:
    - 老板
    - 直呼其名
    npc:
      role: 煤栈与澡堂房产的老板娘
      function: 管煤栈的进出、管澡堂房契的去留，也管这条街过冬的暖
      authority: 开春的煤账与房契续不续，她一言而定
      resource: 一本记满赊账的老账册
      limitation: 街坊的口风，她也怕
      obligation: 账不逼死人
      exposure: 被写成「要逼死老澡堂」，半条街的生意都会绕开她的煤栈
      hidden: 老账册里有几笔，是她故意没去收的
    player:
      identity: 接了家里班的少掌柜，押着煤钱与房租两头跑；对面的洗浴中心也来找过她
      baseline: 你的账册决定这座澡堂开春还开不开；她的口气决定你的账能不能平。
      resources:
      - 家里交下来的账册与存折
      - 与对面洗浴中心周旋的往来记录
      reputation: 刚接班的少掌柜，街坊都在看他像不像他爹
    relationship_reason: 你握着澡堂的账册，她握着澡堂的地契与煤——两本账在开春碰头，谁先眨眼谁让路。
  activities:
    在番台买票领柜牌:
      places:
      - 番台与鞋柜高凳
      - 更衣长凳与柜钥匙墙
      pairs:
      - 0
      - 1
      - 2
      - 3
      category: 日常接触
      action: '{npc}从鞋柜墙边的高凳上起身，把一块拴皮筋的柜牌连着澡票推到你面前。'
      beats:
        trigger: '{npc}把手写本翻到新的一页，笔尖悬着，抬眼看你。'
        objective: 按白天的规矩把票买齐，顺便看看今天番台上坐着的是谁。
        choice: 可只买一张票不多话；可顺口问一句今天水怎么样，或把街坊捎的话递到。
        immediate: 柜牌进了你手，你在柜上就有了今天的位置。
        near: 往后几日，这块柜牌的响法番台上的人会记得。
    在搓澡床上替人搓一次背:
      places:
      - 搓澡床与理疗间
      - 大池·白日场
      pairs:
      - 0
      - 1
      category: 身体靠近
      action: '{npc}把热毛巾搭在床沿，侧身让出半张床，等你把手焐热。'
      beats:
        trigger: '{npc}趴在窄床上拍了三下床沿，把热毛巾蒙上脸。'
        objective: 把这一次背搓完，手底下摸到什么旧伤，嘴上过什么秤。
        choice: 可照老规矩下手不多话；可把手放轻些多问一句，或碰到旧伤就停手等她自己讲。
        immediate: 这一次背搓完，你们各自清楚对方手上的分寸。
        near: 往后几日，床沿那三下拍响在你们之间多了一层意思。
    桑拿房里递一壶凉白开:
      places:
      - 桑拿房
      pairs:
      - 0
      - 2
      category: 照护与修复
      action: '{npc}在雾汽里靠着石头炉坐着，你把一壶凉白开放到她手边。'
      beats:
        trigger: '沙漏翻过一半，{npc}的声音在雾汽里哑了下去。'
        objective: 让她在雾汽里缓过这口气，顺便听她愿不愿意开口。
        choice: 可放下水就退出去；可坐到沙漏边上陪她等这一漏，或把话头往她咳的那件事上引一引。
        immediate: 这一壶水让她缓了过来，雾汽里的话留在雾汽里。
        near: 往后几日，进这间小屋之前你们会先看一眼对方在不在。
    打烊后包下半个池子:
      places:
      - 打烊后的包场池
      - 锅炉房与看池人的后门
      pairs:
      - 0
      - 2
      - 3
      category: 空间与退出
      action: '{npc}把最后一盏池灯留着，火钩靠在炉边，等你把钟点的价钱当面点清。'
      beats:
        trigger: '打烊的钟点到了，白天的客人散尽，{npc}在后门边等你一句话。'
        objective: 把这个夜包下来，讲定钟点从何时起算、封炉定在几点。
        choice: 可照她的价码当面点清；可把封炉往后商量半个钟头，或先讲一句谁都不许进池的规矩。
        immediate: 钱货两讫，这个夜里的池子归你，规矩也归你定。
        near: 往后几日，这个钟点在你们之间算是占下了。
    扶一个晕池的人出大池:
      places:
      - 大池·白日场
      - 休息大厅与茶水台
      pairs:
      - 1
      - 2
      category: 身体靠近
      action: '{npc}在池边晃了一下，你从背后架住她的胳膊，把她半扶半抱地带出水面。'
      beats:
        trigger: '满池众目之下，{npc}扶着池沿的手滑了一下。'
        objective: 把人平稳地弄出大池，安置到躺椅上，别让众人的嘴跑得比水快。
        choice: 可一言不发快步扶出去；可在茶水台多要一杯热糖水，或留下来替她把湿头发拢一拢。
        immediate: 人出了池，这一扶在众目之下算作了结。
        near: 往后几日，池边会传你们这一扶的几个版本。
    对一遍疗程单上的日子:
      places:
      - 搓澡床与理疗间
      - 休息大厅与茶水台
      pairs:
      - 0
      - 1
      category: 调查与核验
      action: '{npc}把疗程单夹子摊在茶水台上，一页一页把做过的日子指给你看。'
      beats:
        trigger: '夹子里少了一页，{npc}把剩下的日子在指头底下过了第二遍。'
        objective: 把做过和没做的日子对齐，看看第八次之后那几页去了哪儿。
        choice: 可照着单子一条条问；可把翻旧账的话咽下去只递茶，或把她垫钱那两页挑明了摆上桌面。
