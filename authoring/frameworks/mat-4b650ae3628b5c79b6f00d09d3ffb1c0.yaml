    "试走公共服务导览":
      "places":
        - "医院住院部走廊"
      "pairs":
        - 0
      "category": "空间与退出"
      "action": "{npc}请你站在首次来访者的位置，按现有箭头走到导诊台。"
      "beats":
        "trigger": "{npc}请你站在首次来访者的位置，按现有箭头走到导诊台。"
        "objective": "找出轮椅和步行访客都会走错的一处分岔"
        "choice": "走一段；谢绝测试到门厅等；或仅从原地检查视线"
        "immediate": "遮挡箭头被移开，路线建议交给导诊员确认后才张贴"
        "near": "下一位来访者少绕一段病区走廊"
    "试讲领养日说明":
      "places":
        - "宠物医院"
      "pairs":
        - 1
      "category": "信息交换"
      "action": "{npc}请院方联络人在场，邀你用新来访者的口吻问一遍报名条件。"
      "beats":
