        "choice": "核对图注；拒绝参与仅预约改日参观；或只保留已知年份"
        "immediate": "确定的改建年代进入沿革，无法证实的传闻不挂展板"
        "near": "建筑介绍可独立成篇，不依赖逝者家庭隐私"
