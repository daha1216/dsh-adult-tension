id: mat-4c9f8b1e7a2d6c05f3e8b94a17d20c6e
name: 舞厅大班与乐台后台
material:
  eras:
  - 旧式民国都市
  aesthetics:
  - 暗潮涌动
  - 市井烟火
  - 克制冷峻
  rule: 舞厅按点计价，一点一场，一场三支曲子；点单由客人自己走到大班台面册台当众落字才算数，散场前付清，跑单的由当班大班先垫。舞女在台面上不得拒客，但每一张签约单最后一行都写着陪舞不陪身；客人若在台面上越过这条线，当班大班有权当场停乐、清场，把这一场作废。台下的事不进场子，凡在厅内谈成的私约场子一律不认；乐台换场只认领班递上来的纸剪节目条，乐队不得为了等人擅自延曲。
  social_rule: 街上不问她是哪一位的人，只问今晚是谁排的；同一个晚上一个大班不能把同一个人排给两桌客人。台面册上落了字才算数，没落字的当场作废。花榜的名次是街上人自己凑出来的，名次掉了不解释也不申辩——一申辩就等于认了。跑场中介茶室可以打听哪家班子缺人，但不替同行接下一份不是自己经手的场子。
  places:
    大班台面册台:
      details:
      - 台面册摊开在临街的高柜上，落一支笔就等于认下一场·夜
      - 柜前排着一小队等排档的人，谁的钟点到了当场喊出来·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿舞厅大厅的侧门退进后台廊道，不经过乐台，账上仍留着这一笔
        witnesses:
        - 当班大班
        - 排队等排档的客人
        affordances:
        - 台面上落一笔点单
        - 当面把一场作废
        pressure_modifiers:
        - 当夜点单的人数
        - 台面册上还没划掉的空档
    舞厅大厅乐台:
      details:
      - 乐台高过大厅半尺，乐队在台侧候场，换场只看领班手里的纸剪节目条·夜
      - 大厅的灯是分档的，停乐时只留下一盏照台面的脚灯·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 停乐后客人从正门散场，乐手从台侧门回后台，两路不相遇
        witnesses:
        - 满厅的客人
        - 全队乐手
        - 各桌的侍应
        affordances:
        - 台面上落一笔点单
        - 停乐清场作废一场
        pressure_modifiers:
        - 大厅里坐满的程度
        - 乐队当夜还剩几支曲子
    二层候场廊:
      details:
      - 廊子沿着大厅挑空铺开，隔一段有一盏矮灯，看得到人影听不清话·夜
      - 妆台镜背贴着一排当晚的场次条，谁下一场一眼看得见·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 廊头有楼梯直下一层大厅，廊尾的窄梯只通三层账房
        witnesses:
        - 同廊等场的其他舞女
        - 上来催场的侍应
        affordances:
        - 在二层候场廊等下一场
        - 替她理一理翻起来的领口
        pressure_modifiers:
        - 廊上当夜候场的人数
        - 下一场开场还剩多久
    化妆间里侧试衣帘后:
      details:
      - 里侧挂着一排当晚要用的行头，帘子只拉到大半，缝里漏出一线光·夜
      - 小凳上摊着别针与粉盒，镜台的水汽还没散·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 掀帘出去就是二层候场廊，帘子一动全廊都听得见
        witnesses:
        - 帘外同廊候场的舞女
        - 进来取行头的管事
        affordances:
        - 在化妆间换行头
        - 替她把背后的搭扣扣上
        pressure_modifiers:
        - 帘子拉得严不严
        - 隔壁还有几个人在换行头
    三层大班账房:
      details:
      - 白账摊在账桌上，收进来的点单逐条对应台面册上划掉的那一行·夜
      - 账房靠里的一角留着一把旧椅，按规矩不接客人·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 出账房门即是三层楼道，下楼有两条路：通大厅的正梯与通锅炉房的窄梯
        witnesses:
        - 当班账房
        affordances:
        - 核一遍当晚的白账
        - 台下排一个人的档期
        pressure_modifiers:
        - 白账与台面册差了几笔
        - 当夜还有谁在楼上
    三层不对外小间:
      details:
      - 小间门口不挂任何牌子，进来的人自己知道该不该进·夜
      - 桌上的茶是凉的，没人再续，进来的人也不指望有人续·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 出门前先把当晚那一页翻过去，出了门今晚的册子上就没有这个人
        witnesses:
        - 只认当夜排档的那一个人
        affordances:
        - 台下排一个人的档期
        pressure_modifiers:
        - 当夜有没有别人被叫上三楼
        - 小间外楼道的脚步声
    衣帽间与锅炉房后门:
      details:
      - 衣帽间的号码牌排满一面墙，后门那道闩是整栋楼里最旧的一件东西·夜
      - 锅炉房的管子横在过道上，走夜路的人得侧着身子过·夜
      profile:
        privacy: low
        visibility: medium
        exits:
        - 推开后门就是横街后巷，出去的脚印落在煤渣上，天亮前不会有人扫
        witnesses:
        - 看衣帽的老头
        - 添煤的锅炉工
        affordances:
        - 从后门送一个人出去
        - 替她把大衣挂上号牌
        pressure_modifiers:
        - 后门闩是不是插上的
        - 后巷里停着几辆黄包车
    花榜贴报墙:
      details:
      - 榜贴用浆糊贴在墙上，边角总有人去揭，揭过的痕迹压着前几期的名字·夜
      - 墙对面的茶摊摆到半夜，看榜的人大多站着，不说话·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 贴报墙在横街正中，两头都有檐廊，走开不必经过谁
        witnesses:
        - 看榜的路人
        - 守着浆糊桶的贴报人
        affordances:
        - 花榜贴报墙前听闲话
        - 当面把上榜的名字念一遍
        pressure_modifiers:
        - 这一期换榜的日子
        - 围在墙前的人多不多
    跑场中介茶室:
      details:
      - 茶室四张方桌，靠门那张是给等消息的人留的，坐久了也不赶·夜
      - 柜台上摆着一排空茶碗，谁的班子缺人就往碗里搁一支筹·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从茶室侧巷绕回横街，绕这一趟就避开了舞厅正门
        witnesses:
        - 掌柜
        - 同桌等消息的同行
        affordances:
        - 跑场茶室打听缺不缺人
        pressure_modifiers:
        - 柜台上搁了几支筹
        - 当夜哪几家班子在换人
  pairs:
  - family: 成人行业与感官服务
    position: 被求助者
    appellations:
    - 先生
    - 客人
    npc:
      role: 当晚在台面上被越了线的舞女
      function: 撑满自己排到的那几场，把台面上不该发生的事按规矩递到该管的人手上
      authority: 台面上点单落字之后，她可以要求换一支曲子或者把这一场提前收尾
      resource: 一份写到今晚收场为止的签约单与三支曲子的钟点
      limitation: 台面上不得拒客，跳过线得由当班大班停乐，她自己停不下来
      obligation: 每一场都跳满三支曲子，散场前把台面册上自己那一行认掉
      exposure: 台面下的事一旦传进场子，她的签约单第二天就续不上
    player:
      identity: 她当晚递过条子的人
      baseline: 她当晚在台面上被客人越了线，你替她把停乐那张条子递到了领班手上。
      resources:
      - 一张还没递出去的停乐条子
      - 三楼账房那把按规矩不接客人的旧椅
      reputation: 你替人递过条子，没把条子上的名字说给第二个人听
    relationship_reason: 她当晚在台面上被客人越了线，你替她把停乐那张条子递到了领班手上；散场后她来找你，只为确认那张条子明天还算不算数。
  - family: 私密撮合与契约中介
    position: 同侪
    appellations:
    - 掌柜
    npc:
      role: 隔街茶室里替各家班子排档的跑场中介
      function: 按各家的班底与当晚的人手，把缺人的场子和空着的档期对上
      authority: 她排出去的那几家班子还认她一句话，她说今晚归谁排就归谁排
      resource: 一本记着各家班子底细与当月人流往来的排期暗账
      limitation: 场子和班子两头都能绕开她，撮合完她不能留在场内
      obligation: 把话说清到能认账，同一个晚上不把同一个人卖给两家
      exposure: 排期暗账一见于人手，两头会先把这本账灭掉
    player:
      identity: 管着这栋楼一层点单的人
      baseline: 你替这栋楼排人，知道同一支舞在大厅里和在楼上小间里根本不是一回事。
      resources:
      - 台面册上一页还没落字的空档
      - 楼上那间不挂牌子的小间
      reputation: 你排出去的场子当晚都是谁在上就是谁在上，临时换人不做
    relationship_reason: 各排各的档期，同一个晚上不能把同一个人排给两桌；你们因此在茶室里把下个月的档期先对了一遍。
  - family: 服务与手艺
    position: 知情不报者
    appellations:
    - 师傅
    - 掌柜
    npc:
      role: 锅炉房里夜里唯一还醒着的人
      function: 守后门、添煤、替整栋楼留一盏亮着的灯
      authority: 后门那道闩归他，他不开就没人出去得了
      resource: 后巷的鞋印与后门闩上换下来的旧铁栓
      limitation: 烧火的不进屋，账上的事他不认，只认自己看见的
      obligation: 后门开了要记时辰，别的不问
      exposure: 他不记的那几个时辰一旦被人问起，前后就对不上了
    player:
      identity: 撞破后门秘密却到现在没吭声的人
      baseline: 你看见过谁从后门走，也知道那扇门什么时候会开——你一直没说。
      resources:
      - 一份只记时辰不记名字的出入册
      - 一扇看一眼就知道插没插闩的后门
      reputation: 你把嘴闭得很紧，街面上没人从你这里听去过什么
    relationship_reason: 你夜里下楼添煤，撞见她从后门送人出去；你替她把那道闩插了回去，这件事往后谁也没提。
  - family: 权力与治理
    position: 上司
    appellations:
    - 掌柜
    - 少爷
    npc:
      role: 管三层账房与全楼排档的大班
      function: 定当夜的档期、压住两本账的差数、在台上出岔子时决定停不停乐
      authority: 她能当场停乐清场作废一场，也能把某一晚整晚从册子上抹掉
      resource: 一本白账与一张管着全楼排档名单的底册
      limitation: 抹掉的那一晚对不上月底的流水，账她自己填
      obligation: 台面上出了岔子她得当场担下来，不能推给台下的舞女
      exposure: 白账里那几笔抹不干净的差数一旦摊开，她在这一行的分量就没了
    player:
      identity: 管着一层点单的排档大班
      baseline: 她管三层账房的白账，你管一层点单，一整晚的日程是两个人一句一句拼出来的。
      resources:
      - 一层点单的钟点安排权
      - 一份还压在柜上的当日场次条
      reputation: 你排出去的钟点不轻易改，改了会当面说清为什么改
    relationship_reason: 她管三层账房的白账，你管一层的点单；月底对账时你们坐下来把差数一条一条对下去。
  activities:
    台面上落一笔点单:
      places:
      - 大班台面册台
      - 舞厅大厅乐台
      pairs:
      - 0
      - 1
      - 3
      category: 身体靠近
      action: '{npc}把台面册推到你面前，问这一笔是当场划掉还是留到散场前再认。'
      beats:
        trigger: '{npc}把台面册推到你面前，问这一笔是当场划掉还是留到散场前再认。'
        objective: 把这一场的人和钟点当众定下来，不让这一行悬到散场
        choice: 可当场落字定一场；可只留空档等她回来再说，或直接划掉这一行不做这一笔
        immediate: 落下的那一笔当夜生效并按钟点排进乐台的节目条，划掉的那一行不再补人
        near: 这一晚的钟点按册子往下排，被划掉的人下一班次自己来问，不替谁留位
    停乐清场作废一场:
      places:
      - 舞厅大厅乐台
      pairs:
      - 1
      - 2
      category: 第三方与打断
      action: '{npc}按住领班的手臂，让乐队停在半支曲子上，等你决定这一场还作不作数。'
      beats:
        trigger: '{npc}按住领班的手臂，让乐队停在半支曲子上，等你决定这一场还作不作数。'
        objective: 在台上出岔子的时候把这一场干净地断掉，不让它烂在厅里
        choice: 可当场作废并按规矩退钟点；可先停一支曲子把话问清，或只清掉这一桌继续开乐
        immediate: 灯留一盏脚灯，客人从正门散场，作废的那一场当夜从台面册上划掉
        near: 被作废的客人下一次点单要由当班大班先点头，作废的次数月底自己报上去
    台下排一个人的档期:
      places:
      - 三层不对外小间
      - 三层大班账房
      pairs:
      - 0
      - 2
      - 3
      category: 日常接触
      action: '{npc}把当月的排期摊开成两列，问哪一列是你打算真排下去的。'
      beats:
        trigger: '{npc}把当月的排期摊开成两列，问哪一列是你打算真排下去的。'
        objective: 把台面下的那一本排期跟台面上的钟点分开放，谁也不许拿这本来对那本
        choice: 可把楼上那几晚单独排一列；可只排台面上认得出来的钟点，也可以今晚什么都不排
        immediate: 排下的那几晚当夜从小间里定走，台面册上对应的一行只留一个记号
        near: 那几晚第二天照常开乐，进出都走窄梯；排期本谁对过谁没对过，月底各自心里有数
    花榜贴报墙前听闲话:
      places:
      - 花榜贴报墙
      pairs:
      - 3
      category: 信息交换
      action: '{npc}指着新贴上的一行念出来，问你要不要把这一段接下去。'
      beats:
        trigger: '{npc}指着新贴上的一行念出来，问你要不要把这一段接下去。'
        objective: 听清街面上把名次说成了什么样子，不替自己也不替别人应声
        choice: 可站着听完就走；可把上榜的那一行抄一段回去，或当场替人把话岔开
        immediate: 名次照贴报墙上的走，掉下来的几位不解释，申辩只当认了
        near: 换榜那天街上还会再念一遍，谁的名字跟谁的名字前后挨着，往后就照这个说
    在化妆间换行头:
      places:
      - 化妆间里侧试衣帘后
      pairs:
      - 0
      - 1
      category: 照护与修复
      action: '{npc}把背后的搭扣朝着你转过来，说下一场还有不到一刻钟。'
      beats:
        trigger: '{npc}把背后的搭扣朝着你转过来，说下一场还有不到一刻钟。'
        objective: 把行头收拾利落，让她下一场照原样上台
        choice: 可替她把扣子扣好；可只把行头递过去退到帘外等，或叫管事上来搭手
        immediate: 扣好就走，帘子重新拉严，廊上的人只看见换场的时辰没有变
        near: 往后搭扣松了还来找你，这一间帘子后面的事出了帘子不提
    从后门送一个人出去:
      places:
      - 衣帽间与锅炉房后门
      pairs:
      - 0
      - 1
      - 2
      category: 空间与退出
      action: '{npc}把大衣的号码牌摘下来递给你，说后巷的车等不到天亮。'
      beats:
        trigger: '{npc}把大衣的号码牌摘下来递给你，说后巷的车等不到天亮。'
        objective: 在天亮前把人从后门送出去，不让她在横街上被人认出来
        choice: 可替她把衣帽领出来送到后门；可只指给她后巷的走法自己留在衣帽间，或让她等下一班车
        immediate: 后门开了记一笔时辰，人出了巷子，衣帽间的号牌照原位挂回去
        near: 后门开过的那几个时辰对得上白天来的问话；往后谁走这扇门都从锅炉房过
    核一遍当晚的白账:
      places:
      - 三层大班账房
      pairs:
      - 0
      - 2
      - 3
      category: 调查与核验
      action: '{npc}把白账和台面册并排摊开，让你指着差的那几笔说哪一笔是自己经手的。'
      beats:
        trigger: '{npc}把白账和台面册并排摊开，让你指着差的那几笔说哪一笔是自己经手的。'
        objective: 把经手过的和没经手过的分开，差数摊在桌上一条一条对
        choice: 可把自己那一笔认掉当场销掉；可只把差数圈出来留到月底，或把摊开的册子合上不做这一遍
        immediate: 认过的当夜销掉，没认过的挂回账桌，两本册子上差数各自留着不合并
        near: 月底按销掉的数结账，圈出来的那几笔往后要当面对；抹掉过的某一晚自己填上
    跑场茶室打听缺不缺人:
      places:
      - 跑场中介茶室
      pairs:
      - 1
      - 2
      category: 信息交换
      action: '{npc}往柜台上搁下一支筹，问你手上这一班人还缺不缺。'
      beats:
        trigger: '{npc}往柜台上搁下一支筹，问你手上这一班人还缺不缺。'
        objective: 打听哪一家班子在换人，只说行情不接别人经手的场子
        choice: 可应下一班缺人的场子；可只问行情不接，或把筹推回去说这一班不掺和
        immediate: 应下的那一场当夜记进排期，没应下的筹还搁在柜台上等下一家
        near: 缺人的班子隔三两天再来问一趟；接过一次手的人往后被当作自己经手过了
    在二层候场廊等下一场:
      places:
      - 二层候场廊
      pairs:
      - 0
      - 2
      category: 日常接触
      action: '{npc}靠着镜台边的矮灯，问你是不是要等到这一晚散场才走。'
      beats:
        trigger: '{npc}靠着镜台边的矮灯，问你是不是要等到这一晚散场才走。'
        objective: 把换场前这点空档过去，两个人谁也不必上台也不用走开
        choice: 可陪她站到下一场的钟点；可只把镜子让给她自己退到廊尾，或先下楼去大厅
        immediate: 上楼催场的侍应喊到名字，她照点上台，廊上留下的空处照旧归下一位
        near: 下一次换场她还会在同一个位置靠一会儿；等过几回之后谁也不再问对方为什么还在这儿
  customs:
  - 台面册摊在临街的高柜上，落一支笔才算认下一场，没落字的当场作废。
  - 每一张签约单的最后一行都写着陪舞不陪身，这一行由当班大班来守，不由上台的人来守。
  - 乐台换场只看领班递上来的纸剪节目条，乐队不得为了等人擅自延曲。
  - 后门上闩的时辰记在锅炉房的出入册上，那本册子只记时辰不记名字。
  pressures:
    同一晚被排给了两桌:
      source: 排期本上同一个晚上出现了两桌客人，而这一个晚上只有一个大班能签。
      engines:
      - 名额只能给一个人
      - 身份错位
      beats:
        trigger: '{npc}把两页排期并排推到灯下，两页上写的是同一个晚上、同一个人的名字。'
        objective: 在开乐之前把这一晚定给一桌，另一个空档自己去找人来补
        choice: 可按先落字的台面册排给先来的那一桌；可当场停乐另排一场，或退掉一桌把空档挂出去
        immediate: 定下的那一桌当夜开乐，退掉的那一桌名字从排期上划掉，两页排期都留底不撕
        near: 被退的那一桌下一班次要不要再接由她自己定；两页排期挂在账房，月底按划掉的次数自己报
      far_trigger: 下一个同时被排了两处的晚上又落到同一个人头上时
      far_consequence: 按台面册先落字的人往后排期不用再问第二遍；连着退过两桌的人开乐前要先当着客人问清谁先到的，走哪位客人都记一笔，退到没人再敢订她的钟点。
      bindings:
      - activity: 台面上落一笔点单
        place: 大班台面册台
        pair: 0
      - activity: 台面上落一笔点单
        place: 大班台面册台
        pair: 1
      exits:
      - 把楼上那几晚整列退掉，只留台面上认得出的钟点
      - 把小间里的排期本合上，这一晚谁都不排
    台面上叫停了一次:
      source: 客人在大厅里越过了签约单最后一行，乐台停在了半支曲子上，满厅都在看这一桌。
      engines:
      - 表面体面破裂
      - 名声保卫
      beats:
        trigger: '{npc}按住领班的手臂让乐队停在半支曲子上，满厅的人都转过来看这一桌。'
        objective: 当着满厅的面把这一场断干净，同时不让这一桌上的名字明天传遍横街
        choice: 可当场停乐清场把这一场作废；可只停一支曲子把话说到台下，或换一支曲子把这一桌带过去
        immediate: 灯留一盏脚灯，被越线的那一场从台面册上划掉，作废条子递到账房不递到街上
        near: 作废的客人下一次点单要由当班大班先点头；这一晚的事出了厅门不由厅里的人讲，谁讲谁自己担
      far_trigger: 同一个客人在换榜那天又坐进大厅第一排时
      far_consequence: 当场作废过的人再订钟点要付现钱并落两处名；用曲子把事带过去的人往后排档要先问一桌客人的来头，问得越多能排的钟点越少。
      bindings:
      - activity: 停乐清场作废一场
        place: 舞厅大厅乐台
        pair: 1
      - activity: 停乐清场作废一场
        place: 舞厅大厅乐台
        pair: 2
      exits:
      - 把这一桌的号牌摘掉，撤出大厅回三层账房
      - 不再接这一位客人的点单，把钟点让给别的班子
    台下那本账被念出来:
      source: 三楼小间里的排期被人在大厅里照着念了出来，念的时候台面上那一页还空着。
      engines:
      - 共同秘密
      - 两副面孔
      beats:
        trigger: '{npc}把台面册翻到空白的那一页压在你面前，说楼下有人把楼上的排期念出来了。'
        objective: 把台面上和台面下两本排期分开处置，不让念出来的那一本连累另一本
        choice: 可把念出来的那几晚从排期本上退掉；可只认台面册上落了字的那几行，或先把楼上那间小间锁起来停几天
        immediate: 台上那一页当夜继续空着，楼下念过的话不当账，排期本上相应几晚画掉
        near: 被念到的那几个人下一次进出都走窄梯；排期本画掉的页往后不补，谁再念这一页就得自己拿出落字的那一本
      far_trigger: 换榜那天大厅里又有人照着念出第三个人名时
      far_consequence: 把两本分开处置的人台面上的钟点照排；没分开的人被人拿念出来的那几晚对上台面册，对不上的一律按撤单算，月底的流水自己填。
      bindings:
      - activity: 核一遍当晚的白账
        place: 三层大班账房
        pair: 2
      - activity: 台下排一个人的档期
        place: 三层不对外小间
        pair: 3
      exits:
      - 把楼上那间小间锁起来，这一个月的档期只排台面上的
      - 交出排期本里自己经手的那几页，退出这一轮
    花榜的名次掉了两位:
      source: 新一期花榜贴出来，名字往下掉了两位，而看榜的人比上一期多了不少。
      engines:
      - 名声保卫
      - 嫉妒与独占
      beats:
        trigger: '{npc}在贴报墙前把那两期榜面对了一遍，指给你看名字挪下去的两行。'
        objective: 掉下去的名次不解释也不申辩，把能做的做在别处
        choice: 可站着听完就走不做任何回应；可当场把上一期揭过的那一角指出来，或回去照原样排钟点
        immediate: 名次照墙上的走，台面册上的钟点也照原样排，谁也不去向贴报人递话
        near: 下一期换榜前街上还会再说一遍；把钟点排满的人名字自己会往上走，去申辩过的人下一期掉得更快
      far_trigger: 连着两期榜面都往下掉而台面册上的钟点没有少时
      far_consequence: 不申辩的人按原钟点继续排，客人自己会回来找；把力气花在找贴报人身上的人下一期被挪到更后面，账房那边也开始把她的钟点排给新人。
      bindings:
      - activity: 花榜贴报墙前听闲话
        place: 花榜贴报墙
        pair: 3
      - activity: 在二层候场廊等下一场
        place: 二层候场廊
        pair: 2
      exits:
      - 换榜那天不出门，这一期榜面不再去看
      - 把台面上认得出的钟点排满，不再跟街上的说法
    化妆间帘子没拉严:
      source: 试衣帘只拉到大半，帘外有人停下脚步，帘里说的话大概被听去了一半。
      engines:
      - 秘密暴露倒计时
      - 共处密闭
      beats:
        trigger: '{npc}把帘子往里又拉了半寸，问你刚才那半句话是从哪一句开始说的。'
        objective: 弄清帘外站的是谁、听去了多少，再决定剩下的半句说不说
        choice: 可把帘子拉严把话说完；可退出帘外在廊上说个能过的话头，或当场停住等下一场开锣
        immediate: 廊上的换场时辰没有变，帘子里的事出了帘子只按能过的那一层讲
        near: 下一次搭扣松了她还来找你；听去半句的人往后在廊上照面，谁先开口谁就把这一句认下来了
      far_trigger: 同一个时辰廊上的人把帘里听来的半句带到贴报墙前时
      far_consequence: 当场把帘子拉严的人下一场照点上台；只讲了个能过的话头的人往后再换行头都要另找一间，管事也开始按场次查帘子拉没拉严。
      bindings:
      - activity: 在化妆间换行头
        place: 化妆间里侧试衣帘后
        pair: 1
      - activity: 台面上落一笔点单
        place: 大班台面册台
        pair: 3
      exits:
      - 换行头改到三层账房，不再走二层这一间
      - 下一场提前上台，把帘子后面的事先搁下
    后门走出去的人被看见:
      source: 从锅炉房后门出去的人被后巷里等车的人认了出来，第二天这台车又来停了一趟。
      engines:
      - 身份风险
      - 对等试探
      beats:
        trigger: '{npc}把锅炉房那本只记时辰不记名字的册子翻到今天，指给你看后门开过的那两笔。'
        objective: 弄清是哪一趟车看见了谁，再决定后门还开不开
        choice: 可照旧开后门并把这几个时辰记下去；可停几天改走横街正门，或让外面那台车换一处停车的地方
        immediate: 后门的闩当夜照插，出入册上只添时辰，谁走的这一笔谁自己认
        near: 那台车再来就该有人去问一趟；往后谁走这扇门都从锅炉房过，锅炉工照旧不问名字
      far_trigger: 那台车第三次停在后巷而册上多出第三个时辰时
      far_consequence: 照旧开后门的人还能按老规矩送人出去，但巷子里等车的人开始认脸；改走正门的那几天账上多出几笔明钟，谁走进来的街上都看得见。
      bindings:
      - activity: 从后门送一个人出去
        place: 衣帽间与锅炉房后门
        pair: 2
      - activity: 从后门送一个人出去
        place: 衣帽间与锅炉房后门
        pair: 0
      exits:
      - 后门这几天插上闩，人一律从正门走
      - 把出入册上那几个时辰划掉，这一阵不再记
    账房要抹掉某一晚:
      source: 楼上有人要账房把某一晚整晚抹掉，白账上会多出一笔对不上月底流水的差数。
      engines:
      - 组织更迭
      - 信任透支
      beats:
        trigger: '{npc}把白账摊开按住其中一页，问这一晚是抹掉还是在月底自己填上。'
        objective: 把这一晚从册子上拿掉，同时想清楚这笔差数月底由谁来填
        choice: 可当场抹掉并自己把差数记下；可只把这一页折起来留到月底再说，或把这一页交出去不做这一笔
        immediate: 抹掉的那一晚当夜从册子上消失，白账上对应的一行留着不销，月底自己填
        near: 月底对账时这一笔要当面说清；抹过一次的人下一回开口前会先被问一句谁填数，问过之后能不能再开口就不由自己了
      far_trigger: 月底结账时白账与台面册的差数超过三笔而没人认账时
      far_consequence: 自己填过差数的人在楼上的分量重一层，楼下的钟点也随她怎么排；把这一页交出去的人下一季不再进账房，排档的名册上换一个人来签字。
      bindings:
      - activity: 核一遍当晚的白账
        place: 三层大班账房
        pair: 0
      - activity: 台下排一个人的档期
        place: 三层大班账房
        pair: 3
      exits:
      - 把账房的钥匙交出去，只排台面上的钟点
      - 这一页留到月底，谁问都说到月底再说
    跑场茶室里有人先问了:
      source: 跑场茶室柜台上有人先搁下一支筹，问的是你手上这一班人，问的时间比你到得早。
      engines:
      - 旧事追索
      - 对等试探
      beats:
        trigger: '{npc}指着柜台上已经搁好的那支筹，问你这一班的行情是从谁那里先听去的。'
        objective: 弄清是谁在你之前把这一班的行情问了出去，再决定接不接这一场
        choice: 可把这一班的行情照实说一遍；可只应下缺人的那一场不多说，或把筹推回去这一班不掺和
        immediate: 应下的那一场当夜记进排期，先搁下的那支筹照旧留在柜台上等下一家
        near: 先问过的那个班子隔两天还会再来问一趟；把行情说实的人往后从茶室听来的话都能对上，推回去的人下一回柜台上的筹就未必还给他留着
      far_trigger: 同一个班子在同一个月的柜台上第三次先搁下筹时
      far_consequence: 照实说的人从茶室里听来的行情都还作数；把筹推回去两次的人在茶室就再也打听不到缺人，只能自己去横街上等班子来问。
      bindings:
      - activity: 跑场茶室打听缺不缺人
        place: 跑场中介茶室
        pair: 1
      - activity: 跑场茶室打听缺不缺人
        place: 跑场中介茶室
        pair: 2
      exits:
      - 从此不进这家茶室，缺人的场子由班子自己来问
      - 把这一班的行情摘出去，只接自己经手的场子
    陪舞不陪身那条线被念出来:
      source: 签约单最下面那一行被人当着两桌客人念了出来，念完还要大班当场给一句准话。
      engines:
      - 赌约生效
      - 旧礼束身
      beats:
        trigger: '{npc}把签约单转过来让最下面那一行朝着你，两桌客人都在等你开口。'
        objective: 当着两桌把这一行的分量说清楚，不说重也不说软
        choice: 可按签约单原文念一遍就收回去；可当场停乐作废这一场，或用一支曲子把话岔到别处
        immediate: 台面册上这一场照旧记着，签约单上那一行不动，作废与否当场见分晓
        near: 往后点单先看那一行的人多了，落字之前要多问一句；把这一行念软过的人再点单时客人会自己往下试
      far_trigger: 同一桌客人在同一季里第二次把那一行念出来时
      far_consequence: 按原文念回去的人台面上的钟点照排，客人点了字就守字；把话岔过去的人当晚还能开乐，往后每一场都要多留一个人在大厅上看着，钟点少了账上自然看得出来。
      bindings:
      - activity: 台面上落一笔点单
        place: 大班台面册台
        pair: 3
      - activity: 停乐清场作废一场
        place: 舞厅大厅乐台
        pair: 2
      exits:
      - 把这一桌的钟点退掉，今晚不再开乐
      - 把签约单收进账房，凭落字的那一本说话
    散场前她没回来:
      source: 台上点到她的钟点，人还没从后门回来，大厅里的乐台已经换到下一场。
      engines:
      - 时限逼近
      - 资源锁定
      beats:
        trigger: '{npc}把下一场的纸剪节目条按在半空，问你台上这一个钟点还留不留。'
        objective: 在这一场换完之前决定是等人还是把钟点让出去
        choice: 可让乐队按住这一场多等一支曲子；可当场把这一行划掉让下一场顶上，或调别的人来接这一个钟点
        immediate: 等人则厅里多留一根灯芯，让出去则台面册上这一行当夜划掉，两边都不补记
        near: 散场后天亮前从后门进来的人不用解释，走过正门的人第二天要当面认这一行；等过几回之后领班开始按人排钟点而不是按册子排
      far_trigger: 同一个人在同一个月的散场前第三次没有按时回来时
      far_consequence: 等过她的人下一班次还照原样留钟点，但领班开始把大厅最靠里的一桌留着不动；划过她的人往后开乐前先看人在不在，大厅的钟点排得越来越松，账上的空档自己显出来。
      bindings:
      - activity: 在二层候场廊等下一场
        place: 二层候场廊
        pair: 0
      - activity: 从后门送一个人出去
        place: 衣帽间与锅炉房后门
        pair: 1
      exits:
      - 今晚这一行划掉，人回来去账房自己认
      - 把下一场的钟点让出去，今晚不再等人
