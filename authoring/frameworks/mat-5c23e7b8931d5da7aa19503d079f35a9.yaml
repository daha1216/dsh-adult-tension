id: mat-5c23e7b8931d5da7aa19503d079f35a9
name: 昭和街角喫茶巡礼
material:
  eras:
  - 昭和末期
  aesthetics:
  - 和风物哀
  - 旧年代质感
  - 温柔颓丧
  - 居合斩落红颜
  - 幕末残雨物哀
  rule: 喫茶店、团地与末班车织成生活路线，老熟客的习惯常比招牌更持久；团地租金、共同生活账与店位租约都按人情与手写簿结，一旦旧账被翻出来，体面丢在柜台前就再捡不回。
  social_rule: 店内预约和寄存物件按手写簿登记，熟客也需要征求店主同意；闲话止于门内，谁先开口谁理亏——同一段旧情被摆到邻店柜台上，几家居位与供货线会一起改排班，外人闲话能砸掉一整条街的生计。
  places:
    昭和喫茶店:
      details:
      - 玻璃柜里放着小份布丁·午后
      - 熟客杯架旁留着新客可选的杯子·午后
      profile:
        privacy: low
        visibility: high
        exits:
        - 面街木框玻璃门
        witnesses:
        - 店内帮工
        - 吧台熟客
        affordances:
        - 试配季节甜点
        - 结束活动并离开
        pressure_modifiers:
        - 备料余量
        - 午后客流
    爵士喫茶:
      details:
      - 唱片封套立在唱机柜旁·夜
      - 背对音箱的角座还空着·夜
      profile:
        privacy: low
        visibility: medium
        exits:
        - 吧台旁通往街面的店门
        witnesses:
        - 店主
        - 安静听曲的客人
        affordances:
        - 挑选晚间唱片
        - 结束活动并离开
        pressure_modifiers:
        - 整面唱片时长
        - 店内约定音量
    团地走廊:
      details:
      - 住户门边试摆着裱框照片·午后
      - 扶手前划出不可堆物的空带·午后
      profile:
        privacy: low
        visibility: high
        exits:
        - 楼梯口通向团地庭院
        witnesses:
        - 进出住户
        - 楼栋管理人
        affordances:
        - 布置住户作品展
        - 结束活动并离开
        pressure_modifiers:
        - 检修围挡
        - 门扇开启幅度
    钱汤:
      details:
      - 营业前的门厅柜台摊着手绘告示·日间
      - 入口能看见通往不同更衣区的指向牌·日间
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 门厅外街道
        witnesses:
        - 钱汤店主
        affordances:
        - 设计更衣区告示
        - 结束活动并离开
        pressure_modifiers:
        - 开门前的试挂时间
        - 从柜台看字的距离
    车站前旅馆:
      details:
      - 旅馆前厅贴着末班列车时刻表·傍晚
      - 柜台简图旁压着几张早餐店名片·傍晚
      profile:
        privacy: low
        visibility: high
        exits:
        - 前厅门通向站前街
        witnesses:
        - 旅馆前台
        - 查时刻表的旅客
        affordances:
        - 补画街区导览
        - 结束活动并离开
        pressure_modifiers:
        - 末班车时刻
        - 各店营业时间
    站前钱汤脱衣所·长凳与体重秤前:
      details:
      - 营业前用白布盖住的长凳上摊着估价单·清晨
      - 药汤木槽边并排摆着两只成对浴桶与一份抵押清单·傍晚
      profile:
        privacy: medium
        visibility: low
        exits:
        - 穿过脱衣所木隔门退回钱汤前厅
        witnesses:
        - 钱汤店主
        - 在后间做账的店主妻子
        affordances:
        - 核对抵押单上的物项
        - 结束活动并离开
        pressure_modifiers:
        - 开门前两小时的清洗时段
        - 锅炉燃料余量
    鸭川町屋素面雨廊:
      details:
      - 雨廊内侧摆着从京都寄来的织补木样·晚
      - 拉门里侧叠着两床客人用的铺盖·深夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 沿町屋石板路退到鸭川河岸边
        witnesses:
        - 同院的町屋邻居
        - 町屋管理人
        affordances:
        - 核对木样与账目
        - 结束活动并离开
        pressure_modifiers:
        - 梅雨雨势与廊下漏水
        - 邻居起夜开门的声响
    京福线终点站前的通宵候车室:
      details:
      - 长椅上摊着折起的时刻表与列车晚点告示·深夜
      - 朝外的玻璃映出两人并坐的影子与窗上霜气·深夜
      profile:
        privacy: low
        visibility: medium
        exits:
        - 推门就是站前广场与唯一一班始发车
        witnesses:
        - 打盹的车站值班员
        - 等末班车的旅客
        affordances:
        - 核对末班车时刻
        - 结束活动并离开
        pressure_modifiers:
        - 末班车到发时刻
        - 候车室夜间取暖火盆
    祗园艺妓置屋纸拉门后:
      details:
      - 纸拉门后的三叠茶席摆着记录器物去向的台帐·夜间
      - 廊下挂着与帐面件数不符的两条腰带·日间
      profile:
        privacy: medium
        visibility: low
        exits:
        - 由屋主许可的玄关退到祗园石板街
        witnesses:
        - 置屋当家人
        affordances:
        - 核对台帐与物项
        - 结束活动并离开
        pressure_modifiers:
        - 台帐换记与验收日期
        - 当家人愿意当众说明的分寸
    洗浴中心相邻的午夜大浴场:
      details:
      - 并床夜宿的铺位上叠着两份未结清的更衣柜租约·深夜
      - 大浴场水汽里的挂钟停在末班车时间之后·深夜
      profile:
        privacy: low
        visibility: medium
        exits:
        - 从夜宿区出口走到站前大路
        witnesses:
        - 值夜班的清洁工
        affordances:
        - 核对过夜费用与铺位
        - 结束活动并离开
        pressure_modifiers:
        - 更衣柜租约到期日
        - 大浴场夜间清扫时段
  pairs:
  - family: 服务与手艺
    position: 相亲对象
    appellations:
    - 直呼其名
    npc:
      role: 喫茶店经营者
      function: 试配甜点并安排自家店内接待
      authority: 决定自家菜单小批试卖与借墙时段
      resource: 备料份额、熟客杯架与手写寄存簿
      limitation: 不能代邻店许诺展位，也无法随意处置寄存唱片
      obligation: 说明食材并将寄存物与店产分开
      exposure: 备料失算会吃掉当天毛利，误处置旧物会失去熟客
      hidden: —
    player:
      identity: 地方杂志摄影师
      baseline: 你曾给喫茶店拍过一张店主愿意挂出的门面照；这次店主请你试新甜点，照片由你决定是否拍。
      resources:
      - 胶片相机与剩余底片
      - 已核对的街区店址
      reputation: 你在拍人前问一句，也会收起相机单纯吃饭
    relationship_reason: 你曾给喫茶店拍过一张店主愿意挂出的门面照；这次店主请你试新甜点，照片由你决定是否拍。
  - family: 艺术与传播
    position: 前任
    appellations:
    - 直呼其名
    npc:
      role: 地方杂志摄影师
      function: 以胶片记录街区并协助布展
      authority: 安排自己的拍摄与样片出借，不决定邻店经营
      resource: 手绘告示的样稿与字号排版经验、两张常在爵士喫茶播放的私藏唱片
      limitation: 底片不能即时回看，营业中的钱汤更衣区不拍摄
      obligation: 返还原照片并依本人意愿撤下展品
      exposure: 一次未经同意的刊图会失去街坊拍摄信任
      hidden: —
    player:
      identity: 喫茶店经营者
      baseline: 他的照片总送到你店隔壁的冲印所，等取件的末班车空档成了你们打烊后听一张唱片的习惯；他收起相机，不把相聚当采访。
      resources:
      - 打烊后仍留灯的一小时店堂
      - 和爵士喫茶店主换听唱片的交情
      reputation: 你记得熟客喜好，但愿给新人的口味留位置
    relationship_reason: 他的照片总送到你店隔壁的冲印所，等取件的末班车空档成了你们打烊后听一张唱片的习惯；他收起相机，不把相聚当采访。
  - family: 服务与手艺
    position: 旧识
    appellations:
    - 先生
    npc:
      role: 钱汤店主
      function: 照看夜间锅炉与脱衣所清洗，兼收街区里不愿进店的手递物件
      authority: 能决定自家钱汤开门时刻与脱衣所借放时段
      resource: 脱衣所长凳、锅炉燃料与一本手写的借放登记
      limitation: 锅炉燃料按周定量，抵押物不能替他做主，也不能替别人签字取走
      obligation: 把抵押物项与店产分开登记，并在开门前清账
      exposure: 替人代收一次说不清来路的物件，锅炉燃料与街坊信任会一起被扣住
      hidden: 他收下过几件没人来取的东西，从没写进过台帐
    player:
      identity: 在钱汤做了七八年的熟客
      baseline: 你在这家钱汤泡了七八年，洗到一半的毛巾放在哪个钉子你都记得；店主会在开门前把长凳上的东西挪给你看，只问你要不要接。
      resources:
      - 在钱汤出入自由的门厅关系
      - 街区内几家店铺的闲话与排班消息
      reputation: 你替人说好话，也替人守过秘密，街坊不敢拿你当外人
    relationship_reason: 你在钱汤泡了七八年，他会在开门前把长凳上的东西挪给你看；这份不设防的出入权，比任何一句情面都重。
  - family: 服务与手艺
    position: 服务提供者
    appellations:
    - 客人
    npc:
      role: 鸭川町屋管理人
      function: 照看町屋空屋与代收来信，替来客留一处能落脚的廊下
      authority: 能决定町屋空屋的临时留宿与廊下使用权
      resource: 空屋钥匙、日式旅舍铺位与一层阁楼的借住关系
      limitation: 只能留宿到下一班车，不能替任何人改接收地址，也不能把町屋改成长期住处
      obligation: 登记借住天数并把客人带来的东西写进台帐
      exposure: 留宿被邻居看见，町屋的临时使用权和邻里信任会一起回收
      hidden: 他的台帐里空着几行的日子，其实有人在廊下睡过
    player:
      identity: 为修复旧木样临时来京都的摄影师
      baseline: 你在京都只待到下一班车，铺盖和廊下的位置都是临时的；管理人让你把木样和换洗衣服放在同一角，走的时候一起收走。
      resources:
      - 一床日式旅舍的铺盖
      - 手袋里与木样放在一起的客人信物
      reputation: 你只借住到该走的日子，走前会把廊下收拾成没住过人的样子
    relationship_reason: 管理人破例让只待一班车的你在廊下住了几天；你们都知道这条廊下不属于任何人，铺盖要叠得跟没打开过一样。
  - family: 艺术与传播
    position: 旧识
    appellations:
    - 前辈
    npc:
      role: 祗园艺妓置屋当家人
      function: 按台帐清点器物与腰带，安排艺事的交接与验收
      authority: 能决定自家器物借出与台帐登载，决定谁在场验收
      resource: 器物台帐、腰带库存与置屋走廊上的一间三叠茶席
      limitation: 不能替艺人许下私人事，也不能把登错的台帐当场划掉
      obligation: 按件核对并把差额当众说明来源
      exposure: 台帐与实物一件对不上，当家人要当众改记，置屋的名声跟着走
      hidden: 有两条腰带的去处，台帐上写的是外借，实际挂在自家廊下
    player:
      identity: 替地方杂志做口述记录的摄影师
      baseline: 你替地方杂志做过几段口述记录，在祗园一带算半个熟人；这次你带着同一批记录回来核对，承认写过什么不再只是你一个人的事。
      resources:
      - 几段口述记录的誊抄稿
      - 在祗园走动的介绍人关系
      reputation: 你记录过的人知道你会把稿子先给他们看一遍
    relationship_reason: 你替杂志记录过艺事，当家人让你在茶席旁听过一段谈话；这次你带着誊抄稿回来，承认写过什么就成了不能推的事。
  activities:
    试配季节甜点:
      places:
      - 昭和喫茶店
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}把一份甜点分成两种甜度的小样，先问你愿不愿尝、有没有避开的食材。'
      beats:
        trigger: '{npc}把一份甜点分成两种甜度的小样，先问你愿不愿尝、有没有避开的食材。'
        objective: 试出适合日常供应的小份配方
        choice: 尝一小口，或只帮摆盘；不吃甜可喝无糖茶
        immediate: 留下被选的甜度和份量，不合口味的小样不再劝食。
        near: 店主先小批量试卖，摄影师可拍成品，但不以熟客反馈担保销量。
    挑选晚间唱片:
      places:
      - 爵士喫茶
      pairs:
      - 1
      category: 日常接触
      action: '{npc}拿出两张获店主许可播放的唱片，问你愿听完整一面还是只听一曲。'
      beats:
        trigger: '{npc}拿出两张获店主许可播放的唱片，问你愿听完整一面还是只听一曲。'
        objective: 共享一段不用于采访的音乐时间
        choice: 选一曲，或安静听对方选；也可坐到不正对音箱的位置
        immediate: 曲目与座位随两人的偏好调整，听感无需写成评论。
        near: 唱片归回原套，两人记住彼此喜欢的声音，不产生供稿任务。
    布置住户作品展:
      places:
      - 团地走廊
      pairs:
      - 0
      category: 空间与退出
      action: '{npc}把住户授权展出的照片靠墙试摆，邀你从走廊一端走过看看。'
      beats:
        trigger: '{npc}把住户授权展出的照片靠墙试摆，邀你从走廊一端走过看看。'
        objective: 让照片可看且不挡住日常出入
        choice: 试摆一组，或站在住户门前检查开门幅度；不参加可让摄影师独自试摆
        immediate: 展位退到不影响房门和扶手的一侧，放不下的照片先留在相册。
        near: 住户可要求撤下自家照片，展览改为轮换，不拿长期占走廊换完整展出。
    设计更衣区告示:
      places:
      - 钱汤
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}在钱汤尚未营业的门厅举起告示，请你从柜台外看字号和方向。'
      beats:
        trigger: '{npc}在钱汤尚未营业的门厅举起告示，请你从柜台外看字号和方向。'
        objective: 确认更衣区指引能从公共入口读懂
        choice: 站远核对字样，或请店主念一遍；不进更衣区也能完成
        immediate: 箭头与字样在入口得到核验，样稿不用拍摄在场客人。
        near: 店主按验证后的字号换牌，摄影师只交版式，不取得营业时拍摄许可。
    补画街区导览:
      places:
      - 车站前旅馆
      pairs:
      - 0
      category: 空间与退出
      action: '{npc}对照旅馆门厅的列车时刻表，问你要走早餐短线还是多逛一家店。'
      beats:
        trigger: '{npc}对照旅馆门厅的列车时刻表，问你要走早餐短线还是多逛一家店。'
        objective: 选出能按时回站的街区路线
        choice: 走近站短线，或留在门厅听店家推荐；不同行可以各自回店
        immediate: 路线带着折返点和预计步行时间，关门小店不被当成必访站。
        near: 来客可用简图独自行走，两人只约下一次碰面的店，不默认全程陪同。
    门店广播把寄存人的名字念出来:
      places:
      - 昭和喫茶店
      pairs:
      - 0
      category: 第三方与打断
      action: 店内扩音喇叭念出一个久没人来取的寄存人名字，{npc}抬头看向那格杯架。
      beats:
        trigger: 店内扩音喇叭念出一个久没人来取的寄存人名字，{npc}抬头看向那格杯架。
        objective: 当场决定这个寄存物该怎么处理、要不要应声
        choice: 代应一声先把人留下；不代应只记下时间；直接请店主把喇叭关掉
        immediate: 广播照旧念完，应答与否当天就会被吧台熟客记住。
        near: 长期没人取的寄存物必须拿出一个代管说法，不能一直挂在杯架上。
    隔着脱衣所的长凳把估价单推过来:
      places:
      - 站前钱汤脱衣所·长凳与体重秤前
      pairs:
      - 2
      category: 信息交换
      action: '{npc}把一张写着估价的抵押单压在自己的木盆底下，从长凳另一头推给你看。'
      beats:
        trigger: '{npc}把一张写着估价的抵押单压在自己的木盆底下，从长凳另一头推给你看。'
