id: mat-5eb6b8ace29355a28f3fe076f9834afe
name: 流动马戏与机械舞台
material:
  eras:
  - 维多利亚暗黑马戏团
  aesthetics:
  - 维多利亚哥特怪诞
  - 流动马戏黑夜奇谭
  - 蒸汽与黄铜
  rule: 巡演团把机械布景、训练和旅途生活装进车队，每站都要重新搭台；后台铜锁进出须反拧两圈并在值班表上落名，未排班者不得探视；大帐帷幕拉开前油彩须抹匀定妆，落一滴就得重上，开演前十息由合格机械师复核承重销与搭扣，谁签的值班谁认这一段。
  social_rule: 未经排练确认的装置不用于演出，观众热情不能替代安全检查；后台进出以铜锁反拧与值班落名为准，探视须排班者当面应下；幕前定妆不合格不得出场，机关段一经停用，任何人不得以赶场为由把它重新开起来。
  places:
    流动马戏团大篷车:
      details:
      - 大篷车折桌展开纸板舞台模型
      - 油灯在固定灯位投出夸张剪影，车轮已垫稳
      profile:
        privacy: medium
        visibility: low
        exits:
        - 收起模型后由车门踏步回营地空地
        witnesses:
        - 同车休息的布景助手
        affordances:
        - 设计巡演剪影
        - 比较两种剪影出场顺序
        pressure_modifiers:
        - 模型可折叠体积
        - 灯影角度
    红丝绒马戏大帐篷:
      details:
      - 红丝绒帐篷里观众席空着，幕布机构停在检验位
      - 舞台侧边留出机械师看清全行程的通道
      profile:
        privacy: low
        visibility: high
        exits:
        - 从标明的侧门离帐，不经过幕布运动范围
        witnesses:
        - 机械师与当班舞台监督
        affordances:
        - 试排机械幕布
        - 用已核准速度排练换场口令
        pressure_modifiers:
        - 装置检验结果
        - 可用排练时长
    马戏团宿营地:
      details:
      - 宿营火边的行李箱放着上一站淋湿的节目单
      - 装订线与修补纸铺在干毯上，私人信件留在各自主人的袋里
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 沿营车间空路回本人住宿或营门
        witnesses:
        - 自愿来帮忙的团员
        affordances:
        - 装订巡演日志
        - 修复脱线书脊并选择私人留页
        pressure_modifiers:
        - 纸页干燥程度
        - 撤营前可用闲暇
    猛兽铁笼暗室车厢:
      details:
      - 铁笼车厢的插销在外侧加装双道锁扣，笼内只留一盏挂灯·深夜
      - 车厢地板上的抓痕沿栏杆走向延伸，喂食口下方积着未清的木屑·深夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 抽出外侧双道锁扣后从车门跳回营地空地
        - 沿车厢侧梯退到巡演车道
        witnesses:
        - 值夜的驯兽助手
        - 巡场营地看守
        affordances:
        - 检查双道锁扣的咬合
        - 隔着栏杆确认笼内状态
        pressure_modifiers:
        - 挂灯油量
        - 野兽当夜的躁动程度
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 师傅
    npc:
      role: 舞台机械师
      function: 检验幕布传动与折叠布景，判定能否进入排练
      authority: 能停用本团不合格装置，复用须实际复检
      resource: 检修图、合规格备件与空载检验时段
      limitation: 不能指挥演员加班或用演出热度抵消失效零件
      obligation: 把不可用部件隔开，向编排员说明会影响哪次换场
      exposure: 抢修失误会损害团员工作能力和自己的长期雇用
    player:
      identity: 巡演节目编排员
      baseline: 你想把奇观讲成一个完整故事，也知道每个人都要收箱、吃饭和睡觉。
      resources:
      - 可重排的节目卡
      - 已确认的表演者排练时间
      reputation: 删节目也交代被删者的去处
    relationship_reason: 机械师曾用一个静态影子替编排员救回太长的转场，两人开始在大篷车模型上共同找戏剧效果。
  - family: 艺术与传播
    position: 同侪
    appellations:
    - 制作人
    npc:
      role: 巡演节目编排员
      function: 安排段落与演员出入场，并协商删减
      authority: 能提出节目顺序，改演与加班须获表演者和团主同意
      resource: 沿途各站的场地尺寸与准演时长记录、各段落实测的换场耗时
      limitation: 无权宣布装置合格，也不能让私人日志自动变宣传素材
      obligation: 让删掉段落的人知道工钱怎样结算
      exposure: 安排不当会让演员白等或错过下一站合约
    player:
      identity: 舞台机械师
      baseline: 你喜欢漂亮舞台，也需要编排员看见每次多加运动都要有人检修。
      resources:
      - 一只计秒怀表与手摇试验柄
      - 随车记了三站的维护台账
      reputation: 先说明停在哪里再谈快多少
    relationship_reason: 编排员上次把收箱时间写进排程，让机械师赶上晚饭；机械师愿在下一轮试排前听完他的段落设想。
  activities:
    设计巡演剪影:
      places:
      - 流动马戏团大篷车
      pairs:
      - 0
      category: 信息交换
      action: '{npc}把两个纸影放到模型灯前，邀你挑哪一个先出场更像故事开头。'
      beats:
        trigger: '{npc}把两个纸影放到模型灯前，邀你挑哪一个先出场更像故事开头。'
        objective: 用顺序与留白形成舞台错觉，而不增加实机负担
        choice: 可换一次纸影顺序；可只讲观感，或把模型合上聊旅途
        immediate: 顺序一换，观众会先注意怪诞轮廓或人物动作，选择体现在可复看的模型里
        near: 喜欢的版本再与演员商量，不因桌边试影就锁定演出
    试排机械幕布:
      places:
      - 红丝绒马戏大帐篷
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}在机械师已核准的排练段请你看幕布落定后演员还有多久能走到位。'
      beats:
        trigger: '{npc}在机械师已核准的排练段请你看幕布落定后演员还有多久能走到位。'
        objective: 检验现有安全速度下的段落衔接
        choice: 可观察一个完整换场；可只试口令，或让舞台监督接手后离开
        immediate: 赶不上就增加静场或调整顺序，不要求机械师把装置越开越快
        near: 下一次彩排采用新的出入场间隔，没试过的转场不算通过
    装订巡演日志:
      places:
      - 马戏团宿营地
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}摊开自己的脱线日志，问你愿不愿帮忙托住书脊，让它不再掉页。'
      beats:
        trigger: '{npc}摊开自己的脱线日志，问你愿不愿帮忙托住书脊，让它不再掉页。'
        objective: 修好承载私人回忆的旧本子
        choice: 可托页缝回；可只选一张本人节目单做书签，或不翻日志只在火边坐着
        immediate: 书脊恢复能翻阅的状态，主人不愿展示的页保持合拢
        near: 修好的本子随主人去下一站，不自动成为团主宣传册
    夜锁铁笼车厢:
      places:
      - 猛兽铁笼暗室车厢
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}把挂灯挑亮一些，让你看清外侧那两道锁扣今晚咬得深不深。'
      beats:
        trigger: '{npc}把挂灯挑亮一些，让你看清外侧那两道锁扣今晚咬得深不深。'
        objective: 确认双道锁扣能扛住演出前的躁动
        choice: 逐道压扣试咬合；只照看挂灯油量；把钥匙交回巡场看守不再碰锁
        immediate: 咬不住的锁扣当场挂上停用牌，笼门在复检前不再打开
        near: 复检通过才排进次日的驯兽段，用旧锁扣撑场的那一段先撤下来
    临场替她束护腕:
      places:
      - 红丝绒马戏大帐篷
      pairs:
      - 1
      category: 身体靠近
      action: '{npc}把两只皮质护腕递到你手上，说开场前那口气只有你能替她收住。'
      beats:
        trigger: '{npc}把两只皮质护腕递到你手上，说开场前那口气只有你能替她收住。'
        objective: 把护腕束到既吃得住力又不勒住腕子的那个位置
        choice: 替她扣紧并当场拉拽试一次；只递过去让她自己束；让舞台监督接手这活
        immediate: 束好的护腕先在空架上拉过一回，扣子松的当场拆下来重扣
        near: 当夜空中段的承重就压在这副护腕上，谁束的由当天排班记名
    抹匀眼角油彩:
      places:
      - 流动马戏团大篷车
      pairs:
      - 0
      category: 身体靠近
      action: '{npc}把油彩盘推到灯下，说眼角那道裂口自己抹始终抹不均匀。'
      beats:
        trigger: '{npc}把油彩盘推到灯下，说眼角那道裂口自己抹始终抹不均匀。'
        objective: 在开幕前把眼角油彩抹平，不遮住上镜的那道旧痕
        choice: 用指尖替她匀开；只把油彩盘摆正让她自己来；叫布景助手另找一面镜子
        immediate: 抹过的那一半在灯下再过一遍，糊掉的拿湿布擦掉重来
        near: 这一场的脸面按两人的手确定，卸妆前谁都不再动人眼角那一道
  customs:
  - 每次撤营会在旧海报背面画下下一站的路标。
  pressures:
    机械布景拒绝通过检查:
      source: 机械师在下一轮换场前发现连接件磨损，撤回该装置的可用确认。
      engines:
      - 资源锁定
      - 时限逼近
      beats:
        trigger: '{npc}发现机械师在下一轮换场前发现连接件磨损，撤回该装置的可用确认。'
        objective: 以已通过的静态布景或删段完成可兑现的演出
        choice: 采用模型验证过的静态影子；或取消该段，另谈受影响演员的工钱
        immediate: 装置退出运行，编排员改段落而不把维修任务丢给不具资格的人
        near: 维修材料须等下一站采购，当前节目长度与布景装箱量都会改变
      far_trigger: 连续两站仍无合规格替换件
      far_consequence: 团里需把静态版正式纳入节目并减少机械承诺，避免每站临时加班
      bindings:
      - activity: 试排机械幕布
        place: 红丝绒马戏大帐篷
        pair: 1
      exits:
      - 取消该装置段落并按约结算已做排练
      - 机械师交代停用范围后结束当班，后续采购由团主接手
    演出许可时段缩短:
      source: 舞台监督带回场地准演时间，少于原节目和正常撤场所需总时长。
      engines:
      - 第三方施压
      - 债务压力
      beats:
        trigger: '{npc}发现舞台监督带回场地准演时间，少于原节目和正常撤场所需总时长。'
        objective: 删减内容但不靠压缩安全换场和不付工钱补齐差额
        choice: 与演员商量删一个完整段落；或取消该场按收款关系退票
        immediate: 已核准换场速度不变，被删演员不用继续空等排练
        near: 补演必须重谈日期和报酬，编排员不能用未来曝光抵今天工钱
      far_trigger: 下站团主仍把本次未演段落算作免费欠演
      far_consequence: 表演者会退出车队，原有节目组合无法维持；结清当前工作才有后续重排空间
      bindings:
      - activity: 试排机械幕布
        place: 红丝绒马戏大帐篷
        pair: 1
      - activity: 设计巡演剪影
        place: 流动马戏团大篷车
        pair: 0
      exits:
      - 拒绝新增无偿补演，按约结束本场工作
      - 取消本场并由收款方退款，各人收回自己的道具
    旧人回归:
      source: 当年带走团里一半节目单的那位，隔了两站又跟着车队回来，还带着团主签的旧约。
      engines:
      - 旧事追索
      - 旧情重逢
      beats:
        trigger: '{npc}在宿营火边把一张旧约拍在行李箱上，说那位隔了两站又跟回来了，手里还有团主的字。'
        objective: 弄清她这次回来是补演还是拆团
        choice: 摊开旧约逐条对当年的账；当面问清她带回来的段子归谁；等团主回来再谈
        immediate: 旧约摊在火边不动手撕，两拨人的道具各自归箱，当晚不排她的段子
        near: 团主回来后按旧约决定留人还是清账，被压下的段子暂不进节目单
      far_trigger: 下一站开演前旧约仍没人认账
      far_consequence: 两拨人为节目单当众撕破，车队在镇上散一次；先把账对上才留得住人
      bindings:
      - activity: 装订巡演日志
        place: 马戏团宿营地
        pair: 0
      exits:
      - 把旧约原样退回，不再接收她带回来的段子
      - 只留下旧约抄件，当夜离开车队另谋活儿
    舞台飞刀机关被动过手脚:
      source: 开演前试刀时落点偏了半掌，插销上的新锉痕说明有人动过机关又装了回去。
      engines:
      - 秘密暴露倒计时
      - 身份风险
      beats:
        trigger: '{npc}把落偏的那支刀从靶上拔出来，指给你看插销上那道新锉痕。'
        objective: 在开演前查清是谁动过飞刀机关
        choice: 封了这段换静态节目演；当众查问所有碰过机关的人；照常开演但守在场侧盯落点
        immediate: 机关段当场停用，靶位下清空观众，锉痕那支刀单独收进工具箱
        near: 旧锉痕与当晚的值班表一起交给团主，谁碰过机关由排班对上，误了场次自行担责
      far_trigger: 下一站机关段复排时锉痕再次出现
      far_consequence: 团里只能永久砍掉飞刀段，动过手的那人会被同队的人先揪出来
      bindings:
      - activity: 试排机械幕布
        place: 红丝绒马戏大帐篷
        pair: 1
      - activity: 夜锁铁笼车厢
        place: 猛兽铁笼暗室车厢
        pair: 0
      exits:
      - 把机关段整体撤下，退还该段的加演钱
      - 交出自己当班那一段的记录后离开车队
    时限临门:
      source: 场地只批到午夜，撤场时限一到就断灯，赶不上把大帐和铁笼车厢一起拆完。
      engines:
      - 时限逼近
      - 资源锁定
      beats:
        trigger: '{npc}看着时辰牌说这场只批到午夜，灯一断大帐和铁笼车厢都拆不完。'
        objective: 在断灯前排定撤场顺序，不丢装置也不丢人
        choice: 先拆大帐再抬铁笼车厢；把铁笼车厢留在场上过夜；跟场地看守谈多批一个时辰
        immediate: 先拆的那部分当场装车，没拆到的一律加锁并留人值夜
        near: 下一场地按这次实际耗时重新约时间，超时的那部分运费由团里自己认
      far_trigger: 连赶两站都卡在断灯前完不成撤场
      far_consequence: 车队被人占了位子只能丢装置，节目长度被迫砍掉一整个机关段
      bindings:
      - activity: 装订巡演日志
        place: 马戏团宿营地
        pair: 0
      - activity: 夜锁铁笼车厢
        place: 猛兽铁笼暗室车厢
        pair: 0
      exits:
      - 把未拆的装置折价让给场地，当夜出发
      - 只交还借来的场地钥匙，不再承担后续拆装
    空中飞人搭扣松动前一刻:
      source: 空中段开演前十息，检查的人摸到主搭扣的销子已经退出一线，绳上的人正等着登梯。
      engines:
      - 时限逼近
      - 身份风险
      beats:
        trigger: '{npc}在登梯前一刻把你叫到场侧，说主搭扣的销子已经退出一线了。'
        objective: 在铃声响起前决定叫停还是换扣
        choice: 当场叫停并换主搭扣；只加一道保险绳照演；按原样开演自己站到场侧盯着
        immediate: 换扣期间铜铃不响，绳上的人退回后台，观众席只当是延场
        near: 这一段要不要补演由团主与表演者当面定，赶场不能拿主搭扣赌
      far_trigger: 下一次大场仍用这副退过一线的旧搭扣
