id: mat-63910e70d6515d33b712a1b3251b5d60
name: 雾都钟表与港务街
material:
  eras:
  - 维多利亚雾都
  aesthetics:
  - 哥特幽暗
  - 蒸汽与黄铜
  - 维多利亚哥特怪诞
  rule: 雾中的街区依靠钟表、港务信号和公共告示协调运转，封雾一起，港务所的靠泊登记与旅店铺位号牌同时紧张，谁的钟快谁的船先靠不再是私事；更次记录与快修件流水按季封存待查，行会上报按误差排次，钟表匠只能校仪器，不得把每一次校准改写成对自己有利的数。
  social_rule: 进出仓库须核对许可，私人介绍不能替代货物凭证；封港期间号牌与铺位按到港先后封存，不得替关系户插队占位；代客保管的钟件与没上本的快修件须逐件登记经手人，同业上报只填自己经手那几栏，不许把别人走时写成自己的投名状。
  places:
    雾码头仓库:
      details:
      - 雾码头仓库门口可听到港钟而看不清钟面
      - 收货桌边放着机械怀表与港务所送来的电报副本
      profile:
        privacy: low
        visibility: medium
        exits:
        - 沿仓库行人门退到岸侧通道，避开装卸范围
        witnesses:
        - 仓库门房与当班收货人
        affordances:
        - 校对港口钟声
        - 比较听到的钟声与怀表指针
        pressure_modifiers:
        - 雾与声传播差异
        - 正式船期版本
    帽店试帽间:
      details:
      - 帽店试帽间在开店前借出一角摆手艺小展
      - 镜前凳与衣帽架仍须留给当天客人
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 整理展架后经店面门厅离开
        witnesses:
        - 帽店掌柜
        affordances:
        - 布置街区工艺展
        - 试走试帽凳与小展架之间的通道
        pressure_modifiers:
        - 店家正常营业需求
        - 展件尺寸
    雾都洋馆:
      details:
      - 洋馆主人许可查看门厅旧钟，深处房间不对来客开放
      - 钟壳上的制作者铭牌与机芯后加修补印记位置不同
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从门厅经访客门退出庭院
        witnesses:
        - 管家或钟的保管人
        affordances:
        - 核对旧钟铭牌
        - 比较原制作者与后次维修署名
        pressure_modifiers:
        - 主人允许打开的部位
        - 旧维修账是否留存
    私立诊察室:
      details:
      - 私立诊察室的候诊区挂钟在空诊时被取下
      - 桌面只放钟件，病历与诊疗柜在内间
      profile:
        privacy: medium
        visibility: low
        exits:
        - 装回钟或交接停用状态后经候诊前门离开
        witnesses:
        - 诊所接待员
        affordances:
        - 调整候诊室挂钟
        - 试听摆动并校准候诊报时
        pressure_modifiers:
        - 诊所开诊时刻
        - 挂钟可用配件
    港务街钟楼外廊:
      details:
      - 钟楼外廊的铁栏杆挂着当日结冰的报时钟锤·黄昏
      - 港务记事板钉着多份互相矛盾的雾季靠泊通告·黄昏
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿外廊螺旋梯下到港务所前厅
        - 从钟楼侧门退出，避开正门的排队货主
        witnesses:
        - 值守钟楼的报时差役
        - 等候消息的货主与船工
        affordances:
        - 比对不同版靠泊通告
        - 听钟锤是否照点落下
        pressure_modifiers:
        - 雾季能见度
        - 钟锤结冰程度
    港务街零工等候角:
      details:
      - 货栈墙根蹲着一圈等派工的人，脚边压着各自的铜号牌·清晨
      - 墙上粉笔写着一周工价，被雨水冲掉半行·清晨
      profile:
        privacy: low
        visibility: high
        exits:
        - 穿过货栈街口回到港务所一侧
        - 被派上船者直接进装卸范围
        witnesses:
        - 派工的货栈记账人
        - 一同等工的街坊
        affordances:
        - 核对号牌与派工顺序
        - 打听哪趟船临时改了期
        pressure_modifiers:
        - 当班派工缺口
        - 封港大雾是否解除
    帽店地下熨烫间:
      details:
      - 蒸汽熨斗的铜管沿砖墙走，试帽间的镜台支架从这里升起·午后
      - 备用帽坯堆到齐胸高，只留一人侧身过的通道·午后
      profile:
        privacy: medium
        visibility: low
        exits:
        - 踩木梯回到帽店试帽间
        - 从后巷卸货门出店
        witnesses:
        - 帽店的熨烫伙计
        affordances:
        - 调整升高试帽镜台的支撑
        - 清点备用帽坯占位
        pressure_modifiers:
        - 当日记账的帽坯周转
        - 铜管蒸汽压力
    交易所对面的机械茶房:
      details:
      - 茶房二楼临窗位正对交易所正门，桌面刻满历年行情简写·夜
      - 靠里两副座位用半扇屏风隔开，各自谈话互不成句·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 下楼经茶房正门回到雾都街面
        - 从侧巷便门离开，不经过交易所门口
        witnesses:
        - 茶房跑堂
        - 邻座同为等消息的客人
        affordances:
        - 核对窗内座次与入场顺序
        - 隔屏风听清相邻谈话是否针对自己
        pressure_modifiers:
        - 交易所散场时刻
        - 屏风遮断程度
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 师傅
    npc:
      role: 钟表维修师
      function: 检修机械钟并比较走时误差
      authority: 可停用自己检修的挂钟，正式港钟调整须获港务方授权
      resource: 校过的怀表、修钟手具与同尺寸备件
      limitation: 不能靠校表更改船期，也不接触病历判断诊疗
      obligation: 说明误差范围和复查日期，不把调快当修好
      exposure: 走时失准会让货主或候诊者错过约定
    player:
      identity: 港务档案整理员
      baseline: 你擅长找日期，却愿意亲自听一次钟声，理解记录和器物之间的距离。
      resources:
      - 可公开使用的船期副本
      - 获得借阅许可的工艺旧账
      reputation: 新旧版本不混放
    relationship_reason: 维修师帮档案员找出一回所谓船期差错其实是门房怀表慢了，两人此后会在现场先分清问题来自钟还是电报。
  - family: 学术与专业
    position: 同侪
    appellations:
    - 先生
    npc:
      role: 港务档案整理员
      function: 区分船期电报版本并查找港务旧记录
      authority: 可提供获准查阅的副本，装卸调度由港务员决定
      resource: 街区作坊的借展清单、各件展品的出处短注与帽店开店前的借展时段
      limitation: 不能改港钟或凭一张旧账判断钟的市场价值
      obligation: 保留原报来源，让收货人知道哪版已被替代
      exposure: 旧船期误发会造成工人白等与仓位占用
    player:
      identity: 钟表维修师
      baseline: 你留着他核对电报时刻惯用的那半块黑板，他把你的报废机芯写进了工艺展清单；谁做的、谁修的，你们总分开注明。
      resources:
      - 几枚留着旧补痕的报废机芯
      - 讲得出各件修理年头的老主顾
      reputation: 先找误差来源再动指针
    relationship_reason: 他抄船期每天两趟路过你的钟表铺，多年来一直借你门旁的校时黑板对电报时刻；街区工艺展的合议就是从这块黑板前开始的。
  activities:
    校对港口钟声:
      places:
      - 雾码头仓库
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}站在仓库行人门内举起怀表，邀你分别记下听到钟声与看到秒针的位置。'
      beats:
        trigger: '{npc}站在仓库行人门内举起怀表，邀你分别记下听到钟声与看到秒针的位置。'
        objective: 分辨自己的表差、听声差与正式船期改动
        choice: 可观察两个报时间隔；可只问怎么比较，或交给门房继续
        immediate: 不一致先分来源，不因一次听声就改港钟或叫工人开工
        near: 多次可比对的误差才交有权维修者处理，参与者不承担港务值班
    布置街区工艺展:
      places:
      - 帽店试帽间
      pairs:
      - 1
      category: 空间与退出
      action: '{npc}把钟表小展架推到镜前，问你坐在试帽凳上还能不能方便起身。'
      beats:
        trigger: '{npc}把钟表小展架推到镜前，问你坐在试帽凳上还能不能方便起身。'
        objective: 在正常营业空间容纳小展，不让观展占掉试帽用途
        choice: 可帮忙移动一架并试走；可只看展件，或选择不借这块地方
        immediate: 移动后空出衣帽架与前门之间的通路，摆不下的展件收回箱中
        near: 掌柜可按营业情况随时缩展，不需要维持一个妨碍生意的完整陈列
    核对旧钟铭牌:
      places:
      - 雾都洋馆
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}在保管人许可下指向两处不同署名，邀你分清原铭牌与后修印记。'
      beats:
        trigger: '{npc}在保管人许可下指向两处不同署名，邀你分清原铭牌与后修印记。'
        objective: 识别制作、改装和维修可能来自不同人
        choice: 可与获准旧账对照；可只看外壳，或不打开钟罩直接结束
        immediate: 能确认的工作分开归属，铭牌看不到的部分不凭风格下结论
        near: 展签可以分别说明工种贡献，不强行选一个唯一名匠
    调整候诊室挂钟:
      places:
      - 私立诊察室
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}在空诊时段把挂钟放稳，请你看修复后摆动是否连续。'
      beats:
        trigger: '{npc}在空诊时段把挂钟放稳，请你看修复后摆动是否连续。'
        objective: 恢复候诊区可用报时，避免持续急促敲响干扰等待
        choice: 可观察试走并帮忙递工具；可只问何时装回，或由接待员接手
        immediate: 修复后挂钟继续试走；需等件就告知接待员用自己的钟另行报时
        near: 诊所按约复查走时，不因参与修钟获得查看病历的资格
    核对雾季靠泊通告:
      places:
      - 港务街钟楼外廊
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}把三份署期不同的靠泊通告并排按在记事板上，要你指出哪份已经作废。'
      beats:
        trigger: '{npc}把三份署期不同的靠泊通告并排按在记事板上，要你指出哪份已经作废。'
        objective: 在封港前确认哪一版时刻真正生效
        choice: 逐份对电报纸边；只抄下相互矛盾的时分；交回报时差役等港务所盖章
        immediate: 作废件被折角另放，钟锤照旧落点，不等任何私人允准
        near: 货主按生效那版重新排班，白等过的船工拿到改期凭条
    等候派工时核对号牌:
      places:
      - 港务街零工等候角
      pairs:
      - 1
      category: 日常接触
      action: '{npc}用鞋尖拨开墙根湿掉的一半工价，问你今天这队还认不认昨天的先后。'
      beats:
        trigger: '{npc}用鞋尖拨开墙根湿掉的一半工价，问你今天这队还认不认昨天的先后。'
        objective: 弄清派工顺序是按号牌还是按熟人
        choice: 替相熟的人守住号牌位置；只报上自己号牌不替人出头；退回墙根继续等
        immediate: 队伍重新对齐，被插队者当场说清自己等了几班船
        near: 派工记账人改用粉笔重写顺序，滑头的人下一轮排到队尾
    熨烫间调校试帽镜台:
      places:
      - 帽店地下熨烫间
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}蹲在铜管下面扳住镜台支架，问你敢不敢让楼上试帽的客人继续站上去。'
      beats:
        trigger: '{npc}蹲在铜管下面扳住镜台支架，问你敢不敢让楼上试帽的客人继续站上去。'
        objective: 在不耽误当天生意的前提下修稳那副镜台
        choice: 托住支架让上头把螺丝拧到底；只清开过道把帽坯挪走；劝掌柜今天就别接试帽的客
        immediate: 支架先空载压两回，撑不住就当天封掉那副镜台
        near: 掌柜按修好与否决定留多少试帽时段，返工材料另行记账
    茶房对街认人:
      places:
      - 交易所对面的机械茶房
      pairs:
      - 0
      category: 信息交换
      action: '{npc}借着添茶把窗边那副座指给你，问你能不能认出散场后先出来的是谁。'
      beats:
        trigger: '{npc}借着添茶把窗边那副座指给你，问你能不能认出散场后先出来的是谁。'
        objective: 在正面照会之前弄清对方的座次和份量
        choice: 记下入场次序；装作等行情只听不认；换到屏风另一侧避开相认
        immediate: 认出的名字只留在两人之间，茶房跑堂没接到任何打点的钱
        near: 下次会面可按认出的座次安排先手，认错则白坐一夜冷茶
    屏风后各摆底牌:
      places:
      - 交易所对面的机械茶房
      pairs:
      - 0
      category: 信息交换
      action: '{npc}把一份对折的账条压在自己碟子底下，要你把手里那张也摊在桌面上。'
      beats:
        trigger: '{npc}把一份对折的账条压在自己碟子底下，要你把手里那张也摊在桌面上。'
        objective: 在三夜试探之后分清谁的底牌是真的
        choice: 先把账条推过去；只报金额不报来路；把茶钱结了起身不谈
        immediate: 推过去的那张当场对折收回，谁先亮谁先认下这件事
        near: 没亮牌的一方按摊出来的深浅决定下一轮还坐不坐这张桌子
    散场后认旧手套:
      places:
      - 交易所对面的机械茶房
      pairs:
      - 1
      category: 日常接触
      action: '{npc}把添好的茶推到你手边，说对面账房新来那位散场后总在门口多站一会儿。'
      beats:
        trigger: '{npc}把添好的茶推到你手边，说对面账房新来那位散场后总在门口多站一会儿。'
        objective: 确认那副旧手套是不是三年前那人的
        choice: 托跑堂把尺码带过去；自己下楼在门口慢慢走一趟；只听账房的流水不动声色
        immediate: 话只到手套那人手上，账房和跑堂都不知道这两人的旧账
        near: 见与不见由她定，肯见就把三年前那把钥匙一并带上
    前台座位按仇家排:
      places:
      - 交易所对面的机械茶房
      pairs:
      - 1
      category: 第三方与打断
      action: '{npc}隔着屏风把前排座位指给你看，问今天这一场该谁坐在正对门口那一侧。'
      beats:
        trigger: '{npc}隔着屏风把前排座位指给你看，问今天这一场该谁坐在正对门口那一侧。'
        objective: 在不落口实的前提下让当年那位坐进被人看见的位置
        choice: 把靠前台那副座留出来；托跑堂递一样旧物过去探口风；改成自己缩进屏风后
        immediate: 座位换定之后当夜只见茶客进出，两人还没当面交过一句话
        near: 对方接不接这一手决定后头是明着来还是暗着查，账房流水先不动
  customs:
  - 钟表铺会把每天校时的误差写在门旁黑板上。
  pressures:
    船期钟点不一致:
      source: 仓库的电报副本与港务员口头报出的靠泊时刻不同。
      engines:
      - 时限逼近
      - 资源锁定
      beats:
        trigger: '{npc}发现仓库的电报副本与港务员口头报出的靠泊时刻不同。'
        objective: 先确认船期版本，不用拨快时钟伪造一致
        choice: 请档案员核对电报接收时刻并复询港务所；或暂缓本批备货等待确认
        immediate: 维修师保持怀表不动，仓库只保留确认范围内的作业
        near: 复询可能延后一班装卸，仓主与港务调度决定谁接班，不转成私人帮忙
      far_trigger: 下一次装卸仍沿用过时船期调人
      far_consequence: 工人白等、仓位滞留产生实际成本；明确生效版本才能恢复排班
      bindings:
      - activity: 校对港口钟声
        place: 雾码头仓库
        pair: 0
      exits:
      - 把疑问交港务调度后结束校时
      - 货主撤回尚未执行的本批装卸安排，另约已确认时段
    工艺展署名争议:
      source: 旧钟两处署名被借展双方分别主张为整件作品的唯一作者。
      engines:
      - 名声保卫
      - 旧事追索
      beats:
        trigger: '{npc}发现旧钟两处署名被借展双方分别主张为整件作品的唯一作者。'
        objective: 查清各自工作范围，不用名气抹掉维修贡献
        choice: 比对旧维修账与实物印记；或暂缓署唯一作者，先撤下争议展件
        immediate: 不改动原铭牌，维修师只说明能看出的后修部位
        near: 展签可并列制作与维修，借出者若不接受可取回自己的钟
      far_trigger: 后续目录仍把修复成果全算给原制作者
      far_consequence: 维修师后人的借件意愿下降，工艺展失去可展示的实物来源
      bindings:
      - activity: 核对旧钟铭牌
        place: 雾都洋馆
        pair: 0
      - activity: 布置街区工艺展
        place: 帽店试帽间
        pair: 1
      exits:
      - 撤下该件并按借用关系归还
      - 保留存疑说明后退出归属裁定，交资料持有人继续查证
    封港大雾滞留:
      source: 封港大雾压住航道，货栈与旅店同时挤满走不掉的船队，租位与工价按小时往上翻。
      engines:
      - 风雪封路
      - 资源锁定
      beats:
        trigger: '{npc}敲开钟楼外廊的门，说雾一压下来整条港务街的船都走不成，住脚的地方已经排到城外。'
        objective: 在封港期间把有限的铺位和工位分给真正走不掉的人
        choice: 按到港先后封存号牌；给熟客留一个位置；劝走能自己找亲戚投靠的人
        immediate: 号牌与铺位一同封存，谁的行李都不许提前搬进候工棚
        near: 先占位的人可以留，塞进来的关系户要当众退牌；插队的记录随船期一起挂着
      far_trigger: 雾连开七天仍有人握着重号牌占铺
      far_consequence: 待得最久的一批船工被挤出城外，港务所接不到零工，货栈装卸只能停摆
      bindings:
      - activity: 等候派工时核对号牌
        place: 港务街零工等候角
        pair: 1
      - activity: 核对雾季靠泊通告
        place: 港务街钟楼外廊
        pair: 0
      exits:
      - 交还号牌撤出港务街，另找城外落脚处
      - 把铺位让给带病的人，自己回船上看守货舱
    照顾耗竭:
      source: 家里那位病着的老人只认她一个人喂药，她连着守了九夜，白天还要回熨烫间顶班。
      engines:
      - 伤病互护
      - 时限逼近
      beats:
        trigger: '{npc}在熨烫间扶着铜管直不起腰，说她夜里守的病人只吃她喂的药，白天这班又不能丢。'
        objective: 在照护与顶班之间找到能撑过这一周的分法
        choice: 替她顶半天班去喂那顿药；只帮她把帽坯挪开腾出躺的地方；劝她请外人进来分一半夜
        immediate: 药碗交到谁手上当夜就说清，顶班的人不许替她答应长期照看
        near: 妹妹或邻妇接手的那几夜要不要留，两人当面订下，熬不住的可以先撤回来
      far_trigger: 再撑两轮换班仍只有她一个人喂药
      far_consequence: 她要么丢熨烫间的班次要么丢夜里喂药的手，两边都垮；分出去才留得住人
      bindings:
      - activity: 熨烫间调校试帽镜台
        place: 帽店地下熨烫间
        pair: 1
      - activity: 调整候诊室挂钟
        place: 私立诊察室
        pair: 0
      exits:
      - 把病人交给肯接手的亲戚，自己辞掉夜里那顿药
      - 只留白天顶班，夜里的照护回绝清楚
    组织施压:
      source: 钟表行会把校时误差上报记进档，报得勤的手艺人排进不受推荐的名单。
      engines:
      - 第三方施压
      - 名声保卫
      beats:
        trigger: '{npc}把行会送来的信压在记事板下面，说这季上报的误差名单里又有修钟的那几位。'
        objective: 既按行会的账回话，又不拿同行的走时当自己的投名状
        choice: 照实填误差但注明环境条件；只交自家那栏不议别人；拒签这轮上报
        immediate: 上报件只填自己经手的钟，同行那几栏留白并写明非本人经手
        near: 行会的年度传习名额按签字算，拒签者暂不进名单但保留复查更正的余地
      far_trigger: 连续两季名单只留拒签的人挨罚
      far_consequence: 不肯背后指认同行的手艺人被挤出市面，钟表行会失去最会修的那几个人
      bindings:
      - activity: 核对雾季靠泊通告
        place: 港务街钟楼外廊
        pair: 0
      - activity: 等候派工时核对号牌
        place: 港务街零工等候角
        pair: 1
      exits:
      - 把上报件原样退给行会差役，不署名
      - 只书面说明自己经手那几台，不再参与名单排次
    审查将至:
      source: 港务督办要封存近三年的更次记录与快修件流水，账面上有七台钟修好没上本。
      engines:
      - 旧事追索
      - 秘密暴露倒计时
      beats:
        trigger: '{npc}隔街把督办的封条样子比给你看，问那七台没上本的快修钟打算怎么过这一关。'
        objective: 在封存之前把没上本的件与私人补账对上
        choice: 当天把七台补上本并写明补记缘由；先把私人账拆开另存；把钟转走等风头过去
        immediate: 没上本的那几台先停用离台，补记件与原件分开放，谁经手写谁的名字
        near: 督办验本时只认补记齐全的那部分，转走的件要自己担丢失责任
      far_trigger: 封存期结束前仍有一台去向不明
      far_consequence: 整本账连遮带埋全被扣住，港务街的钟表铺跟着停一批业务，谁都保不住饭碗
      bindings:
      - activity: 熨烫间调校试帽镜台
        place: 帽店地下熨烫间
        pair: 1
      - activity: 核对雾季靠泊通告
        place: 港务街钟楼外廊
        pair: 0
      exits:
      - 交出自己经手部分的原始件，退出这轮封存
      - 关门歇业避过封存，另找挂靠的铺子接活
    刺客身份被同枕之人识破:
      source: 同床那位在他换下夜行表链时认出了链头的磨痕，那是替人做过事的记号。
      engines:
      - 身份风险
      - 共同秘密
      beats:
        trigger: '{npc}在关灯前提住他腕上那条表链，问他链头的磨痕是不是替人做过事留下的。'
        objective: 决定这条命要不要摊在被识破的人面前
        choice: 当场认下并交出链子；咬死是钟表行的旧记号；起身搬出这间同住的屋子
        immediate: 链子收进谁的口袋当夜就定，认下之后两人都不能再拿它当把柄
        near: 知道的这个人要不要留在身边，得看认下的那一方肯不肯连旧账一起交代
      far_trigger: 链子的事漏到第三个人耳朵里
      far_consequence: 认下的人被同伙追着灭口，捂住的一方替她挡下这一刀；密封得住才能一起出城
      bindings:
      - activity: 茶房对街认人
        place: 交易所对面的机械茶房
        pair: 0
      exits:
      - 交回链子离开同住处，从此不再露面
      - 把知道的按进水里，留人在身边但不再同枕
    对等试探:
      source: 两人各握对方一条把柄，谁先亮牌谁就先输，茶房那副屏风后已经试探了三夜。
      engines:
      - 对等试探
      - 表面体面破裂
      beats:
        trigger: '{npc}把三份署期不同的通告推过来，说这三夜谁先亮牌谁就先输，今天该定个了。'
        objective: 弄清对方手里的把柄是真货还是空城
        choice: 先亮自己那张试深浅；只报尺寸连差价一起摊开；起身结茶钱不谈了
        immediate: 摊开的那一份当场对折，谁先抖出来的谁先担下这件事
        near: 没亮牌的一方按摊开的深浅决定下一轮还来不来坐这张桌子
      far_trigger: 试探到第四夜仍谁也不肯先摊
      far_consequence: 两边都摸不到底，越拖越只能靠外人传话；先摊的那方反倒保住主动权
      bindings:
      - activity: 屏风后各摆底牌
        place: 交易所对面的机械茶房
        pair: 0
      exits:
      - 结清茶钱离座，另约城外的地方再谈
      - 只留一张尺寸条就走，不解释是哪一笔
    旧情重逢:
      source: 隔了三年再遇见她，她已经在对面那家做掌柜的账房，手上还戴着当年那副手套。
      engines:
      - 旧情重逢
      - 情感拉扯
      beats:
        trigger: '{npc}把添好的茶推到你手边，说对面账房新来那位戴着手套收钱，你认不认得。'
        objective: 分清这三年里哪些账还能接着算，哪些已经作废
        choice: 托人递话约她散场后见；只把手套的尺码报给跑堂；等行情散了再决定认不认
        immediate: 递出去的话当晚只到手套那人手上，账房和跑堂都不知道这两人的旧事
        near: 见与不见都由她定，肯见就把三年前那把钥匙一并带上
      far_trigger: 拖到行情季结束还没把人约上
      far_consequence: 对面把她调去外埠分号，这层旧账再没人认；及时见还能留一条往来的路
      bindings:
      - activity: 散场后认旧手套
        place: 交易所对面的机械茶房
        pair: 1
      exits:
      - 把手套按旧尺码包好托伙计送过去，此后不再打听
      - 散场后从侧巷走人，把约见的事就此搁下
    贵族仇敌前台就座复仇:
      source: 对面那位当年断过他一条腿的旧贵胄，如今正大摇大摆坐在交易所前排的位子上。
      engines:
      - 贵族仇敌前台就座复仇
      - 名声保卫
      beats:
        trigger: '{npc}隔着屏风指给你看，前排那位就是当年断他腿的人，今天坐得比谁都靠前台。'
        objective: 在众目之下讨回那笔旧账又不落把柄
        choice: 坐进前排正对的位置让他看清楚；托跑堂递一样当年留下的东西过去；当夜不认，改去查他的新账
        immediate: 递过去的东西只经跑堂的手，两人都还没当面交过一句话
        near: 对方接不接这一手决定后头是明着来还是暗着查，账房的流水先不动
      far_trigger: 递过去的东西被原样退回两次
      far_consequence: 退两次就是不认这笔旧账，再等下去只能在外埠动手；当场接下才留得住台面上的机会
      bindings:
      - activity: 前台座位按仇家排
        place: 交易所对面的机械茶房
        pair: 1
      exits:
      - 结账离座回城外，把找人的事交给同伙
      - 只把旧伤说给跑堂听，转身不再看前排
    黑帮教父暗账审计之夜:
      source: 帮口那本暗账要当夜对完，少一笔就有人要拿命填，审计定在午夜钟响之后。
      engines:
      - 黑帮教父暗账审计之夜
      - 秘密暴露倒计时
      beats:
        trigger: '{npc}在午夜钟响前把暗账摊在熨烫间的矮桌上，说这一夜对不平就有人要拿命填。'
        objective: 在天亮前把缺口找出来，同时决定要不要替人遮这一笔
        choice: 逐条对快修件流水找出缺口；只把自己经手的那栏补平；把账合上不接这活儿
        immediate: 对的账页当场用熨斗烘过压平，缺的那笔在纸上留出空行不填补
        near: 补多少由经手人自己认，认了就得在下一趟船期前把差额凑出来
      far_trigger: 天亮时缺口仍挂在账上
      far_consequence: 帮口先把管账的推出去顶；报了账才能保住人，遮过去就是拿全屋的人换一个
      bindings:
      - activity: 熨烫间调校试帽镜台
        place: 帽店地下熨烫间
        pair: 1
      exits:
      - 把暗账合上退回帮口，从此不接他们的件
      - 只交自己经手那栏的凭证，当夜出城
  legacy_sources:
    eras:
    - 维多利亚雾都
    aesthetics:
    - 哥特幽暗
    - 蒸汽与黄铜
    - 维多利亚哥特怪诞
    places:
    - 雾码头仓库
    - 帽店试帽间
    - 雾都洋馆
    - 私立诊察室
  themes:
  - 各行业共用一个钟点的代价
  - 工匠署名和维修劳动的差别
  - 雾城公共秩序里的小型照料
  technology_boundary: 场景取维多利亚中后期的机械钟、怀表、港口电报和煤气灯条件；不使用电子同步、数字病历或现代监控。港务正式船期须向有权部门确认，钟表匠只能校仪器；哥特气氛不赋予旧钟预言能力。封港大雾期间港务所靠泊登记与旅店铺位号牌为纸质封存，港务街零工按铜号牌先后派工，帽店靠蒸汽铜管升降试帽镜台，交易所对面的茶房是街区等行情与暗谈的公开场所；上述设施均不进任何私人账目。
  bridge_status: not_required
