id: mat-63dd15d920ee5fd693c917b26f3617d6
name: 后方邮路与灯火
material:
  eras:
  - 战时后方
  aesthetics:
  - 行当正剧
  - 克制冷峻
  - 寒冬避难所
  rule: 远离前线的城镇依靠邮路、修缮和轮班维持日常，消息抵达总有迟滞。
  social_rule: 代收信件必须登记，紧缺公共物资不能只凭私人承诺分配。
  places:
    夜班值班室:
      details:
      - 邮袋挂在离地木架上·夜
      - 日期章与路签压在油灯旁·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 邮站前厅通向街口
        witnesses:
        - 交袋邮差
        - 当班邮务员
        affordances:
        - 给信件补齐路签
        - 结束活动并离开
        pressure_modifiers:
        - 邮车发袋时间
        - 灯油余量
    疗养院:
      details:
      - 阅览桌与安静休息椅隔着一道屏风·午后
      - 旧报纸整齐放在可取的矮架上·午后
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 阅览室外回廊
        witnesses:
        - 值班照护人员
        - 愿意听报的成年住院者
        affordances:
        - 整理读报时段
        - 结束活动并离开
        pressure_modifiers:
        - 听众体力
        - 休息时段
    老字号客栈:
      details:
      - 前厅木柱贴着手画水井方向·清晨
      - 门外可见修缮围挡和绕行巷口·清晨
      profile:
        privacy: low
        visibility: high
        exits:
        - 客栈大门
        - 前厅回廊
        witnesses:
        - 客栈伙计
        - 取水住客
        affordances:
        - 绘制暂住导览
        - 结束活动并离开
        pressure_modifiers:
        - 取水开放时辰
        - 围挡位置
    避难所登记棚:
      details:
      - 棚口长桌摊着名册与体温签，队列绕过煤炉排到棚外·夜
      - 名册边角被手指捻黑，划掉的号用另一支笔改写·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 从棚后帘门进入取暖区
        - 沿队列外侧退出街口，另寻落脚处
        witnesses:
        - 登记的检疫员
        - 排队等待留名的同行者
        affordances:
        - 核对名册上的号牌
        - 比对体温签与留名顺序
        pressure_modifiers:
        - 当夜名额余量
        - 煤炉还能烧多久
    车站西侧候车廊:
      details:
      - 廊下长椅只剩半边没有雪，通行证查验牌立在风口·黄昏
      - 墙上时刻表被撕走一角，剩下几班的车次写着待定·黄昏
      profile:
        privacy: low
        visibility: high
        exits:
        - 凭通行证上进站口
        - 沿廊柱折回街面，不越查验牌
        witnesses:
        - 查验通行证的站务员
        - 同候一班车的旅客
        affordances:
        - 核对车次与通行证编号
        - 打听待定班次是否还开
        pressure_modifiers:
        - 风雪封路程度
        - 当班站务员是否认签
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 邮务整理员
      function: 分拣邮袋、核对地址和交接日期
      authority: 决定本站待发与待核对信件的分袋
      resource: 日期章、邮路旧门牌表与交接簿
      limitation: 不能拆私人信件，也不能保证前方邮程
      obligation: 疑信保留原封并说明迟递缘由
      exposure: 误投会失去收件人信任，需追回误袋
      hidden: —
    player:
      identity: 公共修缮队记录员
      baseline: 你曾用修缮图解释一条已封巷的退信原因；邮务员请你再核对暂住户能用的路。
      resources:
      - 公共修缮围挡图
      - 走过旧街的门牌笔记
      reputation: 你知道哪条路在修，不假装知道收件人私事
    relationship_reason: 你曾用修缮图解释一条已封巷的退信原因；邮务员请你再核对暂住户能用的路。
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 公共修缮队记录员
      function: 记录修缮用料并轮值公共读报
      authority: 向修缮队报告用料差异，安排自己认领的读报时段
      resource: 木料尺寸册、疗养院漏雨点记录和当日借来的报纸
      limitation: 不能独自调拨公料，不承担医疗诊治
      obligation: 把暂住者需求带回工队，读报须让出休息时间
      exposure: 误报尺寸会浪费木料，读报过长会影响休息
      hidden: —
    player:
      identity: 邮务整理员
      baseline: 你们在疗养院漏雨时合作递送过修缮信；如今约在不当班时给住院者读地方消息。
      resources:
      - 本站的可用投递路线
      - 为住院者代收家信的登记办法
      reputation: 你递信及时，也能说清自己何时要回邮站
    relationship_reason: 你们在疗养院漏雨时合作递送过修缮信；如今约在不当班时给住院者读地方消息。
  - family: 秩序与执法
    position: 避难所检疫员
    appellations:
    - 大夫
    npc:
      role: 避难所检疫员
      function: 查体温、按名额留名并维持登记棚的队列
      authority: 决定当夜谁能留名取暖，调拨毯子与药品须报共同监护的一方
      resource: 体温签、留名册和当夜可发的毯子数
      limitation: 不能凭私人交情加号，也不承担诊病开方
      obligation: 给每一位留名者说清能待几天，退号须当场划册
      exposure: 错放一个人进来会让整棚的人夜里断毯，自己也被撤掉登记权
      hidden: —
    player:
      identity: 邮务整理员
      baseline: 你替邮站跑过登记棚的对账，知道名册上的号比屋里的人情更硬。
      resources:
      - 当日可发的毯子数
      - 邮站转来的家信登记办法
      reputation: 你按号留人，不拿关系换位置
    relationship_reason: 检疫员曾照你转来的家信找到一位滞留的收件人，此后登记棚的名册与邮站的对账都愿意互相对一对。
  activities:
    给信件补齐路签:
      places:
      - 夜班值班室
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}把退信按街名分开，拿出邮戳和路签请你认一处旧门牌。'
      beats:
        trigger: '{npc}把退信按街名分开，拿出邮戳和路签请你认一处旧门牌。'
        objective: 区分可补路签与须退回确认的信
        choice: 核对一条地址，或只按邮戳分袋；无法辨认就留待原寄件人确认
        immediate: 能确认的信进入下一趟邮袋，仍模糊的单独保留，信封不被拆开。
        near: 收件人可按约到邮站领取；猜不准的信不因赶路被投给同名住户。
    整理读报时段:
      places:
      - 疗养院
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}把报纸放在疗养院阅览桌，先问要听一段地方消息还是安静坐会儿。'
      beats:
        trigger: '{npc}把报纸放在疗养院阅览桌，先问要听一段地方消息还是安静坐会儿。'
        objective: 安排不挤占休息的陪伴
        choice: 读一小段，或替听众移近座椅；不想听便保留安静桌
        immediate: 有人听一段后休息，有人继续翻报，音量和座位随实际需要调整。
        near: 只约愿意参加者的下次读报，不把住院者列成必须出席的名单。
    绘制暂住导览:
      places:
      - 老字号客栈
      pairs:
      - 0
      category: 空间与退出
      action: '{npc}在客栈门口展开简图，邀你走到最近取水点再回来核对。'
      beats:
        trigger: '{npc}在客栈门口展开简图，邀你走到最近取水点再回来核对。'
        objective: 让新来住客能找到水源、邮站和回客栈的路
        choice: 走一个短段，或在前厅询问伙计；不愿出门就保留待查标记
        immediate: 一条绕开修缮围挡的短路被确认，旅客可按体力选择是否同行。
        near: 店家用这条路线接待住客，封路时只重查受影响的一段，不要求参与者常驻带路。
    夜里留一盏灯:
      places:
      - 夜班值班室
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}拧小灯芯又舍不得吹灭，说到站的人要是摸着黑找不着门，这一夜就白等了。'
      beats:
        trigger: '{npc}拧小灯芯又舍不得吹灭，说到站的人要是摸着黑找不着门，这一夜就白等了。'
        objective: 把灯留到该等的人进门为止，又不熬干当班的油
        choice: 把灯位挪到窗台照到街口；留下字条写明钥匙放在哪；按规矩落班吹灯走人
        immediate: 灯留在窗台最晚到值班交接，交接簿上写清灯油还剩多少
        near: 摸黑来的人按字条找到钥匙进门；灯油耗尽的账由当班的人自己补上
    棚口求一个庇护:
      places:
      - 避难所登记棚
      pairs:
      - 2
      category: 第三方与打断
      action: '{npc}把名册转向你，问棚口那位抱着孩子的人还算不算今天这一批。'
      beats:
        trigger: '{npc}把名册转向你，问棚口那位抱着孩子的人还算不算今天这一批。'
        objective: 在名额封存前给来人一个当夜能待的地方
        choice: 照号给来人留名；把自己的号让出去；请她明早再来重排
        immediate: 留名的当场划上记号并给一条毯子，名额一满棚口就落栓
        near: 换出去的那个号由登记人自己认账，第二天不许拿关系回头插队
    递出一张乘车通行证:
      places:
      - 车站西侧候车廊
      pairs:
      - 0
      category: 信息交换
      action: '{npc}隔着查验牌把那本通行证翻到没用过的一页，问你敢不敢替人签这张。'
      beats:
        trigger: '{npc}隔着查验牌把那本通行证翻到没用过的一页，问你敢不敢替人签这张。'
        objective: 把通行证给到真该上车的人手上
        choice: 当场替她填好并签名；只把编号报给站务员等核；把通行证收回口袋不谈
        immediate: 签出去的那页当场撕下对折，站务员只认编号不认口头交代
        near: 车次待定的那班要不要作数由站务定，拿证的人只管按时到查验牌前等着
  customs:
  - 收到远信的人可以自愿将信封邮戳借给邮站补画路线。
  pressures:
    邮袋交接缺页:
      source: 一段交接记录缺失导致多封信无法确认去向
      engines:
      - 旧事追索
      - 信任透支
      beats:
        trigger: '{npc}收到消息：一段交接记录缺失导致多封信无法确认去向。'
        objective: 重建交接经过并通知收件人
        choice: 询问交接人员，或核对驿站日期章
        immediate: 相关邮袋暂不再转寄，等信的人先得到可到站查询的时间。
        near: 沿日期章找回上一交接点，只给收件人说明各自信件去向，不公开全袋名单。
      far_trigger: 下一趟邮车完成相同线路时
      far_consequence: 补回交接点可恢复发袋；仍缺一段的袋件改由两站当面验袋，速度变慢但去向可查。
      exits:
      - 交出自己见过的邮戳信息即离开
      - 把查询交回邮站当班人，拒绝继续跨站追查
      bindings:
      - activity: 给信件补齐路签
        place: 夜班值班室
        pair: 0
    维修材料不足:
      source: 公共屋顶修缮与邮站修缮需要同一批木料
      engines:
      - 资源锁定
      - 伤病互护
      beats:
        trigger: '{npc}收到消息：公共屋顶修缮与邮站修缮需要同一批木料。'
        objective: 比较受影响范围并安排分批修缮
        choice: 先量两处实际缺口，或请工队判断哪些旧料能复用
        immediate: 邮站与疗养院都先遮护漏点，同一批木料尚不切割，避免争抢后两边都不够。
        near: 记录员量过尺寸后提出分段补屋面，邮务员只说明邮件受潮范围，调料由工队负责。
      far_trigger: 雨季第一轮修缮验收时
      far_consequence: 优先补妥的屋面恢复日常，另一处仍需临时遮护与后续料额，不能把本次让料当永久放弃。
      exits:
      - 提交尺寸和受影响人数后交给工队
      - 不参与调料，改在干燥阅览区继续已认领的读报
      bindings:
      - activity: 整理读报时段
        place: 疗养院
        pair: 1
      - activity: 绘制暂住导览
        place: 老字号客栈
        pair: 0
    台风登陆:
      source: 台风连夜登陆，邮车停发、屋顶掀角，油灯和药品按当夜能到的量往下分。
      engines:
      - 风雪封路
      - 资源锁定
      beats:
        trigger: '{npc}顶着风把值班室的门顶上，说邮车今夜发不了，灯油与药得先按当夜的量分。'
        objective: 在停摆的这一夜把有限的灯油和药分给最急的人
        choice: 照重病与赶路人先分；按先来后到排；把药留下等邮车来了再说
        immediate: 分出去的当场记在名册上，灯油罐贴上谁领的封条，不再私下倒手
        near: 分发记录随邮车复班一起交回邮站，谁多领了当众退出来
      far_trigger: 连着三天邮车仍进不来
      far_consequence: 按人情分的那部分被人堵着要账，重病的人反倒断了药；照急缓分才能撑到通车
      bindings:
      - activity: 夜里留一盏灯
        place: 夜班值班室
        pair: 1
      - activity: 棚口求一个庇护
        place: 避难所登记棚
        pair: 2
      exits:
      - 交回自己领的那份灯油，回值班室照常当班
      - 把药退给邮站，改在取暖区守夜
    冷战第三天:
      source: 同住那间屋子的两人第三天没搭话了，谁先开口谁就先欠下这顿没做的饭。
      engines:
      - 情感拉扯
      - 共同秘密
      beats:
        trigger: '{npc}把多出来的那副碗筷摆回柜里，说这都第三天了，谁先开口谁就先欠着一顿。'
        objective: 把三天前的那个分手尾收拾掉，别让屋檐下的人都跟着僵
        choice: 先开口把话挑明；只把饭做了不说话；请同住的第三人从中递个话
        immediate: 话挑明的那方当晚把碗筷收回桌上，没挑明的就照旧各吃各的
        near: 这屋子还要一起住多久，由开口那方决定谈到哪一步；不谈就只能各找各的去处
      far_trigger: 僵到第五天仍谁也不肯先开口
      far_consequence: 两人各自搬走，合住的屋子空了半边；先开口的不过是欠一顿饭
      bindings:
      - activity: 夜里留一盏灯
        place: 夜班值班室
        pair: 1
      exits:
      - 收拾好自己的东西搬出去，不再合住
      - 把钥匙留在桌上，只带当班要用的东西走
    婚约在身:
      source: 家里给订下的那门亲事已经过了帖，对方在另一处等着回话，而她心里装着的是眼前这个人。
      engines:
      - 名分悬置
      - 情感拉扯
      beats:
        trigger: '{npc}把过了帖的信压在名册底下，问眼前这一个还要不要再等下去。'
        objective: 在回帖到期前弄清这婚约怎么退、退了要赔什么
        choice: 当面把话说明并定下回帖的日子；只写一封退帖的信托人递；什么都不说等对方先提
        immediate: 压着的帖子当夜写清退或留，签字的那方自己担这一笔
        near: 退帖要赔的东西按两家约定算，眼前这个人要不要接着等由她自己定
      far_trigger: 回帖的期限过了仍未去信
      far_consequence: 两家按默认作数办事，眼前的人只能等下一次；先退帖才谈得上以后
      bindings:
      - activity: 递出一张乘车通行证
        place: 车站西侧候车廊
        pair: 0
      exits:
      - 把退帖交人递走后离开这一处，另找地方落脚
      - 只把自己的帖取回，不再管对方的回话
    客居篱下:
      source: 借住的那间屋子是人家腾出来的，屋主三天一问口粮，她连开窗透气都要先看人脸色。
      engines:
      - 信任透支
      - 资源锁定
      beats:
        trigger: '{npc}把屋主留的条子递过来，说口粮又被问过一遍，这屋子还住不住得下去。'
        objective: 在口粮与住处之间换出能自己说了算的那一点
        choice: 去邮站或车站找个能顶班的差事还这份口粮；当面跟屋主讲清能住到哪天；收拾东西另找地方
        immediate: 当夜把领来的口粮记清交回屋主，住处定到哪天由屋主当面应下
        near: 顶来的那份工钱要先还口粮账，还不上的按约清出屋子，不拿人情拖着
      far_trigger: 口粮连欠两轮仍没有进项
