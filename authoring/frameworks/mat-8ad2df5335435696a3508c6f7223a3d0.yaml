id: "mat-8ad2df5335435696a3508c6f7223a3d0"
name: "长安夜市与坊志"
material:
  eras:
    - "盛唐长安百鬼夜行"
  aesthetics:
    - "盛唐诡谲奇谭"
    - "长安夜行风物"
    - "工笔华服"
  rule: "人、精怪与方士共同生活在坊市中，宵夜、营生和登记各循不同节奏；闭坊鼓六百响毕，坊门落锁，街心奔跑者不再就地立斩，改由巡夜队羁押至次日坊正候审；夜里有另一套规矩，强者若当场立规矩，须先自报所属坊与名籍，人、精怪、方士同名同待，事后由坊正核录方才作数；有些名字不能提，提了要有人担。"
  social_rule: "只有当事人能确认自己的名籍，代写者不能代替签认；真名不是可以随口叫的称呼，而是名籍册上由本人按印的那一笔，神谕也不能替人解下这一笔，越权代认者须由坊正当众更正。"
  places:
    长安地底暗渠方士石坛:
      details:
        - "暗渠石坛高出常水位，试灯只在靠梯的干台进行"
        - "壁上三盏符灯对应不同支渠，反光会把颜色映到水面"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "沿值守人确认畅通的石梯回地面，不下水追灯"
        witnesses:
          - "守渠方士"
        affordances:
          - "试认水路灯号"
          - "辨别符灯与水面倒影"
        pressure_modifiers:
          - "水位与回声"
          - "守渠人确认的灯位"
    大雁塔顶避风藏经阁:
      details:
        - "大雁塔顶架空藏经阁的避风侧摆着借阅抄本"
        - "窗缝风动纸角，钟响时守阁人准备收卷"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "顺塔内原梯下行至寺院，不从外檐绕行"
        witnesses:
          - "守阁僧人"
        affordances:
          - "共校坊市旧志"
          - "比对旧街名与口述别称"
        pressure_modifiers:
          - "借阅时段"
          - "风势与抄本保存情况"
    城隍庙后院:
      details:
        - "城隍庙后院灯棚架着用旧的竹路签"
        - "灯匠在石案上重贴破损纸面，供行人试认回程图案"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "经庙侧门回坊内街道，闭坊前各自归家"
        witnesses:
          - "庙祝与自愿帮工的摊主"
        affordances:
          - "修补灯市路签"
          - "在灯下试认巷口图案"
        pressure_modifiers:
          - "竹签与糨糊干燥时间"
          - "各坊当夜获准开放范围"
    平康坊顶层花魁琴房:
      details:
        - "顶层琴房的槅扇外就是坊墙，窗下能看见整条巷子的灯"
        - "案上压着一份写了一半的曲牌与未署名的邀帖"
      profile:
        privacy: "high"
        visibility: "low"
        exits:
          - "沿内梯下到后院，经角门由相熟的人领出"
        witnesses:
          - "房内伺候的侍女"
        affordances:
          - "在曲牌上当场改一段"
          - "把邀帖当面退回或留下"
        pressure_modifiers:
          - "琵琶声能传出多远"
          - "坊内谁在打听这间房今晚有客"
    朱雀大街悬灯长街:
      details:
        - "街两侧的灯棚一路挂到坊墙下，火把与灯笼交替排开"
        - "街心留出一条空道，供给夜巡的马队与更鼓车通行"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "就近拐入未落锁的坊门，或退回侧巷等巡队过完"
        witnesses:
          - "沿街收摊的夜市摊主"
          - "整队经过的金吾卫"
        affordances:
          - "在空道两侧把货收完"
          - "等巡队过完再横穿街心"
        pressure_modifiers:
          - "更鼓已响到第几声"
          - "街心空道是否已被封"
    西市胡商货栈:
      details:
        - "货栈里堆着未清点的箱笼，胡商在柜前点着蜡记账"
        - "后院的栅门通着一条仅容两人并行的窄巷"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "从货栈正门走上西市街面，或走窄巷绕开巡队"
        witnesses:
          - "守货栈的伙计"
        affordances:
          - "当面对一份货单的来路"
          - "把没结清的账留到下次"
        pressure_modifiers:
          - "货栈打烊的时刻"
          - "窄巷是否还有灯"
    曲江池畔柳堤:
      details:
        - "堤上柳枝垂到水面，远处是尚未散尽的画舫灯火"
        - "堤边石凳上留着一盏没人收走的纸灯"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "沿堤走到曲江坊门，或原路折回城内"
        witnesses:
          - "堤上散步的其他游人"
        affordances:
          - "把没说完的话在堤上说尽"
          - "把纸灯放回水里送走"
        pressure_modifiers:
          - "城门与坊门的闭门时辰"
          - "堤上还有多少人在"
    西市后巷夜行医馆:
      details:
        - "医馆门面朝着西市，后门开在一条不通车马的窄巷里"
        - "药柜最上一格锁着，案上压着一本只记症状不记姓名的诊册"
      profile:
        privacy: "high"
        visibility: "low"
        exits:
          - "经后巷侧门离馆，不走过市街"
        witnesses:
          - "坐堂大夫与打下手的人"
        affordances:
          - "在不问来路的前提下处理伤口"
          - "把当夜的记录只落在症状一栏"
        pressure_modifiers:
          - "药箱里还剩多少熟艾与布条"
          - "后巷的灯是否被人盯上"
  pairs:
    -
      family: "权力与治理"
      position: "同侪"
      appellations:
        - "先生"
      npc:
        role: "坊市书吏"
        function: "受理摊主自报信息，核对坊门与摊位通知"
        authority: "能暂停本人抄错的待发通知，名籍更正需本人及坊正确认"
        resource: "旧坊图、分栏名册与已确认的开门时段"
        limitation: "不能替人或精怪认定身份，也不能命令方士开水闸"
        obligation: "把待核名字与可公开摊位消息分开"
        exposure: "错发通知会使摊主错过开市，需向本人补救"
      player:
        identity: "夜市灯彩匠"
        baseline: "你知道一个小图案能让不识字的人认路，也愿请书吏解释旧称的来由。"
        resources:
          - "路签修补包"
          - "走过坊巷的记忆"
        reputation: "图案要让路人看懂，不只自己觉得好看"
      relationship_reason: "灯匠曾发现书吏坊图标得对却挂签角度不对，两人因此常在开市前互相试认。"
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "师傅"
      npc:
        role: "夜市灯彩匠"
        function: "修补纸灯与竹路签，让图案能在暗处被认出"
        authority: "可停用自己未修稳的路签，挂灯位置要由守渠或庙方同意"
        resource: "干竹片、纸面、颜料与试认小灯"
        limitation: "不会代解所有灯符，也无权改名籍或放人过坊门"
        obligation: "旧签取下先留回程临时标记，避免误导行人"
        exposure: "坏签导错路会丢掉摊主的长期托付"
      player:
        identity: "坊市书吏"
        baseline: "你熟悉坊图，但巷名和实际灯影要请走过的人补足。"
        resources:
          - "获准查阅的坊志抄本"
          - "当夜待发的摊位通知底稿"
        reputation: "不拿代写人的笔代替本人说话"
      relationship_reason: "书吏曾替灯匠找回旧坊志中的铺名，灯匠愿教他把文字变成远处也能认的图案。"
    -
      family: "医疗与照护"
      position: "同侪"
      appellations:
        - "大夫"
        - "先生"
      npc:
        role: "夜行医馆的坐堂大夫"
        function: "在闭坊之后为赶夜路的人处理外伤与急症"
        resource: "药箱、止血的熟艾与一份只记症状不记姓名的诊册"
        authority: "可决定留人与否，也须由本人同意才下针用药"
        limitation: "不能在坊正未到之前替人作证，也不能把诊册上的症状对到具体名籍"
        obligation: "先记症状后问来路，伤者不愿说的部分不写进诊册"
        exposure: "诊册一旦能对出真名，夜里受伤的人就不敢再敲门"
        hidden: "本人有一个自己也不愿再提的旧伤，只在阴雨夜发作"
      player:
        identity: "夜行医馆的帮手"
        baseline: "你在医馆里替人打下手，认得药材也认得哪些伤口不该多问。"
        resources:
          - "一箱常备的伤药与干净布条"
          - "记住了城里哪几条巷子闭坊后还能走"
        reputation: "大夫知道你不打听来路，所以夜里只叫你来搭手。"
      relationship_reason: "你替大夫处理过一个不肯报名的伤者，自此大夫夜里急症只叫你；你也学会把症状和来历分开记。"
  activities:
    试认水路灯号:
      places:
        - "长安地底暗渠方士石坛"
      pairs:
        - 0
      category: "信息交换"
      action: "{npc}在守渠方士许可的干台指向两道反光，问你哪一道才来自实际灯位。"
      beats:
        trigger: "{npc}在守渠方士许可的干台指向两道反光，问你哪一道才来自实际灯位。"
        objective: "学会分清灯号与倒影，知道何时应停在原梯"
        choice: "可猜一次再听方士解释；可只在梯口看，或回地面等候"
        immediate: "判断会决定站在何处看灯，未懂灯号就不把猜测用于带路"
        near: "下次过渠可认出约定的一盏灯，不因此获得独自下渠许可"
    共校坊市旧志:
      places:
        - "大雁塔顶避风藏经阁"
      pairs:
        - 0
      category: "调查与核验"
      action: "{npc}展开两份获准借阅的抄本，邀你找出同一桥名写法变化的地方。"
      beats:
        trigger: "{npc}展开两份获准借阅的抄本，邀你找出同一桥名写法变化的地方。"
        objective: "区分别称、改名与誊抄错字"
        choice: "可比较一页；可讲自己听过的称呼，或只看插图不作校语"
        immediate: "有出处的异名并列，无证据的说法保持待核"
        near: "借阅结束交还原卷，下一次可以沿一条有趣旧名继续问，不要求马上改公簿"
    修补灯市路签:
      places:
        - "城隍庙后院"
      pairs:
        - 1
      category: "照护与修复"
      action: "{npc}取下一块裂纸竹签，问你愿把回巷图案画成井还是槐叶。"
      beats:
        trigger: "{npc}取下一块裂纸竹签，问你愿把回巷图案画成井还是槐叶。"
        objective: "让旧路签在灯下再次可认且不误指坊门"
        choice: "可补纸试认；可只选图案，或保留自己熟悉的旧签不换"
        immediate: "补好的签先在灯下转向试读，未干的签不急挂出"
        near: "常走这条巷的人可下一夜反馈是否看错，灯匠按反馈再修"
    在顶层把邀帖退回:
      places:
        - "平康坊顶层花魁琴房"
      pairs:
        - 0
        - 2
      category: "信息交换"
      action: "{npc}把写了一半的曲牌与未署名的邀帖并排推过来，问你是当场改一段，还是把帖原样退回。"
      beats:
        trigger: "{npc}把写了一半的曲牌与未署名的邀帖并排推过来，问你是当场改一段，还是把帖原样退回。"
        objective: "弄清这封帖究竟是谁的意思"
        choice: "当场改一段曲牌；或当面把帖退回去，不代谁应下"
        immediate: "槅扇外的琵琶声压得很低，改过的那一段只有房里的人听过。"
        near: "退回的帖回到原主手里，下一次要不要再递由对方自己决定。"
    收摊时横穿朱雀大街:
      places:
        - "朱雀大街悬灯长街"
      pairs:
        - 0
        - 2
      category: "空间与退出"
      action: "{npc}在灯棚下把最后一担货收拢，问你敢不敢趁巡队还没过完就横穿街心。"
      beats:
        trigger: "{npc}在灯棚下把最后一担货收拢，问你敢不敢趁巡队还没过完就横穿街心。"
        objective: "在更鼓响毕之前让自己和这担货都有去处"
        choice: "等巡队过完再走；或就近拐入还没落锁的那扇坊门"
        immediate: "街心空道上火把一列接一列，横穿的人会被当场叫住问坊与名籍。"
        near: "被巡队记下的一笔次日要由坊正核录，货能不能出手要等核完再说。"
    在西市货栈当面对账:
      places:
        - "西市胡商货栈"
      pairs:
        - 0
        - 2
      category: "调查与核验"
      action: "{npc}把一本点了一半的账册按住，问你今天把这批货的来路说清，还是把没结清的账留到下次。"
      beats:
        trigger: "{npc}把一本点了一半的账册按住，问你今天把这批货的来路说清，还是把没结清的账留到下次。"
        objective: "在货栈打烊之前把这一批的来路对上"
        choice: "当场逐箱点清；或只对一箱，其余记账留到下次"
        immediate: "账册上的数目当场改动，谁改的谁在旁边画押，蜡只点到能看清字为止。"
        near: "留着的那一箱下一夜还在，窄巷的灯灭了就得等到开市。"
    在曲江堤上把话说完:
      places:
        - "曲江池畔柳堤"
      pairs:
        - 1
        - 2
      category: "日常接触"
      action: "{npc}把石凳上那盏没人收的纸灯提起来，问你是把话在堤上说尽，还是就此放灯走人。"
      beats:
        trigger: "{npc}把石凳上那盏没人收的纸灯提起来，问你是把话在堤上说尽，还是就此放灯走人。"
        objective: "在闭门时辰之前把这一夜收束"
        choice: "把话说完再各自回城；或放灯入水，话留到下一次"
        immediate: "堤上的游人陆续散去，留下的话不再经第三个人的口。"
        near: "城门与坊门照旧到点就闭，今晚没说的部分不因此留下名分。"
    在夜行医馆处理不报名的伤者:
      places:
        - "西市后巷夜行医馆"
      pairs:
        - 1
        - 2
      category: "照护与修复"
      action: "{npc}把伤处按住不让多问，问你是先上药止血，还是先问清伤是怎么来的。"
      beats:
        trigger: "{npc}把伤处按住不让多问，问你是先上药止血，还是先问清伤是怎么来的。"
        objective: "在不问出来路的前提下把人先救下来"
        choice: "先上药止血，来路留空；或先问清再动手，不肯说的就照诊册留白"
        immediate: "诊册上只落症状不落名字，布条与熟艾当场用掉，不留样本。"
        near: "伤处在下一夜还要换一次药，来换药的人是否还是同一个人由对方自己定。"
  customs:
    - "灯匠会给路签留一小块空白，让来客画自己的回程标记。"
    - "夜里在别人家处理伤口的人，走前把自己的鞋在门槛外磕两下，算替这家人挡掉这一趟晦气。"
  pressures:
    夜市名籍误登:
      source: "书吏在旧志夹页核对摊位通知时发现两位摊主的名籍被抄入同栏。"
      engines:
        - "身份风险"
        - "资源锁定"
      beats:
        trigger: "{npc}发现书吏在旧志夹页核对摊位通知时发现两位摊主的名籍被抄入同栏。"
        objective: "分清旧志旁注与有权确认的现行名籍"
        choice: "请两位本人分别向坊正认领；或暂缓争议通知，不当场猜哪位该让摊"
        immediate: "抄本仍原样归阁，误抄的待发通知停止使用"
        near: "书吏分别传达核对结果，灯匠不承担判断谁是真身的责任"
      far_trigger: "下次开市仍按合并名籍只给一处摊位"
      far_consequence: "一位摊主会失去当晚收入；分别确认可恢复各自安排而无需公布私人来历"
      bindings:
        -
          activity: "共校坊市旧志"
          place: "大雁塔顶避风藏经阁"
          pair: 0
      exits:
        - "退出名籍核对，由书吏与坊正接手"
        - "摊主暂不参加本轮灯市，另约核籍，不因此注销其原身份"
    灯市水路检修:
      source: "守渠方士发现试灯干台外的水道检修需停止通行。"
      engines:
        - "资源锁定"
        - "时限逼近"
      beats:
        trigger: "{npc}发现守渠方士发现试灯干台外的水道检修需停止通行。"
        objective: "在闭坊时刻前选到地面回程，不拿灯符当安全保证"
        choice: "从原梯回地面改走开放坊道；或取消水路灯景等下次开放"
        immediate: "不再延长试灯，方士守住入口，参与者沿已确认的梯道退出"
        near: "地面游线会少看一段水影，但保留各自归家时间"
      far_trigger: "下一场灯会前仍未完成水道复查"
      far_consequence: "水上灯景继续停用，灯匠改接陆路灯签生计；复查通过才恢复水路"
      bindings:
        -
          activity: "试认水路灯号"
