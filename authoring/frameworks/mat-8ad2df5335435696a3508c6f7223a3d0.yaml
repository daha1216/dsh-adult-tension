    宵禁鼓将毕而人尚在街心:
      source: "更鼓已响到第五百九十七声，同行的客人还在朱雀大街那一侧的坊里没有出来，最迟三声之内必须离街"
      engines:
        - "时限逼近"
        - "身份风险"
      beats:
        trigger: "{npc}把更鼓数到第几声，问你是在街口等，还是先一个人退回坊里。"
        objective: "在鼓声毕之前让两个人都落到落锁之内"
        choice: "退回坊门内等，让对面自己赶；或折回去把人叫出来，两个人一起赌最后三声"
        immediate: "街心空道上火把已经排开，巡队看见还在街上走的人会当场问坊与名籍。"
        near: "被记下的一笔次日交坊正核录，两个人是不是走在一起也要分别说清。"
      far_trigger: "鼓毕之后巡夜队逐坊清点滞留者时"
      far_consequence: "按羁押候审处理的人要到次日坊正面前才放，名籍对得上的从轻核录，对不上的要另行具保；当晚先把人叫出来的那一个，可以用自己的名籍替对方担一次。"
      exits:
        - "先退回已落锁前的那扇坊门，各自负责自己那一程"
        - "不等人也不留话，趁最后几声自己走完街心"
      bindings:
        -
          activity: "收摊时横穿朱雀大街"
          place: "朱雀大街悬灯长街"
          pair: 0
        -
          activity: 在曲江堤上把话说完
          place: 曲江池畔柳堤
          pair: 1
    巡夜队围住了整条长街:
      source: "巡夜队把火把从街两端同时压过来，沿街的灯棚还没收完，巷口都封着，出街的只剩金吾卫守的那一条空道"
      engines:
        - "第三方施压"
        - "共处密闭"
      beats:
        trigger: "{npc}把灯棚最后一段帘子拉下来，说两头的火把已经压过来了，问你走空道还是留在棚里等。"
        objective: "在不被登记名籍的前提下把这一夜过完"
        choice: "走金吾卫看着的空道，当场报坊与名籍；或把灯留在棚里，人退到货栈后巷去等"
        immediate: "封街期间的街上只认报过名籍的人，退进巷子的那一段没有记录也没有光。"
        near: "巡队过完街就放开，巷子里的人靠暗号各自散去，谁在哪条巷子过的夜只有自己知道。"
      far_trigger: "封锁结束后的坊志核对"
      far_consequence: "报过名籍的按当日封街名册归档，退巷的一笔不落纸但也没有凭据；下一夜风头紧时，没凭据的人会被先请去问话。"
      exits:
        - "走空道报坊与名籍，当场接受核录"
        - "退进货栈后巷，等巡队过完再各自散去"
      bindings:
        -
          activity: "在西市货栈当面对账"
          place: "西市胡商货栈"
          pair: 0
        -
          activity: "收摊时横穿朱雀大街"
          place: "朱雀大街悬灯长街"
          pair: 0
    长明灯油见底的那一夜:
      source: "琉璃长明灯的火苗只剩一指高，油尽之前必须把当夜该核的名籍核完，灯一灭，写在暗处的字就再也对不上"
      engines:
        - "时限逼近"
        - "秘密暴露倒计时"
      beats:
        trigger: "{npc}把灯挑到最亮，说油只够再烧一刻，问你先核哪一卷。"
        objective: "在灯灭之前把最要紧的那几笔对上"
        choice: "先核今晚有争议的那一卷；或把没核完的誊成副本带走，灯灭之前只核一半"
        immediate: "灯下能看清的只有摊开的那一卷，其余的在暗处维持原样不动。"
        near: "没核完的部分要等下一次点灯，誊出去的副本按私抄处置，不具效力。"
      far_trigger: "下一夜点灯重新核对时"
      far_consequence: "誊走的副本若与原本有出入，以原本为准，誊的人要说明来源；灯灭之前核完的那一卷可以直接据以更正，之后再由坊正追认。"
      exits:
        - "只核完摊开的那一卷，其余留待下一次点灯"
        - "把未核部分誊成私抄带走，负担来源说明"
      bindings:
        -
          activity: "共校坊市旧志"
          place: "大雁塔顶避风藏经阁"
          pair: 0
    刀口上的血还没干:
      source: "动手的人把长刀带回坊里，血槽没擦净就被人看见，坊正尚未到，刀在人身上，问与不问都要在这一夜定"
      engines:
        - "旧案重开"
        - "信任透支"
      beats:
        trigger: "{npc}盯着你袖口那一点没擦净的颜色，问你今晚是把它说出去，还是当作没看见。"
        objective: "在坊正到场之前决定这一夜站在哪一边"
        choice: "劝人当场去坊正面前自陈；或先把刀收好，等天亮再说"
        immediate: "刀收起来了，血槽上的痕留着，看见过的人就只有眼前这几个。"
        near: "坊正次日巡坊时若从别处听到，先说的人算自陈，后开口的算隐瞒。"
      far_trigger: "坊正次日巡坊问到这一坊时"
      far_consequence: "自陈者按夜禁羁押候审，事由与人数一并录下；隐瞒而被别人供出的，连当晚在旁看过的人都要一并具保。"
      exits:
        - "劝当事人当夜直接去见坊正自陈"
        - "把刀收好不出声，等次日再看"
      bindings:
        -
          activity: "在夜行医馆处理不报名的伤者"
          place: "西市后巷夜行医馆"
          pair: 2
    有人要来认领那个名字:
      source: "有人拿着写好的名籍到坊正面前认领一个本不属于自己的名字，按印就在案上，当夜不认，天亮之后这个名就归了别人"
      engines:
        - "身份风险"
        - "名额只能给一个人"
      beats:
        trigger: "{npc}把那份写好的名籍推过来，问你是当夜按印，还是等神谕那边先开口。"
        objective: "在不越权代认的前提下守住本人那一笔"
        choice: "当夜到坊正面前本人按印；或先不动案上的文书，把神谕的话记下来等次日再议"
        immediate: "案上的按印只能由本人落下，代笔的人可以写字，但不能替人按。"
        near: "天亮之后那一栏若已有人按下，改回来要走一次更正，更正要先证明前一笔不是本人所为。"
      far_trigger: "坊志修录之日核对这一栏时"
      far_consequence: "当夜按印者直接录入坊志；被冒认而未能当夜澄清的，要从旁证重新走一遍更正，中途这个名下的夜市摊位、通行与担责都归冒认的人。"
      exits:
        - "当夜由本人到坊正面前按印确认"
        - "不按也不认，把文书原样留在案上等次日再议"
      bindings:
        -
          activity: "在顶层把邀帖退回"
          place: "平康坊顶层花魁琴房"
          pair: 2
        -
          activity: 在曲江堤上把话说完
          place: 曲江池畔柳堤
          pair: 2
