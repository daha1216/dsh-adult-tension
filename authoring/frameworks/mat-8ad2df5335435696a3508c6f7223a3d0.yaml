  technology_boundary: "以盛唐风物为底的志怪长安：纸灯、竹签、手抄坊志与人递消息并用，方士灯符只能在约定灯位示号，不能读心、自动查名籍或传送行人。夜市、暗渠石坛与城隍庙在此为同一架空城市制度，不将其开放方式冒充史实中的普遍宵禁例外。刑责一律走坊正核录与羁押候审，没有当场处决；巡夜的金吾卫只按坊与名籍登记，不入户搜人；夜行医馆以熟艾、布条与手抓药处理外伤，不做验血、影像一类后世手段，诊册按症状与姓名分栏，栏间不作对照检索。"
  bridge_status: "not_required"
