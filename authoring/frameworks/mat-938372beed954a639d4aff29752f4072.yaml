  themes:
  - 铃响归零
  - 课时是身体的刻度
  - 边界写在钟上
  - 状态本比辩解作数
  - 加课加出来的关系
  technology_boundary: 当代栈：微信排课小程序与纸质课时卡、课时账本并行，一切以纸本为准；教室监控只装公共区，学员可要求关闭；教学录像须双签授权，课后可要求当场删除；状态本纸质不上云。不预设 AI 换脸、云端永久留存与生物识别门禁；「天亮失效」在本版写实化为下课归零的极端化——最后一课即关系契约的终点，不取妖术设定。全员明确成年：主理人、课后理疗师、老绳师、投诉受理事、学员与课程记录摄影师均为成年从业者与成年学员，不写未成年线，不写亲友监护线，「新手」一律指成年初学者。成年向元素从私教单间的刻度型隐私自然生长——课上世界与课后世界的人为切换就是张力本体，「想有一段不必归零的课时」；支配与服从仅在教学框架与安全规则内作背景，胁迫、欲望与权力不对等只作压力背景，文字叙事级不露骨。非交易靠近的动作在单间与理疗角有最强落点：替她扣紧手腕上的皮质护腕、教一个动作、用酒精棉按住渗血、替她擦去后颈渗出的细汗并拉上防窥帘、递纸巾。
  bridge_status: not_required
