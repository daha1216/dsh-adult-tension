      - {activity: 镜墙前跟完一节基础课, place: 镜墙练习室, pair: 1}
      - {activity: 面摊上被圈内人认出脸, place: 巷口的老汤面摊, pair: 2}
      exits:
      - 停课养伤，把班课交给助教带两周
      - 认下旧师承，把这道疤的来历摆到明面上
    有人要整季买断她全部课时:
      source: 一位老学员开价买断下两季每一节——主理人排不出别人，卡墙上其余的格子一夜全空。
      engines:
      - 名额只能给一个人
      - 嫉妒与独占
      beats:
        trigger: '{npc}把排课小程序的日历翻给你看，下两季每一格都标着同一个名字，问你这一页发不发出去。'
        objective: 在一整年的课表和一个圈子的新人之间，替主理人把名额这件事拿个主意
        choice: 可劝她婉拒买断照常排课；可划出每周一格留给新学员，或点头发出去让钱说话
        immediate: 发出去的那页日历当天锁死，别人的续卡申请全数退回；留一格的方案，买断的人当晚就会来电话
        near: 卡墙的格子空着比满着难看——观望的人以为工作室要黄；买断的人开始替她回别人的消息，回得比她还快
      far_trigger: 买断的两季走完第一季时
      far_consequence: 婉拒的人保住排课权也断了这笔钱，往后半年手头紧；点头发出去的，两季之后发现买断的买的不是课，是她这个人——退钱都退不掉。
      bindings:
      - {activity: 预约台前办第一张课时卡, place: 预约登记台与课时卡墙, pair: 2}
      - {activity: 镜墙前跟完一节基础课, place: 镜墙练习室, pair: 0}
      exits:
      - 退掉买断的钱，排课权收回自己手里
      - 让出全部课时，转去外地分馆带新工作室
    最后一课的铃响之前:
      source: 课包到期不再续，最后一课排在今晚——归零约定生效前的最后一次不归零，两个人都心知肚明。
      engines:
      - 天亮失效
      - 信任透支
      beats:
        trigger: '{npc}把课时铃的电池取出来，搁在两个人中间，说今晚这一节，铃响不响由你。'
        objective: 把最后一节课上成课，还是上成归零约定管不着的样子
        choice: 可把电池装回去按规矩上完；可让这一节越过铃响自然结束，或提前十分钟收绳把告别留在边界谈判里
        immediate: 装回电池的那节照旧归零，退款单压进账本双签；不装的那节没有下课时刻，也没有下一次开课
        near: 过了今晚，卡墙的格子摘下名字，排课小程序里那个备注名沉底；谁也没说出口的那半句，从此挂在面摊的夜风里
      far_trigger: 一个月后卡墙那格挂上新名字时
      far_consequence: 按铃上完的人留得住这一行的体面，往后再见面还是师徒与客人；越过了铃的那一晚谁也没得到更多——归零约定没了，课时也没了，连「下一次」这个说法都一并没了。
      bindings:
      - {activity: 私教单间里练一趟走绳起手, place: 私教单间与课时铃, pair: 0}
      - {activity: 课时外那节加课喊一次停, place: 巷口的老汤面摊, pair: 3}
      exits:
      - 最后一课照常归零，此后不再排课
      - 退掉这节课的钱，把铃留给她自己按
