id: mat-938372beed954a639d4aff29752f4072
name: 课时铃的两端
material:
  eras:
  - 当代都市
  aesthetics:
  - 亚文化地下物语
  - 克制冷峻
  - 温柔颓丧
  rule: 工作室按课时段营业，一节九十分钟，铃响开课、铃响下课。开课前十分钟只谈边界不碰绳——范围、姿势、力度逐项先谈定，任何一项当场可撤回；安全词一出口，全场动作即刻停止，停止后的确认与照护不计课时。下课铃一响，课上的一切约定复位：称呼、支配与触碰回到师徒与客人，归零不是假装没发生，是制度规定它不再有效力。课包十节一签，顺延、冻结、转让须双方在课时账本上各自签字，过期作废不退不改；赠课只给到人、不入账本，加课只能当场一节一节地加。教学录像须双签授权，课后可要求当场删除；状态本按课次归档，只录身体不录闲话。同一座城里相近的行当各管各的刻度：共享会客的合同管空间与责任，越界的部分要有人认下来；课时单管时间与身体，铃响即复位，无需认也无从认。夜校的学分记学会了什么、匿名席是权利；这里没有认证没有终点，归零是义务。康复居所禁止住户恋爱；这里不禁任何真感情，只给它规定营业时间——心动不违约，但心动买不到加课。打赏榜单类的付费墙把亲密按格子越买越深，账越清楚情越糊涂；课时的格子每节清零、铃响即债权消灭，续课永远要重新谈——账越清楚，身体越有处安放。
  social_rule: 圈内对越界零容忍，一次投诉就除名——所以这一行把边界写在钟上，不写在心里。下课后谁也不提课上的事，提了的人下期不再被排课；学员与师者的界线在铃里，不在门口。状态本上一页一页的记录，比任何辩解都作数；领用签就是这一行的指纹库，谁的绳过没过蒸锅，柜子记得。交出去的课时是买服务，没交出去的那半句才是人。面摊上谁都听得见谁也不在意——圈内的事出了巷口，就当没说过。
  places:
    预约登记台与课时卡墙:
      details:
      - 临街玻璃门上贴着课程价目与一张排课二维码，柜台后一面墙的小木格按姓氏挂满课时卡·日间
      - 每张课时卡的第十栏旁边印着同一行小字：过期作废，不退不改·傍晚
      profile:
        privacy: low
        visibility: medium
        exits:
        - 推开玻璃门就是巷子，咨询不必留名，落卡才留
        witnesses:
        - 值班的助教
        - 推门进来咨询的新面孔
        affordances:
        - 预约台前办第一张课时卡
        - 在价目表前问清十节与单节的差别
        pressure_modifiers:
        - 课包剩余节数
        - 卡墙上还空着几格
    镜墙练习室:
      details:
      - 一整面镜墙把四排挂架照出双倍，班课上人人都在镜子里看别人也看自己·日间
      - 地板胶按课垫区域画了线，谁的绳落在线外，值班助教当场弯腰捡走·傍晚
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 出练习室就是一楼过道，正对预约台，谁进去谁出来柜台看得见
        witnesses:
        - 同班学员
        - 巡场的值班助教
        affordances:
        - 镜墙前跟完一节基础课
        - 在挂架前认领自己的练习绳
        pressure_modifiers:
        - 当节班课的人数
        - 镜墙前还剩几个空位
    新手观摩席与示教绳架:
      details:
      - 两排矮凳压着粉笔线摆开，线内是示教木架与演示位，线外的人只许看不许搭话·日间
      - 示教木架的横梁上磨出几道绳槽，哪道深哪道浅，看得出师承的路数·午后
      profile:
        privacy: low
        visibility: medium
        exits:
        - 矮凳后排留一条过道，起身离开不必跨过粉线
        witnesses:
        - 观摩席上的新手
        - 带新人来的老学员
        affordances:
        - 坐在矮凳上看完一段示教
        - 在粉线外替新人记一笔笔记
        pressure_modifiers:
        - 观摩席坐满的程度
        - 示教的是哪一段起手
    私教单间与课时铃:
      details:
      - 一扇隔音门、一盏红灯、一只课时铃，铃钮在垫子两侧各装一只，谁按都算下课·夜
      - 开课前十分钟两人对坐只谈边界，范围姿势力度写在小白板上，写下的当场可划掉·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 门从里面一按就开，出去的人不必向任何人解释这一节为什么短了
        witnesses:
        - 到点来喊停课的值班助教
        affordances:
        - 私教单间里练一趟走绳起手
        - 课时铃响后把人从绳上接下来
        - 按下任何一只铃钮叫停这一节
        pressure_modifiers:
        - 这一节剩下的分钟数
        - 谈定的边界撤回过几项
    课后理疗角与状态登记本:
      details:
      - 帘子后半张躺椅一盏暖灯，松解油与冰袋排在手边，状态本按课次一页页归档·夜
      - 谁的状态本谁都翻得、带不走——翻拍下来算违规，圈里的规矩比店规硬·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 掀帘出去是二楼过道，先经过主理人办公室的门再下楼梯
        witnesses:
        - 课后理疗师
        - 帘外等着登记的下一个学员
        affordances:
        - 理疗角登记一页状态本
        - 用酒精棉按住渗血再敷上冰袋
        pressure_modifiers:
        - 状态本今日页记没记满
        - 「今日不适宜加课」那一票有没有被行使
    器材消毒间与绳柜:
      details:
      - 开放操作台上蒸锅常年冒着白汽，绳柜一格一个名字，领用签挂在格门内侧·日间
      - 断了的绳照旧过蒸锅再入库，断口贴签写明日期——这一行的指纹库就在这柜里·午后
      profile:
        privacy: low
        visibility: medium
        exits:
        - 消毒间通一楼后过道，出门绕过器材升降口就是后巷
        witnesses:
        - 消毒值班的助教
        - 来领自己那一格绳的学员
        affordances:
        - 断绳领用签上找一个名字
        - 把用过的绳过蒸锅归柜
        pressure_modifiers:
        - 蒸锅今天还排得开几轮
        - 绳柜里有没有空着的格
    主理人办公室与课时账本:
      details:
      - 一张旧写字台一盏台灯，课时账本摊开是双栏签字的格式，一栏主理人一栏学员·夜
      - 顺延、冻结、转让、退款四枚章压在墨盒旁，缺了哪一栏的签字哪一枚都不落·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 出办公室是二楼过道，楼梯下来正对理疗角的帘子
        witnesses:
        - 主理人
        - 进来对账的课后理疗师
        affordances:
        - 办公室里签一次课时顺延
        - 断绳领用签上找一个名字
        pressure_modifiers:
        - 账本里压着几份没签完的申请
        - 本季租约还剩几天
    天台晾绳架与夜风口:
      details:
      - 一排竹竿架在夜风口，收上来的麻绳一束束挂着，风一过整排轻响·夜
      - 收绳是两个人的活，一递一绕，说话声混在绳响里，楼下听不真·深夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 天台铁梯直下消毒间后过道，夜里只留这一条路
        witnesses:
        - 同来收绳的值班助教
        - 隔壁天台晾衣服的邻居
        affordances:
        - 课时外那节加课喊一次停
        - 在晾绳架下收一束麻绳
        pressure_modifiers:
        - 今晚风口上挂了几束绳
        - 楼下面摊还亮着多久
    巷口的老汤面摊:
      details:
      - 两张折叠桌一锅老汤，圈内人下了课都往这儿坐，老板娘谁的脸都认得·夜
      - 面摊上的话风一吹就散，可谁跟谁拼过桌，第二天圈里都有数·深夜
      profile:
        privacy: low
        visibility: low
        exits:
        - 面摊就在巷口，起身汇进夜市的人流，谁也不必跟谁道别
        witnesses:
        - 面摊老板娘
        - 拼桌的圈内熟面孔
        affordances:
        - 面摊上被圈内人认出脸
        - 课时外那节加课喊一次停
        pressure_modifiers:
        - 今晚拼桌的有几个圈里人
        - 老板娘愿不愿意替你把话岔开
  pairs:
  - family: 成人行业与感官服务
    position: 初次见面的网友
    appellations:
    - 同学
    - 客人
    npc:
      role: 绳缚艺术工作室的主理人
      function: 排演出、带教学、把安全规则盯得比谁都紧
      authority: 工作室课程与场次安排权
      resource: 一间镜墙练习室的备用钥匙
      limitation: 圈内对越界零容忍，一次投诉就除名
      obligation: 安全词一出口全场停，事后确认状态
      exposure: 被写成越界服务，行里再无立足
      hidden: 她的课时账本上有十节从没排出去的空课，受赠人一栏一直空着
    player:
      identity: 线上绳艺教学社群认识半年的学员，今晚第一次上线下课
      baseline: 声音和头像都对上了，坐在对面的真人反而陌生。
      resources:
      - 几个月攒下的聊天记录
      - 一个你们都还在的线上小圈子
      reputation: 网上说话算数、线下第一次赴约的那个人
    relationship_reason: 你们在线上绳艺教学社群里认识半年，今晚是你的第一节线下课——声音和头像都对上了，坐在对面的真人反而陌生。课上的规矩她定，课时卡与续课的签字在你手里。
  - family: 医疗与照护
    position: 服务提供者
    appellations:
    - 师傅
    - 老师
    npc:
      role: 工作室课后理疗角的责任理疗师
      function: 松解、查淤、把课后的身体一页页登记进状态本
      authority: 状态登记本与「今日不适宜加课」的一票
      resource: 一份只有她和主理人知道的真实恢复进度
      limitation: 账本之外的加课请求她只能拒
      obligation: 状态本只录身体不录闲话，写满那一页才放人走
      exposure: 被写成越界服务的帮凶，执照和机构一起完
      hidden: 状态本里夹着的那页复查预约，写的是她自己
    player:
      identity: 受雇的课程记录摄影师，今晚被请来拍教学记录
      baseline: 你的职责止于把这一节课拍完；她除了是你镜头前的工作对象，什么也不是。
      resources:
      - 相机与拍摄许可（双签授权单）
      - 一份今晚的服务记录——底片当场交主理人签收
      reputation: 把活拍完、镜头不越界
    relationship_reason: 每节课的教学记录由你拍——她的松解油和你的镜头灯同时开工，底片当场交主理人签收；下课铃一响，两个人都回到客人。
  - family: 传统与雅艺
    position: 竞争者
    appellations:
    - 老板
    - 直呼其名
    npc:
      role: 另一流派坐镇的老绳师
      function: 坐镇席位、带师门徒弟，半个城的绳艺圈都认她的手法
      authority: 圈内名分与流派认证她一票，没她点头新人的起手式进不了名录
      resource: 一箱师传老麻绳与三代教学底稿
      limitation: 她看中的镜墙教室租约本季到期，续租竞标握在别人手里
      obligation: 席上看过谁的身体来路，随绳收进柜里，不带出这道门
      exposure: 被写成抢学生的老古板，流派脸面一起塌
      hidden: 三代教学底稿里缺的那一页起手图，正是主理人这一流派的开山页
    player:
      identity: 替主理人拟镜墙教室续租竞标方案的投标人
      baseline: 白天你们各自报价，今晚却坐在同一张桌子边。
      resources:
      - 一份和她师门方案对着打的标书
      - 她方案里的一个漏洞
      reputation: 输赢都认、不玩阴的那一个
    relationship_reason: 镜墙教室的续租竞标，你替主理人拟的方案和她师门的方案同一天递——白天你们各自报价，今晚却坐在同一张面摊桌边。
  - family: 学术与专业
    position: 知情不报者
    appellations:
    - 先生
    - 直呼其名
    npc:
      role: 圈内公示台的投诉受理事
      function: 推迟爆料窗口，也能把反证送进该去的桌面
      authority: 圈内公示台与七天冷静期
      resource: 一份还没归档的投诉卷宗
      limitation: 延迟权只用一次就作废
      obligation: 不把材料卖给出价更高的人
      exposure: 被写成拿材料换人情会断所有口
      hidden: 她自己当年的除名卷宗，就压在这份投诉的下面
    player:
      identity: 撞破那半分钟录像却至今保持沉默的知情人
      baseline: 她按登记的拍摄授权单号找到你，只问一句：你硬盘里那节课没交出去的半分钟，交不交。
      resources:
      - 未曾公开的半分钟录像
      - 一条还没转发给任何人的聊天记录
      reputation: 嘴极严、但一旦被逼到绝境会毫无保留交底
    relationship_reason: 她按登记的拍摄授权单号找到你，只问一句：你硬盘里那节课没交出去的半分钟，交不交——你的沉默是有价还是出于私心，她今晚要一个答案。
  activities:
    预约台前办第一张课时卡:
      places:
      - 预约登记台与课时卡墙
      pairs:
      - 0
      - 1
      - 2
      category: 日常接触
      action: '{npc}从课时卡墙的小木格里抽出一沓空白课时卡，问你办的是十节的课包，还是只先试这一节。'
      beats:
        trigger: '{npc}从课时卡墙的小木格里抽出一沓空白课时卡，问你办的是十节的课包，还是只先试这一节。'
        objective: 在把名字写进卡墙之前，弄清自己买的是多长一段关系
        choice: 可当场签下一整包十节；可只办一张单节试课卡，或先留个排课微信不落纸面
        immediate: 卡写好挂进小木格，排课小程序里多了一个备注名；没落纸面的那一张，课时铃响不到你头上
        near: 十节的课包按周排进课程表，用过一节划掉一栏；试课卡的人下周再来，柜台记得他没签的那一行
    镜墙前跟完一节基础课:
      places:
      - 镜墙练习室
      - 新手观摩席与示教绳架
      pairs:
      - 0
      - 1
      - 2
      category: 身体靠近
      action: '{npc}把一根练习绳搭上示教绳架，让镜墙前的新手看清起手的第一道，问你跟不跟这一节。'
      beats:
        trigger: '{npc}把一根练习绳搭上示教绳架，让镜墙前的新手看清起手的第一道，问你跟不跟这一节。'
        objective: 在镜墙把自己照得清清楚楚的房间里，跟完一节基础课而不躲开镜子
        choice: 可站进挂架前跟完全程；可退到粉笔线外的观摩席上看，或只借手腕试第一道绳
        immediate: 镜子里谁的脸红了谁都看得见，人人都在学无人特看；线外的人不许替线内的人答话
        near: 下一次班课你的位置往镜墙挪半排，粉线外的矮凳留给更新的新手；镜子里那点不好意思，三节课后就没人再看
    私教单间里练一趟走绳起手:
      places:
      - 私教单间与课时铃
      pairs:
      - 0
      - 1
      category: 身体靠近
      action: '{npc}按下课时铃开始计节，把两只铃钮各推到两人手边一只，说开课前十分钟只谈边界不碰绳。'
      beats:
        trigger: '{npc}按下课时铃开始计节，把两只铃钮各推到两人手边一只，说开课前十分钟只谈边界不碰绳。'
        objective: 把范围、姿势、力度逐项谈定，再决定这一节从哪一道起手
        choice: 可逐项谈定后上手；可当场撤回刚谈定的任何一项，或先只在空中比划不落绳
        immediate: 红灯亮起，谈定的边界口头复述一遍，任何一项当场可撤回；谁按铃都即刻停，停后的确认与照护不计课时
        near: 这一节剩下的分钟数贴在铃边；撤回过的那一项这一节不再提，下一节开课前重新谈
    课时铃响后把人从绳上接下来:
      places:
      - 私教单间与课时铃
      - 课后理疗角与状态登记本
      pairs:
      - 0
      - 1
      category: 照护与修复
      action: '{npc}的课时铃响过，她扶着单间的门框站定，等你把最后两道绳从腕上退下来。'
      beats:
        trigger: '{npc}的课时铃响过，她扶着单间的门框站定，等你把最后两道绳从腕上退下来。'
