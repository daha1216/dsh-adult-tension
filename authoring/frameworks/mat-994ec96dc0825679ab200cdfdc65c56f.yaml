      "pairs":
        - 0
      "category": "照护与修复"
      "action": "{npc}递给你一张回收灯纸，请你试扎一个遇风会转而不打结的挂环。"
      "beats":
        "trigger": "{npc}递给你一张回收灯纸，请你试扎一个遇风会转而不打结的挂环。"
        "objective": "让纸签能挂稳且随时取下"
        "choice": "试扎挂环；不动手只看；或用预制挂环画自己的海浪纹"
        "immediate": "松掉的旧结被替换，纸签试风后可独立转动"
        "near": "灯会结束能取回完整纸签，明年可再用同一灯架"
    "试走安静晨游线":
      "places":
        - "山间温泉旅馆"
      "pairs":
        - 1
      "category": "空间与退出"
      "action": "{npc}在旅馆前厅指向两条山径，问愿意绕开夜行住户窗下的哪一条。"
      "beats":
        "trigger": "{npc}在旅馆前厅指向两条山径，问愿意绕开夜行住户窗下的哪一条。"
        "objective": "让晨游不以打扰刚睡下的街坊为代价"
        "choice": "走已开放的短线；取消晨游回房；或只在前厅喝茶等日出"
        "immediate": "绕行路确定后不敲沿线住户门，嫌远者保留原地休息"
        "near": "以后同住旅馆可分开作息，无需全队一起起床"
