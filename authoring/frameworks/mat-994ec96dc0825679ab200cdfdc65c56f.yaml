        - "客房木格上挂着写有就寝时辰的住客木牌，夜行住客的那几块都翻到背面·深夜"
      "profile":
        "privacy": "medium"
        "visibility": "medium"
        "exits":
          - "从前厅回各自客房或旅馆门外山径，不穿浴场"
        "witnesses":
