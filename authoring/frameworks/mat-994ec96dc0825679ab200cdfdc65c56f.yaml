"id": "mat-994ec96dc0825679ab200cdfdc65c56f"
"name": "旧町神怪与灯会"
"material":
  "eras":
    - "神怪共存旧町"
  "aesthetics":
    - "都市妖异奇谭"
    - "怪谈夜话"
    - "和风物哀"
    - "中式民俗志怪"
  "rule": "神怪与居民共同经营旧町，节庆将不同作息的人带到同一条街上；入夜后町内另有一套规矩，夜巡木鱼敲偶数下时生人不得回头，也不得回看身后的影子，妖异就藏在人流里，以人的名号与衣着分辨不出。"
  "social_rule": "族群习惯需由本人解释，名号不能替代个人意愿；夜里谁都不必走远，异族证件与旧契约的续期只认本人到场，替人具名或代签者由町内共议处置。"
  "places":
    "海边浴衣祭神社后阶梯":
