      "beats":
        "trigger": "{npc}在旅馆前厅指向两条山径，问愿意绕开夜行住户窗下的哪一条。"
        "objective": "让晨游不以打扰刚睡下的街坊为代价"
        "choice": "走已开放的短线；取消晨游回房；或只在前厅喝茶等日出"
        "immediate": "绕行路确定后不敲沿线住户门，嫌远者保留原地休息"
        "near": "以后同住旅馆可分开作息，无需全队一起起床"
