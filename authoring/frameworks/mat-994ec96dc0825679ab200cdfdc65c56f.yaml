      "pairs":
        - 0
      "category": "调查与核验"
      "action": "{npc}展开两种结尾，请你辨出哪句来自口述、哪句是灯签匠人的后来添笔。"
      "beats":
        "trigger": "{npc}展开两种结尾，请你辨出哪句来自口述、哪句是灯签匠人的后来添笔。"
        "objective": "把来源差异留下而非选出唯一神怪真相"
        "choice": "比对小册；不参加整理；或只听本人讲一个版本"
        "immediate": "添写和口述分栏，讲述者未确认的名字不印入正文"
        "near": "下一版可并列两种结尾，读者能知道各自来处"
    "在后院轮讲一段未写下的故事":
      "places":
        - "寺庙后院"
      "pairs":
        - 0
      "category": "日常接触"
      "action": "{npc}合上小册，说想听一个不必刊印的小故事。"
      "beats":
        "trigger": "{npc}合上小册，说想听一个不必刊印的小故事。"
        "objective": "把节庆之外的闲谈留给当下听众"
        "choice": "轮讲一段；婉拒讲述先走；或安静听完不评真假"
        "immediate": "故事只留在这一桌，没人要求署名或记录"
        "near": "下次可以继续闲谈，不将私人片段自动变成刊物素材"
    "伸手捏了捏她的精灵耳":
      "places":
        - "海边浴衣祭神社后阶梯"
      "pairs":
        - 0
        - 1
      "category": "身体靠近"
      "action": "{npc}蹲在灯架下核对挂环，耳尖被海风吹得发红，回头问你这样挂会不会晃。"
      "beats":
        "trigger": "{npc}蹲在灯架下核对挂环，耳尖被海风吹得发红，回头问你这样挂会不会晃。"
        "objective": "让挂环挂稳，也让这一下接触停在对方允许的范围里"
        "choice": "可伸手捏一捏耳尖试温度；可只托住灯架让她自己扶耳；或退开半步先谈挂环"
        "immediate": "耳尖的温度当场可感，挂环仍按她的意思调整，退开也不会被追问"
        "near": "这一下算不算亲近由她下次靠近与否决定，不自动延伸成别的要求"
    "核对一次夜巡班表":
      "places":
        - "寺庙后院"
      "pairs":
        - 1
      "category": "信息交换"
      "action": "{npc}指着廊下那根钉上的班表，问今晚木鱼记的数和表上写的是不是同一晚。"
      "beats":
        "trigger": "{npc}指着廊下那根钉上的班表，问今晚木鱼记的数和表上写的是不是同一晚。"
        "objective": "确认谁当值、夜里那套规矩今晚管到哪条街"
        "choice": "可对一遍班表与记数；可只抄下当值人名；或不参与核对直接回屋"
        "immediate": "数目对不上的一栏当场留白，不替当值人补记，也不改已挂出的班表"
        "near": "留白的那一栏要等当值人自己来认，错记的班表会牵动整条街的夜巡安排"
    "替她还回异族证件":
      "places":
        - "山间温泉旅馆"
      "pairs":
        - 1
      "category": "第三方与打断"
      "action": "{npc}把翻到背面的住客木牌重新翻正，说证件少了一页，办事处的人明天就要来收。"
      "beats":
        "trigger": "{npc}把翻到背面的住客木牌重新翻正，说证件少了一页，办事处的人明天就要来收。"
        "objective": "在办事处来人之前弄清缺页该由谁补、由谁具名"
        "choice": "可当晚陪她走一趟办事处；可只把自己的那一页借给她顶一晚；或劝她等办事处自己核档"
        "immediate": "木牌翻回正面，缺页仍缺，前台把这事记在住客簿上不留名字"
        "near": "证件补齐前她出不了山，借页或陪走都只顶到办事处验收那天，不替她担下具名"
  "customs":
    - "纸灯可以只画图不写愿望，未点亮的也会被认真挂好。"
    - "夜巡班表挂在寺庙廊下，当值人自己把名字添上去，别人不代添。"
  "pressures":
    "灯会路线需要改动":
      "source": "一段旧街封修占用了灯会通道"
      "engines":
        - "资源锁定"
        - "第三方施压"
      "beats":
        "trigger": "{npc}收到消息：一段旧街封修占用了灯会通道。"
        "objective": "协调绕行路线并保留居民出入口"
        "choice": "先走一遍替代路，或缩减灯组"
        "immediate": "封修段不再挂灯，已画好的纸签暂存旅馆，不迫使居民让出门口。"
        "near": "匠人试短灯组，记录人走绕行线；两者长度可不同，不硬拼全程巡游。"
      "far_trigger": "封修持续到灯会结束仍无可行大环线"
      "far_consequence": "今年改成几个独立灯点，客流分散，临街摊位需自行调整营业安排。"
      "exits":
        - "撤回自己的灯组并取回纸签"
        - "只参加旅馆门前小灯点，不加入绕行"
      "bindings":
        -
          "activity": "试挂灯会纸签"
          "place": "海边浴衣祭神社后阶梯"
          "pair": 0
        -
          "activity": "试走安静晨游线"
          "place": "山间温泉旅馆"
          "pair": 1
    "传说署名有争议":
      "source": "两位讲述者都认为刊物混淆了自己的版本"
      "engines":
        - "旧事追索"
        - "名声保卫"
      "beats":
        "trigger": "{npc}收到消息：两位讲述者都认为刊物混淆了自己的版本。"
        "objective": "分别核对版本与署名"
        "choice": "回访本人，或将两种说法并列"
        "immediate": "争议两页先不加印，已有手稿分别归还讲述者核对。"
        "near": "道具匠只确认自己添画的部分，署名由记录人回访本人，不代判正统。"
      "far_trigger": "下一季仍沿用混写署名的旧册销售"
      "far_consequence": "讲述者可能收回收录许可，旧册需停止分发而非靠新增序言掩盖。"
      "exits":
        - "删去争议篇，灯会手工活动照常"
        - "两位讲述者各留自己的版本，不共同署名"
      "bindings":
        -
          "activity": "整理旧町传说"
          "place": "寺庙后院"
          "pair": 0
    "契约自动续期前夜":
      "source": "她签的旧契写明了自动续期，条款压在最后一页，明早日出前不作声就等于再押一年。"
      "engines":
        - "契约精怪"
        - "时限逼近"
      "beats":
        "trigger": "{npc}翻到旧契最后一页，说明早日出前不作声就按自动续期再押一年。"
        "objective": "在日出前弄清这一条条款当初是谁替她写的"
        "choice": "可连夜去找当年的经手人问条款；可当场在契末批注异议；或什么也不做让它照旧续下去"
        "immediate": "契纸仍在她手上，批注只写自己的名字，不代她落款"
        "near": "续期一旦生效便不能凭口头反悔，要么按新条款过一年，要么按违约条款折一笔代价"
      "far_trigger": "日出之后契纸未作任何批注也未提出异议"
      "far_consequence": "旧契自动续期一年，她这一年里每逢节庆的出场与名号都归对方调用，赎回须按原押价加复利。"
      "bindings":
        -
          "activity": "核对一次夜巡班表"
          "place": "寺庙后院"
          "pair": 1
      "exits":
        - "在契末留下自己的名字承担异议，暂不回屋"
        - "退出这件事，把契纸交还她本人处置"
    "异族证件更新日":
      "source": "她的异族证件到期当日必须本人到场核验，代办一律作废，缺一日即转为待查，夜里出不了这条街。"
      "engines":
        - "身份风险"
        - "资源锁定"
      "beats":
        "trigger": "{npc}发现她的异族证件到期当日必须本人到场核验，代办一律作废。"
        "objective": "赶在办事处收档前把她本人送到核验口"
        "choice": "可当晚陪她走一趟；可先用自己的一页替她顶一夜；或让她自己承担待查的后果"
        "immediate": "住客木牌翻回正面，出门仍需有人陪着走完山路"
        "near": "证件补齐前她的活动范围被压缩到这条街，替她顶的页数到期要还，不顶也不多问"
      "far_trigger": "办事处收档那日她仍未到场核验"
      "far_consequence": "证件转为待查状态，夜巡时她被默认划归妖异一侧，出入要有人领事作保，旧町的常客位子也一并空出来。"
      "bindings":
        -
          "activity": "替她还回异族证件"
          "place": "山间温泉旅馆"
          "pair": 1
      "exits":
        - "陪她走完核验流程后各自回住处"
        - "不再过问证件，把这事留在住客簿上"
    "旧事上门":
      "source": "十几年前那桩没结的旧案，当年的另一位当事人如今提着灯站在寺庙后院的侧门口，说要当面把话说完。"
      "engines":
        - "旧案重开"
        - "旧事追索"
      "beats":
        "trigger": "{npc}听说十几年前那桩旧案的当事人如今提着灯站在寺庙后院的侧门口。"
        "objective": "在院子闭门之前决定见还是不见，以及由谁在场"
        "choice": "可开门当面对质；可请寺务人陪着一起听；或由侧门请对方明日白天再来"
        "immediate": "侧门不开也不锁，来人站在门外，廊下的班表照常挂着"
        "near": "见与不见都会传出去，明日的说法由今晚谁在场决定，不见的一方不必先解释"
      "far_trigger": "对方连续三夜提灯守在侧门外"
      "far_consequence": "旧案被翻到町内共议的台面上，当年在场的人逐一被叫去对证，躲开的那一方此后在旧町说话不再有人接。"
      "bindings":
        -
          "activity": "在后院轮讲一段未写下的故事"
          "place": "寺庙后院"
          "pair": 0
      "exits":
        - "从侧门送走来人，闭门不再谈此事"
        - "把这段交给町内共议，自己退出对质"
    "还俗前夜":
      "source": "他在寺里挂单的最后一年到期，明早还俗文书生效，此后夜里的那套规矩与他再无干系，廊下那本木鱼记也交到别人手上。"
      "engines":
        - "名分悬置"
        - "旧礼束身"
      "beats":
        "trigger": "{npc}说明早还俗文书生效，此后夜里那套规矩与他再无干系。"
        "objective": "在文书生效前安排夜巡与木鱼记的交接"
        "choice": "可陪他把当月的班表对完再走；可只把他的名字从班表上划去；或什么也不接，让他自己处理"
        "immediate": "班表上那一栏当场改动，木鱼仍挂在原处，交接写在他自己的名下"
        "near": "还俗之后他不再受夜规约束，也不再有权过问夜巡；接下班表的人从此每晚都得应木鱼那一声"
      "far_trigger": "文书生效当日班表上那一栏仍无人接手"
