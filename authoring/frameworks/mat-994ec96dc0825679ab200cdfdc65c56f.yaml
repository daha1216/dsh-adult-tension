        "reputation": "灯会道具匠，熟悉载重与安装，却不代居民决定路线"
      "relationship_reason": "你曾替她把夜行住户门前的灯架挪开，她邀你一起选晨游路线"
  "activities":
    "试挂灯会纸签":
