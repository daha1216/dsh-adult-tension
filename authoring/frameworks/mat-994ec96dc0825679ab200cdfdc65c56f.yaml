        "pressure_modifiers":
          - "晨起住客与夜行住客的休息交叠"
          - "夜行住客翻牌与归店的时辰"
    "寺庙后院":
      "details":
        - "寺庙开放后院的石桌上压着两版旧町小册·傍晚"
        - "廊下木鱼与夜巡班表挂在同一根钉上，班表只写到当月·夜"
      "profile":
        "privacy": "medium"
        "visibility": "medium"
        "exits":
          - "经开放侧门回町巷"
        "witnesses":
          - "寺务人和受邀讲述者"
        "affordances":
          - "整理旧町传说"
          - "在后院轮讲一段未写下的故事"
          - "对一遍夜巡班表与木鱼记数"
        "pressure_modifiers":
          - "讲述者作息与院落闭门时刻"
          - "当夜木鱼记数是否与班表对上"
