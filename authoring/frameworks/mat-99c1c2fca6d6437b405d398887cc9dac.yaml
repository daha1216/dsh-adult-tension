id: mat-99c1c2fca6d6437b405d398887cc9dac
name: 蒸汽浴场与更衣号房
material:
  eras:
  - 维多利亚雾都
  aesthetics:
  - 蒸汽与黄铜
  - 克制冷峻
  - 写实文学
  rule: 浴场按性别分日、病症分池、钟点分缸营运；进门领铜号、衣冠存号房，场内不作姓名登记，匿名是章程第三条明码标价出售的东西，不靠设备缺席，靠总板、时栅与处方编号三样制度在场。处方页只写编号与病症，医师签名不写病家姓名；出门凭牌取衣，失牌者由管事领着认衣，认衣须当着两位侍浴女工。蒸汽里不问姓氏，问了的人由管事请去茶憩厅；总板只在打烊后核对一次，巡检、法庭与债主都无权开板。号码与衣冠的对应只记在号房管事的钥匙总板上——她愿不愿对、几时对、对给谁看，一段雾里的事会不会长出名字就拴在这一枚裁量上。这里不设寄存簿、不收抵押、不留旧账，也无人拿两份记录对读——雾里根本没有名字可对，衣物不是真伪的证据，是身份的抵押品。
  social_rule: 雾里人人只是一个号——号码之间许下的诺，出门不必认，也没处追；全城只有号房管事一个人记得号码与衣冠的对应，而她几时对、对给谁全凭裁量。有名有姓者不得匿名入池，无名者反而进不了任何追索的门——这条匿名条款两个方向都锁死。茶憩厅里病友们做的事只有一件：把传闻一号一号拼回名字。绅士在雾里让过路，出门穿衣后又形同陌路——这不是虚伪，是这里的礼貌；性别分日的时栅把全城作息切成栅格，两个按礼法绝不该见面的人，只可能在同一池蒸汽里以两个号码的身份相遇。
  places:
    售票柜台与病处方窗口:
      details:
      - 浴票分公众池、处方池、包时缸三等，处方页只写编号不写姓名，匿名条款就钉在窗口内侧第三条·日间
      - 柜台里侧挂着当日时栅木牌，哪一天归哪一性别的钟点，一格一格刻得清清楚楚·日间
      profile:
        privacy: low
        visibility: high
        exits:
        - 买了票从柜台侧面的旋门进更衣号房长廊，不必再回头经过街面
        witnesses:
        - 售票的账房
        - 等候处方池钟点的病客
        affordances:
        - 买一枚铜号牌存下外套
        - 打烊前管事来收号牌
        - 结束活动并离开
        pressure_modifiers:
        - 当日处方池还剩几个钟点
        - 公众池与包时缸的票价差
    更衣号房长廊:
      details:
      - 一排橡木号房沿廊排开，柜上的铜牌按号挂好，总板挂在长廊尽头那扇落锁的门里·日间
      - 人人都在这里交出衣冠，门一关，走廊里只剩腕带磕碰铜牌的轻响·午后
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 领了号从廊尾小门直通池区，衣冠留在号房里等出门凭牌来取
        witnesses:
        - 巡号的侍浴女工
        - 同廊更衣的客人
        affordances:
        - 买一枚铜号牌存下外套
        - 打烊前管事来收号牌
        - 结束活动并离开
        pressure_modifiers:
        - 号房当日还空几间
        - 廊尾离总板间那扇门的距离
    号房管事的钥匙总板间:
      details:
      - 一面满墙的挂钩对着一盏罩灯，号码与衣饰的对应只在这间屋里成对成行·夜
      - 管事的簿子摊在灯下，翻页的声音隔着门板都听得见·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 出门落锁，钥匙只系在管事腰上，巡检来了也只能站在门外等
        witnesses:
        - 号房管事
        affordances:
        - 在总板间核一枚铜牌
        - 结束活动并离开
        pressure_modifiers:
        - 总板上还挂着几枚没人来领的牌
        - 打烊后核对的时刻
    蒸汽大理石池·公众时段:
      details:
      - 大理石池沿磨得发亮，雾汽浓得对面只余人影，水声盖过半句话·日间
      - 池边没有衣冠也没有姓氏，腕上的铜号碰到池沿，叮的一声就算打过招呼·午后
      profile:
        privacy: low
        visibility: medium
        exits:
        - 从池边石阶上到更衣长廊，湿手不许碰别人的号牌
        witnesses:
        - 同池的公众池客人
        - 巡水的当值工人
        affordances:
        - 蒸汽池里借一次背
        - 结束活动并离开
        pressure_modifiers:
        - 雾汽的浓淡
        - 同池的人数
    硫磺治疗池·处方时段:
      details:
      - 半幅布帘隔出处方时段的池位，帘外挂着编号木牌，只写编号与病症·日间
      - 药水的气味压过煤气味，病痛面前没有绅士，只有钟点·午后
      profile:
        privacy: medium
        visibility: low
        exits:
        - 出池后在帘边净身槽冲净，凭木牌原路退回更衣长廊
        witnesses:
        - 帘外守钟点的侍浴女工
        affordances:
        - 按处方钟点进硫磺池
        - 结束活动并离开
        pressure_modifiers:
        - 处方钟点有没有卖重
        - 帘子拉得严不严
    包时独浴缸间:
      details:
      - 一缸热水一道布帘，帘外一条长凳，包时的钟点从铜牌翻面那一刻起算·夜
      - 帘内只有水声，出了动静，也只有帘外坐着的人听得见·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 拉铃唤帘外的人，或等包时到了由管事叩帘三下
        witnesses:
        - 帘外候钟点的侍浴女工
        affordances:
        - 租一缸包时的热水
        - 结束活动并离开
        pressure_modifiers:
        - 包时还剩多久
        - 帘外长凳上坐着谁
    侍浴女工的擦身长凳:
      details:
      - 一条厚木凳一摞热巾，凳头的号牌筐收着客人暂存的铜号·日间
      - 一双认得旧伤的手从早到晚没停过，手套底下的规矩没人问过为什么·午后
      profile:
        privacy: medium
        visibility: low
        exits:
        - 擦完身从凳尾侧门直接回更衣长廊，不必绕经茶憩厅
        witnesses:
        - 当班的侍浴女工
        - 排凳等叫号的客人
        affordances:
        - 在擦身长凳上翻一次面
        - 结束活动并离开
        pressure_modifiers:
        - 排凳叫到的号数
        - 热巾还剩几摞
    浴场茶憩厅与病友席:
      details:
      - 裹着巾的病友围着一炉点心，传闻一号一号地过，比号牌核得还勤·午后
      - 茶憩厅不查号牌，可谁的嗓音在哪一池里听过，这里都有人记得·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 从茶憩厅正门直接回到街面，不必再进池区
        witnesses:
        - 出浴喝茶的病友
        - 添茶的伙计
        affordances:
        - 茶憩厅里对一次号码
        - 结束活动并离开
        pressure_modifiers:
        - 满厅传闻拼到第几号
        - 当日进出的生面孔
    后巷运煤门与水车井:
      details:
      - 煤车从后巷进出，井绳吱呀响一整天，一盏风雨灯照着门闩·晨
      - 水位看天，煤价看市，一池水温就拴在这两样上·黄昏
      profile:
        privacy: low
        visibility: high
        exits:
        - 煤门直通后巷，出去就绕开了正街的售票柜台
        witnesses:
        - 运煤的短工
        - 看井的老仆
        affordances:
        - 封炉时从煤门送人出去
        - 结束活动并离开
        pressure_modifiers:
        - 水车井的水位
        - 当日煤车的趟数
  pairs:
  - family: 服务与手艺
    position: 外来者
    appellations:
    - 先生
    - 直呼其名
    npc:
      role: 浴场号房的女管事
      function: 收牌、挂衣、把号码与衣冠一一对应，打烊后核一遍总板
      authority: 钥匙总板与「几时对、对给谁看」的裁量，巡检与法庭都无权开她的板
      resource: 一本只有她能翻的号码与衣饰对应簿
      limitation: 对错一次牌，门里门外两个世界都要找她算账
      obligation: 客人的衣冠一件不少地还回去，进号房的人要能体面地出门
      exposure: 对应簿一页见于人，浴场明码标价的匿名就当场作废
      hidden: 有一个号码她挂了三年从没对过主——那件衣冠的主人，早就不来领了
    player:
      identity: 初到雾都、只订得起公众池的外乡人
      baseline: 她是全城唯一记得你号码的人，而你连她姓什么都不知道。
      resources:
      - 一枚还系在腕上的公众池铜号
      - 一句还没对过任何人的外乡口音
      reputation: 你从不问别人的号对的是哪件衣裳
    relationship_reason: 你头一回进浴场就把号牌掉进了池边石缝，是她蹲下去替你抠出来的；她记下了你的号，也记住了你不问别人衣冠的分寸。
  - family: 医疗与照护
    position: 服务提供者
    appellations:
    - 师傅
    - 先生
    npc:
      role: 浴场里当值的侍浴女工
      function: 搓身、理疗、替病客翻面，守着处方池与擦身凳的钟点
      authority: 擦身凳上谁先谁后、处方池的帘子拉不拉，她说得算
      resource: 一双认得旧伤的手与一摞永远烫手的湿巾
      limitation: 她认得全城人的背，却叫不出一个名字——编号之外的都收在手套底下
      obligation: 帘内与凳上的事不出这条长凳
      exposure: 长凳上听来的钟点一旦外漏，处方池的匿名先从她这里破
      hidden: 手套底下那道旧疤，是三年前替一位客人挡刀留下的
    player:
      identity: 今晚被请来修汽阀管道的匠人
      baseline: 汽阀连着她的药水池，汽阀修好了，她的钟点才作数。
      resources:
      - 一箱管钳与垫圈
      - 一张只在今夜有效的修阀通行条
      reputation: 你修你的管子，帘子里的事从来不多看一眼
    relationship_reason: 汽阀一响，她的药水池就凉半度；你蹲在管道上、她守在帘外，两个人的钟点是同一根汽阀给的。
  - family: 家族与继承
    position: 知情不报者
    appellations:
    - 少爷
    - 先生
    npc:
      role: 白天存大衣、夜里上工的没落伯爵夫人
      function: 白天把最后一件体面存进号房，夜里在擦身凳给人搓背谋生
      authority: 一枚还没卖掉的纹章戒指，和一个从不对人的号码
      resource: 号房管事替她保着的那件大衣，与侍浴凳上一双不愿摘的手套
      limitation: 大衣一进当铺窗口，门里门外两个身份同时塌
      obligation: 侍浴凳上她从不摘手套，也从不认纹章
      exposure: 蒸汽救不了当票——纹章朝街面一挂，两个世界一起找她
      hidden: 她给管事的那枚号码是亡夫的——她自己的名字，早就不堪一问了
    player:
      identity: 在茶憩厅认出她袖口纹章的常客
      baseline: 你在茶憩厅认出了她袖口的纹章，至今没说。
      resources:
      - 一段同样见过那纹章的旧门第记忆
      - 一个还没拼到她号上的传闻
      reputation: 你喝茶听传闻，但从不往任何一个号上添名字
    relationship_reason: 你在茶憩厅认出了她袖口的纹章，她也看见你认出来了；两人从此共用一段谁都不提的沉默。
  - family: 秩序与执法
    position: 外来者
    appellations:
    - 警官
    - 长官
    npc:
      role: 浴场的持照巡查员
      function: 查水温、查登记、查男女分日的时栅执行
      authority: 一枚能封池七天的公章，封池的告示她当场就能贴
      resource: 一册只记编号与水温的巡查登记簿，页页盖着骑缝章
      limitation: 她无权开号房总板，也拿不到写着编号的处方页原件
      obligation: 出了人命才准问名字——在那之前，追索只能停在编号上
      exposure: 封错一池，全城的病痛第二天就堵在浴场门口
      hidden: 她自己那桩旧案的卷宗里，也夹着一页只写编号的处方
    player:
      identity: 来查一桩案子的外场警官
      baseline: 你来查一桩案子，唯一的线索是案发那晚池边只有号码。
      resources:
      - 一份还没定性的现场记录
      - 调阅浴场进出登记的权限
      reputation: 你按证据办事，不拿号码当名字使
    relationship_reason: 你查的那桩案子，那晚她当班；场内的执法在她手里，场外的追索在你手里，两个人各握着半个规矩。
  activities:
    买一枚铜号牌存下外套:
      places:
      - 售票柜台与病处方窗口
      - 更衣号房长廊
      pairs:
      - 0
      - 1
      - 2
      - 3
      category: 日常接触
      action: '{npc}把一枚拴着腕带的铜号推过柜台，问你外套存不存号房、要不要在处方窗口一并挂个钟点。'
      beats:
        trigger: '{npc}把一枚拴着腕带的铜号推过柜台，问你外套存不存号房、要不要在处方窗口一并挂个钟点。'
        objective: 用一枚号牌把衣冠留在门外，从这一刻起在雾里只剩一个编号
        choice: 可把外套大衣一件件存进号房；可只存外衣留住贴身物，或攥着号牌直接进公众池
        immediate: 号牌系上腕带，柜台只记号不记名，衣冠进了哪一间号房只有总板知道
        near: 出门凭牌取衣，失了牌就得由管事领着当着两位侍浴女工认衣
    蒸汽池里借一次背:
      places:
      - 蒸汽大理石池·公众时段
      pairs:
      - 0
      - 2
      category: 身体靠近
      action: '{npc}在雾汽里朝你侧过身来，腕上的铜号碰了池沿一下，问这一池雾里要不要借她的背歇一歇。'
      beats:
        trigger: '{npc}在雾汽里朝你侧过身来，腕上的铜号碰了池沿一下，问这一池雾里要不要借她的背歇一歇。'
        objective: 在认不出脸的雾里借一次背，谁也不知道对方是谁
        choice: 可把背靠过去挨着泡；可只递一声号过去搭话，或换到池角独自泡着
        immediate: 背贴上背的那一瞬只有铜号相碰的轻响，雾里没人认得出这两个号是谁
        near: 出了池各回各的号房，这一池雾里的事随水汽一起散，出门不必认
    在擦身长凳上翻一次面:
      places:
      - 侍浴女工的擦身长凳
      pairs:
      - 0
      - 1
      category: 身体靠近
      action: '{npc}把热巾搭在你背上一按，问这一面擦好了没、要不要翻到另一面去。'
      beats:
        trigger: '{npc}把热巾搭在你背上一按，问这一面擦好了没、要不要翻到另一面去。'
        objective: 让身体在凳上交给手艺，翻不翻面由凳上的人点头
        choice: 可翻面把正面也交给那双手；可只擦到腰际就抬手示意，或隔着热巾自己来
        immediate: 翻面与停手都照凳上客人的意思落，手套底下的手不问也不说
        near: 擦完的号从筐里取回，凳上听见的咳声与旧疤不出这条长凳
    按处方钟点进硫磺池:
      places:
      - 硫磺治疗池·处方时段
      pairs:
      - 1
      - 2
      category: 照护与修复
      action: '{npc}掀开半幅布帘看了一眼帘外的编号木牌，问你这个钟点是照处方泡满，还是半程就起。'
      beats:
        trigger: '{npc}掀开半幅布帘看了一眼帘外的编号木牌，问你这个钟点是照处方泡满，还是半程就起。'
        objective: 让病症在处方钟点里得到照护，编号之外的隐私不外泄
        choice: 可照处方泡满整个钟点；可半程就起让出池位，或让女工把帘子再拉严些
        immediate: 帘外木牌只翻编号，池里的病症与姓名都不上牌
        near: 下一个钟点的客人凭号进帘，这一池药水泡过谁只有当值的记得
    租一缸包时的热水:
      places:
      - 包时独浴缸间
      pairs:
      - 0
      - 1
      - 3
      category: 空间与退出
      action: '{npc}把包时的铜牌翻到起算的那一刻，问你这一缸从现在起算，还是等帘外的人走开再算。'
      beats:
        trigger: '{npc}把包时的铜牌翻到起算的那一刻，问你这一缸从现在起算，还是等帘外的人走开再算。'
        objective: 买断一段独处的钟点，帘内的事只归帘内
        choice: 可当下起算把帘子拉严；可等长凳空了再起算，或提前叩铃把剩下的钟点退了
        immediate: 包时一起帘内只剩水声，退钟的话帘外长凳上的人听得一清二楚
        near: 钟点到了管事叩帘三下，缸里的热水与这一段独处一起凉下来
    茶憩厅里对一次号码:
      places:
      - 浴场茶憩厅与病友席
      pairs:
      - 0
      - 2
      - 3
      category: 信息交换
