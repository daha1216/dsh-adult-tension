id: mat-9a093702ba565679b7c385e98752251a
name: 仙门山下百业镇
material:
  eras:
  - 东方玄幻大陆
  aesthetics:
  - 水墨写意
  - 市井烟火
  rule: 修行资源进入民间百业，法器维修、灵兽寄养和传音服务都有明确行规；坊门落锁至次晨开门的夜禁时段，任何人在街心奔跑都会先按形迹可疑拿住、暂押镇所待次日对保，举灯或高声报讯则只作口头警告、记录夜行缘由；这一条不因来人是凡人还是山门弟子而分别执行。
  social_rule: 手艺按工序计价，凡人与修士都能登记工单；师徒名分先于工单成立，未获师父当面作保的人不得替师门接单、过料或作保，同门之间的活计也要先落一纸工单再动手，名分能定的只是先后，不能顶掉工价。
  places:
    法器修理铺:
      details:
      - 拆件木盘分隔着旧壳与灵芯·傍晚
      - 试音台两端各放一只传音匣·傍晚
      profile:
        privacy: medium
        visibility: high
        exits:
        - 临街铺门
        witnesses:
        - 候修的居民
        - 修理学徒
        affordances:
        - 试用传音匣
        - 结束活动并离开
        pressure_modifiers:
        - 可用灵芯
        - 匣对同调距离
    灵兽寄养院:
      details:
      - 观察廊外两只食盆分栏摆好·傍晚
      - 寄养册压在粮柜外的干燥架上·傍晚
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 观察廊外门，不穿过兽栏
        witnesses:
        - 寄养助手
        - 接领灵兽的主人
        affordances:
        - 给灵兽配晚食
        - 结束活动并离开
        pressure_modifiers:
        - 灵兽进食反应
        - 当值寄养人手
    山门集市:
      details:
      - 蒸饼摊旁展开几副灯纸骨·夜
      - 已封好的灯芯放在摊主手边·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 市集主路与山下街口
        witnesses:
        - 灵灯摊主
        - 收摊邻户
        affordances:
        - 拼一盏市集灵灯
        - 结束活动并离开
        pressure_modifiers:
        - 收摊时间
        - 灯芯存量
    无相鬼市千佛暗窟:
      details:
      - 千佛暗窟由一排排凿壁佛龛往里延伸，龛里点的都是只够照亮脚前三尺的骨灯·深夜
      - 值夜人靠在第七重窟口的石栏上，摊子按灯位排号，越往里灯越稀·深夜
      profile:
        privacy: low
        visibility: low
        exits:
        - 沿来路骨灯逐重退回鬼市街面，退场须经值夜人验牌放行
        witnesses:
        - 千佛暗窟值夜人
        - 同排摆摊的坐商
        - 按灯位巡行的引路人
        affordances:
        - 按灯位找指定的摆摊人
        - 隔着龛壁与相邻摊主说话
        pressure_modifiers:
        - 火折子剩余支数
        - 龛壁传声与灯位远近
        - 值夜人当夜是否巡到本重
    天枢阵眼夜值棚:
      details:
      - 夜值棚搭在天枢锁妖大阵东北阵眼的石台边，棚内只有一灯一钟与更牌板·夜
      - 阵眼石面刻着时辰与灵气流向的旧标记，值夜人的记录册挂在棚柱内侧·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 交更牌从棚后石阶下阵，不在阵眼上停留
        witnesses:
        - 当值阵眼看守
        - 换更来接的镇上值夜人
        affordances:
        - 按更牌核对当夜灵气流向
        - 在记录册上补写异动时辰
        pressure_modifiers:
        - 当夜灵气逆流的时段
        - 更牌与记录册是否对得上
        - 山门是否派了人来查更
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    - 师兄
    npc:
      role: 法器修理师
      function: 验修法器并教人判断保养需求
      authority: 可停修不稳定灵芯，决定本铺维修工序
      resource: 校音工具、试验旧壳与有限替换灵芯
      limitation: 不能把收藏者的旧芯擅换新品，也不能凭短测担保远距传音
      obligation: 返还旧件并说清测试覆盖的距离
      exposure: 误报修好会耗掉往返山路的客人信任
      hidden: —
    player:
      identity: 旧器收藏者
      baseline: 你把一件不愿换芯的旧器交来，修理师保留了它的旧声；如今邀你帮比较另一对匣子。
      resources:
      - 三件旧器及历次维修痕迹
      - 记有各件旧声的听音笔记
      reputation: 你懂旧器的来历，也肯承认灵芯须听行家判断
    relationship_reason: 你把一件不愿换芯的旧器交来，修理师保留了它的旧声；如今邀你帮比较另一对匣子。
  - family: 动物与驯养
    position: 旧识
    appellations:
    - 直呼其名
    npc:
      role: 灵兽寄养师
      function: 按寄养约定配食并观察灵兽状态
      authority: 可调整本院喂食顺序并让不适灵兽暂避来客
      resource: 分栏钥匙、专用食盆与已经确认的兽粮
      limitation: 不能替主人转送灵兽，未确认的药草不得直接喂食
      obligation: 向主人说明食欲变化，把夜间照料交给当值人
      exposure: 错粮会造成不适，需承担追加照料而非只补一张记录
      hidden: —
    player:
      identity: 药圃照料人
      baseline: 你们多次核对药圃草样才找出一种适合这里灵兽的用法；今晚仍先看寄养师确认的粮份。
      resources:
      - 分开标注的安神草样
      - 药圃的采收时节经验
      reputation: 你提供草样来源，不擅作喂食决定
    relationship_reason: 你们多次核对药圃草样才找出一种适合这里灵兽的用法；今晚仍先看寄养师确认的粮份。
  - family: 私密撮合与契约中介
    position: 被求助者
    appellations:
    - 掌柜
    npc:
      role: 契约印记代管人
      function: 替镇上凡人与山门门人登记契约印记、核对物证并说明解约程序
      authority: 可暂缓一笔印记的启用，决定本铺是否接这件委托
      resource: 镇上的契约印记册、旧契抄件与一枚不落款的验印记
      limitation: 不能替任何一方宣布解约生效，也不能凭印记替人认领镇物
      obligation: 当面读出契约上写明的时限与代价，把抄件交给登记者本人
      exposure: 错记一笔会让两家拿着不同的说法上门，需自己出面逐条对
      hidden: —
    player:
      identity: 山门下来的夜值记录人
      baseline: 你在山门抄了几年值夜册子，认得印记上的纹样，也知道镇上更认现钱与工单。
      resources:
      - 山门的更牌与抄录本
      - 自己记下的镇上值夜人名
      reputation: 你肯把记录摊开给人看，不拿山门的名头替自己加价
    relationship_reason: 你把山门抄本里的几处时辰拿来跟镇上对，代管人发现两边的日子对不上；此后一有印记上的纠纷，两个人就同坐一张案子逐条读。
  activities:
    试用传音匣:
      places:
      - 法器修理铺
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}把成对传音匣放在试音台两端，请你说同一句短话比较回声。'
      beats:
        trigger: '{npc}把成对传音匣放在试音台两端，请你说同一句短话比较回声。'
        objective: 分清匣壳共鸣与灵芯衰减
        choice: 试说一句，或只观察修补接缝；不试音可请修理师自己演示
        immediate: 换壳前后声音的差异可比较，仍断续的灵芯不被误判为已修好。
        near: 修理师只交付通过短距测试的状态，收藏者可选保留原芯作陈列或另付换芯材料。
    给灵兽配晚食:
      places:
      - 灵兽寄养院
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}按寄养册分开两只灵兽的食盆，请你帮称一份已确认适用的兽粮。'
      beats:
        trigger: '{npc}按寄养册分开两只灵兽的食盆，请你帮称一份已确认适用的兽粮。'
        objective: 让不同灵兽吃到各自适合的份量
        choice: 称粮或添清水，也可站在观察廊看；不接触灵兽不影响来访
        immediate: 胆小的灵兽在安静一栏进食，剩粮可判断今晚食量，药草不随意混入。
        near: 寄养师据剩粮调整下一餐，来客交回食盆即可结束，不默认接晚班。
    拼一盏市集灵灯:
      places:
      - 山门集市
      pairs:
      - 0
      - 1
      category: 日常接触
      action: '{npc}展开一副小灯纸骨，把已封好的低耗灵芯放在旁边，问你想画镇上哪条街。'
      beats:
        trigger: '{npc}展开一副小灯纸骨，把已封好的低耗灵芯放在旁边，问你想画镇上哪条街。'
        objective: 一起做一盏能带回家的小灯
        choice: 画一面，或选现成纸样；不做灯也可边吃蒸饼边聊
        immediate: 两个人的图案可各占一面，灵芯由摊主装入，成灯带着不同笔迹。
        near: 灯归事先约定的带走者，耗完可回摊补芯；另一人不因此欠一盏回礼。
    接夜更的阵眼值牌:
      places:
      - 天枢阵眼夜值棚
      pairs:
      - 2
      category: 照护与修复
      action: '{npc}把更牌放在石台上，让你照册子核一遍今夜阵眼的灵气流向。'
      beats:
        trigger: '{npc}把更牌放在石台上，让你照册子核一遍今夜阵眼的灵气流向。'
        objective: 在换更前把当夜异动时辰记准
        choice: 照册核对；或只补自己看见的时辰，不确定的留空等下一更
        immediate: 对得上的时辰写进记录册，对不上的挂回更牌板不做推断。
        near: 下一更的人按册子接着记，写错的人次日自己来改，不连坐同棚值夜。
    按灯位退离暗窟:
      places:
      - 无相鬼市千佛暗窟
      pairs:
      - 2
      category: 空间与退出
      action: '{npc}数了数你手里剩的火折子，问你打算沿哪几重佛龛的灯位退回窟口。'
      beats:
        trigger: '{npc}数了数你手里剩的火折子，问你打算沿哪几重佛龛的灯位退回窟口。'
        objective: 在火折子用完前退回有光的那一重
        choice: 按来路逐重退；或就地等值夜人巡到本重领你出去
        immediate: 退路定在已走过的灯位上，不往灯更稀的里重试运气。
        near: 值夜人给一盏押灯送你到窟口，托你带的话按原话带到，不算你欠一趟人情。
    换一盏续明的引路灯:
      places:
      - 无相鬼市千佛暗窟
      pairs:
      - 2
      category: 日常接触
      action: '{npc}在灯位旁摆开几盏续明的骨灯，让你先看灯芯余量再报一个数。'
      beats:
        trigger: '{npc}在灯位旁摆开几盏续明的骨灯，让你先看灯芯余量再报一个数。'
        objective: 用当日手里的现钱换一盏够走到窟口的灯
        choice: 照余量付现钱；或把手上的旧灯芯折价换新，也可以只问到窟口还有几重
        immediate: 成交的灯当面点着试一试，亮不到窟口的当场换一盏或把钱退回来。
        near: 灯用完可以回来续芯，价钱随当夜灯位与火折余量浮动，不记成欠账。
    替她别住过长的耳尖:
      places:
      - 灵兽寄养院
      pairs:
      - 2
      category: 身体靠近
      action: '{npc}在观察廊里侧过身，让你替她把过长的耳朵尖用布带别在发后。'
      beats:
        trigger: '{npc}在观察廊里侧过身，让你替她把过长的耳朵尖用布带别在发后。'
        objective: 把耳尖别稳到不碍着配食的工序
        choice: 替她别住；或只递过布带让她自己来，也可以先做完手头的粮份
        immediate: 布带只别在发后不打结，她随时能自己拆开，廊里的活计不因此停下。
        near: 下次配食前她自己先别好，谁替谁动手就成了两个人之间的事，不进寄养院的记录。
    按住她发颤的尖长耳尖:
      places:
      - 天枢阵眼夜值棚
      pairs:
      - 2
      category: 身体靠近
      action: '{npc}在棚里把更牌写到一半，忽然让你按住她因为羞耻而发颤的尖长耳朵。'
      beats:
        trigger: '{npc}在棚里把更牌写到一半，忽然让你按住她因为羞耻而发颤的尖长耳朵。'
        objective: 让她把这一更的字写完，不惊动棚外的换更人
        choice: 照她说的按住；或先把灯移近让她自己稳一稳，也可以退到棚口等换更
        immediate: 手只落在耳尖上，棚外的人看不见，记录册照旧要写完。
        near: 换更人过来时她已经把更牌挂好，两个人都不提棚里那半刻，次日照常各值各的更。
  customs:
  - 铜铃、药香和被反复擦亮的旧法器构成镇上的日常声音。
  - 修好旧器的人会在底部留一枚可擦掉的工记。
  - 邻里互赠灵米蒸饼，收到后不必回等价礼。
  pressures:
    灵材交货争议:
      source: 共同订购的灵材被另一家作坊领走
      engines:
      - 资源锁定
      - 信任透支
      beats:
        trigger: '{npc}带来消息：共同订购的灵材被另一家作坊领走。'
        objective: 核对订单与领料凭据
        choice: 找作坊核对，或先联络共同订货的人
        immediate: 待换灵芯的工单暂停，现有旧件先归盘，不能拆别人的料补自己的单。
        near: 与领料作坊核对后取回尚未动用的份额，已用部分谈补供或退还各自款项。
      far_trigger: 这批灵材下一次共同订货时
      far_consequence: 按各家的实际到账份额提货；不愿再合买者可以单订并承担更高运费。
      exits:
      - 退回自己的订料份额并结束合买
      - 保留旧器作陈列，撤下本次换芯工单
      bindings:
      - activity: 试用传音匣
        place: 法器修理铺
        pair: 0
      - activity: 拼一盏市集灵灯
        place: 山门集市
        pair: 0
    山门工摊议价:
      source: 山门拟调整百业镇的工摊租额
      engines:
      - 组织更迭
      - 资源锁定
      beats:
        trigger: '{npc}带来消息：山门拟调整百业镇的工摊租额。'
        objective: 把各家作坊的实际负担写进议价记录
        choice: 比较合摊与回铺接单的花费，或暂不续摊
        immediate: 小摊先按现有租期营业，新价未定前不许代所有工匠许诺续租。
        near: 灯摊比较短租、合摊和回铺接单的开销，寄养师可只讲取送路线不代别人报账。
      far_trigger: 山门发出下一季摊位续租条件时
      far_consequence: 续摊者付较高租额换位置；退摊者仍可在镇内接单，但会失去山门过路客。
      exits:
      - 不续租本次工摊，收好工具回铺
      - 只参加一轮议价，后续由愿意续摊的人继续
      bindings:
      - activity: 拼一盏市集灵灯
        place: 山门集市
        pair: 0
      - activity: 拼一盏市集灵灯
        place: 山门集市
        pair: 1
    夜值阵眼灵气逆流:
      source: 更牌上写的流向与阵眼石面刻的差了两个时辰，山门查更的人天亮就到。
      engines:
      - 天枢锁妖大阵灵气逆流
      - 资源锁定
      beats:
        trigger: '{npc}在石台上把更牌与记录册并排摊开，指出两个时辰对不上。'
        objective: 在天亮查更前把当夜的真实异动时辰写清楚
        choice: 按石面刻的流向改；或照更牌留原始记录另附一句异动，也可以挂回更牌等下一更来核
        immediate: 两个时辰的差别写进册子，谁也没被写成当夜离棚。
        near: 查更的人按册子问话时，值夜人只答自己看见的时辰，异动的账不落到个人头上。
      far_trigger: 下一次灵气逆流撞上大阵校验日时
      far_consequence: 册子上留了原始时辰的一段可以照样值更；抹掉异动的人会被移出夜值名册，当夜只能自付灯油另找活计。
      bindings:
      - activity: 接夜更的阵眼值牌
        place: 天枢阵眼夜值棚
        pair: 2
      - activity: 按住她发颤的尖长耳尖
        place: 天枢阵眼夜值棚
        pair: 2
      exits:
      - 交出更牌不再接夜值，白日另接零工
      - 把当夜异动原样报给查更的人，退出这条记录
    火折子换不到窟口:
      source: 灯摊当日收摊价随火折余量走，手上剩的几支换不到走到暗窟口的那一重。
      engines:
      - 资源锁定
      - 时限逼近
      beats:
        trigger: '{npc}把续明灯摆在灯位上，报的价刚好差在你手边的现钱之外。'
        objective: 凑到能走到窟口的一盏灯，或者找到不必买灯的退路
        choice: 折价拿旧灯芯换；或就地等值夜人巡到本重，也可以只问到窟口还有几重
        immediate: 谈不成就不往灯稀的里重走，人留在有光的灯位旁等巡夜。
        near: 值夜人巡到本重会认灯位放行，欠下的一盏灯钱按当日价另约，不当场押东西。
      far_trigger: 下一市集夜仍未补上该付的灯钱时
      far_consequence: 欠价的人被记进灯摊的熟客别册，次夜起先付钱后拿灯；当场结清的人照旧按余量议价，不进别册。
      bindings:
      - activity: 换一盏续明的引路灯
        place: 无相鬼市千佛暗窟
        pair: 2
      - activity: 按灯位退离暗窟
        place: 无相鬼市千佛暗窟
        pair: 2
      exits:
      - 退回灯位旁不再议价，随引路人出窟
      - 留下旧灯芯折价，改日再来取灯
    镇物交割契书换代:
      source: 旧镇物的交割契书换新式样，凡人在契上的名字不再自动带进山门的镇物名录。
      engines:
      - 血脉压制的镇物争夺
      - 资源锁定
      beats:
        trigger: '{npc}把新旧两版契书摊在工单台上，问名字要不要自己另签一遍。'
        objective: 把镇物的现管人写清楚，同时不让凡人一方白丢名下那份
        choice: 按旧契原样换签；或只在工单上写现管人，也可以暂不换契只留一份抄件
        immediate: 镇物当天不进任何人的私库，比对期间的看管写在工单背面。
        near: 镇物仍留在原处，两家各自出人核一遍契书，接单的作坊只收当次比对的工钱。
      far_trigger: 山门下一次校验镇物名录时
      far_consequence: 有现管人签名的镇物按旧例续留，无人认领的移进镇所公库待领；提前抄件在手的人不必再补手续就能取回。
      bindings:
      - activity: 试用传音匣
        place: 法器修理铺
        pair: 0
      - activity: 换一盏续明的引路灯
        place: 无相鬼市千佛暗窟
        pair: 2
      exits:
      - 退回自己那份契书抄件，不参与镇物名录换签
      - 交出镇物暂存镇所公库，等有人认领再谈
    妖丹寄生现双魂:
      source: 诊出妖丹寄生者夜里会有另一副魂说话，白日看去与常人无异，医馆要求安置而不外报。
      engines:
      - 妖丹寄生与人妖双魂争夺
      - 信任透支
      beats:
        trigger: '{npc}趁铺里没有旁人，压低声音说夜里听见寄居者用另一个嗓子说话。'
        objective: 在两条命都保住的前提下决定这件事让几个人知道
        choice: 请医馆按例安置观察；或先只告诉当夜值守的人，也可以什么都不做只把人留在灯下
        immediate: 知情的范围停在铺内，寄居者的名不写进医馆外传的册子。
        near: 当夜有人陪在灯下换更守着，白日照常登记寄养；把事说出去的人要自己去解释话是怎么漏的。
      far_trigger: 寄居者在白日也被邻人看出说两样话时
      far_consequence: 先前只告诉少数人的人可以按原话说明经过；四处张扬的人会先被街上追问一旬，往后托他的话没人肯认真听。
      bindings:
      - activity: 给灵兽配晚食
        place: 灵兽寄养院
        pair: 1
      - activity: 替她别住过长的耳尖
        place: 灵兽寄养院
        pair: 2
      exits:
      - 把寄居者送回医馆登记，自己不再过问
      - 只留下当夜陪灯的人，其余一概不说
    锁链断裂在配食时:
      source: 梦魇驯兽的颈链断了一扣，配食的院里此刻只有两个人当值。
      engines:
      - 梦魇驯兽锁链断裂危机
      - 资源锁定
      beats:
        trigger: '{npc}在食盆边忽然停手，示意你看栏里那根松开的颈链。'
        objective: 把人撤到栏外，同时不让那只灵兽今晚断了食
        choice: 两人一起退到观察廊外再商量；或一人稳住灯一人补扣，也可以直接去叫寄养师
        immediate: 食盆推进栏内，人退到栏外，谁也不再徒手去够那根链子。
        near: 寄养院当夜只喂到半份，次日按补扣情况加一餐，动过手的人不因此被算作驯兽师。
      far_trigger: 下一夜配食前仍未换新颈链时
      far_consequence: 换过链子的院子照常接寄养；没换的夜里只喂远栏，主人可以选择领回灵兽，寄养院退还未用完的那几日粮钱。
      bindings:
      - activity: 给灵兽配晚食
        place: 灵兽寄养院
        pair: 1
      exits:
      - 退出当夜的配食，把食盆交当值寄养师
      - 把灵兽领回自家院中喂养，结清已用粮钱
  themes:
