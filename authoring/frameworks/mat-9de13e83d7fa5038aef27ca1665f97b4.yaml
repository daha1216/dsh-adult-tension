id: "mat-9de13e83d7fa5038aef27ca1665f97b4"
name: "风沙驿站与旧图"
material:
  eras:
    - "民国初年大漠荒城"
  aesthetics:
    - "西域丝路奇谭"
    - "古墓探险硬派风"
  rule: "驿站依靠水源、商队与地形记录维系，遗迹探索必须顾及返程。"
  social_rule: "未经许可不带走遗物，路线更新须注明亲见与传闻。"
  places:
    龙门客栈地窖:
      details:
        - "龙门客栈地窖的水囊架与粮箱分开摆放"
        - "通风口漏下沙粒，掌柜在木梯旁留下提灯"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "收起借用物沿木梯回客栈堂屋"
        witnesses:
          - "掌柜或管库伙计"
        affordances:
          - "整备返程水囊"
          - "比较个人行囊与实物余量"
        pressure_modifiers:
          - "取水日期"
          - "水囊和包布是否完好"
    破败义庄:
      details:
        - "沙地义庄的旧门廊留下两轮不同的补梁痕"
        - "坍损内屋不进入，绳尺只在看守许可的外沿展开"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "从稳固门廊退到原来抵达的驿道"
        witnesses:
          - "当地受托看守人"
        affordances:
          - "描绘旧建筑梁架"
          - "从地面量取可见跨度"
        pressure_modifiers:
          - "风沙遮挡程度"
          - "获准可测的外沿范围"
    倒悬石梁地宫:
      details:
        - "倒悬石梁在入口投下斜影，深处不对访客开放"
        - "看守引人停在已查验的入口平台，既有摹本放在便携板上"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "沿原来查验过的入口坡道退出，不穿越悬梁下方"
        witnesses:
          - "遗迹看守人与带路人"
        affordances:
          - "共读入口壁刻"
          - "比较摹本和可见图案"
        pressure_modifiers:
          - "日光投影角度"
          - "当日获准观察边界"
  pairs:
    -
      family: "学术与专业"
      position: "同侪"
      appellations:
        - "先生"
      npc:
        role: "驿路绘图员"
        function: "记下已验证水点与行路耗时，说明旧图限制"
        authority: "可撤下本人过时路线建议，不能批准遗迹勘查"
        resource: "附取水日期的路线图和刚归队向导的联络"
        limitation: "未亲见的新水点要复询，不能承诺每队走同样时长"
        obligation: "先安排返程补给，讲清传闻不作保证"
        exposure: "路线失准会使商队不再共享水情"
      player:
        identity: "旧建筑测绘师"
        baseline: "你想看清一根旧梁怎样接起来，也愿意为保留返程水量放弃深处那一笔。"
        resources:
          - "测绘手具"
          - "获准查看的既有摹本"
        reputation: "未量的尺寸不填成精确数字"
      relationship_reason: "测绘师发现旧水点图把两段驿道画得一样长，绘图员邀他按实际脚程重新核对返程装备。"
    -
      family: "学术与专业"
      position: "同侪"
      appellations:
        - "先生"
      npc:
        role: "旧建筑测绘师"
        function: "测量可接近的外观尺度，保存分期修补痕"
        authority: "能暂停自己的测量，扩大范围须获看守及许可方确认"
        resource: "绳尺、垂线和旧建筑草图"
        limitation: "不能凭一幅外观图判定石梁稳固，也无权带走遗物"
        obligation: "注明观测位置和看不到的部位，不把推测补成实测"
        exposure: "误标会使后续队伍白跑或做错修缮方案"
      player:
        identity: "驿路绘图员"
        baseline: "你最在意图上的下一口水是不是今天还能取，愿听测绘师指出图上的尺度误差。"
        resources:
          - "注明日期的水点图"
          - "自己的水囊和向导口信"
        reputation: "能回驿站比画满地图重要"
      relationship_reason: "绘图员帮测绘师联系义庄看守，测绘师则解释梁影不等于梁的实际跨度，两人开始互相校正观察方法。"
  activities:
    整备返程水囊:
      places:
        - "龙门客栈地窖"
      pairs:
        - 0
      category: "照护与修复"
      action: "{npc}在掌柜许可的地窖把自己的旧水囊取下，邀你看包布与系带是否完好。"
      beats:
        trigger: "{npc}在掌柜许可的地窖把自己的旧水囊取下，邀你看包布与系带是否完好。"
        objective: "把个人返程容器和背负位置整备妥当"
        choice: "可重系包布并试背；可只核对自己的水量，或留客栈不出发"
        immediate: "漏损容器交给可修的人处理，不把清单上的容量当实际存水"
        near: "下一次出发前还需按最新水点确认补给，今日整备不等于报名进遗迹"
    描绘旧建筑梁架:
      places:
        - "破败义庄"
      pairs:
        - 1
      category: "调查与核验"
      action: "{npc}从义庄门廊外沿拉开绳尺，请你比较草图里哪段被透视缩短。"
      beats:
        trigger: "{npc}从义庄门廊外沿拉开绳尺，请你比较草图里哪段被透视缩短。"
        objective: "用可见跨度校正草图，不推断内屋承重"
        choice: "可测一段或只核对比例；可留在驿道看远景，不进观察点"
        immediate: "能量到的跨度获得尺度，遮住的部分仍留空"
        near: "修订图可供下一次获准查看时比对，不构成修屋许可"
    共读入口壁刻:
      places:
        - "倒悬石梁地宫"
      pairs:
        - 0
      category: "信息交换"
      action: "{npc}把获准查看的摹本举到入口光下，问你图中的行旅究竟面向哪边。"
      beats:
        trigger: "{npc}把获准查看的摹本举到入口光下，问你图中的行旅究竟面向哪边。"
        objective: "比较观看角度如何改变对图案的理解"
        choice: "可谈自己的读法；可只看不猜故事，或在看守处休息等同伴"
        immediate: "两种读法可以并存，光影与缺损解释不了的部分不补成秘道线索"
        near: "离开只带个人观察心得与获准摹本，不从墙上取样或拓新页"
  customs:
    - "向导在地图旁保留空白，让后来者补记实际水情。"
  pressures:
    返程水点迁移:
      source: "刚回客栈的向导告知旧图水点改道，当天未能在原址取水。"
      engines:
        - "资源锁定"
        - "时限逼近"
      beats:
        trigger: "{npc}发现刚回客栈的向导告知旧图水点改道，当天未能在原址取水。"
        objective: "确认返程可用补给再选今日行程"
        choice: "询问新点实际取水情况并缩短行程；或不出发，留店等同行商队"
        immediate: "原计划少去一处遗迹，现有饮水先保证回店而不是延长停留"
        near: "等待增加住宿花费，绘图员与测绘师各自决定是否继续这趟工作"
      far_trigger: "商队下次离站前仍无新水点实取消息"
      far_consequence: "远段勘查取消或改季节，预算转为在驿站整理旧图，不靠传闻硬续原路线"
      bindings:
        -
          activity: "整备返程水囊"
          place: "龙门客栈地窖"
          pair: 0
      exits:
        - "取消远段行程，把未用借物归还掌柜"
        - "结束此次协作，随已确认补给的商队返城"
    遗迹归属争议:
      source: "看守发现两队持有范围不一致的许可，要求停止入口以内的观察工作。"
      engines:
        - "身份风险"
        - "第三方施压"
      beats:
        trigger: "{npc}发现看守发现两队持有范围不一致的许可，要求停止入口以内的观察工作。"
        objective: "分清当日可进入范围，不以熟识看守代替许可"
        choice: "退出入口平台联系签发方；或今天只在客栈讨论已有获准摹本"
        immediate: "不再移近壁面，也不替另一队保管或搬走遗物"
        near: "等待回信延后勘查，绘图员仍可做无争议的驿路核对"
      far_trigger: "许可签发方明确入口区域归另一队当前独用"
      far_consequence: "本队改排别处观察或结束本季行程，已付路费不能换取越界理由"
      bindings:
        -
          activity: "共读入口壁刻"
          place: "倒悬石梁地宫"
          pair: 0
      exits:
        - "退回看守处并离开遗迹"
        - "取消争议区域的工作，保留原有合法摹本整理任务"
  legacy_sources:
    eras:
      - "民国初年大漠荒城"
    aesthetics:
      - "西域丝路奇谭"
      - "古墓探险硬派风"
    places:
      - "龙门客栈地窖"
      - "破败义庄"
      - "倒悬石梁地宫"
  themes:
    - "沙地行程里返程水量的优先次序"
    - "旧图与现地尺度的互相纠错"
    - "观看遗迹而不占有遗物"
  technology_boundary: "民国初年大漠驿路依赖罗盘、绳尺、纸图、油灯和商队口信；相机若由来客自备也不能即时给出结构结论。本地没有定位终端或可靠即时无线联络，地宫的奇异石梁不被当成超自然通行保障。"
  bridge_status: "not_required"
