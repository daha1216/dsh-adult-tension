id: mat-9de13e83d7fa5038aef27ca1665f97b4
name: 风沙驿站与旧图
material:
  eras:
  - 民国初年大漠荒城
  aesthetics:
  - 西域丝路奇谭
  - 古墓探险硬派风
  rule: 驿站依靠水源、商队与地形记录维系，遗迹探索必须顾及返程；旧图只作参考，图上未注明的墓道与石门一律按未探处理，断龙石一旦落下即封死退路，取物之前先定好谁在门外接应。
  social_rule: 未经许可不带走遗物，路线更新须注明亲见与传闻；外乡人自带嫌疑，落脚未满三日者不得单独进入墓道，陌生地方暂时不追问来处，问出口的人要自己担下问的后果。
  places:
    龙门客栈地窖:
      details:
      - 龙门客栈地窖的水囊架与粮箱分开摆放
      - 通风口漏下沙粒，掌柜在木梯旁留下提灯
      - 地窖最深处的门背后另有一层木门，门上用炭写着今年山洪的旧水位·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 收起借用物沿木梯回客栈堂屋
        witnesses:
        - 掌柜或管库伙计
        affordances:
        - 整备返程水囊
        - 比较个人行囊与实物余量
        - 核对木门上的旧水位炭记
        pressure_modifiers:
        - 取水日期
        - 水囊和包布是否完好
    破败义庄:
      details:
      - 沙地义庄的旧门廊留下两轮不同的补梁痕
      - 坍损内屋不进入，绳尺只在看守许可的外沿展开
      - 外沿草席下压着一叠扎好的纸人，看守说这是给无人认领的旅人备下的·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从稳固门廊退到原来抵达的驿道
        witnesses:
        - 当地受托看守人
        affordances:
        - 描绘旧建筑梁架
        - 从地面量取可见跨度
        pressure_modifiers:
        - 风沙遮挡程度
        - 获准可测的外沿范围
    倒悬石梁地宫:
      details:
      - 倒悬石梁在入口投下斜影，深处不对访客开放
      - 看守引人停在已查验的入口平台，既有摹本放在便携板上
      - 入口内侧的断龙石停在一半，石槽里积着新落的沙粒·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 沿原来查验过的入口坡道退出，不穿越悬梁下方
        witnesses:
        - 遗迹看守人与带路人
        affordances:
        - 共读入口壁刻
        - 比较摹本和可见图案
        pressure_modifiers:
        - 日光投影角度
        - 当日获准观察边界
  pairs:
  - family: 学术与专业
    position: 黑夜佣兵统帅
    appellations:
    - 先生
    npc:
      role: 驿路绘图员
      function: 记下已验证水点与行路耗时，说明旧图限制
      authority: 可撤下本人过时路线建议，不能批准遗迹勘查
      resource: 附取水日期的路线图和刚归队向导的联络
      limitation: 未亲见的新水点要复询，不能承诺每队走同样时长
      obligation: 先安排返程补给，讲清传闻不作保证
      exposure: 路线失准会使商队不再共享水情
    player:
      identity: 旧建筑测绘师
      baseline: 你想看清一根旧梁怎样接起来，也愿意为保留返程水量放弃深处那一笔。
      resources:
      - 亲测跨度的量距笔记
      - 获准查看的既有摹本
      reputation: 未量的尺寸不填成精确数字
    relationship_reason: 测绘师发现旧水点图把两段驿道画得一样长，绘图员邀他按实际脚程重新核对返程装备。
  - family: 学术与专业
    position: 同侪
    appellations:
    - 先生
    npc:
      role: 旧建筑测绘师
      function: 测量可接近的外观尺度，保存分期修补痕
      authority: 能暂停自己的测量，扩大范围须获看守及许可方确认
      resource: 绳尺、垂线和旧建筑草图
      limitation: 不能凭一幅外观图判定石梁稳固，也无权带走遗物
      obligation: 注明观测位置和看不到的部位，不把推测补成实测
      exposure: 误标会使后续队伍白跑或做错修缮方案
    player:
      identity: 驿路绘图员
      baseline: 你最在意图上的下一口水是不是今天还能取，愿听测绘师指出图上的尺度误差。
      resources:
      - 一张可添注的空白驿道底图
      - 自己的水囊和一只防沙图筒
      reputation: 能回驿站比画满地图重要
    relationship_reason: 绘图员帮测绘师联系义庄看守，测绘师则解释梁影不等于梁的实际跨度，两人开始互相校正观察方法。
  activities:
    整备返程水囊:
      places:
      - 龙门客栈地窖
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}在掌柜许可的地窖把自己的旧水囊取下，邀你看包布与系带是否完好。'
      beats:
        trigger: '{npc}在掌柜许可的地窖把自己的旧水囊取下，邀你看包布与系带是否完好。'
        objective: 把个人返程容器和背负位置整备妥当
        choice: 可重系包布并试背；可只核对自己的水量，或留客栈不出发
        immediate: 漏损容器交给可修的人处理，不把清单上的容量当实际存水
        near: 下一次出发前还需按最新水点确认补给，今日整备不等于报名进遗迹
    描绘旧建筑梁架:
      places:
      - 破败义庄
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}从义庄门廊外沿拉开绳尺，请你比较草图里哪段被透视缩短。'
      beats:
        trigger: '{npc}从义庄门廊外沿拉开绳尺，请你比较草图里哪段被透视缩短。'
        objective: 用可见跨度校正草图，不推断内屋承重
        choice: 可测一段或只核对比例；可留在驿道看远景，不进观察点
        immediate: 能量到的跨度获得尺度，遮住的部分仍留空
        near: 修订图可供下一次获准查看时比对，不构成修屋许可
    共读入口壁刻:
      places:
      - 倒悬石梁地宫
      pairs:
      - 0
      category: 信息交换
      action: '{npc}把获准查看的摹本举到入口光下，问你图中的行旅究竟面向哪边。'
      beats:
        trigger: '{npc}把获准查看的摹本举到入口光下，问你图中的行旅究竟面向哪边。'
        objective: 比较观看角度如何改变对图案的理解
        choice: 可谈自己的读法；可只看不猜故事，或在看守处休息等同伴
        immediate: 两种读法可以并存，光影与缺损解释不了的部分不补成秘道线索
        near: 离开只带个人观察心得与获准摹本，不从墙上取样或拓新页
    分半张烤得焦黄的干烙馍:
      places:
      - 破败义庄
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}把一张干烙馍掰成两半，把烤得焦黄的那半转向你。'
      beats:
        trigger: '{npc}把一张干烙馍掰成两半，把烤得焦黄的那半转向你。'
        objective: 在沙地走完全程之前让两边的干粮撑得一样久
        choice: 可接过焦黄那半；可把大的一半推回去；或各自吃自己的干粮
        immediate: 两半当场分完，谁吃哪一块都记在自己名下，不欠赊账
        near: 分法会被记住，下次出沙时对方掰馍的手会偏向谁，就说明这一顿算不算人情
    递过半瓶干净水:
      places:
      - 龙门客栈地窖
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}把腰间只剩半瓶的水解下来，递给你，说地窖里还有一整架。'
      beats:
        trigger: '{npc}把腰间只剩半瓶的水解下来，递给你，说地窖里还有一整架。'
        objective: 让眼下这半瓶水不被当成取之不尽的保证
        choice: 可接下并当场回灌自己的水囊；可只润一口把瓶还回去；或推辞说自己还有
        immediate: 半瓶水的去处当场定下，架上那整排仍按取水日期逐日支用
        near: 下一段路的水点还未确认，这半瓶顶过今天，明天仍要按图上新点重新分配
    递出一张乘车通行证:
      places:
      - 倒悬石梁地宫
      pairs:
      - 0
      category: 信息交换
      action: '{npc}从图筒里抽出一张乘车通行证，问你是要自己先走，还是留在这里把摹本对完。'
      beats:
        trigger: '{npc}从图筒里抽出一张乘车通行证，问你是要自己先走，还是留在这里把摹本对完。'
        objective: 在车队出发前定下谁走谁留，不把通行证当成两张
        choice: 可收下通行证先回城；可把证退回留下对完摹本；或请看守代为保管改日再用
        immediate: 通行证只写一人名字，当场交到谁手上就是谁的，另一人留在原处等下一趟车
        near: 车队不会为等人延期，先走的一方带走图上的记录，留下的一方此后只能靠口信接续
    把关键物品留在原地后离开:
      places:
      - 倒悬石梁地宫
      pairs:
      - 1
      category: 空间与退出
      action: '{npc}把摹本合上放回便携板正中，说这一处今天她不带走了。'
      beats:
        trigger: '{npc}把摹本合上放回便携板正中，说这一处今天她不带走了。'
        objective: 退出观察但保留下一次获准再来的余地
        choice: 可留下摹本只带走自己的量距笔记；可请看守封存改日再议；或直接放弃这一处的勘测
        immediate: 摹本留在板上，断龙石仍停在半空，石槽里的沙粒照落
        near: 留物不留下承诺，下次再来仍须重新取得许可，留下的摹本要看守愿意才收
  customs:
  - 向导在地图旁保留空白，让后来者补记实际水情。
  - 分食干粮时把焦的那半让出去的人，下一次分水时会被先记一笔。
  pressures:
    返程水点迁移:
      source: 刚回客栈的向导告知旧图水点改道，当天未能在原址取水。
      engines:
      - 资源锁定
      - 时限逼近
      beats:
        trigger: '{npc}发现刚回客栈的向导告知旧图水点改道，当天未能在原址取水。'
        objective: 确认返程可用补给再选今日行程
        choice: 询问新点实际取水情况并缩短行程；或不出发，留店等同行商队
        immediate: 原计划少去一处遗迹，现有饮水先保证回店而不是延长停留
        near: 等待增加住宿花费，绘图员与测绘师各自决定是否继续这趟工作
      far_trigger: 商队下次离站前仍无新水点实取消息
      far_consequence: 远段勘查取消或改季节，预算转为在驿站整理旧图，不靠传闻硬续原路线
      bindings:
      - activity: 整备返程水囊
        place: 龙门客栈地窖
        pair: 0
      exits:
      - 取消远段行程，把未用借物归还掌柜
      - 结束此次协作，随已确认补给的商队返城
    遗迹归属争议:
      source: 看守发现两队持有范围不一致的许可，要求停止入口以内的观察工作。
      engines:
      - 身份风险
      - 第三方施压
      beats:
        trigger: '{npc}发现看守发现两队持有范围不一致的许可，要求停止入口以内的观察工作。'
        objective: 分清当日可进入范围，不以熟识看守代替许可
        choice: 退出入口平台联系签发方；或今天只在客栈讨论已有获准摹本
        immediate: 不再移近壁面，也不替另一队保管或搬走遗物
        near: 等待回信延后勘查，绘图员仍可做无争议的驿路核对
      far_trigger: 许可签发方明确入口区域归另一队当前独用
      far_consequence: 本队改排别处观察或结束本季行程，已付路费不能换取越界理由
      bindings:
      - activity: 共读入口壁刻
        place: 倒悬石梁地宫
        pair: 0
      - activity: 描绘旧建筑梁架
        place: 破败义庄
        pair: 1
      exits:
      - 退回看守处并离开遗迹
      - 取消争议区域的工作，保留原有合法摹本整理任务
    暴雨山洪即将倒灌古墓:
      source: 上游雨线连着下了三日，地窖木门上那道炭记的水位被抬高一指，按向导的说法水头两日内到地宫，倒灌时断龙石会被沙水顶死。
      engines:
      - 时限逼近
      - 共处密闭
      beats:
        trigger: '{npc}发现地窖木门上那道炭记的水位被抬高一指，向导说水头两日内到地宫。'
        objective: 在水头到来前决定撤出观测还是抢完手上这一段
        choice: 可立刻收绳退出地宫回客栈；可只把摹本与笔记带出、人留在入口平台；或赌雨线转小继续测完
        immediate: 断龙石仍停在半空，沙粒落在石槽里，谁先走谁先过那道口
        near: 留在里面的时间按水位倒计，退出去的人还得为留下的人留着车与粮
      far_trigger: 水头到达入口时石槽里的沙已积满，断龙石落到底
      far_consequence: 地宫这一段封死至少一季，未带出的摹本与器具一并留在里面；抢在落石前出来的人只丢东西，不丢命也不丢图。
      bindings:
      - activity: 把关键物品留在原地后离开
        place: 倒悬石梁地宫
        pair: 1
      exits:
      - 沿入口坡道退出地宫，回客栈等水位退
      - 放弃本季这一段勘测，把余下工作改到别处
    地宫断龙石落下一半:
      source: 断龙石停在半空，石槽里的沙每落一阵便抬高一寸，看守说按旧例落到底就不再开，里面的人得自己找出路。
      engines:
      - 共处密闭
      - 资源锁定
      beats:
        trigger: '{npc}发现断龙石停在半空，石槽里的沙每落一阵便抬高一寸。'
        objective: 在石落到底之前把人和摹本都退到入口以外
        choice: 可当即收绳退到坡道；可只把摹本递出去人再留一刻；或按看守的话留下等落定再走
        immediate: 石仍停在半空，坡道可通，脚下沙粒落得比刚才快
        near: 石落之后这一段的进出由看守另定，今日带出的记录仍归本人
      far_trigger: 断龙石落到底且沙水未退，入口平台被淹
      far_consequence: 地宫改由看守封锁，本队失去这一处的查看权，未及带出的摹本按遗失处理，各自回去补记口述版本。
      bindings:
      - activity: 递出一张乘车通行证
        place: 倒悬石梁地宫
        pair: 0
      exits:
      - 持通行证先随车队返城，把收尾留给同伴
      - 退回看守处登记后离开遗迹
    守孝之年:
      source: 她家中长辈去世未满一年，按旧礼这一年不赴宴、不穿新衣、不与外人同席，图上的路线却要她亲自去核。
      engines:
      - 旧礼束身
      - 名声保卫
      beats:
        trigger: '{npc}说明家中长辈去世未满一年，按旧礼这一年不赴宴、不与外人同席。'
        objective: 把该核的路走完，又不让旧礼在同行面前被当成软处
        choice: 可分开走、只在图上交接；可当众把旧礼讲清再同行；或劝她先把这一年放过去
        immediate: 过夜仍分开两处，驿站的饭各吃各的，图上的记录照常交接
        near: 同行者会按各自习惯议论，这一年说不清就有人拿它压价，说清了也得自己守到底
      far_trigger: 这一年之内有人拿旧礼在商队面前换掉她的名分
      far_consequence: 旧礼与图上的记录一并被旁人拿去说事，她要再核这一段就得先向人解释自己为何还在这里。
      bindings:
      - activity: 分半张烤得焦黄的干烙馍
        place: 破败义庄
        pair: 1
      exits:
      - 按旧礼分开住，白日只在图上交接
      - 暂时退出这趟协作，等守孝期满再上路
    寻亲有果:
      source: 走了三年的那条线，终于有人在义庄门外认出她腰间那枚木牌，说当年同行的另一个孩子还活着，眼下就在这趟车队里。
      engines:
      - 旧情重逢
      - 身份错位
      beats:
        trigger: '{npc}在义庄门外被人认出腰间那枚木牌，说当年同行的另一个孩子眼下就在这趟车队里。'
        objective: 在车队散开之前确认那个人是不是自己找的那个
        choice: 可当面去问；可先托看守代为核实；或就此收手，把这条线停在认出来的这一刻
        immediate: 认亲的话只说了一半，木牌仍在腰间，车队明日照旧出发
        near: 认下与不认都要在车队走散前定，认错了要担旧礼与家产的牵扯，不认这条路从此没人再替她走
      far_trigger: 车队离站那日仍无人当面认下这层关系
      far_consequence: 线断了，木牌还挂在腰间但不再有人接话，她此后走这条驿路只按向导和图走，不再托人打听。
      bindings:
