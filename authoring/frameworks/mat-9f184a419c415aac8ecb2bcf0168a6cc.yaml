      far_consequence: 真名及其全部授权被一次取用，此后本人做什么都顶着别人的名义；撤回过的至少留下可查的边界
      exits:
      - 逐项撤回后交还令状副本
      - 改以日常称呼重新登记，真名不再出现于任何文书
      bindings:
      - activity: 抽查一次封存匣的编号
        place: 真名封存地下层复核室
        pair: 0
    名分悬置:
      source: 两人之间的名分始终没有落进登记簿，任何一方随时可以否认，否认的代价却全部由另一方承担。
      engines:
      - 信任透支
      - 身份风险
      beats:
        trigger: '{npc}被人当众问起跟你的关系，回答之前先看了你一眼。'
        objective: 把名分落到可查的凭据上，或者干脆说清没有
        choice: 当场应下并约日子登记；含糊过去；或直接说明只是往来
        immediate: 口头说法当场生效，登记另约，谁也不必马上下不来台
        near: 否认一次就少一分再否认的余地，登记之后否认要先注销
      far_trigger: 第三次被问起仍无任何凭据
      far_consequence: 临时说法在街坊里固化成事实版本，往后要改得花双倍力气；已登记的按档面走
      exits:
      - 约期登记，把名分写进簿子
      - 当面说清不是那种关系，从此各走各的
      bindings:
      - activity: 在公诉席前听一次名分宣告
        place: 契约公证庭夜审候审廊
        pair: 0
    秘密暴露倒计时:
      source: 你知道的那件事已经有三个人听见风声，每多一个人知道，泄露的价钱就低一成，倒计时从第一句传言开始。
      engines:
      - 共同秘密
      - 时限逼近
      beats:
        trigger: '{npc}告诉你第三个人今天也问起了同一件事，问还压不压得住。'
        objective: 在传言变成定论前决定封口还是抢先坦白
        choice: 封口；抢先对关键的人坦白；或把消息源掐掉但不动内容
        immediate: 消息今晚不再扩散，知情面停在现有三个人
        near: 压得住不等于抹掉，任何一个人翻脸都能把它重新推上台面
      far_trigger: 第四方介入且不再接受安抚
      far_consequence: 秘密在公开场合被抖出，压过消息的人反倒像主谋；先坦白者至少掌握叙述顺序
      exits:
      - 向关键的人主动交代，承担当次后果
      - 彻底封口并抽身，从此不再出现在相关信息链里
      bindings:
      - activity: 让戒指当场复归
        place: 夜市后巷当铺
        pair: 0
    审查将至:
      source: 登记所的例行审查提前落到这一条契约上，审查员要看原件、经手人与每一次授权时点，缺一环即整条作废。
      engines:
      - 身份风险
      - 时限逼近
      beats:
        trigger: '{npc}收到审查通知，要求三日内交齐原件与经手人清单。'
        objective: 在审查前补齐链条上缺的那一环
        choice: 交齐原件；补一份情况说明；或申请延期
        immediate: 受理编号生成，审查期从明日起算
        near: 说明能不能过关取决于经手人肯不肯出面，不肯出面的那一环就是整条的断点
      far_trigger: 审查当日链条仍有断点
      far_consequence: 整条契约作废，已履行的部分不退，附带的授权一并失效；补齐的可转入正常复核
      exits:
      - 补齐链条通过审查，换发新的登记号
      - 主动申请注销，把未履行部分结清
      bindings:
      - activity: 在交割前最后一刻核对身份
        place: 契约公证庭夜审候审廊
        pair: 1
    非人之躯将露:
      source: 维持人形的术式在减弱，破绽先从耳朵和影子上出来，一旦被人当成凭据记进册子，就再也洗不掉。
      engines:
      - 身份风险
      - 契约精怪
      beats:
        trigger: '{npc}抬手挡了一下耳侧，问你会不会有人刚好在这个时辰看过来；那对尖长的耳廓在灯下正一点点掩不回去。'
        objective: 在被记进册子前撑过剩下的时辰
        choice: 陪他换地方；替他挡在前面；或先回去各过各的
        immediate: 破绽今晚没被旁人看实，人还在原处
        near: 术式补不回来，破绽出现的间隔只会越来越短，能藏的地方越来越少
      far_trigger: 在公开场合被看清一次并留下书面记录
      far_consequence: 以人的身份办的登记全部需要重核，日常往来的圈子要么装作没看见要么就此散开
      exits:
      - 改换居住与登记地，以另一重身份重新开始
      - 去登记所主动备案，按非人族条款重新登记
      bindings:
      - activity: 替人保管一枚印记
        place: 真名保管库
        pair: 0
    契约精怪:
      source: 契约本身养出了一点活气，它按字面执行条款，不听解释也不认人情，字句里每一次含糊都会变成它下一次伸手的依据。
      engines:
      - 契约精怪
      - 共同秘密
      beats:
        trigger: '{npc}发现契约副本上多出一行谁也说不清什么时候写上的小字。'
        objective: 在下一次伸手之前把含糊的字句改清
        choice: 逐条重写；先停用；或找当初的经手人说明
        immediate: 多出来的那一行被划掉并盖印，原有的条款继续有效
        near: 重写要双方都在场，改不清的地方它下次照样按自己的读法来
      far_trigger: 含糊条款第二次被引用执行
      far_consequence: 履约结果与当事人原意相反，纠正要走正式程序；改清过的条款不会再被它引用
      exits:
      - 双方到场逐条重写，换发清晰版本
      - 停用这份契约，另以口头与见证处理往来
      bindings:
      - activity: 校译公共服务条款
        place: 契约登记所
        pair: 0
    赌约生效:
      source: 一句拿真名做注的赌约已经落到登记簿上，到期不兑现由第三方代为执行，赖账的人从此没人愿意跟他赌。
      engines:
      - 信任透支
      - 时限逼近
      beats:
        trigger: '{npc}把筹码摆回桌上，提醒再过一刻钟赌约就进入执行期。'
        objective: 在执行期前把赌注落到说得清的东西上
        choice: 认赌兑现；改换等值的东西；或当场认输把筹码推回去
        immediate: 筹码由第三方看管，执行期顺延到谈妥为止
        near: 谈不拢就按登记的字面执行，谁赖账谁的名字进失信名单
      far_trigger: 执行期到点仍无人兑现
      far_consequence: 第三方按字面替你兑现，代价是往后所有见证场合都不再有你的位置
      exits:
      - 兑现赌注，让第三方交接清楚
      - 请第三方销毁赌约，双方各自认下口头承诺
      bindings:
      - activity: 拿命约赌一句真名
        place: 非人族夜市
        pair: 0
    身份风险:
      source: 另一重身份与这一重快要对不上账，两边的凭据、作息与经手人都在互相揭底，任何一次核对都可能成为定论。
      engines:
      - 身份风险
      - 信任透支
      beats:
        trigger: '{npc}把两份凭据并排放在灯下，问你打算让哪一份作废。'
        objective: 在两份凭据被同时调取前决定保哪一重
        choice: 注销一重；找经手人改口；或两边都先按下不动
        immediate: 两份凭据都被标为待核，今夜不被调取
        near: 同时存在的时间越长，被对上账的机会越大，改口的人也要承担作伪的后果
      far_trigger: 第三次核对时两份凭据仍同时有效
      far_consequence: 登记所按重复登记处理，涉事授权全部冻结；提前注销的只损失其中一重
      exits:
      - 注销其中一重身份，保住另一重的全部授权
      - 两重同时弃用，换一个干净的名义重新开始
      bindings:
      - activity: 在旧电梯井夹层对租约
        place: 跨界租赁塔旧电梯井
        pair: 1
    对等试探:
      source: 双方手上各有对方一样东西，谁先亮底谁先输，这种局面下每一次往来的分寸都是可量化的，先越线的那个人把把柄送了出去。
      engines:
      - 信任透支
      - 对等试探
      beats:
        trigger: '{npc}把属于你的那样东西摆在桌面上，却不先开口谈条件。'
        objective: 在不动手的情况下试出对方到底想要什么
        choice: 接住对方的东西；只谈条件不动东西；或先把自己的东西收回来
        immediate: 桌面上的东西一件没少，两边的分寸都被记住
        near: 谁先在别处用了那份筹码，谁就把对等打破了，剩下的一方可以名正言顺地加码
      far_trigger: 其中一方在别处动用了对方的把柄
      far_consequence: 对等消失，被动了把柄的一方可以择时反击或索价；守约的仍是平手
      exits:
      - 交换各自的筹码，两清
      - 把东西留在桌上，各自走人，谁也不欠谁
      bindings:
      - activity: 在夜市核对一张当票的赎回期限
        place: 非人族夜市
        pair: 1
    攻守易位:
      source: 上一轮里握着把柄的人此刻落了把柄在对方手上，攻守换了个位置，但两边都清楚对方的底价，谁先动手谁先暴露底牌。
      engines:
      - 攻守易位
      - 信任透支
      beats:
        trigger: '{npc}在灯下把上一轮的价码重新念了一遍，这次念的是你的。'
        objective: 在位置调换后重新谈一个双方都认的界限
        choice: 接住调换后的位置；把两笔旧账一起抹掉；或索性退到不参与的位置
        immediate: 旧价码废止，新界限只停在口头上，谁也没有先动手
        near: 位置调换后唯一安全的做法是重新议价，谁先拿旧账压人谁就先输一回
      far_trigger: 调换后一方仍按旧位置发号施令
      far_consequence: 被压的一方可以拿新把柄反制，届时旧账新账一起算
      exits:
      - 两笔旧账当面抹掉，重新议定边界
      - 各自退出这段往来，谁也不再引用对方的东西
      bindings:
      - activity: 在夜市核对一张当票的赎回期限
        place: 非人族夜市
        pair: 1
    公共登记出现重复:
      source: 同一项申请出现了两份不同版本
      engines:
      - 身份风险
      - 资源锁定
      beats:
        trigger: '{npc}收到消息：同一项申请出现了两份不同版本。'
        objective: 核实本人选择并取消无效版本
        choice: 邀请申请人核对，或先冻结重复办理
        immediate: 保管员提示同一寄存申请有两份版本，演练停在接待区，双方不查看封存内容。
        near: 只有申请人可选择保留版本，协调员负责预约本人到场而不代签；若两份版本分别挂在不同的授权下，先冻结生效较晚的那一份，本人不到场则该份到期自动作废。
      far_trigger: 下一轮授权读取前重复版本仍未取消
      far_consequence: 该项读取暂停，申请人可取回寄存物；不会冻结无关街坊服务。
      exits:
      - 退出协助，由申请人与保管员单独核验
      - 申请人按本人权限撤回这项寄存，不追加新授权
      bindings:
      - activity: 试用匿名来访流程
        place: 真名保管库
        pair: 1
  legacy_sources:
    eras:
    - 契约共存时代
    aesthetics:
    - 都市轻悬疑
    places:
    - 契约登记所
    - 真名保管库
    - 非人族夜市
    - 结界检查站
    - 契约公证庭夜审候审廊
    - 跨界租赁塔旧电梯井
    - 真名封存地下层复核室
    - 夜市后巷当铺
  themes:
  - 不同族群的日常服务尺度
  - 名字的使用权与办事便利
  - 字面相同却不等义的承诺
  - 契约自动执行与人的意愿之间的落差
  - 名分、真名与信用三者互相折算的价位
  - 双面身份在登记簿上对不上账的那一刻
  technology_boundary: 本地都市具有纸质和电子办事设备，结界依托同一世界的术式设施；真名封存只控制授权读取，不能读心、强迫感情或自动裁定争议。契约术式可以自动执行已登记的条款（续期、扣押、交割），但不能凭空变更条款文字，也不能替当事人表达意愿；公证庭的夜审与候审廊属本地常设机构，读时点记录、抄录凭据与双人复核都是可见的文书动作，不存在读心或预知式取证。跨界租赁塔的电梯为机械驱动，断电即停在夹层，井内没有监控，只能靠检修铁牌与拾音管留下痕迹；封存地下层复核室按登记本号取匣、双人在场启封，读取权限逐条登记，术式只认编号不认人；夜市后巷当铺走的是死当与赎回的账期，凭条与柜上实物是唯一凭据。不引入跨世界桥梁。
  bridge_status: not_required
