id: mat-9f184a419c415aac8ecb2bcf0168a6cc
name: 契约城与非人街坊
material:
  eras:
  - 契约共存时代
  aesthetics:
  - 都市轻悬疑
  rule: 不同族群共同生活，契约为公共服务约定边界，不能代替人的意愿；但契约一旦登记便按条款自动执行，续期、扣押与交割不需要当事人再点头，信任在城里是最稀缺的通货，信息按权限分层流通，谁能读哪一段本身就是筹码。
  social_rule: 真名仅用于本人授权的事务，契约不能制造感情或强迫私人关系；于是关系一旦公开就同时变成把柄与负债，外族规矩与人类法律相撞时以登记在先者为准，私自独处视同违规联络，信用分直接定价一个人的身价，谁先开口谁先理亏。
  places:
    契约登记所:
      details:
      - 双语条款样本摆在非办理咨询桌上·晚
      - 窗口后的续期作业单堆到齐肩，最上面一叠标着三日内的自动续期·夜
      profile:
        privacy: medium
        visibility: high
        exits:
        - 从咨询区回街道，未签样表可带走
        witnesses:
        - 当班登记员
        affordances:
        - 校译公共服务条款
        pressure_modifiers:
        - 正式办理队列与译员值班时段
        - 自动续期条款的生效时刻
    真名保管库:
      details:
      - 屏蔽真名的保管库外接待间放着空封套·晚
      - 接待台侧贴着一张把真名与日常称呼分开的书役告示·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 经接待门回外街，不穿封存库区
        witnesses:
        - 保管员
        affordances:
        - 试用匿名来访流程
        pressure_modifiers:
        - 来访资格与读取授权范围
        - 追索令文书是否已经送达
    非人族夜市:
      details:
      - 夜市摊前高低不同的座凳围着分食小桌·夜
      - 后巷当铺的灯笼亮到很晚，收摊的摊主把没卖完的货换成一纸票根·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 从摊间两条巷道回主街
        witnesses:
        - 摊主与不同族群食客
        affordances:
        - 合点一份跨族小食
        pressure_modifiers:
        - 原料适配和各族用餐时段
        - 收摊时间与夜市里半公开的当票行情
    契约公证庭夜审候审廊:
      details:
      - 候审廊的长凳被磨得发亮，木栏外侧挂着当日排期木牌·夜
      - 值夜书记在廊尽头清点待签文书，穿过廊子就能听见庭内交割唱名
      profile:
        privacy: medium
        visibility: high
        exits:
        - 从候审廊正门退出，未传唤者不得进庭审区
        witnesses:
        - 值夜书记与候审当事人
        affordances:
        - 旁听一次交割唱名
        pressure_modifiers:
        - 当日排期与庭审是否公开
        - 值夜书记记下的会面时刻
    跨界租赁塔旧电梯井:
      details:
      - 井道铁栅只到七层，八层以上是两族共管的灰区，钢缆上挂着检修铃·夜
      - 梯厢停在夹层时，上下两层都听不见彼此动静
      profile:
        privacy: high
        visibility: low
        exits:
        - 顺钢梯下到七层后勤门，或按铃请值班员放行
        witnesses:
        - 通常无；检修铃连通值班室
        affordances:
        - 在夹层里核对租约副本
        pressure_modifiers:
        - 检修铃连通值班室的时长
        - 停电时井道无照明
    真名封存地下层复核室:
      details:
      - 复核台只留一盏冷光灯，封存匣按编号嵌进墙内，抽匣会触发登记·夜
      - 房间隔音，站在门外听不到复核内容
      profile:
        privacy: high
        visibility: low
        exits:
        - 经双重门回接待外间，出门即留时点记录
        witnesses:
        - 复核员一人，双人规则到场时另有监督员
        affordances:
        - 对照复本核实真名归属
        pressure_modifiers:
        - 每一次抽匣都要留时点记录
        - 双人复核规则是否被临时放宽
    夜市后巷当铺:
      details:
      - 柜台玻璃下压着典当票根，铜秤旁边搁着没擦净的印泥·夜
      - 后巷没灯，却是夜市里唯一能把话说尽的地方
      profile:
        privacy: high
        visibility: low
        exits:
        - 从后巷两端绕回夜市主街
        witnesses:
        - 当铺伙计在后间算账
        affordances:
        - 对一张典当票做估值
        pressure_modifiers:
        - 死当期限与当期利钱
        - 后巷无灯，没人看得见谁进谁出
    结界检查站:
      details:
      - 结界外等待亭的地面分出宽窄两条通道·夜
      - 告示柱上贴着当日收紧后的新检验等级·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 原路回城内等候区，不擅闯结界
        witnesses:
        - 检查站引导员
        affordances:
        - 试走结界外等候通道
        pressure_modifiers:
        - 通道尺寸与结界检测节奏
        - 当日的检验等级与是否逐件复检
  pairs:
  - family: 语言与传译
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 契约文书译员
      function: 解释双语服务条款与口述习惯
      authority: 能提出译法，生效条款仍由当事人与登记员确认；对治理、执法与中介三方的成文规矩只作解释，不代人答应
      resource: 双语术语卡和不含真名的样本
      limitation: 不能读取封存真名，无法替任何族群说出统一偏好；对无权过问的通道与审批事项只能指出入口，不代为递送
      obligation: 说明译法差异并保留当事人的否决权；不得为促成一次交割而替当事人选条款
      exposure: 一句期限误译会让申请人多付一次服务费；把不准读的那一页说出口，代价是这条街再没人肯把话交到你手上
      hidden: —
    player:
      identity: 公会契约使魔
      baseline: 你曾指出夜行居民对一天的理解不同，他请你继续用生活经验检查译文
      resources:
      - 摊主联络、可调座凳与服务窗口时间
      - 夜市摊主与登记所的熟客名单
      - 随时能核对的执事排期表
      reputation: 契约使魔，能解释措辞但不能读取真名
    relationship_reason: 你曾指出夜行居民对一天的理解不同，他请你继续用生活经验检查译文
  - family: 服务与手艺
    position: 公会契约使魔
    appellations:
    - 直呼其名
    npc:
      role: 社区服务协调员
      function: 让不同体型与作息的街坊找到可用服务
      authority: 可预约自愿试走，不能签发结界通行许可；在通道尺寸与检验安排上只能登记诉求，不能改当日等级
      resource: 自愿试走的预约记录、保管库练习封套与一回陪同办事的名额
      limitation: 不是结界术师，也不能替申请人选定封存版本或通道；对夜市与后巷里的灰色生意只当没看见，不保证任何行情
      obligation: 把生活不便说清，不代替本人作承诺；每一次调取记录都告知本人，不私下留档
      exposure: 错误指引会让居民重复排队；以日常称呼顶替真名的写法一旦被追索方认作凭据，排在你后面的所有人都要重办一遍
      hidden: —
    player:
      identity: 契约文书译员
      baseline: 你把一条难懂的授权句拆成两个选择，他邀你一起试一次保管库接待流程
      resources:
      - 一册记满返工例的办事疑难簿
      - 把长句拆成两问的改写习惯
      - 可作保的交接记录与见证人名单
      - 熟记的正式流程受理口
      reputation: 夜班契约译员，能解释措辞但不能读取真名
    relationship_reason: 你把一条难懂的授权句拆成两个选择，他邀你一起试一次保管库接待流程
  activities:
    校译公共服务条款:
      places:
      - 契约登记所
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}将昼行族和夜行族对次日的两种说法并排，请你举一个实际领取例子；同一份原本上，两族的期限写法差着一个晚上。'
      beats:
        trigger: '{npc}将昼行族和夜行族对次日的两种说法并排，请你举一个实际领取例子；同一份原本上，两族的期限写法差着一个晚上。'
        objective: 找出同词不同期限而非统一所有习惯，并说清按哪一版的时点执行
        choice: 比对例子；不参与校译；或请另一位母语者复述；也可只把两种写法并列存档不署名
        immediate: 服务期限改用可核对时点，保留不同作息选项供确认；有分歧的字句先空着不写进正式本
        near: 下一次申请可以减少一次因词义造成的返工；若故意选歧义译法，往后每次对账都要重打一遍
    试用匿名来访流程:
      places:
      - 真名保管库
      pairs:
      - 1
      category: 空间与退出
      action: '{npc}递给你没有真名的练习封套，请你走到接待台再选择是否继续；台面上同时摆着一份已填真名的正式单。'
      beats:
        trigger: '{npc}递给你没有真名的练习封套，请你走到接待台再选择是否继续；台面上同时摆着一份已填真名的正式单。'
        objective: 在不披露真名时理解申请、暂停和取回路径，并认出哪一步会构成授权
        choice: 演练到接待台；直接取回空封套退出；或请保管员口述；也可只观察别人怎么被留下记录
        immediate: 玩家知道哪一步才涉及授权，练习不生成正式寄存；接待台后的复核簿不留这次演练的任何一行
        near: 真正办事时能按需停步，不因演练被视为默认同意；被冒用的真名会以另案形式送到追索程序里
    合点一份跨族小食:
      places:
      - 非人族夜市
      pairs:
      - 0
      category: 日常接触
      action: '{npc}请摊主说明本摊原料，再问你愿各点一份还是共享适合双方的一盘；摊主报的价对不同族群并不一样。'
      beats:
        trigger: '{npc}请摊主说明本摊原料，再问你愿各点一份还是共享适合双方的一盘；摊主报的价对不同族群并不一样。'
        objective: 找到不同饮食习惯下仍能坐一桌的吃法，并说清这一顿是谁请谁
        choice: 各自确认后点餐；不吃先离席；或只喝适合自己的饮品；也可当场把价差叫出来让摊主改口
        immediate: 不适配的食物分盘，不用尝禁忌食物证明亲近；差价与赊账都写在小票上
        near: 以后可同桌不同食，不把菜单翻译当成族群定论；欠一次的人下次还得回请
    让戒指当场复归:
      places:
      - 夜市后巷当铺
      pairs:
      - 0
      category: 第三方与打断
      action: '{npc}把赎回凭条推到你我之间，问今天要不要把话说完。'
      beats:
        trigger: '{npc}把赎回凭条推到你我之间，问今天要不要把话说完。'
        objective: 弄清票面只写了赎回价，没写赎回之后关系算什么
        choice: 付价赎回；只听估价不动票根；或把凭条折好留到死当前一夜
        immediate: 票根留在柜台上，赎回期限写在背面，今晚不被任何一方收走
        near: 可约下次带齐款项，或直接让它进死当
    在交割前最后一刻核对身份:
      places:
      - 契约公证庭夜审候审廊
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}把交割名册翻到折角那页，请你在唱名前指出哪一栏对不上。'
      beats:
        trigger: '{npc}把交割名册翻到折角那页，请你在唱名前指出哪一栏对不上。'
        objective: 区分登记笔误与有人冒名顶替
        choice: 逐栏核对；请值夜书记复述一次；或标出疑点留到庭审公开时再提
        immediate: 名册该页暂不唱名，其余条目按原序继续
        near: 复核结果决定这一条是更正登记还是转交追索
    在夜审廊外等一个决定:
      places:
      - 契约公证庭夜审候审廊
      pairs:
      - 0
      category: 日常接触
      action: '{npc}在候审廊长凳上挪出半个位置，问你还等不等里面那个人。'
      beats:
        trigger: '{npc}在候审廊长凳上挪出半个位置，问你还等不等里面那个人。'
        objective: 把等人的时间与庭内进程对上
        choice: 一起等；先回去改日再来；或只托值夜书记留一句口信
        immediate: 等候有明确时限，闭庭前可以随时起身离场
        near: 决定是否由本人到场接人，或改由书面程序处理
    在旧电梯井夹层对租约:
      places:
      - 跨界租赁塔旧电梯井
      pairs:
      - 1
      category: 信息交换
      action: '{npc}按下检修铃让梯厢停在夹层，把租约副本摊在膝上，请你比对两族的期限写法。'
      beats:
        trigger: '{npc}按下检修铃让梯厢停在夹层，把租约副本摊在膝上，请你比对两族的期限写法。'
        objective: 在公共区域承认重叠之前谈出一个双方都认的期限
        choice: 逐条比对；按铃直接上一层；或只记下分歧不改副本
        immediate: 分歧被写下但未签，梯厢按铃即动，任何一方可随时中止这次谈话
        near: 到管理处核验时才知道这次私谈是否被记了时点
    共用一部电梯的上下层:
      places:
      - 跨界租赁塔旧电梯井
      pairs:
      - 0
      category: 空间与退出
      action: '{npc}伸手替你按住开门的按钮，问你今天上几层。'
      beats:
        trigger: '{npc}伸手替你按住开门的按钮，问你今天上几层。'
        objective: 让共乘的一程不因层级不同被读成站队
        choice: 同乘到任意一层；先出梯走楼梯；或改乘下一班
        immediate: 按了楼层就走，谁先出去都不必解释
        near: 下次还坐同一部梯，各按各的层
    在复核室外核对一份复本:
      places:
      - 真名封存地下层复核室
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}把复本推到冷光灯下，请你确认这页抄的到底是谁的名字。'
      beats:
        trigger: '{npc}把复本推到冷光灯下，请你确认这页抄的到底是谁的名字。'
        objective: 确认眼前这一页是本人授权，还是别人代抄的近似写法
        choice: 逐字核对；只看不签；或请复核员说明双人规则的例外
        immediate: 复本封回匣中并留时点记录，未确认前不对外读出任何一个真名
        near: 若归属存疑，改由本人到场，或退回重抄一版
    抽查一次封存匣的编号:
      places:
      - 真名封存地下层复核室
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}用冷光灯照着墙内编号，请你念出封存匣的序号末尾。'
      beats:
        trigger: '{npc}用冷光灯照着墙内编号，请你念出封存匣的序号末尾。'
        objective: 在不开启任何匣子的前提下发现编号错位
        choice: 对编号；不动匣子；或把错位写进交接记录
        immediate: 错位写进记录，抽屉不开，真名继续封存
        near: 错位交由复核员排期更正，不牵动无关寄存
    拿命约赌一句真名:
      places:
      - 非人族夜市
      pairs:
      - 0
      category: 第三方与打断
      action: '{npc}把一枚旧筹码按在桌上，问敢不敢拿一样东西赌一句真名。'
      beats:
        trigger: '{npc}把一枚旧筹码按在桌上，问敢不敢拿一样东西赌一句真名。'
        objective: 说清赌注落在谁身上，以及输了之后谁来兑现
        choice: 定下赌约；只喝酒不押注；或当场收手把筹码塞回去
        immediate: 筹码留在桌面由第三方看管，口头赌约尚未成立
        near: 到期限时兑不兑现都留下记录，赖账的人下次没人陪他赌
    在夜市核对一张当票的赎回期限:
      places:
      - 非人族夜市
      pairs:
      - 1
      category: 信息交换
      action: '{npc}把当票举到灯下，请你读出小字那行写的当期到哪一天。'
      beats:
        trigger: '{npc}把当票举到灯下，请你读出小字那行写的当期到哪一天。'
        objective: 在死当公开售卖之前确认还有没有赎回的余地
        choice: 读出期限；请当铺伙计复述；或只抄下日期不动票根
        immediate: 赎回期限被写清楚，票根仍留在持有人手上
        near: 算得清利钱的人才有资格决定赎还是放
    在公诉席前听一次名分宣告:
      places:
      - 契约公证庭夜审候审廊
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}拉着你站到旁听长凳后，让你听清庭内宣读到第几个字。'
      beats:
        trigger: '{npc}拉着你站到旁听长凳后，让你听清庭内宣读到第几个字。'
        objective: 搞清名分写进登记之后能约束到什么程度
