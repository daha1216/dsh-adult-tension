        "resources":
          - "一册记满返工例的办事疑难簿"
          - "把长句拆成两问的改写习惯"
        "reputation": "契约译员，能解释措辞但不能读取真名"
      "relationship_reason": "你把一条难懂的授权句拆成两个选择，他邀你一起试一次保管库接待流程"
  "activities":
    "校译公共服务条款":
      "places":
        - "契约登记所"
      "pairs":
        - 0
      "category": "调查与核验"
      "action": "{npc}将昼行族和夜行族对次日的两种说法并排，请你举一个实际领取例子。"
      "beats":
        "trigger": "{npc}将昼行族和夜行族对次日的两种说法并排，请你举一个实际领取例子。"
        "objective": "找出同词不同期限而非统一所有习惯"
        "choice": "比对例子；不参与校译；或请另一位母语者复述"
        "immediate": "服务期限改用可核对时点，保留不同作息选项供确认"
        "near": "下一次申请可以减少一次因词义造成的返工"
    "试用匿名来访流程":
      "places":
        - "真名保管库"
      "pairs":
        - 1
      "category": "空间与退出"
      "action": "{npc}递给你没有真名的练习封套，请你走到接待台再选择是否继续。"
      "beats":
        "trigger": "{npc}递给你没有真名的练习封套，请你走到接待台再选择是否继续。"
        "objective": "在不披露真名时理解申请、暂停和取回路径"
        "choice": "演练到接待台；直接取回空封套退出；或请保管员口述"
        "immediate": "玩家知道哪一步才涉及授权，练习不生成正式寄存"
        "near": "真正办事时能按需停步，不因演练被视为默认同意"
    "合点一份跨族小食":
      "places":
        - "非人族夜市"
      "pairs":
        - 0
      "category": "日常接触"
      "action": "{npc}请摊主说明本摊原料，再问你愿各点一份还是共享适合双方的一盘。"
      "beats":
        "trigger": "{npc}请摊主说明本摊原料，再问你愿各点一份还是共享适合双方的一盘。"
        "objective": "找到不同饮食习惯下仍能坐一桌的吃法"
        "choice": "各自确认后点餐；不吃先离席；或只喝适合自己的饮品"
        "immediate": "不适配的食物分盘，不用尝禁忌食物证明亲近"
        "near": "以后可同桌不同食，不把菜单翻译当成族群定论"
    "试走结界外等候通道":
      "places":
        - "结界检查站"
      "pairs":
        - 1
      "category": "空间与退出"
      "action": "{npc}站在结界外宽通道口，请你选一条能回等候亭的路。"
      "beats":
        "trigger": "{npc}站在结界外宽通道口，请你选一条能回等候亭的路。"
        "objective": "确认体型不同的来访者能在检测前掉头"
        "choice": "试走外侧通道；不排队回城；或请引导员带路"
        "immediate": "转弯受阻处被提报，未批准前不移动检测设施"
        "near": "下一次可预约合尺寸通道，不需要冒险穿越结界"
  "customs":
    - "登记处提供空白练习表，让来访者先试填再决定是否正式申请。"
  "pressures":
    "条款翻译产生歧义":
      "source": "两种语言对服务期限的理解不同"
      "engines":
        - "契约精怪"
        - "信任透支"
      "beats":
        "trigger": "{npc}收到消息：两种语言对服务期限的理解不同。"
        "objective": "请双方确认原意并修订条款"
        "choice": "咨询独立译员，或暂停争议部分"
        "immediate": "争议期限暂不生效，两族申请者已确认的其他服务继续。"
        "near": "独立译员复述实际领取时点，当事人重新决定是否签这一项。"
      "far_trigger": "服务扣费日到来仍未统一时点定义"
      "far_consequence": "争议服务可撤销并退还未用费用，译员失去直接使用旧模板的信任。"
      "exits":
        - "取消争议服务而保留其他已确认项目"
        - "转请独立译员处理，交还无真名的样本"
      "bindings":
        -
          "activity": "校译公共服务条款"
          "place": "契约登记所"
          "pair": 0
    "公共登记出现重复":
      "source": "同一项申请出现了两份不同版本"
      "engines":
        - "身份风险"
        - "资源锁定"
      "beats":
        "trigger": "{npc}收到消息：同一项申请出现了两份不同版本。"
        "objective": "核实本人选择并取消无效版本"
        "choice": "邀请申请人核对，或先冻结重复办理"
        "immediate": "保管员提示同一寄存申请有两份版本，演练停在接待区，双方不查看封存内容。"
        "near": "只有申请人可选择保留版本，协调员负责预约本人到场而不代签。"
      "far_trigger": "下一轮授权读取前重复版本仍未取消"
      "far_consequence": "该项读取暂停，申请人可取回寄存物；不会冻结无关街坊服务。"
      "exits":
        - "退出协助，由申请人与保管员单独核验"
        - "申请人按本人权限撤回这项寄存，不追加新授权"
      "bindings":
        -
          "activity": "试用匿名来访流程"
          "place": "真名保管库"
          "pair": 1
