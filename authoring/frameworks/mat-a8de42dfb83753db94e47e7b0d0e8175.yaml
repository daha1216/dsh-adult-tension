        pair: 1
    末位淘汰约谈与裁员名单:
      source: 末位淘汰约谈的通知已经发到工位，同一天中介把下季度续约合同摆上桌；人事给出的裁员名单里正有你，赔偿金到账日与交租日差不出一周，钱一断就按合同收回房屋。
      engines:
      - 债务压力
      - 时限逼近
      beats:
        trigger: '{npc}把下季度续约合同推到你面前，说他这边等不了太久。'
        objective: 在赔偿金到账前决定续签、转租还是搬走
        choice: 当场签下续约先保住住处；不签转向其他合租人分摊
        immediate: 合同留着没签，钥匙当天照旧挂在板上，屋里的东西一件没动
        near: 签了就得按月扛住房租，不签则要在月底前把房子交回去
      far_trigger: 月末交租日中介按合同上门换锁
      far_consequence: 欠租一期就会被记进片区租住底册，以后再租同一条街都要多交两个月押金；提前转租则可保住押金与街面上的名声
      bindings:
      - activity: 翻看租赁旧账
        place: 中介办公室
        pair: 2
      exits:
      - 当场签下续约并把钥匙还回板上
      - 退出续签，另找人分摊剩下的租期
    催收上门与抵押交割:
      source: 债主按周上门催收，欠额按复利滚动，逾期即触发抵押物交割条款；这一次上门带着帮手和一张写明期限的手写借条，屋里几件电器已经列在条款下面。
      engines:
      - 债务压力
      - 第三方施压
      beats:
        trigger: '{npc}带着两个帮手堵在门口，把写明本周还款额的手写借条举到你面前。'
        objective: 在抵押物被搬走之前谈出一次真正的展期或结清
        choice: 当场还上一部分换交手写展期条；请合租的那位出面替你说情
        immediate: 钱点到桌上当场写在借条背面，没还上的部分仍按复利往下滚
        near: 展期只顶到下一周，谈不拢的那几件电器就要在下次上门时搬到楼下
      far_trigger: 下一次约定上门的日子
      far_consequence: 还不上就按条款交割抵押物，合租的人也会因同一屋檐被牵连进来；结清则只留一笔写清的旧账
      bindings:
      - activity: 把热的那份推过来
        place: 街角夜宵摊
        pair: 3
      - activity: 接住掉落的东西
        place: 老旧小区
        pair: 6
      - activity: 补画夜行地图
        place: 深夜便利店
        pair: 0
      exits:
      - 先还一部分换回手写展期条，退出这一晚的争执
      - 拒绝交割抵押物，把争议交给派出所登记处理
    公约最后一条被踩过:
      source: 合租公约写明月租分摊与不得带人过夜，违约一次即以当月末日为期搬走；眼下这月的账还没平，玄关鞋架上却已经多出第三双鞋，而进门的人把拖鞋摆在了鞋架最外面一格。
      engines:
      - 同居三章越界
      - 秘密暴露倒计时
      beats:
        trigger: '{npc}在玄关挡住你，指着鞋架上那双多出来的鞋问这到底是谁的。'
        objective: 在月底之前把违约、账单和两个人今后要不要继续同住一次说清
        choice: 摊开公约重签并说清来人是谁；先收拾自己那一半东西搬出去
        immediate: 公约摊在茶几上重签，第三双鞋被拎到门外，两人当晚要决定谁留在这屋里
        near: 留着谈就是按月重分账，搬走则要在续约合同上把名字划掉
      far_trigger: 月末交租日两人必须同时出现在中介办公室签字
      far_consequence: 到那天还拿不出统一的名字，房子就会被收回，两人此前共同瞒下的所有事也会顺着租住底册浮出来；先把公约重签掉则只作一次内部了结
      bindings:
      - activity: 拆穿鞋架上的第三双鞋
        place: 凌晨合租公寓
        pair: 7
      - activity: 伸手替她理了理被风吹乱的碎发
        place: 老旧小区
        pair: 7
      - activity: 今夜话没说完
        place: 家中厨房
        pair: 5
      - activity: 分享一只耳机
        place: 24小时自助洗衣房
        pair: 5
      - activity: 当面撕掉一张合租禁令
        place: 老旧小区
        pair: 2
      - activity: 家人突然来电
        place: 街角夜宵摊
        pair: 5
      - activity: 试做邻里菜单
        place: 家中厨房
        pair: 1
      exits:
      - 签完新公约把来人的东西送出门口
      - 交出钥匙，先搬去别处再谈这份合同
    夜场会所的共同监护:
      source: 夜场会所的值班表把两个人排在同一个后半夜，而屋里那位卧床的老人当晚没人照看；看护的交接点定在凌晨两点，误一次就要由居委会与派出所一同上门核查。
      engines:
      - 共同监护
      - 时限逼近
      beats:
        trigger: '{npc}在会所后台塞给你一张写着交接时辰的纸条，说今晚的班谁也换不掉。'
        objective: 在同居与照看两件事之间定出一个当夜能执行的交接
        choice: 当场定下谁先回去接班；把老人托给隔壁邻居代看
        immediate: 纸条压在吧台底下，两人各自的值班表都没有改，接班的具体钟点仍悬着
        near: 谁先离场谁就欠下一次值班，交接记录上会留下当晚到底是谁签的字
      far_trigger: 居委会按登记上门核查当晚的照看安排
      far_consequence: 交接表上对不上就要按共同监护失职处理，两个人都得当场说明当晚在哪；定稳交接则只作一次调班
      bindings:
      - activity: 坐到离出口更近的位置
        place: 24小时自助洗衣房
        pair: 4
      - activity: 布置候诊阅读角
        place: 社区诊所
        pair: 0
      exits:
      - 当场定下交接钟点后回会所继续值班
      - 退出这一晚的班，把照看交回登记在册的人
