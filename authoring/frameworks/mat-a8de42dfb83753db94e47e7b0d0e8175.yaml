  themes:
  - 邻里互助的工时边界
  - 旧街记忆与当下生活
  - 不同作息共享一片街区
  - 裁员、租约与还不上的那笔账
  technology_boundary: 当代社区使用手机、纸图、家用厨具与普通公共设施；数字预约会失误，地图不保证实时营业，活动人员没有医疗、产权裁决或无限调度权限。新增的中介办公室、街角夜宵摊与合租公寓都靠纸合同、钥匙板和当面点钱办事：租赁档案是纸档，押金抵扣要人工对账，短贷借条为手写，没有任何联网的信用或催收系统可供查询。
  bridge_status: not_required
