id: mat-a8de42dfb83753db94e47e7b0d0e8175
name: 街角共同生活圈
material:
  eras:
  - 当代都市
  aesthetics:
  - 青年漫写实
  - 写实文学
  - 都市轻悬疑
  - 暖色生活流
  - 市井烟火
  - 恋爱轻喜
  rule: 邻里互相照应——同一条街上的人按门牌认亲疏，谁家有难处街坊先搭手，但照应的分量记在各自心里，欠得太多就再难开口求人。
  social_rule: 公共空间按预约使用，邻里帮助不等于无限义务；自家的麻烦不外传，街面上说出口的事便算整条街都知道。
  places:
    老旧小区:
      details:
      - 楼下树荫里摊着居民手绘图·午后
      - 旧店招牌从院门外露出一角·午后
      - 单元门口的合租禁令贴了又撕，胶痕留在铁门上·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 院门通往街道
        witnesses:
        - 乘凉邻居
        - 楼道里进出的合租住户
        affordances:
        - 交换街区故事
        - 结束活动并离开
        pressure_modifiers:
        - 院内活动人数
        - 住户午休
    家中厨房:
      details:
      - 餐桌分开放着两种调味小碟·傍晚
      - 家用灶台旁留出洗菜位置·傍晚
      profile:
        privacy: high
        visibility: low
        exits:
        - 厨房门至客厅与入户门
        witnesses:
        - 受邀共餐的成年邻居
        affordances:
        - 试做邻里菜单
        - 结束活动并离开
        pressure_modifiers:
        - 食材用量
        - 主人愿意借出的灶台时段
    清晨菜市场:
      details:
      - 水珠还挂在时蔬叶面·清晨
      - 摊主在秤旁换上当天价签·清晨
      profile:
        privacy: low
        visibility: high
        exits:
        - 市场主通道与街口
        witnesses:
        - 菜摊摊主
        - 采购居民
        affordances:
        - 记录时令食材
        - 结束活动并离开
        pressure_modifiers:
        - 到货时间
        - 采购预算
    朋友客厅:
      details:
      - 旧相册与空封套并放在矮桌上·午后
      - 沙发旁能看见客厅门·午后
      profile:
        privacy: high
        visibility: low
        exits:
        - 客厅入户门
        witnesses:
        - 主人邀请的朋友
        affordances:
        - 整理社区相册
        - 结束活动并离开
        pressure_modifiers:
        - 照片主人许可
        - 主人待客时间
    深夜便利店:
      details:
      - 靠窗座位能看到下一个路口·深夜
      - 收银台旁贴着本店休息区规则·深夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 便利店临街门
        witnesses:
        - 夜班店员
        - 短暂停留的顾客
        affordances:
        - 补画夜行地图
        - 结束活动并离开
        pressure_modifiers:
        - 休息区可用时段
        - 沿途营业变化
    24小时自助洗衣房:
      details:
      - 机器门前留着取衣空带·夜
      - 远离水池的干燥墙角试放空书架·夜
      - 靠窗的塑料椅正对店门口，坐这儿能先看见谁推门·深夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 自助店门
        witnesses:
        - 取衣顾客
        - 按需到店的经营者
        affordances:
        - 共拟借阅角
        - 结束活动并离开
        pressure_modifiers:
        - 机器门开启范围
        - 水汽
    社区诊所:
      details:
      - 诊室门外的图书推车停在指定线内·日间
      - 低层书架与候诊椅相对·日间
      profile:
        privacy: medium
        visibility: high
        exits:
        - 候诊区外门厅
        witnesses:
        - 诊所工作人员
        - 成年候诊者
        affordances:
        - 布置候诊阅读角
        - 结束活动并离开
        pressure_modifiers:
        - 诊疗通道宽度
        - 清洁时段
    打烊面包店:
      details:
      - 关炉后柜台只留当日试制面包·打烊前
      - 配料标签与小碟放在店主面前·打烊前
      profile:
        privacy: low
        visibility: high
        exits:
        - 临街店门
        witnesses:
        - 面包店店主
        - 受邀试吃街坊
        affordances:
        - 筹备邻里试吃
        - 结束活动并离开
        pressure_modifiers:
        - 店主收店时间
        - 已确认配料
    中介办公室:
      details:
      - 整面墙的房源钥匙按门牌挂在木板上，取用要签本·工作时间
      - 办公桌对面的矮柜露着一角人事档案盒，盒口没合严·工作时间
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 门口临街，谈话被人听见就等同街知巷闻
        witnesses:
        - 前来签合同的其他租客
        - 隔着玻璃能看到里间的人
        affordances:
        - 按门牌借钥匙看房
        - 查对往年的租赁记录
        pressure_modifiers:
        - 钥匙借出的时段
        - 隔壁工位能不能听见
    街角夜宵摊:
      details:
      - 塑料棚外沿的灯只亮一半，桌子挑出来摆在没有路灯的那半边·夜
      - 老板收摊前会把最后一锅热的那份留给熟客·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿街口两侧都能起身走开，坐哪一头决定了先看见谁走过来
        witnesses:
        - 同一时段在棚下吃夜宵的街坊
        affordances:
        - 把热的那份推给对面
        - 挑一张离街口最近的桌子
        pressure_modifiers:
        - 有没有熟人正好路过
        - 老板收摊的时间
    凌晨合租公寓:
      details:
      - 客厅茶几上摊着未分完的账单和一叠合租公约抄件·凌晨
      - 玄关鞋架上多出一双不属于这屋的鞋，鞋尖朝里摆着·凌晨
      profile:
        privacy: high
        visibility: low
        exits:
        - 入户门反锁后只有本人有钥匙，走楼道能避开电梯监控
        witnesses:
        - 同居室友
        affordances:
        - 当面重签合租公约
        - 把来人的东西收进柜里
        pressure_modifiers:
        - 另一个人几点回来
        - 楼下邻居对动静的容忍
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 社区活动策划人
      function: 协调自愿邻里活动并安排场地试用
      authority: 使用已获经营者许可的桌位与活动时段
      resource: 居民自愿提供的地图、可借推车和店铺联系人
      limitation: 不拥有公共场地，也不能要求熟人长期值守
      obligation: 说明每次帮忙的结束时间，活动不挤占原用途
      exposure: 超时或占道会失去下次借场机会
      hidden: —
    player:
      identity: 街区口述史记录员
      baseline: 你曾帮策划人听懂老住户不愿被拍照的理由；这次约好先闲聊，是否录下另问。
      resources:
      - 自己的口述访谈经验
      - 已获许可的街景照片
      reputation: 你会问人想不想留下故事，不替他承诺公开
    relationship_reason: 你曾帮策划人听懂老住户不愿被拍照的理由；这次约好先闲聊，是否录下另问。
  - family: 艺术与传播
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 街区口述史记录员
      function: 访谈街坊并保存获准的相册副本
      authority: 决定本人采访稿的编排，原件与授权归提供者
      resource: 录音设备、照片封套与已确认的口述提纲
      limitation: 不因听过家事就有公开权，厨艺只够试做家常小份
      obligation: 把闲谈与授权采访分开，归还不愿留下的照片
      exposure: 错用一张私照会使街坊不再愿意开门
      hidden: —
    player:
      identity: 社区活动策划人
      baseline: 你请口述史记录员来做一顿他家常吃的菜，这次彼此都不设采访任务。
      resources:
      - 一次活动的食材预算
      - 联系本次自愿参与者的时间
      reputation: 你能张罗一顿饭，也尊重别人不再参加
    relationship_reason: 你请口述史记录员来做一顿他家常吃的菜，这次彼此都不设采访任务。
  - family: 商业与产业
    position: 房东 / 催租人
    appellations:
    - 老板
    npc:
      role: 片区中介与代收租人
      function: 代房东收缴房租、续签租约并保管整条街的房源钥匙
      authority: 可按租约收回房屋、扣下押金并决定续不续签
      resource: 全街房门钥匙、历年租赁档案与你上两份合同的复印件
      limitation: 改不了屋里已有住户的名字，也不能替房东免掉欠款
      obligation: 收钱当面点清并给凭证，续签条件要提前说明
      exposure: 私下减过租的事一旦被房东查到，这份代收的活就轮不到他
    player:
      identity: 即将被裁的合租住户
      baseline: 你手里那间房的租期还剩两个月，房东已经放话下季度要抬价，而你连这个月的工资都还没着落。
      resources:
      - 一份还没签的下季度续租合同
      - 能证明自己连续按时交租的转账记录
      reputation: 有账就当面算清，不拿交情去换宽限
    relationship_reason: 中介替你拦过一次房东临时涨价的电话，代价是从那天起你要按月替他核对整栋楼的水电分摊；下季度的合同摆上桌时，两人都清楚这次不再只是对账。
  - family: 地下与灰色地带
    position: 债主
    appellations:
    - 老板
    npc:
      role: 街面放贷人
      function: 按周上门催收短贷，欠额按复利滚动，逾期即触发抵押物交割条款
      authority: 可当场决定给出几天宽限，也能立刻启动抵押物交割
      resource: 一沓写清本息的手写借条，以及两个随时能上门的帮手
      limitation: 不认任何情面，只认当场能拿出来的还款或抵押
      obligation: 收钱当面点清并写明结欠，不把上一笔的利息悄悄并进下一笔
      exposure: 放出去收不回的账要自己扛，逼得太狠也会招来街面上的举报
    player:
      identity: 即将被裁的合租住户
      baseline: 你去年为垫付家人的手术费借过一笔短贷，如今利滚利已经翻到工资的两倍，下周就是最后期限。
      resources:
      - 一份随时可能结束的劳动合同
      - 屋里几件还能折价的电器
      reputation: 认得账也认得期限，不把还不上推给别人
    relationship_reason: 放贷人上周踩着点上门时，是合租的那位先替他垫了一期；这一次连垫的人也没有余钱了，条款上写着逾期交的是屋里那几件电器。
  - family: 秩序与执法
    position: 知情不报者
    appellations:
    - 警官
    npc:
      role: 辖区民警
      function: 处理街面纠纷、核验租住登记并约谈涉事人
      authority: 可当场要求出示证件、约谈当事人并在必要时带回所里
      resource: 片区租住登记底册与几次现场出警的记录
      limitation: 管不了劳动合同，也不能替谁跟公司谈赔偿
      obligation: 约谈前说明事由，登记的信息不得随意透露给第三方
      exposure: 压下的案子若再出一次，责任会落回他自己的辖区考核
    player:
      identity: 即将被裁的合租住户
      baseline: 你上个月被公司约谈过一次，那天夜里楼下的动静报了警，出警记录里还留着你的名字。
      resources:
      - 自己留存的一份约谈记录
      - 能证明当晚行踪的几条消息
      reputation: 该说的时候说得清，不把别人牵扯进来换自己干净
    relationship_reason: 民警上回把楼下那起动静写成普通邻里纠纷结了案，前提是住户配合做了登记；现在同一栋楼又出一回事，这次登记表上写谁的名字成了两人都要掂量的东西。
  - family: 学术与专业
    position: 合租室友
    appellations:
    - 同学
    npc:
      role: 同届毕业的合租住户
      function: 在同一个项目组里与玩家共用资料，也在同一间房里分摊账目
      authority: 可自行决定交不交自己那部分材料，也能随时退出合租
      resource: 一份两人共用过的小组作业存档与几段课堂录音
      limitation: 手上没有多余的钱，也替不了对方在公司里说话
      obligation: 共用材料前说清谁署谁的名，账目改动要两人当面认
      exposure: 把对方当年抄过的一段内容说出去，毕业证上的那份体面就都留不住
    player:
      identity: 即将被裁的合租住户
      baseline: 你们从同一届毕业，如今在一条街的两头各自上班、同一间屋里分摊房租；被约谈的事你还只跟他说过一半。
      resources:
      - 一份两人共同署名的毕业论文存档
      - 几段当时互相录下的课堂讨论
      reputation: 一起熬过的夜认得出，谁抄了谁的一段也记得住
    relationship_reason: 两人毕业后合租到现在，账目一向当面算清；这一次其中一个人手里的材料被公司当成了末位淘汰的由头，而那份材料的底稿还留在另一个人手上。
  - family: 商业与产业
    position: 下属
    appellations:
    - 老板
    npc:
      role: 同项目组的直属上级
      function: 排工位、写考评，在末位淘汰约谈的名单上先划一道
      authority: 可决定组里谁进约谈名单，也能替谁把名字往后挪一个月
      resource: 本季考评表、组内的排班和一份尚未上报的裁员名单草稿
      limitation: 改不了公司给的裁员比例，也保不住任何人的合同到期日
      obligation: 约谈前把考评依据给本人看过，名单改动要留下书面痕迹
      exposure: 名单上多出来的那一个名字一旦被对上，往后组里没人再肯替他顶班
    player:
      identity: 即将被裁的合租住户
      baseline: 你在他手下做满三年，这次的考评表上有一栏是他手写的；你今晚来，是想知道他手里那份草稿写着谁的名字。
      resources:
      - 三年的项目交接记录
      - 几张他签过字的加班单
      reputation: 活干完就交，不拿私下的交情换考评
    relationship_reason: 上级上回把玩家从上一批名单里往后挪了一个月，代价是那一个月的活玩家全扛了下来；这次草稿重新摊开，两个人手上都还留着上次那张加班单。
  - family: 地下与灰色地带
    position: 远房亲戚
    appellations:
    - 直呼其名
    npc:
      role: 受托照看旧宅的远亲
      function: 替不在本地的本家看管那间空着的老房子，也替这条街上的老住户跑腿
      authority: 可自行决定谁能进屋、屋里哪件旧东西留与不留
      resource: 一把从中介那里另配的旧宅钥匙，以及一本记着历年屋况的手写本
      limitation: 房子不归他名下，动到结构或过户就得本家出面
      obligation: 进屋前先跟本家报一声，拿走的每件旧物都要写进那本手写本里
      exposure: 屋里的东西少了一件，整条街只会记得看管的人是谁
    player:
      identity: 即将被裁的合租住户
      baseline: 你是他代看的那间旧宅的本家晚辈，眼下住处要保不住，唯一的退路是那间空了几年的老屋。
      resources:
      - 一份写得含混的本家旧宅房契抄件
      - 对这一带旧门牌的记忆
      reputation: 本家的东西不白拿，进屋先跟看管的人说清来意
    relationship_reason: 远亲替本家看这间旧宅已有六年，眼下本家晚辈被裁、租约将到期，来敲这扇门时，能进不能进全看他手里那本手写本怎么记。
  - family: 传统与雅艺
    position: 合租青梅竹马
    appellations:
    - 直呼其名
    - 哥哥
    npc:
      role: 合租室友
      function: 分摊房租水电，照看彼此晚归时的灯与门
      authority: 可决定自己那一半的公约条件，也能随时搬走
      resource: 一份两人签过的合租公约，以及屋里仅有的一套备用钥匙
      limitation: 没有多余的钱再垫一次，也管不住对方几点回来
      obligation: 公约改动要两人当面重签，动了对方的东西须先说明
      exposure: 一句说漏的共同生活细节，足够让整栋楼把两人的关系传成另一回事
    player:
      identity: 即将被裁的合租住户
      baseline: 你们从小同路回家，如今分住同一套房的两间；你被约谈的事还没告诉她，她鞋架上却多了一双不属于这屋的鞋。
      resources:
      - 一份两人都签过字的合租公约
      - 屋里那本记着每笔水电的旧账本
      reputation: 说过的话就算数，翻脸也只当面翻
    relationship_reason: 两人合租时签过一纸公约，写明月租、分摊和谁也不能带人过夜；如今这个月的账还没平，公约的最后一条先被人踩了。
  activities:
    交换街区故事:
      places:
      - 老旧小区
      pairs:
      - 0
      category: 日常接触
      action: '{npc}指着居民手绘图上一家老店，先讲起自己常点的早餐，问你还记得什么。'
      beats:
