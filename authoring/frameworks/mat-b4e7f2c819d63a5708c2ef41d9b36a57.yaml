  rule: "直播间的账分两层：公域是明账，私域是明码。打赏榜公开记名，连麦按分钟、私域按档期、线下答谢按座次，每一格都标价，只有最末那一格——那间不挂招牌的暗房——写着「非卖·仅内邀」：它的用处不是卖，是让每一个买过的人都觉得还没买完。榜单头衔不带线下权利，榜一进了连麦间一样重新排队，线下的一切另议；私域按格子计费，买断的是内容，不买断人。平台抽成当日结清、下播即两清，可每一笔礼物都在两边各记了一笔：榜单上那一笔给体面，私域里那一笔生成没人写进合同的债权。这套账与舞厅大班的卖方两本价不同——那里是一具身体按可见不可见分开标价，张力在卖方自己身上；这里记的是买方名下的账：打赏怎样从消费变成债权、价目表怎样让人永远觉得差一格。它也不是街角那本人情账——照应记在心里、没有价目，这里每一笔都有明码；更不是写进合同的场地收费——押金两清即止，打赏两清之后才是账的开始。这里没有居所式的禁恋条款：一切都被允许、一切都有价，唯一不卖的那一格不是禁区，是价目表的锚；也不玩契约术式的自动执行——债权从不自动兑现，兑现全靠人当面开口。价目表本身全公开，没有母本与公开版之分，争的不是哪个版本算数，是记录之外的兑现；榜单是明账，谁都查得到流水，这条街不认信用分，只认流水与债务。"
  social_rule: "大哥的体面在榜单上，不在她说的话里；私域里说过的话不进公屏，谁把私域截图发上公屏，谁被全网拉黑。连麦里的暗语双方都装听不懂，线下叫开的名字不带进直播间。「下播即两清」是行规——没人遵守，人人都援引。夜校把匿名席当保护，这里的匿名是消费，大哥的马甲护的是钱包不是身份；创作者逐条签授权，这里买断内容不买断人，署名从来不是争点；底片谁先看到谁讲的那套规矩在这里也不成立——价目表摊开给所有人看，兑现才是要谈的。家里人对账只认流水不认解释，账单比任何解释都诚实。"
