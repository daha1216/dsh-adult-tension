  technology_boundary: "照明法器依赖可更换晶芯和工匠检验，无法凭意愿无限供能；委托使用纸单和行会传递。迷宫中层安全屋是王都行会驻点，往返需沿已守备商路行走一日，不与石堡或地下室无时差切场。新增的委托街石亭与石堡封存库都靠纸档与人工签字运转，没有全城登记系统，查封靠封条与登记簿，解封必须凑齐书吏与司事双签；工坊墙角的晶芯休眠匣只是靠地下湿冷延缓衰减的临时存放处，续不了已经见底的晶芯。"
  bridge_status: "not_required"
