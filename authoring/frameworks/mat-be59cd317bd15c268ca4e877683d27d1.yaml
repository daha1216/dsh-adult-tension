id: "mat-be59cd317bd15c268ca4e877683d27d1"
name: "王都工坊与委托街"
material:
  eras:
    - "异世界王都"
  aesthetics:
    - "异世界冒险纪实"
    - "奇幻迷宫慢生活"
  rule: "契约高于人情——行会委托以书面条款为准，签字后即按条款结算，私交再深也不能改期、加价或免除罚则；强者当场立规矩——现场力量对比最大的一方可以在冲突当场定下临时规矩，旁人只有服从或当场提出对赌两条路；越界即受罚——擅自越过授权范围动手的人，按行会罚则扣减报酬、吊扣执照，重者逐出行会名录。"
  social_rule: "契约可以限制行为但不能制造感情——条款能约束人做什么、不得做什么，无法强制谁对谁动心。等级分明——王都按贵族、行会、平民三层分开站坐，跨层交涉须由本层代表人出面。血统定贵贱——姓氏决定可承接的委托等级与可进入的门，改不掉出身就只能靠行会名录慢慢换取。行会自治——行会内部纠纷由行会自行裁决，王室与领主不直接干预，也不为个人破例。"
  places:
    领主石堡:
      details:
        - "石堡外院展厅摆着借来的日用法器"
        - "贵族席位在绳栏后，平民来客沿敞廊排队"
        - "公示柱上钉着本季委托名录的抄件·日中"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "从外院敞廊经访客门离堡"
        witnesses:
          - "展厅司事"
          - "值守在绳栏边的石堡卫兵"
        affordances:
          - "摆设日用法器展台"
          - "比较站姿与坐姿的展示高度"
          - "查阅当季委托名录抄件"
        pressure_modifiers:
          - "展品借用条件"
          - "来客通道宽度"
          - "名录抄件的更新日"
    魔法工坊地下室:
      details:
        - "石阶下的试灯墙分暖白两块底色"
        - "晶芯匣与断能钳放在工匠一侧"
        - "工坊墙角专留一小块潮湿的晶芯休眠匣·夜"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "沿照明石阶回工坊店面"
        witnesses:
          - "负责检验的工匠"
        affordances:
          - "试验照明法器"
          - "更换获准试用的晶芯"
          - "查看休眠匣里的成品数量"
        pressure_modifiers:
          - "晶芯剩余量"
          - "检验架预约时段"
          - "休眠匣的湿冷程度"
    迷宫中层安全屋:
      details:
        - "王都行会徽记挂在守备商路终点的安全屋门边"
        - "配给架按徒步天数分包，门内设有回王都的路签"
        - "过夜铺位沿墙排开，只拉一道可拆的布帘隔断·夜"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "走向驻点客堂；返城须等已确认的护送时段"
        witnesses:
          - "驻点补给员"
          - "同批轮值的驻点队员"
        affordances:
          - "试配一日返程包"
          - "衡量食水与法器负重"
          - "在布帘后按轮次补眠"
        pressure_modifiers:
          - "护送出发时刻"
          - "队员实际背负能力"
          - "驻点客堂的值夜排班"
    委托街石亭:
      details:
        - "石亭两侧的挂板钉着未结清的委托单，结项后由书吏当场摘牌·日常"
        - "仲裁席比排队的石凳高一级，来告状的人得仰着说话·日常"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "从亭侧台阶退回委托街主道"
        witnesses:
          - "当值仲裁书吏"
          - "同在亭下等号的委托双方"
        affordances:
          - "按挂板查找未结委托"
          - "当场请求查封名下法器"
        pressure_modifiers:
          - "书吏手上压着的单子"
          - "亭下等号的人次"
    石堡封存库:
      details:
        - "贴了行会封条的样灯按编号堆在铁架上，摘牌才算结项·日间"
        - "库门内侧的登记簿只记封入与取出时刻，不记原主是谁·日间"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "凭书吏与司事双签的取件条出库门"
        witnesses:
          - "库房看管员"
        affordances:
          - "按编号核对被封样灯"
          - "当场标出封条破损处"
        pressure_modifiers:
          - "双签的取件条是否齐全"
          - "封存期限的到期日"
  pairs:
    -
      family: "商业与产业"
      position: "同侪"
      appellations:
        - "先生"
      npc:
        role: "行会委托书吏"
        function: "把工期、交付件和验收条件写成双方能履行的单据"
        authority: "可受理变更和暂缓争议结算，不能替委托人加价"
        resource: "原单副本、交付排期和驻点补给价目"
        limitation: "不懂晶芯内部结构，也无权授予冒险等级"
        obligation: "让新增需求单独确认，不把演示算进免费交付"
        exposure: "错写条款会造成工匠白做或委托人多付钱"
      player:
        identity: "魔法器具修理师"
        baseline: "你修的是居民每日要用的灯，愿听书吏转述的实际抱怨。"
        resources:
          - "一盏自修的日用样灯"
          - "经手修过的居民灯器名录"
        reputation: "敢把法器的短处当面说明"
      relationship_reason: "书吏曾替修理师分清石堡展示与交付的不同工时，两人于是共同布置普通人也能试看的展台。"
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "师傅"
      npc:
        role: "魔法器具修理师"
        function: "检修晶芯接点并测试照明时间"
        authority: "可拒绝交付不稳定法器，能安排本人的试灯顺序"
        resource: "试灯墙、可替换晶芯、断能钳与校准沙漏"
        limitation: "不能改变行会报酬或承诺晶芯永不耗尽"
        obligation: "用校准沙漏计时实测连续照明上限并当场标出，交还可维护的器具"
        exposure: "错误续航会让驻点夜行者提前耗尽照明"
      player:
        identity: "行会委托书吏"
        baseline: "你能解释一份单据意味着多少工时，愿意亲自背一次样包验证纸上假设。"
        resources:
          - "各家委托里的亮度用词摘录"
          - "一册行会验收先例的抄录"
        reputation: "不把一句顺便写成无限义务"
      relationship_reason: "修理师请书吏来试灯，因为上次写在委托中的亮度词句与实际观感不一致。"
    -
      family: "权力与治理"
      position: "上司"
      appellations:
        - "长官"
      npc:
        role: "行会稽核官"
        function: "按罚则追缴违约款项，并依职权查封逾期者名下的法器与工位"
        authority: "可当场扣件、摘牌并暂扣执照，只对行会议席负责"
        resource: "罚则条例全本、各家未结清单和一枚可开石堡封存库的钥牌"
        limitation: "改不了契约条款，也不能替谁的欠账签字放行"
        obligation: "查封前当面宣读依据，也把封条编号写进登记簿"
        exposure: "错封一件要自己写清解封凭据，还被议席记一笔处分"
      player:
        identity: "魔法器具修理师"
        baseline: "你手上有一盏晶芯见底的样灯，正卡在一桩结不清的委托尾款里。"
        resources:
          - "一叠注明交付日期的旧验收单"
          - "几件还能拆下晶芯的旧灯"
        reputation: "账目宁可当场算清，也不把话说在封条上"
      relationship_reason: "稽核官两年前替修理师挡下过一次误判的违约罚，条件是把石堡封存库里那批样灯一一点清；现在这批灯又要封进库里，两人得再一次决定谁来签那张取件条。"
    -
      family: "私密撮合与契约中介"
      position: "服务提供者"
      appellations:
        - "御主"
      npc:
        role: "契约使魔"
        function: "按魔力补给契约从御主处取用补给，同时替御主看守工坊与试灯记录"
        authority: "可拒绝在契约外动用自身魔力，也能单方面缩短一次补给间隔"
        resource: "一份写明补给周期与违约条款的魔力补给契约，以及自己那部分未动用的储量"
        limitation: "契约只约束行为，改不了御主愿不愿意给，也造不出新的晶芯"
        obligation: "每次取用后当面报数，补给不够时先说明再决定省谁的那一份"
        exposure: "把藏下的那点补给露出来一次，往后所有赊账都会算在她头上"
      player:
        identity: "魔法器具修理师"
        baseline: "你替这位使魔修过接点，也签过一份按周期供给的魔力补给契约；眼下晶芯见底，契约上剩下的额度就是工坊能不能开工的全部。"
        resources:
          - "一份尚未用完的供给契约"
          - "能替使魔修好接点的工具与手法"
        reputation: "契约上写多少就认多少，不拿她省下的那点补给抵账"
      relationship_reason: "使魔的接点出过一次险，是修理师连夜拆开重焊才保住她的储量；如今工坊缺芯，契约上该给她的补给与工坊要用的份额第一次撞在同一笔账上。"
    -
      family: "地下与灰色地带"
      position: "黑市药贩"
      appellations:
        - "掌柜"
      npc:
        role: "休眠匣晶芯掮客"
        function: "在迷宫安全屋与王都之间倒手来路不明的晶芯，按当日松紧开价"
        authority: "可当场决定一支晶芯过不过手，也能让一批货根本不进任何册子"
        resource: "埋在工坊墙角休眠匣里的私藏成品，以及一条绕开稽核的取货路线"
        limitation: "只对当面能付清的人交货，不认任何行会名分"
        obligation: "交芯前说明充盈程度，不把衰芯充作满芯卖给下一个人"
        exposure: "被稽核官抄到一次就要连带供出上一批买家，自己也得吃吊扣执照的处罚"
      player:
        identity: "魔法器具修理师"
        baseline: "你知道正规晶芯的限额撑不到下一批入城，也清楚这根芯一旦插进仪典就得自己担下全程。"
        resources:
          - "一间可以过夜试芯的工坊地下室"
          - "知道哪条巷口的暗桩会在后半夜开"
        reputation: "用过谁的芯就认谁的账，不把来路推给下一个接手的人"
      relationship_reason: "修理师上一次替这位掮客试过一支衰芯，用一整夜的照明换来他知道那批货的真实成色；现在仪典的日子压到眼前，能立刻到手只有掮客那间休眠匣。"
  activities:
    摆设日用法器展台:
      places:
        - "领主石堡"
      pairs:
        - 0
      category: "空间与退出"
      action: "{npc}推来空展架，请你选能让坐着的人也看清灯芯的位置。"
      beats:
        trigger: "{npc}推来空展架，请你选能让坐着的人也看清灯芯的位置。"
        objective: "把日用法器展台布成可观看也可绕开的通道"
        choice: "一起摆架试走；只指出一处遮挡不动架"
        immediate: "展架位置改变后，来客无需挤过贵族席前才能观看"
        near: "展厅司事确认后沿用动线，参与者不承担整场接待"
    试验照明法器:
      places:
        - "魔法工坊地下室"
      pairs:
        - 1
      category: "调查与核验"
      action: "{npc}接上已检修的小灯，请你比较两块试灯墙上的可辨细节。"
      beats:
        trigger: "{npc}接上已检修的小灯，请你比较两块试灯墙上的可辨细节。"
        objective: "确定读字亮度与一枚晶芯的实际续航"
        choice: "读一页小字并计时；只选光色不参与计时"
        immediate: "选亮光会更快耗芯，柔光留住续航但小字难辨"
        near: "委托人据实选择取舍，未选方案保留为下一次调试而非判输赢"
    试配一日返程包:
      places:
        - "迷宫中层安全屋"
      pairs:
        - 0
      category: "照护与修复"
      action: "{npc}把守备商路一日所需的食水和备用灯芯摆到空背包旁，说迷宫停滞第一夜已经堵住了下游两处岔口。"
      beats:
        trigger: "{npc}把守备商路一日所需的食水和备用灯芯摆到空背包旁，说迷宫停滞第一夜已经堵住了下游两处岔口。"
        objective: "配出队员背得动的返程包，也把滞留在中层的一队人算进去"
        choice: "试背后调整配重；只带自己的饮水不出队"
        immediate: "多带备用芯会挤占食水空间，重物改位会减轻一侧肩压"
        near: "上路由护送安排另行确认，今天试包不等于报名出发"
    迷宫停滞第一夜的滞留登记:
      places:
        - "迷宫中层安全屋"
      pairs:
        - 2
      category: "信息交换"
      action: "{npc}把滞留名册推过来，让你在迷宫停滞第一夜把每一队的出发时辰与返回口子逐条对一遍。"
      beats:
        trigger: "{npc}把滞留名册推过来，让你在迷宫停滞第一夜把每一队的出发时辰与返回口子逐条对一遍。"
        objective: "在夜禁落下之前把还留在中层的人与物资一一对上"
        choice: "逐条登记并留下副本；只报自己那一队的人名"
        immediate: "名册上未划的几行空着，安全屋的门在天黑之后不再放人下去"
        near: "空着的几行到明天就按失踪入册，护送队出城前必先来问这一份登记"
    调解委托纠纷:
      places:
        - "委托街石亭"
      pairs:
        - 2
      category: "信息交换"
      action: "{npc}把两造的原单并排压在仲裁席上，要你当场说清自己那部分工时究竟算到哪一步。"
      beats:
        trigger: "{npc}把两造的原单并排压在仲裁席上，要你当场说清自己那部分工时究竟算到哪一步。"
        objective: "在罚则落下前把已交付部分与未动工部分分开结算"
        choice: "当场对清条目各认一段；只交自己的验收单不参与调解"
        immediate: "仲裁席按两人说清的条目落笔，未结部分由书吏另出一张新单"
        near: "谈崩的一方会直接进罚则流程，名下法器要等结清才解封"
    封存违约样品:
      places:
        - "石堡封存库"
      pairs:
        - 2
      category: "调查与核验"
      action: "{npc}按编号把一摞贴了封条的样灯推到铁架上，要你逐支念出封条上的日子。"
      beats:
        trigger: "{npc}按编号把一摞贴了封条的样灯推到铁架上，要你逐支念出封条上的日子。"
        objective: "在封条落定前把可解封与须长期封存的样品分清"
        choice: "逐支核对封条并登记；只标出封条破损的那几支"
        immediate: "念过的灯当场落架，封条有疑的那几支留在库门内侧待双签"
        near: "取件条没补齐就取不回来，滞留的样品会占掉下一次领芯的额度"
    当面卸下她沾满冰霜的秘银肩甲:
      places:
        - "迷宫中层安全屋"
      pairs:
        - 0
      category: "日常接触"
      action: "{npc}在安全屋门口冻得抬不起手，让你当面卸下她沾满冰霜的秘银肩甲。"
      beats:
        trigger: "{npc}在安全屋门口冻得抬不起手，让你当面卸下她沾满冰霜的秘银肩甲。"
        objective: "在回城之前把冻住的甲片解下来，也把这一路的账当面算清"
        choice: "接手解甲并当面点清件数；只递过火盆让她自己烤"
        immediate: "肩甲卸在门内的配给架上，甲片缝里的冰化成水淌了一地"
        near: "卸下的甲要写进配给员的器具簿，谁解的这一件也一并记上"
    提出交易:
      places:
        - "委托街石亭"
      pairs:
        - 3
      category: "信息交换"
      action: "{npc}把一支成色不明的晶芯推过石亭的桌面，提出交易：用今夜到手的整批私芯换你手上那张还没结清的验收单。"
      beats:
        trigger: "{npc}把一支成色不明的晶芯推过石亭的桌面，提出交易：用今夜到手的整批私芯换你手上那张还没结清的验收单。"
        objective: "在稽核落笔之前决定是接下这批私芯，还是把单子交上去"
        choice: "当场验芯并谈价；把单子收回怀里不接这笔"
        immediate: "晶芯搁在石亭桌面上，来往等号的人都看得见是谁跟谁在谈"
        near: "接下来就要在下一次核录前把芯用掉，不接则那张单子明日照样要过稽核的手"
    休眠匣夜谈:
      places:
        - "魔法工坊地下室"
      pairs:
        - 4
      category: "日常接触"
      action: "{npc}掀开工坊墙角休眠匣的木盖，就着匣口那点湿冷问你要不要拿它赌一次仪典。"
      beats:
        trigger: "{npc}掀开工坊墙角休眠匣的木盖，就着匣口那点湿冷问你要不要拿它赌一次仪典。"
        objective: "在仪典前敲定一根能撑完全程的晶芯，同时把契约上那一笔补给算进去"
        choice: "当场试芯并把补给条款讲明；只看一眼成色不接这根"
        immediate: "试过的芯由她重新封回匣里，契约那一页压在同一块木盖下面"
        near: "用掉的这根会在下一次稽核的名录里显出缺口，契约上的额度也会跟着见底"
  customs:
    - "完成委托的人可以在留言板写一条给后来者的经验。"
    - "委托结清后，来客会在石亭的挂板上亲手把单子摘下来。"
  pressures:
    委托验收条件改变:
      source: "石堡司事在交付前要求已约定的静态展台增加整夜动态演示，新增耗芯与值守工时全按原单结算；原单尾款已挂在结算台上，签字接受就当场生效。"
      engines:
        - "债务压力"
        - "第三方施压"
      beats:
        trigger: "{npc}发现石堡司事要求已约定的静态展台增加整夜动态演示。"
        objective: "区分已经付费的布展与新增耗芯、值守工时"
        choice: "交付原展台；由司事确认额外报酬后另排演示"
        immediate: "不加演仍可完成原展台，新增部分暂不启用法器"
        near: "书吏协调已付工钱，修理师无需以私人休息填补值守"
      far_trigger: "结算日司事仍以未加演为由扣住原单尾款"
      far_consequence: "工坊缺钱购芯并会缩减石堡后续接单；按原单结算则可继续普通委托"
      bindings:
        -
          activity: "摆设日用法器展台"
          place: "领主石堡"
          pair: 0
        -
          activity: 调解委托纠纷
          place: 委托街石亭
          pair: 2
      exits:
        - "完成原单后收回未借出的演示器具离堡"
        - "将争议尾款交行会调解，暂停后续新单"
    工坊共享设备撞期:
      source: "另一组工匠也持有同一时段的试灯架预约，而这批灯要在下一轮驻点补给车离城前送出去；两边谁先让出时段，谁就得自己吞下延期的违约罚金。"
      engines:
        - "资源锁定"
        - "时限逼近"
      beats:
        trigger: "{npc}发现另一组工匠也持有同一时段的试灯架预约。"
        objective: "保留完整测试时长，不用缩短测程假报续航"
        choice: "与另一组互换时段；今天只做外观检视"
        immediate: "本轮只留下真正完成的测试项，未测续航不能写成通过"
        near: "换时段会推迟交灯，邻坊测试则多付一笔工费"
      far_trigger: "下一轮驻点补给车离城前仍无续航结果"
      far_consequence: "这批灯留工坊，驻点改领已验旧灯，工坊承担额外周转而非逼人用未验品"
      bindings:
        -
          activity: "试验照明法器"
          place: "魔法工坊地下室"
          pair: 1
        -
          activity: 试配一日返程包
          place: 迷宫中层安全屋
          pair: 0
      exits:
        - "退还当次测试预约并另约"
        - "终止本轮新灯交付，按原委托约定处理退件"
    稽核查封与私芯:
      source: "稽核官凭罚则锁定了修理师名下未结清的一批灯，同时那根私下取来的晶芯已经装进仪典样机；封条一旦贴上，灯和芯一起封进库里，谁也说不清匣里原本有几支。"
      engines:
        - "身份风险"
        - "秘密暴露倒计时"
      beats:
        trigger: "{npc}带着罚则条例走到工坊门口，要封存那批未结清的灯。"
        objective: "在封条落定前把可解封的样灯与装着私芯的那一台分开"
        choice: "交出一台认下欠额换其余解封；先拖到结清再让稽核官动手"
        immediate: "被封的那几台当场落架登记，私芯那一台若还挂在架上就得连芯一起算"
        near: "取件条补齐才能取回，缺口没填上的那台会在下一次核录里对上号"
      far_trigger: "石堡封存库下一次开库核录的日子"
      far_consequence: "核录时对不上号就要连掮客一起被追出来，稽核官也保不住人；及时结清则只留一笔已销的旧账"
      bindings:
        -
          activity: "封存违约样品"
          place: "石堡封存库"
          pair: 2
        -
          activity: 迷宫停滞第一夜的滞留登记
          place: 迷宫中层安全屋
          pair: 2
      exits:
        - "交出名下未结清的那几台灯，换回其余样品的取件条"
        - "把争议欠额上交行会仲裁，暂停全部新单"
    结界检查临时收紧与异族证件更新日:
      source: "王都结界检查临时收紧，通行凭证一律当日复核；而异族证件更新日正撞在仪典前三天，工坊里那位使魔的凭证还压在旧册上，验不过就进不了工坊，也动不了那批待交付的灯。"
      engines:
        - "身份风险"
        - "时限逼近"
      beats:
        trigger: "{npc}把复核通告按在工坊门上，说使魔的凭证今日之内必须换新。"
        objective: "在凭证失效之前把该换的换掉，同时不耽误那一批灯的交付"
        choice: "带上旧册当日报审换证；先把灯交出去再回头补手续"
        immediate: "旧册压在复核桌上，使魔今日进不了工坊，试灯墙只留半边亮着"
        near: "凭证一日不换，她连日补助给的契约额度也跟着停一日"
      far_trigger: "结界复核结束而凭证仍是旧册"
      far_consequence: "凭证作废就要连工坊一并停检，下次开审前谁也拿不出能证明来历的册子；按时换新则只耽误一天交付"
      bindings:
        -
          activity: "试验照明法器"
          place: "魔法工坊地下室"
          pair: 1
      exits:
        - "按通告换证后退出本轮复核，改日再开试灯"
        - "把待交付的灯移出复核范围，交由行会另排时段"
    唤醒之时的信任透支:
      source: "使魔按契约每周期取用一次补给，这一次御主已经连续两期没能给足；契约只约束她能做什么，管不了她愿不愿意继续等，下一次取用日就是这份信任能被透支的最后一格。"
      engines:
        - "信任透支"
        - "魔力补给契约"
      beats:
        trigger: "{npc}把契约摊在试灯墙边，报出这两期欠下的额度，问这一次能不能给足。"
        objective: "在补给见底前重新谈定额度，不让契约变成一张只约束她的纸"
        choice: "当场补足并把周期改短；把欠额折进下一次交付的报酬"
        immediate: "报完数契约收回她怀里，试灯墙上那一半光当场暗了下去"
        near: "额度没谈拢她就不必再动自己的储量，工坊的试灯要停到下一批入城"
      far_trigger: "下一次契约取用日御主仍给不足额度"
      far_consequence: "到那天契约便只剩单方面的约束，转身离场不再违约；补足则可把周期与交付一并重排"
      bindings:
        -
          activity: "休眠匣夜谈"
          place: "魔法工坊地下室"
          pair: 4
        -
          activity: 当面卸下她沾满冰霜的秘银肩甲
          place: 迷宫中层安全屋
          pair: 0
      exits:
        - "当场补足本期额度，把契约周期另行商定"
        - "终止本份补给契约，另行寻找可领用的晶芯"
    名额只能给一个人的嫉妒与独占:
      source: "行会这一季只放出一个进仪典演示的名额，名单上并排着修理师与那位书吏；同时内宅那头已经在打听两人是什么交情，名额落到谁手上，另一头当晚就会知道。"
      engines:
        - "名额只能给一个人"
        - "嫉妒与独占"
      beats:
        trigger: "{npc}把只列一个名字的名额单推到桌上来，说这一季只能有一个人进仪典。"
        objective: "在名额落定前把两个人的去处与交情一次说清"
        choice: "当场让出名额并说明理由；接下名额各自另找出路"
        immediate: "名额单上先空着，两个人谁也没在上面落笔"
        near: "名额三日内必须上报，空着就等于两个人都没有，定下则另一头当晚就会问起"
      far_trigger: "名额上报截止日而两人仍未分开说清"
      far_consequence: "赶在截止前把交情与去处说明可各走一条路；含糊拖着则名额与关系一起废掉，内宅那头会自己来问"
      bindings:
        -
          activity: "提出交易"
          place: "委托街石亭"
          pair: 3
      exits:
        - "让出名额，把自己的名字从单子上划掉"
        - "接下名额，退出这一季的共同委托"
