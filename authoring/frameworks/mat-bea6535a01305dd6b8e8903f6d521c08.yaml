id: "mat-bea6535a01305dd6b8e8903f6d521c08"
name: "星海边境生活站"
material:
  eras:
    - "星际殖民地"
  aesthetics:
    - "星海冷光"
    - "赛博都市夜行"
    - "赛博霓虹"
    - "行当正剧"
  rule: "数据比人先到：站内公告、货单与舱段状态均由数据先落账，人再按数据到现场；账目与实际不符时，先冻结操作再补现场核验，不得按纸面数字开工。时间窗口有限：货运窗口、轨道朝向与轮班时段到期即关闭，逾期者只能等下一轮，站方不为个人延期。"
  social_rule: "检修区域以实际许可为准，岗位资历不能越过舱段操作权限；废热冷凝水与医用耗材按配给额度发放，超支部分从本人下轮额度扣除。"
  places:
    太空站舱段:
      details:
        - "舷窗遮光板在轮班间隙缓慢开启"
        - "扶手旁设有固定脚带与低亮度星图"
        - "观景侧舷窗只开窄幅，星野被舱体切去半边·轮班间隙"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "沿公共连廊返回生活舱，不穿越气闸"
        witnesses:
          - "当班舱务员"
        affordances:
          - "绘制舷窗观星表"
          - "用脚带稳定观察位置"
        pressure_modifiers:
          - "轨道朝向"
          - "遮光板开放时间"
    工作室:
      details:
        - "水培架旁设有隔离的干作业台"
        - "绑带与耐湿标牌按获准材料分格收纳"
        - "空花盆倒扣在干台一角，等一件够格的托架·日间"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "收起工具后经内门回生活连廊"
        witnesses:
          - "水培值班员"
        affordances:
          - "修补植物托架与名牌"
          - "试放空盆检查托架"
        pressure_modifiers:
          - "可用紧固件"
          - "水培区洁净要求"
    图书馆:
      details:
        - "局域终端缓存着延迟到站的母星影像"
        - "阅览席的耳机与公共播放扬声器分开控制"
        - "闭架角落的双人阅览席拉上防窥帘·深夜"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "退出个人阅览后走向公共连廊"
        witnesses:
          - "资料馆轮值居民"
        affordances:
          - "母星影像共看"
          - "各自选择不公开的片段"
        pressure_modifiers:
          - "影像缓存完整度"
          - "共同空闲时段"
    检疫缓冲舱:
      details:
        - "气闸内侧的缓冲舱只挂四面可拆的检疫隔离帘·全天"
        - "停靠位旁的气密货箱按收货单号码放，未过检的箱体不许开盖·全天"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "过闸前须由检疫员签字放行，未过检不得带出缓冲舱"
        witnesses:
          - "驻舱检疫员"
          - "同批等待过闸的到站人员"
        affordances:
          - "核对货箱单号与封条"
          - "按序登记过闸时间"
        pressure_modifiers:
          - "货船停靠窗口"
          - "检疫签字进度"
    黑市换气角:
      details:
        - "三号货舱背面两排通风栅之间留出一处无监控的换气死角·深夜"
        - "栅板内侧焊着半截旧货架，格子里压着几支来路不明的备用瓶·深夜"
      profile:
        privacy: "high"
        visibility: "low"
        exits:
          - "沿检修通道退回三号货舱主廊，遇巡检须装作做例行读数"
        witnesses:
          - "同来换货的另一名站内居民"
        affordances:
          - "按私下约定的比例换件"
          - "拆封辨认器械的出厂标记"
        pressure_modifiers:
          - "巡检路线与频次"
          - "双方各自手上的缺口"
  pairs:
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "师傅"
      npc:
        role: "舱段检修员"
        function: "检查舷窗机构与小型托架，解释设备状态"
        authority: "可停用自己检修的部件并安排复检"
        resource: "适配托架的紧固件和舷窗维护时段"
        limitation: "不能改动轨道、生命维持参数或调走公共储备"
        obligation: "维修后实际试载，交还开放区域"
        exposure: "返工占用自己的轮休并影响同班接手"
      player:
        identity: "站内物资记录人"
        baseline: "你知道哪些材料可领，正在给自己的水培植物换托架；不把别人的轮休视为免费维修班。"
        resources:
          - "自己的空花盆"
          - "可核对的非急用耗材库存"
          - "一沓盖过检疫签的旧收货单"
        reputation: "数量拿不准就先数实物"
      relationship_reason: "两人上次为观景舱换遮光板时分别负责领件与装配，此后约在共同轮休日看星。"
    -
      family: "服务与手艺"
      position: "动力舱维修工"
      appellations:
        - "师傅"
      npc:
        role: "动力舱维修工"
        function: "守着动力舱的循环泵与废热管路，顺带给整层舱段分派冷凝水额度"
        authority: "可停用自己那段管路，也能决定本窗口把水拨给谁"
        resource: "动力舱的分水阀钥匙、一张手写的额度分配表和几年攒下的备用密封圈"
        limitation: "改不了全站的配额总量，也造不出新的耗材"
        obligation: "拨水前当众报出余量，改过的分配表要留本人签字"
        exposure: "私拨过一次被对上表，此后整层的窗口额度都要他自己来补"
      player:
        identity: "动力舱维修工"
        baseline: "你手上有几箱单号对不上的货，也知道动力舱那本分配表上还空着一格没用完的水。"
        resources:
          - "一沓盖过检疫签的旧收货单"
          - "能进动力舱的临时通行记录"
        reputation: "数不清就当面数，不拿别人的额度填自己的缺"
      relationship_reason: "维修工上回在窗口里替记录人留下一格冷凝水，代价是自己那层少洗了一次管路；这一次记录人要拿那一格去换换气角的备用瓶，得先问过他愿不愿意再垫一次。"
    -
      family: "商业与产业"
      position: "同侪"
      appellations:
        - "直呼其名"
      npc:
        role: "站内物资记录人"
        function: "核对耗材库存并替居民办理领用"
        authority: "可冻结疑似重复的非急用领料单"
        resource: "到货箱号、待回收的旧托架与退件包装"
        limitation: "不能批准额外补给，也不能把急用件挪给非急用领料单"
        obligation: "分开保存公用耗材与居民自购物品"
        exposure: "账物不符会占住下一班的领料额度"
      player:
        identity: "舱段检修员"
        baseline: "你熟悉舱段设施，愿在轮休教对方辨认真实视野而不替对方安排休假。"
        resources:
          - "小型工具包"
          - "自己负责舱段的检修权限"
        reputation: "会留下可接手的设备，不拿临时凑合当修好"
      relationship_reason: "检修员曾帮记录人保住一盆倒伏的幼苗；记录人愿一起找能重复使用的托架材料。"
    -
      family: "秩序与执法"
      position: "避难所检疫员"
      appellations:
        - "长官"
      npc:
        role: "检疫缓冲舱驻舱检疫员"
        function: "按到站批次核对封条、签字放行并记录过闸时间"
        authority: "可拒签任何未过检的箱体与人员，复检须走正式流程"
        resource: "批次单、未签字的放行票根和停靠位开盖记录"
        limitation: "不能改动轨道与货期，也不能放行自己签不动的批次"
        obligation: "签字前必对封条，拒签时当场写明理由并留底"
        exposure: "错签一次就要写完整复检报告，下一批停靠的货全压在缓冲舱里"
      player:
        identity: "站内物资记录人"
        baseline: "你手上有几箱单号对不上的货，正在掂量走正式复检要赔掉多少下一轮停靠的额度。"
        resources:
          - "自己记的领料本"
          - "能核对到货箱号的收货单副本"
        reputation: "明知单号有疑也让检疫员先看现场，不塞私下的人情"
      relationship_reason: "检疫员上次放行了记录人被压的一箱水培配件，代价是本班的补检拖了三个小时；这一次记录人必须决定是否把可疑的那几箱如实报上去。"
    -
      family: "地下与灰色地带"
      position: "黑市药贩"
      appellations:
        - "掌柜"
      npc:
        role: "换气角黑市商人"
        function: "在通风栅死角按私下比例交换备用瓶与紧缺耗材"
        authority: "可当场决定一批货认不认账，也能让一笔交易根本不落账"
        resource: "来源不明的备用瓶、旧货架夹层和一条绕开巡检的换货路线"
        limitation: "不认任何交情，只认当场能拿出来的等价物"
        obligation: "出瓶前说明缺口与残留，不把过期误充的责任推给同批的人"
        exposure: "被巡检撞破一次就要连带咬出上一批换货的人，自己也得吃配给扣减"
      player:
        identity: "站内物资记录人"
        baseline: "你知道配给额度下个月还要缩，也清楚这个角落的东西一旦进了器械就再没人替你担责。"
        resources:
          - "对得上账的一部分废热冷凝水配额"
          - "知道三号货舱巡检会在哪一刻空过去"
        reputation: "换过手就认数，不把来路推给下一个接手的人"
      relationship_reason: "记录人曾在货舱口替这位商人补过一次单号，代价是自己那轮的额度先挪了出去；现在商人的备用瓶成了检修员能不能撑过下个窗口的前提。"
  activities:
    绘制舷窗观星表:
      places:
        - "太空站舱段"
      pairs:
        - 0
      category: "信息交换"
      action: "{npc}把轨道预测图转向你，邀你找出舷窗里正在移动的亮点。"
      beats:
        trigger: "{npc}把轨道预测图转向你，邀你找出舷窗里正在移动的亮点。"
        objective: "学会把站体运动与星体位置区分开"
        choice: "一起比对两次视野；只看一轮不再记录"
        immediate: "预测与实见的差异决定下一次该等哪个观测角度"
        near: "双方可以约到各自有空的轨道窗口，不参加也不会损失舷窗使用资格"
    修补植物托架与名牌:
      places:
        - "工作室"
      pairs:
        - 1
      category: "照护与修复"
      action: "{npc}拿来自己的空花盆，请你帮忙检查旧托架哪里松动。"
      beats:
        trigger: "{npc}拿来自己的空花盆，请你帮忙检查旧托架哪里松动。"
        objective: "用可领用余件恢复托架承重，让名牌不再掉进水槽"
        choice: "参与试载；只挑耐湿名牌不碰托架"
        immediate: "修好就托起空盆试稳，缺件则留在干台不把不稳托架放回水培架"
        near: "下一次浇护时可验证是否仍晃动，并决定是否继续种这株植物"
    母星影像共看:
      places:
        - "图书馆"
      pairs:
        - 0
      category: "日常接触"
      action: "{npc}停在一段母星街景前，问你是否愿意一起听两分钟雨声。"
      beats:
        trigger: "{npc}停在一段母星街景前，问你是否愿意一起听两分钟雨声。"
        objective: "交换与家乡有关的感受，不替影像编公共结论"
        choice: "讲自己记得的那条街；只在旁边听完整段"
        immediate: "选择分享会发现同一街景对两人的意义不同，沉默也能一起看完"
        near: "喜欢的片段可留在个人收藏，下次相遇是否再看由两人决定"
    推过半板抗生素:
      places:
        - "黑市换气角"
      pairs:
        - 3
      category: "信息交换"
      action: "{npc}把半板本季配给的抗生素推过来，说整板换不起，只肯先推过半板抗生素，另一半要等下一轮停靠。"
      beats:
        trigger: "{npc}把半板本季配给的抗生素推过来，说整板换不起，只肯先推过半板抗生素，另一半要等下一轮停靠。"
        objective: "在缺件补齐之前先拿到能救急的那一半，也谈清另一半的抵押"
        choice: "接下这半板并把余量写清；只换半瓶够用的转身就走"
        immediate: "半板药压进铁皮货架夹层，另一半的去处只凭两人一句话"
        near: "下一轮停靠前讨不到另一半，先垫出去的额度就全砸在这一句话上"
    替她扶正防毒面罩:
      places:
        - "检疫缓冲舱"
      pairs:
        - 2
      category: "照护与修复"
      action: "{npc}过闸时面罩的密封条翻了起来，你替她扶正防毒面罩，指尖蹭到舱内那股消毒水味。"
      beats:
        trigger: "{npc}过闸时面罩的密封条翻了起来，你替她扶正防毒面罩，指尖蹭到舱内那股消毒水味。"
        objective: "在签字放行之前把面罩戴严，也让这一次过闸不留下核查记录"
        choice: "替她扶正并压紧密封条；让她自己按规程重新过一遍"
        immediate: "面罩贴回脸上，密封条压紧的一下在闸门内侧听得见"
        near: "面罩若在舱内再翻一次就要重新登记，这一次的签字也就白签了"
    共处一室的静默班次:
      places:
        - "检疫缓冲舱"
      pairs:
        - 2
      category: "日常接触"
      action: "{npc}把两道隔离帘拉上，说接下来十几个小时两人共处一室，值班记录得由一个人一直握着。"
      beats:
        trigger: "{npc}把两道隔离帘拉上，说接下来十几个小时两人共处一室，值班记录得由一个人一直握着。"
        objective: "在没有第三方在场的班次里定下谁记录、谁动手"
        choice: "由自己接下班次记录；两人轮流登记各写一半"
        immediate: "隔离帘拉严，舱内只剩检疫灯与两人的登记笔迹"
        near: "班次结束时记录要交上去，谁写的字就是这一晚唯一的凭证"
    分水阀前的额度对账:
      places:
        - "太空站舱段"
      pairs:
        - 4
      category: "调查与核验"
      action: "{npc}把分水阀钥匙与那张手写分配表并排放在扶手上，要你把本窗口剩下的冷凝水额度一笔笔念出来。"
      beats:
        trigger: "{npc}把分水阀钥匙与那张手写分配表并排放在扶手上，要你把本窗口剩下的冷凝水额度一笔笔念出来。"
        objective: "在窗口关闭之前把动力舱那格余下的水拨到该去的地方"
        choice: "逐笔核对并当众签字；只报自己经手的那几笔"
        immediate: "念过的几笔当场划掉，空着的那一格仍在表上没动"
        near: "表上余下的格子到窗口关闭就作废，下一轮要重新按人头排队"
    检疫放行签字:
      places:
        - "检疫缓冲舱"
      pairs:
        - 2
      category: "调查与核验"
      action: "{npc}把一沓放行票根摊在缓冲舱的停靠位边，请你先看封条再决定哪几箱今天开。"
      beats:
        trigger: "{npc}把一沓放行票根摊在缓冲舱的停靠位边，请你先看封条再决定哪几箱今天开。"
        objective: "在货船停靠窗口关闭前分清可签字与须复检的批次"
        choice: "逐箱对封条签字；只签没疑问的那几箱"
        immediate: "签完的箱体当场贴码出舱，有疑问的留在停靠位不许开盖"
        near: "未签批次要等下一趟停靠，滞仓费从这批收货方的额度里扣"
    换气角私下换件:
      places:
        - "黑市换气角"
      pairs:
        - 3
      category: "空间与退出"
      action: "{npc}在通风栅背面掀开半截货架，把两支来路不清的备用瓶摆上铁皮，问你拿什么换。"
      beats:
        trigger: "{npc}在通风栅背面掀开半截货架，把两支来路不清的备用瓶摆上铁皮，问你拿什么换。"
        objective: "在不落账的角落里补齐本轮缺件，同时留一条能抽身的退路"
        choice: "照比例换下这一批；只拆封看一眼出厂标记再退回"
        immediate: "换定的瓶子当场过手且双方都不留下签字，谈崩的一方须先退出通风栅"
        near: "用掉的瓶子会出现在下一轮检修记录里，缺口还不上就要再找一个能顶住的熟人"
  customs:
    - "居民会在公共星图边上贴出自己的家乡方向，但不必署名。"
    - "过闸的人在缓冲舱外留一张自己写的过检票根，算是对下一批等候者的提醒。"
  pressures:
    货运清单与实物不符:
      source: "领用托架紧固件时发现到货箱的实装数量比收货单少了三成，而领料已经按纸面数字排进当班排期；下一轮提报在停靠窗口关闭前截止，亏损部分默认记在经手人这一班的额度上。"
      engines:
        - "资源锁定"
        - "时限逼近"
      beats:
