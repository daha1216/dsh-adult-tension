  technology_boundary: "轨道计算、局域阅览终端和水培循环已经普及；舷窗视野受姿态与遮光板限制，物资仍须货运抵达，维修员无权远程制造缺件或调整全站轨道。新增的检疫缓冲舱只处理到站批次的消杀、封条核对与签字放行，放行靠票根与人工签字，站点没有实时生物扫描，也不存在能远程查明箱内物品的手段；三号货舱背面的换气角属于巡检盲区，那里的交易不产生任何站方记录，配对不上账的件只能在私下流转。"
