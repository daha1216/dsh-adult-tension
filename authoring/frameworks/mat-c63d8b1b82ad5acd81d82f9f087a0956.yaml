id: "mat-c63d8b1b82ad5acd81d82f9f087a0956"
name: "明治洋裁与译书町"
material:
  eras:
    - "明治东京"
  aesthetics:
    - "和风物哀"
    - "旧年代质感"
  rule: "新式店铺与旧街坊并存，译书、洋裁和手工招牌改变日常。"
  social_rule: "译稿的改动与店铺定制需求都须由委托人确认。"
  places:
    洋装裁缝铺:
      details:
        - "洋装裁缝铺裁桌上铺着同名却手感不同的布样"
        - "脚踏缝纫机由店内裁缝使用，借来的样册不从书页上剪取材料"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "归还借样后经店面门离开"
        witnesses:
          - "铺内裁缝与掌柜"
        affordances:
          - "试配布料样片"
          - "比较自有试样的垂坠和起皱"
        pressure_modifiers:
          - "现货长度与订货价格"
          - "样册借用期限"
    银座料亭:
      details:
        - "银座料亭在备席前送出一小碟当季试菜"
        - "菜单草稿由掌柜保管，来客不进灶间"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "从接待玄关退出银座街面"
        witnesses:
          - "掌柜与上菜人"
        affordances:
          - "共尝季节菜与译名"
          - "先问实际配料再决定点菜"
        pressure_modifiers:
          - "当日食材"
          - "掌柜是否同意使用新译名"
    洋馆偏屋:
      details:
        - "洋馆偏屋书架并放日文与外文译本"
        - "窗边桌面摆着获准修补的普通散页册，珍本另存"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "收好获准用的修补材料，从偏屋走廊回访客门"
        witnesses:
          - "书房保管人"
        affordances:
          - "修补双语书册"
          - "为松脱册页做可取下的保护夹套"
        pressure_modifiers:
          - "书主允许的修补范围"
          - "可用纸料与糨糊干燥时间"
    香道馆:
      details:
        - "香道馆小席把香材盒与听讲座位隔开"
        - "馆主以小量香材示范，访客不自行开盒加料"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "待自己手边器物交回后从席侧门退出，也可提前说明离席"
        witnesses:
          - "主持香席的馆主"
        affordances:
          - "交流香材别称"
          - "以自己的词说一段气味感受"
        pressure_modifiers:
          - "馆主安排的试闻顺序"
          - "香材名称的地方差异"
  pairs:
    -
      family: "语言与传译"
      position: "同侪"
      appellations:
        - "先生"
      npc:
        role: "译书校对员"
        function: "比较日文与外文版本，说明译词所指范围"
        authority: "能提出校改并向委托人说明，定稿须由出版或店铺负责人确认"
        resource: "对照译本、词汇笔记与书主准许修护的普通册页"
        limitation: "不因懂外语就能鉴定布料成分、香材真伪或替店主退货"
        obligation: "将原文、译法和补充解释分清，保留未解之处"
        exposure: "误译会让店家买错材料，挤占下月周转钱"
      player:
        identity: "洋裁样册整理人"
        baseline: "你见过同一个漂亮译名下完全不同的布，愿带校对员看日常穿用究竟在意什么。"
        resources:
          - "一册亲手写的布料损耗记录"
          - "常来试衣客的合身抱怨"
        reputation: "把缺点和好处放在一起讲"
      relationship_reason: "样册整理人曾拿出同名异布让校对员改掉一条含混译词，两人因此常先看实物再谈名目。"
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "师傅"
      npc:
        role: "洋裁样册整理人"
        function: "整理布样并向顾客说明不同面料的日用表现"
        authority: "能安排自有试样比较，成衣裁剪与价格由裁缝和掌柜确认"
        resource: "自有边角布样、用途注记与现货长度"
        limitation: "不能只凭样册页断定成衣效果，也不能剪损借来的样册"
        obligation: "试样与借品分开，说明起皱与垂坠的实际差别"
        exposure: "推荐不当会让客人花冤钱，自己需重做样册"
      player:
        identity: "译书校对员"
        baseline: "你想让新词真的能用，却愿在摸过布和尝过菜后承认词典讲得不够。"
        resources:
          - "外洋商名录抄本"
          - "几封料行来信的问价句式"
        reputation: "不靠陌生词压过使用者经验"
      relationship_reason: "校对员替样册整理人读懂借品说明，整理人则教他做一个不伤册页的保护夹套；合作不包含替对方接受所有订货。"
  activities:
    试配布料样片:
      places:
        - "洋装裁缝铺"
      pairs:
        - 1
      category: "调查与核验"
      action: "{npc}把两块自有布样搭在同一小架上，问你想给日常外套选哪一种。"
      beats:
        trigger: "{npc}把两块自有布样搭在同一小架上，问你想给日常外套选哪一种。"
        objective: "看见垂坠、起皱与价格的实际取舍"
        choice: "可折放自有布样再比较；可只问用途，或不选布只把借册合好"
        immediate: "同名布料呈现不同褶痕，选择按实际用途而非外文名高低"
        near: "样册可补上用途意见，是否下单另由买方确认"
    共尝季节菜与译名:
      places:
        - "银座料亭"
      pairs:
        - 0
      category: "日常接触"
      action: "{npc}请上菜人说明小碟里的当季食材，邀你尝后说一个自己熟悉的名字。"
      beats:
        trigger: "{npc}请上菜人说明小碟里的当季食材，邀你尝后说一个自己熟悉的名字。"
        objective: "用实际味道找到今晚想吃的一道菜"
        choice: "可尝一口并点菜；可只听配料，或仍点自己熟悉的旧菜单"
        immediate: "尝过才知道译名像家乡菜但口味不同，两人可各点各的"
        near: "想保留的新译名交掌柜考虑，不参加点菜也不欠一次校译劳动"
    修补双语书册:
      places:
        - "洋馆偏屋"
      pairs:
        - 0
      category: "照护与修复"
      action: "{npc}在书主准许下托住一册普通散页书，请你帮忙试套可取下的保护夹套。"
      beats:
        trigger: "{npc}在书主准许下托住一册普通散页书，请你帮忙试套可取下的保护夹套。"
        objective: "让松脱册页能被顺序保存，不破坏原装订"
        choice: "可折夹套并试放；可只递纸，或把需专业装订的部分交书主另请师傅"
        immediate: "夹套合适就容纳散页而不粘住文字，复杂书脊不在桌边擅修"
        near: "书主下次翻阅能找到原页序，是否正式重装另谈"
    交流香材别称:
      places:
        - "香道馆"
      pairs:
        - 1
      category: "信息交换"
      action: "{npc}听馆主说出一组沿用别称，问你愿不愿用自己的词描述刚才的香气。"
      beats:
        trigger: "{npc}听馆主说出一组沿用别称，问你愿不愿用自己的词描述刚才的香气。"
        objective: "分清商名、地方别称与个人感受"
        choice: "可描述一回并听馆主解释；可只听讲不试闻，或说明后提前离席"
        immediate: "同一香材可以唤起不同记忆，不把谁的词更洋气当作正确标准"
        near: "两人可留一个自己记得住的称呼，不代馆主编鉴定结论"
  customs:
    - "新词会先写在可更换的小标签上，让常客也能提出改法。"
  pressures:
    译名引起误订:
      source: "整理布样时发现店铺把同一批布的两个译名下成两份订货。"
      engines:
        - "债务压力"
        - "信任透支"
      beats:
        trigger: "{npc}发现整理布样时发现店铺把同一批布的两个译名下成两份订货。"
        objective: "核对实物批次与订单，决定撤单还是接受多余现货"
        choice: "请校对员解释原货名并由掌柜联系供货方；或先停重复订货等待回信"
        immediate: "尚未裁剪的重复布先不动，客人的原定衣料不擅自换批"
        near: "退货可能有运费，接受现货则占库存，费用由订货关系决定不强压译员包赔"
      far_trigger: "下一批进货款到期仍未解决重复库存"
      far_consequence: "掌柜会削减新料采购，裁缝可选面料减少；及时协商能恢复周转"
      bindings:
        -
          activity: "试配布料样片"
          place: "洋装裁缝铺"
          pair: 1
      exits:
        - "暂停自己的布样推荐，由掌柜处理货款"
        - "撤回未确认的新订单，继续使用现有合适面料"
    借展归期改变:
      source: "布样比较时收到借主来信，借来的洋裁样册须提前归还。"
      engines:
        - "时限逼近"
        - "资源锁定"
      beats:
        trigger: "{npc}发现布样比较时收到借主来信，借来的洋裁样册须提前归还。"
        objective: "在不损借品的前提下收束本轮查看"
        choice: "先用自有布样完成一项比较并归册；或请借主同意抄一页，未获答复就不复制"
        immediate: "借册按原样合拢，未看的部分留下问题，不用剪下样片充收藏"
        near: "少看的内容以后重新预约，本次展台改用店铺自有布样"
      far_trigger: "下一季再借时借主仍记得上次是否按时完整归还"
      far_consequence: "如守约可继续借阅；若拖还或损坏，往后须购置自有册并承担成本"
      bindings:
        -
          activity: "试配布料样片"
          place: "洋装裁缝铺"
          pair: 1
      exits:
        - "结束本次查看按期送还借册"
        - "放弃复制请求，仅保留本人已写的用途感受"
  legacy_sources:
    eras:
      - "明治东京"
    aesthetics:
      - "和风物哀"
      - "旧年代质感"
    places:
      - "洋装裁缝铺"
      - "银座料亭"
      - "洋馆偏屋"
      - "香道馆"
  themes:
    - "新译名与实物经验之间的距离"
    - "洋裁选择里的用途和日常预算"
    - "借来的知识与自己的手艺"
  technology_boundary: "场景取明治中后期东京，纸质译本、布样册、脚踏缝纫机与商店订货单并存；电报可经营业机构付费传递，不等于即时跨洋退单。香席由馆主安排，香材别称不能当作精确成分或疗效证明。"
  bridge_status: "not_required"
