id: "mat-c63d8b1b82ad5acd81d82f9f087a0956"
name: "明治洋裁与译书町"
material:
  eras:
    - "明治东京"
  aesthetics:
    - "和风物哀"
    - "旧年代质感"
  rule: "新式店铺与旧街坊并存，译书、洋裁和手工招牌改变日常；街面上礼数大于实话，铺号门帘挂了什么字样，客人就按什么身份待你，账目与新词都先落在可更换的标签上，翻脸之前没有人先撕破脸。"
  social_rule: "译稿的改动与店铺定制需求都须由委托人确认；试衣间帘后那半分钟属于本人，铺里只记住帘子拉了几寸，不问里面换了什么，替人认下订货或代签校样者由行会共议处置。"
  places:
    洋装裁缝铺:
      details:
        - "洋装裁缝铺裁桌上铺着同名却手感不同的布样"
        - "脚踏缝纫机由店内裁缝使用，借来的样册不从书页上剪取材料"
        - "铺后试衣间只挂一道布帘，帘杆上刻着几道深浅不同的旧痕量长·午"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "归还借样后经店面门离开"
        witnesses:
          - "铺内裁缝与掌柜"
        affordances:
          - "试配布料样片"
          - "比较自有试样的垂坠和起皱"
          - "替人拉上背后的拉链"
        pressure_modifiers:
          - "现货长度与订货价格"
          - "样册借用期限"
          - "试衣间帘外是否有人在等"
    银座料亭:
      details:
        - "银座料亭在备席前送出一小碟当季试菜"
        - "菜单草稿由掌柜保管，来客不进灶间"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "从接待玄关退出银座街面"
        witnesses:
          - "掌柜与上菜人"
        affordances:
          - "共尝季节菜与译名"
          - "先问实际配料再决定点菜"
        pressure_modifiers:
          - "当日食材"
          - "掌柜是否同意使用新译名"
    洋馆偏屋:
      details:
        - "洋馆偏屋书架并放日文与外文译本"
        - "窗边桌面摆着获准修补的普通散页册，珍本另存"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "收好获准用的修补材料，从偏屋走廊回访客门"
        witnesses:
          - "书房保管人"
        affordances:
          - "修补双语书册"
          - "为松脱册页做可取下的保护夹套"
        pressure_modifiers:
          - "书主允许的修补范围"
          - "可用纸料与糨糊干燥时间"
    香道馆:
      details:
        - "香道馆小席把香材盒与听讲座位隔开"
        - "馆主以小量香材示范，访客不自行开盒加料"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "待自己手边器物交回后从席侧门退出，也可提前说明离席"
        witnesses:
          - "主持香席的馆主"
        affordances:
          - "交流香材别称"
          - "以自己的词说一段气味感受"
        pressure_modifiers:
          - "馆主安排的试闻顺序"
          - "香材名称的地方差异"
    壬生道场残间:
      details:
        - "旧道场改作洋裁铺的储物间，地板仍留着原先踏痕磨出的白印"
        - "木刀与熨斗架并排靠在墙边，靠门一角只放修补用的器具·午"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "交还借用的道场钥匙，从裁缝铺后门回到街面"
        witnesses:
          - "受托看管道场的旧师傅"
        affordances:
          - "教一个身段"
          - "在踏痕白印上对步幅"
        pressure_modifiers:
          - "看管师傅准许的时段"
          - "铺面营业与道场器具的共用"
  pairs:
    -
      family: "语言与传译"
      position: "同侪"
      appellations:
        - "先生"
      npc:
        role: "译书校对员"
        function: "比较日文与外文版本，说明译词所指范围"
        authority: "能提出校改并向委托人说明，定稿须由出版或店铺负责人确认"
        resource: "对照译本、词汇笔记与书主准许修护的普通册页"
        limitation: "不因懂外语就能鉴定布料成分、香材真伪或替店主退货"
        obligation: "将原文、译法和补充解释分清，保留未解之处"
        exposure: "误译会让店家买错材料，挤占下月周转钱"
      player:
        identity: "洋裁样册整理人"
        baseline: "你见过同一个漂亮译名下完全不同的布，愿带校对员看日常穿用究竟在意什么。"
        resources:
          - "一册亲手写的布料损耗记录"
          - "常来试衣客的合身抱怨"
        reputation: "把缺点和好处放在一起讲"
      relationship_reason: "样册整理人曾拿出同名异布让校对员改掉一条含混译词，两人因此常先看实物再谈名目。"
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "师傅"
      npc:
        role: "洋裁样册整理人"
        function: "整理布样并向顾客说明不同面料的日用表现"
        authority: "能安排自有试样比较，成衣裁剪与价格由裁缝和掌柜确认"
        resource: "自有边角布样、用途注记与现货长度"
        limitation: "不能只凭样册页断定成衣效果，也不能剪损借来的样册"
        obligation: "试样与借品分开，说明起皱与垂坠的实际差别"
        exposure: "推荐不当会让客人花冤钱，自己需重做样册"
      player:
        identity: "译书校对员"
        baseline: "你想让新词真的能用，却愿在摸过布和尝过菜后承认词典讲得不够。"
        resources:
          - "外洋商名录抄本"
          - "几封料行来信的问价句式"
        reputation: "不靠陌生词压过使用者经验"
      relationship_reason: "校对员替样册整理人读懂借品说明，整理人则教他做一个不伤册页的保护夹套；合作不包含替对方接受所有订货。"
  activities:
    试配布料样片:
      places:
        - "洋装裁缝铺"
      pairs:
        - 1
      category: "调查与核验"
      action: "{npc}把两块自有布样搭在同一小架上，问你想给日常外套选哪一种。"
      beats:
        trigger: "{npc}把两块自有布样搭在同一小架上，问你想给日常外套选哪一种。"
        objective: "看见垂坠、起皱与价格的实际取舍"
        choice: "可折放自有布样再比较；可只问用途，或不选布只把借册合好"
        immediate: "同名布料呈现不同褶痕，选择按实际用途而非外文名高低"
        near: "样册可补上用途意见，是否下单另由买方确认"
    共尝季节菜与译名:
      places:
        - "银座料亭"
      pairs:
        - 0
      category: "日常接触"
      action: "{npc}请上菜人说明小碟里的当季食材，邀你尝后说一个自己熟悉的名字。"
      beats:
        trigger: "{npc}请上菜人说明小碟里的当季食材，邀你尝后说一个自己熟悉的名字。"
        objective: "用实际味道找到今晚想吃的一道菜"
        choice: "可尝一口并点菜；可只听配料，或仍点自己熟悉的旧菜单"
        immediate: "尝过才知道译名像家乡菜但口味不同，两人可各点各的"
        near: "想保留的新译名交掌柜考虑，不参加点菜也不欠一次校译劳动"
    修补双语书册:
      places:
        - "洋馆偏屋"
      pairs:
        - 0
      category: "照护与修复"
      action: "{npc}在书主准许下托住一册普通散页书，请你帮忙试套可取下的保护夹套。"
      beats:
        trigger: "{npc}在书主准许下托住一册普通散页书，请你帮忙试套可取下的保护夹套。"
        objective: "让松脱册页能被顺序保存，不破坏原装订"
        choice: "可折夹套并试放；可只递纸，或把需专业装订的部分交书主另请师傅"
        immediate: "夹套合适就容纳散页而不粘住文字，复杂书脊不在桌边擅修"
        near: "书主下次翻阅能找到原页序，是否正式重装另谈"
    交流香材别称:
      places:
        - "香道馆"
      pairs:
        - 1
      category: "信息交换"
      action: "{npc}听馆主说出一组沿用别称，问你愿不愿用自己的词描述刚才的香气。"
      beats:
        trigger: "{npc}听馆主说出一组沿用别称，问你愿不愿用自己的词描述刚才的香气。"
        objective: "分清商名、地方别称与个人感受"
        choice: "可描述一回并听馆主解释；可只听讲不试闻，或说明后提前离席"
        immediate: "同一香材可以唤起不同记忆，不把谁的词更洋气当作正确标准"
        near: "两人可留一个自己记得住的称呼，不代馆主编鉴定结论"
    为她描一次眉:
      places:
        - "银座料亭"
      pairs:
        - 1
      category: "日常接触"
      action: "{npc}在料亭备席前的镜台边把眉笔捏在手里，说自己描不准右边这一道。"
      beats:
        trigger: "{npc}在料亭备席前的镜台边把眉笔捏在手里，说自己描不准右边这一道。"
        objective: "把眉描得左右一样，也让这一下近距离停在对方许可的范围里"
        choice: "可接过眉笔替她描右边；可只扶着镜台让她自己补；或退开请上菜人找位女客帮忙"
        immediate: "眉毛描完当场可见，笔尖离脸的距离由她点头决定，不点头就停在手边"
        near: "这一笔算不算亲近由她下次要不要再让你描决定，铺里没人会拿它当话柄"
    教她一个身段:
      places:
        - "壬生道场残间"
      pairs:
        - 0
      category: "信息交换"
      action: "{npc}踩着地板上的旧踏痕白印站定，问这半步的落法在译本里该叫什么名字。"
      beats:
        trigger: "{npc}踩着地板上的旧踏痕白印站定，问这半步的落法在译本里该叫什么名字。"
        objective: "让这个身段既能被做出来，也能找到一个说得清的词"
        choice: "可扶她的肩纠正半步落法；可只在地上画出落点让她自己走；或先查本子再定名"
        immediate: "半步的落点当场定在地上，名字仍空着，查不到就往本子上留一处空白"
        near: "留下的空白比硬找的词耐用，下一版译稿里若仍找不到说法，就照旧空着"
    替她拉上背后拉链:
      places:
        - "洋装裁缝铺"
      pairs:
        - 1
      category: "照护与修复"
      action: "{npc}穿上刚裁好的样衣，背后的拉链差半寸够不着，帘子只拉了一半。"
      beats:
        trigger: "{npc}穿上刚裁好的样衣，背后的拉链差半寸够不着，帘子只拉了一半。"
        objective: "把拉链拉好，让帘后那半分钟不被铺面看去"
        choice: "可站到帘内替她拉上拉链；可递一把长柄钩让她自己拉；或退出帘外叫裁缝进来"
        immediate: "拉链拉到顶就停手，帘子由她自己合上，尺寸记在铺里的单子上不写在人身上"
        near: "这半分钟铺里只记帘子拉了几寸，成衣交件前她要不要再让你进去，由她自己开口"
  customs:
    - "新词会先写在可更换的小标签上，让常客也能提出改法。"
    - "试衣间帘杆上刻痕记长度不记名字，谁进去过由帘子说话。"
  pressures:
    译名引起误订:
      source: "整理布样时发现店铺把同一批布的两个译名下成两份订货。"
      engines:
        - "债务压力"
        - "信任透支"
      beats:
        trigger: "{npc}发现整理布样时发现店铺把同一批布的两个译名下成两份订货。"
        objective: "核对实物批次与订单，决定撤单还是接受多余现货"
        choice: "请校对员解释原货名并由掌柜联系供货方；或先停重复订货等待回信"
        immediate: "尚未裁剪的重复布先不动，客人的原定衣料不擅自换批"
        near: "退货可能有运费，接受现货则占库存，费用由订货关系决定不强压译员包赔"
      far_trigger: "下一批进货款到期仍未解决重复库存"
      far_consequence: "掌柜会削减新料采购，裁缝可选面料减少；及时协商能恢复周转"
      bindings:
        -
          activity: "试配布料样片"
          place: "洋装裁缝铺"
          pair: 1
      exits:
        - "暂停自己的布样推荐，由掌柜处理货款"
        - "撤回未确认的新订单，继续使用现有合适面料"
    借展归期改变:
      source: "布样比较时收到借主来信，借来的洋裁样册须提前归还。"
      engines:
        - "时限逼近"
        - "资源锁定"
      beats:
        trigger: "{npc}发现布样比较时收到借主来信，借来的洋裁样册须提前归还。"
        objective: "在不损借品的前提下收束本轮查看"
        choice: "先用自有布样完成一项比较并归册；或请借主同意抄一页，未获答复就不复制"
        immediate: "借册按原样合拢，未看的部分留下问题，不用剪下样片充收藏"
        near: "少看的内容以后重新预约，本次展台改用店铺自有布样"
      far_trigger: "下一季再借时借主仍记得上次是否按时完整归还"
      far_consequence: "如守约可继续借阅；若拖还或损坏，往后须购置自有册并承担成本"
      bindings:
        -
          activity: "试配布料样片"
          place: "洋装裁缝铺"
          pair: 1
        -
          activity: 修补双语书册
          place: 洋馆偏屋
          pair: 0
      exits:
        - "结束本次查看按期送还借册"
        - "放弃复制请求，仅保留本人已写的用途感受"
    试衣间帘后半分钟:
      source: "样衣背后的拉链差半寸够不着，帘子只拉了一半，铺面还有客人在等这件成衣，帘杆上的旧痕一道压着一道。"
      engines:
        - "共处密闭"
        - "表面体面破裂"
      beats:
        trigger: "{npc}穿着样衣站在帘内，背后拉链差半寸够不着，帘子只拉了一半。"
        objective: "把这半分钟停在帘内，让成衣交得出去而铺面看不出发生过什么"
        choice: "可进去替她拉上拉链；可只把手伸进帘里递长柄钩；或退出帘外去叫裁缝"
        immediate: "拉链拉好帘子合上，外头等货的客人只听见帘杆响了一声"
        near: "铺里记的是帘子拉了几寸不是谁进去了，成衣交件前她还进不进去由她自己说"
      far_trigger: "交件那日有人拿帘杆上的痕说这批成衣不合身"
      far_consequence: "成衣按返工处理，两人此后在铺里只谈尺寸不谈别的，帘杆上的旧痕被掌柜换了新杆。"
      bindings:
        -
          activity: "替她拉上背后拉链"
          place: "洋装裁缝铺"
          pair: 1
      exits:
        - "把样衣交回裁缝，退出试衣间回铺面"
        - "当日不再进铺，改约下一件成衣的试穿"
    礼数破在席上:
      source: "香席上她按馆主安排的顺序试闻，第三道香材的别名她随口说错了一处，席上另两位客人都听见了。"
      engines:
        - "表面体面破裂"
        - "名声保卫"
      beats:
        trigger: "{npc}在香席上把第三道香材的别名说错了一处，另两位客人都听见了。"
        objective: "在离席之前把这一处说法补回去，又不把人压过馆主"
        choice: "可当场把别称的正确出处讲清；可替她圆一句说是地方叫法不同；或什么也不说让她自己收"
        immediate: "席上仍按馆主的顺序走完，错的那一处当场补了一句解释"
        near: "解释补得上就说这一席到此为止，补不上这名字会跟着她走进下一场生意"
      far_trigger: "下一席上馆主仍沿用她那一处错说的名字"
      far_consequence: "馆主按旧例改用另一组别称，她在此后各家的香席上都被排到末座，译名生意要一段时日才回得来。"
      bindings:
        -
          activity: "交流香材别称"
          place: "香道馆"
          pair: 1
      exits:
        - "交回手边器物后从席侧门退出"
        - "提前说明离席，把余下的闻香让给别人"
    译稿署名两难:
      source: "出版方要在这册译本扉页只署一个人名，署名的人担下全部误译，不署名的那一半稿子是铺里替她校出来的。"
      engines:
        - "名分悬置"
        - "信任透支"
      beats:
        trigger: "{npc}说出版方要在这册译本扉页只署一个人名。"
        objective: "在付印之前定下署谁的名、误译由谁担"
        choice: "可署自己的名并担下全稿；可署她的名但把校样另存一份；或请出版方改成两人并列"
        immediate: "扉页上的名字当场未定，稿子上两人改动的笔迹各自分明"
        near: "名字定下就不能再改印，误译找上门时只认扉页那一个，另一人的笔迹留在校样上作凭"
