id: mat-cdd67109e5e555db92c6d982ca09f3ed
name: 千禧网络街坊
material:
  eras:
  - 千禧年前后
  aesthetics:
  - 旧年代质感
  - 恋爱轻喜
  - 亚文化地下物语
  rule: 拨号网络、纸质地址簿和线下聚会并存，网上认识的人逐渐走进街区；版务记录与本地备份只作核对用，认下一个网名对到哪张脸之前必须由本人点头。
  social_rule: 网名是否对应真实姓名由本人决定，公开作品须注明作者；纸面留下的地址与尺寸比网页更难收回，写下去就是有人能照着找上门。
  places:
    工作室:
      details:
      - 显像管屏幕旁压着软盘标签·夜
      - 拨号线暂时拔下的桌面电脑·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 工作室门外公共楼道
        witnesses:
        - 同班维护员
        affordances:
        - 校对个人主页
        - 结束活动并离开
        pressure_modifiers:
        - 电话线占用
        - 软盘可读情况
    桌游店:
      details:
      - 棋具货架旁拼着一桌纸卡·傍晚
      - 柜台写着按时收店的小黑板·傍晚
      profile:
        privacy: low
        visibility: high
        exits:
        - 临街店门
        witnesses:
        - 店主
        - 等待下一局的成年玩家
        affordances:
        - 试跑聚会小游戏
        - 结束活动并离开
        pressure_modifiers:
        - 空桌数量
        - 每局时长
    列车车厢:
      details:
      - 折叠小桌压着无地址明信片·日间
      - 窗外站牌一闪而过·日间
      profile:
        privacy: low
        visibility: high
        exits:
        - 可先结束谈话回座
        - 仅在列车停靠开放的站台下车
        witnesses:
        - 邻座旅客
        - 乘务员
        affordances:
        - 交换沿途明信片
        - 结束活动并离开
        pressure_modifiers:
        - 停站时间
        - 车厢广播
    旧书店:
      details:
      - 旧书架边的长桌铺着纸刊样张·午后
      - 装订夹收在借用木盒里·午后
      profile:
        privacy: low
        visibility: high
        exits:
        - 书店前门
        witnesses:
        - 店主
        - 翻阅样刊的读者
        affordances:
        - 装订街坊小刊
        - 结束活动并离开
        pressure_modifiers:
        - 纸张余量
        - 借桌结束时间
    打烊后的面包店:
      details:
      - 卷帘门只落下半截，柜台灯还亮着最后一盘没卖完的吐司·夜
      - 收银机旁压着当天的进货单与一张手写的欠条·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从半截卷帘门下的侧身空档退出临街
        witnesses:
        - 守店清账的成年店主
        affordances:
        - 清点当天没卖完的存货
        - 核对进货单与赊账记录
        pressure_modifiers:
        - 清账剩下的时间
        - 赊账催不催的态度差
    深夜机场候机区:
      details:
      - 一排连座椅背着落地窗，显示屏上迟到的航班滚动重排·深夜
      - 座位扶手上压着一张写了两地的登机牌与一只没喝完的纸杯·深夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿登机口通道登机，或经到达口出站离开
        witnesses:
        - 同班候机的旅客与值守的地勤
        affordances:
        - 核对改签后的航班与座位
        - 在登机前把手里的东西交接清楚
        pressure_modifiers:
        - 航班改签与登机截止时刻
        - 公开场合里说不出口的话
    老茶馆靠窗的隔间:
      details:
      - 竹帘半卷的隔间里摆着两副盖碗，茶续到第二道·黄昏
      - 桌角压着一张写了一半的地址，旁边是没拨完的号码·黄昏
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 放下茶钱穿过堂面从临街的门离开
        witnesses:
        - 堂面的跑堂与隔间外就坐的茶客
        affordances:
        - 续一道茶把话说完
        - 把写了一半的地址当面交出去
        pressure_modifiers:
        - 堂面收档的时刻
        - 隔间只隔一层竹帘
    旗袍店量体间:
      details:
      - 三面立镜围出一小块地方，皮尺挂在镜前的挂钩上·下午
      - 衣架上只挂着改到一半的一件，别针别在肩线上·下午
      profile:
        privacy: high
        visibility: low
        exits:
        - 换回自己的衣服后经店面正门离开
        witnesses:
        - 当家的成年裁剪师傅
        affordances:
        - 量一次身并把尺寸记进本子
        - 试一次改到一半的样衣
        pressure_modifiers:
        - 交件日期与剩下的工序
        - 量体时需要贴着站的距离
  pairs:
  - family: 学术与专业
    position: 初次见面的网友
    appellations:
    - 直呼其名
    npc:
      role: 社区网站维护员
      function: 维护静态主页与作者上传文件
      authority: 可修改本站文件并撤下自己维护的页面
      resource: 本地网页备份、拨号账号和上传目录
      limitation: 不能删除别人保存的副本，也不能由网名推断实名
      obligation: 发布前核对作者许可与链接，保留本地可回退版
      exposure: 错传实名或漏署名会让作者不再投稿
      hidden: —
    player:
      identity: 独立刊物编辑
      baseline: 你为网站提供过纸刊的作者署名回执，维护员因此请你一起核对离线副本。
      resources:
      - 纸刊校样
      - 作者愿意公开的署名回执
      reputation: 你能认出错署的作者，不替人决定用真名
    relationship_reason: 你为网站提供过纸刊的作者署名回执，维护员因此请你一起核对离线副本。
  - family: 艺术与传播
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 独立刊物编辑
      function: 编辑小刊并召集线下试读与纸卡试局
      authority: 决定自己小刊的选稿和已预约桌位的活动顺序
      resource: 样刊、纸卡原型与印刷店报价
      limitation: 不能承诺所有网友到场，纸质通知发出后难以即时收回
      obligation: 明确投稿用途，参与游戏不等于加入编刊
      exposure: 装订积压占自己的纸钱，失约会损失借桌关系
      hidden: —
    player:
      identity: 社区网站维护员
      baseline: 你们先在论坛聊过纸卡设计，编辑借到桌位后邀请你首次在线下试玩，双方仍可只用网名。
      resources:
      - 可离线演示的网页备份
      - 自己的电话联系时间
      reputation: 网上往来已久，线下合作仍待这一局相处
    relationship_reason: 你们先在论坛聊过纸卡设计，编辑借到桌位后邀请你首次在线下试玩，双方仍可只用网名。
  - family: 艺术与传播
    position: 同人社团原案脚本师
    appellations:
    - 直呼其名
    npc:
      role: 社区网站维护员
      function: 维护静态主页与论坛版务记录，替街坊保管各自的上传副本
      authority: 能改本站文件并撤下自己维护的页面，不能由网名推断任何人的实名
      resource: 版务操作记录、拨号账号与本地网页备份
      limitation: 删不掉别人手上已经拷走的副本，也压不住一次说出口的旧事
      obligation: 发布前核对授权与署名，保留可回退的本地版本
      exposure: 错把马甲对上一个实名，街坊会先失去在这里说话的胆子
      hidden: —
    player:
      identity: 同人社团原案脚本师
      baseline: 你为社团写的原案在论坛上小有名气，维护员替你开过一个连载页；你们从网友处到在街角见过面，都还留着各自的网名。
      resources:
      - 原案分镜本与改稿记录
      - 论坛连载页的编辑权限备份
      reputation: 答应过的连载一定写完，也不把人家的网名往外说
    relationship_reason: 你为社团写的原案在论坛上小有名气，维护员替你开过一个连载页；你们从网友处到在街角见过面，都还留着各自的网名。
  - family: 服务与手艺
    position: 服务提供者
    appellations:
    - 店长
    - 师傅
    npc:
      role: 旗袍店当家裁剪师傅
      function: 量体裁衣，按客人自己的意思改版不动客人的身形评断
      authority: 能定自己的交件顺序，不能替客人决定这一件做给谁
      resource: 量体记录、改到一半的样衣与一份排到月末的交件单
      limitation: 手上只剩这几匹料，赶不出一件就是赶不出来
      obligation: 量体时说明每一处改动，弄坏的料自己赔
      exposure: 误了交件日会失掉老顾客，传出去就没人再拿好料上门
      hidden: —
    player:
      identity: 受托整理量体记录的簿记员
      baseline: 你来店里替师傅把一叠手写尺寸誊进新本子，顺带学会了哪一处尺寸不能让外人看；最后这一单压着月末的交件日
      resources:
      - 誊清的尺寸本与旧记录
      - 自己核对过的交件排期
      reputation: 记数不出错，也从不把客人的尺寸说给下一位
    relationship_reason: 你来店里替师傅把一叠手写尺寸誊进新本子，顺带学会了哪一处尺寸不能让外人看；最后这一单压着月末的交件日
  activities:
    校对个人主页:
      places:
      - 工作室
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}在断线的电脑上打开个人主页副本，请你逐个试点手绘导航。'
      beats:
        trigger: '{npc}在断线的电脑上打开个人主页副本，请你逐个试点手绘导航。'
        objective: 找到不能离线打开的链接与错误署名
        choice: 试点一栏，或只对照纸稿读文字；不愿操作可请维护员演示
        immediate: 坏链接与图片缺失被区分，修正先留在本地副本。
        near: 下次拨号只上传确认过的文件，作者仍可要求保留网名，不把本地校对自动变成发布。
    试跑聚会小游戏:
      places:
      - 桌游店
      pairs:
      - 1
      category: 日常接触
      action: '{npc}在小店拼出纸卡试局，问你想当玩家还是看一轮再加入。'
      beats:
        trigger: '{npc}在小店拼出纸卡试局，问你想当玩家还是看一轮再加入。'
        objective: 用一轮短局找出大家喜欢的节奏
        choice: 玩一轮，或做旁观者提醒回合；不爱竞赛可试合作规则
        immediate: 一局的等待长度和争议规则被实际体验，不以输赢判断谁更适合聚会。
        near: 选定短局或合作版供下次自愿参加，退出者仍可留店聊天。
    交换沿途明信片:
      places:
      - 列车车厢
      pairs:
      - 0
      category: 信息交换
      action: '{npc}把一张没写地址的明信片推来，讲起窗外这一站，问你记住了哪一幕。'
      beats:
        trigger: '{npc}把一张没写地址的明信片推来，讲起窗外这一站，问你记住了哪一幕。'
        objective: 交换一段不必上网的沿途见闻
        choice: 交换一张卡，或口头讲故事；不留地址也可收好自己的卡
        immediate: 卡片是否互赠由各自决定，故事不会自动登上社区网站。
        near: 到站后各走各的行程，只有双方都同意才邮寄后续明信片。
    装订街坊小刊:
      places:
      - 旧书店
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}把已核对页码的样张和钝头装订夹摆好，请你试合一册看能否摊开。'
      beats:
        trigger: '{npc}把已核对页码的样张和钝头装订夹摆好，请你试合一册看能否摊开。'
        objective: 做出可修换内页的小刊样本
        choice: 折一叠样张，或只帮压平书脊；不动手可挑纸色
        immediate: 形成一册能翻阅的样本，过厚处改为分册，不再只停留在页码核对。
        near: 样本留书店试读，其余按实际借阅反馈少量装订，不一次耗光纸张。
    对一遍两个网名下的旧帖:
      places:
      - 工作室
      pairs:
      - 2
      category: 调查与核验
      action: '{npc}把版务记录和一份本地备份摊在断线的电脑旁，请你自己认哪些帖子出自同一个人的两个网名。'
      beats:
        trigger: '{npc}把版务记录和一份本地备份摊在断线的电脑旁，请你自己认哪些帖子出自同一个人的两个网名。'
        objective: 在不把网名对到实名的前提下，分清哪些旧帖需要一起更正
        choice: 只对发帖时间与用词，或让维护员念操作记录，也可以就此打住不再往下认
        immediate: 对上的一列只写在本地纸上，连线之前不进任何公开页面。
        near: 要更正哪几篇由本人点头才算数，维护员不替人认领连载。
    盘一趟当天的存货:
      places:
      - 打烊后的面包店
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}把最后一盘没卖完的吐司和进货单一起推过来，请你拿主意哪些明天还能上架。'
      beats:
        trigger: '{npc}把最后一盘没卖完的吐司和进货单一起推过来，请你拿主意哪些明天还能上架。'
        objective: 把当天的损耗记清楚，别让赊出去的账烂在抽屉里
        choice: 清一遍存货，或只核进货单，也可以就此收盘各自回家
        immediate: 该扔的分开摆，能留的记上日期，账目先写在自己的本子上。
        near: 明天按实际卖掉的量定进货，赊出去的账由店主自己开口去要。
    登机前把话说完:
      places:
      - 深夜机场候机区
      pairs:
      - 0
      category: 身体靠近
      action: '{npc}盯着重排的航班屏，把手里的纸杯捏扁了，问你在登机口关掉之前还有没有要说的。'
      beats:
        trigger: '{npc}盯着重排的航班屏，把手里的纸杯捏扁了，问你在登机口关掉之前还有没有要说的。'
        objective: 在登机广播把人叫走之前，把话说完或者干脆不说
        choice: 接住这句话，或只核一遍改签后的座位，也可以提前去登机口
        immediate: 话说出口就没有收回去的余地，广播照旧在催。
        near: 分开以后各走各的行程，要不要再联系由两个人各自决定。
    续一道茶把地址交出去:
      places:
      - 老茶馆靠窗的隔间
      pairs:
      - 0
      category: 信息交换
      action: '{npc}把写了一半的地址压在茶碗底下，说到第二道茶就凉了，问你还记不记得这地方怎么走。'
      beats:
        trigger: '{npc}把写了一半的地址压在茶碗底下，说到第二道茶就凉了，问你还记不记得这地方怎么走。'
        objective: 在堂面收档之前，把地址是留给自己还是交出去决定下来
        choice: 补完这张地址，或只把话说完不落纸，也可以结了茶钱先走
        immediate: 纸留在桌上就意味着有人能找得到门，竹帘外面照旧有人走动。
        near: 跑堂收档前那张纸还在，去不去由收下的人自己判断。
    量一次身把尺寸记下来:
      places:
      - 旗袍店量体间
      pairs:
      - 3
      category: 身体靠近
      action: '{npc}把皮尺从挂钩上取下来，让你背对着三面立镜站稳，说要量的是肩到腰那一段。'
      beats:
        trigger: '{npc}把皮尺从挂钩上取下来，让你背对着三面立镜站稳，说要量的是肩到腰那一段。'
        objective: 把这一段尺寸量准，也不让这一页记到别人的名字底下
        choice: 站着让她量，或自己按着尺子报数，也可以换回衣服只交旧尺寸
        immediate: 尺子贴到身上的地方会留一会儿印子，本子上只写数字不写别的。
        near: 交件日之前还要再试一次样衣，量出的这段只用来改这一件。
  customs:
  - 线下聚会先让来客自己写下希望被称呼的名字。
  pressures:
    网站署名遗漏:
      source: 转载页面漏掉了原作者名字
      engines:
      - 名声保卫
      - 信任透支
      beats:
        trigger: '{npc}收到消息：转载页面漏掉了原作者名字。'
        objective: 补全署名并核实转载授权
        choice: 联系作者确认，或先撤下该页
        immediate: 转载页先撤下，其他主页照常访问，缺署名不能靠随意补一个真名解决。
        near: 作者确认网名、用途与是否重发；纸刊未印部分同步更正，已送出的仅通知持有人。
      far_trigger: 作者收到下一次转载邀请时
      far_consequence: 说明清楚可换回单次许可；若作者拒绝，网站保留撤页，不再引用该作。
      exits:
      - 把自己保存的授权回执交作者后退出
      - 撤下本人供稿，不参与网站其余维护
      bindings:
      - activity: 校对个人主页
        place: 工作室
        pair: 0
      - activity: 装订街坊小刊
        place: 旧书店
        pair: 1
    聚会地址版本冲突:
      source: 纸质通知与网页写了不同的聚会地点
      engines:
      - 消息误发
      - 信任透支
      beats:
        trigger: '{npc}收到消息：纸质通知与网页写了不同的聚会地点。'
        objective: 让已出发的人收到一致的地址
        choice: 逐一电话通知，或安排两处接应
        immediate: 已经在路上的来客不能靠改网页及时得知，试局先缩成可随时加入的短局。
        near: 用固定电话联系能接通的人，其余由自愿且有时间的人在两处店门接应。
      far_trigger: 下一次纸质邀请寄出前
      far_consequence: 通知加入最后确认电话与截止改址时间，不能以提高网页更新频率代替线下联络。
      exits:
      - 只守自己已在的一处到约定时刻，然后离开
      - 不做接应，向主办者交回能联系的名单
      bindings:
      - activity: 试跑聚会小游戏
        place: 桌游店
        pair: 1
    两个网名原来是同一个人:
      source: 版务记录里两个常年对骂的网名出自同一台机器
      engines:
      - 双重马甲互掉现场
      - 秘密暴露倒计时
      beats:
        trigger: '{npc}在版务记录里发现两个常年对骂的网名出自同一台机器。'
        objective: 在有人自己认领之前，决定这页记录给谁看
        choice: 先按发帖时间数清两条线，或直接把这一页压下来
        immediate: 记录只留在本地备份里，网站前台照旧显示两个互不相干的网名。
        near: 两边都还没察觉，见面时谁先开口谁就先失去这层遮掩。
      far_trigger: 下一次线下聚会两个网名同时到场
      far_consequence: 当众对上号会让其中一人再不来论坛；私下讲明则可能连原案一起停更。
      exits:
      - 把本地备份里涉及的那几页交给本人后退出维护
      - 停掉连载页，不再替任何人保管上传记录
      bindings:
      - activity: 对一遍两个网名下的旧帖
        place: 工作室
        pair: 2
    赊出去的账到月底要还:
      source: 柜底那张手写欠条上的金额按天往上加，月底是最后一天
      engines:
      - 债务压力
      - 时限逼近
      beats:
        trigger: '{npc}翻出柜底那张手写欠条，说金额按天往上加，月底是最后一天。'
        objective: 在月底之前把还不上还是先开口说清楚定下来
        choice: 当天把能卖的折价清出去，或先去问对方能不能宽几天
        immediate: 折价卖掉的这一盘算进了当天的流水，欠条还在柜里压着。
        near: 隔天来的人会先看货架再看人，话说不清楚下回就没人肯赊。
      far_trigger: 月底那天钱仍然凑不齐
      far_consequence: 抵押的就是这间铺子的续租，押金一交不上就得关门；先讲明则可谈按月分。
      exits:
      - 把铺子盘给别人，欠条当场结清走人
      - 退还对方预付的订金，只做现钱买卖
      bindings:
      - activity: 盘一趟当天的存货
        place: 打烊后的面包店
        pair: 1
    广播里念到了这一班:
      source: 航班临时改签，登机广播把两个人最后能说的话压到几分钟
      engines:
      - 迁居倒计时
      - 天亮失效
      beats:
        trigger: '{npc}听到广播里念到了这一班，改签后的登机时间把话压到只剩几分钟。'
        objective: 在闸口关掉之前把异地这件事做个了断
        choice: 当场说清走不走，或先把行李办托运再回来站着
        immediate: 登机牌捏在手里，闸口关掉之前人还站在这里，旁边全是等同一班的旅客。
        near: 这一次分开以后，下一趟来回要隔多久谁都说不准。
      far_trigger: 这一班起飞以后仍然没有人先联系
      far_consequence: 默认就是不再回来，房子、钥匙和留下的东西都归一个人处理。
      exits:
      - 改签下一班留一晚，第二天再决定
      - 照原计划登机，把没说的话留在机场
      bindings:
      - activity: 登机前把话说完
        place: 深夜机场候机区
        pair: 0
      - activity: 交换沿途明信片
        place: 列车车厢
        pair: 0
    地址写了一半:
      source: 写了一半的地址压在茶碗下，堂面收档前不补完就作废
      engines:
      - 梦话泄密
      - 信任透支
      beats:
        trigger: '{npc}把写了一半的地址压在茶碗下，说堂面收档前不补完这张纸就作废。'
        objective: 弄清这张地址是要留着还是交出去
        choice: 把地址补完交给她，或撕掉这半张只把话说完
        immediate: 纸上缺的是门牌那几位，补上去就等于承认有人随时能找上门。
        near: 收档以后跑堂会把桌上清空，这半张纸留不留各看一眼就没了。
      far_trigger: 隔天有人照着这半张地址摸到门口
      far_consequence: 门一开旧事就全回来了，邻里也会把来过的人往外说。
      exits:
      - 结了茶钱就走，不再接这个话头
      - 把地址还给写下的人，自己的去处一个字不提
      bindings:
      - activity: 续一道茶把地址交出去
        place: 老茶馆靠窗的隔间
        pair: 0
    量出来的尺寸被人看见了:
      source: 尺寸本上多了一页没署名的记录，改到一半的样衣还挂在架上
      engines:
      - 秘密暴露倒计时
      - 败犬青梅复仇战
      beats:
        trigger: '{npc}发现尺寸本上多了一页没署名的记录，改到一半的样衣还挂在架上。'
        objective: 在交件日之前查清这一页是谁的、谁看过
        choice: 当面问清这一页的来历，或先把样衣收进柜里
        immediate: 本子上先夹一张空白页盖上，样衣从架上取下来折好。
        near: 街面上已经开始有人打听这件做给谁，交件日一到谁穿谁就被认出来。
      far_trigger: 交件日那天有人守在店门口要看绣的名
      far_consequence: 这一页被读出来，店里的老顾客会先怀疑自己的尺寸也被记过。
      exits:
      - 退掉这一单把料还给客人，尺寸本当众烧掉
      - 把记录交还本人，从此不接不署名的活
      bindings:
      - activity: 量一次身把尺寸记下来
        place: 旗袍店量体间
        pair: 3
