  themes:
  - 网名到面对面称呼的距离
  - 拨号时代的分享与署名
  - 纸刊和网页的不同节奏
  - 同一台机器开出的两个网名
  - 写在纸上的地址收不回来
  technology_boundary: 千禧年前后的桌面浏览器、拨号连接、软盘、固定电话和纸质地址簿并存；聚会在售卖纸牌与棋具的小店进行，不预设当代桌游连锁、智能手机或实时在线定位。面包店赊账记在手写欠条上，机场航班信息走大厅显示屏与广播，地址和量体尺寸只落在纸本上，论坛版务记录为本站操作日志，不能跨站查询或实时推送。
  bridge_status: not_required
