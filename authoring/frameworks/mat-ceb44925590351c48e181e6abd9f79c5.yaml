"id": "mat-ceb44925590351c48e181e6abd9f79c5"
"name": "废土驿站与修补集市"
"material":
  "eras":
    - "废土末世"
  "aesthetics":
    - "废土粗粝"
    - "末日求生纪实"
  "rule": "驿站提供修补、补给和消息交换，废墟以外仍有值得维护的生活习惯；欠下的修件与补给可以按次分期抵偿，但每一期都得当面结清，不许把旧账挪进下一次出发。规矩只对没有退路的人真正生效，明天的份今天不预先定下，伤口一旦当众暴露就等同被队伍弃下。"
  "social_rule": "共同物资要登记来源，交换可以拒绝，不以未知风险强迫同行；入夜后私自开门或对外放声等同替全所引尸，搜刮所得须全数上缴公库再按配给券兑出，券不入私账、不得私下转让。"
