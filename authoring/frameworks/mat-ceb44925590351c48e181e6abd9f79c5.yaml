        "witnesses":
          - "同行路线记录者"
        "affordances":
          - "重认药房外的返站路"
        "pressure_modifiers":
          - "残墙可见状况与最近踏查日期"
    "幸存者地下避难所":
      "details":
        - "地下避难所交换桌上摆着补过的水壶和布包·晚"
      "profile":
        "privacy": "low"
        "visibility": "high"
        "exits":
          - "经居住层内廊回自己铺位，出所按开放安排"
        "witnesses":
          - "交换摊主与借物者"
        "affordances":
          - "试换一件修过的物品"
        "pressure_modifiers":
          - "物品状态与买卖双方需求"
