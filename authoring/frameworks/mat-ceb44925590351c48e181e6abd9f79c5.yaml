      - "废弃搜刮药房"
      - "幸存者地下避难所"
  "themes":
    - "匮乏条件下修到能用就够"
    - "水源见闻与可靠路线的差别"
    - "交换失败仍可保留邻里关系"
  "technology_boundary": "废土保有可拆旧收音机、电池、手工工具和断续广播；电力、备件与可靠路况都有限。药房仅使用已确认的外部通行区，不把残存药品视作可用医疗资源，也无万能净水或自动修复能力。"
  "bridge_status": "not_required"
