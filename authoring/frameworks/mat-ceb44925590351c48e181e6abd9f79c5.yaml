  "aesthetics":
    - "废土粗粝"
    - "末日求生纪实"
  "rule": "驿站提供修补、补给和消息交换，废墟以外仍有值得维护的生活习惯。"
  "social_rule": "共同物资要登记来源，交换可以拒绝，不以未知风险强迫同行。"
  "places":
    "废土驿站":
