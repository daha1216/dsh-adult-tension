  "technology_boundary": "废土保有可拆旧收音机、电池、手工工具和断续广播；电力、备件与可靠路况都有限。药房仅使用已确认的外部通行区，不把残存药品视作可用医疗资源，也无万能净水或自动修复能力。避难所靠防爆闸、液压杆、接头卡钢印与纸质名册维持出入管制，没有电子门禁、即时通信或万能医疗；配给券为纸券，按公库账目核发，不得私下转让。"
  "bridge_status": "not_required"
