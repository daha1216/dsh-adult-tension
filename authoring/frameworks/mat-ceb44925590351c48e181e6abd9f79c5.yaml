        "function": "诊断旧设备并用合适替件恢复有限功能"
        "authority": "可拒修超出能力的设备，不能挪用共用零件"
        "resource": "手工测量工具、拆机备件与修补台"
        "limitation": "修好接收不等于恢复发射，也不能凭外观保证电池寿命"
        "obligation": "交代修复范围并归还未用零件"
        "exposure": "夸大修复会让商旅错过可靠消息"
        "hidden": "—"
      "player":
        "identity": "水源路线记录员"
        "baseline": "你带回的广播接收位置帮他发现收音机本身有问题，他愿教你辨一个可换件"
        "resources":
          - "实走里程、水源见闻册和熟路人联络"
        "reputation": "水源路线记录员，有实走水源册但不声称旧水源如今必可饮用"
      "relationship_reason": "你带回的广播接收位置帮他发现收音机本身有问题，他愿教你辨一个可换件"
    -
      "family": "服务与手艺"
      "position": "同侪"
      "appellations":
        - "直呼其名"
      "npc":
        "role": "水源路线记录员"
        "function": "记录可走道路与水源查验时点"
        "authority": "可撤回自己的路线建议，不批准废墟进入或鉴定药品"
        "resource": "实走里程、水源见闻册和熟路人联络"
        "limitation": "未到过的路不能保证通行，过去查验不能保证今日水质"
        "obligation": "分清实走与转述，及时撤回失效信息"
        "exposure": "错误路标会让补给者多花水和脚程"
        "hidden": "—"
      "player":
        "identity": "驿站工具维修人"
        "baseline": "你曾修回一台能听天气简报的旧机，他邀你复走药房外的短路"
        "resources":
          - "手工测量工具、拆机备件与修补台"
        "reputation": "驿站维修人，有工具但没有废墟勘测或医疗资格"
      "relationship_reason": "你曾修回一台能听天气简报的旧机，他邀你复走药房外的短路"
  "activities":
    "修补旧收音机":
      "places":
        - "废土驿站"
      "pairs":
        - 0
      "category": "照护与修复"
      "action": "{npc}在断电旧机旁递来两个不同尺寸的旋钮，请你挑能稳固装回的一只。"
      "beats":
        "trigger": "{npc}在断电旧机旁递来两个不同尺寸的旋钮，请你挑能稳固装回的一只。"
        "objective": "恢复可靠调谐而不承诺整机如新"
        "choice": "在维修人指导下试装；不接修补收好原件；或只听他说明故障"
        "immediate": "合尺寸旋钮装回并短时试收，仍沙哑的部分如实说明"
        "near": "货主可用现有电池听一段广播，决定是否值得继续修"
    "重认药房外的返站路":
      "places":
        - "废弃搜刮药房"
      "pairs":
        - 1
      "category": "空间与退出"
      "action": "{npc}站在药房外已确认的小路上，请你从路标辨出回驿站的分岔。"
      "beats":
        "trigger": "{npc}站在药房外已确认的小路上，请你从路标辨出回驿站的分岔。"
        "objective": "让来者不为抄近路走入建筑废墟"
        "choice": "从安全外侧辨路；取消踏查回站；或只等熟路者口述"
        "immediate": "失向旧牌经确认后转回正确方向，未走过的近路不推荐"
        "near": "下一趟补给可以选已知较长路线，不被旧地图催去冒险"
    "试换一件修过的物品":
      "places":
        - "幸存者地下避难所"
      "pairs":
        - 0
      "category": "信息交换"
      "action": "{npc}让你试提补过的水壶，问愿用什么闲置物交换，或只是看看。"
      "beats":
        "trigger": "{npc}让你试提补过的水壶，问愿用什么闲置物交换，或只是看看。"
        "objective": "让需求与缺陷都影响一次自愿交换"
        "choice": "试用后提出条件；拒绝交易收回自物；或约定短期借用而非互换"
        "immediate": "交换成则双方各得所需，不成则物归原主，修补处当面可见"
        "near": "邻摊可以继续往来，不因一次拒绝生成债务"
  "customs":
    - "交换摊把修过的地方做成明显记号，让接手的人看得见。"
  "pressures":
    "补给路线改道":
      "source": "常用路线因坍塌不再通行"
      "engines":
        - "资源锁定"
        - "时限逼近"
      "beats":
        "trigger": "{npc}收到消息：常用路线因坍塌不再通行。"
        "objective": "确认替代路线再安排补给"
        "choice": "询问近期过路者，或延期出发"
        "immediate": "通向旧补给线的分岔被标为不推荐，今天的短路辨认可就此结束。"
        "near": "记录员找最近实走者确认长线耗水，维修人不拿自己设备抵押未知路况。"
      "far_trigger": "下一轮补给出发前仍没有可信的替代路线"
      "far_consequence": "驿站可缩小集市供应或延后补给，库存损失真实存在，但不强迫两人先行探路。"
      "exits":
        - "延期本次补给，原路返回驿站"
        - "改向已有通行证明的邻站订少量货，放弃原短线"
      "bindings":
        -
          "activity": "重认药房外的返站路"
          "place": "废弃搜刮药房"
          "pair": 1
    "公共工具缺件":
      "source": "共用工具箱缺少约定归还的零件"
      "engines":
        - "资源锁定"
        - "信任透支"
      "beats":
        "trigger": "{npc}收到消息：共用工具箱缺少约定归还的零件。"
        "objective": "查清借用记录并协调修补"
        "choice": "联系借用者，或寻找可用替件"
        "immediate": "缺的共用接头不被算成机器故障，先停下依赖它的试收，旋钮修补仍可单独完成。"
        "near": "维修人联系借用者或找尺寸合适替件，不能用其他货主的零件先顶着不说。"
      "far_trigger": "下一个借用周期接头仍不归还且无人说明去向"
      "far_consequence": "该工具组暂停外借，愿意承担替件成本的人可另议补齐，不追收无关居民资源。"
      "exits":
        - "只完成机械旋钮修补，电子测试改期"
        - "归还货主所有原件并结清已经同意的工时，取消余下维修"
      "bindings":
        -
          "activity": "修补旧收音机"
          "place": "废土驿站"
          "pair": 0
