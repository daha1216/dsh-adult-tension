      "places":
        - "大学钢琴练习室"
      "pairs":
        - 1
      "category": "信息交换"
      "action": "{npc}在钢琴上弹出同一乐句的两种停顿，请你试着给出进入下一句的手势。"
      "beats":
        "trigger": "{npc}在钢琴上弹出同一乐句的两种停顿，请你试着给出进入下一句的手势。"
        "objective": "学会在一段合奏中互相等候"
        "choice": "试一次提示；不演奏改旁听；或只用拍手练节拍"
        "immediate": "两人找到一个都能接住的速度，错拍处停下重来"
        "near": "下一次排练可从这段开始，未参加者没有上台义务"
    "整理展览注释":
      "places":
        - "24小时自习室"
      "pairs":
        - 0
      "category": "调查与核验"
      "action": "{npc}用纸签指向两个不同出处，请你静默核对作品年份。"
      "beats":
        "trigger": "{npc}用纸签指向两个不同出处，请你静默核对作品年份。"
        "objective": "分清一手出处与后人转引"
        "choice": "核对原页；不参与继续自习；或把缺页项留待图书馆查询"
        "immediate": "一条转引改回原出处，缺证注释不定稿"
        "near": "作者收到的是具体疑问，无需重写整篇说明"
    "试走道具交接":
      "places":
        - "剧院后台"
      "pairs":
        - 1
      "category": "第三方与打断"
      "action": "{npc}请舞台监督在场，邀你试把空道具车从侧幕推到指定回位。"
      "beats":
        "trigger": "{npc}请舞台监督在场，邀你试把空道具车从侧幕推到指定回位。"
        "objective": "确认谁在换场时实际接车"
        "choice": "试推并交接；不进后台退到前厅；或请正式道具员示范"
        "immediate": "交接点被挪到不挡出场的位置，正式演出由岗位人员接手"
        "near": "下次排练减少追找道具车，不增加临时演员职责"
    "排布成年创作者作品":
      "places":
        - "画廊"
      "pairs":
        - 0
      "category": "空间与退出"
      "action": "{npc}请你坐下再站起，比较两种挂画高度。"
      "beats":
        "trigger": "{npc}请你坐下再站起，比较两种挂画高度。"
        "objective": "让展线兼顾坐姿与站姿观看"
        "choice": "试调缩图；不参与布展；或请另一位作者走线"
        "immediate": "高低作品交错，入口不再堆成一堵墙"
        "near": "可按作品实际尺寸安装，不必为整齐删掉异形画"
    "筹备预约室内音乐会":
      "places":
        - "豪门庄园顶楼琴房"
      "pairs":
        - 1
      "category": "日常接触"
      "action": "{npc}在主人同意的时段弹一个短段，问你愿坐近听还是留在门边。"
      "beats":
        "trigger": "{npc}在主人同意的时段弹一个短段，问你愿坐近听还是留在门边。"
        "objective": "找到小型音乐会舒适的听众距离"
        "choice": "坐下听；婉拒入席；或只帮试一排椅子就走"
        "immediate": "座位不再逼近琴凳，听者可在段落间离开"
        "near": "主人可按实际舒适容量决定是否再邀请"
  "customs":
    - "留言簿允许只画图，不要求观众点评或留下姓名。"
  "pressures":
    "演出授权范围变化":
      "source": "一位作者不同意原定的网络直播"
      "engines":
        - "信任透支"
        - "名声保卫"
      "beats":
        "trigger": "{npc}收到消息：一位作者不同意原定的网络直播。"
        "objective": "调整节目公开范围并通知协作者"
        "choice": "取消该段直播，或另选已获授权的作品"
        "immediate": "该段切断直播输出，现场试奏是否继续另问作者，不以已排练要求授权。"
        "near": "演奏者重新选择只现场或换曲，技术人员据此分段。"
      "far_trigger": "未经同意的试奏录屏仍进入艺术季宣传"
      "far_consequence": "作者可撤回该作品，召集人需撤素材并失去部分后续合作。"
      "exits":
        - "保留仅现场排练，取消该段直播"
        - "撤下该曲，由自愿者换入已授权节目"
