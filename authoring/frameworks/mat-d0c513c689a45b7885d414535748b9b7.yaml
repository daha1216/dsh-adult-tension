      - 退出这台演出，把检查记录交安保存档
      - 只保留不上机关的段落，其余环节取消
      bindings:
      - activity: 复核舞台机关固定件
        place: 剧院后台
        pair: 4
      - activity: 陪她站完术后第一次露面
        place: 剧院后台
        pair: 7
    清盘倒计时仅剩今夜:
      source: 赞助方通知这一季之后不再续约，明天上午即清场
      engines:
      - 时限逼近
      - 债务压力
      beats:
        trigger: '{npc}收到消息：赞助方通知这一季之后不再续约，明天上午即清场。'
        objective: 在清场前把作品归还与未结款项分清楚
        choice: 连夜清点归还；只结已确认的部分；或把争议项留到书面交涉
        immediate: 未结的工时按已确认部分先结，作品贴上归属签当晚归还，不扣押他人作品抵账。
        near: 召集人可另寻场地分期展，费用谁承担当场说清，不把清盘压力转给作者。
      far_trigger: 明早清场开始仍有作品无人认领
      far_consequence: 无人认领的作品入仓封存，仓储费用由发起方承担；拖欠的名声会直接影响下一季招募。
      exits:
      - 交还全部代管作品后退出这次筹展
      - 只带走自己的东西，不参与余下账目
      bindings:
      - activity: 核对阶段性评审稿
        place: 成年校友会散场后的活动室
        pair: 0
      - activity: 在新刊截稿前夜挑一张原片
        place: 直播平台危机会议室
        pair: 8
    同人展截稿死线:
      source: 同人展的送印截稿只剩这一夜，社团还差最后两页
      engines:
      - 时限逼近
      - 情感拉扯
      beats:
        trigger: '{npc}收到消息：同人展的送印截稿只剩这一夜，社团还差最后两页。'
        objective: 在不替人挂名的前提下决定交什么
        choice: 各自补自己那页；只装订不等稿；或直接申请延期
        immediate: 能交的页先定稿，赶不完的当场砍掉，署名栏分开写，不找人代笔。
        near: 摊位按实际交出的内容申请，同社团下届仍先说来不来，不结成帮派式的绑票。
      far_trigger: 送印店开门前仍缺页且无人说明
      far_consequence: 这届开天窗，社团失去下届优先摊位；如实延期则只损失本次宣传位。
      exits:
      - 退出这次赶稿，把已画部分带走
      - 只交出自己署名的那几页，余下不认
      bindings:
      - activity: 在洗衣房等一筒衣烘完
        place: 24小时自助洗衣房
        pair: 10
      - activity: 分一半通宵赶最后两页
        place: 24小时自助洗衣房
        pair: 9
    戒酒周年夜:
      source: 戒酒满一周年的那一夜，同行的人把酒端到了她面前
      engines:
      - 成瘾戒断
      - 共处密闭
      beats:
        trigger: '{npc}收到消息：戒酒满一周年的那一夜，同行的人把酒端到了她面前。'
        objective: 在不替她决定的前提下把这一夜陪完
        choice: 替她把酒撤走；只坐着不劝也不拦；或提前送她离场
        immediate: 酒不留在桌上，去留由她自己说，不替她宣告戒酒成功或失败。
        near: 第二天仍按她的节奏安排工作，把这一夜当作过程而不是战绩。
      far_trigger: 下一次公开场合再次出现劝酒
      far_consequence: 她可能退出需要应酬的场次，合作范围随之缩小；事先划清场合则能保住露面机会。
      exits:
      - 送她到门口后各自回家，不再多问
      - 把当天的安排全部取消，改成白天见面
      bindings:
      - activity: 送她回住处的一段夜路
        place: 通宵大排档
        pair: 5
      - activity: 给新作者排一次试展
        place: 打烊面包店
        pair: 6
