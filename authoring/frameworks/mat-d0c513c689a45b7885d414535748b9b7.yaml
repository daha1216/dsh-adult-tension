        "near": "召集人与管理员商量分期，作者可取回作品而不被算作失约。"
      "far_trigger": "替代展期与作者返城日期重叠"
      "far_consequence": "作品改用缩图或撤展，不能以校友关系要求延长借期。"
      "exits":
