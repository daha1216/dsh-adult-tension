id: mat-d0c513c689a45b7885d414535748b9b7
name: 成年创作者与校园艺术季
material:
  eras:
  - 当代都市
  aesthetics:
  - 学园夏夜恋爱
  - 恋爱轻喜
  - 夏日进修季夜谈
  rule: 面向成年在校生、校友与社会创作者的艺术季把校园公共空间开放给共同创作；同场共事的关系不得借展序、借场或赞助公开对号，任何署名与公开范围都须逐条取得本人书面授权。
  social_rule: 所有参与角色明确成年，场地与作品公开范围需分别取得授权；成年参与者与导师在非公开时段的单独相处须登记事由，未登记的私密独处一律视为违规联络。
  places:
    成年校友会散场后的活动室:
      details:
      - 校友会散场后的长桌留着签到牌和分格收纳箱·夜
      - 墙面软木板上钉着次日评审的匿名稿号·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经活动室侧门回校园主路的熄灯区
        witnesses:
        - 成年校友会值守者
        affordances:
        - 核对阶段性评审稿
        - 对照匿名稿号在软木板上留一条待议标注
        pressure_modifiers:
        - 熄灯时限与次日评审顺序
    学园祭打烊后的活动室:
      details:
      - 收摊彩带旁留出次日展板的地面线·晚
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经活动室门回校园主路
        witnesses:
        - 成年校友值班者
        affordances:
        - 设计校友展览
        pressure_modifiers:
        - 借场结束与展板占地
    大学钢琴练习室:
      details:
      - 琴凳旁一盏谱灯照着铅笔指法·晚
      profile:
        privacy: medium
        visibility: low
        exits:
        - 推门经隔音走廊回楼梯
        witnesses:
        - 预约交接的成年练琴者
        affordances:
        - 编排公开试奏
        pressure_modifiers:
        - 练琴时段与隔音条件
    24小时自习室:
      details:
      - 静音区靠墙桌上摊着页签参考书·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿无声通道到楼外，不在静音区谈话
        witnesses:
        - 同区成年读者
        affordances:
        - 整理展览注释
        pressure_modifiers:
        - 静音要求与个人专注时间
    剧院后台:
      details:
      - 舞台侧幕后的道具车贴着回位轮廓·排练后
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经工作人员侧门到剧院前厅
        witnesses:
        - 舞台监督
        affordances:
        - 试走道具交接
        - 复核舞台机关固定件
        - 陪她站完术后第一次露面
        pressure_modifiers:
        - 换场空隙与通道占用
    画廊:
      details:
      - 展墙前的缩图在磁性板上留着空格·午
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿展线回画廊入口
        witnesses:
        - 参展成年作者
        affordances:
        - 排布成年创作者作品
        pressure_modifiers:
        - 墙面尺寸与观看距离
    豪门庄园顶楼琴房:
      details:
      - 受邀开放的顶楼琴房摆着折叠听众椅·暮
      profile:
        privacy: high
        visibility: low
        exits:
        - 经主人开放的楼梯到玄关，不进入卧室区
        witnesses:
        - 庄园主人与成年演奏者
        affordances:
        - 筹备预约室内音乐会
        pressure_modifiers:
        - 座椅容量和受邀时段
    打烊后的买手店:
      details:
      - 卷帘门半落，试装镜前留着没拆的吊牌和别针·夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 从侧门经后巷离开，不走正门卷帘
        witnesses:
        - 闭店盘点的成年店员
        affordances:
        - 试装锁门后的取件
        - 在锁门的更衣间里试装
        - 替你拉上背后的拉链
        - 送她回住处的一段夜路
        pressure_modifiers:
        - 闭店盘点时段与门外巷口动静
    24小时自习室静音包厢:
      details:
      - 包厢门上的预约灯显示剩余分钟数，桌上摊着注释校样·深夜
      profile:
        privacy: high
        visibility: low
        exits:
        - 沿无声通道到楼外，不在静音区谈话
        witnesses:
        - 隔间隔板后的成年读者
        affordances:
        - 并排核一份注释校样
        pressure_modifiers:
        - 包厢预约剩余时长与静音要求
    直播平台危机会议室:
      details:
      - 投屏停在待撤素材缩略图，桌上摊着授权清单·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经前台刷卡闸机回写字楼大堂
        witnesses:
        - 值班公关与法务
        affordances:
        - 在新刊截稿前夜挑一张原片
        - 逐条比对素材授权范围
        pressure_modifiers:
        - 热搜窗口期与撤稿回执时限
    打烊面包店:
      details:
      - 收摊后的托盘还留着当天没卖完的两盘面包·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从后厨侧门经小巷离开，不重开正门
        witnesses:
        - 打烊盘点的成年店员
        affordances:
        - 给新作者排一次试展
        - 把没卖完的面包分给同行的人
        pressure_modifiers:
        - 闭店盘点时段与次日备货
    24小时自助洗衣房:
      details:
      - 滚筒转到最后一分钟，洗衣粉盒搁在折叠台上·深夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 从洗衣房正门回街面，等烘干的人进出自由
        witnesses:
        - 同屋等衣的成年顾客
        affordances:
        - 分一半通宵赶最后两页
        - 在洗衣房等一筒衣烘完
        - 在折叠台摊开一本即将送印的分镜
        pressure_modifiers:
        - 机器占用时长与送印截稿时刻
    通宵大排档:
      details:
      - 塑料凳围着的方桌上留着刮不掉的油迹和一副扑克·深夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿夜市主路回到街口，随时可以起身
        witnesses:
        - 邻桌食客与摊主
        affordances:
        - 送她回住处的一段夜路
        - 把车钥匙放过桌面再决定送到哪
        pressure_modifiers:
        - 收摊时间与喝酒的人能不能自己走
  pairs:
  - family: 艺术与传播
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 成年校友展览召集人
      function: 联络校友作品并安排展线
      authority: 能提议展序和借场，不能替作者授权或影响学业
      resource: 作者联络、可移动展板与校友借场时段
      limitation: 没有作品改作权，也不能让私人琴房无条件开放
      obligation: 按作者意愿列署名并按时归还作品
      exposure: 偏袒熟人会使新作者退出
      hidden: —
    player:
      identity: 成年音乐课程助教
      baseline: 你曾为新作者补上被漏掉的作品说明，他请你再试一次不按资历排的展览
      resources:
      - 试奏曲谱、节拍器与预约练琴时间
      reputation: 大学艺术助教，明确成年，只参与平级协作且不负责对方评分
    relationship_reason: 你曾为新作者补上被漏掉的作品说明，他请你再试一次不按资历排的展览
  - family: 学术与专业
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 成年音乐课程助教
      function: 带自愿排练并解释演奏方法
      authority: 可示范分句、建议节目顺序，不决定校友资格或赞助
      resource: 可分段示范的曲谱选段、节拍器与练琴室预约簿
      limitation: 不能延长琴房预约，不能要求未报名者演出
      obligation: 按演奏者意愿确定曲目与署名
      exposure: 排练失控会消耗演奏者的练习时间
      hidden: —
    player:
      identity: 成年校友展览召集人
      baseline: 一位成年参展者想在展厅一角加一场现场试奏，艺术季把布展与走台交给你和助教同场协调，展线归你、曲目归她
      resources:
      - 常联系的参展作者名单
      - 向画廊与活动室借展板的许可
      reputation: 成年校友召集人，擅长听众安排但不自称音乐教师
    relationship_reason: 一位成年参展者想在展厅一角加一场现场试奏，艺术季把布展与走台交给你和助教同场协调，展线归你、曲目归她
  - family: 屏幕与镜头
    position: 危机公关处理人
    appellations:
    - 直呼其名
    npc:
      role: 成年参展作者
      function: 交出可授权公开展出的作品并自行决定撤稿时机
      authority: 可在任何阶段撤回本人作品的公开范围
      resource: 原片底片、授权清单与本人作品的展览副本
      limitation: 不掌握平台侧的撤稿通道，也不能替其他作者表态
      obligation: 逐条写明作品可用于现场、印刷还是网络
      exposure: 底片外流会让她撤掉整批作品并终止合作
      hidden: —
    player:
      identity: 成年艺术季危机公关处理人
      baseline: 上一季你替一位作者拦下了未经授权的直播切条，她这次把底片销毁前夜的处理权交给你，但仍逐条自己签字
      resources:
      - 平台撤稿回执通道与素材授权台账
      - 与画廊的应急联系
      reputation: 处理公开危机时先保作者意愿，不拿热搜换授权
    relationship_reason: 上一季你替一位作者拦下了未经授权的直播切条，她这次把底片销毁前夜的处理权交给你，但仍逐条自己签字
  - family: 秩序与执法
    position: 服务提供者
    appellations:
    - 警官
    npc:
      role: 成年艺术季安保负责人
      function: 核查进出人员与舞台机关的安全状态
      authority: 可叫停任何未通过检查的演出环节
      resource: 机关检查记录、监控调阅权限与现场人手
      limitation: 不介入艺术评审，也不能据传言给个人定性
      obligation: 把叫停理由当场说明并留下书面记录
      exposure: 放行有问题的机关一旦出事，整季停办
      hidden: —
    player:
      identity: 成年舞台技术顾问
      baseline: 你上次在彩排前发现飞刀机关的固定件被换过，安保负责人因此愿意和你一起复核，但结论仍由他签字
      resources:
      - 舞台机械图纸与机关检查表
      - 剧院的启用时段
      reputation: 只看现场痕迹，不替任何人把话说满
    relationship_reason: 你上次在彩排前发现飞刀机关的固定件被换过，安保负责人因此愿意和你一起复核，但结论仍由他签字
  - family: 服务与手艺
    position: 深夜接单的代驾
    appellations:
    - 客人
    npc:
      role: 成年艺术季夜归参与者
      function: 在收工后自己决定去哪、几点走
      authority: 随时可以改目的地或就地结束这趟
      resource: 自己的车钥匙、报酬与当晚的去处
      limitation: 喝了酒不能自己开车，也不接受被安排行程
      obligation: 按约定支付代驾费用并说清目的地
      exposure: 被拍到醉态会直接影响她第二天的公开安排
      hidden: —
    player:
      identity: 深夜接单的成年代驾
      baseline: 你在收工时间接到她的单，她上车前先确认了你不是来蹲点的记者，这趟路才刚开始
      resources:
      - 折叠单车、接单账号与熟路经验
      reputation: 不打听客人身份，也不把路线说给第三个人
    relationship_reason: 你在收工时间接到她的单，她上车前先确认了你不是来蹲点的记者，这趟路才刚开始
  - family: 家族与继承
    position: 合租室友
    appellations:
    - 直呼其名
    npc:
      role: 成年同租创作者
      function: 在自己那份租金与作品上各管各的
      authority: 可决定自己房间和作品的使用方式
      resource: 自己那部分房租、作息与创作时间
      limitation: 不能占用合租区的公共空间办展，也不能改动你的排期
      obligation: 交齐分摊的费用并提前说明带人回来的时间
      exposure: 把创作困境说出口会让她在同行面前掉价
      hidden: —
    player:
      identity: 成年艺术季场务统筹
      baseline: 你们合租同一层，她这季的作品要赶在评审前定稿，而你的场务表也压在同一周，两边的作息第一次撞在一起
      resources:
      - 场务排班表与活动室钥匙
      - 对这座城市通宵去处的熟悉
      reputation: 做场务不拿别人的创作换自己的方便
    relationship_reason: 你们合租同一层，她这季的作品要赶在评审前定稿，而你的场务表也压在同一周，两边的作息第一次撞在一起
  - family: 学术与专业
    position: 战队专属战术分析师
    appellations:
    - 教练
    - 会长
    npc:
      role: 成年艺术季策展教练
      function: 带自愿参加的创作者过一遍展陈动线
      authority: 可调整排练安排，不改他人的作品归属
      resource: 动线图上板、排练时段与场地许可
      limitation: 不能替作者决定公开范围，也不能要求学生无薪加班
      obligation: 按参与者自己标的意愿排顺序
      exposure: 把私交写进排期会让新作者直接退展
      hidden: —
    player:
      identity: 成年战队专属战术分析师
      baseline: 你替训练队做的动线复盘被她的展陈排练借用了思路，她请你按同一套方法再看一遍展厅的人流，署名各归各的
      resources:
      - 训练录像复盘方法与计时器
      - 对人群动线的实测记录
      reputation: 分析只报实测，不替被分析的人下结论
    relationship_reason: 你替训练队做的动线复盘被她的展陈排练借用了思路，她请你按同一套方法再看一遍展厅的人流，署名各归各的
  - family: 权力与治理
    position: 名门特聘家教
    appellations:
    - 老师
    npc:
      role: 成年收藏家族继承人
      function: 决定自家收藏是否外借与如何署名
      authority: 可随时中止自家藏品的外借
      resource: 家族藏品清单、庄园琴房与捐赠意向
      limitation: 不能替艺术季评奖，也不能要求参与者替家族做人情
      obligation: 出借前写明归还日期与展出范围
      exposure: 被指用赞助换展位会失去圈内信任
      hidden: —
    player:
      identity: 名门高研班客座督学
      baseline: 你受聘替高研班核对课程与展陈的衔接，家族提出想借顶楼琴房办一场内部试奏，你要先弄清这是赞助还是交换
      resources:
      - 高研班课程表与学员作品清单
      - 可公开引用的评审规则
      reputation: 客座督学只对教学负责，不代家族谈条件
    relationship_reason: 你受聘替高研班核对课程与展陈的衔接，家族提出想借顶楼琴房办一场内部试奏，你要先弄清这是赞助还是交换
  - family: 医疗与照护
    position: 被求助者
    appellations:
    - 先生
    npc:
      role: 成年术后复出创作者
      function: 按自己身体允许的进度重新参加排练
      authority: 可随时停止当天的一切活动
      resource: 本人的复查记录、作品副本与复出节奏
      limitation: 不能长时间站立，也不能被排进需要通宵的环节
      obligation: 说清身体状况，不让别人替她硬撑
      exposure: 被当成需要照顾的人，作品就没有人认真讨论
      hidden: —
    player:
      identity: 成年艺术季场务统筹
      baseline: 她把术后第一次公开露面放在你的场次，只提前告诉你一句「站久了要坐」，你要在她不开口的时候也知道该收在哪一步
      resources:
      - 场次时长控制权与休息区安排
      - 对剧场座位与坡道的熟悉
      reputation: 做场务先照顾人，再照顾流程
    relationship_reason: 她把术后第一次公开露面放在你的场次，只提前告诉你一句「站久了要坐」，你要在她不开口的时候也知道该收在哪一步
  - family: 商业与产业
    position: 服务提供者
    appellations:
    - 教练
    npc:
      role: 成年新刊主编
      function: 决定本期专题的截稿口径与署名顺序
      authority: 可撤稿、可延期，但须自己承担印刷档期
      resource: 版面计划、作者合同与印刷排期
      limitation: 不能替作者改写本人观点，也不能拿版面换私交
      obligation: 在截稿前把改动逐条告知作者
      exposure: 临时抽稿会让下期作者不再给独家
      hidden: —
    player:
      identity: 成年艺术季摄影教练
      baseline: 你替她这期专题拍的现场稿赶在新刊截稿前夜交片，她坚持先看未修原片再决定用哪一张，署名和裁剪都还没定
      resources:
      - 现场原片、联系表与校色台
      - 可用的通宵冲印档期
