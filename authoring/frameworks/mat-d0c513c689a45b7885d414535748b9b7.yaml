  "activities":
    "设计校友展览":
      "places":
        - "学园祭打烊后的活动室"
      "pairs":
        - 0
      "category": "日常接触"
      "action": "{npc}把两张风格相反的作品缩图并排，问你想先聊哪一张。"
      "beats":
        "trigger": "{npc}把两张风格相反的作品缩图并排，问你想先聊哪一张。"
        "objective": "找到愿意继续合作的审美交集"
        "choice": "交换看法；不加入筹展只看作品；或各排一小段再比较"
        "immediate": "两套展序各留一个片段，不按校友年资定胜负"
        "near": "下次可以各带一位新作者来试展，参与仍自愿"
