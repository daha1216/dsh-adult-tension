id: mat-d136423bf1195d8fb009a708bcb0219f
name: 磁带与夜市街区
material:
  eras:
  - 九十年代
  aesthetics:
  - 旧年代质感
  - 暖色生活流
  - 温柔颓丧
  rule: 街区消息由布告栏、电话和熟人传递，磁带与手写地址记录着日常。
  social_rule: 公共活动以张贴的名单和当面约定为准。
  places:
    旧书店:
      details:
      - 旧书架下码着编号磁带盒·午后
      - 试听机旁备着空盒与铅笔·午后
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 旧书店门外街道
        witnesses:
        - 兼售旧带的店主
        affordances:
        - 给旧磁带编目录
        - 结束活动并离开
        pressure_modifiers:
        - 走带状态
        - 店内允许试听的音量
    通宵大排档:
      details:
      - 油烟棚下留着不放音箱的过道·夜
      - 朝内摆的喇叭正对空桌·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 敞开的街边通道
        witnesses:
        - 摊主
        - 用餐街坊
        affordances:
        - 筹划街坊点歌夜
        - 结束活动并离开
        pressure_modifiers:
        - 住户休息时间
        - 过道宽度
    家中厨房:
      details:
      - 家用炉灶边搁着洗好的菜·傍晚
      - 暂停的便携录音机远离水盆·傍晚
      profile:
        privacy: high
        visibility: low
        exits:
        - 厨房门通向客厅与入户门
        witnesses:
        - 经主人邀请的共同做饭者
        affordances:
        - 录制家常菜口述
        - 结束活动并离开
        pressure_modifiers:
        - 主人可用灶台
        - 当日食材
    工作室:
      details:
      - 剪报、胶水和废纸铺满拼贴桌·夜
      - 远端墙上临时挂着海报样稿·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 工作室门通向楼道
        witnesses:
        - 文化站同事
        affordances:
        - 拼贴夜市海报
        - 结束活动并离开
        pressure_modifiers:
        - 翻印前取稿时间
        - 剩余纸张
    深夜便利店:
      details:
      - 冷藏柜的灯是这条街上唯一不灭的一盏·深夜
      - 收银台边摆着待领的挂号信与一本翻烂的赊账本·深夜
      profile:
        privacy: low
        visibility: medium
        exits:
        - 推开玻璃门回到夜市街面
        - 从此处后门绕到旧的楼间窄巷
        witnesses:
        - 值夜班的店员
        - 同来买宵夜的街坊
        affordances:
        - 查看贴在门后的拆迁告示
        - 核对赊账本上的名字
        pressure_modifiers:
        - 值夜店员是否愿意搭话
        - 店内广播音量
    老宅楼间窄巷:
      details:
      - 窄巷两侧墙皮剥落，露出上一轮刷过的旧广告·黄昏
      - 搬家用过的麻绳和纸箱堆在楼道口，没人收拾·黄昏
      profile:
        privacy: medium
        visibility: low
        exits:
        - 穿到夜市街面回到大排档一侧
        - 从楼道口上到老宅各层住户
        witnesses:
        - 进出楼道的邻居住户
        - 在巷口收废纸的老人
        affordances:
        - 翻看墙上的旧广告层
        - 清点堆着的搬家杂物
        pressure_modifiers:
        - 拆迁办是否贴了新告示
        - 巷内路灯还亮不亮
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 音像店整理员
      function: 整理寄售磁带并判断可试听状态
      authority: 安排自己经手的试听与归盒，不决定录音传播许可
      resource: 试听机、空磁带盒和可借的旧曲目录
      limitation: 无法凭歌声确认所有录音者，坏带须停机处理
      obligation: 原带原盒对应，私人录音未许不得外借
      exposure: 卡坏寄售带要赔偿，混盒会失去藏带人的委托
      hidden: —
    player:
      identity: 街道文化站录音员
      baseline: 你用文化站节目顺序帮整理员辨出过一盒无名演出带；这次约好只试片头，不整夜翻录。
      resources:
      - 便携录音机与试机带
      - 文化站旧节目顺序
      reputation: 你辨得出录音段落，不拿私人谈话充素材
    relationship_reason: 你用文化站节目顺序帮整理员辨出过一盒无名演出带；这次约好只试片头，不整夜翻录。
  - family: 艺术与传播
    position: 前任
    appellations:
    - 直呼其名
    npc:
      role: 街道文化站录音员
      function: 录制街坊声音并布置小型点歌活动
      authority: 控制文化站借出的音响与自己录制段落的剪选
      resource: 便携录音机、借用音箱与节目时段
      limitation: 不能占用住户休息时间，也无权把寄售带当复制母带
      obligation: 播前确认录音用途，收场归还设备
      exposure: 超时扩音会让下一场借地受阻
      hidden: —
    player:
      identity: 音像店整理员
      baseline: 点歌夜的曲目要按街区规矩写进张贴名单，录音员第一次约你到外桌试音，把能放多大声当面圈定。
      resources:
      - 熟悉旧曲的试听经验
      - 已经允许公开播放的曲带
      reputation: 你爱冷门曲，但能为现场节奏缩短曲单
    relationship_reason: 点歌夜的曲目要按街区规矩写进张贴名单，录音员第一次约你到外桌试音，把能放多大声当面圈定。
  - family: 商业与产业
    position: 担保人 / 连带责任人
    appellations:
    - 老板
    npc:
      role: 担保人
      function: 替人签下租金与生意的连带责任，按期对账
      authority: 可决定替谁续签、什么时候撤回担保
      resource: 担保合同、往来账本与借来的周转钱
      limitation: 不能替房客还钱抵债，也无权处置别人屋里的东西
      obligation: 签之前把连带范围逐条念给对方听并留一份副本
      exposure: 替人签的那笔收不回来就要自己垫，垫不上连担保资格一起没
      hidden: —
    player:
      identity: 音像店整理员
      baseline: 你替店里管过寄售的账，知道谁的名字写在担保那一栏就得由谁来兜。
      resources:
      - 寄售往来账本
      - 熟悉的旧曲与试听经验
      reputation: 你算账时把连带那栏先念出来再落笔
    relationship_reason: 担保人上次替整理员把寄售带的押金垫了半截，此后整理员替他核账时总把连带那栏先念一遍。
  activities:
    给旧磁带编目录:
      places:
      - 旧书店
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}先用试听带试机，再插入待编目磁带，邀你辨认前奏和录制间隙。'
      beats:
        trigger: '{npc}先用试听带试机，再插入待编目磁带，邀你辨认前奏和录制间隙。'
        objective: 分清同名带的内容与可播放状态
        choice: 听片头，或只核对盒签；担心损带可停机留待检修
        immediate: 可播放与卡带风险分别归盒，曲目不明保留问号，不倒推录制人。
        near: 借带者知道哪些只供保管，待查带不混进点歌夜播放队列。
    筹划街坊点歌夜:
      places:
      - 通宵大排档
      pairs:
      - 1
      category: 空间与退出
      action: '{npc}在大排档把音箱转离住户窗，邀你到外桌听一首再定点歌顺序。'
      beats:
        trigger: '{npc}在大排档把音箱转离住户窗，邀你到外桌听一首再定点歌顺序。'
        objective: 让点歌能与吃饭和街坊休息共存
        choice: 到外桌试听，或只看歌单；不听歌可选较安静座位
        immediate: 靠窗音量降低，长歌放到较早时段，通道旁不再堆音箱。
        near: 点歌夜按商量的结束时刻收声，偏爱聊天的人仍能在无扩音桌吃饭。
    录制家常菜口述:
      places:
      - 家中厨房
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}先把录音机停在桌角，洗好一盆菜，问你想一起做还是只听家里的做法。'
      beats:
        trigger: '{npc}先把录音机停在桌角，洗好一盆菜，问你想一起做还是只听家里的做法。'
        objective: 把口述中的一把与适量试成一顿可吃的饭
        choice: 试炒小份，或帮洗菜；不录音也能一起吃
        immediate: 尝味后调整水量与火候，录音只有在双方点头后才开启。
        near: 吃完分好剩菜，各自保留家里的口味；录下的版本须做饭者同意才外借。
    拼贴夜市海报:
      places:
      - 工作室
      pairs:
      - 1
      category: 信息交换
      action: '{npc}摆开剪报和胶水，邀请你把夜市标题剪成两个不同构图试贴。'
      beats:
        trigger: '{npc}摆开剪报和胶水，邀请你把夜市标题剪成两个不同构图试贴。'
        objective: 找到远看能辨认、近看有趣的海报
        choice: 试拼一版，或用手指选位置；不留作品可只帮看远处效果
        immediate: 两个样稿的主次被比较，采用的一版保留作者约定的署名。
        near: 文化站只翻印选定样稿，余下剪贴归作者，不把素材自动收为公物。
    深夜买一份宵夜:
      places:
      - 深夜便利店
      pairs:
      - 0
      category: 日常接触
      action: '{npc}把冷柜门拉开又关上，问你要不要顺一份热好的带回去。'
      beats:
        trigger: '{npc}把冷柜门拉开又关上，问你要不要顺一份热好的带回去。'
        objective: 在关门前把自己那份宵夜定下来
        choice: 拿一份热好的；只买一瓶水就走；站在门口把告示看完
        immediate: 柜台结账时赊账本上多划一道，谁划的自己记着
        near: 赊的账按纸条上的日子还，值夜店员不再替人垫第二次
    广播叫到那个名字:
      places:
      - 深夜便利店
      pairs:
      - 1
      category: 第三方与打断
      action: '{npc}停下手里的活，说店内广播刚念到一个名字，让你听清是不是认识的那位。'
      beats:
        trigger: '{npc}停下手里的活，说店内广播刚念到一个名字，让你听清是不是认识的那位。'
        objective: 弄清广播找人是为了什么事
        choice: 去柜台问清来电的来路；当没听见继续挑东西；出门用公用电话回过去
        immediate: 问清的原话当场记在纸条上，广播那头的号码不往外传
        near: 回不回这个电话由被叫的人自己定，旁人不替她答话
    当面摊牌:
      places:
      - 通宵大排档
      pairs:
      - 0
      category: 第三方与打断
      action: '{npc}把筷子搁下，说今天这顿就得把上个月那笔债当面讲明白。'
      beats:
        trigger: '{npc}把筷子搁下，说今天这顿就得把上个月那笔债当面讲明白。'
        objective: 把欠了多久、还到哪一步当场对清
        choice: 把账本摊在桌上逐条对；只说自己那一半；起身走人不谈
        immediate: 摊开的账当场按到桌面压住，谁经手的谁在旁边划名字
        near: 划了名字的那笔按日子还，没划的下次见面再说，摊主的账不让拖
    把热的那份推过去:
      places:
      - 通宵大排档
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}把刚上桌还冒热气的那份推到你面前，自己留下已经放凉的那碗。'
      beats:
        trigger: '{npc}把刚上桌还冒热气的那份推到你面前，自己留下已经放凉的那碗。'
        objective: 让赶夜班的那位吃上一口热的
        choice: 换过来不吭声；把两份各分一半；推回去让她自己吃热的
        immediate: 热的那份换定就不再推来推去，凉的那碗由留下的人吃完
        near: 下次谁来点单照这次的分法，摊主不用再问第二遍
    拍出那本旧日记:
      places:
      - 老宅楼间窄巷
      pairs:
      - 2
      category: 信息交换
      action: '{npc}从纸箱底下翻出一本封皮开裂的旧日记，拍在巷口的杂物上要你自己看。'
      beats:
        trigger: '{npc}从纸箱底下翻出一本封皮开裂的旧日记，拍在巷口的杂物上要你自己看。'
        objective: 弄清这本里写的是谁的事、还作不作数
        choice: 当场翻到自己那几页；只把本子收起来不谈；让她自己念出来
        immediate: 拍出来的本子当晚归回原主，旁边没第三个人接过去翻
        near: 里头写的事要不要提，由被写在里面的人定；不提就当没翻过
    雨里把伞偏过去:
      places:
      - 老宅楼间窄巷
      pairs:
      - 1
      category: 身体靠近
      action: '{npc}举着伞站在巷口不动，等你自己走过来跟她挤在同一把伞下面。'
      beats:
        trigger: '{npc}举着伞站在巷口不动，等你自己走过来跟她挤在同一把伞下面。'
        objective: 把这一路走到楼下那几级台阶走完
        choice: 把伞往她那边偏；只把外套脱下来递过去；自己先走不留话
        immediate: 伞面偏过去的那一侧湿了半肩，走完这段谁都没提这件事
        near: 往后再走这条巷子会不会还是同一把伞，要看下回谁先站在巷口等
  customs:
  - 借出的磁带盒里会夹一张约好归还时间的纸签。
  pressures:
    演出带误贴标签:
      source: 文化站收到两盒同名但内容不同的演出带
      engines:
      - 旧事追索
      - 败犬青梅复仇战
      beats:
        trigger: '{npc}收到消息：文化站收到两盒同名但内容不同的演出带。'
        objective: 找到正确母带并确认演出顺序
        choice: 试听片头，或联系原录音者
        immediate: 两盒同名带都不进正式播放队列，先用已确认曲目补一段空档。
        near: 录音员与整理员分别核对片头和节目间歇，只给确认过的母带换签。
      far_trigger: 文化站下次借出同场演出带时
      far_consequence: 原带与副带分盒借还；仍无法判定的只留存，不以大家记得为由重新署名。
      exits:
      - 停止试听，原样归还文化站
      - 只给出认识的前奏线索，不继续找原录音者
      bindings:
      - activity: 给旧磁带编目录
        place: 旧书店
        pair: 0
      - activity: 筹划街坊点歌夜
        place: 通宵大排档
        pair: 1
      - activity: 录制家常菜口述
        place: 家中厨房
        pair: 0
    夜市摊位调整:
      source: 新的夜市通道规划占用了原定的小舞台
      engines:
      - 资源锁定
      - 第三方施压
      beats:
        trigger: '{npc}收到消息：新的夜市通道规划占用了原定的小舞台。'
        objective: 商量不阻挡通行的新舞台位置
        choice: 实地量一量，或改成分散点歌
        immediate: 原舞台停止摆箱，顾客先能穿过过道，歌手不必站在摊位出餐口等。
        near: 量过通道后改用内向小音箱或无扩音点歌，仍不合适便只保留吃饭聚会。
      far_trigger: 夜市下一轮划位时
      far_consequence: 可移动的小场地方案有机会保留；坚持固定大台则可能失去这个点位。
      exits:
      - 撤下本次音响，转成普通聚餐
      - 只归还借来的设备，不负责后续争取摊位
      bindings:
      - activity: 筹划街坊点歌夜
        place: 通宵大排档
        pair: 1
      - activity: 拼贴夜市海报
        place: 工作室
        pair: 1
    老宅列入拆迁:
      source: 老宅列进这一轮拆迁，告示贴在便利店门后，补偿按签约先后递减，月底就是第一轮截止。
      engines:
      - 迁居倒计时
      - 遗产之争
      beats:
        trigger: '{npc}把门后的拆迁告示揭下半张给你，说补偿按签约先后算，月底就是第一轮。'
        objective: 弄清这处老宅该谁签、签了之后各自住到哪里
        choice: 把告示抄清楚挨家问签不签；只谈自己那一份；等邻居先签看看行情
        immediate: 抄下的告示贴在楼道口，谁家签了当场在名字边画圈，不替人代签
        near: 先签的按第一轮的数走，拖到后面一档少一截，各家的住处要自己先找
      far_trigger: 第一轮截止后仍有住户没签
      far_consequence: 补偿降一档且搬迁期压缩，没签的那户要在几周内自己找落脚处
      bindings:
      - activity: 深夜买一份宵夜
        place: 深夜便利店
        pair: 0
      - activity: 拍出那本旧日记
        place: 老宅楼间窄巷
        pair: 2
      - activity: 广播叫到那个名字
        place: 深夜便利店
        pair: 1
      exits:
      - 签下自己那份后搬出老宅，把钥匙交拆迁办
      - 不签也不搬，先转去亲戚或旅店挤一段
    无性婚姻重启:
      source: 同屋那两人分床睡了两年，如今孩子要住回来，那张双人床得重新摆回主卧。
      engines:
      - 情感拉扯
      - 名分悬置
      beats:
        trigger: '{npc}站在主卧门口说孩子要搬回来住，那张床得挪回原来的位置。'
        objective: 在搬床之前把这两年怎么过讲清楚
        choice: 当面把分床的事摆开谈；只把床挪回去照旧各睡各的；让孩子自己挑跟谁住
        immediate: 床挪回去当晚谁睡哪侧当场定，被褥各留各的那一床
        near: 住回去之后的相处按谈成的来，谈不成的仍旧分房，不拿孩子当挡箭牌
      far_trigger: 孩子住回来一个月后两人仍各睡一间
      far_consequence: 家里的事变成三间屋各过各的，孩子自己开口问这件事；先谈拢才不至于拖着
      bindings:
      - activity: 把热的那份推过去
        place: 通宵大排档
        pair: 1
      - activity: 深夜买一份宵夜
        place: 深夜便利店
        pair: 0
      - activity: 当面摊牌
        place: 通宵大排档
        pair: 0
      exits:
      - 把主卧让给孩子，自己搬去小间
      - 谈不拢就另找住处，不当着孩子争这间屋
    旧情未了:
      source: 当年那人还在这条街上开店，抽屉里留着旧日记与两张褪色的车票，雨里还会走同一条巷子。
      engines:
      - 旧情重逢
      - 情感拉扯
      beats:
        trigger: '{npc}把两张褪色的车票夹进旧日记里，问你当年的那条巷子还走不走。'
        objective: 弄清这层旧情还算不算数、要不要让现在的日子知道
        choice: 把车票还回去当面问；只把日记收好不再翻；照旧走那条巷子但绕开她的店
        immediate: 还回去的车票当晚只到那人手上，这段巷子仍旧两人各走各的
        near: 要不要接着见由还票的那方先开口，现任那边瞒不瞒得过去自己掂量
      far_trigger: 拖到下一个月仍没把话说清
      far_consequence: 两边都以为对方还在等，日子越过越拧；早说清至少保住一头
      bindings:
      - activity: 拍出那本旧日记
        place: 老宅楼间窄巷
        pair: 2
      - activity: 雨里把伞偏过去
        place: 老宅楼间窄巷
        pair: 1
      exits:
      - 把旧日记与车票一并退还，此后不再走那条巷子
      - 只把钥匙还了，人照旧留在这条街上
