id: "mat-d8ec69422b1354538ef3c705f4beb804"
name: "幕末町屋与道场"
material:
  eras:
    - "文久幕末京都风云"
  aesthetics:
    - "幕末残雨物哀"
    - "和风物哀"
  rule: "京都町屋与壬生道场以修缮、借场和手递书信维持往来。江户神乐坂是异地艺事联络点，需另写旅行或通信经过，个人手艺不等于政治归属。"
  social_rule: "携带书信不等于替寄信人表态，借用场所须征求管理者同意。"
  places:
    鸭川河畔町屋雨廊:
      details:
        - "鸭川潮气沿木柱留下深浅水痕"
        - "油灯照着修补木样，雨廊内侧留着干燥落脚处"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "由屋主许可的玄关退到京都街面"
        witnesses:
          - "屋主或留守家人"
        affordances:
          - "辨认旧屋木纹"
          - "比较旧材与新木样"
        pressure_modifiers:
          - "雨势与木材含水"
          - "屋主愿意保留的旧痕"
    壬生屯所阴暗道场:
      details:
        - "练习后的木刀分放在墙架"
        - "油灯照不到的场角留空，器具修补在门侧进行"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "交还借用木牌，从屯所指定门离开"
        witnesses:
          - "获准在场的道场管事"
        affordances:
          - "修整练习用具"
          - "试绕护具系绳"
        pressure_modifiers:
          - "管事准许的开放时段"
          - "借场人数"
    神乐坂置屋:
      details:
        - "江户神乐坂的一处艺事经纪住处设有接帖玄关"
        - "纸帖与寄来的京都书信放在低案上，里间不是访客通道"
      profile:
        privacy: "medium"
        visibility: "low"
        exits:
          - "从接帖玄关退出江户街面，返京都另算旅程"
        witnesses:
          - "接帖的当家人"
        affordances:
          - "商量艺事邀帖称呼"
          - "当面试读一段问候"
        pressure_modifiers:
          - "书信到达日期"
          - "受邀人是否在江户"
  pairs:
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "师傅"
      npc:
        role: "町屋修缮匠"
        function: "判断旧木能否复用，修补门廊与练习器架"
        authority: "可停下自己的木作，是否动屋架须由屋主确认"
        resource: "旧屋尺寸图、干木样与小刨"
        limitation: "没有屋主授权不能拆梁，也不能替道场准人入场"
        obligation: "先说明替换会失去哪段旧材，再动手"
        exposure: "误拆旧材无法复原，返修要占掉下一份生计"
      player:
        identity: "道场书役"
        baseline: "你在道场做的是器具与书信事务，不把熟人邀约误当成屯所命令。"
        resources:
          - "借用木牌"
          - "江户接帖人的回信"
        reputation: "分得清自己传话与本人承诺"
      relationship_reason: "书役请修缮匠看过器架后，又介绍他认识鸭川屋主；两人能谈木料，也能承认各自无权代屋主签单。"
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "先生"
      npc:
        role: "道场书役"
        function: "照管练习器具借还与对外书信"
        authority: "可安排已获管事许可的器具借用"
        resource: "借用木牌、可替换护具系绳和寄信联络"
        limitation: "不能给陌生人屯所通行权，也无权替道场表政治态度"
        obligation: "交还器具前检查系绳，递信只递原话"
        exposure: "错借场或错递称呼会让管事收回委托"
      player:
        identity: "町屋修缮匠"
        baseline: "你认得木纹，也记得谁在哪根柱子上量过身高，愿把这些留给屋主自己决定。"
        resources:
          - "木样和小型木作工具"
          - "自己测过的门廊尺寸"
        reputation: "先讲清动哪里，再落刨"
      relationship_reason: "修缮匠曾替书役补过木牌盒；书役回报的是教他读懂一封江户邀帖的客套，而非免去入场手续。"
  activities:
    辨认旧屋木纹:
      places:
        - "鸭川河畔町屋雨廊"
      pairs:
        - 0
      category: "调查与核验"
      action: "{npc}在干燥廊边摆出两块木样，让你看旧柱纹路是否延续。"
      beats:
        trigger: "{npc}在干燥廊边摆出两块木样，让你看旧柱纹路是否延续。"
        objective: "区分表面水痕与需要屋主再请匠人确认的腐损"
        choice: "可比较木样；可只听屋主讲旧痕，或不参与鉴看等他人确认"
        immediate: "可复用与待查部位分开，今天不因看了木纹就拆屋"
        near: "屋主可据此选保旧痕或换外皮，修缮另行约工"
    修整练习用具:
      places:
        - "壬生屯所阴暗道场"
      pairs:
        - 1
      category: "照护与修复"
      action: "{npc}在管事准许的门侧放下散开的护具系绳，请你试一种更好解的绕法。"
      beats:
        trigger: "{npc}在管事准许的门侧放下散开的护具系绳，请你试一种更好解的绕法。"
        objective: "让借用护具稳固又能自行解开"
        choice: "可一起换绳试绕；可只把裂损木刀挑出，或交回管事不接修补"
        immediate: "换好的系绳先在空护具上拉拽，裂损木刀不放回练习架"
        near: "下一次借用者可反馈松紧，不要求参与者加入道场"
    商量艺事邀帖称呼:
      places:
        - "神乐坂置屋"
      pairs:
        - 0
      category: "信息交换"
      action: "{npc}在江户停留的接帖时段读出邀帖，问这句问候会不会让收帖人误认成代谁邀约。"
      beats:
        trigger: "{npc}在江户停留的接帖时段读出邀帖，问这句问候会不会让收帖人误认成代谁邀约。"
        objective: "学会把私人观艺邀请与道场名义分开"
        choice: "可试读两种说法；可只谈演目，或不代递这封帖"
        immediate: "当家人听懂邀请是谁发起，不因客套被写成已答应赴会"
        near: "回信仍需人递，是否赴会由收帖人决定，京都不会当夜得知"
  customs:
    - "借场结束后，来客会把自己的木牌从门旁取回。"
  pressures:
    修缮委托签名不明:
      source: "鸭川屋主递来的修缮单只写了代办人的别称。"
      engines:
        - "身份风险"
        - "债务压力"
      beats:
        trigger: "{npc}发现鸭川屋主递来的修缮单只写了代办人的别称。"
        objective: "在不可逆拆换前确认谁能授权与付工钱"
        choice: "请屋主当面认单；或只做不拆件的查看，等代办人回信"
        immediate: "木料不下锯，工匠保留今天已做查看的费用说明"
        near: "等待会占住木料，双方可谈退回未加工的新材"
      far_trigger: "下一份修缮开工日到来仍无人承认尾款"
      far_consequence: "工匠要退料或错过别家工期；直接确认授权则可重排，不把欠账转给传信人"
      bindings:
        -
          activity: "辨认旧屋木纹"
          place: "鸭川河畔町屋雨廊"
          pair: 0
      exits:
        - "结清已做查看后退回未加工木料"
        - "退出未授权拆换，把单据还给屋主"
    道场借用时段重叠:
      source: "管事给两组练习者的木牌写着同一借场时段。"
      engines:
        - "资源锁定"
        - "第三方施压"
      beats:
        trigger: "{npc}发现管事给两组练习者的木牌写着同一借场时段。"
        objective: "把器具修整与练习时段分开，不借机给人授通行权"
        choice: "请管事决定分时；或先还用具把修补另约"
        immediate: "门侧修补停止扩摊，已拆的护具单独收好，场中不混两组人"
        near: "被改期一方可以选择退还借场费用，不承担额外值守"
      far_trigger: "下次仍重复发牌且要求书役私下顶班"
      far_consequence: "书役失去可用轮休，两组练习者可能另借场；清楚分时能保持日常借用"
      bindings:
        -
          activity: "修整练习用具"
          place: "壬生屯所阴暗道场"
          pair: 1
      exits:
        - "交还木牌，取走个人工具离屯所"
        - "将未修器具标清交管事，另约白日时段"
  legacy_sources:
    eras:
      - "文久幕末京都风云"
    aesthetics:
      - "幕末残雨物哀"
      - "和风物哀"
    places:
      - "鸭川河畔町屋雨廊"
      - "壬生屯所阴暗道场"
      - "神乐坂置屋"
  themes:
    - "旧木修缮里的取舍"
    - "道场日用与公开身份的距离"
    - "跨城艺事往来中的分寸"
  technology_boundary: "文久年间以木作手工具、油灯、纸帖和人递书信为主，不使用电灯或即时通信。神乐坂置屋作为江户的一处虚构艺事经纪住处，不借用后来成熟花街的规模设定；京都到江户的交往必须跨多日旅程。"
  bridge_status: "bridge_required"
  bridge_explanation: "京都的鸭川、壬生与江户神乐坂不是同城地点。神乐坂活动只在明确经过多日旅程、寄信往返或另起江户停留段后进入；不能沿京都街巷直接抵达。"
