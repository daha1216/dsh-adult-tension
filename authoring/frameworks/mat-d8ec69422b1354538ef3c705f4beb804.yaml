id: mat-d8ec69422b1354538ef3c705f4beb804
name: 幕末町屋与道场
material:
  eras:
  - 文久幕末京都风云
  aesthetics:
  - 幕末残雨物哀
  - 和风物哀
  rule: 队务规制以名录与借用木牌为准：擅自脱离队务者切腹谢罪，由队中执事验明后落笔入册，不追究其家眷；雨夜持长刀过四条大桥者视为犯禁，人刀俱留，由桥番羁押候审，待奉行所次日开审定夺。
  social_rule: 携带书信不等于替寄信人表态，借用场所须征求管理者同意；町屋与置屋的门内之事不经主人许可不得外传，旧礼所定的座次与称呼也不因私下交情挪动。
  places:
    鸭川河畔町屋雨廊:
      details:
      - 鸭川潮气沿木柱留下深浅水痕
      - 油灯照着修补木样，雨廊内侧留着干燥落脚处
      - 门内木牌箱旁压着几封未署名的转手书信·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 由屋主许可的玄关退到京都街面
        witnesses:
        - 屋主或留守家人
        - 隔着雨廊能听见动静的邻家
        affordances:
        - 辨认旧屋木纹
        - 比较旧材与新木样
        - 把无名书信当面交还屋主
        pressure_modifiers:
        - 雨势与木材含水
        - 屋主愿意保留的旧痕
    壬生屯所阴暗道场:
      details:
      - 练习后的木刀分放在墙架
      - 油灯照不到的场角留空，器具修补在门侧进行
      - 场角的木盆里泡着待拭的刀，水面泛着一点暗色·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 交还借用木牌，从屯所指定门离开
        witnesses:
        - 获准在场的道场管事
        - 轮值守夜的队士
        affordances:
        - 修整练习用具
        - 试绕护具系绳
        - 递上一块干净白布替她拭刀
        pressure_modifiers:
        - 管事准许的开放时段
        - 借场人数
    神乐坂置屋:
      details:
      - 江户神乐坂的一处艺事经纪住处设有接帖玄关
      - 纸帖与寄来的京都书信放在低案上，里间不是访客通道
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从接帖玄关退出江户街面，返京都另算旅程
        witnesses:
        - 接帖的当家人
        affordances:
        - 商量艺事邀帖称呼
        - 当面试读一段问候
        pressure_modifiers:
        - 书信到达日期
        - 受邀人是否在江户
    祗园艺伎置屋纸拉门后:
      details:
      - 纸拉门后摆着三味线与换下的舞衣，镜台前垫着一方绣纹座布团·夜
      - 廊下木梯通向上厢，宴客声隔着一层薄纸传进来·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 拉门通廊下，从里间退到置屋后院的小门
        witnesses:
        - 置屋的女将
        - 同在廊下候场的艺伎
        affordances:
        - 替她挽一次发并插上玉簪
        - 隔纸门听清廊下宴席的座次
        pressure_modifiers:
        - 下一场宴席的开席时刻
        - 女将允不允许外人进里间
    四条大桥桥番小屋:
      details:
      - 桥番小屋的马灯照着桥口两侧的拦桩，雨夜只留一盏·夜
      - 墙钉上挂着当日扣下的长刀名牌，木牌边角还留着泥·夜
      profile:
        privacy: medium
        visibility: high
        exits:
        - 桥番盘问后放行者走桥上，其余人从桥头退回町屋一侧
        witnesses:
        - 当值的桥番
        - 同在桥口被拦下的过往行人
        affordances:
        - 当面认领被扣的名牌
        - 隔窗听桥番说明今夜禁令的缘由
        pressure_modifiers:
        - 雨势与桥面通行状况
        - 桥番当班的严松
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 师傅
    npc:
      role: 町屋修缮匠
      function: 判断旧木能否复用，修补门廊与练习器架
      authority: 可停下自己的木作，是否动屋架须由屋主确认
      resource: 旧屋尺寸图、干木样与小刨
      limitation: 没有屋主授权不能拆梁，也不能替道场准人入场
      obligation: 先说明替换会失去哪段旧材，再动手
      exposure: 误拆旧材无法复原，返修要占掉下一份生计
    player:
      identity: 道场书役
      baseline: 你在道场做的是器具与书信事务，不把熟人邀约误当成屯所命令。
      resources:
      - 借用木牌
      - 江户接帖人的回信
      reputation: 分得清自己传话与本人承诺
    relationship_reason: 书役请修缮匠看过器架后，又介绍他认识鸭川屋主；两人能谈木料，也能承认各自无权代屋主签单。
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 先生
    npc:
      role: 道场书役
      function: 照管练习器具借还与对外书信
      authority: 可安排已获管事许可的器具借用
      resource: 借用木牌、可替换护具系绳和寄信联络
      limitation: 不能给陌生人屯所通行权，也无权替道场表政治态度
      obligation: 交还器具前检查系绳，递信只递原话
      exposure: 错借场或错递称呼会让管事收回委托
    player:
      identity: 町屋修缮匠
      baseline: 你认得木纹，也记得谁在哪根柱子上量过身高，愿把这些留给屋主自己决定。
      resources:
      - 木样和小型木作工具
      - 自己测过的门廊尺寸
      reputation: 先讲清动哪里，再落刨
    relationship_reason: 修缮匠曾替书役补过木牌盒；书役回报的是教他读懂一封江户邀帖的客套，而非免去入场手续。
  - family: 权力与治理
    position: 黑夜佣兵统帅
    appellations:
    - 长官
    npc:
      role: 屯所队务执事
      function: 记录出勤与队务名册，按队规处置脱队与犯禁者
      authority: 可当场扣下名牌、下令羁押候审，并据实入册不必请示
      resource: 队务名册、签发借用木牌的权限和屯所后门的钥匙
      limitation: 改不了队规条文，也不能替谁在册子上抹掉一笔
      obligation: 落册前当众说明所犯何条，处置须在名册上留原话
      exposure: 错断一桩队务就要自己在执事席前受问，还可能连累举荐他的人
    player:
      identity: 町屋修缮匠
      baseline: 你替屯所修过器架，也算半个熟人；眼下名册上有一笔记的正是你夜里去过的那座桥。
      resources:
      - 进屯所修器具的借用木牌
      - 自己留的一份器具修补登记
      reputation: 进屯所只认木牌不认人情，出屯所不替谁圆话
    relationship_reason: 执事上回按名册替修缮匠挡下一回误记的脱队，代价是匠人替屯所白修了一扇门；这一次名册上又出了同样的一笔，两人都清楚这回捏在手里的是谁的名字。
  - family: 传统与雅艺
    position: 贴身侍从兼掌眼人
    appellations:
    - 公子
    npc:
      role: 祗园艺伎
      function: 在宴席上执三味线与舞，也在里间替熟客掌眼辨认书画与刀装的成色
      authority: 可决定自己那一场席接与不接，里间进不进人也由她点头
      resource: 置屋廊下的交情、几件寄存的舞衣，以及认得真伪的一双眼
      limitation: 身契挂在置屋名下，出门与留宿都要女将许可
      obligation: 替人掌眼只说成色不替人喊价，收下的东西必当面点清
      exposure: 替客人瞒过一次成色，此后置屋的名声就要她自己背
    player:
      identity: 町屋修缮匠
      baseline: 你替置屋修过廊下的木栏，也被邀去掌过一次眼；眼下她腕上那件玉镯的来路与你的活计脱不了干系。
      resources:
      - 能把旧物成色说清的眼光
      - 置屋后院小门进出的默许
      reputation: 看过的东西说得清，不替谁把假的说成真的
    relationship_reason: 修缮匠替置屋补过镜台的木脚，艺伎则替他掌眼看出一只玉镯的旧主门第；这一次她要把玉镯当掉应急，而认得它的人只剩他一个。
  - family: 侍奉与身契
    position: 债主
    appellations:
    - 掌柜
    npc:
      role: 神乐坂置屋年季奉公的见习艺伎
      function: 在接帖玄关应答杂务，随艺伎出席陪席奏乐
      authority: 可自择下一季接不接席，身契年内的去留须由当家人裁夺
      resource: 置屋廊下的熟客情面与一只自己攒钱的旧荷包
      limitation: 身契抵着家里欠下的药钱，赎身须经当家人点数落账
      obligation: 门内座次与称呼按旧礼，收下什么当面交当家人过目
      exposure: 奉公年季里私会生客被记进账页，赎金就要翻倍计
    player:
      identity: 置屋药钱借贷的经手债主
      baseline: 你握着她家那笔药钱的借据，也清楚逼紧一步，这笔账就要变成别家的生意。
      resources:
      - 盖了章的借据副本
      - 当家人认得的商号担保
      reputation: 收账认数目，不拿人抵数
    relationship_reason: 见习艺伎每季把省下的工钱送到你柜上还息，你曾在当家人面前替她把一笔利钱改成缓期；如今身契只剩一年，她在玄关把账页翻给你看。
  activities:
    辨认旧屋木纹:
      places:
      - 鸭川河畔町屋雨廊
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}在干燥廊边摆出两块木样，让你看旧柱纹路是否延续。'
      beats:
        trigger: '{npc}在干燥廊边摆出两块木样，让你看旧柱纹路是否延续。'
        objective: 区分表面水痕与需要屋主再请匠人确认的腐损
        choice: 比较两块木样；只听屋主讲旧痕不动手
        immediate: 可复用与待查部位分开，今天不因看了木纹就拆屋
        near: 屋主可据此选保旧痕或换外皮，修缮另行约工
    修整练习用具:
      places:
      - 壬生屯所阴暗道场
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}在管事准许的门侧放下散开的护具系绳，请你试一种更好解的绕法。'
      beats:
        trigger: '{npc}在管事准许的门侧放下散开的护具系绳，请你试一种更好解的绕法。'
        objective: 让借用护具稳固又能自行解开
        choice: 一起换绳试绕；只挑出裂损木刀不接修补
        immediate: 换好的系绳先在空护具上拉拽，裂损木刀不放回练习架
        near: 下一次借用者可反馈松紧，不要求参与者加入道场
    商量艺事邀帖称呼:
      places:
      - 神乐坂置屋
      pairs:
      - 0
      category: 信息交换
      action: '{npc}在江户停留的接帖时段读出邀帖，问这句问候会不会让收帖人误认成代谁邀约。'
      beats:
        trigger: '{npc}在江户停留的接帖时段读出邀帖，问这句问候会不会让收帖人误认成代谁邀约。'
        objective: 学会把私人观艺邀请与道场名义分开
        choice: 试读两种说法；只谈演目不代递帖
        immediate: 当家人听懂邀请是谁发起，不因客套被写成已答应赴会
        near: 回信仍需人递，是否赴会由收帖人决定，京都不会当夜得知
    教一个动作:
      places:
      - 壬生屯所阴暗道场
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}在门侧教一个动作：把护具系绳绕成能单手解开的样子，再要你原样解一遍给他看。'
      beats:
        trigger: '{npc}在门侧教一个动作：把护具系绳绕成能单手解开的样子，再要你原样解一遍给他看。'
        objective: 把解绳的动作练到不必低头也能完成
        choice: 跟着练到手熟；只看一遍不接手
        immediate: 手上的结当场解开，木刀放回墙架不再横在门侧
        near: 下回借用护具时自己就能解，不必再等书役过来
    教她一个身段:
      places:
      - 祗园艺伎置屋纸拉门后
      pairs:
      - 3
      category: 身体靠近
      action: '{npc}教你一个身段：让她把手腕托在你掌上，教你怎么把玉镯从袖口里递出去而不露痕迹。'
      beats:
        trigger: '{npc}教你一个身段：让她把手腕托在你掌上，教你怎么把玉镯从袖口里递出去而不露痕迹。'
        objective: 学会在宴席上不惊动旁人地交接一件东西
        choice: 照她的姿势练一遍；只看着不碰她的手
        immediate: 镯子顺袖口滑出去又收回来，廊下的宴客声没有停过
        near: 再有人问起镯子的去处，你手上已经有了一套说得过去的动作
    替她挽一次发:
      places:
      - 祗园艺伎置屋纸拉门后
      pairs:
      - 3
      category: 身体靠近
      action: '{npc}坐在镜台前，把一柄玉簪递到你手里，让你替她挽一次发。'
      beats:
        trigger: '{npc}坐在镜台前，把一柄玉簪递到你手里，让你替她挽一次发。'
        objective: 在开席前把发式挽成能撑过整场宴席的样子
        choice: 接过簪子上手挽；只替她递簪子不碰发
        immediate: 发髻挽紧了才插得住簪，腕上那件玉镯随着抬手轻轻磕在镜台边
        near: 席上若有人问起发式是谁挽的，这一句会顺着廊下传回置屋女将耳朵里
    用嘴咬住发绳扎单马尾:
      places:
      - 祗园艺伎置屋纸拉门后
      pairs:
      - 3
      category: 身体靠近
      action: '{npc}背过手去够不到后领，要你用嘴咬住发绳扎单马尾，说这样拢得最紧。'
      beats:
        trigger: '{npc}背过手去够不到后领，要你用嘴咬住发绳扎单马尾，说这样拢得最紧。'
        objective: 赶在开席前把散开的头发束紧，不让廊下的人看出方才动过手
        choice: 咬住发绳照做；把发绳交回她自己扎
        immediate: 单马尾扎紧了，碎发却还贴在颈侧，镜台上多出一根咬断的绳头
        near: 今夜这一束要撑到宴散，散开时若被人看见绳头，话题就落在这间里间
    用掌心温热她腕上冰凉的翡翠玉镯:
      places:
      - 祗园艺伎置屋纸拉门后
      pairs:
      - 3
      category: 身体靠近
      action: '{npc}把手腕伸过来，让你用掌心温热她腕上冰凉的翡翠玉镯——从雨里回来，镯子一直凉得刺骨。'
      beats:
        trigger: '{npc}把手腕伸过来，让你用掌心温热她腕上冰凉的翡翠玉镯——从雨里回来，镯子一直凉得刺骨。'
        objective: 把镯子暖回能戴的样子，也把这只镯子的来路问清楚
        choice: 握住手腕把玉镯焐热；只烧一盆炭火让她自己烤
        immediate: 镯子焐回体温，她腕上绕着的绳结松了半圈
        near: 这只镯子若真按她说的当掉，下回再问起就不该在别人手上
    递上一块干净白布替她拭刀:
      places:
      - 壬生屯所阴暗道场
      pairs:
      - 1
      category: 日常接触
      action: '{npc}把泡在场角木盆里的刀拎出来，让你递上一块干净白布替她拭刀。'
      beats:
        trigger: '{npc}把泡在场角木盆里的刀拎出来，让你递上一块干净白布替她拭刀。'
        objective: 把刀上的水与暗色擦净，不让它带着痕迹过夜
        choice: 接过来顺着刀身擦到底；只把白布递过去不动刀
        immediate: 白布上留下一道洗不掉的暗色，刀归回墙架，木盆的水当场泼到场角
        near: 明日点验器具时这柄刀要过管事的手，布上的痕也顺带被记住
    桥番扣刀问夜:
      places:
      - 四条大桥桥番小屋
      pairs:
      - 2
      category: 第三方与打断
      action: '{npc}把当夜扣下的长刀名牌推到你面前，问你昨夜过桥的人里哪一个名字该落在这块牌上。'
      beats:
        trigger: '{npc}把当夜扣下的长刀名牌推到你面前，问你昨夜过桥的人里哪一个名字该落在这块牌上。'
        objective: 在开审之前弄清谁的名字会被写进桥番的扣留簿
        choice: 老实报出自己那一笔；只说见过人影不认名字
        immediate: 名牌与扣留簿一起压在灯下，桥番按当夜所见决定放谁先回去
        near: 名字一落进簿子就得等奉行所开审，撤回只能由持簿的人自己动手
    核对年季身契的账页:
      places:
      - 神乐坂置屋
      pairs:
      - 4
      category: 调查与核验
      action: '{npc}在接帖玄关的低案上摊开年季账页，把今年还过的息钱一笔笔指给你看。'
      beats:
        trigger: '{npc}在接帖玄关的低案上摊开年季账页，把今年还过的息钱一笔笔指给你看。'
        objective: 对清账面余数，弄清赎身还差哪一笔
        choice: 当场核账写回执；只听数目不落笔
        immediate: 账页与借据并排放在案上，里间的当家人听得见每一句
        near: 回执送到商号后利钱按新数计，年内赎身与否仍由她自己启口
  customs:
  - 借场结束后，来客会把自己的木牌从门旁取回。
  - 过桥被盘问的人在放行前会把刀柄调向里侧，算是给桥番一个交代。
  - 里间动过手之后，置屋的人会把镜台上的碎发与断绳一并收进纸篓，不留到下一场席。
  pressures:
    修缮委托签名不明:
      source: 鸭川屋主递来的修缮单只写了代办人的别称，屋主三日后启程离京，动工与付工钱都要在那之前落定；单据上既没有本名也没有花押，签下去的人就要替这笔工钱认账。
      engines:
      - 身份风险
      - 债务压力
      beats:
        trigger: '{npc}发现鸭川屋主递来的修缮单只写了代办人的别称。'
        objective: 在不可逆拆换前确认谁能授权与付工钱
        choice: 请屋主当面认单；只做不拆件的查看等回信
        immediate: 木料不下锯，工匠保留今天已做查看的费用说明
        near: 等待会占住木料，双方可谈退回未加工的新材
      far_trigger: 下一份修缮开工日到来仍无人承认尾款
      far_consequence: 工匠要退料或错过别家工期；直接确认授权则可重排，不把欠账转给传信人
      bindings:
      - activity: 辨认旧屋木纹
        place: 鸭川河畔町屋雨廊
        pair: 0
      - activity: 商量艺事邀帖称呼
        place: 神乐坂置屋
        pair: 0
      exits:
      - 结清已做查看后退回未加工木料
      - 退出未授权拆换，把单据还给屋主
    道场借用时段重叠:
      source: 管事给两组练习者的木牌写着同一借场时段，一方的练习日只剩当夜可用；场中器具要先还清才准交出去，改期的一方须自己回管事席前销牌。
      engines:
      - 资源锁定
      - 第三方施压
      beats:
        trigger: '{npc}发现管事给两组练习者的木牌写着同一借场时段。'
        objective: 把器具修整与练习时段分开，不借机给人授通行权
        choice: 请管事决定分时；先还用具把修补另约
        immediate: 门侧修补停止扩摊，已拆的护具单独收好，场中不混两组人
        near: 被改期一方可以选择退还借场费用，不承担额外值守
      far_trigger: 下次仍重复发牌且要求书役私下顶班
      far_consequence: 书役失去可用轮休，两组练习者可能另借场；清楚分时能保持日常借用
      bindings:
      - activity: 修整练习用具
        place: 壬生屯所阴暗道场
        pair: 1
      - activity: 教一个动作
        place: 壬生屯所阴暗道场
        pair: 1
      exits:
      - 交还木牌，取走个人工具离屯所
      - 将未修器具标清交管事，另约白日时段
    倒幕盟约名单险些遗落:
      source: 凭着手递书信往来的一份倒幕盟约名单险些遗落在鸭川町屋的转手信里，抄件与原件分装两封、收信人各不同；名单一旦落到桥番或屯所执事手上，凡经手递信的人都算知情不报。
      engines:
      - 秘密暴露倒计时
      - 身份风险
      beats:
        trigger: '{npc}在木牌箱旁翻出两封未署名的转手书信，其中一封的分量明显不对。'
        objective: 在名单落到第三个人手上之前弄清该把它交给谁
        choice: 当面交还屋主并要他认领；原封不动放回等收信人来取
        immediate: 两封书信都压在木牌箱底，递信的人与收信的人当天谁都没露面
        near: 名单还在京都流转，经手过的人各自心里都记着这一封
      far_trigger: 桥番或执事开始按名册追查经手书信的人
      far_consequence: 查到谁手上断过信就要按知情不报论处，连家眷一同受问；及时交还则可只作一次误投
      bindings:
      - activity: 辨认旧屋木纹
        place: 鸭川河畔町屋雨廊
        pair: 0
      exits:
      - 把两封书信原样交回屋主，退出这次传递
      - 将自己的名字从传递名单上销去，此后不再接这类手递
    演出帷幕即将拉开:
      source: 置屋下一场宴席的帷幕即将拉开，女将已在廊下催场，而里间那只寄存的玉镯还没清点；开席前点不出原物，就要按旧礼在席上当众追责。
      engines:
      - 时限逼近
      - 池田屋突袭前夜密函截获
      beats:
        trigger: '{npc}听见廊下女将催场的声音已经到了纸拉门外。'
        objective: 在帷幕拉开之前把里间的东西与手上的活儿都收拾干净
        choice: 当场清点并交出玉镯；先按她说的把手尾收妥再说
        immediate: 发绳与碎发收进纸篓，镯子重新绕回腕上，纸拉门拉开时廊下已开席
        near: 今夜的席面撑过去了，女将明早仍要点验寄存之物
      far_trigger: 女将清账日当面点验寄存之物
      far_consequence: 对外点不出原物就要按旧礼逐层追责，掌眼人从此再进不了置屋的里间；先说清来路则只赔一笔工钱与一年的交情
      bindings:
      - activity: 替她挽一次发
        place: 祗园艺伎置屋纸拉门后
        pair: 3
      - activity: 教她一个身段
        place: 祗园艺伎置屋纸拉门后
        pair: 3
      exits:
      - 把手镯交回女将当面清点，退出这一笔
      - 退出里间不再掌眼，只按旧礼以客身告辞
    洗刀水色变红的瞬间:
      source: 场角木盆里的洗刀水色变红的瞬间，正好与桥番夜里扣下长刀名牌是同一天；执事的队务名册上少了一笔出勤，两处记的是同一个人，只等次日开审对上。
      engines:
      - 旧案重开
      - 共同秘密
      beats:
        trigger: '{npc}把泡在场角木盆里的刀拎出来，水色已经泛红。'
        objective: 在两本册子对上之前弄清这一笔该怎么记
        choice: 把刀与白布一起交执事落册；先洗净木盆当无事发生
        immediate: 白布上的暗色擦不掉，木盆的水泼在场角，刀归回墙架
        near: 明日点验器具时这柄刀要过管事的手，桥番的扣留簿也会同日开审
      far_trigger: 奉行所开审而队务名册尚未销掉那一笔
      far_consequence: 两本册子对不上就要传执事与桥番同席问话，脱队的名由会落在队规上；先对平则只作一次桥禁处分
      bindings:
      - activity: 递上一块干净白布替她拭刀
        place: 壬生屯所阴暗道场
        pair: 1
      exits:
      - 认下桥禁处分，退回町屋一侧等开审
      - 把名牌交给执事带回屯所，两处各自落册
    池田屋突袭前夜密函截获:
      source: 池田屋突袭前夜的一封密函在四条大桥桥口被桥番截获，函中列着当夜出队的人名；持函者按桥禁先扣在羁所候审，只等奉行所开审，而名册上那几个名字还挂在屯所的出勤里。
      engines:
      - 刺客身份被同枕之人识破
      - 名额只能给一个人
      beats:
        trigger: '{npc}把截获的密函与扣下的名牌同时推到灯下，问你名单上的名字该不该念出来。'
        objective: 在开审之前决定替谁把名字从册子上抹掉、又把谁留在上面
        choice: 按桥番所见如实供出持函者；只认函不认人把事推回队里
        immediate: 密函封回原样压在扣留簿下，名牌暂不挂上墙钉
        near: 念出名字的人当夜就动不了身，留下的人要独自面对次日屯所的问话
      far_trigger: 奉行所次日开审而屯所名册当日销账
      far_consequence: 被念出名字的那一个从此与同席之人再难同枕；瞒住则要在队规与桥禁之间找一条两边都不追究的缝
      bindings:
      - activity: 桥番扣刀问夜
        place: 四条大桥桥番小屋
        pair: 2
      - activity: 用嘴咬住发绳扎单马尾
        place: 祗园艺伎置屋纸拉门后
        pair: 3
      exits:
      - 认下桥禁处分，退回町屋一侧等开审
      - 把密函原封交执事带回屯所，两处各自落册
    身契赎金差最后一笔:
      source: 置屋年季身契只剩一年可赎，账面还差最后一笔药钱；当家人允她以加接三年奉公抵差额，而借据在你手里，认不认这笔折算全看你今日落不落笔回执。
      engines:
      - 债务压力
      - 名分悬置
      beats:
        trigger: '{npc}把账页推到你面前，指尖停在还差的那一栏。'
        objective: 在加接三年与今日认账之间把折算的数目说清
        choice: 按原数写回执只收息；当场认下折算改契
        immediate: 账页合上时里间的当家人应了一声，席面的事谁都没再提
        near: 回执一日不落笔，她照旧出席陪席，赎身之议顺延一季
      far_trigger: 季末清账日当家人按加接三年的新契落册
      far_consequence: 新契一落册她再难脱身，你手里那张借据从此只值纸面数目；赶在落册前对清余数则可按年赎身，两边的名分都留在账上
      bindings:
      - activity: 核对年季身契的账页
        place: 神乐坂置屋
        pair: 4
      - activity: 用掌心温热她腕上冰凉的翡翠玉镯
        place: 祗园艺伎置屋纸拉门后
        pair: 3
      exits:
      - 写明只按原数收息的回执后告辞，改契之议交还当家人
      - 把借据副本留在案上供当家人核对，本人先退到玄关外
  legacy_sources:
    eras:
    - 文久幕末京都风云
    aesthetics:
    - 幕末残雨物哀
    - 和风物哀
    places:
    - 鸭川河畔町屋雨廊
    - 壬生屯所阴暗道场
    - 神乐坂置屋
  themes:
  - 旧木修缮里的取舍
  - 道场日用与公开身份的距离
  - 跨城艺事往来中的分寸
  - 桥禁、名册与旧礼之间的进退
  technology_boundary: 文久年间以木作手工具、油灯、纸帖和人递书信为主，不使用电灯或即时通信。神乐坂置屋作为江户的一处虚构艺事经纪住处，不借用后来成熟花街的规模设定；京都到江户的交往必须跨多日旅程。新增的祗园艺伎置屋与四条大桥桥番小屋同样靠纸簿、木牌与人力传递运转：桥禁靠桥番当面盘查与扣刀、次日由奉行所开审定夺，队务名册与桥番扣留簿均为手写，两处对不上只能靠传人问话，没有任何即时通传的手段。
  bridge_status: bridge_required
  bridge_explanation: 京都的鸭川、壬生与江户神乐坂不是同城地点。神乐坂活动只在明确经过多日旅程、寄信往返或另起江户停留段后进入；不能沿京都街巷直接抵达。祗园艺伎置屋纸拉门后设在京都一侧，与鸭川河畔町屋雨廊同在京都，两者之间按町内步行计；四条大桥桥番小屋位于桥头，从屯所或町屋前往均须写明走法与所费时辰。
