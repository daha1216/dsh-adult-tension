      - 把整晚的试光改成白天共同进场
    权力易手:
      source: 能力登记所的主任位置要换人，新来的一把手先翻旧账；担保与连带的那几栏正被逐条对着看。
      engines:
      - 组织更迭
      - 旧案重开
      beats:
        trigger: '{npc}说新主任明天到任，今天要把手上没结的备案交清。'
        objective: 在交接前把该由自己认的那一栏认下来
        choice: 当面把填错的一栏改回并各自签一次；或整张作废重填，留空等新主任接手
        immediate: 改动当场签字留档，接任的人只接已签过的部分
        near: 新主任上任后逐条对旧账，签过的不再翻，没签的要一件件说
