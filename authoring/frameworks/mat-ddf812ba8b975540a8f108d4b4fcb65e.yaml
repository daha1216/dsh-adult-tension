      - activity: 在布展现场掐一次试光时间
        place: 画廊个展布展现场
        pair: 0
      exits:
      - 交回全部经手的登记页，退出这次交接
      - 接受新主任的条件，重新登记一遍
    直播意外事故:
      source: 整场直播里能力供给突然断了一次，镜头没关，画面里接下去的那几秒被几万个人记住。
      engines:
      - 消息误发
      - 身份风险
      beats:
        trigger: '{npc}指着屏幕上还在跳的弹幕，说刚才那几秒已经出去了。'
        objective: 在剪辑与转播之前把能收回的收回，其余当面讲清
        choice: 当场停播并出一次书面说明；或关掉评论硬撑到结束
        immediate: 画面当场切黑，说明的稿子由出事的人自己念
        near: 转播的片段一天里就散开，谁先讲清谁就少一条把柄
      far_trigger: 片段被剪成十几秒的短片单独传开
      far_consequence: 事故被当成能力的真实水平写进评价，接下去的场次要被重议；先讲清则可只当作一次意外
      bindings:
