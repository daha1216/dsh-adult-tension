      - 交回供给凭据，退出这份补给契约
    妖丹寄生与人妖双魂争夺:
      source: 身上寄着一颗妖丹，日子一长就争起这一副身体；白天的说法和半夜的说法对不上，身边的人先看出了差别。
      engines:
      - 妖丹寄生与人妖双魂争夺
      - 身份风险
      beats:
        trigger: '{npc}指出你昨夜说过一句与白天相反的话，并且记得清清楚楚。'
        objective: 把这件事说给最近的人，别让两个说法各说各的
        choice: 当面讲出那颗妖丹的事；或先瞒着，只把夜里的话推给记错
        immediate: 讲清之后取丹的时辰由两人一起定，不趁夜里动手
        near: 瞒过去的每一夜都在替对方留出争的时间，讲清则还有把丹取出来的余地
      far_trigger: 那副身体在夜里做出了白天绝不认的事
      far_consequence: 旁人先看出差别，替着解释的人也被算进去；先讲清则可只按取丹一件事办
      bindings:
