        place: 深夜机场候机区
        pair: 1
      exits:
      - 退出这一场直播，把后续交给同场的人
      - 改用普通办法完成剩下的环节
    催眠暗示的潜伏生效:
      source: 一句当时听着像玩笑的话，过了几个月才按当初说好的时机落下来；落下来的时候人还在别人跟前。
      engines:
      - 催眠暗示的潜伏生效
      - 身份错位
      beats:
        trigger: '{npc}发现你说出了一句早几个月才提过的话，说的时机却分毫不差。'
        objective: 在暗示完全落下来之前把这件事说破
        choice: 当面把当初那句原话讲清；或先找懂这块的人问一遍再决定说不说
        immediate: 说破之后暗示的效力当场松动，两人的位置也换了回来
        near: 讲清的那一句往后就是两人的凭据，留着不说则每次发作都要重新认一次
      far_trigger: 暗示在第二次约定的时机再落一次
      far_consequence: 当着外人落下来，说话的人就成了另一个人；先说破则只在两人之间收束
      bindings:
      - activity: 在便利店换一次货架上的供给
        place: 深夜便利店
        pair: 1
      - activity: 在候机区核对登记供给量
        place: 深夜机场候机区
        pair: 2
      exits:
      - 请人来作见证，把当初那句话登记备案
      - 退出这段往来，不再单独见面
    契约精怪:
      source: 柜台上那只看不出材质的摆件是契约精怪，替人管着写下的条款；它认的是纸上写过的那几行，不认后来改的口头话。
      engines:
      - 契约精怪
      - 共同秘密
      beats:
        trigger: '{npc}把那只摆件推到桌中间，说它认的是当初写下的几行。'
        objective: 把两人私下改过的部分写回纸上，让精怪认下
        choice: 当场补写并各自按一次手印；或只按原文办，把改过的口头话作废
        immediate: 补写的几行当场生效，私下那部分不再作数
        near: 精怪认过的那几行往后就是硬账，口头改的再不算数
      far_trigger: 下一次交割日精怪按原文索取
      far_consequence: 私下改过的那部分被当成没有过，两人的往来被逐行重算；补写过则照新的一版走
      bindings:
      - activity: 在候机区核对登记供给量
        place: 深夜机场候机区
        pair: 2
      - activity: 在布展现场掐一次试光时间
        place: 画廊个展布展现场
        pair: 0
      exits:
      - 终止这一份契约，把摆件交回原处
      - 只按原文履行，不再另立口头约定
    契约魔力枯竭:
