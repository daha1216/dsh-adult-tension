id: mat-ddf812ba8b975540a8f108d4b4fcb65e
name: 灵气复苏十年后
material:
  eras:
  - 架空都市
  aesthetics:
  - 都市妖异奇谭
  - 暖色生活流
  - 蒸汽与黄铜
  rule: 超自然能力已经成为公共服务，能力登记与普通生活彼此牵制。妖异藏在人堆里，靠登记过的能力指标查不出来，只能按本人肯不肯交代来辨；能力不是白给的，用多少要按登记过的供给量补，透支到枯竭就要找人补上一程。
  social_rule: 能力服务按本人确认的项目收费，邻里可以选择普通技术替代；替人担保就要连带担责，签字的人与用能力的人共担后果。
  places:
    能力检修站:
      details:
      - 便携校准仪与声样清除键都朝向灯主·日间
      - 测试台分放供能与识别模块·日间
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 检修站前门
        witnesses:
        - 同班调试师
        - 等待领灯的顾客
        affordances:
        - 调试会认人的台灯
        - 结束活动并离开
        pressure_modifiers:
        - 仪表可用量程
        - 灯主愿意提供的测试条件
    社区灵气站:
      details:
      - 普通滑垫与能力版工具并排放在柜台·傍晚
      - 经验留言卡中空白署名栏朝外·傍晚
      profile:
        privacy: low
        visibility: high
        exits:
        - 社区站临街门
        witnesses:
        - 值站协调员
        - 来借工具的居民
        affordances:
        - 交换一周的生活小窍门
        - 结束活动并离开
        pressure_modifiers:
        - 借用工具余量
        - 居民自行安排的试用时间
    夜间培训室:
      details:
      - 断能灯座与电池盒分成两个教学托盘·夜
      - 灯罩试装桌旁留着旁听座位·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 教室门外走廊
        witnesses:
        - 成年夜校学员
        - 当班讲师
        affordances:
        - 体验灵气小夜灯课程
        - 结束活动并离开
        pressure_modifiers:
        - 耗材份数
        - 下课归还工具时间
    深夜便利店:
      details:
      - 便利店靠门一侧摆着冷藏柜与能力安全须知，货架上的价签同时标普通版和能力版·夜
      - 自助结账台旁留一处不联网的现金窗口，值夜的店员守在门口·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 从临街的自动门离开，门外是深夜的街面
        witnesses:
        - 值夜的店员或进店的其他客人
        affordances:
        - 对照普通版与能力版的价格
        - 用现金结一次不在记录里的账
        pressure_modifiers:
        - 当夜货架上还剩多少供给
        - 店员认不认得常来的面孔
    深夜机场候机区:
      details:
      - 候机区的连排座椅面向落地窗，航班屏在换页时整片暗一下·夜
      - 登机口旁的充电台分普通插座与能力供能口，广播盖过两个人的说话声·夜
      profile:
        privacy: medium
        visibility: high
        exits:
        - 按登机口开放时段入闸，或退回到达层出口离站
        witnesses:
        - 同时候机的旅客或值机台的地服人员
        affordances:
        - 核对登记证件上填的供给量
        - 在普通插座与供能口之间选一处
        pressure_modifiers:
        - 航班延误还要等多久
        - 供能口还能被用过几次
    画廊个展布展现场:
      details:
      - 布展现场把待挂的作品与管线的走向标在地上·夜
      - 射灯只开一半，布展人把剩下的试光时间掐在闭馆前·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经货梯撤出展厅，闭馆后不再单独留场
        witnesses:
        - 布展的木工或画廊当班的人
        affordances:
        - 调一次射灯亮度看作品颜色
        - 把试光用的电与工时记成实账
        pressure_modifiers:
        - 闭馆前还能试几次光
        - 木工与电工的进场顺序
  pairs:
  - family: 学术与专业
    position: 同侪
    appellations:
    - 直呼其名
    - 师兄
    npc:
      role: 能力调试师
      function: 分别校准设备识别与供能模块
      authority: 可暂停不稳定测试并清除本机临时声样
      resource: 便携校准仪与低功耗测试载荷
      limitation: 不认证使用者能力等级，不能清除外部已存信息
      obligation: 告知测试条件与保留数据，不把演示当全工况验收
      exposure: 误判模块会让用户白付换件钱并引发返修
      hidden: —
    player:
      identity: 家用设备设计者
      baseline: 你曾给调试师的台灯样机加过机械开关，使一位不愿录声的居民也能试灯；这次一起比对新模块。
      resources:
      - 可拆装的低功耗样机
      - 设计中的机械替代开关
      reputation: 你在乎功能可用，不坚持人人用能力模式
    relationship_reason: 你曾给调试师的台灯样机加过机械开关，使一位不愿录声的居民也能试灯；这次一起比对新模块。
  - family: 医疗与照护
    position: 旧识
    appellations:
    - 直呼其名
    npc:
      role: 社区灵气协调员
      function: 协调居民可选择的省力工具与无障碍生活服务
      authority: 可安排本站借具时段和一次使用陪伴
      resource: 服务排班表、普通滑垫和可借的辅助工具
      limitation: 不诊断疾病，不替居民决定选普通版还是能力版，不能要求居民交出与借具无关的经历
      obligation: 问清实际难处后提供替代办法，结束前说清归还与交接
      exposure: 忽略普通方案会让一部分居民放弃本站服务
      hidden: —
    player:
      identity: 社区夜校讲师
      baseline: 社区站的借具登记与夜校课程报名共用一套表格，登记范围一有调整，协调员就在傍晚交接时与你对一遍，让普通课程不被新字段卡住。
      resources:
      - 成人生活技能课程材料
      - 能借来演示的普通电池灯
      reputation: 你能教明白步骤，不以选普通版判断学员落后
    relationship_reason: 社区站的借具登记与夜校课程报名共用一套表格，登记范围一有调整，协调员就在傍晚交接时与你对一遍，让普通课程不被新字段卡住。
  - family: 权力与治理
    position: 公会契约使魔
    appellations:
    - 主任
    npc:
      role: 能力登记所主任
      function: 审核能力登记与供给量，管着担保与连带的备案
      authority: 可暂停未备案的能力使用并调阅登记页，不能替本人决定用不用能力
      resource: 登记底册、可查的历史供给记录与担保备案表
      limitation: 不诊断、不认证个人能力等级，也不能凭熟识调取居民未登记的私人经历
      obligation: 逐栏说明要他签的是什么，不把演示或口头委托当成备案
      exposure: 放行错的一栏会连带担保人一起被追，登记所的信誉也跟着掉
    player:
      identity: 正在登记备案的能力使用者
      baseline: 你手上的能力早就超过了当初报上去的量，却一直靠老主任睁一只眼；这次要签的那张表，签下去就是自己也担着。
      resources:
      - 夹在证件里的旧登记页
      - 一份还没交上去的补充说明
      reputation: 报过的量从不往少里改
    relationship_reason: 你当年那份登记是老主任一手办的，后来供给量有一栏填错，两人各自担了一部分；这次补正，签的人还是同一个。
  activities:
    调试会认人的台灯:
      places:
      - 能力检修站
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}让台灯在相同距离听两个人的同一句指令，请你观察指示灯是否响应。'
      beats:
        trigger: '{npc}让台灯在相同距离听两个人的同一句指令，请你观察指示灯是否响应。'
        objective: 判别台灯不亮是未认出指令还是电量不足
        choice: 试一条指令，或只看仪表；不愿留下声样可改用机械开关测试
        immediate: 识别与供能分别得出结果，不以灯没亮推断使用者能力不足。
        near: 灯主可选清除声样、修识别模块或继续手动开灯，只为选择的项目安排后续。
    交换一周的生活小窍门:
      places:
      - 社区灵气站
      pairs:
      - 0
      - 1
      category: 信息交换
      action: '{npc}从留言卡里挑出一条搬轻物的小窍门，先用普通滑垫演示，再问你家里哪一步最麻烦。'
      beats:
        trigger: '{npc}从留言卡里挑出一条搬轻物的小窍门，先用普通滑垫演示，再问你家里哪一步最麻烦。'
        objective: 比较能力版与普通版的生活办法
        choice: 试一下滑垫，或只说自己的办法；不分享家事可看公开演示
        immediate: 大家比较用时与费力程度，不以能力强弱排名。
        near: 愿意的人借走已登记的演示工具，经验卡可匿名或不留，协调员只约一次归还时间。
    体验灵气小夜灯课程:
      places:
      - 夜间培训室
      pairs:
      - 0
      - 1
      category: 照护与修复
      action: '{npc}把断能灯座、灯罩和电池版本放在同一张教学桌上，请你先选供能方式。'
      beats:
        trigger: '{npc}把断能灯座、灯罩和电池版本放在同一张教学桌上，请你先选供能方式。'
        objective: 做一盏知道如何停用和补能的小灯
        choice: 组一盏或拆看示范件，也可只挑灯罩由讲师演示
        immediate: 灯罩装到合适位置，使用者实际试过停用方式，耗材成本随版本讲清。
        near: 灯归制作者带回，出现不亮可先停用并带回课堂，不要求购买能力服务或续课。
    在便利店换一次货架上的供给:
      places:
      - 深夜便利店
      pairs:
      - 1
      category: 日常接触
      action: '{npc}把两版同款摆在一起，问你家里那步到底缺的是哪一样。'
      beats:
        trigger: '{npc}把两版同款摆在一起，问你家里那步到底缺的是哪一样。'
        objective: 按实际缺什么选一版，不按能力强弱挑
        choice: 选普通版；或说明非用能力版不可的那一步
        immediate: 选好的一版当场结账带走，另一版放回货架
        near: 选过的那一版往后就是默认，改要再说一遍为什么
    在候机区核对登记供给量:
      places:
      - 深夜机场候机区
      pairs:
      - 2
      category: 调查与核验
      action: '{npc}把登记凭证摊在充电台上，问你供给量这一栏是不是你自己填的。'
      beats:
        trigger: '{npc}把登记凭证摊在充电台上，问你供给量这一栏是不是你自己填的。'
        objective: 把填错的一栏当场改回来，不替签字的人认下
        choice: 当场改回并各自签一次；或整张作废重填，留空等下一班
        immediate: 改过的一栏由本人签字，签字人不替对方认这一栏
        near: 这一栏往后按签字认人，改一次就要多担一次
    在布展现场掐一次试光时间:
      places:
      - 画廊个展布展现场
      pairs:
      - 0
      category: 照护与修复
      action: '{npc}把射灯支到作品正前方，问你把剩下的试光时间留给哪一幅。'
      beats:
        trigger: '{npc}把射灯支到作品正前方，问你把剩下的试光时间留给哪一幅。'
        objective: 把闭馆前的试光次数用在最要紧的那幅上
        choice: 挑一幅试到底；或分给两幅各试一次
        immediate: 试光结果当场定下挂位，用过的时间记进实账
        near: 押在那一幅上就要展出时照样担着，分着试则两幅都不透
    在候机区替对方留一处供能口:
      places:
      - 深夜机场候机区
      pairs:
      - 1
      category: 空间与退出
      action: '{npc}把行李挪开，在供能口旁的座位留出一处，问你走不走这一趟。'
      beats:
        trigger: '{npc}把行李挪开，在供能口旁的座位留出一处，问你走不走这一趟。'
        objective: 把去留当场定下，别把座位一直空着
        choice: 坐下把这一程一起走完；或把位子还回去，各走各的航班
        immediate: 走或留当场定下，留出的座位归回原处
        near: 留下的那个位子会被别人坐走，改主意就没有第二处
  customs:
  - 便利店货架旁就有能力安全须知，没人再为它专门停下脚步。
  - 商店同时标注普通版和能力版的服务价格。
  - 邻里夸人的话常是这回真省事，而不是能力多强。
  pressures:
    设备事故责任核对:
      source: 一批公用设备故障被归责于同一家调试站
      engines:
      - 名声保卫
      - 旧事追索
      beats:
        trigger: '{npc}带来消息：一批公用设备故障被归责于同一家调试站。'
        objective: 查清测试记录与使用环节
        choice: 查看留样，或联系报修居民
        immediate: 同批故障设备暂停能力模式，可用机械开关的保留普通照明，不扩大为所有住户停用。
        near: 对照留样和居民自愿重现的用法，只安排有证据指向的返修环节。
      far_trigger: 同批设备下一次交付验收时
      far_consequence: 记录分开标明出厂条件与家用限制；无证据的归责不转为调试站无限免费维修。
      exits:
      - 仅交样机测试结果，退出责任协调
      - 灯主选择普通模式并暂不继续能力模块维修
      bindings:
      - activity: 调试会认人的台灯
        place: 能力检修站
        pair: 0
    登记范围讨论:
      source: 社区拟扩大能力登记的信息范围
      engines:
      - 身份风险
      - 组织更迭
      beats:
        trigger: '{npc}带来消息：社区拟扩大能力登记的信息范围。'
        objective: 提出满足服务需求又不暴露隐私的方案
        choice: 列出必要字段，或征询居民意见
        immediate: 新增字段尚未成为生效借具条件，居民仍可按现行规则使用普通工具。
        near: 协调员收集对必要字段的意见，讲师只示范不用个人经历也能完成的课程。
      far_trigger: 新登记表正式启用前的字段确认时
      far_consequence: 保留最小服务信息可维持借具；若最终仍要求额外资料，居民可拒用登记型能力项目并保留普通课程选择。
      exits:
      - 不提交新增私人信息，改用普通工具或结束本次借具申请
      - 交回已借工具后停止参加本轮意见收集
      bindings:
      - activity: 交换一周的生活小窍门
        place: 社区灵气站
        pair: 1
      - activity: 体验灵气小夜灯课程
        place: 夜间培训室
        pair: 1
    魔力暴走临界:
      source: 用过的能力比报上去的多得多，这一晚手上开始溢出；溢出到某个点上就会连累身边人，而登记备案还没办下来。
      engines:
      - 契约魔力枯竭
      - 时限逼近
      beats:
        trigger: '{npc}发现你手上的热气已经烘到了桌沿，玻璃杯壁起了一层雾。'
        objective: 在溢出之前把用量停下来，别把身边人卷进去
        choice: 照备案流程走一次补正；或先借别处补一程把今夜压过去
        immediate: 用量当场降到能报的数，溢出的那一部分不再往近处去
        near: 借来的那一程往后要按对方的方式还，记账的人不止一个
      far_trigger: 备案仍未办下，溢出的间隔一次比一次短
      far_consequence: 暴走那一下会带走近处的人，连带担保的一栏全被追责；降下用量则只是这一趟白跑
      bindings:
      - activity: 在候机区核对登记供给量
        place: 深夜机场候机区
        pair: 2
      - activity: 在便利店换一次货架上的供给
        place: 深夜便利店
        pair: 1
      exits:
      - 封住能力，改用普通工具过完这一阵
      - 退出这次备案，把表交给下一位经手人
    个展前夜:
      source: 个展明晚就开，试光只剩闭馆前一次；押在最要紧那幅上的工夫，也就只有这一次能证明。
      engines:
      - 时限逼近
      - 名声保卫
      beats:
        trigger: '{npc}把射灯支到作品前，说闭馆前只剩这一次试光。'
        objective: 把唯一的试光机会押在最要紧的一幅上
        choice: 押这一幅试到底；或分给两幅各试一次
        immediate: 挂位当场定下，用过的时间记进实账
        near: 明晚开场那半小时就要见分晓，押错了整场都跟着垮
      far_trigger: 开场后到场的评价盯着最要紧的那一幅
      far_consequence: 押错的那一幅被当成本场的水平，往后约展都要重走一遍；押对则此后按这次的尺寸来
      bindings:
      - activity: 在布展现场掐一次试光时间
        place: 画廊个展布展现场
        pair: 0
      - activity: 在便利店换一次货架上的供给
        place: 深夜便利店
        pair: 1
      exits:
