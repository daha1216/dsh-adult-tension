id: mat-de3184d40c645541b9bea1798a7633c9
name: 蜃景商路与鬼市
material:
  eras:
  - 西域大漠蜃景鬼市
  aesthetics:
  - 西域丝路奇谭
  - 敦煌异色幻梦
  rule: 鬼市沿蜃景迁移，商队靠共同确认的标记寻找仍在原处的摊位；蜃景消散前未沿已确认回路退出的人会原地化为沙雕，这一倒计时不以人手中断，每个入口石钉旁都挂着写给迟归者的回收单。
  social_rule: 货契需注明可验证的实物，不接受替他人许诺的代价；鬼市之间不收金银，只认押出去的真名与一段可交割的记忆，赎回须补足约定的实物差额，逾期即转为公开售卖。
  places:
    胡姬八角琉璃酒肆:
      details:
      - 八角琉璃窗把同一道菜映出不同色泽
      - 酒肆灶边留有旅人试尝的小碟与清水
      - 灶后木匣里压着半缸长明灯油，灯芯已短到贴住灯脚·夜
      profile:
        privacy: low
        visibility: high
        exits:
        - 从实体门槛走向酒肆固定驿院
        witnesses:
        - 掌柜与上菜伙计
        affordances:
        - 共译旅人菜单
        - 试尝后说出自己真正想点的口味
        pressure_modifiers:
        - 当天实际食材
        - 旅人能听懂的语言
    无相鬼市千佛暗窟:
      details:
      - 千佛暗窟入口的实体石钉系着回路绳
      - 移动摊影掠过石像，值守人守着固定入口
      - 每根石钉旁钉着一张回收单，写明本轮蜃景关闭的时刻·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 沿当晚实走确认的绳路退到固定入口驿点
        witnesses:
        - 守入口的向导
        affordances:
        - 试走鬼市回程标记
        - 在入口附近练辨实体路标
        pressure_modifiers:
        - 这一轮蜃景时段
        - 回路绳是否接续
    流沙回廊炼金暗房:
      details:
      - 炼金暗房的样品台与炉区隔着矮墙
      - 封好的颜料样罐旁摆着双方量器，不在客席开炉
      - 矮墙内侧的记账板上，本周押名赎期与人名并列排开·夜
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 由带路人领回已确认的回廊入口，方向不明则留样品台等候
        witnesses:
        - 获准接待的颜料工匠
        affordances:
        - 核对颜料样本
        - 在试样纸上比较获准小样
        pressure_modifiers:
        - 光源色差
        - 量器容积与样罐封存状态
  pairs:
  - family: 语言与传译
    position: 同侪
    appellations:
    - 先生
    npc:
      role: 商路译员
      function: 把菜单与货物条件逐句解释给各方
      authority: 可停下自己不确定的译述并请原说话人重讲
      resource: 两地用词笔记、听懂本地话的掌柜联络
      limitation: 不掌握所有鬼市真名，也不能替买卖双方接受价格
      obligation: 分清字面译法和自己补充的解释
      exposure: 误译食材或数量会让旅人多付钱并失去带路信任
    player:
      identity: 摊位地图绘制人
      baseline: 你习惯先看怎样回来，也想在固定酒肆安稳吃完一顿不用辨方向的饭。
      resources:
      - 绳尺与入口路图
      - 自己随身的一份饮水
      reputation: 先走得回来再谈走多远
    relationship_reason: 译员上次帮绘图人问清石钉的本地称呼，绘图人回报了一条不受摊影诱导的归路。
  - family: 学术与专业
    position: 同侪
    appellations:
    - 先生
    npc:
      role: 摊位地图绘制人
      function: 标出本轮实体锚点与确认走过的回路
      authority: 能撤下自己的失效图，不支配鬼市移动
      resource: 绳尺、已核对的石钉位置与当晚路图
      limitation: 图只对注明时段有效，不能保证每个可见摊影都能抵达
      obligation: 先验证退出路线再带人深入
      exposure: 错认锚点会耗掉他人与自己的饮水和时间
    player:
      identity: 商路译员
      baseline: 你会几种商路语言，但遇到不认识的食材会请掌柜拿实物说明。
      resources:
      - 商旅用词本
      - 愿意帮忙解释的掌柜
      reputation: 听不懂就停，不替人答应
    relationship_reason: 绘图人请译员参加入口试走，让从不同地方来的人都能理解同一组回程标记。
  activities:
    共译旅人菜单:
      places:
      - 胡姬八角琉璃酒肆
      pairs:
      - 0
      category: 日常接触
      action: '{npc}请掌柜端来两口试尝菜，问你想用家乡的什么说法形容这味道。'
      beats:
        trigger: '{npc}请掌柜端来两口试尝菜，问你想用家乡的什么说法形容这味道。'
        objective: 选出今晚真想吃的东西，允许同味不同名
        choice: 可尝后点一份；可只问配料，或吃自己带的干粮
        immediate: 点菜按掌柜实际食材确认，不因名字像家乡菜就假定做法相同
        near: 两人记住彼此口味，菜单建议仅在掌柜愿意时留下
    试走鬼市回程标记:
      places:
      - 无相鬼市千佛暗窟
      pairs:
      - 1
      category: 空间与退出
      action: '{npc}站在入口石钉旁，邀你只走到仍能看见回路绳的第一处折角。'
      beats:
        trigger: '{npc}站在入口石钉旁，邀你只走到仍能看见回路绳的第一处折角。'
        objective: 练习能自行选择何时折返的短路
        choice: 可走一小段即回；可留在入口辨标，或不进暗窟去固定驿院休息
        immediate: 折角处看不清绳路就原路返回，不追逐更亮的摊影
        near: 下一轮蜃景须重新确认，不把今天的试走变成永久通行承诺
    核对颜料样本:
      places:
      - 流沙回廊炼金暗房
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}请工匠把获准小样放在同一光源下，邀你比较色卡与样罐的标记。'
      beats:
        trigger: '{npc}请工匠把获准小样放在同一光源下，邀你比较色卡与样罐的标记。'
        objective: 分清照明色差、译名差异和真正不同批次
        choice: 可对照一组；可请工匠解释，或不取小样只退还色卡
        immediate: 实物和标签一致才继续谈选色，未明之处保持封罐
        near: 选择的颜色可先用于自己的试样，不直接下整批货单
    交出一样东西:
      places:
      - 无相鬼市千佛暗窟
      pairs:
      - 0
      - 1
      category: 信息交换
      action: '{npc}把当票摊在石钉上，问你今天是要交出货、交出押名，还是交出一样能立刻估价的东西换延期。'
      beats:
        trigger: '{npc}把当票摊在石钉上，问你今天是要交出货、交出押名，还是交出一样能立刻估价的东西换延期。'
        objective: 在蜃景关闭前把这一笔当票结清或换到喘息
        choice: 可按当票交货；可押一段记忆换延期；或当场拒绝交割并承担违约
        immediate: 交割记入石钉旁的回收单，未结的那一笔写明赎回期限
        near: 逾期未赎的押品转入公开售卖，押名的人在这条商路上再报不出名号
    把关键物品留在原地后离开:
      places:
      - 流沙回廊炼金暗房
      pairs:
      - 0
      category: 空间与退出
      action: '{npc}把封好的样罐放回样品台正中，说这一批她不带走。'
      beats:
        trigger: '{npc}把封好的样罐放回样品台正中，说这一批她不带走。'
        objective: 退出这一轮交易但保留下次谈的余地
        choice: 可留下样罐只带走自己那份小样；可请工匠封存改日再议；或直接终止这趟交易
        immediate: 样罐封条原样不动，记账板上的当票继续按原期计息
        near: 留物不留下承诺，下次再谈时价格另议，押期仍按原日往前滚
    替他拂去罗盘上的青铜尘土:
      places:
      - 流沙回廊炼金暗房
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}的罗盘盘面蒙着青铜尘土，他正单手托着账册腾不开手。'
      beats:
        trigger: '{npc}的罗盘盘面蒙着青铜尘土，他正单手托着账册腾不开手。'
        objective: 让他看清指针读数却不动他的盘
        choice: 可替他拂去尘土并读出指位；可递一块软布让他自己擦；或先看账册不碰盘
        immediate: 盘面露出刻度，指针指向的仍是同一处锚点
        near: 读数一致时两人可继续核对同一张账册，不一致则另约白天重测
    替她挽紧被狂风吹散的红纱面罗:
      places:
      - 胡姬八角琉璃酒肆
      pairs:
      - 0
      category: 日常接触
      action: '{npc}跨过门槛时一阵穿堂风把她脸上的红纱面罗吹散，她两只手都端着酒盏。'
      beats:
        trigger: '{npc}跨过门槛时一阵穿堂风把她脸上的红纱面罗吹散，她两只手都端着酒盏。'
        objective: 让她的面罗重新系稳，不借机看清她不想露出的样子
        choice: 可替她把面罗挽回耳后系紧；可只把酒盏接过来让她自己整理；或提醒她门槛风大
        immediate: 面罗重新系好，纱面朝向由她自己调整，你退开半步
        near: 同一顿饭里她可能自己提起为何遮面，也可能一句不提，两者都不欠后续
    第三方拿走关键物品:
      places:
      - 无相鬼市千佛暗窟
      pairs:
      - 1
      category: 第三方与打断
      action: '{npc}刚把回路绳的一端交到你手上，另一支商队的带路人从暗处伸手解走了那个结。'
      beats:
        trigger: '{npc}刚把回路绳的一端交到你手上，另一支商队的带路人从暗处伸手解走了那个结。'
        objective: 确认谁有权动这条绳，不在暗窟里跟人拉扯
        choice: 可当场请值守向导裁断归属；可先退出暗窟到驿院再说；或放弃这条绳改走已实走短段
        immediate: 绳索归属未清前两人都不再往深处走，手上动作停在石钉以内
        near: 少一条绳就少一条退路，若当轮蜃景关闭前仍未取回，两人只能按最保守的短线离市
  customs:
  - 摊主把已经验证的路标画成实线，尚未走过的路画成点线。
  - 交割当场照抄一份当票压在石钉下，赎回时凭本人报出的真名取回。
  pressures:
    蜃景路标偏移:
      source: 入口附近的摊影与路图不再重合，旧折角看不到续接绳。
      engines:
      - 时限逼近
      - 蜃景坍塌与沙海掩埋倒计时
      beats:
        trigger: '{npc}发现入口附近的摊影与路图不再重合，旧折角看不到续接绳。'
        objective: 退回可确认锚点再决定等待还是离市
        choice: 原路回石钉请刚归来的向导说明；或结束试走在固定驿院等下一轮
        immediate: 不再多走一角，随身饮水留作返驿点使用
        near: 失效图不再带新人，等新的路段实际走回后才补线
      far_trigger: 下一轮蜃景关闭前仍无法确认回廊入口
      far_consequence: 本轮交易计划取消，摊主与旅人另选固定驿院碰面，不用继续消耗饮水追摊影
      bindings:
      - activity: 试走鬼市回程标记
        place: 无相鬼市千佛暗窟
        pair: 1
      exits:
      - 沿已实走短段折返入口并退出鬼市
      - 留在固定驿点等有余力的向导接手，不负责继续测路
    货契计量分歧:
      source: 颜料工匠的量斗与旅人带来的量杯容量不同，双方都按一斗报价。
      engines:
      - 赌约生效
      - 信任透支
      beats:
        trigger: '{npc}发现颜料工匠的量斗与旅人带来的量杯容量不同，双方都按一斗报价。'
        objective: 在不拆整批封罐前谈清实际交付量
        choice: 请双方认可的第三人用同一量器比量；或暂缓下单退回小样
        immediate: 未确认的大货不交接，译员逐句区分单位名与容量
        near: 重议价格可能减少买量，但不用让任何一方为误译补上未知差价
      far_trigger: 下次交货仍沿用无容量说明的旧货契
      far_consequence: 买家拒收或卖家亏料，长期供货关系中断；同量器对样能缩小以后争议
      bindings:
      - activity: 核对颜料样本
        place: 流沙回廊炼金暗房
        pair: 0
      exits:
      - 不下本次整批订单，结清已用试样
      - 将货契退回双方另找认可译员，当前译员退出代谈
    两千箱私酒遭同行截胡:
      source: 发往东镇的二十车私酒在流沙回廊中转时被同一支商队以更低报价截走，货已过手，尾款仍欠在当票上。
      engines:
      - 债务压力
      - 攻守易位
      beats:
        trigger: '{npc}收到口信：发往东镇的二十车私酒在流沙回廊中转时被同一支商队以更低报价截走。'
        objective: 在当票到期前弄清货在谁手上，又不让自家商队先被记成赖账的一方
        choice: 可当场追去流沙回廊对质；可先补足当票尾款保住信用再追货；或把这一笔折价转手止损
        immediate: 追货不越出已确认回廊，酒仍不在自己手上，当票照原期计息
        near: 截胡者会拿这批货反过来压价，先补尾款的一方在下一轮议价里仍有名号可报
      far_trigger: 当票赎回期届满那日货仍未追回，也未补足尾款
      far_consequence: 押出的真名转入公开售卖，东镇渠道被同行接手，赎回须按行价补足差额而非原欠额。
      bindings:
      - activity: 交出一样东西
        place: 无相鬼市千佛暗窟
        pair: 0
      exits:
      - 承认这一笔亏损，按当票交割止损
      - 留下人手守货，自己随下一支商队退回固定驿院
    巡沙狼骑号角逼近:
      source: 巡沙狼骑的号角从回廊北口响起，按惯例下一声号角落下即封口，留在暗窟里的人一律按盗市处置。
      engines:
      - 时限逼近
      - 身份风险
      beats:
        trigger: '{npc}听见巡沙狼骑的号角从回廊北口响起，按惯例下一声号角落下即封口。'
        objective: 在封口前把人和货都退到石钉以外的可辩位置
        choice: 可立刻收拢货物沿回路绳退出；可把货留在样品台只带人走；或赌号角是绕行而继续交割
        immediate: 号角未落第二声，货若留下则封条与当票一并留在记账板上
        near: 被记为盗市的人在整条商路上失去带路资格，货追不回来但人能报出自己是谁
      far_trigger: 第二次号角落下时仍有同行者留在千佛暗窟以内
      far_consequence: 留下的人按盗市羁押候审，货与押名一并充公；当场退到石钉外的人只丢货不丢名号。
      bindings:
      - activity: 把关键物品留在原地后离开
        place: 流沙回廊炼金暗房
        pair: 0
      - activity: 第三方拿走关键物品
        place: 无相鬼市千佛暗窟
        pair: 1
      exits:
      - 放弃本轮货物，随向导沿回路绳退出鬼市
      - 把当票留在记账板交由第三方转押，本人先脱身
    琉璃长明灯油即将燃尽:
      source: 酒肆灶后那半缸长明灯油只剩缸底一层，灯芯已短到贴住灯脚，按胡姬的规矩油尽即闭肆，未结的酒账当晚折价卖给出价最高的人。
      engines:
      - 资源锁定
      - 时限逼近
      beats:
        trigger: '{npc}发现酒肆灶后那半缸长明灯油只剩缸底一层，灯芯已短到贴住灯脚。'
        objective: 在这一夜结束前把酒账结清或把油续上
        choice: 可当场结清酒账；可去找能供油的商队谈一笔押名换油；或趁灯未灭把该说的话说完
        immediate: 灯还亮着，肆内照常上菜，掌柜把闭肆的时辰写在灶边木牌上
        near: 油尽之后酒账折价易主，谁欠谁的人情也一并易主，续油的一方从此在这间肆里说话更响
      far_trigger: 灯油见底那夜仍无人补上，也未结清当日酒账
      far_consequence: 酒肆连闭三夜，常客改投别处，押名换来的油按复利计入下一轮当票。
      bindings:
      - activity: 替她挽紧被狂风吹散的红纱面罗
        place: 胡姬八角琉璃酒肆
        pair: 0
      - activity: 共译旅人菜单
        place: 胡姬八角琉璃酒肆
        pair: 0
      exits:
      - 结清酒账后从实体门槛退出酒肆
      - 不再续油，把未结的账留给掌柜折价处理
    无处可归:
      source: 来时那支商队已在别处过手货物，回头路没有自己的位置，留在鬼市又只能在石钉以内活动。
      engines:
      - 身份风险
      - 第三方施压
      beats:
        trigger: '{npc}得知来时那支商队已在别处过手货物，回头路没有自己的位置。'
        objective: 在那支商队下次上路前谈到一个可随行的位置
        choice: 可当场去谈随行条件；可先寄住固定驿院等下一支商队；或押出一段记忆换一笔能自己走的本钱
        immediate: 今晚仍有地方落脚，石钉以外的活动需要有人陪着走
        near: 商队是否肯带由对方定，寄住驿站按日计费，押名换来的本钱按月复利滚
      far_trigger: 下一支商队离市当日仍无人愿意带行
      far_consequence: 只能留在鬼市石钉以内替人守绳与记账，逐轮蜃景更替中慢慢变成摊影的一部分。
      bindings:
      - activity: 交出一样东西
        place: 无相鬼市千佛暗窟
        pair: 1
      exits:
      - 接受押名条件随下一支商队离开
      - 留在固定驿院做守绳的短工，等行情变化
    流言缠身:
      source: 商路上开始传他在流沙回廊替截胡的同行记账，说法越传越实，连固定驿院的掌柜都开始要他先付款再住店。
      engines:
      - 名声保卫
      - 旧事追索
      beats:
        trigger: '{npc}听说商路上开始传他在流沙回廊替截胡的同行记账。'
        objective: 在掌柜改变规矩之前把记账板上那一栏说清
        choice: 可拉上译员去当面核对记账板；可请认可的第三人做保；或先付现款把这阵风头熬过去
        immediate: 住店仍能住，但押金被提到双倍，账册翻开时旁边有人盯着看
        near: 说法不澄清就会写进下一轮的商队名册，名号一栏被标注的人谈价先输一层
      far_trigger: 下一轮鬼市开场前名册上那行字仍未改
      far_consequence: 带路资格暂停，需要第三方连保才能重新接货，流言本身倒不折价，只是每一次议价都要先解释一遍。
      bindings:
      - activity: 替他拂去罗盘上的青铜尘土
        place: 流沙回廊炼金暗房
        pair: 1
      exits:
      - 交出记账抄本自证，暂时退出这轮交易
      - 换一间驿院住下，不再回这处回廊
