  - 押出去的真名与赎回期限
  - 封口号角下的去留取舍
  technology_boundary: 丝路风物的志怪商路使用手图、绳结、天平与人递消息；蜃景会改变可见摊影和路径入口，但不自动换算度量衡、不凭空补给，也不能靠一张图保证明日可走。长明灯油、当票与押名交割均为手工登记，蜃景关闭时刻靠石钉旁的回收单人工计时，没有可远程查证或即时挂失的手段。
