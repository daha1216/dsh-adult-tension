id: mat-de87cf5cd73859139a93b09b472d4e59
name: 赛博街区与公共终端
material:
  eras:
  - 近未来都市
  aesthetics:
  - 赛博霓虹
  - 赛博都市夜行
  - 雨夜霓虹
  rule: 公共终端协调城市服务，居民保留线下申诉和匿名参与社区活动的渠道。换脸视频一旦离手就先在几条私密转发里流转，删帖追不上已落地的副本；服务合同默认自动续期，除非本人在到期前用可核对的记录明确终止。
  social_rule: 算法记录可被核对，定位与个人资料不能因熟识而任意调取；信用分决定可用的服务档次，外族规则与人类法律冲突时必须先到公共终端登记备案。
  places:
    全息酒吧:
      details:
      - 投影网幕映在雨衣与杯沿上
      - 吧台保留无屏灯带，测试音量单独可调
      profile:
        privacy: low
        visibility: high
        exits:
        - 经前厅退出到有遮雨棚的街面
        witnesses:
        - 当班调饮师
        affordances:
        - 试放街区投影
        - 切回无屏照明
        pressure_modifiers:
        - 视觉亮度耐受
        - 营业前试放长度
    立体停车库:
      details:
      - 行人护栏把升降车台与步行坡道分开
      - 电梯按钮与终端箭头位于不同转角
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿已开放行人坡道离开车库
        witnesses:
        - 车库行人区值守员
        affordances:
        - 校对无障碍导览
        - 实走坡道与电梯入口
        pressure_modifiers:
        - 电梯是否开放
        - 箭头与真实转角的距离
    末班地铁:
      details:
      - 末班车车门上方显示换乘末班时间
      - 车厢扶手旁有不依赖联网的线路贴
      profile:
        privacy: low
        visibility: high
        exits:
        - 到下一开放站后按运营指引下车出站，行车中不能离车
        witnesses:
        - 同车乘客与站务员
        affordances:
        - 同行试走末班换乘
        - 决定在哪一站结束同行
        pressure_modifiers:
        - 列车到站时刻
        - 末班接续余量
    写字楼:
      details:
      - 写字楼一层预约屏旁留有人工服务台
      - 测试账号与正式预约用不同颜色的界面边框
      profile:
        privacy: low
        visibility: high
        exits:
        - 退出测试账户后从一层门厅离开
        witnesses:
        - 楼宇值班接待员
        affordances:
        - 测试共享预约屏
        - 用模拟时段试排会议
        pressure_modifiers:
        - 正式服务维护窗口
        - 前台可接手的申请数量
    旧写字楼清盘现场:
      details:
      - 清盘现场把待封存的工位与债权人等候区分开·夜
      - 工位屏上还挂着未退登的社区终端页，记账员的打印机停在半页账上·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 经消防通道退到楼下街面，不走只有刷卡才开的后门
        witnesses:
        - 留守的记账员或前来对账的债权人
        affordances:
        - 核对未结清的支出明细
        - 把未退登的页面转为只读存档
        pressure_modifiers:
        - 清盘时限内还能进出几次
        - 谁手里留着工位门禁卡
    地下赛站维修通道:
      details:
      - 维修通道沿赛道外侧延伸，隔一段有一盏自供电的窄灯·夜
      - 转角宽处摆着备用的护具与测距仪，落地扇叶片上缠着旧胶带·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 从维修通道尽头的地面检修口退出赛站
        witnesses:
        - 赛站值守的维修工
        affordances:
        - 核对弯道的实测宽度
        - 把旧护具按尺寸重新配对
        pressure_modifiers:
        - 开赛前还能封路多久
        - 窄灯电量与通道长度
    合租屋公共通道:
      details:
      - 公共通道的共享屏正对入户门，屏上留着定位共享的开关·夜
      - 门口鞋架按人头分格，通道尽头的电表箱开着一条缝·夜
      profile:
        privacy: low
        visibility: medium
        exits:
        - 从楼梯下到街面，或退回自己房间关屏
        witnesses:
        - 同住的合租室友
        affordances:
        - 查看共享位置的有效范围
        - 当面关掉共享或改成只报时段
        pressure_modifiers:
        - 共享开着多久算默认同意
        - 谁还能打开电表箱
    太空站舱段:
      details:
      - 舱段把居住铺位与设备面板隔开，面板上贴着不依赖联网的值守卡·夜
      - 舷窗外星海冷光常亮，噪声来自循环风而不是屏幕·夜
      profile:
        privacy: medium
        visibility: low
        exits:
        - 经隔离门退出舱段，开门次数计入当班记录
        witnesses:
        - 当班的值守人员
        affordances:
        - 核对循环风的实测噪声
        - 按当班记录安排设备面板的排查顺序
        pressure_modifiers:
        - 本轮补给与设备更换周期
        - 当班记录还能允许几次开门
  pairs:
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 师傅
    npc:
      role: 公共终端维护员
      function: 维护显示端并排查可复现的界面故障
      authority: 可停用负责终端的测试页面，不能决定服务资格
      resource: 隔离测试账号、可恢复的界面配置
      limitation: 无跨部门数据权限，不能改变末班运行或开启停用电梯
      obligation: 测试后退出账号并恢复现场正常服务
      exposure: 误推配置会让当班居民排队等待
    player:
      identity: 社区数据整理人
      baseline: 你带着步行核对结果来，不打算让朋友的体验成为无偿无限测试。
      resources:
      - 自愿收集的体验意见
      - 纸质路线备份
      reputation: 愿意亲自走一遍不熟悉的路
    relationship_reason: 终端维护员曾按整理人描述重现一次箭头反向问题，两人因此愿意共同试放街景。
  - family: 学术与专业
    position: 同侪
    appellations:
    - 直呼其名
    npc:
      role: 社区数据整理人
      function: 收集自愿反馈并区分个案与统计
      authority: 可撤回本人整理的尚未提交报告
      resource: 去标识反馈、步行测距记录和居民自愿体验意见
      limitation: 不能代替无障碍使用者认定便利，也无权调个人轨迹
      obligation: 将实走发现与推测分开，不公开反馈者身份
      exposure: 忽略实际路况会失去居民再参与的信任
    player:
      identity: 公共终端维护员
      baseline: 你管显示端，愿听真实使用者意见，但不会许诺自己改不了的城市设施。
      resources:
      - 界面测试账号
      - 局部配置回退权限
      reputation: 能复现才说修好
    relationship_reason: 数据整理人负责这次实走，维护员带来测试端；两人知道屏幕正确和路能走通是两回事。
  activities:
    试放街区投影:
      places:
      - 全息酒吧
      pairs:
      - 0
      category: 日常接触
      action: '{npc}试放两位居民授权的街景拼贴，问你想配安静灯光还是环境声。'
      beats:
        trigger: '{npc}试放两位居民授权的街景拼贴，问你想配安静灯光还是环境声。'
        objective: 一起决定今晚想待在怎样的声光环境
        choice: 可选一版一起坐会；可要求关屏聊天，也可不参加试放直接点饮品
        immediate: 声光选择改变当下座位和谈话节奏，不自动变成用户调研
        near: 两人记住彼此对亮度的偏好，下一次无需重做整套测试
    校对无障碍导览:
      places:
      - 立体停车库
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}停在行人护栏内，邀请你沿屏幕所指方向实际走到电梯。'
      beats:
        trigger: '{npc}停在行人护栏内，邀请你沿屏幕所指方向实际走到电梯。'
        objective: 判断箭头是否把人带到能使用的无台阶入口
        choice: 可走短程核对，也可只反馈一个转角；不方便参与就由值守员接手
        immediate: 屏幕路线若正确但电梯不开放，结果标为不可达而不是通过
        near: 修正提示后需由实际使用者自愿反馈，当前参与者不背后续必到义务
    同行试走末班换乘:
      places:
      - 末班地铁
      pairs:
      - 0
      category: 空间与退出
      action: '{npc}看向下一站的换乘时刻，问你愿意同行到哪里为止。'
      beats:
        trigger: '{npc}看向下一站的换乘时刻，问你愿意同行到哪里为止。'
        objective: 按两人的回家方向确定同行终点
        choice: 可到下一站分开；可各走原路线；有足够接续时间才多同行一站
        immediate: 选定下车站就预留出站余量，不为测试错过自己的末班
        near: 下次约见可据此改到更方便的站，不要求留存个人轨迹
    测试共享预约屏:
      places:
      - 写字楼
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}请你用模拟申请预约一段不存在于正式日程的讨论时段。'
      beats:
        trigger: '{npc}请你用模拟申请预约一段不存在于正式日程的讨论时段。'
        objective: 确认取消和改期不会吞掉别人的正式名额
        choice: 可完成一次预约再取消；可只观察操作，或转到人工台说明习惯后离开
        immediate: 测试确认名额释放或发现重复占用；不把模拟成功当正式订场
        near: 可复现问题交维护员，测试参与者无须等待升级上线
    在清盘现场核对未退登的版务记录:
      places:
      - 旧写字楼清盘现场
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}把未退登的社区终端页转过来，请你辨认那条操作记录是不是本人留下的。'
      beats:
        trigger: '{npc}把未退登的社区终端页转过来，请你辨认那条操作记录是不是本人留下的。'
        objective: 把页面弄成只读存档，不顺手改动不属于自己的记录
        choice: 当场截图存档并退出登录；或只说明自己没动过这一条，等记账员接手
        immediate: 这条记录被固定成只读，谁动过页面当场说清
        near: 清盘结束前页面会被收回，认下的这一条以后就是凭据
    在维修通道封路跑一次弯道:
      places:
      - 地下赛站维修通道
      pairs:
      - 0
      category: 日常接触
      action: '{npc}拉下封路闸，问你要不要趁着开赛前亲自跑一遍这个弯。'
      beats:
        trigger: '{npc}拉下封路闸，问你要不要趁着开赛前亲自跑一遍这个弯。'
        objective: 按规定圈数跑完就收，不把试跑当成正式成绩
        choice: 亲自跑一遍；或只走通道量一遍宽度，让维修工自己试
        immediate: 跑完的弯道数据当场记下，封路闸按时收
        near: 试出来的这条线以后要按同一条跑，改线要先问过封路的人
    把共享定位改成只报时段:
      places:
      - 合租屋公共通道
      pairs:
      - 1
      category: 空间与退出
      action: '{npc}把共享屏停在定位共享那一页，问你是关掉还是留着。'
      beats:
        trigger: '{npc}把共享屏停在定位共享那一页，问你是关掉还是留着。'
        objective: 让彼此知道今晚几点到家，又不把全天轨迹交出去
        choice: 改成只报时段；或直接关掉，改用门锁记录对一次进出
        immediate: 共享范围当场改定，屏上不再显示实时位置
        near: 改了范围之后靠不靠得住，要看接下来几晚谁守约
    在舱段里记一次循环风噪声:
      places:
      - 太空站舱段
      pairs:
      - 1
      category: 调查与核验
      action: '{npc}让你贴着设备面板听循环风，问噪声是比上一班大了还是没变。'
      beats:
        trigger: '{npc}让你贴着设备面板听循环风，问噪声是比上一班大了还是没变。'
        objective: 凭当班记录判断该不该动设备，不靠猜测
        choice: 照实报出差别并记进当班卡；或不发表意见，只把卡递回去
        immediate: 报出的差别写进当班卡，设备当天不动
        near: 下一班会照这张卡复查，报错了要自己认
  customs:
  - 街区公告旁始终保留一块能手写留言的小板。
  pressures:
    服务记录误关联:
      source: 预约屏把两位本人到场确认的正式申请合成一条。
      engines:
      - 身份风险
      - 资源锁定
      beats:
        trigger: '{npc}发现预约屏把两位本人到场确认的正式申请合成一条。'
        objective: 让当事人分别确认申请，保护各自名额与资料
        choice: 由前台受理人工复核；或两人各自撤销未确认预约，另选可用时段
        immediate: 楼宇前台受理人工复核：争议预约暂缓发放门禁码，前台分别接待，不在公共屏展示个人字段；测试账号仅提供故障复现，无权操作正式预约或公共字段
        near: 处理期间楼宇保留各自的回访渠道，维护员只提供故障复现
      far_trigger: 下周正式活动仍把两组人安排到同一房间
      far_consequence: 两组的布置成本与可用时段会冲突；完成拆分则各自正常使用
      bindings:
      - activity: 测试共享预约屏
        place: 写字楼
        pair: 1
      exits:
      - 测试者退出账号，由前台接手，不继续看当事人资料
      - 申请人撤回本人预约，保留以后另约的权利
    社区终端维护撞期:
      source: 全息酒吧街景试放端收到已排定的升级停机提示。
      engines:
      - 时限逼近
      - 资源锁定
      beats:
        trigger: '{npc}发现全息酒吧街景试放端收到已排定的升级停机提示。'
        objective: 决定保留线下聚会还是另约投影时段
        choice: 切回普通灯光继续坐；或结束试放改日再看，只有获准才延后维护
        immediate: 停机只影响投影，吧台与聊天照常，维护员不带着私人偏好跳过升级
        near: 居民各自选择留下或离开，未放作品仍由作者保管
      far_trigger: 维护连续两次占掉作者约好的试放窗口
      far_consequence: 作者可能改用别的场地，街区失去共创伙伴；固定可用窗口能恢复合作
      bindings:
      - activity: 试放街区投影
        place: 全息酒吧
        pair: 0
      exits:
      - 关屏后按普通顾客活动
      - 取消本次试放并归还作者素材
    换脸视频外流:
      source: 换脸视频已经流出，几条私密转发里各留了一份副本；删帖追不上已经落地的那几份。
      engines:
      - 秘密暴露倒计时
      - 消息误发
      beats:
        trigger: '{npc}收到熟人转来的消息，附带一段换脸视频。'
        objective: 在转发出圈之前把能收回的收回，其余当面讲清
        choice: 请转发的人删掉并留痕；或直接报警走平台流程，放弃私下了结
        immediate: 知道了谁手里有副本，私密转发那几条得到删除回执
        near: 副本删不全，反倒让自己成了别人手里那一条
      far_trigger: 视频被转到公共时间线上，或者有人拿它谈条件
      far_consequence: 脸和名字被绑在一起，往后任何事都被先按视频解释；先收回私密转发则还有讲清的机会
      bindings:
      - activity: 在清盘现场核对未退登的版务记录
        place: 旧写字楼清盘现场
        pair: 0
      - activity: 在维修通道封路跑一次弯道
        place: 地下赛站维修通道
        pair: 0
      exits:
      - 退出私下交涉，把材料交给平台与警方
      - 搬离合租屋，换掉全部联系方式
    契约即将自动续期:
      source: 服务合同写着到期不用通知就自动续期，签字那天也正是当初被人拿着这条款按下的日子。
      engines:
      - 时限逼近
      - 旧案重开
      beats:
        trigger: '{npc}发现合同上写着到期不用通知就自动续期，续期日就在这几天。'
        objective: 在到期前留下可核对的终止记录
        choice: 照正规流程书面终止；或只口头退订，赌对方不照条款算
        immediate: 终止记录留下回执编号，服务照原样用到到期日
        near: 用了多少年的条款被重算，当初签字时谁在场就成了要紧的事
      far_trigger: 续期日过后服务照旧并产生新一期费用
      far_consequence: 条款连带当初那桩旧案一起被翻出来，退不掉反倒要多付一期；按期留痕则可干净脱身
      bindings:
      - activity: 在清盘现场核对未退登的版务记录
        place: 旧写字楼清盘现场
        pair: 0
      - activity: 把共享定位改成只报时段
        place: 合租屋公共通道
        pair: 1
      exits:
      - 按现行规则退掉自动服务，改用人工与线下渠道
      - 接受续期，只把条款交公共终端备案
    创业清盘夜:
      source: 这间做了几年的铺面今夜就要封存，账上还差最后一笔没平；封存之后谁也进不来。
      engines:
      - 债务压力
      - 共同秘密
      beats:
        trigger: '{npc}把最后半页账推过来，说封存的人明早就到。'
        objective: 在封存前把账目封好，让共同经手的人不必替对方认下
        choice: 两人一起把未结的账补齐；或各认各的，另一笔交给债权人
        immediate: 分好的账当场各自签字，未平的另立一页
        near: 封存之后这笔账只按签字认人，当初一起做过的那个决定也得跟着署名
      far_trigger: 封存后的对账会上有人翻出未平的那一页
      far_consequence: 共同经手的那个决定被摆到台面上，一个人扛就要扛全部；一起补齐则各担一半
      bindings:
      - activity: 在清盘现场核对未退登的版务记录
        place: 旧写字楼清盘现场
        pair: 0
      - activity: 在舱段里记一次循环风噪声
        place: 太空站舱段
        pair: 1
      exits:
      - 把欠款数额写清，走正规清算渠道
      - 让债权人接手，自己退出这间铺面
    比赛前夜:
      source: 开赛前一晚，车队只给一次封路试跑；跑出来的线明天就得照着开，改线要有人担下。
      engines:
      - 时限逼近
      - 名额只能给一个人
      beats:
        trigger: '{npc}把封路闸的钥匙放在维修通道的台子上。'
        objective: 按今晚试出来的线跑完明天那圈
        choice: 自己上跑这一遍；或让维修工试，自己按数据来
        immediate: 试跑定下的线当场写进当班记录，钥匙交回
        near: 明天只有一次封路机会，选谁上就要谁担到底
      far_trigger: 正式开赛后第一圈就遇上没试过的弯
      far_consequence: 试跑没跑到的那一段要拿正式成绩换；今晚跑过则整条线都握在手上
      bindings:
      - activity: 在维修通道封路跑一次弯道
        place: 地下赛站维修通道
        pair: 0
      - activity: 把共享定位改成只报时段
        place: 合租屋公共通道
        pair: 1
      exits:
      - 交回护具与钥匙，退出这一场试跑
      - 按数据换成保守路线，不争这一圈
    身体见底:
      source: 连着几天没睡整觉，看屏会重影，手上的活一慢就出错；再撑下去出错的那一步就要别人来收拾。
      engines:
      - 伤病互护
      - 信任透支
      beats:
        trigger: '{npc}发现你看屏的眼神开始飘，同一条记录看了两遍。'
        objective: 决定谁先歇、谁接手，别让错处落在接手的人身上
        choice: 交班歇一小段；或明说撑得住，让对方决定要不要接着交
        immediate: 当班的活当场分开，出错的那条挂回自己名下
        near: 歇下来的那几个钟头得有人补上，硬撑则往后谁都不敢再接你的班
      far_trigger: 同一班再出现第二处错，或者有人照旧把活推过来
      far_consequence: 错处连成一片，接手的人先被追责；交过班则各人认自己那一段
      bindings:
      - activity: 在舱段里记一次循环风噪声
        place: 太空站舱段
        pair: 1
      - activity: 在清盘现场核对未退登的版务记录
        place: 旧写字楼清盘现场
        pair: 0
      exits:
      - 退出这一班，把未完成的活登记在当班卡上
      - 请值守人员另外派人接手
    门禁记录出现异常:
      source: 公共终端的门禁记录多出一条没人在场的刷卡；这条记录的头像栏是空白的，时间却和两人当班时对得上。
      engines:
      - 身份风险
      - 记忆缺口
      beats:
        trigger: '{npc}调出门禁记录，指出那一条没人认领的刷卡。'
        objective: 在门禁记录被自动覆盖前把这一段固定下来
        choice: 当场导出这段记录并登记核对；或先问过同班的人，再决定要不要往上报
        immediate: 这一段记录被导出留档，当班的人各自写下当时在哪
        near: 记录留了档，认不认那条刷卡就成了往后每次复查的由头
      far_trigger: 下一次复核时记录已经覆盖，只剩口头说法
      far_consequence: 空白头像那条刷卡被算在当班的人头上；及时导出则可把时段与人对上
      bindings:
      - activity: 在清盘现场核对未退登的版务记录
        place: 旧写字楼清盘现场
        pair: 0
      - activity: 在舱段里记一次循环风噪声
        place: 太空站舱段
        pair: 1
      - activity: 同行试走末班换乘
        place: 末班地铁
        pair: 0
      exits:
      - 把记录交公共终端备案，自己退出这次核对
      - 不再登入该终端，改用人工窗口办事
    定位共享:
      source: 合租屋的共享屏默认开着定位，两人的活动范围一直被照着写进服务记录，谁都没有主动开过它。
      engines:
      - 定位共享
      - 表面体面破裂
      beats:
        trigger: '{npc}在公共通道的共享屏上发现定位共享一直开着。'
        objective: 把共享范围收回两人自己商定的样子
        choice: 当面改成只报时段；或直接关掉并到公共终端核对历史记录
        immediate: 共享范围当场改定，屏上不再显示实时位置
        near: 改过之后就要说明前些天为何一直开着，说不清就问得到底
      far_trigger: 下一周定位共享又被谁悄悄开回去
      far_consequence: 两个人各自去过哪被服务记录摆出来，体面在通道里当场破掉；收回范围则还能只对时段
      bindings:
      - activity: 把共享定位改成只报时段
        place: 合租屋公共通道
        pair: 1
      - activity: 在维修通道封路跑一次弯道
        place: 地下赛站维修通道
        pair: 0
      - activity: 校对无障碍导览
        place: 立体停车库
        pair: 1
      exits:
      - 关掉共享，把历史记录的调取交给公共终端
      - 搬出合租屋，换一张门禁卡
    联邦探员突击封门搜查:
      source: 外族规则与人类法律冲突时须先登记，可这条街上的租客大多没登记；封门搜查的消息来得比公告早。
      engines:
      - 第三方施压
      - 警报拉响的断电避险
      beats:
        trigger: '{npc}从终端上收到楼宇封门的通知，说封门队伍半小时内到。'
        objective: 在封门前把该登记的做完，把不该看的收起来
        choice: 照规矩在公共终端补登记；或先断电避险、把不联网的备份带走
        immediate: 该交的材料交出去，不联网的那一份留在自己身上
        near: 封门过后每条记录都会被逐条对，补过登记的少一条罪
      far_trigger: 封门队伍从这一层往下一层逐户核对
      far_consequence: 没登记的要按外族规则单独走一遍，街区里的往来也被翻出来；照规矩补登记则可留在原地
      bindings:
      - activity: 在清盘现场核对未退登的版务记录
        place: 旧写字楼清盘现场
        pair: 0
      - activity: 在舱段里记一次循环风噪声
        place: 太空站舱段
        pair: 1
      exits:
      - 退出这一层，从消防通道离楼
      - 把设备断电交查，自己随封门队伍走完流程
    警报拉响的断电避险:
      source: 楼宇警报一响，公共终端跟着断电；不联网的那几份备份还在身上，屏上留着的才是证据。
      engines:
      - 警报拉响的断电避险
      - 资源锁定
      beats:
        trigger: '{npc}听见整层的警报声，共享屏同时黑掉。'
        objective: 在断电的这几分钟里保住人和不联网的备份
        choice: 按疏散路线先下楼；或折回去取屏上那份记录，冒被锁在楼里的风险
        immediate: 人先出楼，能带走的东西当场分给各自手上
        near: 折回去取的那一份到底值不值得，往后每次提都要重新算
      far_trigger: 断电持续到电梯与门禁全部失效
      far_consequence: 留档缺了屏上那一份，核对时只能凭口头；人先出楼则证据不全但都能到场
      bindings:
      - activity: 在舱段里记一次循环风噪声
        place: 太空站舱段
        pair: 1
      - activity: 把共享定位改成只报时段
        place: 合租屋公共通道
        pair: 1
      exits:
      - 按疏散路线撤到街面，不再回楼
      - 把备份交给同行的值守人员保管
