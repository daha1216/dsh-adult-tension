id: "mat-de87cf5cd73859139a93b09b472d4e59"
name: "赛博街区与公共终端"
material:
  eras:
    - "近未来都市"
  aesthetics:
    - "赛博霓虹"
    - "赛博都市夜行"
    - "雨夜霓虹"
  rule: "公共终端协调城市服务，居民保留线下申诉和匿名参与社区活动的渠道。"
  social_rule: "算法记录可被核对，定位与个人资料不能因熟识而任意调取。"
  places:
    全息酒吧:
      details:
        - "投影网幕映在雨衣与杯沿上"
        - "吧台保留无屏灯带，测试音量单独可调"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "经前厅退出到有遮雨棚的街面"
        witnesses:
          - "当班调饮师"
        affordances:
          - "试放街区投影"
          - "切回无屏照明"
        pressure_modifiers:
          - "视觉亮度耐受"
          - "营业前试放长度"
    立体停车库:
      details:
        - "行人护栏把升降车台与步行坡道分开"
        - "电梯按钮与终端箭头位于不同转角"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "沿已开放行人坡道离开车库"
        witnesses:
          - "车库行人区值守员"
        affordances:
          - "校对无障碍导览"
          - "实走坡道与电梯入口"
        pressure_modifiers:
          - "电梯是否开放"
          - "箭头与真实转角的距离"
    末班地铁:
      details:
        - "末班车车门上方显示换乘末班时间"
        - "车厢扶手旁有不依赖联网的线路贴"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "到下一开放站后按运营指引下车出站，行车中不能离车"
        witnesses:
          - "同车乘客与站务员"
        affordances:
          - "同行试走末班换乘"
          - "决定在哪一站结束同行"
        pressure_modifiers:
          - "列车到站时刻"
          - "末班接续余量"
    写字楼:
      details:
        - "写字楼一层预约屏旁留有人工服务台"
        - "测试账号与正式预约用不同颜色的界面边框"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "退出测试账户后从一层门厅离开"
        witnesses:
          - "楼宇值班接待员"
        affordances:
          - "测试共享预约屏"
          - "用模拟时段试排会议"
        pressure_modifiers:
          - "正式服务维护窗口"
          - "前台可接手的申请数量"
  pairs:
    -
      family: "服务与手艺"
      position: "同侪"
      appellations:
        - "师傅"
      npc:
        role: "公共终端维护员"
        function: "维护显示端并排查可复现的界面故障"
        authority: "可停用负责终端的测试页面，不能决定服务资格"
        resource: "隔离测试账号、可恢复的界面配置"
        limitation: "无跨部门数据权限，不能改变末班运行或开启停用电梯"
        obligation: "测试后退出账号并恢复现场正常服务"
        exposure: "误推配置会让当班居民排队等待"
      player:
        identity: "社区数据整理人"
        baseline: "你带着步行核对结果来，不打算让朋友的体验成为无偿无限测试。"
        resources:
          - "自愿收集的体验意见"
          - "纸质路线备份"
        reputation: "愿意亲自走一遍不熟悉的路"
      relationship_reason: "终端维护员曾按整理人描述重现一次箭头反向问题，两人因此愿意共同试放街景。"
    -
      family: "学术与专业"
      position: "同侪"
      appellations:
        - "直呼其名"
      npc:
        role: "社区数据整理人"
        function: "收集自愿反馈并区分个案与统计"
        authority: "可撤回本人整理的尚未提交报告"
        resource: "去标识反馈、步行测距记录和居民自愿体验意见"
        limitation: "不能代替无障碍使用者认定便利，也无权调个人轨迹"
        obligation: "将实走发现与推测分开，不公开反馈者身份"
        exposure: "忽略实际路况会失去居民再参与的信任"
      player:
        identity: "公共终端维护员"
        baseline: "你管显示端，愿听真实使用者意见，但不会许诺自己改不了的城市设施。"
        resources:
          - "界面测试账号"
          - "局部配置回退权限"
        reputation: "能复现才说修好"
      relationship_reason: "数据整理人负责这次实走，维护员带来测试端；两人知道屏幕正确和路能走通是两回事。"
  activities:
    试放街区投影:
      places:
        - "全息酒吧"
      pairs:
        - 0
      category: "日常接触"
      action: "{npc}试放两位居民授权的街景拼贴，问你想配安静灯光还是环境声。"
      beats:
        trigger: "{npc}试放两位居民授权的街景拼贴，问你想配安静灯光还是环境声。"
        objective: "一起决定今晚想待在怎样的声光环境"
        choice: "可选一版一起坐会；可要求关屏聊天，也可不参加试放直接点饮品"
        immediate: "声光选择改变当下座位和谈话节奏，不自动变成用户调研"
        near: "两人记住彼此对亮度的偏好，下一次无需重做整套测试"
    校对无障碍导览:
      places:
        - "立体停车库"
      pairs:
        - 1
      category: "调查与核验"
      action: "{npc}停在行人护栏内，邀请你沿屏幕所指方向实际走到电梯。"
      beats:
        trigger: "{npc}停在行人护栏内，邀请你沿屏幕所指方向实际走到电梯。"
        objective: "判断箭头是否把人带到能使用的无台阶入口"
        choice: "可走短程核对，也可只反馈一个转角；不方便参与就由值守员接手"
        immediate: "屏幕路线若正确但电梯不开放，结果标为不可达而不是通过"
        near: "修正提示后需由实际使用者自愿反馈，当前参与者不背后续必到义务"
    同行试走末班换乘:
      places:
        - "末班地铁"
      pairs:
        - 0
      category: "空间与退出"
      action: "{npc}看向下一站的换乘时刻，问你愿意同行到哪里为止。"
      beats:
        trigger: "{npc}看向下一站的换乘时刻，问你愿意同行到哪里为止。"
        objective: "按两人的回家方向确定同行终点"
        choice: "可到下一站分开；可各走原路线；有足够接续时间才多同行一站"
        immediate: "选定下车站就预留出站余量，不为测试错过自己的末班"
        near: "下次约见可据此改到更方便的站，不要求留存个人轨迹"
    测试共享预约屏:
      places:
        - "写字楼"
      pairs:
        - 1
      category: "调查与核验"
      action: "{npc}请你用模拟申请预约一段不存在于正式日程的讨论时段。"
      beats:
        trigger: "{npc}请你用模拟申请预约一段不存在于正式日程的讨论时段。"
        objective: "确认取消和改期不会吞掉别人的正式名额"
        choice: "可完成一次预约再取消；可只观察操作，或转到人工台说明习惯后离开"
        immediate: "测试确认名额释放或发现重复占用；不把模拟成功当正式订场"
        near: "可复现问题交维护员，测试参与者无须等待升级上线"
  customs:
    - "街区公告旁始终保留一块能手写留言的小板。"
  pressures:
    服务记录误关联:
      source: "预约屏把两位本人到场确认的正式申请合成一条。"
      engines:
        - "身份风险"
        - "资源锁定"
      beats:
        trigger: "{npc}发现预约屏把两位本人到场确认的正式申请合成一条。"
        objective: "让当事人分别确认申请，保护各自名额与资料"
        choice: "由前台受理人工复核；或两人各自撤销未确认预约，另选可用时段"
        immediate: "楼宇前台受理人工复核：争议预约暂缓发放门禁码，前台分别接待，不在公共屏展示个人字段；测试账号仅提供故障复现，无权操作正式预约或公共字段"
        near: "处理期间楼宇保留各自的回访渠道，维护员只提供故障复现"
      far_trigger: "下周正式活动仍把两组人安排到同一房间"
      far_consequence: "两组的布置成本与可用时段会冲突；完成拆分则各自正常使用"
      bindings:
        -
          activity: "测试共享预约屏"
          place: "写字楼"
          pair: 1
      exits:
        - "测试者退出账号，由前台接手，不继续看当事人资料"
        - "申请人撤回本人预约，保留以后另约的权利"
    社区终端维护撞期:
      source: "全息酒吧街景试放端收到已排定的升级停机提示。"
      engines:
        - "时限逼近"
        - "资源锁定"
      beats:
        trigger: "{npc}发现全息酒吧街景试放端收到已排定的升级停机提示。"
        objective: "决定保留线下聚会还是另约投影时段"
        choice: "切回普通灯光继续坐；或结束试放改日再看，只有获准才延后维护"
        immediate: "停机只影响投影，吧台与聊天照常，维护员不带着私人偏好跳过升级"
        near: "居民各自选择留下或离开，未放作品仍由作者保管"
      far_trigger: "维护连续两次占掉作者约好的试放窗口"
      far_consequence: "作者可能改用别的场地，街区失去共创伙伴；固定可用窗口能恢复合作"
      bindings:
        -
          activity: "试放街区投影"
          place: "全息酒吧"
          pair: 0
      exits:
        - "关屏后按普通顾客活动"
        - "取消本次试放并归还作者素材"
  legacy_sources:
    eras:
      - "近未来都市"
    aesthetics:
      - "赛博霓虹"
      - "赛博都市夜行"
      - "雨夜霓虹"
    places:
      - "全息酒吧"
      - "立体停车库"
      - "末班地铁"
      - "写字楼"
  themes:
    - "自动服务与线下选择并存"
    - "无障碍路线的真实可达性"
    - "街区共创与屏幕疲劳"
  technology_boundary: "近未来局域终端、投影和服务匹配算法可用；系统有缓存、权限和维护时段，维护员不能读取居民私密定位，也不能靠一键重启修好道路或跨库身份匹配。"
  bridge_status: "not_required"
