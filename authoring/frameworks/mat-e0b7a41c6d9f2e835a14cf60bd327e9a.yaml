id: "mat-e0b7a41c6d9f2e835a14cf60bd327e9a"
name: "片场棚与月份牌画室"
material:
  eras:
    - "旧式民国都市"
  aesthetics:
    - "青年漫写实"
    - "暖色生活流"
    - "克制冷峻"
  rule: "片厂、画室和院线凭一张脸维持生意：片子里的脸、墙上的脸、广告上的脸各按一份合同分开算；合同科那一枚章认人不认话，落过章的就是公司资产，失期作废；本人同不同意不写在纸上，署名却要另外谈，同一个名字可以在本名、艺名和画上那个名字之间换着用；底片一律归厂，样照不出洗印间，带出去的就不再追。"
  social_rule: "片厂不认本人不同意，只认合同科那一枚章；画室不问像不像，只问制版卖不卖得动；一个人可以有本名、艺名和画上那个名字；明星宿舍门口没有锁，可谁跟谁同车回来是第二天唯一的话题；跑片院线只认片子上的署名——片子红了是公司的，砸了是演员的。"
  places:
    合同科案桌:
      details:
        - "长案上摊着待用印的合同一式两份，骑缝章压在右手边·日间"
        - "案角码着已作废的旧约，红笔划掉的期日还看得见·午后"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "案桌临着过道，交完纸从正门廊道出去"
        witnesses:
          - "合同科经手人"
          - "等盖章的别组干事"
        affordances:
          - "签一份形象使用合同"
          - "结束活动并离开"
        pressure_modifiers:
          - "用印的排班时辰"
          - "科长在不在楼下"
    布景片场:
      details:
        - "搭到一半的街景墙后面露出灯架和电线，地上拖着标记走位的白线·日间"
        - "反光板搁在景片边上，机位边留着一圈只准演员踩进去的空地·午后"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "穿过景片墙就是棚门，棚门直通片厂大道"
        witnesses:
          - "场务与灯工"
          - "候场的其他演员"
        affordances:
          - "棚里拍一组样片"
          - "结束活动并离开"
        pressure_modifiers:
          - "租棚按钟点算到几时"
          - "日光从高窗漏进来的角度"
    灯位高台:
      details:
        - "高台木板只容两人侧身立着，栏杆外垂着调灯用的绳·夜"
        - "台下机位在等一个光，所有人都安静看台上那一点·深夜"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "沿侧梯下到片场地面，再从布景背后绕出棚门"
        witnesses:
          - "灯工"
          - "在台下候着的助理导演"
        affordances:
          - "棚里拍一组样片"
          - "在灯位高台等一个光"
          - "结束活动并离开"
        pressure_modifiers:
          - "这一条光能等多久"
          - "高台上还站得住几个人"
    洗印间与底片柜:
      details:
        - "暗红罩灯下药水盆排成一列，晾片绳上夹着几段刚冲的负片·深夜"
        - "底片柜的铜锁换成新的一把，柜面贴着登记用的小木牌·深夜"
      profile:
        privacy: "high"
        visibility: "low"
        exits:
          - "洗印间出门是窄过道，过道尽头通洗印房后门"
        witnesses:
          - "洗印间的老师傅"
        affordances:
          - "把底片锁进柜子"
          - "结束活动并离开"
        pressure_modifiers:
          - "进柜登记要不要写名"
          - "药水还能冲几卷"
    月份牌画室:
      details:
        - "画架旁钉着一排试色小样，模特坐的圆凳还留着上一位的体温·日间"
        - "长桌上铺着放大的照片和半张线稿，橡皮屑扫在一角·午后"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "画室门对着走廊，走廊另一端是制版房的取稿窗口"
        witnesses:
          - "画师"
          - "送来样照的跑片伙计"
        affordances:
          - "对着照片起月份牌稿"
          - "点石印上墙"
          - "结束活动并离开"
        pressure_modifiers:
          - "交稿给制版的期日"
          - "模特还肯坐几个钟点"
    制版房:
      details:
        - "石印机上压着刚试过的一块版，废版堆在墙角还没裁开·日间"
        - "晾架上排着印好待干的画张，颜色深浅差一点就整批重来·午后"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "制版房连着印刷间，出去是后巷的载货门"
        witnesses:
          - "制版师傅"
          - "来催印期的画室伙计"
        affordances:
          - "点石印上墙"
          - "结束活动并离开"
        pressure_modifiers:
          - "这一批要印多少张"
          - "石印机空出来的档期"
    片场棚门与门禁室:
      details:
        - "棚门外挂着今日开拍的木牌，门禁室的小窗正对着进出的人脸·晨"
        - "登记簿摊在窗台上，来人姓名和出入时辰一行行往下记·夜"
      profile:
        privacy: "low"
        visibility: "high"
        exits:
          - "棚门内是片场大道，门外就是街面"
        witnesses:
          - "门禁室的值班人"
          - "等在外头的影迷与拉车的"
        affordances:
          - "棚门口认一张脸"
          - "结束活动并离开"
        pressure_modifiers:
          - "登记簿上写谁的名字"
          - "散场时的门外人潮"
    跑片院线试片间:
      details:
        - "放映机在身后响，银幕上的白光照亮前排空着的几把椅子·夜"
        - "剪片台上摊着分段的片子，手摇剪接机边放着记号笔·深夜"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "试片间侧门通向院线的票房间，正门散场后落锁"
        witnesses:
          - "跑片伙计"
          - "等第一轮口碑的发行人"
        affordances:
          - "试片间看一遍未剪版"
          - "结束活动并离开"
        pressure_modifiers:
          - "这一版还要不要改"
          - "试片场散场前还剩多少时间"
    明星宿舍:
      details:
        - "走廊两排房门都不上锁，公共盥洗室的水声传得很远·夜"
        - "谁的门缝里还透着灯，第二天整层楼都知道·深夜"
      profile:
        privacy: "medium"
        visibility: "medium"
        exits:
          - "宿舍楼下有后门通着小巷，正门对着片厂大门"
        witnesses:
          - "同层的其他演员"
          - "管夜的值班娘姨"
        affordances:
          - "明星宿舍熄灯前串门"
          - "结束活动并离开"
        pressure_modifiers:
          - "熄灯前还剩多少时间"
          - "今晚有没有人晚归"
  pairs:
    -
      family: "屏幕与镜头"
      position: "服务提供者"
      appellations:
        - "先生"
        - "师傅"
      npc:
        role: "夜班场务领班"
        function: "清场、布灯、把围观的人挡在机位之外"
        authority: "可决定片场围挡开在哪一处、灯位优先给哪一组"
        resource: "一张能进出各摄影棚的门禁卡与一份当晚的使用表"
        limitation: "戏一杀青门禁卡就注销，棚里的事只到收工为止"
        obligation: "剧组未播的内容烂在肚子里，清场先清自己人"
        exposure: "偷拍的路透传出去，全行业一夜间不再用他"
        hidden: "她替好几个演员私存过收工后没清干净的底片"
      player:
        identity: "片厂请来的画师"
        baseline: "你替她看过一张走光的样照该不该留；她说清场时只看机位，不看人"
        resources:
          - "进出棚区的临时通行条"
          - "认得光影能不能入画的眼力"
        reputation: "你画人，但不问人家戏里戏外的事"
      relationship_reason: "你替她看过一张走光的样照该不该留；她说清场时只看机位，不看人"
    -
      family: "传统与雅艺"
      position: "同侪"
      appellations:
        - "师傅"
        - "前辈"
      npc:
        role: "月份牌画室的老画师"
        function: "对着照片起稿、调色、把一张脸搬到石印版上"
        authority: "画室起稿的定稿权与石印试色的取舍"
        resource: "一叠历年留底的试色小样与半张没交出去的线稿"
        limitation: "稿子交给制版房以后，改一个字都要重新排期"
        obligation: "模特的样照不出画室门，落笔不算替谁作保"
        exposure: "把谁画成了谁，传开来两边的脸面一起撕破"
        hidden: "她替同一个模特画过七张，只有一张署了人家的名"
      player:
        identity: "片厂合同科的经手人"
        baseline: "你替她把一份样照使用条款写清楚了；她从此让你先在稿子边上落一枚小记"
        resources:
          - "一式两份的合同底版"
          - "合同科用印的排班"
        reputation: "你只管纸上的字，不管纸外谁跟谁熟"
      relationship_reason: "你替她把一份样照使用条款写清楚了；她从此让你先在稿子边上落一枚小记"
    -
      family: "艺术与传播"
      position: "竞争者"
      appellations:
        - "老师"
        - "直呼其名"
      npc:
        role: "同一厂里抢角色的演员"
        function: "试镜、压戏、把同批的人挡在导演视线之外"
        authority: "自己那间化妆间用不用、什么时候进棚"
        resource: "一份还没公布的排片表与几张攒下的样片"
        limitation: "用谁不用谁在导演一句话里，她只剩一次试镜机会"
        obligation: "台上认戏份，台下不许把同批的私事说出去"
        exposure: "被写成靠人上位，下一部戏就没有她的名字"
        hidden: "她的艺名是公司起的，本名连她自己都没在厂里说过"
      player:
        identity: "跑片院线的伙计"
        baseline: "你们同期进厂，一个留在了棚里，一个去跑片子；她每回试镜都要你先看一遍"
        resources:
          - "几家戏院跑熟的门路"
          - "能先看到未剪版的位置"
        reputation: "你认片子上的署名，不认外头传的话"
      relationship_reason: "你们同期进厂，一个留在了棚里，一个去跑片子；她每回试镜都要你先看一遍"
    -
      family: "商业与产业"
      position: "债主"
      appellations:
        - "先生"
        - "制作人"
      npc:
        role: "片厂的制片主任"
        function: "开戏、压预算、把在拍的一切按时收口"
        authority: "可当场停掉在拍的镜头，也可以一句话换人"
        resource: "一本还挂着账的片款簿与几份未到期的演员合同"
        limitation: "上头一查片款，他递上去的账本就要一页页对"
        obligation: "合同里写明的片款按期结，欠的字据当面认"
        exposure: "挪过一次片款的事翻出来，他在这一行的名分就没了"
        hidden: "她手上有几笔替老演员垫的医药钱，从来没敢记进账"
      player:
        identity: "月历公司的印花买办"
        baseline: "你替她垫过一期石印的钱，条件是下一批月份牌先给谁的脸；她欠你两期，也欠你一句没说清的署名"
        resources:
          - "几笔还没收回的印款"
          - "石印机与制版房先给谁的排期"
        reputation: "你算得清账，也不问墙上那张脸本来是谁"
      relationship_reason: "你替她垫过一期石印的钱，条件是下一批月份牌先给谁的脸；她欠你两期，也欠你一句没说清的署名"
  activities:
    签一份形象使用合同:
      places:
        - "合同科案桌"
      pairs:
        - 0
        - 1
        - 3
      category: "信息交换"
      action: "{npc}把一式两份的合同推到案上，指着署名那一栏空着，问你这一栏是写本名、艺名，还是留白。"
      beats:
        trigger: "{npc}把一式两份的合同推到案上，指着署名那一栏空着，问你这一栏是写本名、艺名，还是留白。"
        objective: "在一枚章落下去之前把这张脸归谁写清楚"
        choice: "照原样落章；或把署名那栏改成艺名再交；也可先只签一份试用、把另一份压在案上"
        immediate: "合同按写下的一栏用印，两份骑缝章对上；写着留白的那一份，脸就算归了公司的纸。"
        near: "用过印的这一张脸进了片款簿，日后重印照样按这一栏走，改要约再排一次期。"
    棚里拍一组样片:
      places:
        - "布景片场"
        - "灯位高台"
      pairs:
        - 0
        - 1
        - 2
      category: "身体靠近"
      action: "{npc}让灯工把光压到最省的一档，请你站到白线里头去，说这组样片只用来起稿、不给外头看。"
      beats:
        trigger: "{npc}让灯工把光压到最省的一档，请你站到白线里头去，说这组样片只用来起稿、不给外头看。"
        objective: "定下这组样子是给画室用还是给片厂存底"
        choice: "站进白线让机位就近取一个角度；或只把手和肩借出去；也可请画师自己进景示范"
        immediate: "机位近了半步，白线重新划在脚边；拍下的卷子先送洗印间冲，谁的柜子还没定。"
        near: "样片冲出来后画室先挑一张起稿，剩下几张按说好的归库，不进厂里的宣传册。"
    对着照片起月份牌稿:
      places:
        - "月份牌画室"
      pairs:
        - 1
        - 2
        - 3
      category: "照护与修复"
      action: "{npc}把放大的照片钉在画架边，摊开半张线稿，问你是照着照片上的眉眼画，还是把那张脸往好看里改。"
      beats:
        trigger: "{npc}把放大的照片钉在画架边，摊开半张线稿，问你是照着照片上的眉眼画，还是把那张脸往好看里改。"
        objective: "弄清这一稿画的到底是谁的脸"
        choice: "照照片落笔；或按老画法把眉眼改圆；也可先只描衣纹，把脸留到模特来了再画"
        immediate: "稿子上那个人的眉眼定了下来，画师在角上落一枚小记，注明这一张是照哪一份样照起的。"
        near: "稿子进制版房之前还能改三处，改动都要在稿角留痕，刊出去的那张脸就挂上墙了。"
    点石印上墙:
      places:
        - "制版房"
        - "月份牌画室"
      pairs:
        - 1
        - 2
        - 3
      category: "空间与退出"
      action: "{npc}把试过的石印版按在桌上，指着版角的空白问你是印上一个名字，还是让它干干净净地上墙。"
      beats:
        trigger: "{npc}把试过的石印版按在桌上，指着版角的空白问你是印上一个名字，还是让它干干净净地上墙。"
        objective: "决定墙上那张脸留不留可追的名字"
        choice: "在版角补一枚名字再开印；或按原样印；也可先只印一小批试贴，看完再说"
        immediate: "版角要么多出小小一行字，要么整批出来都没有落款；废版当场裁开，颜色不对的整批重来。"
        near: "上墙之后谁都能看见那一行字有没有，重印要另开一块版，旧版留在制版房对照。"
    把底片锁进柜子:
      places:
        - "洗印间与底片柜"
      pairs:
        - 3
        - 0
      category: "空间与退出"
      action: "{npc}把晾片绳上那一段负片取下来，捏着登记用的小木牌，问你这一段写谁的名字进柜。"
      beats:
        trigger: "{npc}把晾片绳上那一段负片取下来，捏着登记用的小木牌，问你这一段写谁的名字进柜。"
        objective: "让这一段底片有出处也不算挂在谁头上"
        choice: "写下自己的名进柜；或只写剧组编号；也可先收在身上、明天再说"
        immediate: "柜门锁上，木牌翻到写着的那一面；没写名的那一段等于没来过洗印间。"
        near: "日后有人来查柜，写着名的能对上人，没写名的只剩老师傅还记得那晚谁来过。"
    在灯位高台等一个光:
      places:
        - "灯位高台"
      pairs:
        - 0
        - 2
      category: "日常接触"
      action: "{npc}侧身让出高台一半，指着台下说这条光还得等一阵，问你就在这儿等，还是先下去坐。"
      beats:
        trigger: "{npc}侧身让出高台一半，指着台下说这条光还得等一阵，问你就在这儿等，还是先下去坐。"
        objective: "在等光的这段空里把话说在台下听不见的地方"
        choice: "留在高台上陪着等；或先下去坐到机位边；也可把绳递给他自己下梯"
        immediate: "高台上两个人挨着站定，台下的人只顾看光不看台上，收工前这一段没人来叫。"
        near: "这一条光等到了，戏接着拍；等不到就改日再搭景，台上说过的话不留在场记本上。"
    棚门口认一张脸:
      places:
        - "片场棚门与门禁室"
      pairs:
        - 0
        - 3
      category: "第三方与打断"
      action: "{npc}把登记簿推到窗台边上，指着门外等着的那一圈人，问你今天这张脸是照实认，还是让别人替她认。"
      beats:
        trigger: "{npc}把登记簿推到窗台边上，指着门外等着的那一圈人，问你今天这张脸是照实认，还是让别人替她认。"
