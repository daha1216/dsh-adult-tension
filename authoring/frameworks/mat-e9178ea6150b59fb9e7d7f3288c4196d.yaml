        objective: 在他走出院门之前决定今晚要不要陪这一趟
        choice: 陪他绕一圈再回去；要他把门禁卡先交出来；或当作没看见，先回自己那间房
        immediate: 绕的这一圈有值班员在楼上看得见，灯下站着的两个人当场就被记进了当晚那一行。
        near: 来过的夜里往后都会有人先问一句；不来的人下一次再开口时会先掂量这一句话还值不值。
      far_trigger: 同一段手腕上的记录连续两晚出现在院门那一侧
      far_consequence: 陪过的人往后被叫去做每一次的见证；不陪的人再也不会在散场后被人留到最后一个。
      exits:
      - 陪他绕回房间后各回各处，当夜的事不向第三人说
      - 当场拒绝并交回备用钥匙，往后只管活动室的门
      bindings:
      - activity: 在露台背风处递一杯热水
        place: 康复居所高层露台
        pair: 3
    家属在一纸申请上直接指定了出院去处:
