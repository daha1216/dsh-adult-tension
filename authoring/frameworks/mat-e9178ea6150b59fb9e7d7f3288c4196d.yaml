id: mat-e9178ea6150b59fb9e7d7f3288c4196d
name: 河岸康复与互助居所
material:
  eras:
  - 当代都市
  aesthetics:
  - 行当正剧
  - 暖色生活流
  rule: 康复居所把生活恢复与医疗诊治分开，住户自己决定参与哪些活动，治疗事项由专业人员处理。居所内不得发展恋爱或亲密关系：住户一旦结为伴侣，其中一人须退出本处并转入其他安置处，院方对违背此项的住户行无解释终止；房费按周结清，欠缴即启动清退条款，直系家属可凭一纸申请代为决定照护与出院事务。
  social_rule: 公共空间按不同体力需求布置，照护者也有可以交班休息的时段。门里的争执与私事不见外传：当着外人说破的纠纷，被说破的一方当天即被调离原轮值，院方不问缘由。
  customs:
  - 每条步道都同时标有距离和途中可坐下的地方。
  - 换班前把当日器具与钥匙当面对清，对不上就不交班。
  - 面谈室的门牌只写时段，不写里面在谈什么。
  places:
    河岸缓坡步道:
      details:
      - 双高度扶手旁的长椅留着靠近空间·午后
      - 接待廊可看见最近的休息弯·午后
      profile:
        privacy: low
        visibility: high
        exits:
        - 沿原路返回接待廊
        - 在最近休息点暂停并联系愿意协助的当值人员
        witnesses:
        - 散步的成年住户
        - 按需到场的活动协调员
        affordances:
        - 辨认地图上遗漏的休息点
        - 结束活动并离开
        pressure_modifiers:
        - 实际步道状态
        - 住户自选体力与休息需求
    互助居所共享厨房:
      details:
      - 坐式备餐台旁留着轮椅回转空地·日间
      - 空收纳盒与正在使用的餐具分开·日间
      profile:
        privacy: medium
        visibility: high
        exits:
        - 邻接公共餐厅的平整通道
        witnesses:
        - 当班厨房轮值员
        affordances:
        - 调整备餐台的收纳位置
        - 结束活动并离开
        pressure_modifiers:
        - 轮值交接时间
        - 不同使用者的取物高度
    康复居所阅读廊:
      details:
      - 窗边高低座椅留出并坐与独坐位置·午后
      - 薄书放在无需抬高取物的低架·午后
      profile:
        privacy: low
        visibility: medium
        exits:
        - 门外平整院道
        witnesses:
        - 来还书的成年住户
        affordances:
        - 为彼此挑一段短读物
        - 结束活动并离开
        pressure_modifiers:
        - 读者自选停读时间
        - 流动书架位置
    河畔病房夜间值守间:
      details:
      - 药车停在门口，家属陪护椅只剩靠墙那一张·夜
      - 值班记录只写到病情与用药，签字栏空着
      profile:
        privacy: medium
        visibility: medium
        exits:
        - 经病房走廊回住院部电梯厅
        - 夜间探视时间结束前从病区侧门离开
        witnesses:
        - 巡房护士与同病室的陪护者
        - 相邻床位的成年家属
        affordances:
        - 在陪护椅上守一夜
        - 看一眼当夜的输液与用药安排
        pressure_modifiers:
        - 探视时间与巡房钟点
        - 医师何时说明下一步方案
    康复居所面谈室:
      details:
      - 长桌两侧各留一把椅子，桌上摆着一沓签字样张·日间
      - 门外只有时段牌，没有写名字
      profile:
        privacy: high
        visibility: low
        exits:
        - 从面谈室经接待廊出到院门
        - 中止面谈，当面收回未签署的文件
        witnesses:
        - 居所社会工作者
        affordances:
        - 核对签字栏上的姓名与关系
        - 要求当场说明手续后果
        - 决定自己是否继续参加
        pressure_modifiers:
        - 签字文件是否已经备份
        - 面谈室后一场预约的时间
    康复居所借阅与外出登记处:
      details:
      - 值班桌两边各摆一支按手印的登记笔，借阅簿用钢夹锁在桌面上·日间
      - 出门单按日编号，未回来的那张挂在墙上最显眼处
      profile:
        privacy: medium
        visibility: high
        exits:
        - 登记后从院门自行外出，可按门禁时段回院
        - 撤回出门单留在院内，当日的部分活动不再计次
        witnesses:
        - 当班登记员与排队的成年住户
        affordances:
        - 查一遍自己的借阅与外出记录
        - 申请把当日出门单作废
        pressure_modifiers:
        - 门禁时段与未归院名单
        - 借阅逾期的次数
    康复居所公共活动室:
      details:
      - 折叠椅排成两列，活动室的灯也能只开一半·黄昏
      - 茶水台上摆着公用保温壶与一次性纸杯
      profile:
        privacy: low
        visibility: high
        exits:
        - 散场后沿接待廊出到院门
        - 从侧门提前离场，不必向谁说明
        witnesses:
        - 同场参加活动的成年住户与当值活动协调员
        affordances:
        - 留到散场帮忙把椅子收起来
        - 提前退场并带走自己的杯子
        pressure_modifiers:
        - 散场钟点与末班值班车
        - 还有几个人没有走
    康复居所高层露台:
      details:
      - 露台只开一半，另一半是养有绿植的栏杆侧·黄昏
      - 风把公用遮阳伞吹得偏向一边，墙角留着一只旧折叠凳
      profile:
        privacy: low
        visibility: medium
        exits:
        - 沿内楼梯回到阅读廊
        - 在门禁前下撤，把伞收起无人问
        witnesses:
        - 上来的成年住户与巡检的居所值班员
        affordances:
        - 隔着栏杆看河面一段
        - 把折叠凳挪到背风处
        pressure_modifiers:
        - 风力与日落钟点
        - 露台开放到几点
  pairs:
  - family: 医疗与照护
    position: 外来者
    appellations:
    - 先生
    - 直呼其名
    npc:
      role: 无障碍活动协调员
      function: 询问实际使用时的不便
      resource: 标注椅高与休息点的院区图和可联系的设施值班人
      authority: 调整公共活动的座位和路线
      limitation: 不替住户设康复目标或要求解释停下原因，设施改造须设施组确认
      obligation: 记录本人愿意给出的使用意见，不把拒绝活动记为不配合康复
      exposure: 忽略反馈会使看似开放的活动无法参与
      hidden: —
    player:
      identity: 新搬来的成年住户
      baseline: 你预约了院区体验，协调员想知道哪一段路线最需要改进。
      resources:
      - 自己愿意分享的路线使用感受与休息偏好
      reputation: 协调员只了解你的预约需求，其他生活情况尚待你自愿说明。
    relationship_reason: 你预约了院区体验，协调员想知道哪一段路线最需要改进。
  - family: 服务与手艺
    position: 同侪
    appellations:
    - 直呼其名
    - 哥哥
    npc:
      role: 互助厨房轮值员
      function: 交接食材与器具的位置
      resource: 可坐着试摆的空收纳盒与本次轮值交接清单
      authority: 安排共享厨房的轮值
      limitation: 不能把临时帮忙变成长久照护义务
      obligation: 把器具交接与持续照护分开，确认接班者真实答应的时段
      exposure: 交接不清会让接班者重复劳动
      hidden: —
    player:
      identity: 暂住的成年照护者
      baseline: 你们在一次厨房临时换班中认识，今天约在厨房轮值结束后碰面。
      resources:
      - 自己当班的器具交接笔记
      reputation: 轮值员记得你完成过一次厨房交接，不因此默认你继续当班。
    relationship_reason: 你们在一次厨房临时换班中认识，今天约在厨房轮值结束后碰面。
  - family: 医疗与照护
    position: 共同遗产继承人
    appellations:
    - 直呼其名
    - 先生
    npc:
      role: 院区全科主治医师
      function: 向家属说明病情与下一步方案，并在需要时取签字
      resource: 病历复印件、待签的手术与陪护同意书，以及一张能先调解再处理的联系单
      authority: 可安排病床与诊疗顺序，能不能做某项处置须看签字栏上有谁的名字
      limitation: 不替家属决定签什么，也不为任何人改一份已经归档的病历
      obligation: 先把方案说清再取签字，并把说过的话写进当次记录
      exposure: 签字见不到人，次日整台手术要重新排队，排在他后面的人也跟着等
      hidden: —
    player:
      identity: 与另一位家属共同继承一处房产的成年继承人
      baseline: 你与另一位家属共同继承的房产收益被划作这间病房的开支，签与不签都落在你手上，而另一位继承人的意见还没有到。
      resources:
      - 共同房产的收益单据与那份遗嘱复印件
      - 跨城的当日末班车车次
      reputation: 院方只认单据上的名字，不认谁在家里说话更响。
    relationship_reason: 一份将一间房产收益指定给这间病房的遗嘱把你和另一个人拴在同一张签字栏上，医师是唯一能把后果说清的人。
  - family: 服务与手艺
    position: 被求助者
    appellations:
    - 直呼其名
    npc:
      role: 已戒断的康复住户
      function: 照管居所公共活动室的晚间时段，散场后自己一个人留下来
      resource: 一副活动室的备用钥匙，和一条知道难受时可以找谁的旧名单
      authority: 可决定活动室几点关灯，改不了院区的探视与外出规矩
      limitation: 戒断期不能饮酒、不能独自外出，也不能替别人保管药
      obligation: 每次想喝的时候先告诉一个人，再决定去不去那家便利店
      exposure: 被人看见一次复发，整间居所的晚间活动都会跟着收紧
      hidden: —
    player:
      identity: 暂住的成年照护者
      baseline: 散场之后你替他锁过两回门，他没有解释为什么总留到最后；今夜他忽然问你，愿不愿意陪他在院里绕一圈再回去。
      resources:
      - 居所的门禁时段表与一把备用手电
      - 自己在照护中攒下的作息习惯
      reputation: 照护者，知道半夜的房间是什么样子，不拿这件事去换人情。
    relationship_reason: 你们因为一把活动室钥匙认识，从各自不打算讲的那一段开始互相知道该在什么时候出现。
  activities:
    辨认地图上遗漏的休息点:
      places:
      - 河岸缓坡步道
      pairs:
      - 0
      category: 调查与核验
      action: '{npc}把步道图折到最近长椅，先问你愿意只看图还是走到那里坐一会儿。'
      beats:
        trigger: '{npc}把步道图折到最近长椅，先问你愿意只看图还是走到那里坐一会儿。'
        objective: 辨认图上休息点是否符合实际使用需要
        choice: 只看图或走一小段，也可不评价直接返回；无需说明原因
        immediate: 缺少遮阴或高度不合适的椅子可以标为不适合自己，不把走到终点当验证条件。
        near: 协调员只把愿意提供的设施意见交回，下次是否查看改动仍由住户自己决定。
    调整备餐台的收纳位置:
      places:
      - 互助居所共享厨房
      pairs:
      - 1
      category: 照护与修复
      action: '{npc}把空收纳盒放到两个高度，请你按平常的动作试取，也可以只指出不顺手处。'
      beats:
        trigger: '{npc}把空收纳盒放到两个高度，请你按平常的动作试取，也可以只指出不顺手处。'
        objective: 找到不挡回转空间的常用物收纳位置
        choice: 挪一个空盒或口头建议，也可保留现状不参与
        immediate: 暂定摆位在实际取物中得到比较，够不到的一层改为低频储物，不拿热锅做演示。
        near: 当班人先试用这一区，其他使用者再决定是否推广，提出建议者不用替全厨房重新整理。
    为彼此挑一段短读物:
      places:
      - 康复居所阅读廊
      pairs:
      - 0
      - 1
      category: 日常接触
      action: '{npc}从书架抽出两本薄书，问你想听一页、自己翻，还是只坐在窗边。'
      beats:
        trigger: '{npc}从书架抽出两本薄书，问你想听一页、自己翻，还是只坐在窗边。'
        objective: 共享一段不计完成量的休息
        choice: 读一小段或静坐，也可合上书离开；不解释自己的状态
        immediate: 读到半页也算今天的相处，沉默不被催成心得，照护者可只当听众。
        near: 书归架或依居所借阅约定借走，不用汇报读到哪里，也不默认下次继续同一段。
    守一夜家属陪护椅:
      places:
      - 河畔病房夜间值守间
      pairs:
      - 2
      category: 照护与修复
      action: '{npc}把值班记录与那沓待签的文件放在床边小桌上，让你今晚守在这里等一个答复。'
      beats:
        trigger: '{npc}把值班记录与那沓待签的文件放在床边小桌上，让你今晚守在这里等一个答复。'
        objective: 在巡房与探视时段之间守住这边的床，并知道该等谁的一句话
        choice: 守到天亮；把其中一项处置的签字当场办掉；或把陪护椅让给对方，自己坐到走廊上去
        immediate: 陪护椅上坐着谁，护士睡前会记一行；当夜签掉的那一项，次日排台时先按它走。
        near: 守过夜的人次日会被优先问一句要不要继续守，病区把这一夜的记录留给下一个班。
    按住录音键确认清单:
      places:
      - 康复居所面谈室
      pairs:
      - 2
      category: 信息交换
      action: '{npc}把一支录音笔推到桌子中间，问你要不要按下这一键，把两人说过的每一句留成可查的一份。'
      beats:
        trigger: '{npc}把一支录音笔推到桌子中间，问你要不要按下这一键，把两人说过的每一句留成可查的一份。'
        objective: 让签字前说过的话留成能查、双方都认的一句
        choice: 按下并逐项确认；只要纸面记录不要录音；或合上文件，改天再谈
        immediate: 按下之后当场的话就固定在那一段里，两边谁都改不了口；不按则只有纸面签字作数。
        near: 录下来的那一段会跟着那份文件一起归档，下一次面谈先放一遍再往下谈。
    签掉一份代签申请:
      places:
      - 康复居所面谈室
      pairs:
      - 2
      category: 第三方与打断
      action: '{npc}把一份写着别的名字的申请表推过来，让你看这一笔可以从谁名下走。'
      beats:
        trigger: '{npc}把一份写着别的名字的申请表推过来，让你看这一笔可以从谁名下走。'
        objective: 决定这一笔挂在自己名下，还是让另一个署名的人承担
        choice: 当场签下自己的名字；把表格退回请对方来；或只留复印一份，改天再说
        immediate: 签名栏里写谁的名字，那一笔就跟着谁，归档以后两个人谁都不再有异议的余地。
        near: 署名之后，后续每一次缴费与签字都会被送到同一个名字下，另一个继承人从此只剩知情的份。
    把出门单按手印登记:
      places:
      - 康复居所借阅与外出登记处
      pairs:
      - 3
      category: 空间与退出
      action: '{npc}把借阅簿和当天的出门单推到桌边，让你在开门前按一次手印。'
      beats:
        trigger: '{npc}把借阅簿和当天的出门单推到桌边，让你在开门前按一次手印。'
        objective: 把这一趟外出留成可查的一行，不让它落在别人名下
        choice: 按手印出门；把单子作废留在院内；或只登记借阅，今天不出门
        immediate: 按过的手印跟着这一天的编号走，回来晚过一次，挂墙的那张就会换成别的方式提醒。
        near: 登记表每周收一次，按过手印的人往后几周都会被先问一句今天出不出门。
    把活动室的杯子收完再走:
      places:
      - 康复居所公共活动室
      pairs:
      - 3
      category: 日常接触
      action: '{npc}把折叠椅一把把收起来，问你是现在就出侧门，还是留下来把纸杯装进那只塑料袋。'
      beats:
        trigger: '{npc}把折叠椅一把把收起来，问你是现在就出侧门，还是留下来把纸杯装进那只塑料袋。'
        objective: 在没有旁人的这一段里把两个人今天的相处收个尾
        choice: 留下把灯关到只剩一半；收拾完各走各的；或提前从侧门走，不解释去了哪里
        immediate: 灯关到一半，散场的人和没走的人各自清楚这一段到哪；提前走的人不必向谁说明。
        near: 下一次活动室散场，留下来的人会先看一眼谁还在，留与不留都被记成一种习惯。
    在露台背风处递一杯热水:
      places:
      - 康复居所高层露台
      pairs:
      - 1
      - 3
      category: 日常接触
      action: '{npc}把保温壶放在折叠凳上，问你愿不愿意在这边把杯里的水喝完再下去。'
      beats:
        trigger: '{npc}把保温壶放在折叠凳上，问你愿不愿意在这边把杯里的水喝完再下去。'
        objective: 在露台关门前把这一段没有旁人的时间过完
        choice: 留下来喝完；把凳子挪到背风处继续坐；或其他事找过来，当下收杯下去
        immediate: 伞被风偏向一边，谁站在背风处当场就看得出来，走与留都发生在同一段栏杆边上。
        near: 露台每天只开这一段，来过的人往后都会先看栏杆边有没有人，再看天色。
  pressures:
    轮值表缺少一个交接人:
      source: 兼任厨房轮值的照护者需要临时离开，备餐用具交接尚未找到接班人
      engines:
      - 资源锁定
      - 伤病互护
      beats:
        trigger: '{npc}发现下一段轮值没有确认接班。'
        objective: 为厨房交接找到自愿且可承担的人，不把生活轮值当成专业照护
        choice: 联系居所轮值负责人，或暂缓非必要的备餐活动
        immediate: 仅暂停尚未交接的备餐用具，已下班照护者不被追认成默认接班人。
        near: 轮值负责人确认自愿替代者；无人接手则收好器具，非必要共餐缩小或暂停，不牵连专业照护。
      far_trigger: 下一轮厨房轮值排表时
      far_consequence: 只排明确确认的时段并预留无接班时可暂停的工作，临时帮助不累积成永久职责。
      exits:
      - 按原下班时刻把器具交回负责人后离开
      - 拒绝临时接班，选择不占厨房的休息活动
      bindings:
      - activity: 调整备餐台的收纳位置
        place: 互助居所共享厨房
        pair: 1
      - activity: 辨认地图上遗漏的休息点
        place: 河岸缓坡步道
        pair: 0
    场地调整忽略了通行宽度:
      source: 新的活动布置挡住了一段通道
      engines:
      - 第三方施压
      - 名声保卫
      beats:
        trigger: '{npc}收到住户对通行问题的反馈。'
        objective: 恢复可用通道并听取使用者意见
        choice: 先移动可移动物件，或暂停该区活动
        immediate: 阻挡通道的活动暂停，轻便书架或空盒先移开；受影响住户不用亲自搬物证明不便。
        near: 活动协调员或轮值员联系场地组恢复回转与通行空间，不能立刻恢复时提供平整的替代路径。
      far_trigger: 重新摆放的家具投入日常使用时
      far_consequence: 使用者可自愿再看取用与通行，仍不合用便缩减家具，不以保住原布置为优先。
      exits:
      - 仅指出阻挡位置就沿可用通道离开，不留守监督
      - 暂停本次阅读或试摆，由场地组接手搬动
      bindings:
      - activity: 调整备餐台的收纳位置
        place: 互助居所共享厨房
        pair: 1
      - activity: 为彼此挑一段短读物
        place: 康复居所阅读廊
        pair: 0
    医师在巡房前把待签文件放上床头柜:
      source: 手术与转入无陪护病房的同意书一起摆在床头柜上，医师巡房前只留二十分钟取这一栏的名字，而签字栏上写的是共同继承的另一位
      engines:
      - 时限逼近
      - 身份风险
      beats:
        trigger: 巡房前的二十分钟里，那两份同意书一直摊在床头柜上，你的名字在下面那一栏。
        objective: 在医师推开这道门之前决定这一栏由谁来写
        choice: 当场签下自己的名字；把文件退回要求另一位继承人到场；或只留一张复印件，今天不签
        immediate: 推门进来问的第一句就是这一栏有没有名字，没写名字的那一台手术当场往后排，排在后面的病床也跟着等。
        near: 病历上从此留下谁签过、谁没签过；另一位继承人下一趟到场时，这件事已经按签下的那份继续往下走。
      far_trigger: 七日内另一位继承人仍不到场且签字栏空着
      far_consequence: 院方按空栏撤销这一轮的处置安排，已排的床位与费用由名下那位先承担，两人之间此后只剩单据往来。
      exits:
      - 把双方签字收齐后交回主诊医师归档
      - 不签此栏，交回文件并申请更换处置方案
      bindings:
      - activity: 守一夜家属陪护椅
        place: 河畔病房夜间值守间
        pair: 2
    遗嘱指定的那笔钱只够一个人用:
      source: 共同继承的那间房产收益按月划入病房开支，主管医师当面报价说这笔钱往后只够一个人继续住下去，另一位继承人三天后才有回音
      engines:
      - 遗产之争
      - 时限逼近
      beats:
        trigger: 会客区的座位只有一把，两位继承人隔着一把椅子坐着，报价单刚刚被推过桌面。
        objective: 在对方开口前把这一笔算清，或者当场把座位让出去
        choice: 当面把账目摊开算一遍；把座位与费用一并让给对方；或不谈，起身离开这间会客区
        immediate: 算过一遍的数目当场就能落到纸面，站起来走人的那一刻，往后这一笔账再提起来时已经没有第三个人能作证。
        near: 接下来的七十个小时里谁的名字留在登记处，往后每一笔缴费都会先送到那个人手里；另一个人往后只能接到票据复印件。
      far_trigger: 遗产处分手续进入公示期
      far_consequence: 两人在公示期里各交一次异议，往后这间病房与那处房产不再同时属于两个人。
      exits:
      - 按双方认可的口径分摊这一笔开支
      - 退出这一笔，把病房与房产一并交回遗产处理
      bindings:
      - activity: 签掉一份代签申请
        place: 康复居所面谈室
        pair: 2
    居所内的恋爱禁令被人当面捅破:
      source: 楼里有人当着走廊上的几户人家说破了两间房之间的关系，管理方当日按无解释终止条款启动手续，两间房的钥匙与账单当天就要交回
      engines:
      - 绝对禁止恋爱条约
      - 表面体面破裂
      beats:
        trigger: 说破这件事的那句话还在走廊里，值班室已经在核两间房的钥匙编号。
        objective: 在钥匙被收回之前决定两个人怎么收场
        choice: 当面把事情认下来，一起办终止手续；把其中一间房先退掉，另一个留下走安置调换；或不认这件事，照原样过下去
        immediate: 认下来的当场就交钥匙，两间房当天的账单一起结；不认的那一间今天不动，走廊上那几户往后每天都要从那扇门前过。
        near: 调换名额按排队给，先退房的那一个会先拿到号；留下来的那一个往后进出都会有人多看两眼。
      far_trigger: 下一批安置调换名单公布时
      far_consequence: 退出去的人另找住处、往后不常出现在这一带；留下来的那一个整栋楼都认得他，也认得那扇门里的第二个人。
      exits:
      - 按终止条款交回钥匙并结清两间房的账
      - 退掉一间、另一间转入安置调换队列
      bindings:
      - activity: 把活动室的杯子收完再走
        place: 康复居所公共活动室
        pair: 3
    疗程还差两周药就断了:
      source: 按周发放的药只够到第三周，下一批要到第五周才排得上，而这间居所的费用要先结清当周才继续发药
      engines:
      - 疗程依赖
      - 资源锁定
