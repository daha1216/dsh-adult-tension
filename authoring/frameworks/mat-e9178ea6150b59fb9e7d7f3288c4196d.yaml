        objective: 在药断之前决定钱和药哪一样先保住
        choice: 把当周费用先结掉，剩下的缺口自己去找；只交一半，把药留到最后一刻再领；或当面把两样都停掉，先搬出去
        immediate: 缴费窗口一关，第二天领药的名单就先按这一栏排；走出这间居所的人，往后每一周都要重新找一次药。
        near: 第四周开始会出现打进来的电话，越是没接的人，后面排得越靠后；接了的人往后要按同一套口径解释一遍。
      far_trigger: 第五周药量仍未接上
      far_consequence: 停药的人要么回去排另一处的名额，要么接下照护别人的班次把药换回来；第一次让步之后，这条路会被这里的人记住。
      exits:
      - 结清费用并按周继续领药
      - 退出本轮疗程，换一处重新排号
      bindings:
