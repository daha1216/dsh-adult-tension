        pair: 2
    借阅簿上的那一行已经到期:
      source: 借阅簿上写着的那一本今天必须还回来，保管的人翻过那一页，知道夹在里面的东西不止是书
      engines:
      - 共同秘密
      - 旧事追索
      beats:
        trigger: 借阅簿摊开来，还书栏上是你一个人的名字。
        objective: 在保管的人把这一行划掉之前决定这本东西怎么办
        choice: 当面还回去，里面的东西一并交出来；只把书还了，另外那一件带回去；或今天不去登记处，等过了这一班再说
        immediate: 划掉这一行的时候保管的人会抬眼看一下，夹在书里的东西在谁手上，那个人当晚就知道。
        near: 过期的名字往后每周会被重写一遍，重写的时候旁边会多一个不写名字的批注。
      far_trigger: 下一轮月度清点把这一本列为缺失
      far_consequence: 缺失名单挂上墙之后，借过这一本的几个人都要各写一份说明，写完之后这间居所的人会把这件事记很久。
      exits:
      - 按约定归还并接受清点结果
      - 申请把这一本转为本人的借阅记录，按月续期
      bindings:
      - activity: 把出门单按手印登记
        place: 康复居所借阅与外出登记处
        pair: 3
    走廊上的那几户开始互相核对房号:
      source: 同一层楼里几户开始私下交换名单，核对哪一间住了谁，登记处的门禁折让记录上已经有了两次夜里同进同出
      engines:
      - 共同秘密
      - 名声保卫
      beats:
        trigger: 有人把折让记录抄下来递到值班室，说这门禁出的次数对不上。
        objective: 在被当面核对之前决定要不要把这件事说清
        choice: 主动去登记处把两个人的记录并到一起；照旧各记各的，等被问到再说；或先把其中一个人调去别的楼层
        immediate: 记录一旦并到一起当周生效，两个人往后每次进出都只剩一行；不并的话，这张纸还会被再抄一次。
        near: 下一轮清点把门禁折让记录逐条对一遍，对过之后这一层楼的住户都会知道谁和谁并过那一行。
      far_trigger: 月度名单需要与门禁记录逐条核对
      far_consequence: 并过记录的人从此在这栋楼里只算一个人；没并的人要在下一次核对前把其中一间清空。
      exits:
      - 按并账后的记录继续住下去
      - 退掉其中一间，把这一层楼的关系彻底断掉
      bindings:
      - activity: 签掉一份代签申请
        place: 康复居所面谈室
        pair: 2
  themes:
  - 休息不必靠完成任务换取
  - 照护者的有限轮值
  - 无障碍空间由实际使用者共同决定
  technology_boundary: 当代康复居所以普通无障碍设施、生活工具和专业转介支撑日常；路线体验、厨房摆位与阅读均非疗效测试，不设统一步行指标、自动诊断或由同伴代定治疗方案。病房与面谈室使用的是普通病历、纸质同意书与院区内部对讲，床旁监护按病区常规配置，不存在由同居所内部擅自动用的自动给药或远程诊断装置。
  bridge_status: not_required
