    戒断的人在关灯后又拿起了那一晚的外套:
      source: 散场之后他在活动室里坐了很久，最后把外套搭在胳膊上朝院门那一侧走，手环记着他已经按过一次出门的手印
      engines:
      - 成瘾戒断
      - 信任透支
      beats:
