        objective: 在本周结束前决定这一趟出院谁说了算
        choice: 当场签掉这一个字；把申请退回要求本人到场；或先把这一笔代缴的钱退回去
        immediate: 签下去的那一份当周就生效，住处当天被腾空，钥匙交给谁由这一份决定。
