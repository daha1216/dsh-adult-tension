id: "mat-ed6f2012d2f1dd7e95f724a08647d70a"
name: "会员册与那道墨线"
material:
  eras:
    - "一九二八芝加哥禁酒期"
  aesthetics:
    - "禁酒令爵士黑帮"
    - "黑色电影"
    - "克制冷峻"
  rule: "湖南岸这间地下总会不卖酒不卖舞，只卖「在册」二字：入会须两名在册会员引荐、司册登册、月费照缴，月费人人等额，钱只是门槛不是刻度，权力全在司册那支笔上——写字是准入，划线是除名。会员册记籍不记债，暗门认名字不认口令，与对街靠暗号板进门的酒馆两不相认：那边的本子记欠款，这本册子记存在。除名者当夜由后巷铁门送出，三个整月内不得再被引荐；引荐人对其引荐的人负连带之责，被引荐者犯规，划线连划两行。正册每晚打烊后由司册亲手誊一遍，誊本封存、正册不出账房，任何一行都只能在打烊后改——白天发生的一切悬置到深夜才被账本承认。在册者场内所见所闻止于场内，不是出于美德，而是册上人人都有一行、人人都可以被划；除名听证在账房当着两名会员进行，划线之前被划者有权说完最后一句话。"
  social_rule: "这座城不问你从哪儿来，只问你的名字在不在册上；在册的人隔着乐池点头，除名的人隔着街不许看；雪茄店里没人真正买雪茄，暗门只对「今晚有约的人」开。引荐是给脸也是押命——你的名字从此与那个人的名字写在同一页上；警察与记者进不了地下大厅，因为他们付不起那种月费——付得起的那种，已经在册了。"
  places:
    临街雪茄店与暗门试衣间:
      details:
