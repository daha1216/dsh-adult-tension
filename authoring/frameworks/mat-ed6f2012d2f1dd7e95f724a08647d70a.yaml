        privacy: "low"
        visibility: "high"
        exits:
          - "买完雪茄从临街正门离开，不进试衣间"
          - "经前柜示意进试衣间，镜子后的暗门下地下"
        witnesses:
          - "前柜掌柜"
          - "门口擦鞋童"
        affordances:
          - "雪茄店里等暗门开一次"
          - "在前柜挑一支雪茄等约"
        pressure_modifiers:
