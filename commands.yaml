# 命令配置文件：命令分类、别名、触发词、行为与后台操作。解析以本文件为唯一来源。
# SKILL.md 只保留核心命令速记；模型在每局开始（开局或载入后第一回合）读本文件一次。

# 匹配优先级：先认带宾语的保存/载入，再认无参；其余按最长触发词。
parse_rules:
  longest_trigger: true
  argument_forms:
    - when: 「保存」或「另存为」后跟非空名称
      canonical: 保存到
    - when: 「载入」或「读取」后跟非空名称
      canonical: 载入到
    - when: 「保存」无名称
      canonical: 存档
    - when: 「载入」无名称
      canonical: 载入存档
    - when: 「撤销刚才的 X」且同句附带替换内容 Y
      canonical: 撤销刚才的（带替换）
      advance_turn: true
      note: 按 retcon 记录撤销，Y 作为有效叙事指令推进一个回合（SKILL.md 改写档）
    - when: 「撤销刚才的 X」无替换内容
      canonical: 撤销刚才的
      advance_turn: false
      note: 仅撤销最近事件，不推进回合
    - when: 输入包含顶层 save_version 字段
      canonical: 载入存档
      note: 始终按载入存档处理，先验证再接续
    - when: 单独输入「恢复」语义不明
      canonical: 确认三选一
      note: 先确认是「载入存档」「解除暂停」还是「恢复世界推演」，确认前不推进回合
  missing_object:
    # 需要宾语的触发词裸输入时不执行、不推进，向玩家追问所需参数。
    applies_to: [另存为, 读取, 本局不碰, 解除不碰, 预锁, 种子, 快进到]
    action: ask_for_missing_object

command_categories:
  core:
    name: 核心命令
    commands:
      - triggers: [开局, 开始, 随机开局, 压力开局, 日常开局]
        canonical: 开局
        advance_turn: false
        behavior: 新开局未指定类型时先询问“压力开局”或“日常开局”；仅在等待该选择时把 1/2 解释为压力/日常。明确委托“随便”才默认日常；选择不推进回合、不抽素材、不写状态。载入或续玩不触发此选择。明确后执行 build_opening.py --complete --opening-mode pressure|daily，记录返回的 session/state_path/state_token；仅新局依次输出世界观、人物、正文三个标题，前两项各 1-2 句。用户已明确类型时不再询问；已有进行中状态且未明确要求重新开始时才确认，确认前不重掷、不清状态
      - triggers: [继续, next, c, "...", "……"]
        canonical: 继续
        advance_turn: true
        behavior: 小幅推进环境或 NPC 一个动作节拍；对方已离场时改为最小离屏追算，停在玩家可接手处；必须让时钟变化
      - triggers: [快进到, timeskip]
        canonical: 快进到
        advance_turn: true
        behavior: '更新时间并按 Tier 追算；长时间快进或跨天由提交器自动升级完整追算；仅需强制覆盖自动判定时才显式传 force_full: true'
      - triggers: [撤销刚才的, 撤销, undo]
        canonical: 撤销刚才的
        advance_turn: false
        behavior: 仅撤销最近事件，不推进；持续影响是否撤销由玩家说明
      - triggers: [存档, save, s, 快速保存, qs]
        canonical: 存档
        advance_turn: false
        behavior: 写入当前槽；成功后只回「已保存到「名称」·第 N 回合」，不输出 YAML
        cli: python scripts/manage_saves.py save <当前槽> <state_path> --expected-updated-at <最近载入或保存返回的updated_at>
      - triggers: [保存到, 另存为]
        canonical: 保存到
        advance_turn: false
        behavior: 保存为命名存档 X（允许中文名，空格改 -）；已存在且载入后未被他处修改才可覆盖；成功后只回「已另存为「X」·第 N 回合」
        cli: 新建=python scripts/manage_saves.py init X <state_path>；覆盖=python scripts/manage_saves.py save X <state_path> --expected-updated-at <已观察的updated_at>（缺省该 flag 会被拒绝）
      - triggers: [载入, 读档, load, l]
        canonical: 载入存档
        advance_turn: false
        behavior: '读取玩家提供的 save_version: 3 YAML，先验证再接续，不得重新执行开局；从 current_node.unresolved_action 前一刻直接接续正文'
        cli: 宿主校验通过后将原状态机械写入新建的 saves/sessions/<uuid>/state.yaml，再用 python scripts/live_slice.py --session <session> 获取 state_path/state_token；裸 v3 YAML 没有 manifest.updated_at，不得伪造命名槽绑定
      - triggers: [载入到, 读取]
        canonical: 载入到
        advance_turn: false
        behavior: 载入命名存档 X 并绑定为当前写入目标；从 current_node.unresolved_action 前一刻直接接续正文
        cli: python scripts/manage_saves.py load X 仅返回校验后的 manifest；宿主调用 SaveStore.load_slot(X) 取得同锁状态快照和 manifest，机械写入独立会话工作档，再用 live_slice.py --session <session> 取得绑定
      - triggers: [列出存档, 存档列表]
        canonical: 列出存档
        advance_turn: false
        behavior: 显示名称、回合、当前未决动作（截断显示）
        cli: list
      - triggers: [状态, 查看状态, status]
        canonical: 状态
        advance_turn: false
        behavior: 六行人话——地点、在场、暂停、当前压力、同意判断、可接续动作
        cli: python scripts/live_slice.py --session <session> --human（自定义路径用 --state <state_path>）
      - triggers: [帮助, 命令, 能做什么, help, h, "?"]
        canonical: 帮助
        advance_turn: false
        behavior: 列出核心命令、当前可接续动作，以及行动句三档（含亲密默认尝试档）
      - triggers: [本局不碰, 硬边界, boundary]
        canonical: 本局不碰
        advance_turn: false
        behavior: '新增一条 active 玩家硬边界（commit_turn patch：{"advance_turn": false, "boundaries_add": ["X"]}）'
      - triggers: [解除不碰, revoke]
        canonical: 解除不碰
        advance_turn: false
        behavior: '将对应边界改为已解除；不自动改写既有历史（patch：{"advance_turn": false, "boundaries_revoke": ["X"]}）'
      - triggers: [暂停, 安全词, pause]
        canonical: 暂停
        advance_turn: false
        behavior: '将 safety_state 设为 paused，停止亲密升级，不登记代价（patch：{"advance_turn": false, "safety_state": "paused"}）'
      - triggers: [解除暂停, 恢复场景, resume]
        canonical: 解除暂停
        advance_turn: false
        behavior: '仅在玩家明确要求后将 safety_state 设为 running；不解释为载入存档（patch：{"advance_turn": false, "safety_state": "running"}）'

  advanced:
    name: 高级功能
    commands:
      - triggers: [强制表内]
        canonical: 强制表内
        advance_turn: false
        behavior: 开局结构骰只取表内池（build_opening --complete --force-table）；不绕过 auto 审查门禁，独立旧池须显式 --framework legacy
      - triggers: [表外全随机]
        canonical: 表外全随机
        advance_turn: false
        behavior: 自由表外世界显式使用 build_opening --complete --framework legacy --all-custom，配齐 --custom KEY=VALUE；auto 仍限已审框架，自拟核心规则或时代等不兼容时拒绝，无静默回退；不绕过日常模式限制或状态校验
      - triggers: [预锁]
        canonical: 预锁
        advance_turn: false
        behavior: 锁定结构骰字段（--lock KEY=VALUE，可重复；张力引擎支持 A 或 A、B）
      - triggers: [种子, seed]
        canonical: 种子
        advance_turn: false
        behavior: 指定开局 seed（--seed N，非负整数）
      - triggers: [状态+, status+]
        canonical: 状态+
        advance_turn: false
        behavior: 更细的自然语言状态，仍不暴露字段名
      - triggers: [调试, debug]
        canonical: 调试
        advance_turn: false
        behavior: 完整自然语言状态，可含关系、冷却、事件队列，仍不暴露字段名
      - triggers: [导出存档]
        canonical: 导出存档
        advance_turn: false
        behavior: 先完成保存检查，成功后按 references/状态总结.md 输出完整 v3 YAML；失败时只报告错误，不输出伪存档
      - triggers: [说骚话, 别装了, 做自己, inner]
        canonical: 说骚话
        advance_turn: false
        behavior: '目标角色切入里层语态，不推进回合（patch npc_updates.<id>.active_voice_mode: inner）'
      - triggers: [贴视角, 偷窥视角, pov on]
        canonical: 贴视角
        advance_turn: false
        behavior: '开启内心可见模式（patch {"advance_turn": false, "voyeur_pov": "on"}）'
      - triggers: [退出偷窥, 收回视角, pov off]
        canonical: 退出偷窥
        advance_turn: false
        behavior: '关闭内心可见模式（patch {"advance_turn": false, "voyeur_pov": "off"}）'
      - triggers: [冻结世界, sim off]
        canonical: 冻结世界
        advance_turn: false
        behavior: '关闭世界推演（patch {"advance_turn": false, "simulation": false}）'
      - triggers: [恢复世界, 恢复世界推演, sim on]
        canonical: 恢复世界推演
        advance_turn: false
        behavior: '开启世界推演（patch {"advance_turn": false, "simulation": true}）'
      - triggers: [叙事助手 on, assistant on]
        canonical: 叙事助手 on
        advance_turn: false
        behavior: 开启每回合后一行建议（默认关；本会话有效，不进存档）
      - triggers: [叙事助手 off, assistant off]
        canonical: 叙事助手 off
        advance_turn: false
        behavior: 关闭叙事建议

# 工作会话与命名槽是两组不同的绑定，不进入 v3 状态字段。
runtime_binding: |
  新局默认独占 saves/sessions/<uuid>/state.yaml，可用 --session ID 指定稳定会话。
  后台 opening_brief/活切片返回 session、绝对 state_path、原始文件字节 SHA256 state_token。
  自定义工作文件的 session 可为 null，此时只按 state_path 绑定，不猜测全局工作档。
  提交必须显式使用 --session <session> --expected-state-token <state_token>，或兼容 --state <state_path>。
  --state 旧调用可不带 token；携带时同样在文件锁内验证。失败不输出成功回执，过期 token 拒绝写入。
  过期后重新读取切片并重新判断 patch，不能仅替换 token 重放；成功后记录新 token。
  auto 只使用来源哈希匹配且审查有效的框架，无合格框架时报错，无隐式 legacy 回退。
  开局只有校验通过且要求的状态写入都成功才追加历史；输出已存在或状态写入失败不污染历史。
  提交后的 event_changes 含新 resolved/cancelled 终态及 outcome；取消说明用 cancel_outcome。
  终态事件保留在 events 中，resolved_summary 是结果摘要，不做物理归档。
  python scripts/live_slice.py --session <session> --event <ID> 可重复 --event 或一次列出多个 ID，定向取回结果。
  普通 pending_events 上限仍为 10 条，另带省略提示；定向查询不要求输出整份状态。

# 存档槽与「当前槽」绑定规则
slot_binding: |
  存档落在 saves/slots/<名称>/（state.yaml + manifest.yaml），由 scripts/manage_saves.py 原子写入。
  槽名允许中文，空格改成 -。
  「当前槽」是会话上下文里记录的槽名；未绑定时先确定名称，不猜写已有 main；「载入 X」后当前槽切换为 X。
  载入时记录 manifest.updated_at；覆盖保存必须携带该值（--expected-updated-at），不匹配即拒绝，
  不自动合并两个窗口的状态。保存冲突时用自然语言给出 A 读最新 / B 另存 / C 取消，
  单窗口正常游玩时无需主动提示多窗口冲突逻辑。
  跨会话续玩必须先明确「载入 X」重建这组绑定（槽名＋载入时的 updated_at），否则无法覆盖保存。
  状态解析和 state_sha256 校验来自同一字节快照，并处于同一个槽锁内。
  保存 state/manifest 任一步失败会恢复原有效文件对；初始化失败不留下可用槽。
  load CLI 不会创建会话工作档；宿主只可复制 SaveStore.load_slot 返回的已校验状态，不能在锁外重读槽文件代替该快照。

notes: |
  若已有进行中状态，只有在玩家未明确要求放弃或重新开始时，输入「开局」才先确认是否放弃当前局；确认前不重掷、不清状态。
  单独输入「恢复」时优先依据当前上下文处理；只有存在两个或以上合理含义时才暂停推进并确认是「载入存档」「解除暂停」还是「恢复世界推演」。
  需要宾语的命令（另存为/读取/本局不碰/解除不碰/预锁/种子/快进到）裸输入时不执行、不推进，
  直接追问所缺参数。
  空输入、单独的「……」与「继续」同一语义。简写：s=存档，l=载入，c=继续，h=帮助，qs=快速保存。
