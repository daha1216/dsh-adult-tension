quality:
  grade: B
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
    「烧掉即绝版」把归属写成不可逆的实体承诺、封袋双签把合意留在指纹上——机制与既有全部框架无同构，判为独特；但设定稿存在已记录的事实性偏差（自称 aesthetics 与同 era 框架零重叠，实证 克制冷峻 已用于同 era 的课时铃的两端、黑色电影 已用于同 era 的打赏榜与最后一格），且当代都市为第 10 个框架，era 拥叠叠加两条美学重叠构成抽取拥挤风险，独特性打折，评 B。
activity_functions:
  谈一份一卷一约: 信息交换：四栏谈清才开灯，空一栏的单子当场撕掉
  布一盏帘内的灯: 日常接触：布光就是谈话，灯落定的那一刻站位就定了
  按下一次快门: 身体靠近：先问出那句「可以吗」，合意落在胶片上
  当场封袋双签: 空间与退出：两枚指纹一行日期，袋子封上卷就归持袋人
  显影一位主人到场的卷: 照护与修复：药水里浮出来那三十秒谁也替不了她
  灯箱上一格一格选片: 调查与核验：一格一个决定，裁掉的那格从此世上没有
  器材间里倒一卷带: 日常接触：倒片台前的手最诚实，倒错一格就是一卷事故
  深夜车库交一卷底片: 第三方与打断：记录仪红点亮着，纸袋停在两只手中间那两秒
  橱窗前接待一位生客: 信息交换：橱窗一张人像不挂，满城的人还是冲人像来
chemistry:
  pairs:
  - pair: 0
    needs: 她需要那卷永不显影的底片继续沉在柜底；玩家需要封袋上的第二签名不只是今晚的临时工
    misreading: 把执机资格当成被需要，把柜规当成隔阂
    asymmetric_cost: 她押的是二十年零泄露的口碑，玩家押的是唯一还接私房约的位置
    ritual: 快门前必问「可以吗」，封袋时拇指按同一行
    conflict_loop: 越靠近那卷不许显影的越想问，越问越守不住「袋在人在」
    repair: 把钥匙与规矩原样交回，只做掌机的那双手
    irreversible_threshold: 私自显影那卷另一把钥匙已随葬的底片，会终止两人之间所有的卷号
  - pair: 1
    needs: 她要名册里那个七年没断的花名继续只有自己知道；玩家要共用暗房的信任按钥匙数成立
    misreading: 把镜像卷号当成把柄，把厚三年当成俯视
    asymmetric_cost: 她押的是「翻拍过别人底片」嫌疑的边界，玩家押的是共用暗房的那一把钥匙
    ritual: 卷号簿各记各的，暗房排期当面写
    conflict_loop: 越对得上她的卷号越像盯梢，越不对照越接不住同一晚的岔
    repair: 两本簿子并排对一次卷号，花名永远不见面
    irreversible_threshold: 把她名册里那个花名的真身说出口，会终止两间工作室共用的那道门
  - pair: 2
    needs: 她要引荐簿里三个同人的花名继续分属三页；玩家需要从一张路条换成一个自己的卷号
    misreading: 把带进巷子当成认可，把「只到门口」当成敷衍
    asymmetric_cost: 她押的是二十年信用与半圈花名，玩家押的是三个月聊出来的信任
    ritual: 传话不过手底片，签约先看四栏
    conflict_loop: 越感激引荐越想替她收簿子，越收越接近那三页的秘密
    repair: 把路条折回口袋，回到卡座从生客接待重新学
    irreversible_threshold: 翻拍引荐簿哪怕一角，会终止这张路条带你进过这条巷子的全部资格
  - pair: 3
    needs: 她要拍回手术前那晚没来得及告别的自己；玩家要把快门等到她自己点头
    misreading: 把发抖当成反悔，把「今天就到这儿」当成失败
    asymmetric_cost: 她押的是攒了半年的勇气与两年的瞒，玩家押的是「能把门关上」的口碑
    ritual: 灯先压半档，医嘱那页她攥着，计时钟归她按
    conflict_loop: 越想护她越想替她喊停，越替她喊停她越走不进帘内
    repair: 空一格也是一格，显影只陪不替
    irreversible_threshold: 替她签掉「底片归客」之外的任何一栏，会终止她把身体交回镜头前的唯一一次
