name: 私房写真与底片归属
source_hash: 140764ec1d8aad68fbd2fc03c100fec65bcc4de7a9cbd5baf94aa248b18f21f3
semantic_status: REVIEWED
reason: 来源为 tailor_photo_drafts.md B 版「私房写真与底片归属」（本轮双框架并行生产，落稿报告 tp_build_b_sifang_xiezhen.md）。布光间、暗房与底片柜三条线打通：9 地点各带出口/见证/可用项（high 2 为私房布光间·内帘、暗房与显影盘），9 活动 7 类，10 压力各绑 2 组三元组共 20 行、与设定稿配平表逐字一致，三向可达。机制是「快门之后的归属经济学」：四栏委托单谈清才开灯、封袋双签、显影须主人到场、烧卷绝版——价目从来不是争点，争的是那卷唯一的东西躺进谁的柜子、这段形象归谁定价。rule 内与打赏榜与最后一格、片场棚与月份牌、动捕棚与中之人、「谁先看到材料」行当、偷拍登报五路近邻逐条拉开分野。写手自验 366 checks 0 errors，池真值零冲突，9 地名与全库零同名，静态复核通过。
checks:
  era_and_theme: true
  space: true
