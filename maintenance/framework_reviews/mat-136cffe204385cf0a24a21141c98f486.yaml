activity_functions:
  记录港湾夜景: 共同体验：形成审美偏好而非资料任务
  在候车厅核对两张票: 信息交换：弄清回程位置的实情，以及改签各自要付什么
  在末班渡轮上说到底: 日常接触：在靠港之前把这一段没说完的说完
  补订一间加住房: 空间与退出：把住处的安排说清，不让它替人做决定
  在封路告示前商量去留: 空间与退出：封路期间按实际路况决定各自的去处
  在露营营位板上调整安排: 信息交换：在熄灯前把住处与距离定下来
  在山径岔口决定下撤时间: 空间与退出：在光线和体力都还够的时候定下撤的时间
  在面签窗口把材料摊开: 调查与核验：在叫到号之前把各自要签的那几份分开
  在游艇便条上补完半句话: 第三方与打断：说清这张便条是给谁的，写下去要担什么
  在退房口排一次队: 第三方与打断：把加住的那几晚算清，谁的账归谁
  在观星台等一次云隙: 日常接触：把等云的限度说清，不把它变成对另一个人时间的占用
  整理公开灯塔照片: 视觉考证：修正地点认知
  试走停泊参观路线: 路线试走：确定访问边界与返岸方式
  标记夜空方位: 技能传授：获得可复用的观测方法
chemistry:
  pairs:
  - pair: 0
    needs: 领队要可兑现的返程，摄影师要等一束光
    misreading: 把停步误作不顾他人
    asymmetric_cost: 领队承担队员等待解释，摄影师损失错过光线的作品
    ritual: 先报最后接驳时刻，再各指一个想看的景
    conflict_loop: 越赶路越想补拍，补拍越久越催促
    repair: 划一段自由停留时间，到点各自回程
    irreversible_threshold: 代替对方退掉返程票后终止带队合作
  - pair: 1
    needs: 摄影师要画面真实，领队要路线好走
    misreading: 把建议换角度当成否定实走经验
    asymmetric_cost: 摄影师付设备和创作时间，领队付重新踏查里程
    ritual: 看旧照前各猜一次拍摄位置
    conflict_loop: 领队催定地点，摄影师不断补条件
    repair: 亲走一个可达机位，再区分旧景与今日景
    irreversible_threshold: 未经同意把试拍修成虚假景点宣传后停止供图
