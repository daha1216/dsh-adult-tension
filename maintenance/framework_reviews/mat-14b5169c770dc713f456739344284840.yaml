  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
    「下一个落在谁头上」把虚拟主播的继承权写成资产交接，声纹只给相似度不给唯一解、维护必须走物理工坊——机制独特且成年纪律写实；因 pair3 position 受池缺口强制平移（教练→上司，回滚路径已记录在案）暂评 B，社会位置表同步 31→33 后可复评升 A。
activity_functions:
  复盘一场直播的数据: 调查与核验：屏幕上的每一秒都在权限层级里
  动捕棚校准半小时: 照护与修复：进棚先贴标记点再说话
  声纹帖的来路查到机房: 调查与核验：机器只能怀疑，定罪要靠人
  换皮套的排期会: 信息交换：第七任之后还有没有第八任
  隔音舱里睡一个午觉: 日常接触：进舱的人不问真名
  全息彩排走位: 日常接触：皮套对粉丝的承诺由公司代为兑现
  竞业到期夜收拾东西: 空间与退出：走的那天声纹、动捕数据与全部权限当场注销
  事故演练变成真事故: 第三方与打断：维护时段里再大的事故也只能排队
  小电台的双人连线: 身体靠近：红灯亮着的时候连旧 ID 都不叫
chemistry:
  pairs:
  - pair: 0
    needs: 她需要软萌人设与台本外的真声线永不相认；玩家需要那个四十七人的频道还是老地方
    misreading: 把没说破当成没听出，把答应线下见面当成要相认
    asymmetric_cost: 她押的是百万粉丝面前的马甲，玩家押的是小频道里的旧 ID
    ritual: 连线只聊台本内的，旧 ID 谁也不叫
    conflict_loop: 越听得出真声越不敢说，越不说越只剩那间机房能喘
    repair: 把频道里的身份留在频道里，线下重新认识一遍
    irreversible_threshold: 在直播间外叫破她的旧 ID，会终止两个频道里的一切
  - pair: 1
    needs: 她要原始数据的边界守住；玩家要未加密的底牌打得出去
    misreading: 把项目借调当成接管，把守边界当成防你一手
    asymmetric_cost: 她押的是设备权限与夜间值守，玩家押的是出场名单的否决建议权
    ritual: 夜间校准两个人同时在场才开机
    conflict_loop: 越掌握数据越想用在排期上，越用越越过她的边界
    repair: 把报表只交给会议，不留私人缓存
    irreversible_threshold: 绕过她动一次原始数据，会终止同时在校准表上的资格
  - pair: 2
    needs: 她需要每一份皮套按资产并购案过手；玩家需要跑腿攒下的情分不变成站队
    misreading: 把留下来帮忙当成投名状，把不赶人走当成提携
    asymmetric_cost: 她押的是永续计划的整个盘子，玩家押的是经手排期表的位置
    ritual: 事情办完不走也不多话，她也不赶
    conflict_loop: 越帮忙越像入伙，越入伙越脱不开第八任的安排
    repair: 把那晚的情分记成加班，表上两清
    irreversible_threshold: 把她的方案提前透给候补，会终止执行层对你的信任
  - pair: 3
    needs: 她需要排期表轮到自己的那一行；玩家需要带出来的节奏经得起上场
    misreading: 把陪着练到改完当成偏爱，把只认场上表现当成冷
    asymmetric_cost: 她押的是候补室里那个编号，玩家押的是训练录像的分段剪辑权
    ritual: 训练按录像分段，说改动作就陪着练到改完
    conflict_loop: 越像「下一个」越不敢真上场，越不上场越只剩这间房
    repair: 把轮换排期当面排给她看，凭场上表现说话
    irreversible_threshold: 拿私情替她换一次上场机会，会终止只认表现的带教
