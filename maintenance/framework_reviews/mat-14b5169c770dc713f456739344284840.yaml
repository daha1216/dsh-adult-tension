reason: 来源为 streaming_setting_drafts.md V3「动捕棚与中之人」（本轮七框架并行生产）。主棚、隔音舱与小电台机房三条线打通：9 地点各带出口/见证/可用项（high 2 为隔音舱休息室、中之人匿名公寓），9 活动 7 类，10 压力各绑 2 组三元组（19 项互异引擎，皮套掉落危机跨 P1/P9 复用为合法跨压力复用），三向可达。机制是「人可以走、皮套不许停」：虚拟皮套账号与后台归公司永续经营、设定与纪念日全量继承，合同只锁皮套不锁人，走的那天权限当场注销；怕的不是内容流出，是身份被钉死。与同 era 的赛博街区以「没有信用分、泄露只是压力事件不是收不回的副本」分野，与 mat-295d（同人街区）以声纹溯源对经纪人查岗反向，与民国片场以「皮套是公司账上的资产不是她的脸」分野。写手自验 383 checks 0 errors，静态复核通过。唯一实质偏差为 pair3 position 由设定稿「教练」平移为「上司」，根因同蒸汽浴场（pools.yaml 社会位置表 31 项对 identities.yaml player 33 项的警官/教练缺口）；称谓「教练/制作人」与 player 块教练语义全保留，池同步后可整字回滚。
