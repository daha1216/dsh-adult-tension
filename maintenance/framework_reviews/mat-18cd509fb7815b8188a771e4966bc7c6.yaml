activity_functions:
  辨认残卷版式: 版本比勘
  核对旧戏本: 用排演验证戏本改动
  整理地方碑录: 拓片展平与保存
  设计读书小径: 安排步行与停读节奏
  共读地方掌故: 无任务的地方闲谈
  布置水上书会: 可上岸的水上共读布置
  塔顶清点可携经卷: 调查与核验：在风势与更次允许的范围内定下先携哪几卷下楼
  试探悬空栈道承重: 空间与退出：在不拆板的前提下判断哪一段只容一人通过
  比对沙层走位与旧图: 调查与核验：找出还能承重的落脚序列
  在纱帘隔间谈一笔买卖: 第三方与打断：决定这桩买卖留不留可查的名目
  查对未结的走货牌: 信息交换：在出车前定下哪几桩活能结、哪几桩得压着
  读取石坛未磨去的刻痕: 调查与核验：定下这处坛到底该照哪一份旧例来用
  在旧铺位上安置随身物: 日常接触：决定这一晚什么东西脱离自己的手
  听一支只弹给一个人听的曲子: 身体靠近：把这一次见面的长短说在明处
  用掌心温热腕上冰凉的翡翠玉镯: 身体靠近：看清这只镯子算谁的、摘下来又算谁的名分
  对弈时让半子: 日常接触：把这一局里的人情算清楚
  摆出两个选项: 信息交换：逼出一个当场就得落定的取舍
  替她系松开的盘扣: 身体靠近：把这一下动手的范围说在明处
  让可信任的人见证条件: 第三方与打断：把话说成有人认账的样子
  递过斟满葡萄美酒的金樽: 第三方与打断：弄清这一杯的由头再决定接不接
chemistry:
  pairs:
  - pair: 0
    needs: 修补师要保存残缺本身，藏书人要让读者认出卷次
    misreading: 藏书人把拒绝拼页看成藏技，修补师把求完整看成催造假
    asymmetric_cost: 修补师赔工料；藏书人面对一整季借阅空缺
    ritual: 每次拆匣先合看页边旧编号
    conflict_loop: 越急借出越催合订，越催修补师越不愿触纸
    repair: 另做阅读副本，原件只做已核实的支撑
    irreversible_threshold: 为凑卷次裁去原页边款，此后无法恢复原始证据
  - pair: 1
    needs: 藏书人想让书走进戏台与园林，修补师想减少珍本翻动
    misreading: 外借被误读为不爱惜，收存被误读为独占学问
    asymmetric_cost: 藏书人失去读者；修补师承担返修且失去完好的原页
    ritual: 开读前用衬纸演示一次翻页
    conflict_loop: 外借越受欢迎，修补师越缩借期，读者越集中挤在短时段
    repair: 以抄本流通换原件休整，并约定按纸况复查
    irreversible_threshold: 未经同意把孤本带上离岸画舫造成水损，重抄不能抵作原件归还
