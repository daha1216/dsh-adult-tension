quality:
  grade: A
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
    「档册知情权」以一页不可复制的身体史作锚——数是真的，争的只是谁有权让它继续写；配平表 20 行三向覆盖自洽、引擎逐字在池、地名零撞，与既有含片场棚、打赏榜在内的全部框架无同构，判为明显独特。维多利亚雾都为第 3 框架、同 era 美学三条零重叠，拥挤度可接受。设定稿仅存计数行笔误与两处措辞级偏离，均已记录且不影响结构。
activity_functions:
  初量读数落簿: 身体靠近：读数出口即落簿，想咽回去的那半寸纸比人先记住
  毛样试身回三针: 身体靠近：第三针落下之前随时叫停，叫停不收费也不记档
  翻旧档对一页尺寸: 调查与核验：旧数不会说谎，可归谁解释归握着梯子的人
  拆亡衣对衬里旧数: 照护与修复：拆出来的东西没上过档，只属于先看见的这双手
  代办量体回誊读数: 信息交换：手折回铺当众誊档，路上那一夜改一寸只有软尺知道
  账房结清一单取衣: 日常接触：钱账身账在柜台制度性分家，柜台什么都记得只是不说
  深夜送成衣走后门: 空间与退出：帘一放，这一单从台历上消失
  大案上画样裁布: 日常接触：一剪下去收不回，给哪一寸留余量全在不言中
  打烊后誊一页新档: 日常接触：笔停在哪一行，哪段日子就被承认
chemistry:
  pairs:
  - pair: 0
    needs: 她需要档册里自己那一页继续十年不重量；玩家需要外来的手艺被这间铺子的规矩承认为立足之地
    misreading: 把破例上楼当成情分，把守口当成疏远
    asymmetric_cost: 她押的是三十年口碑与整柜档册的完整，玩家押的是外来者唯一一次的进门资格
    ritual: 上楼先守梯，看档不出声，数与数之间不问来历
    conflict_loop: 越懂她的档册越想翻到那一页，越翻越不敢让她执尺
    repair: 把那一页还回原柜，各自只做手艺上的搭档
    irreversible_threshold: 当众量出她十年没更新的那一页，会终止她在这间铺子里的名字
  - pair: 1
    needs: 她要默回亡母那一页；玩家要同门规矩在自己这半本档册上继续成立
    misreading: 把默档当成背叛，把行规当成挡箭牌
    asymmetric_cost: 她押的是进不了同业会馆的风险，玩家押的是同门情分与自家档册的干净
    ritual: 同案各写各档，眼睛互不相看
    conflict_loop: 越抓她的默档越怕坐实自己默过，越沉默越像共谋
    repair: 行会见证下两家老档对读，把数还给数
    irreversible_threshold: 把她默档的证据递进行会，会终止两本档册互为校验的所有日子
  - pair: 2
    needs: 她要外祖母那一页和那个姓氏的正当性；玩家要师父留下的梯子守得其所
    misreading: 把认领当成抢铺，把守梯当成占档
    asymmetric_cost: 她押的是继承文书与姓氏，玩家押的是口传暗记的一半与这条街的眼睛
    ritual: 档册事务楼下交接，暗记读法不外传
    conflict_loop: 越守钥匙越像窃档，越让一步越守不住师父的规矩
    repair: 把外祖母那一页亲手誊给遗属，原件归柜
    irreversible_threshold: 裁走那一页随她出户，会终止这间铺子三代人的身体史
  - pair: 3
    needs: 她要档册里病前那一页的旧数；玩家要三季欠账与全行口碑两全
    misreading: 把压价当成狠，把欠账当成情分
    asymmetric_cost: 她押的是独家料路与「用档抵账」传开的危险，玩家押的是铺子的生计与一句公道话
    ritual: 账在柜台算清，柜上从不提楼上
    conflict_loop: 越赖账她越要那一页，越给那一页越像承认身体也能抵账
    repair: 把料钱折成一次当众销账，那一页只借看不抄
    irreversible_threshold: 让「一页档抵一季料」白纸黑字成交，会终止全行对这间铺子的赊与信
