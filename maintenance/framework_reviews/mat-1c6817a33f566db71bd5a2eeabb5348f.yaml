reason: 来源为 tailor_photo_drafts.md A 版「量体尺与尺寸档案」（本轮双框架并行生产，落稿报告 tp_build_量体尺与尺寸档案.md）。量体间、二楼档册室与雾巷后门三条线打通：9 地点各带出口/见证/可用项（high 2 为量体间与三面镜、二楼档册室），9 活动 6 类，10 压力各绑 2 组三元组共 20 行、与设定稿配平表逐字一致（设定稿计数行 3 处笔误按配平表本体不采信），三向可达。机制是「一寸不撒谎的知情权经济学」：读数落簿不可涂改、新数写在旧数下面；档册记身不记钱、不出二楼；三次回针是接触的合法刻度、第三针前随时叫停；裁页带走是行内最重的断交——争的从来不是数，是让簿子继续写、停写还是裁走。rule 内与课时铃的两端、片场棚与月份牌画室、舞厅大班与乐台后台三处近邻逐条拉开分野。写手自验 386 checks 0 errors，池真值零偏离，9 地名与全库零同名，静态复核通过。
checks:
  era_and_theme: true
  space: true
  people: true
