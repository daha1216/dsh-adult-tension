semantic_status: REVIEWED
reason: 保留传媒题材必须的核验，但补入纯看展与休息；审查明确剪辑和澄清均不能自动公开所有原始录音。；2026-09-10 第二人物组资源/限制差异化强化后同步源哈希；2026-09-12 第二波收尾：新增活动/地点经机械复核（space/people/daily/pressure_bindings
  全通过），activity_functions 补齐至覆盖全部活动后同步源哈希。
checks:
  era_and_theme: true
  space: true
  people: true
  daily: true
  pressure_bindings: true
  distinct_functions: true
quality:
  grade: B
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
activity_functions:
  设计公开事实问答: 事实核验：改变陈述可信范围
  编排采访章节: 叙事协商：在时长与语境间做真实取舍
  校订展览导览词: 对象考证：区分作品历史阶段
  关掉录音一起看一件作品: 非工作共处：恢复人的偏好而非资料生产
  在隔音棚外等门里那句录完: 身体靠近：在母带导出之前确认那段声音里有没有不该留的东西
  按小时更新一份传播量手写表: 调查与核验：判断这一轮传播是已经见顶还是要换平台再来一轮
  在包间里交换一条还没公开的消息: 信息交换：在席散之前判断这条消息换出去会不会砸到自己的线人
  在公用厨房对一张催缴单: 日常接触：在同层住户回来之前决定这张单子的户名
  在包间里认出对方手里那份没发出去的稿: 信息交换：在席散之前弄清这份稿子该按当年的哪一版重开
  在开播前问一句不该问的: 第三方与打断：在开播信号接通之前决定要不要把自己的来源名单交出去
  在闭馆后的展线尽头并坐: 日常接触：在清场广播之前决定这段独处要不要留下来
  趁开播前两分钟关掉补光灯: 空间与退出：在开播信号接通之前决定这段关系要不要出镜
  把和解条款逐条对回传播量核算: 调查与核验：在被追问之前弄清哪一行的数字是自己签得起的
  把手稿的署名时间对回门禁记录: 调查与核验：在归档之前把纸面时间与系统记录对上
chemistry:
  pairs:
  - pair: 0
    needs: 核查编辑要前提完整，策划要节目听得下去
    misreading: 把删冗句听成要牺牲事实
    asymmetric_cost: 编辑承担错误名声，策划承担超时成本
    ritual: 开会先各读一句最担心误读的话
    conflict_loop: 越补条件越长，越长越剪掉条件
    repair: 先定最小必要前提再削重复例子
    irreversible_threshold: 明知证据相反仍冒用对方核准署名后停止共稿
  - pair: 1
    needs: 策划要叙事连续，核查要疑点可见
    misreading: 把暂停回放当成否定整个节目
    asymmetric_cost: 策划消耗棚时，核查承担漏检后果
    ritual: 先连听一遍不打断，再逐处停
    conflict_loop: 不断暂停使整体失去节奏，反过来又催快
    repair: 一遍听整体一遍核句子，明确谁负责最终取舍
    irreversible_threshold: 隐藏原始录音让对方替误导剪辑背书后不再共剪
