activity_functions:
  整理老建筑专页: 采访取舍与叙事视角
  制作手艺访谈: 通过手工试做理解工序
  校对展品说明: 区分出处证据与销售说辞
  排版演出节目单: 按演出动线安排节目交接
  在茶馆柜台续一份口述委托: 信息交换：分清转述与本人原话
  在当铺柜外核对当期与赎价: 调查与核验：在到期前把当期与赎价对上
  在香道馆后间试一段待印的稿: 调查与核验：把撰稿人自己的判断与馆方口述分开
  在暗门后隔间交接一份无名底稿: 空间与退出：让交接有出处也能撤得干净
  在卸货码头点数货箱并留字据: 调查与核验：让扣下的每一箱都有字据对上
  在防弹车后排同乘一段路: 信息交换：在到地方之前把能认的旧契认出来
  在公馆暖阁替客人续一炉炭: 照护与修复：让这一夜有人接着看住病情
  在排字房赶一版限期付印: 空间与退出：在付印时辰前排出先登与署名的次序
  在后台对一遍交割场次: 调查与核验：在交割前把场次与款项对上
chemistry:
  pairs:
  - pair: 0
    needs: 编辑要保住故事的语气，校对员要有能落字的确定版本
    misreading: 编辑把圈改当作抹平人情，校对员把临时加句当作轻视工时
    asymmetric_cost: 编辑损失署名信用；校对员多做的重排未必有工钱
    ritual: 付印前互读最后一句，再交换不同形状的校记
    conflict_loop: 编辑为受访者加话，校对员缩句，双方越改越觉得对方不懂原意
    repair: 一起请住户只确认争议句，固定清样后补算重排工钱
    irreversible_threshold: 明知引语虚假仍以对方名义签付印，日后须各自署责，无法再称共同确认
  - pair: 1
    needs: 校对员想让手上工序被准确理解，编辑想让外行读懂
    misreading: 校对员把简化说法看成偷工，编辑把示范看成拖延
    asymmetric_cost: 校对员占用裁缝台面欠下人情；编辑承担空版延期
    ritual: 每次访谈先做一个废料样，再问一句没听懂的话
    conflict_loop: 编辑先下标题，试作推翻标题，校对员反复要求返工
    repair: 保留样品解释删改缘由，重写一段可由裁缝认可的说明
    irreversible_threshold: 把未公开客单印出后即使收报也不能收回知情范围
