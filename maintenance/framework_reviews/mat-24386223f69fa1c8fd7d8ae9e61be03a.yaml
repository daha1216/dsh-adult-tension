quality:
  grade: A
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
    「核准的假与违规的真」把恋爱条款写成商品目录，唯一不可定价的是心动本身；七日周榜窗口构成慢速舆论机器，与河岸/街坊等同域近邻无同构，判为明显独特。
activity_functions:
  对一遍明天的官方口径: 信息交换：核准的不算恋爱，报备是唯一的通行证
  练习室加练到锁门: 照护与修复：身体和习惯都还记得，身份却已经没了
  签售通道走完最后一排: 日常接触：握手三秒，超时保安轻拍椅背
  保姆车里对完台本: 身体靠近：司机只听不看，是全行业的默契
  导播间掐掉半句话: 第三方与打断：延时器只掐得住一半
  熄灯前把人送回走廊: 空间与退出：宿管的手电已经上楼梯
  停车场里认出长焦镜头: 调查与核验：底片只有实体一份，既是威胁也是护城河
  后台通道里换一次装: 身体靠近：把最狼狈的样子挡在镜子与门之间
  天台上把真话说完: 日常接触：顶灯下唯一不被拍到的地方
chemistry:
  pairs:
  - pair: 0
    needs: 她需要零绯闻的形象经得起周榜；玩家需要白天的职权不带进那扇门
    misreading: 把定档期的签字当成掌控，把不占用私人时间当成疏远
    asymmetric_cost: 她押的是合约里的违约金档，玩家押的是入行第三年的位置
    ritual: 档期在会议室谈，电话递到面前时只问按哪条处理
    conflict_loop: 越护她的形象越要替她决定，越替她决定越像合约第七条
    repair: 把那通电话的选择权原样还给她
    irreversible_threshold: 用签字权压她撤销一次报备，会终止她只问你一个人的信任
  - pair: 1
    needs: 她需要这桩合作在账面上成立；玩家需要第一次核对的真实版本保住体面
    misreading: 把介绍人的双重背书当成分量，把体面的台阶当成拒绝
    asymmetric_cost: 她押的是家族评估的那页账，玩家押的是可以退出的台阶
    ritual: 饭局只谈双方都被夸张过的部分
    conflict_loop: 越核准越像恋爱，越像恋爱越只能写进纪要
    repair: 把这张通行证的有效期当面说定
    irreversible_threshold: 在纪要之外单独再约一次，会终止「核准」的保护
  - pair: 2
    needs: 她需要排练表上的权威不被旧事动摇；玩家需要一个还留在行业里的名分
    misreading: 把一帧帧抠效果当成刁难，把没换的旧锁钥匙当成暗示
    asymmetric_cost: 她押的是总监的站位决定权，玩家押的是出道前到如今的完整见证
    ritual: 排练表为准，储物柜那把旧锁谁也不提
    conflict_loop: 身体越记得越要重新谈，越谈越回不到排练表
    repair: 把旧锁换掉，见证只留给自己
    irreversible_threshold: 在外人面前提起出道选拔那晚，会终止她递给你的排练表
  - pair: 3
    needs: 她需要那通电话与那件外套没人认得；玩家需要沉默不被定价
    misreading: 把跟妆十分钟当成审问，把有价的沉默当成背叛预备
    asymmetric_cost: 她押的是镜子与门之间的狼狈，玩家押的是纸质凭证与录音带的安全
    ritual: 修脸不问话，粉扑停那一下等她先开口
    conflict_loop: 越确认沉默越像交易，越像交易越伤那十分钟
    repair: 把关键对话的凭证原样交还，录音带洗掉
    irreversible_threshold: 转交那条还没转交的录音带，会终止跟妆椅上的十分钟
