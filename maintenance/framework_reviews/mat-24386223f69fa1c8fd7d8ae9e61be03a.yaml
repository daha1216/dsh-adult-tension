name: 恋爱禁令与歌友会
source_hash: 32c084b420c9a9743d2f5735cdc7cb2787ffe3b962b8508643f2bbe4a0dfa0c6
semantic_status: REVIEWED
reason: 来源为 streaming_setting_drafts.md V2「恋爱禁令与歌友会」（本轮七框架并行生产）。事务所、企划部与歌友会现场三条线打通：9 地点各带出口/见证/可用项（high 2 为保姆车后座、旧练舞房屋顶天台），9 活动 7 类，10 压力各绑 2 组三元组，三向可达。机制是「禁真的、卖假的」：合约期禁止真实恋爱，违约金可定价、心动不可；表演性亲密须事先报备，官方 CP 台本、公司安排的相亲饭局都是能盖章的假恋爱——这份禁令护的不是人、是人设资产，后果是金融性的索赔与解约。与 mat-e9178ea6（河岸康复，行政性后果）以金融性分野，与同 era 的 mat-cdd67（街坊身份核对）以「藏的从来不是身份，藏的只是感情本身」分野，同 era 零场所零引擎骨架重叠。写手自验 366 checks 0 errors，静态复核通过。
checks:
  era_and_theme: true
  space: true
