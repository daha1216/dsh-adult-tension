activity_functions:
  试排共享书会: 休闲共处：形成低负担的相处习惯
  筹备旅行照片交换: 经验互述：更新彼此偏好
  设计庭院观影单: 共同欣赏：兑现一晚休闲
  试走海岸歇脚线: 路线协商：改变体力与时间支出
  预约教练体验课: 专业转介：让真正有权限者接手
  选择慢泳与岸边休息: 自定节奏：调整身体活动与退出
  布置旧物交换桌: 物况核验：支撑自愿交换
  绘制城市天际线: 观察教学：获得画景方法
  试排公共纪念展: 布展试走：改善观看路径
  替她扣上拖尾裙摆的暗扣: 照护与修复：在宴会开始前把人整理好，而不是替她决定这场宴会办不办
  把那叠未打码原稿拍在桌上: 第三方与打断：弄清这份原稿能不能流出，而不是先决定要不要用它换东西
  替她摘下后颈那条项链: 照护与修复：把不属于她的重量取下来，也看清是谁给她戴上的
  替她解开束腰: 照护与修复：先让人喘上气，再谈这件礼服还要不要穿
  在更衣间帘外确认半分钟: 空间与退出：给帘后的人一段不被打量的时间，而不是替她做别的决定
  在候场区陪站二十分钟: 日常接触：让入场时间由她掌握，而不是被催着提前出去
  在锁门的更衣间里试装: 调查与核验：在门锁落下的情况下仍把判断留在她自己手里
  替她挡下一通催人的电话: 第三方与打断：把这一晚从别人的催问里截出来，同时不替她承担答复
  替你挡下一通电话: 第三方与打断：替人拦下这一通，又不替他决定接下来怎么回
  在离出口更近的位置坐下: 空间与退出：把这次谈话的退路先留在自己手里
  开出一句价码: 信息交换：把价格抬到桌面上来谈，而不是让它在暗处滚
  当面撕掉一张合租禁令: 第三方与打断：把一条压在两人头上的规矩变成可以正面处理的事
  先开口叫她的名字: 日常接触：在熟人场里先划出只属于两个人的称呼距离
  把手心贴到发烫的脸上: 日常接触：在这几秒里不追问、不解释，只让靠近发生
  在末班车前陪你等车: 空间与退出：用一段不催促的等待替代挽留的话
  把当晚的互动明确收束: 空间与退出：在事情变成默认之前先把它说明白
  明确今晚只处理一件事: 日常接触：把堆积的问题切成一次只背一件
  替你拉上背后的拉链: 照护与修复：在试装这种要贴着人的事上仍然把分寸留给她
  揪住后衣角: 日常接触：用没说出口的动作确认对方还站在这里
  反手反锁包厢的门: 第三方与打断：先把场内的规则定成两个人说了算
  承认自己紧张: 信息交换：把紧绷说出来，而不是靠一杯水掩过去
  要求一个答复: 信息交换：在限定时间内把悬着的事逼出一个明确说法
  递出一份文件: 调查与核验：在签字之前让收方看清自己接的是什么
  包间续时后摊开账目: 信息交换：在隔壁能听见的距离里把账目摆平或当场撕破
  替她试琴时锁上整层: 空间与退出：在巡楼间隔里决定这份文件要被看见还是被按住
  清场后对一遍巡演结算: 调查与核验：在场地超时计费开始前把票务对账做平
  在擦背隔间里交出一样东西: 第三方与打断：在值守来回的间隙里完成一次不过登记簿的交接
  守在收银台前等一班过路车: 空间与退出：赶在唯一一班过路车停下前决定去还是留
  收摊前在赊账摊板前对账: 信息交换：在人多眼杂处把一笔旧账认下来或撇干净
  复盘间隙看一眼替补名单: 调查与核验：在正式宣布前确认被换掉的到底是谁
  跳闸的那一夜把话说开: 身体靠近：在没信号没监控的这段时间里把不能留记录的话说完
  收市前核对最后一个钟点单: 服务边界核验与退单流程
chemistry:
  pairs:
  - pair: 0
    needs: 协调员希望人来得齐，摄影师想随时安静离开
    misreading: 把早退看作活动失败
    asymmetric_cost: 协调员付场租和联络时间，摄影师失去自己的休息
    ritual: 入席先说各自几点走
    conflict_loop: 越怕冷场越安排发言，越安排越想早退
    repair: 设静读席并按原约结束
    irreversible_threshold: 未经同意替对方支付长期会员费后不再代报名
  - pair: 1
    needs: 摄影师要不被催的观看，协调员想按表完成
    misreading: 把不拍照当成不投入
    asymmetric_cost: 摄影师错过光线，协调员承担其他人等候
    ritual: 看景前互报今天不想做的一件事
    conflict_loop: 越催留影越避镜头，越避越被追问
    repair: 收起相机走一段无需作品的路
    irreversible_threshold: 将明确不公开的照片用于招募后暂停供图
  - pair: 2
    needs: 管家需要缺页那一夜仍归她守；新东家需要接宅接得明明白白
    misreading: 把抽出的那几页当成摊牌或要挟
    asymmetric_cost: 管家赌的是去留与推荐信，东家赌的只是宅契全权的一周
    ritual: 每晚报门时把访客记录压在最底下
    conflict_loop: 东家越追问缺页，管家越退回旧例，宾客名单越定不下来
    repair: 新册另起并注明旧册封存，缺页之事不再追
    irreversible_threshold: 外人翻出缺页并在家宴上提起，管家的去留当场成议
  - pair: 3
    needs: 理疗师需要越界单有落处；足疗师需要不越界代签
    misreading: 把补记越界当成替她出头撕单
    asymmetric_cost: 她停的是当月黄金钟点，你丢的是这条街的熟客口碑
    ritual: 收市前对一遍当日服务单再各自锁柜
    conflict_loop: 前台只认签字，谁先动笔谁就替这张单担责
    repair: 按退单流程作废并知会当班经理，投诉另走流程
    irreversible_threshold: 在越界栏签字补记，这张单从此成为两人在店里的公开立场
