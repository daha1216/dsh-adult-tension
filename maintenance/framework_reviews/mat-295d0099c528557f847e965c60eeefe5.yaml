activity_functions:
  试录地方故事: 声音协作：建立可复现的表演节奏
  校对活动菜单: 实物对照：限定文案的真实承诺
  试摆展会路线牌: 用途转换：恢复私人空间同时维持导流
  复看公开赛的一次配合: 复盘学习：更新对动作因果的理解
  给道具底座加可拆支撑: 实物修护：改善展示稳定性
  试听环境音节目: 听觉共处：交换偏好而不强制生产
  校对合志分工表: 调查与核验：在压盘前把没确认的署名与分工挑出来
  清点寄存道具箱: 信息交换：让每只箱子都能凭票找回自己的主人
  试戴主题展演配饰: 身体靠近：确认展演配饰在正式上场前不会松脱或夹痛
  盯住装车顺序: 空间与退出：在司机等待计费走完之前把必到的箱子先装上车
chemistry:
  pairs:
  - pair: 0
    needs: 编辑要忠于原文停顿，制作人要可录的节奏
    misreading: 把换气建议误听成改写作者
    asymmetric_cost: 编辑承担作者失望，制作人承担重录棚费
    ritual: 先读一句不录音，再按录音键
    conflict_loop: 越守标点越不自然，越自然越被纠正
    repair: 允许口语停顿但不改词义，两版给作者选
    irreversible_threshold: 未授权改词却标为作者定稿后不再共录
  - pair: 1
    needs: 制作人要完成交付，编辑要幕后名字齐全
    misreading: 把署名确认看成拖延技术工作
    asymmetric_cost: 制作人损失棚时，编辑损失协作者信任
    ritual: 导出前各念一次幕后名单
    conflict_loop: 越赶输出越漏名单，越补名单越挤试听时间
    repair: 先锁定署名页，再分别完成声音和排版
    irreversible_threshold: 把他人录音署成自己制作后结束联合署名
  - pair: 4
    needs: 驻店店员需要陪席栏划回可选；接单人需要不替店方背折抵单
    misreading: 把对照合约当成要她当场撕约走人
    asymmetric_cost: 她中途解约按剩余月份全赔，你损失的只是一份收货班
    ritual: 交接早晚班钥匙时顺手核一眼当日折抵单
    conflict_loop: 店长按日落章催得越紧，两人越难把那一栏当面对清
    repair: 划注过的单子送店方回签，期间她仍只接台面班
    irreversible_threshold: 在折抵单上签下陪席默认，年内再划回就要按违约计
  - pair: 5
    needs: 声优需要许可范围逐字守住；剪辑接单人需要加录必见单
    misreading: 把划回委托单当成不敬业或要拆社团台
    asymmetric_cost: 样带越界流出由她本人担责，你只丢一单棚费
    ritual: 开录前把划过线的委托单夹在谱架上
    conflict_loop: 摊位费押在合约里，她越缺钱越容易对新线让步，你越提醒越像多管
    repair: 双方签认划回范围，母带加锁另存留档
    irreversible_threshold: 按新线录成的样带进入流通剪片，越界部分从此算她的默认许可
