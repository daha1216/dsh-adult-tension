    asymmetric_cost: 向导多负担接送，编纂人放弃本想完成的远访
    ritual: 每次出发前先说今天最晚何时回来
    conflict_loop: 编纂人想多访一户，向导不断催回，双方都没吃好饭
    repair: 删去一处访问，按各自体力分开安排
