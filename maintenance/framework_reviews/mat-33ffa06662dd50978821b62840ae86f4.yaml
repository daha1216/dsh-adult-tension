activity_functions:
  比对支线模型与报修点: 以报修时序核对支线影响范围
  给旧灯外壳补一块护边: 实装护边并选择保留磨痕
  交换一处街角设施的记忆: 从日常设施回忆认识邻居
  侧身挡住通风口的风: 照护与修复：让犬只与人都先避开正对通风口的那阵风，再决定这一段还查不查
  同事带着文件找上门: 第三方与打断：在一周前就存在的疑点变成事故之前，决定这份底稿走不走正式渠道
  把话题转回事务: 空间与退出：在授权人始终不露面的前提下，把能写下来的边界先写下来
  受理一单不署名的委托: 信息交换：在接下这单之前弄清谁承担签字责任与出了事找谁
  在屋顶平台上被单独叫住: 第三方与打断：决定要不要在这次单独谈话里先把条件问清楚
  在夜诊室外等一份读数: 照护与修复：决定这份读数交给谁、按谁的规程解释
  在住院部走廊里被托付一次: 照护与修复：决定接不接这串钥匙，以及接下了要不要照规程上报
  通宵包间里对一遍外判报价: 调查与核验：决定按本局口径报，还是按他给的价跟一次
  收摊的菜市场里说清尾款: 信息交换：决定在纸上署谁的名、以及要不要留下收款凭据
  在停业器械间里确认伤到什么程度: 照护与修复：决定照实上报伤情，还是替他瞒过这一次体检
  闭馆泳馆里把话说到底: 空间与退出：决定那套实话讲到哪一层为止
chemistry:
  pairs:
  - pair: 0
    needs: 调度员要可核查的影响范围，联络员想让居民已经讲过的困难被当回事
    misreading: 补问门牌被当成踢回投诉，强调住户感受被当成要求插队
    asymmetric_cost: 调度员承担排错队的多点延误；联络员承担住户重复讲述后的不信任
    ritual: 先复述已有事实，再问本次缺的唯一一项
    conflict_loop: 越着急越混合报修，调度越拆分，联络员越觉得居民被割裂
    repair: 用一张模型同时呈现两条时间线，只补缺的信息而不重做全部问询
    irreversible_threshold: 未经许可公开住户地址与私生活作为排队理由，删表也不能收回已扩散信息
  - pair: 1
    needs: 修复工希望说明可修范围，住户希望熟悉的旧灯还能用
    misreading: 保留未验收标识被当成不负责任，夸修好被当成要求跳过专业检验
    asymmetric_cost: 修复工承担错误承诺的责任；住户失去旧灯原貌或多付检验工夫
    ritual: 动手前问最想保留哪一处磨痕
    conflict_loop: 住户越想快点点灯，修复工越强调限制，住户越听成不肯修
    repair: 先完成只针对外壳的小步骤，再让主人单独决定是否送检
    irreversible_threshold: 未经同意把纪念灯原壳换成新品，功能等价不能追回旧物本身
