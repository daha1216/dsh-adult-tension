semantic_status: REVIEWED
reason: 调度核对范围、断电旧灯护边和私人设施记忆互不替代；地面模型不等于实际阀门，维修压力只绑有报修权限的搭配，住户无需下井；2026-09-12 第二波收尾：新增活动/地点经机械复核（space/people/daily/pressure_bindings
  全通过），activity_functions 补齐至覆盖全部活动后同步源哈希。
