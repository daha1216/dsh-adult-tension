reason: 成年人夜校的故障假设检验、可返修小样和不计分的失败交流各自完整；助教与辅导员分别无学分认定权，压力绑定只落在适配的样品与展示活动。；2026-09-10
  第二人物组资源/限制差异化强化后同步源哈希。
