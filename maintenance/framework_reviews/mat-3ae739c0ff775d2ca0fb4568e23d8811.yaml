id: mat-3ae739c0ff775d2ca0fb4568e23d8811
name: 夜校学分与开放实验室
source_hash: aa233ff16f4833b23e64a9f187955d0a8a008a9cd2dc155749a44a9ff1dd0388
semantic_status: REVIEWED
reason: 成年人夜校的故障假设检验、可返修小样和不计分的失败交流各自完整；助教与辅导员分别无学分认定权，压力绑定只落在适配的样品与展示活动。；2026-09-10 第二人物组资源/限制差异化强化后同步源哈希；2026-09-12
  第二波收尾：新增活动/地点经机械复核（space/people/daily/pressure_bindings 全通过），activity_functions 补齐至覆盖全部活动后同步源哈希。
checks:
  era_and_theme: true
  space: true
  people: true
  daily: true
  pressure_bindings: true
  distinct_functions: true
quality:
  grade: B
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
activity_functions:
  排查教学模型的断点: 用重复故障比较排查假设
  制作一件可拆解的小样: 实际比较可拆连接的返修成本
  交换失败作品的故事: 在不计分交流中展示失败观念
  当面排掉争议的署名顺序: 信息交换：在两版署名里挑出一版能当面站住的
  提报成果认定并当面摊牌: 信息交换：弄清这份材料签下去会把谁的名字挤掉
  核对可公开的那一部分: 调查与核验：把能公布的与只能留在室内的分开
  在闭馆水线边把话说完: 空间与退出：在清场广播之前把这一件事收束
  结课夜留到清场之后: 空间与退出：在清场前决定今晚只处理哪一件事
  把成果认定材料送进档案室: 第三方与打断：确定这份记录归档之后还能不能改
  在合租的分摊表前谈清: 空间与退出：在押金退还条件被改动之前把分摊定下来
  在打烊后的裁缝铺里改到合身: 身体靠近：在交件期限之内把尺寸定下来
  在排练厅的镜墙前收束当晚: 空间与退出：在场地租用到点之前把今晚的事收束
chemistry:
  pairs:
  - pair: 0
    needs: 助教希望学员给出可重复解释，返校技师希望自己的多年经验被尊重
    misreading: 追问读数被当成怀疑资历，凭手感跳步被当成拒绝学习
    asymmetric_cost: 助教承担模型与课堂时间；技师承担重新承认自己也有盲点的难堪
    ritual: 先各说一个假设，再一起测同一处
    conflict_loop: 助教越追问技师越用经验压过读数，助教又加更多检查
    repair: 让经验先预测一次结果，再用测量验证，不把判断错当资历归零
    irreversible_threshold: 为维护面子改写原始读数并要求对方共署，之后须撤回共同结论才能再合作
  - pair: 1
    needs: 辅导员希望看清实际贡献，转业者希望旧工作不被几张表抹去
    misreading: 程序解释被当成贬低经验，展示团队成品被当成个人全包
    asymmetric_cost: 辅导员承担流程可信度；转业者可能错过本轮认定且多请一次假
    ritual: 先说一件自己确实做过的部分，再划出别人完成的部分
    conflict_loop: 越担心不被认可越夸大全部贡献，辅导员越要证明，作品故事越来越像审问
    repair: 将闲聊与申请分开，另约一次只讲一处能验证的工序
    irreversible_threshold: 明知他人成果仍以个人名义正式提交，日后补充说明不能当作从未侵占署名
