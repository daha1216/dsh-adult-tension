activity_functions:
  校对山川旧志: 辨伪：改变路线可信度，不直接放行镖货
  整理巡礼路签: 导流：改变通行路径与退出成本
  核对普通货物路单: 交接核验：改变实物分配而非只抄一份货单
  给驮架加防磨垫: 手作修护：用余料换取装载耐用性
  在断龙石落定前清一遍木匣: 调查与核验：在断龙石压下来之前把要带走的那一只挑出来
  在地宫外山道重排驮具: 空间与退出：在骡子倒下之前把人和货分到两条路上
  在柜面上认出当票上的名字: 信息交换：弄清这一件是谁押的、赎期还剩几天
  在驿名木牌前对一处简称: 调查与核验：在出驮之前弄清委托人写的是两处驿站里的哪一处
chemistry:
  pairs:
  - pair: 0
    needs: 校勘人要确证，护送者要可走的路
    misreading: 把催问误作轻视学问
    asymmetric_cost: 误判由护送者多走山路，校勘人损失的是信誉
    ritual: 每次先把沾泥的实走图放在干净抄本旁
    conflict_loop: 越催交图越补注释，越补注释越错过出镖
    repair: 先交可信山段，争议渡口单列待访
    irreversible_threshold: 明知无证仍把路线写成亲验并导致送错，双方停止互作担保
  - pair: 1
    needs: 文书要装载可靠，校勘人要完整保留原义
    misreading: 把暂缓装驮看成嫌弃古籍
    asymmetric_cost: 文书付仓位和脚程，校勘人付复核时间
    ritual: 开工先量驮架再读路签
    conflict_loop: 古名越争越久，文书自行改简称又引出新争议
    repair: 口头复述目的地再由校勘人确认旧名对应
    irreversible_threshold: 擅用对方印记签收未核验货物后不再共接委托
