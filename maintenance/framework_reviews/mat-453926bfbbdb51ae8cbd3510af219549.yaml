activity_functions:
  给旧地图补地名: 校准战前地名与今日可达路线
  试做远征锅的新口味: 将远征大锅调整成日常餐食
  给城墙花圃挂牌: 让双语植物牌不妨碍花圃取用
  替对方收留下那一局: 日常接触：把这一局的让法说成两个人之间的规矩
  教她把护腕扣上: 照护与修复：让她能一个人把护腕扣稳并自己解开
  在冰裂矿道清点旧矿: 调查与核验：认出一段还能立住人的矿道，不往塌方那头试探
  在契约厅对读旧契: 信息交换：找出旧契与新券在还债年限上的出入并写清出处
  在偏院客房清点旧物: 空间与退出：把不属于自己的旧物单独封好，等门房登记后再处置
chemistry:
  pairs:
  - pair: 0
    needs: 修复师希望旧物进入日常，探路人希望伤痕仍能被看见
    misreading: 补平划痕被当成抹历史，坚持残缺被当成拒绝过新生活
    asymmetric_cost: 修复师赔付材料；探路人失去的是个人旅途痕迹
    ritual: 动手前请委托人指出一处绝不能动的旧痕
    conflict_loop: 越想修得好看越磨旧痕，探路人越防备便越不给用途信息
    repair: 先做可拆的补件，只改善握持与翻页
    irreversible_threshold: 把唯一手札的原路线洗掉重绘，后来摹写不能等于保留原迹
  - pair: 1
    needs: 译员希望居民的自称被听懂，记录者希望地图简洁易用
    misreading: 双名被看成制造分裂，单名被看成抹去来处
    asymmetric_cost: 译员在两边都可能失去信任；记录者只是多排几行与重画地图
    ritual: 每次先念本人自称，再说通用译名
    conflict_loop: 越想统一叫法越激起旧怨，越争旧怨地图越难使用
    repair: 地图并列双名并加今日入口，让称呼之争不阻断日常问路
    irreversible_threshold: 明知侮辱意味仍以译员名义发布单一旧称，印图传播后无法靠口头澄清撤回
