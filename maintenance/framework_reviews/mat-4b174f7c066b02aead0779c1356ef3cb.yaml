name: 老澡堂与打烊后的钟点
source_hash: 5886e70cf999b138f712e362e897f637d88abde74ad1acc2d46fd3f0e08ef486
semantic_status: REVIEWED
reason: 来源为 bathhouse_setting_drafts.md A 版「老澡堂与打烊后的钟点」（本轮七框架并行生产）。番台、锅炉房与夜池三条线打通：9 地点各带出口/见证/可用项（唯一 high 为打烊后的包场池），9 活动 7 类，10 压力各绑 2 组三元组、严格按设定稿配平表落地，三向可达。机制是「同一空间按营业时钟分割主权」：白天一票一柜认柜牌，打烊后整池可包认钟头，夜里讲定的一切随封炉水凉作废；不立合同、不押金、不写寄存簿，全凭口头讲定与看池人人情。与同 era 的 mat-cdd67（千禧网络街坊）以「这里没有网名与头像要对——白天认柜牌，打烊后认钟头」分野，与 mat-260b（合同预约）、mat-5c23（钱汤寄存簿）逐条反向。写手自验 417 checks 0 errors，静态复核通过。
checks:
  era_and_theme: true
  space: true
  people: true
  daily: true
  pressure_bindings: true
  distinct_functions: true
quality:
  grade: A
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
    「买下的不是池子，是一段不进任何规矩的时间」——以营业时钟切分同一方池的主权，白天与打烊后是两种合法而非一明一暗；在既有澡汤/洗浴谱系中独树一帜，成年向以包场钟点的制度性私密生长，判为明显独特。
activity_functions:
  在番台买票领柜牌: 日常接触：一块柜牌换一个人，白天认票不认人
  在搓澡床上替人搓一次背: 身体靠近：上床先拍三下床沿，师傅没应声不翻身
  桑拿房里递一壶凉白开: 照护与修复：蒸汽里的照护不问来历
  打烊后包下半个池子: 空间与退出：买下的是一段不进任何规矩的时间
  扶一个晕池的人出大池: 身体靠近：暖汽里人人有分寸也有手
  对一遍疗程单上的日子: 调查与核验：人和疗程单一起没再来的那一半
  替她在番台前挡一次说和: 第三方与打断：还价就等于承认撑不过这个冬
  封炉前巡一遍夜池: 照护与修复：钟点从打烊起算、封炉即止
  茶水台边把一句闲话递到: 信息交换：这条街不问夜里谁来过，只问水开不开
chemistry:
  pairs:
  - pair: 0
    needs: 她需要夜池的准入握在自己手里；玩家需要那个夜里的人影永远不被说破
    misreading: 把夜里留钥匙当成暗示，把沉默当成同谋的债
    asymmetric_cost: 她押的是夜池的规矩，玩家押的是半辈子攒下的街坊脸面
    ritual: 钥匙留在锅炉房后门老地方，谁也不说留给谁
    conflict_loop: 越默契越不敢先用尽，越不用尽越像欠着
    repair: 把那个夜里的时刻当面讲开，讲完就归夜
    irreversible_threshold: 在番台上说出那晚的人影，会终止夜池对你的开放
  - pair: 1
    needs: 她的床要热水，玩家的炉要争气；两门手艺在同一座热水上碰头
    misreading: 把管炉当成管她，把排床的客气当成外行
    asymmetric_cost: 她押的是老主顾的疗程，玩家押的是替班修炉的名声
    ritual: 修完炉在锅炉房后门抽根烟再走
    conflict_loop: 水越不热越要夜夜修，越修越离不开这口炉
    repair: 把锅炉彻头彻尾大修一遍，账两清
    irreversible_threshold: 让锅炉带着隐患过冬，会终止这条街对手艺的信任
  - pair: 2
    needs: 她需要值班记录有第一手经过撑住；玩家需要人情与分寸都照顾到
    misreading: 把要经过当成多管闲事，把只给一半当成不讲情义
    asymmetric_cost: 她押的是记录的医学分量，玩家押的是澡堂那边的口风
    ritual: 垫过的药钱单据对折收好，不当面提
    conflict_loop: 越讲情义越要多给，越多给越对不起另一半人
    repair: 把经过全给，名字留下不给
    irreversible_threshold: 把晕池人的名字写进记录，会终止夜里敲门的关系
  - pair: 3
    needs: 她需要这条街过冬的暖攥在自己手里；玩家需要账册平、房契留
    misreading: 把压煤当成逼债，把刚接班当成好说话
    asymmetric_cost: 她押的是地契与煤，玩家押的是「像不像他爹」的那口气
    ritual: 账两本分开点，人情不当钱使
    conflict_loop: 越想撑过冬天越要赊，越赊越受制于对面的灯箱
    repair: 把与洗浴中心周旋的往来记录摊给她看，重谈开春
    irreversible_threshold: 押出澡堂房契换一冬的煤，会终止这座澡堂的班
