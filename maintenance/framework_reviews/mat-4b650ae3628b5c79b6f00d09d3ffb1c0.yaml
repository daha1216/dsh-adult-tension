activity_functions:
  试走公共服务导览: 可达性试走：减少问路与绕行
  试讲领养日说明: 讲解演练：改善双向理解
  整理公共建筑沿革: 史料考证：形成可追溯时间线
  给旧物试配保护衬垫: 预防修护：改变实物支撑条件
  编排公开训练访谈: 叙事编排：改变因果理解
  试调街区声音展: 审美共处：形成可选择的听觉体验
  在叫号屏之外核一遍复诊: 调查与核验：在进诊室之前弄清哪一项结果先出、哪一项要重排
  在闭馆前翻一遍未入选的稿件: 调查与核验：在评审开场前弄清这一轮的选件口径到底是什么
  逐件核对一匣旧物的登记单: 调查与核验：弄清哪几件有编号、哪几件没有，以及少掉的那一件去了哪里
  在付印前把署名栏留空: 第三方与打断：在付印钟点之前决定这一栏写谁，或者干脆留空
  在授权到期后核一遍素材副本: 调查与核验：弄清手上这些素材的授权范围与实际用途对不对得上
  在收工前清一遍更衣格: 空间与退出：在锅炉熄火之前弄清哪几格还锁着东西、东西归谁
chemistry:
  pairs:
  - pair: 0
    needs: 采访员要经验完整，策划人要入口易懂
    misreading: 把压缩看作不尊重行业
    asymmetric_cost: 采访员失去受访者信任，策划人损失展线时间
    ritual: 采访后各复述一个未理解的工序
    conflict_loop: 越担心被删越讲细节，展线越长越急着删
    repair: 保留核心工序，长版另供自选收听
    irreversible_threshold: 把明确不可引用的话当卖点后停止共享录音
  - pair: 1
    needs: 策划人要陈列可行，采访员要保留旧物痕迹
    misreading: 把保护衬垫误当作遮掩来历
    asymmetric_cost: 策划人承担运输损伤，采访员承担误述经历
    ritual: 搬动前先让物主讲一个磨损处
    conflict_loop: 越追求整齐越碰旧物，越抗议越拖布展
    repair: 先试可撤衬垫再决定借展
    irreversible_threshold: 未经物主同意清除旧痕后不再借展实物
  - pair: 3
    needs: 出镜者需要私录段有明确处置；素材管理员需要台账销号闭环
    misreading: 把追回拷贝当成对工作室宣战
    asymmetric_cost: 私录段被当默认许可由她本人担责，你至多丢这份核对工
    ritual: 月底续约前把授权与底单逐段对位
    conflict_loop: 外发拷贝越追越显眼，她越想私了，你越怕台账断号
    repair: 按台账追回销号，私录段封存待签
    irreversible_threshold: 私录段被对方当续约筹码摆上桌，边界从此重谈
  - pair: 4
    needs: 入殓师需要登记簿落笔有人见证；志愿整理人需要档案不记争
    misreading: 把见证落笔当成要替哪一方主张遗体归属
    asymmetric_cost: 她按到场单方办理就要交出排期权，你只是档案少一页名姓
    ritual: 沿革底稿只记年份与旧例，名姓页留白
    conflict_loop: 两房催排期越紧，登记簿越空，门内的话越难不出棚
    repair: 请两方到场当面落笔，档案只记事不记争
    irreversible_threshold: 按到场单方落笔办理，越权之记追到守簿人头上
