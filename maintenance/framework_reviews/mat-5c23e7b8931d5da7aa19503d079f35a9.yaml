activity_functions:
  试配季节甜点: 小份试制与饮食偏好照应
  挑选晚间唱片: 共享聆听与口味相识
  布置住户作品展: 用实物确定展览通行空间
  设计更衣区告示: 验证告示可读性与分区准确性
  补画街区导览: 规划末班车前的短程巡礼
  门店广播把寄存人的名字念出来: 第三方与打断：当场决定这个寄存物该怎么处理、要不要应声
  隔着脱衣所的长凳把估价单推过来: 信息交换：在开门前弄清这张单子该不该由你过目
  在纸拉门后核对台帐与裤腰带: 调查与核验：在当家人当众改记之前弄清差额的去处
  在午夜大浴场并排过夜: 身体靠近：确认这一夜留下的名分与费用由谁结
  在候车室并坐等一班车: 空间与退出：在车来之前把下一程和住处定下来
  在素面雨廊下摊开木样与铺盖: 信息交换：在下一班车开走前把廊下这一晚定下来
chemistry:
  pairs:
  - pair: 0
    needs: 店主要一款卖得动的甜点，摄影师想保留老店原来的模样
    misreading: 建议改盘被看成嫌弃老店，坚持旧盘被看成拒绝新客
    asymmetric_cost: 店主付备料钱；摄影师耗不可即时确认的底片
    ritual: 第一口不拍照，吃完再决定要不要拍
    conflict_loop: 照片越强调旧貌，店主越觉得新配方没人看；改盘越多摄影师越担心失去辨识度
    repair: 保留旧杯配新甜点，拍一组而非重做全店
    irreversible_threshold: 未经同意把店主不愿公开的寄存簿拍进刊物，读者已见的信息无法撤回
  - pair: 1
    needs: 摄影师要让住户愿意露脸，店主要让街坊仍自在来往
    misreading: 不愿上镜被当成不支持展览，主动借墙被当成同意拍全店
    asymmetric_cost: 摄影师可能报废一卷；店主长期承受熟客不再来
    ritual: 先把相机收进袋，再选今晚第一曲
    conflict_loop: 越催授权住户越躲，展览越空又越催
    repair: 先展静物与已许可照片，给住户撤片时间
    irreversible_threshold: 将明确拒绝的肖像付印，之后即使道歉也不能恢复首次信任
