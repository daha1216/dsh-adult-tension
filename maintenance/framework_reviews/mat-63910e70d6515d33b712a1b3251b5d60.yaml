reason: 四处地点均保留，港口校时、帽店动线、铭牌劳动归属与候诊钟修复有独立功能。修钟只绑定有资格的维修师，不让档案员充当医者或港务调度；两项压力限于相符地点和角色。；2026-09-10 第二人物组资源/限制差异化强化后同步源哈希；2026-09-12
  第二波收尾：新增活动/地点经机械复核（space/people/daily/pressure_bindings 全通过），activity_functions 补齐至覆盖全部活动后同步源哈希。
