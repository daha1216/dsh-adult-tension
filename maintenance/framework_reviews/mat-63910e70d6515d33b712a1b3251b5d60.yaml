activity_functions:
  校对港口钟声: 时间测量与因果排查
  布置街区工艺展: 空间布置与用途协商
  核对旧钟铭牌: 器物归属与劳动来源辨析
  调整候诊室挂钟: 公共日用器具修复
  核对雾季靠泊通告: 调查与核验：在封港前确认哪一版时刻真正生效
  等候派工时核对号牌: 日常接触：弄清派工顺序是按号牌还是按熟人
  熨烫间调校试帽镜台: 照护与修复：在不耽误当天生意的前提下修稳那副镜台
  茶房对街认人: 信息交换：在正面照会之前弄清对方的座次和份量
  屏风后各摆底牌: 信息交换：在三夜试探之后分清谁的底牌是真的
  散场后认旧手套: 日常接触：确认那副旧手套是不是三年前那人的
  前台座位按仇家排: 第三方与打断：在不落口实的前提下让当年那位坐进被人看见的位置
chemistry:
  pairs:
  - pair: 0
    needs: 维修师需要器物误差被正确理解；档案员需要正式记录不被轻率推翻
    misreading: 把先看怀表听成指责抄错电报
    asymmetric_cost: 维修师白做校时，档案员多承担一次版本核对
    ritual: 先问这次比的是钟还是船期
    conflict_loop: 档案员说按纸面，维修师说听实际，两人各举一半证据
    repair: 分两次验证仪器与电报生效时间
    irreversible_threshold: 为了掩盖旧电报而偷偷拨表，会结束共同校时
  - pair: 1
    needs: 档案员想让看不见的维修劳动有位置；维修师不想小展妨碍别人谋生
    misreading: 把收起展架听成轻视工匠
    asymmetric_cost: 档案员压缩整理成果，维修师动用借来的人情
    ritual: 展架摆完坐到掌柜的凳上看一次
    conflict_loop: 资料越来越多，空间越来越挤，双方舍不得删自己的部分
    repair: 将一件钟与一条清楚归属留下，其他资料另约查阅
    irreversible_threshold: 未经物主同意扣住旧钟维持展览，会终止借展合作
