chemistry:
  pairs:
  - pair: 0
    needs: 书吏需要地图不误导人；灯匠需要实际走路经验被认可
    misreading: 把口述别称标待核听成看不起不识字的人
    asymmetric_cost: 书吏承担通知出错，灯匠承担夜里被问路的劳累
    ritual: 先指一处图上正确但现场难认的转角
    conflict_loop: 书吏要出处，灯匠只想带他去看，两人互嫌绕远
    repair: 各保留一个书面名和一个在用图案，等本人讲清
    irreversible_threshold: 用名籍职权强迫灯匠证明某精怪身份，会断掉非公务来往
  - pair: 1
    needs: 灯匠想做让街坊认得的签；书吏需要文字和图案不互相打架
    misreading: 把图案改简听成否定手艺
    asymmetric_cost: 灯匠白耗纸料，书吏多解释一次临时改路
    ritual: 挂签前站远三步再看
    conflict_loop: 灯匠添细节，书吏添文字，越补越难认
    repair: 请一个愿意试看的路人指方向，只保留读得懂的元素
    irreversible_threshold: 明知箭头错向仍为赶开市挂出，会停止互认修签结果
