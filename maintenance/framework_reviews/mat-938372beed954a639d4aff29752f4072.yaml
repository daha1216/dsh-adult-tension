name: 课时铃的两端
source_hash: f15a448436bb8da475d84795c56ef90d7a864b2a27a414628a8062bcbb05508a
semantic_status: REVIEWED
reason: 来源为 adultindustry_setting_drafts.md B 版「课时铃的两端」（本轮七框架并行生产）。预约台、镜墙教室与课后理疗角三条线打通：9 地点（high 2 为私教单间与课时铃、主理人办公室与课时账本），9 活动 7 类全覆盖，10 压力各绑 2 组三元组且与设定稿配平表逐条一致，三向可达。机制是「边界写在钟上」：铃响开课、铃响归零，安全词即刻停且停后确认不计课时；课时是身体的刻度，账越清楚身体越有处安放。与同 era 最近邻（共享会客的空间责任合同、夜校的成果认证、康复居所的禁恋、付费墙类的格子账）在 rule 末段逐条拉开分野。写手自验 371 checks 0 errors，静态复核通过。
checks:
  era_and_theme: true
  space: true
  people: true
  daily: true
  pressure_bindings: true
  distinct_functions: true
quality:
  grade: A
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
    「铃响归零」把支配与服从的边界从心理约定外化为钟点制度，赠课不入账与归零义务构成两套账的引力；成年向张力从刻度型隐私自然生长，安全词/状态确认机制落在 rule 与 beats，判为明显独特。
activity_functions:
  预约台前办第一张课时卡: 日常接触：把关系第一次写进卡墙的格子
  镜墙前跟完一节基础课: 身体靠近：镜子里双方都看得见彼此的分寸
  私教单间里练一趟走绳起手: 身体靠近：课上的规矩她定，续课的签字在你手里
  课时铃响后把人从绳上接下来: 照护与修复：归零前的确认与照护不计课时
  理疗角登记一页状态本: 照护与修复：只录身体不录闲话，空白页等于课没上完
  办公室里签一次课时顺延: 信息交换：顺延冻结转让须双方各自签字
  断绳领用签上找一个名字: 调查与核验：领用签就是这一行的指纹库
  课时外那节加课喊一次停: 空间与退出：赠课只给到人，加出来的关系停不停得下来
  面摊上被圈内人认出脸: 第三方与打断：圈内的事出了巷口就当没说过
chemistry:
  pairs:
  - pair: 0
    needs: 她需要线下第一课不破坏线上的信任；玩家需要声音对上真人后的分寸
    misreading: 把线上的纵容带到线下，把课上的规矩当成生分
    asymmetric_cost: 她押的是教学声誉与安全规则，玩家押的是那个小圈子里的信
    ritual: 开课前十分钟只谈边界不碰绳
    conflict_loop: 越熟越想省掉谈边界，越省越不敢叫停
    repair: 回到粉笔线两侧，把撤回的那一项重新谈定
    irreversible_threshold: 替线内的人答话或越过粉笔线，会终止学员资格
  - pair: 1
    needs: 她需要身体状态被如实登记；玩家需要镜头不越界还能交件
    misreading: 把不越界当成冷漠，把登记当成挑刺
    asymmetric_cost: 她押的是执业记录，玩家押的是双签授权单上的署名
    ritual: 底片当场交主理人签收，灯一关各自回到客人
    conflict_loop: 越想留住那半分钟越停不下来，越停不下来越交不出底片
    repair: 当场删除多出的素材，状态本补一页
    irreversible_threshold: 留下没授权的那半分钟录像，会终止拍摄资格
  - pair: 2
    needs: 她需要师门并下这间工作室；玩家需要标书赢得体面
    misreading: 把白天报价当成宣战，把面摊同桌当成试探
    asymmetric_cost: 她押的是半个城的手法名头，玩家押的是主理人托付的方案
    ritual: 白天各自报价，晚上面摊谁也不提标书
    conflict_loop: 越找对方漏洞越要听对方讲手法，越听越下不去手
    repair: 把那个漏洞当面点破，输赢都认
    irreversible_threshold: 把她方案里的漏洞卖给第三方，会终止「不玩阴的」的名声
  - pair: 3
    needs: 她需要公示台的流程有个说法；玩家需要沉默不被定价
    misreading: 把按单号找到门当成逼供，把沉默当成待价而沽
    asymmetric_cost: 她押的是公示台的公信，玩家押的是那半分钟的安全
    ritual: 只问一句交不交，不追第二句
    conflict_loop: 越被逼到绝境越想毫无保留交底，越交底越伤人
    repair: 把录像交给该去的桌面，附一条不转发
    irreversible_threshold: 转发那条还没发给任何人的聊天记录，会终止她只问一句的克制
