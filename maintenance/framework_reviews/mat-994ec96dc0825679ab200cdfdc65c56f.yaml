chemistry:
  pairs:
  - pair: 0
    needs: 匠人要灯能迎风挂住，记录人要保住旧纹来历
    misreading: 把改挂环误认为破坏传统
    asymmetric_cost: 匠人担掉灯返修，记录人担居民责问
    ritual: 先摸灯纸湿度，再讲一次纹样出处
    conflict_loop: 越强调原样越难挂，越改结构越怕失传
    repair: 纹样不动，挂环做成可拆并保留旧件
    irreversible_threshold: 未经许可把居民原签毁掉作样板后不再借原物
  - pair: 1
    needs: 记录人要路线好讲，匠人要居民出门方便
    misreading: 把缩灯组当成不愿帮忙
    asymmetric_cost: 记录人重印小册，匠人重做灯架
    ritual: 清晨出门先不敲任何一扇窗
    conflict_loop: 越想路线完整越挤窄巷，匠人越挪灯越断路线
    repair: 允许独立灯点，让每户自己决定是否参与
    irreversible_threshold: 以节庆名义封住住户唯一门路后退出共同筹办
