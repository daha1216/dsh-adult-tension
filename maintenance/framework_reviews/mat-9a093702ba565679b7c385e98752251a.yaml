chemistry:
  pairs:
  - pair: 0
    needs: 修理师希望旧器好用，收藏者希望保留旧声音
    misreading: 建议换芯被当成毁旧物，坚持原芯被当成要求白修
    asymmetric_cost: 修理师承担返修工时；收藏者失去的是无法买回的旧声
    ritual: 试音前先说要保住哪个旧特征
    conflict_loop: 修得越响越不像旧匣，收藏者越犹豫，修理师又继续调
    repair: 停在双方同意的短距可用状态，旧芯随件返还
    irreversible_threshold: 未经同意熔掉原芯再装新芯，性能提升也不能恢复物件原有声音
  - pair: 1
    needs: 寄养师希望每只兽吃得稳，照料人希望草样经验被认真听取
    misreading: 暂不用草被当成不信手艺，热心加料被当成干涉照料
    asymmetric_cost: 寄养师夜间承担观察；照料人可能损失一季药草销路
    ritual: 先看空盆与剩粮，再谈新草
    conflict_loop: 越想证明草好越催试，寄养师越挡，合作越只剩推销
    repair: 留样但不入盆，等主人许可和寄养师评估再小范围比较
    irreversible_threshold: 擅自把未确认草料喂入寄养盆，出现不适后无法把该餐当作未发生
