chemistry:
  pairs:
  - pair: 0
    needs: 绘图员需要返程计划被认真看待；测绘师需要未画完的遗迹不被轻率否定
    misreading: 把催返程听成害怕探索
    asymmetric_cost: 绘图员担负队伍补给信誉，测绘师舍弃难得的测量窗口
    ritual: 出发前先在图上画回客栈那一段
    conflict_loop: 测绘师想多看一处，绘图员反复问水量，双方越说越急
    repair: 保留一个下次再看的标记，今天按现有水量折返
    irreversible_threshold: 隐瞒水囊漏损换取继续前进，会结束同行带路
  - pair: 1
    needs: 测绘师需要尺度准确；绘图员需要图能被真实赶路的人使用
    misreading: 把不用精确数字听成不重视专业
    asymmetric_cost: 测绘师多花测量时间，绘图员多占旅人等待时间
    ritual: 测完把尺收起，再用脚程说一遍
    conflict_loop: 一方补更多小数，一方只问还走多久，成果互不适用
    repair: 保留实测尺寸，另加当次脚程范围而不混为同一种数据
    irreversible_threshold: 将未量尺寸伪填为对方实测，会停止共享测绘署名
