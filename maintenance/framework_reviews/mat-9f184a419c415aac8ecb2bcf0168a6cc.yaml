activity_functions:
  校译公共服务条款: 语义核验：修正承诺的可执行范围
  试用匿名来访流程: 流程试走：获得不泄名的退出能力
  合点一份跨族小食: 共餐磨合：建立具体生活习惯
  让戒指当场复归: 第三方与打断：弄清票面只写了赎回价，没写赎回之后关系算什么
  在交割前最后一刻核对身份: 调查与核验：区分登记笔误与有人冒名顶替
  在夜审廊外等一个决定: 日常接触：把等人的时间与庭内进程对上
  在旧电梯井夹层对租约: 信息交换：在公共区域承认重叠之前谈出一个双方都认的期限
  共用一部电梯的上下层: 空间与退出：让共乘的一程不因层级不同被读成站队
  在复核室外核对一份复本: 调查与核验：确认眼前这一页是本人授权，还是别人代抄的近似写法
  抽查一次封存匣的编号: 调查与核验：在不开启任何匣子的前提下发现编号错位
  拿命约赌一句真名: 第三方与打断：说清赌注落在谁身上，以及输了之后谁来兑现
  在夜市核对一张当票的赎回期限: 信息交换：在死当公开售卖之前确认还有没有赎回的余地
  在公诉席前听一次名分宣告: 调查与核验：搞清名分写进登记之后能约束到什么程度
  为一份惩罚契约当场找见证: 第三方与打断：让惩罚条款生效同时留下一个可核对的见证人
  把一项争议交给正式流程: 信息交换：让争议进入登记流程，而不是靠私下施压解决
  在检查站前被拦住一次: 调查与核验：在不承认对方有执法权的前提下把一次拦查走完
  替人保管一枚印记: 日常接触：把保管变成一次可撤回的托付，而不是默认为划走
  试走结界外等候通道: 空间适配：降低排队与折返负担
chemistry:
  pairs:
  - pair: 0
    needs: 译员要精确期限，协调员要居民办得成事
    misreading: 把举生活例子听成不懂术语
    asymmetric_cost: 译员失去职业信任，居民多跑的腿由协调员解释
    ritual: 先各举一个今天会发生的使用例
    conflict_loop: 译文越严谨越长，解释越口语越怕失真
    repair: 保留准确时点，再附双方认可的例子
    irreversible_threshold: 偷填真名来完成模板后不再互荐服务
  - pair: 1
    needs: 协调员要不用重复排队，译员要每一步可拒绝
    misreading: 把停在接待台误当作刁难工作人员
    asymmetric_cost: 协调员花联络时间，译员承担误导签署的名声
    ritual: 演练结束把空封套原样交回
    conflict_loop: 越催流程越迟疑，越迟疑越催签
    repair: 只试到授权之前，由本人决定继续
    irreversible_threshold: 替本人签署读取许可后终止共同代办
