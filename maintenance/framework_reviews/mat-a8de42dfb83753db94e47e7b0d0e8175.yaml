name: 街角共同生活圈
source_hash: 502e25fbe916220686be973112d0d58d3b6b67362b1794f64e2352b53e2355b7
semantic_status: REVIEWED
reason: 八处有效社区空间均有活动入口，晨间采购与私家厨房具有不同时间和隐私；采购、做饭、闲聊及通行试摆互不替代，活动策划不取得医疗或产权权限；2026-09-12 第二波收尾：新增活动/地点经机械复核（space/people/daily/pressure_bindings
  全通过），activity_functions 补齐至覆盖全部活动后同步源哈希。
checks:
  era_and_theme: true
  space: true
  people: true
  daily: true
  pressure_bindings: true
  distinct_functions: true
quality:
  grade: B
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
activity_functions:
  交换街区故事: 用熟悉店铺展开闲谈
  试做邻里菜单: 试做并分配日常餐食
  记录时令食材: 比较食材状态与采购预算
  整理社区相册: 相册排序中的不同叙述
  补画夜行地图: 夜行路线与临时休息安排
  共拟借阅角: 在洗衣等候中试摆借阅架
  布置候诊阅读角: 按候诊者需求整理可取读物
  筹备邻里试吃: 小范围试吃与口味表达
  翻看租赁旧账: 调查与核验：在续签落笔前把历年欠款与押金抵扣对到同一本账上
  把热的那份推过来: 第三方与打断：在说清这个月的账之前先让两个人坐下来
  坐到离出口更近的位置: 空间与退出：在开口之前先把谁能随时起身走开这件事定下来
  家人突然来电: 第三方与打断：在电话接不接、当着谁接之间做一次当场的取舍
  当面撕掉一张合租禁令: 空间与退出：把这张贴了又撕的禁令换成两个人自己认的条款
  拆穿鞋架上的第三双鞋: 身体靠近：在公约的最后一条被踩过之后，把两个人的住处与关系一次说清
  分享一只耳机: 信息交换：隔着半只耳机把两个人各自近来的处境说出一半
  接住掉落的东西: 日常接触：在东西摔散之前接稳，也顺带看清本子上记的是谁家的事
  深夜便利店门前对名单: 调查与核验：在名单上报之前把考评依据与自己的交接记录对到一处
  先各自离开再约下一次: 空间与退出：在住处的事有结果之前先给这一晚划一个能收住的收尾
  今夜话没说完: 信息交换：把今晚没说完的那半截留到下一顿，同时不让合同先被谁收走
  伸手替她理了理被风吹乱的碎发: 身体靠近：在进屋之前把散开的头发拢好，也让这一下有个说得过去的由头
chemistry:
  pairs:
  - pair: 0
    needs: 策划人想让公共活动有持续人手，记录员想让每个人自己决定露面程度
    misreading: 安静旁听被当成缺乏热情，热心介绍被当成替人授权
    asymmetric_cost: 策划人承担空场与借地信誉；记录员承担居民今后不愿开口
    ritual: 开场先问今天只聊天还是也留材料
    conflict_loop: 越缺素材越请熟人帮忙，熟人越躲，策划人越加密邀请
    repair: 取消默认署名与值守，明确一次活动的结束时间
    irreversible_threshold: 将明确拒绝的居民家事做成公开展板，撤板也无法恢复原来的知情范围
  - pair: 1
    needs: 记录员想吃一顿不工作的饭，策划人希望把各家好菜留给社区
    misreading: 收起录音机被看成冷淡，追问配方被看成派活
    asymmetric_cost: 记录员的私人休息消失；策划人要承担食材与召集成本
    ritual: 开饭前把录音机收袋，再分小份调味
    conflict_loop: 饭桌越有趣越想加采访，记录员越退缩又被问更多
    repair: 先完整吃完，另约自愿采访，今天不补录
    irreversible_threshold: 把家庭饭桌谈话未经同意传入群聊，此后无法再把传播称为私人聚餐
