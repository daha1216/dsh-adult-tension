semantic_status: REVIEWED
reason: 来源为 streaming_setting_drafts.md V1「打赏榜与最后一格」（本轮七框架并行生产）。直播间、公会排期与末格暗房三条线打通：9 地点各带出口/见证/可用项（high 2 为私域连麦间、末格暗房），9 活动 7 类，10 压力各绑 2 组三元组且与设定稿配平表逐条一致，三向可达。机制是「付费墙经济学」：公域明账、私域明码，每一格都标价，只有末格写着非卖仅内邀——它的用处不是卖，是让每个买过的人都觉得还没买完；债权从不自动兑现，兑现全靠人当面开口。rule 内与舞厅大班、街角人情账、共享会客、康复居所、契约城、夜校、创作者、管廊、地方行业、传媒、赛博街区十一处近邻逐条拉开。写手自验 362 checks 0 errors，静态复核通过。
checks:
  era_and_theme: true
  space: true
  people: true
  daily: true
  pressure_bindings: true
  distinct_functions: true
quality:
  grade: A
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
    「末格非卖」以一枚锚点把付费墙写成无限逼近的结构，打赏两清之后才是账的开始、兑现全靠人开口——与既有含付费墙近亲在内的全部框架无同构，判为明显独特。
activity_functions:
  下播对一场流水: 信息交换：公域明账与私域明码各记一笔
  连麦试一次价: 信息交换：榜单头衔不带线下权利，线下的一切另议
  榜单冲顶守半宿: 日常接触：冲榜夜不发「亏了」二字
  回放里找一句没关麦的话: 调查与核验：留存提示只是一行小字，不是技术屏障
  送她回一次出租屋: 照护与修复：谁也没点破那盏灯是什么工作
  包厢里替她挡一轮酒: 身体靠近：座次卡当场重排的分寸
  串串店里被邻桌认出来: 第三方与打断：线下叫开的名字不带进直播间
  到申诉窗口递一份证据: 空间与退出：窗口只收格式对的证据
  进一次末格暗房: 身体靠近：非卖、仅内邀的最后一格
chemistry:
  pairs:
  - pair: 0
    needs: 她需要公屏的人设和下播的自己分开保养；玩家需要线上那份惯着落进线下
    misreading: 把线上纵容当成许可，把线下分寸当成变脸
    asymmetric_cost: 她押的是人设资产，玩家押的是七个月聊出来的真
    ritual: 见面不提直播间，只叫那个小圈子里的称呼
    conflict_loop: 越对上头像越想认领，越认领越回不去那个频道
    repair: 把身份折回小圈子，重新只做网友
    irreversible_threshold: 把私域聊天截图发上公屏，会终止两人所有的频道
  - pair: 1
    needs: 她需要解约金的那页不被催；玩家需要账是账、人是人能分开
    misreading: 把宽限当成情分，把对账当成清算
    asymmetric_cost: 她押的是排期表上的位置，玩家押的是垫付单上的手印
    ritual: 对账只在白板底下，散场各走各
    conflict_loop: 越不催越像默许，越默许那笔对不上的越扎眼
    repair: 把宽限写成新一期条款，白纸黑字两清
    irreversible_threshold: 在排期会上摊开那张垫付单，会终止她在这张桌上的位置
  - pair: 2
    needs: 她要这个月的榜一；玩家要同一张冲量排期表上的档期
    misreading: 把连麦暗语当成挑衅，把折叠桌同桌当成停战
    asymmetric_cost: 她押的是流量位，玩家押的是她直播流程里的那个漏洞
    ritual: 同台连麦装听不懂暗语，下播同吃串串
    conflict_loop: 越懂她的流程越能让她的榜掉，越能越下不去手
    repair: 把那个漏洞当面说破，各自修各自的
    irreversible_threshold: 用那个漏洞买断她的档期，会终止输赢都认的名声
  - pair: 3
    needs: 她需要那盏夜灯不被点破；玩家需要客厅里那件旧物有个说法
    misreading: 把不点破当成默许共用，把开口当成逼问
    asymmetric_cost: 她押的是每位常客的价目与分寸，玩家押的是两年平摊的租约
    ritual: 水电单对半，谁的灯谁付
    conflict_loop: 越不点破越像共谋，越共摊越像一家人
    repair: 把旧物的归属讲定，租约照旧各签各
    irreversible_threshold: 替她接一次那位常客的电话，会终止室友之间的界线
