chemistry:
  pairs:
  - pair: 0
    needs: 书吏需要条款能被普通人理解；修理师需要手艺得到实际工钱
    misreading: 将要求说清上限听成压低法器价值
    asymmetric_cost: 书吏承担交涉关系，修理师承担实物与耗材
    ritual: 展台先请对方坐下看一遍
    conflict_loop: 说明写得越漂亮越模糊，工匠补得越细越像拒绝服务
    repair: 当场用一盏灯演示一条可交付标准
    irreversible_threshold: 擅自把修理师列为整夜免费值守，会结束共同承接石堡委托
  - pair: 1
    needs: 修理师需要实测被接受；书吏需要客户能在两种方案间作决定
    misreading: 把选择柔光听成否定调试技术
    asymmetric_cost: 修理师损耗晶芯，书吏多跑一趟解释工期
    ritual: 试灯后各读一行最小字
    conflict_loop: 工匠追求更亮，书吏追问续航，测试不断重来
    repair: 固定一页文字和一段测时，不继续追加指标
    irreversible_threshold: 删去已知续航短板再销售，会终止相互署名背书
