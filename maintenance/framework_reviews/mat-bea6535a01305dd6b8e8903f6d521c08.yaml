name: 星海边境生活站
source_hash: cd13c5f7e579ec704901285b9ebb73d06986a4c966bcc5068ab5f1cf75ec8c4a
semantic_status: REVIEWED
reason: 逐项核对三个舱内地点与两组工种，把观星学习、托架修补、母星共看分成不同产出；货运差额仅绑定领料修补，遮光检修仅绑定舷窗活动。所有技术处于同一殖民站设定，无跨时代桥接需求。；2026-09-10
  第二人物组资源/限制差异化强化后同步源哈希；2026-09-12 第二波收尾：新增活动/地点经机械复核（space/people/daily/pressure_bindings 全通过），activity_functions
  补齐至覆盖全部活动后同步源哈希。
checks:
  era_and_theme: true
  space: true
  people: true
  daily: true
  pressure_bindings: true
  distinct_functions: true
quality:
  grade: B
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
activity_functions:
  绘制舷窗观星表: 共同学习空间方位并安排闲暇
  修补植物托架与名牌: 实物修补与持续养护
  母星影像共看: 建立个人熟悉感而非编制目录
  推过半板抗生素: 信息交换：在缺件补齐之前先拿到能救急的那一半，也谈清另一半的抵押
  替她扶正防毒面罩: 照护与修复：在签字放行之前把面罩戴严，也让这一次过闸不留下核查记录
  共处一室的静默班次: 日常接触：在没有第三方在场的班次里定下谁记录、谁动手
  分水阀前的额度对账: 调查与核验：在窗口关闭之前把动力舱那格余下的水拨到该去的地方
  检疫放行签字: 调查与核验：在货船停靠窗口关闭前分清可签字与须复检的批次
  换气角私下换件: 空间与退出：在不落账的角落里补齐本轮缺件，同时留一条能抽身的退路
chemistry:
  pairs:
  - pair: 0
    needs: 检修员需要有人认真听设备限制；记录人需要轮休不再围着库存转
    misreading: 将简短的操作提醒听成不欢迎靠近
    asymmetric_cost: 检修员耗费休息时段，记录人承担晚归错过领料交接的麻烦
    ritual: 观测前各指出一个不认识的亮点
    conflict_loop: 检修员不断纠错，记录人转而只问数量，闲聊又变成工作
    repair: 检修员先解释一处自己也判断失误的视野，再各选一个观察目标
    irreversible_threshold: 未经同意替对方承诺额外维修班，会结束这种轮休约见
  - pair: 1
    needs: 记录人想养活自己的一株植物；检修员需要修理不被当成无限供应
    misreading: 把建议复用旧件当成对个人爱好的轻视
    asymmetric_cost: 记录人承担植物损耗，检修员承担试载返工时间
    ritual: 归还工具前一起轻晃一次空托架
    conflict_loop: 记录人想一步扩种，检修员越谨慎越显得扫兴
    repair: 先修好一架并约定到此为止，扩种另算材料
    irreversible_threshold: 私拿紧急储备补私人种植，双方停止互相担保领料
