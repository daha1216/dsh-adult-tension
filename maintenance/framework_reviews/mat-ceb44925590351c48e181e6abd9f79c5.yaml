name: 废土驿站与修补集市
source_hash: 54911c5e80b493a32e92902d047cda3e0c28bcc8c63a5e04bdafdaae0d1e8cd7
semantic_status: REVIEWED
reason: 修收音机、辨返站路和当面交换分别改变设备、行动路径与物品归属；废药房外部范围保留，不引入药品可用性或水质保证。；2026-09-10 第二人物组资源/限制差异化强化后同步源哈希。；本轮按工作单合入废土驿站与修补集市条目：新增美学「废土粗粝」「末日求生纪实」、场景避难所防爆闸门前，并新增搜刮队搭档、外来者等人物组；六条核心规则与三条社会规则（分期偿还、伤口暴露、入夜声光、今天不占明天的份、规矩只管没退路的人、配给券兑换、擅自开门同罪、物资上缴公库、券不得私下转让）按加法并进 rule / social_rule，不入框架文本以外的新字段。
checks:
  era_and_theme: true
  space: true
  people: true
  daily: true
  pressure_bindings: true
  distinct_functions: true
quality:
  grade: B
  reason: Static source review only; narrative acceptance is tracked independently
    in maintenance/playtests.
activity_functions:
  修补旧收音机: 设备修护：恢复有限可验证的功能
  重认药房外的返站路: 返程定向：调整路程与可退范围
  试换一件修过的物品: 需求协商：改变物品归属而非只制作标签
  核对接头卡上的钢印: 出入管制：按册决定谁进谁退
  卸下弹匣摊在车斗上: 交底验械：先把命门交代清楚再谈别的
  把外套裹到同行的人身上: 御寒同袍：在闸门前接上体温
  递过半瓶干净水: 分享饮水：让救急与公库账目分开
chemistry:
  pairs:
  - pair: 0
    needs: 维修人要准确故障，路线员要尽快听见消息
    misreading: 把保留故障说明听成不肯尽力
    asymmetric_cost: 维修人损失备件，路线员消耗等待所需补给
    ritual: 通电前先说今天只验证哪一项功能
    conflict_loop: 越催全修越想试更多，越试越缺电
    repair: 先恢复一个可验证功能，再由货主决定是否续修
    irreversible_threshold: 明知故障未除却声称全好换走对方水源物资后不再互换
  - pair: 1
    needs: 路线员要见闻可信，维修人要少走一段路
    misreading: 把不荐近路看成藏着好路线
    asymmetric_cost: 路线员担别人走失的声誉，维修人付实际脚程
    ritual: 出门先把最后实走日期念给对方听
    conflict_loop: 越求捷径越引用旧图，越引用越被否决
    repair: 选择已走通的短程目标，远段另找见证
    irreversible_threshold: 删去未验证标记诱使对方进废墟后不再带路
  - pair: 2
    needs: 搭档要保住这趟的负重与水分份额，登记员要把上缴的账目做平
    misreading: 把登记当成翻旧账，把分水当成默认可以少报
    asymmetric_cost: 搭档承担地面风险，登记员承担公库对不上时的问责
    ritual: 出地面之前先把各自的份量报一遍
    conflict_loop: 越怕被翻旧账越私留一点，越私留越不敢当面报数
    repair: 把报出的实数入账，缺口由自己补上
    irreversible_threshold: 把私藏的救命药说成公库的存量，之后不再同车出地面
  - pair: 3
    needs: 值守人要守住宵禁与名册，外来者要争到一个能过夜的落脚点
    misreading: 把照册核对当成有意刁难，把说不清来路当成一律可疑
    asymmetric_cost: 值守人担全所连带受罚，外来者担被退回地面的风险
    ritual: 进门前先照着册子把引路人的名字说清
    conflict_loop: 越问不清越不肯放行，越不放行越想编一个说得通的来路
    repair: 先进门内侧候查，名额只留一个，不替谁补写引路人
    irreversible_threshold: 私自开门放人进出害全所受罚，之后这个人不再走进任何一扇闸门
  - pair: 4
    needs: 看护人要按存量治病，维修人要保住自己那台净水泵的可用
    misreading: 把先给别人用药当成不领情，把修泵的工时当成可以抵药
    asymmetric_cost: 看护人担断药后的后果，维修人担替件被挪作他用
    ritual: 取药前先当着她的面把剂量数清
    conflict_loop: 越怕断药越想留一点备用，账目越对不上越不敢再开口
    repair: 把剩下的剂量当面数清，按册重排用药先后
    irreversible_threshold: 把最后一剂药私留给熟人而使别人错过疗程，之后药柜不再对他开
