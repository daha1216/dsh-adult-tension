id: mat-d0c513c689a45b7885d414535748b9b7
name: 成年创作者与校园艺术季
source_hash: 272dc107f2b4e3433f891df4afe05f0cfb6beff1acce1cc073f88d649f0982c6
semantic_status: REVIEWED
reason: 六处保留；成年和平级协作边界明确，赏画、合奏、查证、道具交接与观看动线分开，不让助教凭身份管理私人合作。；2026-09-10 第二人物组资源/限制差异化强化后同步源哈希。；本轮按工作单合入成年创作者与校园艺术季条目：新增美学「夏日进修季夜谈」与成年校友会散场后的活动室、打烊后的买手店、24小时自习室静音包厢、直播平台危机会议室、打烊面包店、24小时自助洗衣房、通宵大排档等场景，并把「关系不得公开」「私自独处视同违规联络」按加法并进
  rule / social_rule；全部参与者明确成年，导师不评对方分数，独处须登记事由；2026-09-12 第二波收尾：新增活动/地点经机械复核（space/people/daily/pressure_bindings
  全通过），activity_functions 补齐至覆盖全部活动后同步源哈希。
checks:
  era_and_theme: true
  space: true
  people: true
  daily: true
  pressure_bindings: true
  distinct_functions: true
quality:
  grade: B
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
activity_functions:
  设计校友展览: 审美交流：建立平级合作偏好
  编排公开试奏: 合奏教学：形成动作默契
  整理展览注释: 出处核验：提高注释可靠度
  试走道具交接: 岗位交接：厘清动作与责任
  排布成年创作者作品: 观看空间：改变观众视线与通路
  筹备预约室内音乐会: 近场欣赏：形成小规模演出的听感
  核对阶段性评审稿: 评审批注：把意见落回可执行改动
  试装锁门后的取件: 闭店试装：在锁门更衣间内调整服装
  并排核一份注释校样: 静音核校：不改声量完成出处核对
  逐条比对素材授权范围: 公开范围：按授权清单撤下越界素材
  复核舞台机关固定件: 机关复核：开演前确认承力件状态
  送她回住处的一段夜路: 代驾收束：把一趟路停在双方认可的边界
  给新作者排一次试展: 课程标准：把赞助意愿与准入规则分开
  陪她站完术后第一次露面: 术后露面：按本人节奏完成公开场次
  在新刊截稿前夜挑一张原片: 选片交片：在送印前定下署名与裁剪
  分一半通宵赶最后两页: 截稿分工：各页署名分开不代笔
  在洗衣房等一筒衣烘完: 等衣陪稿：把送印死线拆成今晚的量
chemistry:
  pairs:
  - pair: 0
    needs: 召集人要让每位作者被看见，助教要呈现完整作品脉络
    misreading: 把展序建议误作按专业压人
    asymmetric_cost: 召集人承担人情承诺，助教花额外研究时间
    ritual: 开工先各选一件不认识作者的作品
    conflict_loop: 越怕得罪熟人越按年资排，越排越被批评
    repair: 先试无姓名缩图，再请作者确认
    irreversible_threshold: 以学业或校友资格要挟参展后停止合作
  - pair: 1
    needs: 助教要听见音乐呼吸，召集人要控制节目长度
    misreading: 把试奏停顿听成准备不足
    asymmetric_cost: 助教承担台上失误，召集人承担听众等待
    ritual: 试奏前用两下轻拍确认起点
    conflict_loop: 越催越赶拍，越赶越反复重来
    repair: 缩短段落而不加速，约定清楚的起手
    irreversible_threshold: 偷偷开直播使演奏者失去控制后不再共排
  - pair: 2
    needs: 作者要保住公开范围的最终决定权，公关要压住扩散窗口
    misreading: 把暂缓撤稿当成不肯配合，把先撤后查当成心虚
    asymmetric_cost: 作者承担曝光后果，公关承担平台与舆论的追问
    ritual: 每次动手前先逐条确认哪几条没签过字
    conflict_loop: 越急着压热度越想劝她补授权，她越不肯再给素材
    repair: 只撤可确认越界的部分并留回执，对外口径另拟
    irreversible_threshold: 把未授权的试装照发出去换热度，之后不再提供任何原片
  - pair: 3
    needs: 安保要留可追溯的检查记录，技术顾问要保住机关的正常排期
    misreading: 把书面叫停当成不信任，把加固后开演当成冒险
    asymmetric_cost: 安保承担全季停办风险，顾问承担改期与复检工时
    ritual: 每次检查前先确认这次的签字人是谁
    conflict_loop: 越查不出换件人越扩大停演范围，排期越乱越难复检
    repair: 只封存有疑问的环节，其余照常复检后放行
    irreversible_threshold: 明知固定件不合尺寸仍放行开演，出事之后不再共事
  - pair: 4
    needs: 她要在收工后自己决定去留，代驾要把这一趟收在双方认可的边界
    misreading: 把确认身份当成不信任，把绕远路当成另有所图
    asymmetric_cost: 她承担被拍到的风险，代驾承担少接单与路线责任
    ritual: 上车前先说清目的地与送到哪就够了
    conflict_loop: 越想多送一段越显得有所图，她越坚持自己走完
    repair: 按她说的目的地停，到点结清费用
    irreversible_threshold: 把她的行踪或醉态说给第三个人，之后不再接她的单
  - pair: 5
    needs: 她要赶在评审前定稿，场务要按排班表压住作息
    misreading: 把讲创作困境当成求人帮忙，把排期当成不体谅
    asymmetric_cost: 她承担作品延期，场务承担场次开天窗
    ritual: 带人回来前先报时间，不在合租区办展
    conflict_loop: 越怕打扰越熬通宵，越熬越互相看不顺眼
    repair: 把创作时间与场务表分开排，各自守自己的时段
    irreversible_threshold: 动用对方那部分的房租或作品顶自己的进度，之后不再合租
  - pair: 6
    needs: 教练要护住参与者的自愿，分析师要给出可复用的动线结论
    misreading: 把分析结论当成否定她的排期，把改动当成否定参与者的作品
    asymmetric_cost: 教练承担排期反复，分析师承担结论被误用
    ritual: 每次复盘先各自认领自己那一段数据
    conflict_loop: 越怕把私交写进排期越不敢下判断，动线越乱越难排
    repair: 只报实测、把署名分清楚，结论各归各的
    irreversible_threshold: 把私交写进排期挤掉新作者的展位，之后不再共事
  - pair: 7
    needs: 继承人要保住家族收藏的处置权，督学要对课程与展陈的衔接负责
    misreading: 把借琴房当成交换条件，把课程标准当成不给面子
    asymmetric_cost: 继承人承担圈内信任风险，督学承担课程被商业绑定的指责
    ritual: 出借前先写明归还日期与展出范围
    conflict_loop: 越想用赞助换展位越被质疑，越被质疑越收紧外借
    repair: 把赞助与准入规则分开谈，谁能进仍按公开标准
    irreversible_threshold: 用藏品外借换取评审结果，之后家族不再参与艺术季
  - pair: 8
    needs: 她要按身体允许的进度复出，场务要保住场次流程完整
    misreading: 把提前安排椅子当成当众照顾，把缩短段落当成否定她
    asymmetric_cost: 她承担身体风险，场务承担流程中断
    ritual: 上台前只说一句站久了要坐，不当众扶
    conflict_loop: 越怕被当成需要照顾的人越硬撑，越硬撑越容易出事
    repair: 去留由她自己说，强度按复查结果重排
    irreversible_threshold: 替她决定取消或强行让她完成，之后她不再把露面交给这个场次
  - pair: 9
    needs: 主编要在送印前定稿定署名，摄影要保住原片的可靠
    misreading: 把指认原片当成干预编辑，把裁剪当成改图
    asymmetric_cost: 主编承担印刷档期，摄影承担作品被改写的名声
    ritual: 看图前先说清哪张不裁、哪张不进版
    conflict_loop: 越想兼顾真实与体面越想多改一版，越改越错过送印
    repair: 选定一张并保留其余底片，裁剪不擅自扩大
    irreversible_threshold: 未经同意把原片外流给第三方，之后不再跟拍
  - pair: 10
    needs: 她要在截稿前交出本子，协作者要帮忙但不替她挂名
    misreading: 把帮忙当成接手下笔，把署名分开当成不够意思
    asymmetric_cost: 她承担开天窗与摊位资格，协作者承担通宵与送印跑腿
    ritual: 动笔前先把谁画哪页、署名怎么写说清
    conflict_loop: 越赶越想把两页推给对方，对方越不肯代笔，进度越慢
    repair: 各页署名分开，赶不完的当场砍掉而不是充数
    irreversible_threshold: 把别人画的页署上自己的名字，之后社团不再接纳挂名
