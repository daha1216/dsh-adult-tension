    repair: 先做可撤回的木样比较，再各自向有权者确认
    irreversible_threshold: 未经许可拆掉纪念旧柱，无法靠赔钱恢复原物与信任
  - pair: 1
    needs: 书役需要熟人尊重屯所边界；修缮匠需要不被当成杂役随叫随到
    misreading: 把许可时段当成故意摆身份
    asymmetric_cost: 书役承担管事责问，工匠承担白跑和工具占用
    ritual: 借前取木牌，结束由各自收回自己的工具
    conflict_loop: 临时请帮忙不断延长，书役难拒绝管事，工匠越来越冷淡
    repair: 把一件护具修完即结束，其他件另约有工钱的一日
    irreversible_threshold: 擅借对方名义替屯所作政治表态，会中断代递书信
  - pair: 4
    needs: 见习艺伎需要赎身余数被如实点清；债主需要账目干净不沾人身折算
    misreading: 把核账听成要当场逼赎或收人抵数
    asymmetric_cost: 债主折一笔账只是数目，她认错一栏就要多奉公三年
    ritual: 先在玄关低案上把账页与借据并排
    conflict_loop: 债主越让息，当家人越想把差额折成年季，她越不敢自己开口
    repair: 写明只按原数收息的回执，改契之议交还三方当面谈
    irreversible_threshold: 在折算改契上落笔，新契落册后此前的缓期与情面一并清零
