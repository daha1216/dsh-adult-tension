activity_functions:
  共译旅人菜单: 饮食相识与感受表达
  试走鬼市回程标记: 路径试探与退出练习
  核对颜料样本: 样本识别与交易前验证
  交出一样东西: 信息交换：在蜃景关闭前把这一笔当票结清或换到喘息
  把关键物品留在原地后离开: 空间与退出：退出这一轮交易但保留下次谈的余地
  替他拂去罗盘上的青铜尘土: 照护与修复：让他看清指针读数却不动他的盘
  替她挽紧被狂风吹散的红纱面罗: 日常接触：让她的面罗重新系稳，不借机看清她不想露出的样子
  第三方拿走关键物品: 第三方与打断：确认谁有权动这条绳，不在暗窟里跟人拉扯
chemistry:
  pairs:
  - pair: 0
    needs: 译员想被当成一起吃饭的人；绘图人需要一顿不必赶路的饭
    misreading: 把迟迟不翻菜单听成故意不帮忙
    asymmetric_cost: 译员总被加上免费翻译，绘图人错过适合出发的时段
    ritual: 先各选一口想尝的味道
    conflict_loop: 绘图人不断问店名路名，译员用简答应付，饭又变成踩点
    repair: 点完自己的饭再约一段另算的问路时间
    irreversible_threshold: 把私下说的家乡名作为货契担保，停止代译私人事务
  - pair: 1
    needs: 绘图人需要折返判断被遵守；译员需要路径说明人人听懂
    misreading: 把立即退回听成不信任自己交涉的能力
    asymmetric_cost: 绘图人要重测路，译员要向等待的商旅解释失约
    ritual: 出发前各指一次回来的石钉
    conflict_loop: 译员想多问一个摊主，绘图人越催越显得不近人情
    repair: 回固定入口再问，不让交涉拖着路径验证走
    irreversible_threshold: 剪断或隐瞒回路标记逼人继续交易，会结束带路合作
