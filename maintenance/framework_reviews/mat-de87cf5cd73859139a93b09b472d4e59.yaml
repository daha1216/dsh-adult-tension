  定点修复：『服务记录误关联』immediate 写明前台为人工复核执行主体，测试账号仅提供故障复现、无权操作正式预约或公共字段；2026-09-12 第二波收尾：新增活动/地点经机械复核（space/people/daily/pressure_bindings
