activity_functions:
  试放街区投影: 共同休闲与感官偏好协商
  校对无障碍导览: 实体可达性检验
  同行试走末班换乘: 行程选择与自然收束
  测试共享预约屏: 服务流程验证
  在清盘现场核对未退登的版务记录: 调查与核验：把页面弄成只读存档，不顺手改动不属于自己的记录
  在维修通道封路跑一次弯道: 日常接触：按规定圈数跑完就收，不把试跑当成正式成绩
  把共享定位改成只报时段: 空间与退出：让彼此知道今晚几点到家，又不把全天轨迹交出去
  在舱段里记一次循环风噪声: 调查与核验：凭当班记录判断该不该动设备，不靠猜测
chemistry:
  pairs:
  - pair: 0
    needs: 维护员想下班后不再接故障单；整理人想表达真实偏好
    misreading: 把不喜欢某版投影听成对技术水平的否定
    asymmetric_cost: 维护员会多花配置工时，整理人会被默认负责召集体验者
    ritual: 坐下先问今天要不要开屏
    conflict_loop: 审美建议被当成缺陷清单，双方越聊越像加班
    repair: 关屏十分钟，只讨论各自今天愿意听的声音
    irreversible_threshold: 擅自把私下闲聊送入用户画像，结束共同休闲
  - pair: 1
    needs: 整理人需要真实路线被重视；维护员需要问题落在能处理的权限内
    misreading: 把说明无权修电梯理解为推卸责任
    asymmetric_cost: 整理人承担实走时间，维护员承担配置失误追责
    ritual: 先对照一个屏幕箭头与真实转角
    conflict_loop: 整理人不断追加城市问题，维护员只回答界面是否正常
    repair: 把一个现场可修问题做完，其他项明确交给哪位值守人员
    irreversible_threshold: 未经同意公开反馈者的路线或身份，停止共享原始意见
