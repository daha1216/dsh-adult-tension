id: mat-e0b7a41c6d9f2e835a14cf60bd327e9a
name: 片场棚与月份牌画室
source_hash: 536a89cc960425f2c0f00239bccbfca90a6c07345da35004f9e769ed45634b8c
semantic_status: REVIEWED
reason: 片厂、画室与院线三条线打通：9 地点各带见证人/出口/可用项，9 活动跨 7 类，10 压力各绑 2 组三元组，活动/地点/人物搭配三向可达。机制是「一张脸的使用权与署名权分开计价」：合同科认章不认人、底片归厂、样照不出洗印间、本名/艺名/画上那个名字三重身份，都落到可操作的落章、锁柜、起稿与上墙动作上。与同
  era 框架零地点、零美学重叠，产出物与欠账构成独立经济。
checks:
  era_and_theme: true
  space: true
  people: true
  daily: true
  pressure_bindings: true
  distinct_functions: true
quality:
  grade: A
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
    署名权与使用权分离的计价结构在既有框架中无同类，且底片/样照/墙上三种产出各自约束玩家选择；判为明显独特。
activity_functions:
  签一份形象使用合同: 交易摊牌：把一张脸的使用权与署名权分开谈
  棚里拍一组样片: 创作与记录：在灯位与布景下产出一份可流通的影像
  对着照片起月份牌稿: 创作与记录：把照片转成要上墙的那张脸
  点石印上墙: 发布与归属：让一张脸进入公共墙面并结算署名
  把底片锁进柜子: 保管与封存：决定哪一份影像不再流通
  在灯位高台等一个光: 日常接触：等光间隙的相遇与自然后续
  棚门口认一张脸: 出入核验：凭登记簿认人而不是凭脸认人
  明星宿舍熄灯前串门: 社交与照护：熄灯前越界串门与后果
  试片间看一遍未剪版: 调查与核验：在成片之前看清多出来的那部分
chemistry:
  pairs:
  - pair: 0
    needs: 场务领班需要棚里按点收工；画师需要灯位与底片留得住脸
    misreading: 把赶拍当成不给画师留时间，把多拍一条当成不认收工点
    asymmetric_cost: 领班担的是全组误期，画师担的是底片归厂后自己手上什么都没留
    ritual: 开拍前一起对一遍灯位与收工的那一板
    conflict_loop: 越想把脸拍好越要拖时间，越拖时间领班越只能按点关灯
    repair: 各让一板：少拍一条，换底片先送画室
    irreversible_threshold: 把未过试载的底片私自带出洗印间，会终止借用灯位
  - pair: 1
    needs: 老画师需要稿子卖得动；经手人需要合同科的章认下去
    misreading: 把改稿当成不认合同，把催章当成只认公司不认画
    asymmetric_cost: 画师坏的是画室起稿的互信，经手人坏的是那一枚章的可信度
    ritual: 开稿前把照片与合同摊在同一张案上
    conflict_loop: 越想把脸画得像越改得晚，越改得晚越赶不上石印档期
    repair: 留一版原稿，另出一版照画室的意思
    irreversible_threshold: 背着画师把稿子送进制版房，会终止画室与片厂的互信
  - pair: 2
    needs: 演员需要角色与署名；院线伙计需要片子能跑能卖
    misreading: 把看未剪版当成替她争角色，把多留的四十秒当成她想被看见
    asymmetric_cost: 演员丢的是同一厂里的角色，伙计丢的是院线跑片的那条线
    ritual: 试片前先对一遍片子上的署名
    conflict_loop: 越想在未剪版里留得久越要剪掉别人，越剪别人自己越显眼
    repair: 把多出来的那段交回剪片台，换一个双方都认的署名位
    irreversible_threshold: 把未剪版放给另一家厂看，会终止两人共享试片间
  - pair: 3
    needs: 制片主任需要片子按合同交付；买办需要墙上的脸按期上版
    misreading: 把催约当成不认人，把换脸当成公司不在意署名
    asymmetric_cost: 主任担的是公司资产与失期作废，买办担的是石印档期与欠账
    ritual: 交件前把骑缝那道记号画完
    conflict_loop: 越怕失期越催，越催本人越要另谈署名
    repair: 把到期顺延几天，换一次署名另谈
    irreversible_threshold: 动用合同科那枚章改掉署名，会终止两人之间所有口头承诺
