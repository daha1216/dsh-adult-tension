name: 会员册与那道墨线
source_hash: 40a0131ba17797954a80aa6bf669dc900074cba6230009a839f4e1f962114b11
semantic_status: REVIEWED
reason: 来源为 adultindustry_setting_drafts.md A 版「会员册与那道墨线」（本轮七框架并行生产）。雪茄店门面、地下大厅与账房墨线三条线打通：9 地点各带出口/见证/可用项（high 2 为司册账房与除名墨线、丝绒卡座与呼叫铃线），9 活动覆盖 7 类，10 压力各绑 2 组三元组、活动/地点/搭配三向可达。机制是「在册即存在」：会员册记籍不记债、月费等额只作门槛不作刻度，权力全压在司册那支笔上——写字是准入、划线是除名，引荐连带把两个名字写进同一页。与同 era 的 mat-03b5642c（禁酒期爵士与报纸）以「那边的本子记欠款，这本册子记存在」分野，零地点零美学重叠。写手自验 369 checks 0 errors，静态复核通过。
checks:
  era_and_theme: true
  space: true
  people: true
  daily: true
  pressure_bindings: true
  distinct_functions: true
quality:
  grade: A
  reason: Static source review only; narrative acceptance is tracked independently in maintenance/playtests.
    「册子记存在不记债」把准入与除名写成一支笔的裁量，月费等额使钱失去刻度；引荐连带的人质结构与打烊后誊册的时间制度在既有框架中无同构，判为明显独特。
activity_functions:
  雪茄店里等暗门开一次: 日常接触：在前柜与暗门之间等一个「今晚有约」的准入
  门房柜台前核一行名字: 调查与核验：册子只对报对名字的人翻开
  乐台上把一支曲子撑完: 照护与修复：顶班的琴与她的嗓子同撑一场
  卡座里挨着听完一支慢歌: 身体靠近：丝绒帘内的城中之城，低语随托盘停半拍
  电话间里替人做一次引荐: 信息交换：引荐是给脸也是押命，名字写上同一页
  账房里看着划下那道墨线: 第三方与打断：听证与最后陈述当着两名会员进行
  酒窖里把一箱酒抬上滑槽: 身体靠近：认得的车牌与塞进口袋的名片各捏一页
  后巷铁门送一个除名者走: 空间与退出：当夜铁门送出、三个整月内不得再被引荐
  熄灯空场里把真话对完: 信息交换：白天的一切悬置到深夜才被账本承认
chemistry:
  pairs:
  - pair: 0
    needs: 司册需要每一行都有人认领；玩家需要自己引荐的那一行不被划掉
    misreading: 把连带划线当成勒索，把按册办事当成不念旧情
    asymmetric_cost: 司册押的是册子的公信，玩家押的是引荐副页上的签字
    ritual: 进账房先把引荐副页摊在册边，再开口
    conflict_loop: 越想保人越要动册子，越动册子那两行越接近一起划掉
    repair: 当着司册把责任那行改由自己认下，重签一页
    irreversible_threshold: 让司册换笔替你瞒一行，会终止「稳的那一行」的信任
  - pair: 1
    needs: 她需要这一场不塌；玩家需要顶班的工钱与名声两清
    misreading: 把挡酒当成客套，把散场同路当成攀附
    asymmetric_cost: 她押的是续约与台面，玩家押的是工会证上的下一场
    ritual: 开场前对一遍歌单，谁也不提台下的事
    conflict_loop: 越想把场撑完越要替对方挡，越挡越像把私情写成交易
    repair: 按今晚的服务记录当场结清，各自从后巷走
    irreversible_threshold: 把后台的私情写成交易记账，会毁掉她下一季的合同
  - pair: 2
    needs: 她需要那块车牌没人认得；玩家需要旧案笔录永远不交出去
    misreading: 把塞名片当成收买，把不追问当成同谋
    asymmetric_cost: 她押的是整条供应链，玩家押的是三年前那单案子的经手
    ritual: 点数时名片只塞一次，第二天谁也不提
    conflict_loop: 越认得车牌越要装不认得，越装越要在酒窖多待一刻
    repair: 把名片原样退回，两页各归各
    irreversible_threshold: 把车牌写进任何一张纸，会终止两页相安的默契
  - pair: 3
    needs: 她需要当年那句话被说完；玩家需要听证上自己的分量不折
    misreading: 把求助当成翻案纠缠，把沉默当成亏欠
    asymmetric_cost: 她押的是回册的唯一窗口，玩家押的是理事会里的信用
    ritual: 后巷铁门外的等车灯下说话，说完各走一边
    conflict_loop: 越替她说越像替自己辩，越辩当年那句话越说不清
    repair: 明天听证上原样把当年那句话说完，不添不减
    irreversible_threshold: 在听证上收回当年那句话，会终止她在等车灯下的等待
