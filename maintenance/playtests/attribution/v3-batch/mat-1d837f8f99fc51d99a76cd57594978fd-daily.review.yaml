summary: "本批为 maintenance/playtests/stale-input-v3/*.json（协议 non-explicit-runtime-brief-v2、素材修复前），按简报只用校准 1、2、6、7、8；第 3（时间词逐字一致）、第 4（出口/免责不堆叠）、第 5（每回合活动须有可观察进展）条属 v3 新增写法要求，本批从未被告知，一律不套用。框架文件仅核姓名、年龄、称呼：萧景川三十三岁公共节目策划人、郑予安三十八岁事实核查编辑、同侪直呼其名，与首回合人物栏一致，无角色错认（校准 2）；不得因素材后改扣分。四回合均无越权操作、无凭空事实、无替玩家锁定关键选择、无时间连续性破坏，blocking_findings 为空（校准 8）。校准 1：续写①写出「你把问题还给他」及可选小事，续写②不替玩家指定异议对象，续写③写出告别与对方不拦，均不构成 agency 越界。校准 6：采访机入袋、拉链从没拉死到拉死、展签空栏始终未补，皆有前置动作或已述状态支撑，无无动作书写/移交。扣分只在 natural_expression：续写②、③整句复用「讲解还在隔厅」「长凳空出一侧」（校准 7 可指认复用句），各记 1 分。非阻断观察（写入 reason 不进 blocking、不倒套第 4/5 条）：看画与核签两项在告别时仍未发生；NPC 在告别时声明「下次合作不加非工作话题」。四回合分 10/10/9/9，案例分取最低回合 turn 2 那一套（2/2/2/2/1），total=9≥8，无 0 维、无 blocking，案例通过=真。"
