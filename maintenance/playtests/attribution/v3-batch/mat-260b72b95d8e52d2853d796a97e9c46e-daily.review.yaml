summary: "本批为 maintenance/playtests/stale-input-v3/*.json（协议 non-explicit-runtime-brief-v2、素材修复前），按简报只用校准 1、2、6、7、8；第 3（时间词逐字一致）、第 4（出口/免责不堆叠）、第 5（每回合活动须有可观察进展）条属 v3 新增写法要求，本批从未被告知，一律不套用。框架文件仅核姓名、年龄、称呼：周廷轩三十三岁社区休闲活动协调员、陈静怡三十八岁地方生活摄影师、同侪直呼其名，与首回合人物栏一致，无角色错认（校准 2）；不得因素材后改扣分（现值把绘制城市天际线绑到另一对，不倒扣转写的协调员/摄影师）。四回合均无越权操作、无凭空事实、无替玩家锁定关键选择、无时间连续性破坏，blocking_findings 为空（校准 8）。校准 1：续写①写出询问与「你选你能做的那件」，续写②不替玩家指定异议对象，续写③写出告别与对方不拦，均不构成 agency 越界。校准 6：屋顶折线、炭笔停笔到搁回槽、相机始终在折椅边未开、空白未补、留言纸未够，皆有前置动作或已述状态支撑，无无动作书写/移交。扣分只在 natural_expression：续写②、③整句复用画友铅笔声、没去够留言纸、天台门与楼梯出口句（校准 7 可指认复用句），各记 1 分。非阻断观察（写入 reason 不进 blocking、不倒套第 3/4/5 条）：分层观察在告别时仍未发生；续写③把「今天」写成「明天」。四回合分 10/10/9/9，案例分取最低回合 turn 2 那一套（2/2/2/2/1），total=9≥8，无 0 维、无 blocking，案例通过=真。"
