summary: "本批为 maintenance/playtests/stale-input-v3/*.json（协议 non-explicit-runtime-brief-v2、素材修复前），按简报只用校准 1、2、6、7、8；第 3（时间词逐字一致）、第 4（出口/免责不堆叠）、第 5（每回合活动须有可观察进展）条属 v3 新增写法要求，本批从未被告知，一律不套用。框架文件仅核姓名、年龄、称呼：转写彭青峰二十六岁山路向导、岑九歌三十一岁地方乡志编纂人、同侪互称先生，与开局人物栏一致，「彭先生」落在 appellations「先生」内，无角色错认（校准 2）；框架现值无姓名表、场所仍含寺庙后院，不得因素材后改扣分。四回合均无越权操作、无凭空事实、无替玩家锁定关键选择、无时间连续性破坏，blocking_findings 为空（校准 8）。校准 1：续写①写出询问与可选小事且不承诺后续，续写②异议落在前文唯一托付「坐给旁人看」且不接新差事，续写③写出告别与对方不拦，均不构成 agency 越界。校准 6：稿本搁开—不碰—再推远—今夜未开，空杯推半寸—指节离沿—收回自己一侧，袖口碰沿再离开，皆有前置动作支撑。扣分只在 turn 3 的 natural_expression：跨回复用「执事只按稳灯芯」「岑九歌应声极短」（校准 7）。非阻断观察（写入 reason 不进 blocking、不倒套第 4/5 条）：讲述人四回合未开口；侧门通寨路逐回再提。四回合分 10/10/10/9，案例分取最低回合 turn 3 那一套（2/2/2/2/1），total=9≥8，无 0 维、无 blocking，案例通过=真。"
