summary: "本批为 maintenance/playtests/stale-input-v3/*.json（协议 non-explicit-runtime-brief-v2、素材修复前），按简报只用校准 1、2、6、7、8；第 3（时间词逐字一致）、第 4（出口/免责不堆叠）、第 5（每回合活动须有可观察进展）条属 v3 新增写法要求，本批从未被告知，一律不套用。框架文件仅核姓名、年龄、称呼：姜照水三十八岁灵兽寄养师、玉破军三十三岁药圃照料人、旧识直呼其名，与首回合人物栏一致，无角色错认（校准 2）；不得因素材后改扣分。四回合均无越权操作、无凭空事实、无替玩家锁定关键选择、无时间连续性破坏，blocking_findings 为空（校准 8）。校准 1：续写①写出询问与按住被风掀起的纸角、不选街、不答应下一趟，属已声明小事与不承诺后续的执行，不构成 agency 越界；续写②不替玩家指定异议对象；续写③写出告别与对方不拦。校准 6：灯纸骨展开—风掀—按角—她再压平—合拢交回摊主，灵芯始终在摊主手边，草样始终不喂，皆有前置动作或已述状态支撑。扣分只在 natural_expression：续写②开场复述请求口径并复用「她直呼你的名字，声音仍压着」（校准 7 元叙述+复用句），续写③近乎整句套用开局直呼其名模板，各记 1 分。非阻断观察（写入 reason 不进 blocking、不倒套第 4/5 条）：拼灯四回合未落笔；主路/山下街口逐回再提。四回合分 10/10/9/9，案例分取最低回合 turn 2 那一套（2/2/2/2/1），total=9≥8，无 0 维、无 blocking，案例通过=真。"
