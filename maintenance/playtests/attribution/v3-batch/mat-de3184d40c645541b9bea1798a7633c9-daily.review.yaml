summary: "本批为 maintenance/playtests/stale-input-v3/*.json（协议 non-explicit-runtime-brief-v2、素材修复前），按简报只用校准 1、2、6、7、8；第 3（时间词逐字一致）、第 4（出口/免责不堆叠）、第 5（每回合活动须有可观察进展）条属 v3 新增写法要求，本批从未被告知，一律不套用。框架文件仅核姓名、年龄、称呼：转写鸠摩拓跋二十六岁商路译员、米黛丽三十一岁摊位地图绘制人、同侪称先生，与开局人物栏一致，「先生」落在 appellations 内，无角色错认（校准 2）；框架现值人物表无姓名年龄，不得因素材后改扣分。四回合均无越权操作、无凭空事实、无替玩家锁定关键选择、无时间连续性破坏，blocking_findings 为空（校准 8）。校准 1：续写①写出询问与应下当场唯一小事且开口或停仍交回玩家，续写②异议落在前文唯一托付「只补一句叫法」且不接新义务，续写③写出告别与对方不拦，均不构成 agency 越界。校准 6：核钉—绳尺顿住—绳头递到能看清处—放回石钉双手空出，路图折入口实线—点线压掌下—合上，叫法始终未写成，皆有前置动作或已述状态支撑。扣分只在 natural_expression：续写②开场复述请求口径并整句复用石钉/摊影/值守向导景物句（校准 7 元叙述+复用句），续写③再套同一景物模板并复述「她把绳头放回石钉上，双手空出来」，各记 1 分。非阻断观察（写入 reason 不进 blocking、不倒套第 4/5 条）：试走折角与共用叫法四回合未完成；撤失效图、不进折角、驿院出口逐回再提。四回合分 10/10/9/9，案例分取最低回合 turn 2 那一套（2/2/2/2/1），total=9≥8，无 0 维、无 blocking，案例通过=真。"
