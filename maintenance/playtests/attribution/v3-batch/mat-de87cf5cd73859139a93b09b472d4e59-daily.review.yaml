summary: "本批为 maintenance/playtests/stale-input-v3/*.json（协议 non-explicit-runtime-brief-v2、素材修复前），按简报只用校准 1、2、6、7、8；第 3（时间词逐字一致）、第 4（出口/免责不堆叠）、第 5（每回合活动须有可观察进展）条属 v3 新增写法要求，本批从未被告知，一律不套用，也不倒套协议 v4 追加的被异议条款须逐字见于前文。框架文件仅核姓名、年龄、称呼：开局人物栏应泽辰三十三岁公共终端维护员、闻白榆三十八岁社区数据整理人，正文直呼「应泽辰」，落在 pair 1 appellations「直呼其名」内，无角色错认（校准 2）；yaml 现值无姓名年龄字段，不得因素材后改扣分。四回合均无测试账号操作正式系统、无凭空书写或无支撑移交（续写③板夹一行有翻开书写动作且内容与未提交状态相符）、无替玩家锁定去留或代填异议台词、无时间连续性破坏，blocking_findings 为空（校准 8）。校准 1：续写①问出真正要完成的是模拟约再核名额、小事留确认测试态或站着看，是已声明询问与不承诺后续的执行，不把 meaningful_choices 打成 0；续写②不代写异议内容，改由她等你把不同意见落到哪一步；续写③告别与不拦同理。校准 6：空白时段始终未填、浅紫边框仍亮、签到簿从翻页到合上、板夹从肘下换臂再到翻开写一行，皆有前置动作或已述状态支撑。扣分在续写②③的 natural_expression：②旁白把「不接受新增义务」写成「没加新项、没把楼层实走塞回来」的元叙述（校准 7 记 1）；③近乎整句复用②的浅紫边框与已有姓名一格未动。非阻断观察（写入 reason 不进 blocking、不倒套第 4/5 条）：「楼层 / 实走」从续写①起无来由贯穿，疑串其他活动或占位语，但不构成凭空世界状态；四回合模拟申请未真正提交；门厅/退出测试账户逐回再提。四回合分 10/10/9/9，案例分取并列最低中较早的 turn 2 那一套（2/2/2/2/1），total=9≥8，无 0 维、无 blocking，案例通过=真。"
