summary: "本批为 maintenance/playtests/stale-input-v3/*.json（协议 non-explicit-runtime-brief-v2、素材修复前），按简报只用校准 1、2、6、7、8；第 3（时间词逐字一致）、第 4（出口/免责不堆叠）、第 5（每回合活动须有可观察进展）条属 v3 新增写法要求，本批从未被告知，一律不套用，也不倒套协议 v4 追加的被异议条款须逐字见于前文。框架文件仅核姓名、年龄、称呼：开局人物栏邓斯坦朱迪丝三十八岁补给站维修人、炽心库兰三十三岁营地地图绘制员，正文直呼「库兰」，appellations「师傅」未使用，无角色错认（校准 2）；yaml 现值无姓名年龄字段，不得因素材后改扣分。四回合均无越权操作、无凭空书写或无支撑移交、无替玩家锁定去留、无时间连续性破坏，blocking_findings 为空（校准 8）。校准 1：续写①问出肩位承力并拿起备带比长度、不承诺下一趟，是已声明询问与选一件小事的执行，不把 meaningful_choices 打成 0；续写③告别与不拦同理。校准 6：松带从肩位垂下到挪开摊在台边、备带从手边到比齐孔位到未压死再到按回她这边、空架始终未推走、轻载始终未做、针从转给你看到搁在掌心再到收回针线盒，皆有前置动作或已述状态支撑。扣分只在续写②：正文替玩家指定异议对象为「这就够」并代填「改这一步怎么收」，meaningful_choices 记 1（不记 0，因请求已声明要异议且不接新义务，且「想改固定法，现在讲」仍把下一步留下）；同回起句复述请求口径，natural_expression 记 1（校准 7）。非阻断观察（写入 reason 不进 blocking、不倒套第 4/5 条）：四回合试载未做成；守层灯 / 轮值守卫 / 不跟下一趟逐回再提。四回合分 10/10/8/10，案例分取最低回合 turn 2 那一套（2/2/1/2/1），total=8≥8，无 0 维、无 blocking，案例通过=真。"
