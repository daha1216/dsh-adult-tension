  1. 第 1 条 agency 校准合规：续写①与续写②中，模型忠实执行玩家指令并推导合理结果，木牌推回面前未强行替玩家承诺后续。
  2. 第 3 条时间校准合规：续写③告别紧扣「今天」，无「明天」等时间错乱。
  3. 第 9 条异议条款核对合规：续写②异议条款“逾期未归按私逃报备族中”逐字见于续写①木牌所写内容，指出不接受理由，保留拂晓取药与公馆挡查验，抹去私逃改写为自扣私账，改一保一，未造虚构前置条款，亦未推翻已有进展。
