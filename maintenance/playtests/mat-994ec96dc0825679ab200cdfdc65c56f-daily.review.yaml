summary: "四回合全部忠实使用提交素材：「山间温泉旅馆」的两条给定细节、活动「替她还回异族证件」的触发器（翻正木牌、缺一页、办事处来收）以及「只认本人到场补／代办作废」的社会规则都落进正文，一叠回收灯纸、几枚可拆装的旧挂环等资源被实际使用；姓名（夜叉丸苍马／宵町朔夜）、身份（灯会道具匠／街区节庆记录人）与称呼（直呼其名）核对无冲突，40／45 岁均为明确成年人；框架文件仅用于姓名、年龄、称呼核对，未因素材后改扣分。本批为协议 v5 批次（scope: adult_tension_narrative），适用第 1–10 条校准：第 9 条的适用范围句排除的是 v2／v3 旧批，不排除本批，且本批异议回合确已逐字引用回合 1 原句、写明写在纸面、未夹带第二项（第 9 条）；续写①「我」声明的小事有执行过程与当场结果，且未替玩家承诺后续（第 1、5 条）；续写③时间词按「今天」逐字收尾（第 3 条）；世界状态变化（挂条、移条、住客簿登记、移灯）均有前置动作（第 6 条）；无出口信息逐回合复述或免责清单堆叠（第 4 条）；无露骨描写，尺度放开的是张力而非露骨度（第 10 条）。张力四回合均有来源且各有升级或代价落点（缺页与明早收档的时限、挂条上墙的曝光升级、改一条保一条的当场对抗、未偿代价落到她一人身上），故 tension_density 四回合均为 2。四回合六维全部为 2、回合分均为 12 且互相持平，案例级 scores／evidence 按「取最低回合」规则取首回合（turn 0）；无 0 分维、blocking_findings 为空，passed=true。已记录、不构成阻断也不扣分的小瑕：回合 0「签名拦」错别字；回合 2「九个字」与实际十字计数不符及一处句式拧；回合 3 清单首句与回合 0 木牌细节的对读张力；「缺的是契约附页，只认本人到场补」在回合 0／1 逐字重复；「木鱼两下……没回头」收束句在四回合复用。"
