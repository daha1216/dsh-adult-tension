summary: |-
  本批为协议 v5（adult-tension-narrative-brief-v5）转写，适用校准第 1–10 条；第 9 条只适用于 v4 转写，本批按「不得按协商结构合规从宽」处理，经核对该形态未出现。四回合六维合计依次为 turn 0 = 9、turn 1 = 10、turn 2 = 11、turn 3 = 12（各回合 total 均等于该回合六维之和，案例级 scores/evidence 取最低回合 turn 0；前一次产物的 turn 1 / turn 3 total 与六维之和不符，本版已按维度和重算修正，评分未改动）。四回合均达到回合分 ≥9、无 0 分维度、无 blocking，案例通过，案例分 9，是「通过但贴线」的案例。最弱处在张力浓度与语言：四回合都停在「让可信任的人见证条件」这一条事务性活动上，条目写得清楚、边界写得实，但直到末回合才靠未署名常座和未销的账结出情感落点，缺少中途升级，故 turn 0 的 tension_density 与 world_specificity 各只给 1（地点集中在账台一案，《书院》与坊门夜禁只被复述、未进入动作或代价），形成 9 分贴线。语言上有一处可举证的复用：「当值的走近半步，把那（这）行低声念了一遍」在 turn 1 与 turn 2 近似逐字复现，另「提灯/灯光从案腿边扫过」的句法在四回合各出现一次，按第 7 条对 turn 1、turn 2 的 natural_expression 各计 1。无越权操作、无凭空事实、无替玩家锁定关键选择；露骨描写未出现，未触发 blocking 记录。素材使用忠实：夏侯朔风（四十岁，借酒肆谈事的中间人）与司徒疏影（四十五岁，胡姬酒肆掌柜）的姓名、年龄、权限与「当值者见证条件」「赊账册/纱帘隔间/后堂不留客过夜」的规例均与 package 一致；评分未因 framework 文件为修复后版本而调整。
