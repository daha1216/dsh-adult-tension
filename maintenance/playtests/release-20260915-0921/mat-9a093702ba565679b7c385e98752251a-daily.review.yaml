summary: "批次适用说明：本转写 record 内 protocol = adult-tension-narrative-brief-v5、scope = adult_tension_narrative、mode = daily、4 回合（开局＋3 续写），故简报第 1–10 条校准全部适用；第 9 条末句只把该条「被异议条款须逐字见于前文」的口径限定在协议 v4 转写批次（并禁止倒套到 v2／v3 旧批），本批既不得据此从宽、也不得把 v4 口径当作可豁免，本条已按同一口径逐句回核并通过；第 10 条为 v5 新增的张力浓度校准。四回合六维合计依次为 turn 0 = 11（2+2+2+2+2+1）、turn 1 = 12（2+2+2+2+2+2）、turn 2 = 12（2+2+2+2+2+2）、turn 3 = 12（2+2+2+2+2+2），各回合 total 等于该回合六维之和。案例分按 aggregation 取唯一最低回合 turn 0 那一套 scores/evidence 逐维照抄（world_specificity 2、character_credibility 2、meaningful_choices 2、consequence_continuity 2、natural_expression 2、tension_density 1），案例 total = 11；四回合均 ≥ minimum_score 9、无任一维 0 分、案例级与各回合 blocking_findings 均为空，故 passed = true。逐条自查：第 1 条——续写①声明的两件事（先问对方真正想完成的事、再亲手做一件当场有结果的小事）都写出执行过程与可观察结果，属已授权动作的落地，不构成替玩家决定；四回合均未替玩家发表未声明台词、立场或向第三方承诺，玩家在 request 里声明的「我还没答应其中任何后续」被完整保留（「这条先搁这儿，你点头才算数；不点头，它就是一张能擦的纸。」），收尾回合的「不来，这张纸我留着」把关键选择留在原处；续写②的异议对象与不接的理由由该回合 request 明确授权（逐字引用一条原句并说明为何不接受），不计越权。另记不计分观察：framework 的「替她别住过长的耳尖」三条分支由模型在授权范围内择定，已在 turn 1 reason 写明。第 2 条——正文以姓名与「她／你」指称，未使用该 pair 的 appellations「掌柜」，无角色错认；姓名、年龄与 framework 一致（姜照水 45 岁契约印记代管人、玉破军 40 岁山门下来的夜值记录人，与该 pair 的 player／npc 身份及关系来由「两边的日子对不上」对应），两人均为成年人；framework 现值为修复后版本，本次核对只用于姓名、年龄、称呼，未据此对任何一维加减分。第 3 条——告别用当日的「今晚它不落册」，「明天巳时前」只指续写①已写定的次日安排，未把告别写成明天。第 4 条——世界观里的夜禁规则只在开局段出现一次，出口与边界信息均绑定本回合具体取舍（点头才算数、本名不盖山门印、不来则这桩没成），无逐回合复述，也无不绑定取舍的免责清单，natural_expression 四回合均记 2。第 5 条——四回合核心活动都有可观察进展：开局把工序与身体靠近的请求摆到手上、续写①耳尖别好且二十二号栏的盆推进栏口并有舔食、条款落纸待点头、续写②改一条保一条并当场落笔、收尾添水并点明未对过的时辰与仍在的空格，无「停在邀请、选项复述、无结果悬置」。第 6 条——寄养册、食盆、工单、炭条、干燥架第二格、布带与二十三号栏的空格等状态变化都有同句前置动作描写支撑，未发现凭空状态变化，未记 world_specificity 0。第 7 条——未因句式克制或对白以事务为主而扣分：各回合对布带、干燥架、二十三号栏水的连续指称是对同一物件的承接与有意回照，不是逐回合复述同一公式，也没有元叙述，不构成该条要求的复用句依据。第 8 条——未发现越权操作、凭空事实、替玩家锁定关键选择或时间连续性破坏，blocking_findings 为空；唯一扣分（turn 0 的 tension_density 1）属质量判断，按该条只写入 reason，不进 blocking。第 9 条——被异议条款「对不上，两份抄件各存各的，谁都不落名。」逐字见于续写①正文（载体写明为工单背面、炭条写、压在干燥架第二格），协商只议一条、改「落不落名」而保留其余三项，未现写条款再称旧有、未夹带前文不存在的第二项，也未见「主张前文无可议条款」的规避形态。第 10 条——turn 1／2／3 张力都有来源且各有升级或代价落点（日子对不上＋条款挂上明日巳时前的时限；当