summary: "四回合全部忠实使用提交素材：「破败义庄」的给定细节（两轮不同的补梁痕、外沿草席与席下给无人认领旅人备下的纸人）与活动「分半张烤得焦黄的干烙馍」的触发器（掰馍、把烤得焦黄的那半转向玩家）落进正文，绳尺、垂线、旧建筑草图、可添注的空白驿道底图与防沙图筒等资源被实际使用；世界规则（旧图只作参考、未注明的墓道石门按未探处理、断龙石一落封死退路、取物前先定门外接应）与习俗（向导留白让后来人补记实际水情；分焦那半者下次分水先记一笔）在开场交代且被后文沿用。姓名与年龄核对无冲突（厉青蛮／45 岁，旧建筑测绘师；蒙破晓／40 岁，驿路绘图员），称呼「蒙先生」在被称呼方 appellations 列表内，不构成角色错认（第 2 条）；框架文件仅用于姓名、年龄、称呼核对，未因素材后改而扣分。本批为协议 v5 批次（scope: adult_tension_narrative），适用第 1–10 条校准：第 9 条的适用范围句排除的是 v2／v3 旧批，不排除本批，且本批异议回合确已逐字引用回合 1 边格原句「扩测须看守点头。」、写明写在纸面并当场落墨、未夹带第二项（第 9 条）；续写①「我」声明的小事有执行过程与当场结果（按住垂线、读数、底图落点、旁注亲见），关键选择（接应人）仍留白待填，未替玩家承诺后续（第 1、5 条）；续写③告别在当晚完成，无「明天」式时间错位（第 3 条）；四回合所有世界状态变化（门框炭记、底图落点、边格划改、馍的转手）均有前置动作支撑，无凭空事实（第 6 条）；无出口信息逐回合复述或免责清单堆叠（第 4 条）；无露骨描写，尺度放开的是张力而非露骨度（第 10 条），故 blocking_findings 为空。张力四回合均有来源且各有升级或代价落点（开场焦黄那半馍与「这两半得撑到出沙」的沉默要价；目标与「沙一起，痕就盖平了」的时限同时立起并留下待填的接应人；回合内「改一条、保一条」把口头裁量改成到场可见并划掉旧字；以交出那半馍结清这顿账并留下门框炭记作日后凭据），故 tension_density 四回合均为 2。四回合六维全部为 2、回合分均为 12 且互相持平，案例级 scores／evidence 按「取最低回合」规则取首回合（turn 0）——因四回合互相持平，最低回合按协议约定取最先达到该分数的 turn 0，案例级六维引文即 turn 0 的那六条，逐条可在该回合正文逐字查到；无 0 分维、回合分不低于 9、blocking_findings 为空，passed=true。已记录、不构成阻断也不扣分的小瑕：回合 0 正文使用半角逗号（「再走进去看,这两半」「纸人,是给」「下颌绷着,在等」）；回合 1「看守凑近瞄了眼，用炭在门框上补一笔」的施动者主语略含混；回合 2 引语中的「须看守知情」仅「须看守」逐字见于前文，余下四字为现场改述；回合 3 凭据只提门框炭记一处，与回合 1、2 的门框炭记、边格划改同属一条账。"
