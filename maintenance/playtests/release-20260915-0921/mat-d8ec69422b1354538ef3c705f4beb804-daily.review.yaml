summary: "批次适用说明：本转写 record 内 protocol = adult-tension-narrative-brief-v5、scope = adult_tension_narrative、mode = daily、4 回合（开局＋3 续写），故简报第 1–10 条校准全部适用；第 5 条末句只把 v4 简报限定在 v4 旧批，不改变本批口径；第 9 条末句只把「被异议条款须逐字见于前文」的核对限定在协议 v4 转写，本批不属旧批，故按同一口径逐句回核，也不得按「协商结构合规」从宽；第 10 条为 v5 新增的张力浓度校准。四回合六维合计依次为 turn 0 = 11、turn 1 = 11、turn 2 = 12、turn 3 = 12（各回合 total 均等于该回合六维之和）。案例分按 aggregation 取最低回合那一套：turn 0 与 turn 1 并列最低（11），并列时取较早者，案例级 scores 与 evidence 即取 turn 0 的整套——world_specificity 2、character_credibility 2、meaningful_choices 2、consequence_continuity 2、natural_expression 2、tension_density 1，total = 11，达到门槛 9；无任一维 0 分，案例级与四个回合的 blocking_findings 均为空，passed = true（通过，最弱处为开局回合的张力浓度与续写①的玩家主体性，距门槛仍有 2 分余量）。两处扣分：turn 0 的 tension_density 1（张力来源清楚——旧绺玉镯与被逼当镯的隐情、寄存簿与女将时限、薄纸外正在换曲子的宴席、女将鞋声在梯脚停了一停，但该回合只有来源铺开、回合内无升级也无代价落点，按第 10 条记 1，不是 0 分，因为并非无欲望、对抗、风险来源的平淡回合）；turn 1 的 meaningful_choices 1（三名经手、时限与逾时归属都当回合写清、边界齐全、也未替玩家承诺后续，但玩家侧整回合只被邀请与被推纸，未落进任何实际取舍，按第 5 条「停在邀请与安排复述」记 1，属质量瑕疵）。按聚合规则，案例级 scores 与 evidence 只照抄最低回合（turn 0，与 turn 1 并列 11 时取较早者），因此案例级 meaningful_choices 记 2（turn 0 未触线），turn 1 的这项扣分留在该回合的 turn_reviews 中，不向案例级传递。逐条自查：第 1 条——续写①声明的两件事（先问对方真正想完成的事、再当场做一件有结果的小事并把牵连安排写清）都写出执行过程与可观察结果，这不构成替玩家决定；四回合均未替玩家发表未声明的台词、立场、异议内容或关键选择，也未替玩家向第三方承诺，「我还没答应其中任何后续」被如实保住（「这纸只是镯子的账，不是你替我点头。」「她把纸推过来，不催。」）。第 2 条——该 pair 的 appellations 为「公子」，正文全程未使用、以姓名与「你」指称，属未使用而非错称，无角色错认；姓名、年龄与称呼只用框架文件核对：永仓以藏与框架 player.identity「町屋修缮匠」、高杉菊代与框架 npc.role「祗园艺伎」逐条对应，均明确成年，框架未列姓名字段与年龄字段，正文自定姓名与年龄未与之冲突；该文件现值为修复后版本，本次只用于姓名、年龄、称呼核对，未因素材后改扣分。第 3 条——收尾逐字用「今天就到这儿。」，与「今天到此为止」同口径，未滑成「明天」；篇内「下一场未刻开席」「巳时」均指当夜既定事项，未发现可举证的错位（「巳时」与「下一场未刻开席」之间是否暗含次日之嫌，正文未把其中任一项写成「明天」，按「逐字一致」口径不构成扣分依据，此处如实记为观察项而非扣分项）。第 4 条——出口与免责性质的信息没有逐回合复述，也不存在脱离具体取舍的免责清单：告别的「小门在廊头拐角」只出现一次且绑定具体走法，未按该条扣分。第 5 条——四回合核心活动（用掌心温热她腕上冰凉的翡翠玉镯及其牵连出的当镯安排）都有可观察进展：开局递腕求焐并把镯子的事推到这一场之后、续写①点清绺口并把三行安排落到纸面、续写②当场圈改一条并钉住另三样、收尾逐项点清已办成与仍未完成，没有无结果悬置；唯一触线处已记入 turn 1 的 meaningful_choices。第 6 条——未发现缺少前置动作支撑的世界状态变化：纸帖三行有她执笔落纸与推纸的动作，「不问价」的圈改有提笔动墨，纸折三折压进镜台左匣有吹纸与匣盖回音，红绳两次重绕都有当场动作，故不记 world_specificity 0，也不进 blocking。第 9 条——异议回合逐字引回「巳时前谁拿去，只问价、不当出，纸上不落菊代的名。」并写明出处是纸面（他压在第二行上逐字念出的那张纸帖），只议这一条，保项（第一行不出屋、第三行不落名）逐字可回溯，未现写旧条款、未夹带前文不存在的第二项；反向的规避形态（主张前文没有可议条款）未出现。第 10 条——全篇为叙事级文字，无露骨描写，尺度放开的是张力而非露骨度，未触发露骨反记的 blocking；四回合张力来源分别是递腕求焐与女将时限、纸面三行安排与镯子去处的未决、当场拒一条并改写、收尾把未结代价留在原地。素材使用忠实：地点取「祗园艺伎置屋纸拉门后」（镜台、纸拉门、廊下木梯与隔纸宴客声、后院小门），活动取「用掌心温热她腕上冰凉的翡翠玉镯」（从雨里回来的冰凉翡翠、松了半圈的绳结、焐回体温），人物基线取该 pair 的掌眼义务（只说成色、不替人喊价）与玩家侧 reputation（看过的东西说得清），压力「演出帷幕即将拉开」的时限（下一场未刻开席、女将催场、寄存簿点验）在开局即落地，上述条目均能在框架 material 的绑定关系里逐条对上，且桥接（地点同在京都一侧、按町内步行计）未被违反。全程未修改转写、未重跑生成、未调整门槛，未创建任何脚本、诊断或临时文件，仅写入本评分文件；评分结论为如实通过。"
