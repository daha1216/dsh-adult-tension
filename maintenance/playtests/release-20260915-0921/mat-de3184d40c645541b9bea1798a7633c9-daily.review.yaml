summary: "本批按 protocol=adult-tension-narrative-brief-v5 评分，适用第 1–10 条校准：#9 中「只适用于协议 v4 转写、不得倒套 v2/v3 旧批」的限定不排除本批，本批仍按 #9 核对被异议条款且不得按协商结构合规从宽；#10 张力浓度为本批新启用维度。框架文件只用于姓名、年龄、称呼核对：鸠摩拓跋（三十三岁，摊位地图绘制人）与米黛丽（三十八岁，商路译员）对应 pairs[0] 的玩家/NPC 身份，两人均为明确成年人，前后无矛盾；appellations 中的「先生」在正文中未出现，无称呼错认可判；素材后改事项未计入扣分。四回合忠实使用提交素材：活动「替她挽紧被狂风吹散的红纱面罗」的 trigger 与 immediate、酒肆的八角琉璃窗与灶边小碟清水、压力「琉璃长明灯油即将燃尽」的灯油与灯芯、玩家资源绳尺与用词本均在正文落地。逐条核对：#1 回合 1「我」声明的小事写出执行过程与当场结果且不替玩家承诺后续；#2 无误称；#3「今天到此为止」逐字收尾，未把告别写成明天；#4 无出口信息逐回合复述、无通用免责清单堆叠；#5 四回合核心活动均有可观察进展（系纱、核准灶上字与点定菜、改定一条保一条、结算离场）；#6 木牌、湿面案、炭笔、本子、纸与菜碟都有前置动作或当场说明支撑，未见凭空捏造的世界状态；#7 未因句式克制而扣分；#8 blocking_findings 为空；#10 只有回合 2 出现直接对抗与改/保落点，回合 1 是抄字、核对与点菜的事务流程，按「纯事务性平淡回合 ≤1 分」判 1。全篇无露骨描写，尺度放开的是张力而不是露骨度；无 0 分维。案例分取最低回合（回合 1）的一套：11 分，passed=true。已记录但不构成阻断、不降维度分的小瑕：回合 2 的异议由 NPC 先开口，被异议条款是她自己先前的当面声明，玩家在该回合正文里没有自己的话；回合 2 把该条款改述为写在本子上、摊在桌沿的字迹，与回合 1 的当面说明及本子上实写「奶源·驼」的记录媒介相错位；回合 3 又把驼酪的抄录说成落在她本子上，并把回合 2 已经并齐的两盏酒再写一次盏的动作。"
