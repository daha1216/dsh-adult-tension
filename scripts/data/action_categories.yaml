 # 非交易场景动作 → 功能类别。每条动作必须只归入一个类别，并已存在于 pools.yaml。
 # 由 roll_opening.py 读取，类别名还须在 action_metadata.yaml 中有对应元数据。
调查与核验:
- 核对一条时间线
- 让对方标出消息里未经证实的部分
- 先说明自己不知道什么
- 把关键问题写在纸上逐项确认
- 让对方决定是否打开录音
- 询问谁还知道这件事
- 把未经证实的消息标为待核实
- 让对方决定是否查看文件
信息交换:
- 承认紧张
- 问一句不该问的
- 先开口叫名字
- 分享一只耳机
- 教一个动作
- 教她一个身段
- 在防喷罩前替她理顺耳机线
- 将改好的满分试卷推到她面前
照护与修复:
- 递纸巾
- 留一盏灯
- 把热的那份推过来
- 递过半瓶干净水
- 用酒精棉按住渗血
- 替她扶正防毒面罩
- 侧身挡住通风口的风
- 替她拉上背后拉链
- 替她扶正猫耳发箍
- 递过宽大队服
- 分半张烤得焦黄的干烙馍
- 替他拂去罗盘上的青铜尘土
- 替她扣紧手腕上的皮质护腕
- 递过斟满葡萄美酒的金樽
- 按住她因为羞耻而发颤的尖长精灵耳
- 替她擦去后颈渗出的细汗并拉上防窥帘
空间与退出:
- 主动把门打开
- 坐到离出口更近的位置
- 改到公共区域继续谈
- 先各自离开再约下一次
- 把关键物品留在原地后离开
- 把当晚互动明确收束
- 先处理现实事务再继续
- 把话题转回事务
- 约定下一次沟通条件
- 明确今晚只处理一件事
- 请求庇护
- 邀请留下
- 把灯调暗
- 陪你等末班车
- 反手反锁包厢门
第三方与打断:
- 替你挡下一通电话
- 门外有人敲门
- 店员认出主 NPC
- 司机提醒即将到站
- 值班人员要求确认身份
- 另一名 NPC 带着文件进场
- 监控提示异常
- 让可信任的人见证条件
- 把争议交给正式流程处理
- 家人突然来电
- 同事带着文件找上门
- 店内广播叫到 NPC 的名字
- 门禁记录出现异常
- 第三方拿走关键物品
日常接触:
- 递上一杯酒
- 约在午夜
- 试探底线
- 递外套
- 让出座位
- 接住掉落的东西
- 替她挽一次发
- 递一盏刚沏的茶
- 为她描一次眉
- 雨里把伞偏过去
- 对弈时让半子
- 下意识揪住你的后衣角
- 把防身桃木小符塞进他袖口
- 用指尖替她抹匀眼角油彩
- 替她挽紧被狂风吹散的红纱面罗
- 以指尖朱砂点向她眉心镇妖
- 将一支点燃的雪茄递到她唇边
- 递上一块干净白布替她拭刀
- 当面卸下她沾满冰霜的秘银肩甲
- 伸手帮她托住沉重的大拖尾裙摆
身体靠近:
- 替她系松开的盘扣
- 借口魔力供给贴近
- 用嘴咬住发绳扎单马尾
- 伸手捏了捏她的精灵耳
- 把发烫的脸埋进你的掌心
- 替她解开被眼泪浸湿的礼服束腰
- 用掌心温热她腕上冰凉的翡翠玉镯
- 替她摘下后颈沉重的鸽子蛋钻石项链
- 伸手捏了捏她气鼓鼓泛红的脸颊
- 掀开厚重的毛毯将她整个人裹进怀里
