 # 非交易场景动作类别的运行元数据。function / visibility / escalation 均为必填。
 # 由 roll_opening.py 写入 roll，并由 fill_opening.py 写入 current_node。
调查与核验:
  function: investigation
  visibility: medium
  escalation: low
信息交换:
  function: information
  visibility: variable
  escalation: low
照护与修复:
  function: care
  visibility: public_or_private
  escalation: low
空间与退出:
  function: exit
  visibility: variable
  escalation: deescalate
第三方与打断:
  function: third_party
  visibility: high
  escalation: variable
日常接触:
  function: rapport
  visibility: variable
  escalation: low
身体靠近:
  function: proximity
  visibility: variable
  escalation: high
