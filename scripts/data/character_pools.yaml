# 角色三池：表层风味 / 口癖 / 外观与气质轴。
# 由 scripts/roll_opening.py 的 load_pools() 加载；本文件是数据本体，增删条目即生效。
# 契约：
# 1. 表层风味与口癖单项 ≤8 字，超长条目会被加载器静默过滤。
# 2. 外观轴保持 轴名→组名→条目 两层结构；「自然发色」「瞳色」「异色瞳」等键名被
#    写实门控（roll_opening._realistic）按名引用，改名会破坏写实基调的过滤行为。
# 3. 分组仅用于检索、去重与生成解释，抽取时不先抽分组。

表层风味:
  傲娇反差: [傲娇, 冷娇, 逞强嘴硬, 扮猪吃虎, 闷骚, 装酷内热, 假高冷]
  冷淡疏离: [三无, 清冷, 孤高, 出尘淡漠, 清冷寡言, 疏离淡漠, 清寂, 冰山, 淡泊寡欲, 清高自持]
  温柔亲和: [温柔年上, 治愈系, 温婉, 体贴包容, 忠犬, 老好人, 温润如玉, 和煦亲切, 柔声细语, 包容宽厚, 耐心守护]
  端庄教养: [姐御, 端庄淑女, 矜持知礼, 大家闺秀, 老成持重, 温雅端方, 世家教养, 持重稳妥, 恭谨守礼, 雍容端庄]
  傲慢高冷: [傲慢公子, 傲慢千金, 大小姐, 自恋狂, 高傲, 目中无人, 恃才傲物, 睥睨众生, 颐指气使, 目下无尘]
  活力外放: [元气, 大大咧咧, 吃货, 戏精, 中二, 俺样]
  危险腹黑: [腹黑, 病娇, 小恶魔, 笑面藏刀, 天然黑, 毒舌, 吐槽役]
  认真内敛: [书呆子, 认真过头, 正经人崩坏, 社恐结巴, 武痴]
  其他单体: [天然呆, 病弱, 慵懒摸鱼, 护短, 爱哭鬼, 迟钝木讷, 系统自拟]

口癖:
  句式节奏: [句尾口癖, 极简应答, 语速过快, 拟声词多]
  语域腔调: [敬语过剩, 书面语腔, 突然方言]
  表达策略: [委婉绕圈, 比喻控, 总在道歉]
  称呼习惯: [称呼独特, 无敬语直呼]

外观轴:
  发色:
    自然发色: [黑, 深棕, 亚麻, 栗色, 奶茶色, 蜜金]
    冷调染色: [银白, 铂金, 雾灰, 雪青, 蓝紫]
    暖调/艳色染色: [酒红, 粉, 脏橘, 墨绿]
    特殊工艺: [渐变, 内侧挑染, 鸳鸯双色]
  发型:
    短发: [短碎, 寸头, 齐耳短发, 飞机头]
    中长/直发: [长直, 及肩内扣, 偏分长发, 齐刘海]
    束发扎发: [高马尾, 双马尾, 丸子头, 挽髻盘发]
