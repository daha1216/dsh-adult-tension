    首饰饰品: [耳骨钉, 吊坠项链, 戒指, 护身符]
    服饰配件: [露指手套, 围巾, 领带, 徽章]
    随身物件: [旧手表, 耳机]
    身体印记: [纹身, 旧疤, 创可贴]
