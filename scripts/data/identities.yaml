      authority: 合同里的拒演条款还没被用过
      resource: 一间锁得上的化妆间
      limitation: 金主在今晚的包厢里
      obligation: 散场前不能消失
      exposure: 后台私情写成交易会毁下季合同
      hidden: 下家剧院的合同，就锁在化妆间柜子里
    - role: 走班戏班的台柱
