      authority: 一把量衣软尺和满城老客的口碑
      resource: 一匹客人抵账留下的好料子
      limitation: 手艺认她的人一年比一年少
      obligation: 客人的尺寸与私话不出店门
      exposure: 被写成给谁做衣不收钱，老客全跑光
      hidden: 抵账那匹料子，本是她当年备的嫁妆
    - role: 老茶馆的当家茶艺师
      function: 坐镇茶台、稳住熟客、教新学徒看水温
      authority: 茶馆没她开不了张
      resource: 半饼只剩三泡的老茶
      limitation: 茶馆的租约握在别人手里
      obligation: 茶台上听来的事不带出这道门
      exposure: 传成靠脸坐台，这行就做到头了
      hidden: 那半饼老茶，是师父咽气前从枕下摸出的
    - role: 古籍修复室的修复师
      function: 补页、托裱、把散了架的孤本一页页救回来
      authority: 一双被图书馆和藏家都认的手
      resource: 一册补到一半、来历说不清的孤本
      limitation: 修复周期长，钱来得慢
      obligation: 经手的书一字不外传
      exposure: 私自留页一旦传开，再无藏家上门
      hidden: 那册孤本最后一页被她自己裁下过
    - role: 昆曲班的当家闺门旦
      function: 撑场、带徒、把水磨腔一字一字磨给年轻人
      authority: 开锣唱哪出她说了算
      resource: 一箱传了三代的头面
      limitation: 角儿的去留只在班主一念之间
      obligation: 台上认分寸，台下认规矩
      exposure: 台下的私情写成戏班丑闻，招牌就塌了
      hidden: 三代头面里点翠最正的那支，是仿的
    - role: 书画装裱师兼鉴定眼
      function: 裱画、掌眼、替藏家把真伪说清楚
      authority: 圈内认她那一句“看不准”
      resource: 一卷说不清来历的旧画
      limitation: 一旦看走眼一次，名声就裂
      obligation: 替客人掌眼的话只对客人说
      exposure: 被写成勾结做局，这条街再没人敢找她
      hidden: 那卷旧画，是失踪师父的手笔
    - role: 香道馆的主理人
      function: 香席、教习、替人配一炉安神的香
      authority: 半个城的香席都认她的席
      resource: 一窖沉了十年的香木
      limitation: 真正的好料一年比一年难进
      obligation: 香席上说过的话随灰烬散
      exposure: 被写成故弄玄虚骗钱，熟客圈立刻散
      hidden: 窖里最沉那根香木，是父亲抵债抵进来的
    - role: 悬空神殿的守夜巫女
      function: 守夜祭、接神谕、把香客的祈愿一一登册
      authority: 神殿夜门的钥匙与初祭的主持
      resource: 一册只记神谕不记名字的登记簿
      limitation: 神谕的解法，长老会有权重解
      obligation: 神谕未宣之前，一个字不能漏
      exposure: 夜留外男写成渎神，她会第一个被罚
      hidden: 登册的神谕里，有一条是她自己编的
    - role: 藏经阁的守阁女尼
      function: 守阁、晒经、把借阅人的名号一一登记
      authority: 阁门钥匙与晒经日的安排
      resource: 一函只对内借阅的旧抄本
      limitation: 方丈一句话就能收回阁权
      obligation: 阁里的事不出山门
      exposure: 夜留外人写成玷污清净地，戒牒难保
      hidden: 还俗文书三年前就写好，压在蒲团底下

player:
  同侪:
    identity: 同一条线里的对口人
    baseline: 和她吃同一行饭，今晚却不能把话说满。
    resources:
      - 一份今晚还能用的内部口径
      - 能把人从走廊里拉开的熟路
    reputation: 圈子里认的是说话算数
  旧识:
    identity: 多年没见的旧识，今晚才重新碰上
    baseline: 还记得她从前怎么把场面撑住，也记得自己没资格替她做决定。
    resources:
      - 一段只有两个人知道的旧事
      - 一个今晚还能接通的共同熟人
    reputation: 从前靠得住，现在不知道还算不算
  外来者:
    identity: 外请来处理一件事的人
    baseline: 这地方的规矩不是你的；你只对自己接的这一单负责。
    resources:
      - 一份只对你有效的临时通行证
      - 办完就能走的退路
    reputation: 办完事就消失的外援
  平级合作:
    identity: 联合项目的对口人
    baseline: 你们今晚必须交出一个共同口径，谁也不比谁高一级。
    resources:
      - 一半还没合并的材料
      - 能把会议推迟一格的窗口
    reputation: 合作过就很难装不认识
  被求助者:
    identity: 她今晚来找的人
    baseline: 你能推迟、能作证、能把门关上，但不因此握着她的把柄。
    resources:
      - 一个还能改走向的窗口
      - 一份她不知道你有没有的材料
    reputation: 找上门的人最后多半认你一句
  服务提供者:
    identity: 今晚被请来做事的专业人士
    baseline: 你的职责止于把这件事做完；她除了是你的客户，什么也不是。
    resources:
      - 职业所需的工具与许可
      - 一份今晚的服务记录
    reputation: 把活做完、不多问
  远房亲戚:
    identity: 远房亲戚，血统比交情近
    baseline: 亲戚这个词今晚不够用，但足够让你走进这扇门。
    resources:
      - 族里还认的一个称呼
      - 一张能证明关系的旧照片
    reputation: 不上桌也赶不走的远亲
  临时共处:
    identity: 今晚才碰上、暂时走不了的人
    baseline: 你们本来不必说话；门关了之后才变成必须说话。
    resources:
      - 一张回不去的票或过期的末班
      - 对这间屋子临时的合法停留
    reputation: 谁也不欠谁，除非今晚开口
  邻居:
    identity: 隔一堵墙住了很久的邻居
    baseline: 门对门这么久，今晚是第一次同时站在同一盏灯下。
    resources:
      - 一把互相托付过的备用钥匙
      - 这栋楼各家大概的作息
    reputation: 楼里出了事会先来敲你门的那种人
  合租室友:
    identity: 同一套房子里分摊房租的室友
    baseline: 水电都平摊了这么久，私事却今晚才算真的开口。
    resources:
      - 一份两个人共同签的租约
      - 客厅里那件说不清归属的旧物
    reputation: 从不拖房租、也从不越界的那一任室友
  司机:
    identity: 今晚专门为她开车的司机
    baseline: 行程单还没结束，后视镜里她的脸色比上车时更差。
    resources:
      - 一辆今晚归你开的车
      - 一条只送到门口的规矩
    reputation: 嘴严、稳、从不问去向的司机
  保镖:
    identity: 贴身跟着她的随行保镖
    baseline: 你的职责是离她三步以内，今晚这三步格外难站。
    resources:
      - 今晚的通行权限和一只耳麦
      - 她亲口交代过的两条禁忌
    reputation: 出过事也扛下来了的雇员
  债主:
    identity: 握着她欠条的人
    baseline: 账是账，人是人，今晚坐在你对面的偏偏两样都是。
    resources:
      - 一张按了手印的欠条
      - 她还款记录里对不上的那一笔
    reputation: 讲规矩、也给过宽限的债主
  初次见面的网友:
    identity: 聊了很久、今晚才第一次见面的网友
    baseline: 声音和头像都对上了，坐在对面的真人反而陌生。
    resources:
      - 几个月攒下的聊天记录
      - 一个你们都还在的线上小圈子
    reputation: 网上说话算数、线下第一次赴约的那个人
  前任:
    identity: 分手多年后重新坐在她对面的人
    baseline: 身体和习惯都还记得，身份却已经没了，一切要重新谈。
    resources:
      - 一把她一直没换的旧钥匙
      - 对她过去这些年的完整见证
    reputation: 分得体面、也没在外人面前说过她坏话的那一任
  上司:
    identity: 她的直属上级，今晚在场外碰上
    baseline: 白天的职权不带进这扇门，你知道她也在看你懂不懂这一点。
    resources:
      - 一张能给她调休的签字权
      - 对她绩效的正式评价权
    reputation: 从不占用下属私人时间的上级
  下属:
    identity: 今晚被她叫来帮忙的下属
    baseline: 事情早办完了，你没有起身，她也没有赶你走。
    resources:
      - 一门她离不开的手艺
      - 今晚帮她跑腿攒下的情分
    reputation: 办事妥帖、从不多嘴的下属
  竞争者:
    identity: 和她争同一个位置的对手
    baseline: 白天你们各自报价，今晚却坐在同一张桌子边。
    resources:
      - 一份和她方案对着打的标书
      - 她方案里的一个漏洞
    reputation: 输赢都认、不玩阴的那一个
  相亲对象:
    identity: 家里安排的相亲对象，第一次见面
    baseline: 双方都被介绍人夸张过，今晚是第一次核对真实版本。
    resources:
      - 介绍人那边的双重背书
      - 一个可以体面退出的台阶
    reputation: 条件拿得出手、也不勉强人的相亲对象
  担保人 / 连带责任人:
    identity: 在她的欠条上副署过的人
    baseline: 签字画押的那份担保协议今晚就要逾期，对方若倒下，账单直接转到你名下。
    resources:
      - 一份有双方签字的补充连带担保协议
      - 查验主债务执行进度的优先知情通道
    reputation: 讲信用替人兜底、但绝不会任人当替罪羊
  知情不报者:
    identity: 撞破核心秘密却至今保持沉默的知情人
    baseline: 你掌握足以推翻她一切体面的证据，今晚她需要确认你的沉默是有价还是出于私心。
    resources:
      - 未曾公开的关键对话截屏或纸质凭证
      - 一条还没转发给任何人的聊天记录
    reputation: 嘴极严、但一旦被逼到绝境会毫无保留交底
  前雇主 / 被辞退者:
    identity: 被辞退、交接还没做完的前员工
    baseline: 离职补偿与交接清单还在桌上，白天未结清的恩怨今夜必须有个私下交代。
    resources:
      - 一份带有保密条款但尚未归档的离职协议
      - 你离职前经手未平账目的备份底单
    reputation: 办事按章程清算，离开后互不亏欠
  深夜接单的代驾:
    identity: 深夜接单、送人到门口的代驾
    baseline: 车门一关就是移动的密室，你见识了她最狼狈的失态，车程结束前谁也不能下车。
    resources:
      - 一辆随时能调头或熄火的运营车辆
      - 刚才私密行程的路线录音与起点终点记录
    reputation: 见多识广、收钱办事、从不多嘴过问
  房东 / 催租人:
    identity: 握有房屋产权与驱逐权力的房东
    baseline: 拖欠的房租与水电账单已经到了最后宽限日，今晚不开门就只能按规矩换锁。
    resources:
      - 一串能打开所有防盗门的备用钥匙总串
      - 一份随时可以向派出所或中介提交的腾房通知
    reputation: 按时收租不讲情面、但也曾给过周转宽限
  共同遗产继承人:
    identity: 被同一份遗嘱绑定的法定继承人
    baseline: 公证处里签字的墨迹还没干，不把份额划清楚，今晚谁也拿不到解冻资金。
    resources:
      - 一份盖有公证处印章的遗嘱执行草案
      - 掌握老宅或遗产底细的独家线索
    reputation: 守着家族底线、寸土不让
  避难所检疫员:
    identity: 避难所入口处手握体温枪与验伤签章权的检疫员
    baseline: 伤口与感染判定全凭你一笔写定，今晚坐在你对面的正是刚从沦陷区撤回的她。
    resources:
      - 一枚能免去今晚强制隔离的绿色通行印章
      - 锁在检疫抽屉里的三支应急抑制作剂
    reputation: 按章办事铁面无私、但深知隔离区内幕的人
  搜刮队搭档:
    identity: 与她多次在废墟与尸潮中互相掩护的生死搭档
    baseline: 后背交托过无数次，但今晚她带回来的背包里有未曾上缴的秘密。
    resources:
      - 一支装满子弹且未登记的防身手枪
      - 标注了沦陷区三处隐蔽安全屋的盲图
    reputation: 枪法准、从不抛弃搭档、在废墟里能活下来
  黑市药贩:
    identity: 掌控地下避难所紧缺药品与消杀物资的倒爷
    baseline: 只要筹码给够，抗生素、消炎针或止痛片今夜都能送到她手里。
    resources:
      - 避难所内未开封的抗生素与无菌缝合包
      - 一条直通营地通风管道的秘密运货暗道
    reputation: 认货不认人、但承诺过的药绝不掺假
  动力舱维修工:
    identity: 负责掌控地下避难所发电机与液压防爆门的机械工
    baseline: 掌上的机油茧是你的资历；防爆门一旦锁死就是两个世界，今晚她能否安全回舱，开关在你手里。
    resources:
      - 一把能手动开启外层泄压闸门的应急扳手
      - 地下供电主线路的控制图纸与备用电瓶
    reputation: 手艺硬、停电时最靠得住的人
  合租青梅竹马:
    identity: 从小一起长大、熟知彼此全部黑历史的同乡合租人
    baseline: 签过合租守则却在同一个屋檐下朝夕相对，今晚关上房门，谁也不肯先挑破当年的旧誓言。
    resources:
      - 一本记录着对方所有喜好与软肋的旧日记本
      - 这套两居室唯一一把不分里外房门的主钥匙
    reputation: 嘴硬但极度护短、比任何人都了解她
  战队专属战术分析师:
    identity: 掌握战队数据底牌与队员状态命脉的首席分析师
    baseline: 屏幕上的每一秒操作都在你眼里；今晚复盘室只剩两个人，她的职业前途与软弱全压在你手边。
    resources:
      - 俱乐部未加密的战术训练原始录像与数据报表
      - 明日出场名单战术BP的最终否决建议权
    reputation: 洞察敏锐、极度理智、战队背后的操盘手
  公会契约使魔:
    identity: 与她缔结了主从/生命连接契约的独行使魔
    baseline: 契约纹样连通着两人的体温与感知；魔力一旦告急，必须由你借由身体接触完成稳定与补给。
    resources:
      - 锁骨处时刻感应她心跳与魔力状态的契约印记
      - 能够吸收并过滤狂暴魔力杂质的异质体质
    reputation: 实力深不可测、唯独对契约主绝对服从
  同人社团原案脚本师:
    identity: 与她共同创立同人社团并操刀所有脚本的核心搭档
    baseline: 爆款本子里的每一个剧情与动作都是你写的；今晚在画桌前赶死线，灵感与现实正一寸寸重叠。
    resources:
      - 一份写满了私密互动分镜的原案脚本草稿
      - 同人展摊位与印刷厂加急通道的对接后台
    reputation: 文笔犀利、善于挑动情绪、社团的灵感中枢
