# 身份族 → 具体身份。只描述“凭什么能做什么”，不推导许可。
npc:
  侍奉与身契:
    - role: 私人宅邸的长期管家
      function: 管门禁、日程和主人不愿见光的安排
      authority: 宅门钥匙与用人调度
      resource: 一份不入账的访客记录
      limitation: 离开这栋宅子就没有署名权
      obligation: 对宅门内外的口风负责
      exposure: 一次外泄就能被立刻替换
      hidden: —
    - role: 契约佣人中介的履约监督
      function: 盯合同有没有被私下改成人身束缚
      authority: 中介牌照上的履约章
      resource: 能冻结一笔保证金的通道
      limitation: 不能越过委托人直接改约
      obligation: 把双方从人身条款里拉开
      exposure: 被写成“帮人卖身”会停业
      hidden: —
    - role: 私人游艇的乘务长
      function: 排航程、管舱房、把老板不想见的人挡在舷梯下
      authority: 全船舱房的钥匙总牌
      resource: 一本船长都不看的接待记录
      limitation: 船一靠岸，权限归零
      obligation: 船上见过的人与事不上岸
      exposure: 被写成老板的耳目，下一站就会被换掉
      hidden: —
    - role: 私人飞机的随机乘务
      function: 管舱内服务、盯行程保密、把不该进的舱门看好
      authority: 机主行程的知情人之一
      resource: 一份只留纸质的航程记录
      limitation: 航线不归她管，临时改道她第一个被问
      obligation: 机上见过的人和对话不带下飞机
      exposure: 被写成机主的情人，航司立即停飞她的班
      hidden: —
  成人行业与感官服务:
    - role: 会员制会所的场控
      function: 排场、挡酒、把不想续的客人送出门
      authority: 会所当晚的场次决定权
      resource: 一间不对外的休息隔间钥匙
      limitation: 会员投诉能让她当夜停班
      obligation: 保护在场人的匿名
      exposure: 实名流传会让她在这行消失
      hidden: —
    - role: 独立伴游经纪人
      function: 排档期、谈边界、不亲自上场
      authority: 几家会所还认的档期
      resource: 一份可作废的今晚档期
      limitation: 她管得了档期管不了客人的嘴
      obligation: 先把人安全送走再谈钱
      exposure: 被写成“拉皮条”会断所有口
      hidden: —
    - role: 绳缚艺术工作室的主理人
      function: 排演出、带教学、把安全规则盯得比谁都紧
      authority: 工作室课程与场次安排权
      resource: 一间镜墙练习室的备用钥匙
      limitation: 圈内对越界零容忍，一次投诉就除名
      obligation: 安全词一出口全场停，事后确认状态
      exposure: 被写成越界服务，行里再无立足
      hidden: —
    - role: 派对策划公司的氛围组组长
      function: 排节目、请演出、把越界的宾客拦在门外
      authority: 派对现场的流程叫停权
      resource: 一份没公开的当晚嘉宾名单
      limitation: 主办方一个电话就能换掉整组人
      obligation: 派对上看到的事不写成通稿
      exposure: 被写成组织灰色服务，公司直接查封
      hidden: —
  私密撮合与契约中介:
    - role: 不入台面的撮合掮客
      function: 安排见面、管保密、抽成但不提供服务
      authority: 两边都还愿意接她电话
      resource: 一间无录音默契的会面点
      limitation: 她撮合完就不能留在场里
      obligation: 把保密条款说到能签字
      exposure: 名单外流她会先被两边一起咬
      hidden: —
    - role: 私人契约起草人
      function: 把口头答应写成能认账的短契
      authority: 几家律师楼不愿接的私契她接
      resource: 一份尚未签字的短契草稿
      limitation: 没有公证权，只靠圈子认账
      obligation: 不把人身条款写进契约
      exposure: 草稿见光会被当成把柄贩子
      hidden: —
    - role: 高端相亲俱乐部的红娘顾问
      function: 筛会员、排见面、把条件里说不出口的部分先替双方讲了
      authority: 会员档案与匹配名单的经手权
      resource: 一份还没送出去的加急匹配申请
      limitation: 她只能牵线，双方答不答应都不归她管
      obligation: 双方的真实条件不互相透底
      exposure: 被写成撮合钱色交易，牌照和口碑一起没
      hidden: 自己的婚事就是当年在这家店里配成的
    - role: 会所之间的档期中间人
      function: 调场、调人、把撞车的局拆开
      authority: 几家场子都认她一句“今晚归我排”
      resource: 一本只有她自己看得懂的排期暗账
      limitation: 场子和客人两头都能绕开她
      obligation: 同一个晚上不卖给两家
      exposure: 名字出现在两边的账上就再也洗不清
      hidden: —
    - role: 代书遗赠的见证人
      function: 念条款、验意愿、把签字一场办完
      authority: 两名无利害见证人之一的签章
      resource: 一份还没生效的赠与清单副本
      limitation: 见证不能沾利害关系，沾一点就作废
      obligation: 立嘱人的真实意愿排在家属脸色前面
      exposure: 被写成操纵遗嘱，见证资历全毁
      hidden: —
  权力与治理:
    - role: 监管机构处长候选人
      function: 审材料、卡窗口、在评议会前把口径按住
      authority: 处内尚未被收回的签字权
      resource: 一份还没上报的健康与档案材料
      limitation: 评议会一翻材料她就可能出局
      obligation: 对机构名声负责
      exposure: 私人往来写成交易会结束仕途
      hidden: 对外说轮休，实际在躲一场审查
    - role: 街区办事处夜班值班长
      function: 盖夜间证明、拦不该上楼的人
      authority: 值班章与门禁临时名单
      resource: 一份今晚的访客白名单
      limitation: 晨会要核对夜间记录
      obligation: 邻里纠纷先按住再上报
      exposure: 私自放人进门会被停值班
      hidden: —
    - role: 规划委员会的评审专家
      function: 打分、画线、决定哪块地过不了会
      authority: 评审表上那一栏签名
      resource: 一份盖了章还没公示的调整图则
      limitation: 回避制度把她盯得很紧
      obligation: 评审意见终身可追溯
      exposure: 和申请人私下吃顿饭都会被写进举报信
      hidden: —
    - role: 驻外领馆的夜班领事
      function: 补证件、做笔录、把滞留的人捞回来
      authority: 紧急旅行证件的签发章
      resource: 一条直通国内值班室的加密线路
      limitation: 馆区之外她没有执法权
      obligation: 领区内的事不过夜，上报前不外传
      exposure: 私下帮忙写成徇私，外交生涯终结
      hidden: —
    - role: 区人大代表的新任秘书
      function: 写建议、跑调研、把群众来信分拣归类
      authority: 代表议案起草的第一稿
      resource: 一叠还没呈阅的实名联名信
      limitation: 她只是幕僚，署名的从来不是她
      obligation: 来信人的信息不出这间办公室
      exposure: 泄露一封联名信就断送整个代表团队
      hidden: —
    - role: 大学学生会会长
      function: 社团审批、风纪巡查、把各方利益协调在台面之上
      authority: 校内场地夜间使用批条与通宵活动审批权
      resource: 一份没对外公开的违纪处分拟定名单
      limitation: 导员和校领导随时能一票否决她的提名
      obligation: 维持学生领袖一丝不苟的榜样形象
      exposure: 私下在漫展做Coser被拍到会当场名誉扫地失去保研资格
      hidden: 严肃制服衬衫内，正穿着偷偷试穿的兔女郎战袍打底
  商业与产业:
    - role: 并购部董事总经理
      function: 推项目过会、接触托管与买方
      authority: 条线过会提案权
      resource: 一份能推翻项目时间线的材料拷贝
      limitation: 个人担保一旦见光签字权会被切掉
      obligation: 对客户与 LP 的隔离
      exposure: 流言能在立案前把她清出交易桌
      hidden: 对外坚称构陷，实际签过一笔过桥担保
    - role: 家族企业的运营总监
      function: 盯货、盯账、把股东吵嘴按到桌下
      authority: 还没被收回的采购与人事权
      resource: 一份对不上的进货副本
      limitation: 大股东一句话就能换人
      obligation: 先保工厂还在转
      exposure: 账目被写成私吞会株连家人
      hidden: —
    - role: 老字号食品厂的质检科长
      function: 抽样、留样、把不合格批次按在出厂之前
      authority: 出厂检验单上的否决栏
      resource: 一柜按日期锁好的留样
      limitation: 厂长有权组织复检推翻她
      obligation: 检验数据一个数都不能编
      exposure: 放行问题批次的字是她签的，她就完了
      hidden: —
    - role: 拍卖行的瓷器部主管
      function: 征集、估底价、把关真假上拍
      authority: 图录定稿前的最后一道除名权
      resource: 一件来历存疑已经撤拍的拍品
      limitation: 估价由她定，落槌价不由她
      obligation: 委托人的保留价烂在肚子里
      exposure: 被写成坐庄托价，职业生涯当场结束
      hidden: 左手食指有常年磕出来的旧茧
    - role: 跨境物流的清关主管
      function: 报关、押单、把卡在口岸的货捞出来
      authority: 一批老关系报关行还认的优先通道
      resource: 一份还没递交的更正报关单
      limitation: 政策一变，整条通道作废
      obligation: 单货相符这条线不能碰
      exposure: 帮人夹带的嫌疑一旦立案就出不去了
      hidden: —
    - role: 老当铺的坐堂朝奉
      function: 验货、开票、把死当的东西一件件归置上架
      authority: 柜台收与不收，一言而定
      resource: 一本记满抵账人名号的老账册
      limitation: 超过限期的死当，要东家点头才能动
      obligation: 客人当过什么，出了柜台就不认
      exposure: 被写成压价黑心，这块招牌就算黑了
      hidden: 账册里有几笔，是她偷偷垫钱续的死当
  学术与专业:
    - role: 独立声誉风险顾问
      function: 推迟爆料窗口，也能把反证送进该去的桌面
      authority: 几家媒体还肯卖她一个延迟
      resource: 一份尚未公开的内部备忘
      limitation: 延迟权只用一次就作废
      obligation: 不把材料卖给出价更高的人
      exposure: 被写成拿材料换人情会断所有口
      hidden: —
    - role: 成人教育学院的夜班讲师
      function: 带在职班、出证明、看住档案柜
      authority: 在职培训结业章
      resource: 档案柜的第二把钥匙
      limitation: 学院怕丑闻胜过怕她辞职
      obligation: 学员档案不外带
      exposure: 私会写成师生会让她立刻停课
      # 合规注记：本条目角色设定为明确成年人的在职培训关系（不占用 hidden 字段）。
      hidden: —
    - role: 实验室的晚间值班研究员
      function: 盯反应过夜、看数据、把异常及时喊停
      authority: 门禁系统里的最高级实验权限
      resource: 一组尚未写入报告的原始数据
      limitation: 论文署名轮不到值班的人
      obligation: 原始数据一个点都不许改
      exposure: 数据造假的名声足以终结学术生命
      hidden: —
    - role: 出版社的责任编辑
      function: 审稿、排期、把敏感章节标出来送审
      authority: 三审三校里她卡着中间那一审
      resource: 一本印好却暂缓上市的样书
      limitation: 终审权不在她手里
      obligation: 作者的书稿不经她手外流
      exposure: 提前泄露书稿要吃官司
      hidden: —
    - role: 执业十年的刑辩律师
      function: 会见、阅卷、把程序漏洞一个个堵上
      authority: 会见室里四十五分钟的单独谈话
      resource: 一卷检方还没整理完的证据清单
      limitation: 保密义务覆盖一切，包括对她不利的话
      obligation: 当事人的秘密带进坟墓
      exposure: 被写成教人翻供，执照就保不住
      hidden: —
    - role: 魔法公会前台主管
      function: 委托审核、魔力评级、把越级送死的冒险者拦在门外
      authority: 公会悬赏令印章与高阶禁区通行令
      resource: 一块记录全城魔力波动的共鸣水晶
      limitation: 公会规章严禁职员与雇佣兵私相授受
      obligation: 委托人秘密与报酬账目严守公立
      exposure: 私下调换高危委托会被骑士团当场拘禁
      hidden: 魔力核心受损，每逢月圆夜必须靠特定身体接触汲取体温与魔力
  秩序与执法:
    - role: 经侦支队的夜班主办
      function: 收材料、做笔录、决定今晚要不要惊动上级
      authority: 还在自己手里的立案建议
      resource: 一份尚未入卷的聊天记录
      limitation: 上级要她把人“请去协助”
      obligation: 程序走完才能放人
      exposure: 私了写成包庇会摘警号
      hidden: —
    - role: 社区辅警值班
      function: 巡楼、劝离、做夜间登记
      authority: 值班对讲与楼栋钥匙
      resource: 一份今晚的异常开门记录
      limitation: 她没有立案权
      obligation: 先把人劝走再上报
      exposure: 漏登一次会被停班
      hidden: —
    - role: 看守所的夜班管教
