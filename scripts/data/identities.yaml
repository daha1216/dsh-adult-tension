      limitation: 骑士誓约不可违背，一旦除名无处容身
      obligation: 先护平民，再执军令
      exposure: 违纪丑闻会彻底砸碎骑士团最后一点声誉
      hidden: 严谨肃穆的铠甲之下，对被解开束缚有着难以启齿的渴求
  艺术与传播:
    - role: 财经公号的责编
      function: 定上线、改标题、把稿压到明天或提前
      authority: 后台排期的最后确认
      resource: 一篇已排未发的稿
      limitation: 上面的人能绕过她直接点发布
