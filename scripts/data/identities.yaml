      exposure: 后台私情写成班社丑闻，招牌就砸了
      hidden: 嗓子其实已经伤了，撑完这一季就想退
    - role: 独立厂牌的经纪人
      function: 谈场次、护艺人、把合同里的坑一个个填平
      authority: 旗下艺人的商务否决权
      resource: 一份还没官宣的巡演计划
      limitation: 艺人红了随时可能跳槽
      obligation: 艺人的私生活挡在合同谈判之外
      exposure: 被写成包装炒作情人关系，旗下艺人全跑
      hidden: 十年前，她自己就是被雪藏的那一个
    - role: 知名同人志画师
      function: 脚本分镜、原稿赶工、把私密幻想画进限售新刊
