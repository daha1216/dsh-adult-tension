# 身份族 → 具体身份。只描述“凭什么能做什么”，不推导许可。
npc:
  侍奉与身契:
    - role: 私人宅邸的长期管家
      function: 管门禁、日程和主人不愿见光的安排
      authority: 宅门钥匙与用人调度
      resource: 一份不入账的访客记录
      limitation: 离开这栋宅子就没有署名权
      obligation: 对宅门内外的口风负责
      exposure: 一次外泄就能被立刻替换
      hidden: —
    - role: 契约佣人中介的履约监督
      function: 盯合同有没有被私下改成人身束缚
      authority: 中介牌照上的履约章
      resource: 能冻结一笔保证金的通道
      limitation: 不能越过委托人直接改约
      obligation: 把双方从人身条款里拉开
      exposure: 被写成“帮人卖身”会停业
      hidden: —
  成人行业与感官服务:
    - role: 会员制会所的场控
      function: 排场、挡酒、把不想续的客人送出门
      authority: 会所当晚的场次决定权
      resource: 一间不对外的休息隔间钥匙
      limitation: 会员投诉能让她当夜停班
      obligation: 保护在场人的匿名
      exposure: 实名流传会让她在这行消失
      hidden: —
    - role: 独立伴游经纪人
      function: 撮时间、谈边界、不亲自上场
      authority: 几家会所还认的档期
      resource: 一份可作废的今晚档期
      limitation: 她管得了档期管不了客人的嘴
      obligation: 先把人安全送走再谈钱
      exposure: 被写成“拉皮条”会断所有口
      hidden: —
  私密撮合与契约中介:
    - role: 不入台面的撮合掮客
      function: 安排见面、管保密、抽成但不提供服务
      authority: 两边都还愿意接她电话
      resource: 一间无录音默契的会面点
      limitation: 她撮合完就不能留在场里
      obligation: 把保密条款说到能签字
      exposure: 名单外流她会先被两边一起咬
      hidden: —
    - role: 私人契约起草人
      function: 把口头答应写成能认账的短契
      authority: 几家律师楼不愿接的私契她接
      resource: 一份尚未签字的短契草稿
      limitation: 没有公证权，只靠圈子认账
      obligation: 不把人身条款写进契约
      exposure: 草稿见光会被当成把柄贩子
      hidden: —
  权力与治理:
    - role: 监管机构处长候选人
      function: 审材料、卡窗口、在评议会前把口径按住
      authority: 处内尚未被收回的签字权
      resource: 一份还没上报的健康与档案材料
      limitation: 评议会一翻材料她就可能出局
      obligation: 对机构名声负责
      exposure: 私人往来写成交易会结束仕途
      hidden: 对外说轮休，实际在躲一场审查
    - role: 街区办事处夜班值班长
      function: 盖夜间证明、拦不该上楼的人
      authority: 值班章与门禁临时名单
      resource: 一份今晚的访客白名单
      limitation: 晨会要核对夜间记录
      obligation: 邻里纠纷先按住再上报
      exposure: 私自放人进门会被停值班
      hidden: —
  商业与产业:
    - role: 并购部董事总经理
      function: 推项目过会、接触托管与买方
      authority: 条线过会提案权
      resource: 项目时点的反证拷贝
      limitation: 个人担保一旦见光签字权会被切掉
      obligation: 对客户与 LP 的隔离
      exposure: 流言能在立案前把她清出交易桌
      hidden: 对外坚称构陷，实际签过一笔过桥担保
    - role: 家族企业的运营总监
      function: 盯货、盯账、把股东吵嘴按到桌下
      authority: 还没被收回的采购与人事权
      resource: 一份对不上的进货副本
      limitation: 大股东一句话就能换人
      obligation: 先保工厂还在转
      exposure: 账目被写成私吞会株连家人
      hidden: —
  学术与专业:
    - role: 独立声誉风险顾问
      function: 推迟爆料窗口，也能把反证送进该去的桌面
      authority: 几家媒体还肯听她延迟
      resource: 一份尚未公开的内部备忘
      limitation: 延迟权只用一次就作废
      obligation: 不把材料卖给出价更高的人
      exposure: 被写成拿材料换人情会断所有口
      hidden: —
    - role: 成人教育学院的夜班讲师
      function: 带在职班、出证明、看住档案柜
      authority: 在职培训结业章
      resource: 档案柜的第二把钥匙
      limitation: 学院怕丑闻胜过怕她辞职
      obligation: 学员档案不外带
      exposure: 私会写成师生会让她立刻停课
      # 合规注记：本条目角色设定为明确成年人的在职培训关系（不占用 hidden 字段）。
      hidden: —
  秩序与执法:
    - role: 经侦支队的夜班主办
      function: 收材料、做笔录、决定今晚要不要惊动上级
      authority: 还在自己手里的立案建议
      resource: 一份尚未入卷的聊天记录
      limitation: 上级要她把人“请去协助”
      obligation: 程序走完才能放人
      exposure: 私了写成包庇会摘警号
      hidden: —
    - role: 社区辅警值班
      function: 巡楼、劝离、做夜间登记
      authority: 值班对讲与楼栋钥匙
      resource: 一份今晚的异常开门记录
      limitation: 她没有立案权
      obligation: 先把人劝走再上报
      exposure: 漏登一次会被停班
      hidden: —
  艺术与传播:
    - role: 财经公号的责编
      function: 定上线、改标题、把稿压到明天或提前
      authority: 后台排期的最后确认
      resource: 一篇已排未发的稿
      limitation: 上面的人能绕过她直接点发布
      obligation: 事实未核完不能点
      exposure: 被写成收钱压稿会丢所有平台
      hidden: —
    - role: 剧院签约主演
      function: 撑今晚的场、挡酒、把经纪人拦在门外
      authority: 合同里的拒演条款还没被用过
      resource: 一间锁得上的化妆间
      limitation: 金主在今晚的包厢里
      obligation: 散场前不能消失
      exposure: 后台私情写成交易会毁下季合同
      hidden: —
  医疗与照护:
    - role: 社区诊所夜班医生
      function: 看急诊、压化验、写值班记录
      authority: 执业证与值班章
      resource: 化验单延迟出结果的窗口
      limitation: 晨会要核对夜间记录
      obligation: 病人隐私止于门内
      exposure: 漏记一次可被停值班
      hidden: —
    - role: 私立疗养院责任护士
      function: 盯体温、挡探视、把病历先压一晚
      authority: 本层夜班的给药与探视名单
      resource: 一份还没上报的体征记录
      limitation: 主任查房会翻记录
      obligation: 先把人稳住再谈出院
      exposure: 私改记录等于丢执照
      hidden: —
  地下与灰色地带:
    - role: 过桥资金的私下对接人
      function: 谈时点、不经手现金、把风声按住
      authority: 两边还认的旧渠道
      resource: 一段能证明她拒绝走账的录音
      limitation: 渠道一断她就只剩这张嘴
      obligation: 不把客户户拿去填窟窿
      exposure: 被写成掮客会先被自己人卖
      hidden: —
    - role: 夜摊档口的实际老板
      function: 看场、放账、把不想惹的人劝走
      authority: 这条巷子还买她的面子
      resource: 一本不入账的人情册
      limitation: 城管和黑白两边都能停她的档
      obligation: 先把今晚的场子保住
      exposure: 册子见光会牵出一串人
      hidden: —
  家族与继承:
    - role: 老宅的未过户继承人
      function: 守宅、挡远亲、决定今晚谁能进门
      authority: 钥匙还在她手里，房产证不在
      resource: 一份尚未公证的旧遗嘱复印件
      limitation: 族里长辈能联名赶她走
      obligation: 先把宅子留到天亮
      exposure: 私会写成夺产会让公证更难
      hidden: —
    - role: 家族基金会的执行董事
      function: 批小额、挡大额、把丑闻按在会前
      authority: 小额支付的临时权限
      resource: 一份会让董事会炸的旧账摘要
      limitation: 大额必须过会
      obligation: 基金会名字不能上社会新闻
      exposure: 私用章等于自己请辞
      hidden: —
  服务与手艺:
    - role: 上门钟表修理师
      function: 修旧件、看门路、把不该拆的后盖合上
      authority: 几户老宅还只认她上门
      resource: 一把能开这栋侧门的旧钥匙（主人给过）
      limitation: 她是被请来的，不是主人
      obligation: 修完就走，不翻抽屉
      exposure: 被写成顺手牵羊会断所有老客户
      hidden: —
    - role: 夜班面馆的主厨
      function: 撑夜市、记账、把熟客的口风听进后厨
      authority: 后厨与夜账
      resource: 一碗还热着的面和后厨的后门
      limitation: 房东能随时收铺
      obligation: 今晚的客人要能安全离开
      exposure: 后厨藏人写成窝点会封门
      hidden: —

player:
  同侪:
    identity: 同一条线里的对口人
    baseline: 和她吃同一行饭，今晚却不能把话说满。
    resources:
      - 一份今晚还能用的内部口径
      - 能把人从走廊里拉开的熟路
    reputation: 圈子里认的是说话算数
  旧识:
    identity: 多年没见的旧识，今晚才重新碰上
    baseline: 还记得她从前怎么把场面撑住，也记得自己没资格替她做决定。
    resources:
      - 一段只有两个人知道的旧事
      - 一个今晚还能接通的共同熟人
    reputation: 从前靠得住，现在不知道还算不算
  外来者:
    identity: 外请来处理一件事的人
    baseline: 这地方的规矩不是你的；你只对自己接的这一单负责。
    resources:
      - 一份只对你有效的临时通行证
      - 办完就能走的退路
    reputation: 办完事就消失的外援
  平级合作:
    identity: 联合项目的对口人
    baseline: 你们今晚必须交出一个共同口径，谁也不比谁高一级。
    resources:
      - 一半还没合并的材料
      - 能把会议推迟一格的窗口
    reputation: 合作过就很难装不认识
  被求助者:
    identity: 她今晚来找的人
    baseline: 你能推迟、能作证、能把门关上，但不因此握着她的把柄。
    resources:
      - 一个还能改走向的窗口
      - 一份她不知道你有没有的材料
    reputation: 找上门的人最后多半认你一句
  服务提供者:
    identity: 今晚被请来做事的专业人士
    baseline: 你的职责止于把这件事做完；她不是你的客户以外的身份。
    resources:
      - 职业所需的工具与许可
      - 一份今晚的服务记录
    reputation: 把活做完、不多问
  远房亲戚:
    identity: 远房亲戚，血统比交情近
    baseline: 亲戚这个词今晚不够用，但足够让你走进这扇门。
    resources:
      - 族里还认的一个称呼
      - 一张能证明关系的旧照片
    reputation: 不上桌也赶不走的远亲
  临时共处:
    identity: 今晚才碰上、暂时走不了的人
    baseline: 你们本来不必说话；门关了之后才变成必须说话。
    resources:
      - 一张回不去的票或过期的末班
      - 对这间屋子临时的合法停留
    reputation: 谁也不欠谁，除非今晚开口
