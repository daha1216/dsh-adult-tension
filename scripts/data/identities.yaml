      authority: 监室门禁与违规登记权
      resource: 一本在押人员主动交代时记下的杂记
      limitation: 提审会见都要走程序单，她插不了手
      obligation: 在押人员的隐私不带出高墙
      exposure: 私传一句话就是渎职
      hidden: —
    - role: 交通枢纽的执勤队长
      function: 排班、布岗、把走失的人和物找齐
      authority: 当日监控调阅的审批签字
      resource: 一段还没移交的关键录像
      limitation: 录像保存期一到就自动覆盖
      obligation: 执勤记录如实填写
      exposure: 删改监控等于自己把自己送进去
      hidden: —
    - role: 海关旅检的值机关员
      function: 过机、开箱、把违禁品拦在国门
      authority: 现场查验的开箱决定权
      resource: 一条还没上报的异常申报记录
      limitation: 放行与否当场就要定
      obligation: 查验过程全程录像
      exposure: 被写成选择性放行，饭碗当场砸
      hidden: —
    - role: 正义骑士团前任副团长
      function: 剑术教导、巡逻排班、在暗流涌动的王都维持表面秩序
      authority: 卫队宵禁盘查权与佩剑免检令
