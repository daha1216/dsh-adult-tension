meta:
  daily_opening:
    核心规则:
    - 邻里互相照应
    - 体面靠自己撑
    - 礼数大于实话
    - 承诺出口即作数
    社会规则:
    - 行会自治
    - 人情网络优先
    - 闲话止于门内
    - 陌生地方暂时不追问来处
    张力引擎:
    - 情感拉扯
    - 对等试探
    - 旧情重逢
    场景动作:
    - 先开口叫名字
    - 教一个动作
    - 递纸巾
    - 递外套
    - 让出座位
    - 接住掉落的东西
    - 邀请留下
    - 把热的那份推过来
    - 递一盏刚沏的茶
    处境:
      共处一室:
        trigger: '{npc}正做着手边的小事，见你进来，把旁边的位置让了出来。'
        objective: 按自己的步调做完手边的事，听听你的来意。
        choice: 先打个招呼，还是问问她正在做什么。
        immediate: 一件小事成了交谈的起点。
        near: 有兴致可以继续聊，也可以各自忙碌。
      今夜话没说完:
        trigger: '{npc}又想起刚才的话题，带着笑意问你要不要接着聊。'
        objective: 把感兴趣的话题聊完，不急着得出结论。
        choice: 接着刚才那一句，还是谈谈你的经历。
        immediate: 交谈可以随着双方的兴趣展开。
        near: 没有说完的部分留待下次也无妨。
      谁也不欠谁:
        trigger: '{npc}做完自己的事，顺手向你打了个招呼。'
        objective: 不带交换条件地相处一会儿。
        choice: 聊聊各自的近况，还是一起做件小事。
        immediate: 双方都不必为这次见面承担额外责任。
        near: 见面是否延续，由两人的回应决定。
      旧情未了:
        trigger: '{npc}认出了你，目光停了一瞬，随后问起你的近况。'
        objective: 了解彼此现在的生活，不急着处理过去。
        choice: 说说近况，还是提起一段共同记忆。
        immediate: 重逢可以先从普通的问候开始。
        near: 旧事可以慢慢谈，也可以暂时不提。
      寻亲有果:
        trigger: '{npc}带来了亲人平安的消息，想同你分享这份轻松。'
        objective: 分享好消息，聊聊接下来想做的事。
        choice: 问问重逢的经过，还是陪她坐一会儿。
        immediate: 好消息让眼前的交流多了一点喜悦。
        near: 后续安排可以另择时间商量。
      退役重逢第一夜:
        trigger: '{npc}卸下了过去的职责，重逢时先聊起最近的新爱好。'
        objective: 享受久违的空闲，了解对方的近况。
        choice: 聊聊新爱好，还是一起试一件以前没空做的事。
        immediate: 重逢不必伴随新的任务。
        near: 彼此可以按照现在的节奏重新熟悉。
