# 开局素材池（数据本体）。由 scripts/roll_opening.py 读取，增删条目即生效。
# 契约：
# 1. 三张分组表（时代与地点/场景动作/玩家化身轴）的组名是固定键，不可改名；
# 2. meta 节是按名引用的行为开关：杠杆引擎禁叠名单、玩家上位禁配处境名单、
#    写实门控名单、死线名单（timed_situations/timed_pressures：命中即给 near 事件
#    配 8 小时死线）、身份族抽取权重（没配权重的族按 8 计）；
# 3. 改完跑 python scripts/check_content.py 体检；内容指纹测试会随任何改动报警，
#    属故意改动时按测试输出更新指纹即可；
# 4. meta.location_eras 是地点→配套时代的和解名单（按名引用）：抽到的地点若只在其名单
#    时代成立，时代让路重抽；玩家预锁/自拟值不让路。今后新增时代专属地点必须同步入表
#    （漏登不报错，靠体检与测试兜底）；
# 5. 人称政策：非交易靠近桶与各文案模板的句面以「她」指主 NPC 为默认（与 {npc} 替换
#    同理），同性局由模型按同一动作转写代词，系有意设计，不改池面文字。
