# 开局文案模板（数据本体）。由 scripts/fill_opening.py 读取，改文案即改开局戏味。
# 契约：
# 1. 字串里的 {npc} 会在生成时替换为主 NPC 姓名；
# 2. situation_beats 每种处境五键齐全（trigger/objective/choice/immediate/near）；
#    池子里有处境而这里没有模板时，开局会静默套用「今夜话没说完」的通用模板——
#    check_content 会把这种情况报为 ERROR；
# 3. pressure_response 每项四句，按压力低/中/高/临界的顺序排列；
# 4. near_beats / trade_beats 的键与 pools.yaml 场景动作两桶对应，缺句式有兜底（WARNING）。
near_beats:
  递上一杯酒: '{npc}把杯子推到你手边，指节还没收回去。'
  约在午夜: '{npc}看了一眼时间，像是在确认你是不是真的会留下来。'
  请求庇护: '{npc}把门在身后合上，没说求你，只是没再去拉门把。'
  试探底线: '{npc}问了一句不该问的，声音轻，眼睛没躲开。'
  递外套: '{npc}把外套搭在椅背上，没看你，正等你开口。'
  让出座位: '{npc}把身边的位置空出来，自己坐得更直了一点。'
  承认紧张: '{npc}先承认自己手是凉的，然后把那句话吞回去一半。'
  邀请留下: '{npc}说你可以再坐一会儿，语气不像客套。'
  问一句不该问的: '{npc}问出口又停住，等你决定要不要接。'
  把灯调暗: '{npc}把灯调暗了一档，没有解释。'
  把伞让过去: '{npc}把伞柄转过来对着你，自己的袖口还是湿的。'
  先开口叫名字: '{npc}先叫了你的名字，叫完又像后悔。'
  分享一只耳机: '{npc}把一只耳机递过来，另一只还挂在她自己耳边。'
  递纸巾: '{npc}把纸巾递过来，指尖比话先到。'
  留一盏灯: '{npc}给你留了一盏灯，自己坐在灯照不到的地方。'
  接住掉落的东西: '{npc}伸手接住你碰掉的东西，递回来时多停了一拍。'
  教一个动作: '{npc}把动作放慢示范了一遍，停下来等你试。'
  把热的那份推过来: '{npc}把还热着的那份推到你面前，说自己不饿。'
  陪你等末班车: '{npc}陪你站在末班车的站牌下，没提自己也回不去。'
  替你挡下一通电话: '{npc}把你响个不停的手机扣在掌心，问你能不能先不接。'
  替她挽一次发: '{npc}把发簪取下来交到你手里，背过身去等你。'
  递一盏刚沏的茶: '{npc}双手把茶盏推过来，杯沿的热气还没散。'
  教她一个身段: '{npc}抬起你的手腕摆了个位置，手指比话先到。'
  为她描一次眉: '{npc}闭上眼，把眉笔递到你手里，肩膀松了半寸。'
  替她系松开的盘扣: '{npc}转过来让你替她系那颗盘扣，呼吸停在扣眼上。'
  借她一本书: '{npc}把书递过来，扉页夹着的笺露出半张。'
  雨里把伞偏过去: '{npc}看着伞往她那边斜，自己半个肩膀淋着没说话。'
  对弈时让半子: '{npc}看出你让了棋，落子慢下来，等你自己认。'
trade_beats:
  递出一份文件: '{npc}把文件推到你面前，手指按在封面上不放。'
  开出一句价码: '{npc}报了一个数，然后等你决定这是不是今晚的话题。'
  要求一个答复: '{npc}要一个今晚就能用的答复，自己先把后路挡住。'
  当面质问: '{npc}把那句话问到你脸上，随即像是准备好听你拒绝。'
  提出交易: '{npc}把请求说成一单交易，报价的时候没看你的眼睛。'
  出示证据: '{npc}把证据放上桌，盖子还没打开。'
  给出最后期限: '{npc}把期限说清楚，然后把选择权推到你这边。'
  当面摊牌: '{npc}把今晚能说的那一层摊开，停在你能接的地方。'
  递出一支笔: '{npc}把笔搁在纸上推过来，说签了今晚就两清。'
  交出一样东西: '{npc}把那样东西放到你面前，手还没从上面拿开。'
  提出一场对赌: '{npc}提出赌一局定输赢，赌注等你来开。'
  摆出两个选项: '{npc}把两条路摆到你面前，说今晚只能选一条。'
action_fallback_near: '{npc}停在你能接话的距离里，等你先动。'
action_fallback_trade: '{npc}把今晚能用的那一层摊开，停在你能接的地方。'
situation_beats:
  债务压身:
    trigger: 债的时点已经压到这个房间里，{npc}还不肯把求助说成求助。
    objective: 把今晚能挪的窗口用上，同时不把人身写进还款。
    choice: 把数额摊开换对方出手，还是自己再扛一晚。
    immediate: 今晚谈不成，催的人会把故事写成既成事实。
    near: 债务会从私域转到能见光的地方。
  时限临门:
    trigger: 期限已经近到能听见，{npc}带着未说完的话出现在这里。
    objective: 在期限前拿到一个能用的结果，不把今夜写成求饶。
    choice: 把底牌摊开，还是只给一半、自己扛剩下的。
    immediate: 期限一过，今晚的窗口就关了。
    near: 外面的人会按他们的版本收场。
  秘密将破:
    trigger: 那件不该外传的事正在往外渗，{npc}来确认你站哪边。
    objective: 把泄露按住，同时决定对你说多少。
    choice: 把秘密的核心交出来，还是只承认皮。
    immediate: 秘密一旦成形，解释权就不在她手里。
    near: 知情的人会开始各自要价。
  旧事上门:
    trigger: 旧事没被邀请就进了门，{npc}必须决定今晚认不认。
    objective: 把旧账从当前场面上隔开，又不装失忆。
    choice: 把当年的那一截说完，还是只处理眼前。
    immediate: 旧事被第三者讲出去会更难听。
    near: 旧人会顺着今晚的缝再来一次。
  权力易手:
    trigger: 位置正在换人，{npc}今晚必须确定你还认不认她。
    objective: 在交接完成前保住还能用的权限。
    choice: 把未完成的权交出来换平安，还是硬撑到天亮。
    immediate: 权一交出去，今晚的话就作废。
    near: 新来的人会按对自己有利的版本改记录。
  名声危机:
    trigger: 名声已经开始裂，{npc}来找还能改走向的人。
    objective: 推迟或改写那篇即将成形的说法。
    choice: 用证据硬刚，还是用延迟换一夜。
    immediate: 说法一落地，她的位置会先于事实被收走。
    near: 圈子会把传闻当成已经核过的结论。
  资源断供:
    trigger: 原来靠得住的那条供给断了，{npc}必须另找今晚能用的。
    objective: 先接上能撑过今夜的那一截。
    choice: 接受带条件的替代，还是空着手离开。
    immediate: 断供会让她在天亮前失去行动能力。
    near: 替代来源会把人情做成长期条款。
  关系僵局:
    trigger: 话在喉咙里卡了太久，{npc}和你被关在同一个未决里。
    objective: 让今晚至少有一句是真的。
    choice: 先把僵局说破，还是继续用场面话垫着。
    immediate: 再拖一夜，关系会从僵变成断。
    near: 旁人会按他们看见的版本传。
  审查将至:
    trigger: 审查材料的时点已定，{npc}来确认缺页会不会先被你看见。
    objective: 在翻检前把能对上的时点对上。
    choice: 把缺的那一页交出来，还是赌他们翻不到。
    immediate: 审查开始后她不能再改口。
    near: 材料会被写成她自己的问题。
  晋升窗口:
    trigger: 窗口只开这一次，{npc}必须决定今晚把谁算进自己这边。
    objective: 让窗口还认她，同时不欠下一笔说不清的人情。
    choice: 把把柄式的帮助拒掉，还是先过了这关再算。
    immediate: 窗口一关，她会停在现在的位置上。
    near: 竞争的人会用今晚的私会做文章。
  流言缠身:
    trigger: 闲话已经传了三道弯，{npc}带着能对上的时间线出现。
    objective: 让今晚至少有一个人核过她的版本。
    choice: 把完整时间线摊开，还是只否认那一层最脏的。
    immediate: 流言写成稿，她会先被清出场。
    near: 第三方会把私域压力转到公域。
  身体透支:
    trigger: 身体已经先一步撑不住，{npc}还在用程序和场面话挡。
    objective: 撑过今晚必须做完的那一件，同时不让记录先把她卖了。
    choice: 承认自己需要留下，还是把人请走自己硬扛。
    immediate: 再撑一次会在不该倒的地方倒。
    near: 体检或记录会把今晚的硬撑写成把柄。
  旧情未了:
    trigger: 旧情没被邀请就坐到对面，{npc}必须决定今晚认哪一层。
    objective: 把未说完的那句处理到能出门的程度。
    choice: 承认还在意，还是把今夜严格做成路过。
    immediate: 这句话不落地，出门后会更难开口。
    near: 旁人会把你们重新写成一对。
  共处一室:
    trigger: 门关了，外面暂时走不了，{npc}和你必须把今夜怎么过说清楚。
    objective: 先把共处的规矩说成双方都能退出的。
    choice: 承认这间屋子今晚只剩你们，还是继续装成过路。
    immediate: 规矩不说，靠近和拒绝都会被误解。
    near: 天亮之前还会有人来敲门。
  今夜话没说完:
    trigger: 那句话只说了一半，{npc}停在你能接的地方。
    objective: 把没说完的那句接到一个可退出的位置。
    choice: 让她说完，还是你先把场面转开。
    immediate: 这句话被第三者接走会变质。
    near: 未说完的部分会在下次见面变成质问。
  谁也不欠谁:
    trigger: 账面上谁也不欠谁，可{npc}还站在这里，显然有未决。
    objective: 确认今晚不是来结旧账的，同时把真正的未决问出口。
    choice: 把“不欠”当成可以离开的理由，还是当成可以靠近的理由。
    immediate: 谁先开口谁像在认软。
    near: 第三人会按有交易的版本传。
  无处可归:
    trigger: 今晚她没有能回去的地方，{npc}把这句说成了顺路。
    objective: 找一个能过夜、又不欠下人情的落点。
    choice: 接受你留她，还是去凑合那个凑合的地方。
    immediate: 天亮前她得有一个能锁门的落脚处。
    near: 借宿这件事会被传成另一个版本。
  婚约在身:
    trigger: 婚约按进程今晚必须有个说法，{npc}把戒指摘下来放进了口袋。
    objective: 把退或拖的决定权留在自己手里。
    choice: 承认心意，还是拿婚约当挡箭牌。
    immediate: 谁先松口，就得按对方家里的版本走。
    near: 两家人会把今晚拿去做文章。
  离城前夜:
    trigger: 行李已经打包，明天一早{npc}就要离开这座城市。
    objective: 把没说完的话和没还清的情都收个尾。
    choice: 承认舍不得，还是把告别做成路过。
    immediate: 过了今晚，有些话只能隔着时差说。
    near: 走的人会慢慢变成通讯录里的一个名字。
  两面将穿帮:
    trigger: 白天那副面孔里的人，今晚差点撞见夜里这个{npc}。
    objective: 把两个世界隔开，至少撑到天亮。
    choice: 向你交底其中一个世界，还是两边都瞒。
    immediate: 两边只要碰上一次，两个世界一起塌。
    near: 有人会拿另一个她当筹码。
  旧伤复发:
    trigger: 那处旧伤在最不该发作的今晚发作，{npc}还在用坐姿挡着。
    objective: 撑过必须撑过的场面，别让伤变成别人的把柄。
    choice: 承认撑不住留下来，还是硬撑到没人看见。
    immediate: 再硬撑一次，她会在人前直接倒下。
    near: 旧伤的来历会被翻出来当故事讲。
  家里在逼:
    trigger: 家里的电话今晚响到第三遍，{npc}按掉后把手机扣在桌上。
    objective: 把家里要的答复拖到自己能承受的版本。
    choice: 对你说实话，还是只把场面撑完。
    immediate: 电话再响，她今晚就得当场表态。
    near: 家里会按自己的想象替她安排好一切。
  术后初愈:
    trigger: 出院第三天，{npc}自己拆了绷带，伤口又渗了血。
    objective: 把今晚必须出席的事撑完，不让伤口变成话题。
    choice: 让你看伤口，还是换个说法把你挡回去。
    immediate: 再撑一场，这条伤口会真的裂开。
    near: 有人会问她这道伤是怎么来的。
  戒断第一夜:
    trigger: 说好从今晚开始，{npc}删了联系方式又默背了一遍。
    objective: 撑过戒断最凶的第一个晚上，不用旧渠道换安稳。
    choice: 要你陪着，还是把你支开自己扛。
    immediate: 天亮前那阵最凶的瘾会让她自己去敲旧门。
    near: 旧渠道那头会主动来找她。
  遗嘱将宣读:
    trigger: 明早九点开箱宣读，{npc}今晚把能想到的人都数了一遍。
    objective: 在宣读前确认自己没有站错立场。
    choice: 向你交底她真正想要的那一份，还是装作只为尽义务而来。
    immediate: 今晚说过的话，明早都会被拿去对口径。
    near: 律师会让每个人当场表态。
  寻亲有果:
    trigger: 比对结果下午刚到，{npc}还没决定要不要回那封信。
    objective: 在回信之前弄清自己要的是亲人还是答案。
    choice: 让你看那封信，还是把它重新塞回信封。
    immediate: 对方留的联系电话，明天就会变成空号。
    near: 这件事一旦传开，两边都会来认领她。
  目击待证:
    trigger: 笔录签了字，{npc}今晚开始练习把那晚的事再说一遍。
    objective: 把证词固定在自己确定的范围内。
    choice: 向你复述那晚，还是把细节再藏深一层。
    immediate: 有人会先于开庭来对她的口径。
    near: 任何一版说法外流都会被当成串供。
  回流无处安放:
    trigger: 行李还堆在门口没拆，{npc}已经受不了这间按小时租的屋子。
    objective: 在“回来”和“根本没处回去”之间找一个今晚能睡的答案。
    choice: 承认这边已经没有她的位置，还是再撑一段看看。
    immediate: 她的银行卡在两边都付不起下个月。
    near: 连母语都开始漏词的时候，就真的两边都不是了。
  非人之躯将露:
    trigger: 那层伪装从傍晚开始掉，{npc}现在不敢站到灯底下。
    objective: 撑到天亮让伪装长回来，不让你从别人嘴里先知道。
    choice: 现在自己掀开，还是赌你今晚不会碰她的手腕。
    immediate: 灯光再亮一档，就会有人看出不对。
    near: 猎这一类的那些人，靠的就是心软的一晚。
  无性婚姻重启:
    trigger: 孩子睡下后，{npc}把这件事当正事提了出来，而不是当气氛。
    objective: 弄清两个人还愿不愿意重新开始，而不是谁欠谁。
    choice: 把多年没碰的原因说透，还是只挑今晚能做的先做。
    immediate: 今晚再不说，两个人会继续装作没有这回事。
    near: 装久了的那一方会先在别处找一个出口。
  比赛前夜:
    trigger: 明天上午就要称重上场，{npc}却还坐在这里没有睡意。
    objective: 把今晚的清醒安放在不动明早状态的地方。
    choice: 允许自己放松一次，还是照旧把一切按住到赛后。
    immediate: 今晚的状态会直接写在明天的成绩里。
    near: 输赢之后，今晚说过的话会被重新掂量。
  临终陪护:
    trigger: 病房那头的心电监护还平稳，{npc}已经很多天没合过眼。
    objective: 在陪护的间隙里保住自己还活着的那部分。
    choice: 承认撑不住想借一会儿你的肩膀，还是继续当没事人。
    immediate: 下一轮探视红灯亮起之前，她只有这一小段是自己。
    near: 遗嘱宣读那天，今晚在场的人都会被记得。
  还俗前夜:
    trigger: 还俗文件明天生效，{npc}今晚还穿着最后一身旧衣。
    objective: 把想过的俗世日子先过一晚，不留成遗憾也不留成把柄。
    choice: 今晚放任一次，还是把这晚也守到天亮。
    immediate: 天一亮，她的身份和许可都要重新谈过。
    near: 旧门槛里的人会打听她这晚去了哪里。
  离婚冷静期:
    trigger: 冷静期还剩最后七天，{npc}把离婚协议和结婚照摆在同一张桌上。
    objective: 分清剩下的是感情、习惯，还是只是不敢一个人睡。
    choice: 把最后一页签掉，还是把这一页再压七天。
    immediate: 今晚的任何一个动作，都会被两边律师问起。
    near: 期一到，今晚没说清的就会变成财产和抚养的筹码。
  照护失智母亲:
    trigger: 母亲又一次没认出她，{npc}在你面前没忍住那一秒的垮掉。
    objective: 从长年照护里给自己讨回一个完整的晚上。
    choice: 承认需要有人顶一晚，还是把喘息说成顺路。
    immediate: 陪护假只批到明早，她的窗口只有今夜。
    near: 照护记录和邻里闲话都会记下她今晚不在。
  戒酒周年夜:
    trigger: 今晚是满戒酒一周年，{npc}没去年会，来了你这里。
    objective: 把这个值得纪念的夜过得清醒且不作交换。
    choice: 承认这一年靠的是惦记你，还是只把纪念说成路过。
    immediate: 午夜十二点前，她需要一个不举杯的理由站住。
    near: 年会的人会问她这一晚和谁在一起。
  前任婚礼前夜:
    trigger: 前任的婚礼请柬压在包底，{npc}今晚需要一个不去的理由，或一个同去的人。
    objective: 把自己对那场婚礼的真实态度弄清楚。
    choice: 让你陪她出席，还是把请柬退掉换成一场告别。
    immediate: 婚礼明天上午十点开始，答复今晚就要给。
    near: 婚礼上的人会把她身边站着谁写进新的流言里。
  创业清盘夜:
    trigger: 最后一批设备明早装车抵债，{npc}在空了一半的办公区留到最后一刻。
    objective: 把三年创业的句号画得像自己画的。
    choice: 接受你出手盘下其中一件，还是让一切干净地清零。
    immediate: 天亮前签不完字，债主就会带人来搬。
    near: 清盘名单会在这个圈子里流传很久。
  产后重启:
    trigger: 医生上周刚口头放行，{npc}却连拥抱都还下意识侧身。
    objective: 按自己的节奏把身体的主权一点点拿回来。
    choice: 让你今晚只抱着什么都不做，还是由她来定每一步。
    immediate: 今晚若再被催促，她会把刚开的门重新关上。
    near: 这段重启的节奏会决定她之后很久的身体态度。
  旧疤初见:
    trigger: 衣服滑下去的那半秒，{npc}按住了你的手，疤还没给任何人看过。
    objective: 把最不敢示人的那处旧疤交出去，还保持体面。
    choice: 让灯亮着讲疤的来历，还是关灯只留触感。
    immediate: 你此刻的反应会被她记一辈子。
    near: 疤的来历迟早会牵出一段没讲过的过去。
  疗后敏感:
    trigger: 理疗师的手刚走，{npc}发现你的手放在同一处，感觉完全不同。
    objective: 分清哪些触碰要躲、哪些其实不想躲。
    choice: 给你一份可以与不可以的清单，还是每次碰壁再学。
    immediate: 躲错一次，她需要很久才敢再试。
    near: 身体的地图会随着疗程一寸寸改版。
  未过门的亲事:
    trigger: 亲事定在开春，{npc}今晚却来问你这门亲事她自己算不算数。
    objective: 把自己的意愿从两家的章程里捞出来。
    choice: 让你替她递退婚的话，还是先过了这个冬天。
    immediate: 开春下定礼一到，她就再没开口的份。
    near: 两家会把今晚的私会写进陪嫁的账。
  守孝之年:
    trigger: 孝期还差百日未满，{npc}今晚一身素色坐在了你面前。
    objective: 在礼数和自己的日子之间找一条不亏欠两边的路。
    choice: 把这百日熬完再见你，还是认定心不等礼。
    immediate: 孝期里的私会一旦传开，她两头都站不住。
    near: 族里会拿今晚做她不配守业的名目。
  客居篱下:
    trigger: 寄住这座宅子的第三个月，{npc}还没把这里当成家。
    objective: 找一个不必看人脸色、也不欠人情的落点。
    choice: 接受你替她安排的住处，还是继续忍到有退路。
    immediate: 屋檐下多待一天，她的话就少一分底气。
    near: 寄人篱下的日子会把她的选择越拖越窄。
  戏班交割夜:
    trigger: 班主今晚交箱，{npc}的头面和身契一起摆上了桌。
    objective: 在交箱前把自己赎成自由身。
    choice: 拿传家的头面抵身价，还是留下继续唱。
    immediate: 天一亮箱谱入册，她就不是她自己了。
    near: 新班主会按自己的戏码安排她的下半场。
  旗袍店最后一单:
    trigger: 铺子月底到期，{npc}接的最后一件旗袍是你的。
    objective: 把这最后一针收得体面，不欠也不被欠。
    choice: 收下你多付的工钱，还是只按料价算清。
    immediate: 这件做完，那把软尺就没有下一位客人了。
    near: 老客们会把这间铺子的关门当成一个行当的收尾。
  老茶馆转让夜:
    trigger: 茶馆明早交钥匙，{npc}泡了最后一壶没舍得喝。
    objective: 把三十年的茶台有个交代。
    choice: 把茶台托付给你，还是随铺子一起交给生人。
    immediate: 钥匙明早九点交，今晚是这茶台最后的夜。
    near: 接手的人会拆掉茶台改成别的东西。
  个展前夜:
    trigger: 画明天就挂出去了，{npc}还差最后一幅没题款。
    objective: 把自己的名字签在自己的人生上。
    choice: 题上款，还是把那幅撤下来永不示人。
    immediate: 布展明早封厅，签与不签都在今夜。
    near: 画一旦挂出去，画里那点私事就由不得她了。
  掌眼走不得:
    trigger: 明天的拍卖上有件东西，{npc}看不准，又必须看准。
    objective: 在举牌前替良心找到落点。
    choice: 把疑点捅破，还是顺着行情闭一次眼。
    immediate: 明天上午十点开槌，她的名字今夜就要押上去。
    near: 走眼一次，掌眼的名声就裂一辈子。
withdrawal:
  正面解决: 把话题扳回可执行的下一步，不再看你。
  谈判交换: 改口‘到此为止’，把报价收回去。
  隐瞒拖延: 开始整理东西，用动作占住不回答的时间。
  寻求帮助: 把已经伸出的那句话缩回去，改口自己再想想。
  独自承担: 把肩重新端平，说这件事她自己能处理。
  转移风险: 把责任推到不在场的人身上，然后看表。
  收集证据: 把东西收进袋子，改口材料今晚先到此。
  先退后进: 往门口让半步，给双方一个能下台的缝。
  用行动代替解释: 开始做下一件无关的事，不再接话。
  维持表面稳定: 把场面话重新铺上，笑容先回来。
  破罐破摔: 把手里的东西一推，说今晚就这样吧。
  借力打力: 把你的话接过去，反手用在你身上。
  以攻代守: 反问一句把话头打回去，自己先不答。
pressure_response:
  正面解决:
  - 把未决说成可执行的步骤
  - 要一个时点
  - 把证据摊开逼问
  - 当场要求给或滚
  谈判交换:
  - 先问你要什么
  - 把请求折成报价
  - 加码并要求对等
  - 用更硬的条件把自己拉回来
  隐瞒拖延:
  - 用场面话垫着
  - 承认一半藏一半
  - 把关键时点含混过去
  - 准备起身离开
  寻求帮助:
  - 旁敲侧击地试你肯不肯
  - 把求助说成商量
  - 几乎把求字说出口
  - 短暂失态后羞耻地收回
  独自承担:
  - 坚持自己能处理
  - 把你挡在事务之外
  - 开始发抖仍不肯把担子放下
  - 身体先一步垮、嘴还在拒绝
  转移风险:
  - 把话题引到不在场的人
  - 要求你先表态
  - 把锅甩给制度或第三方
  - 用你当挡箭牌然后否认
  收集证据:
  - 核对细节
  - 要你看材料
  - 把材料拍在桌上
  - 材料砸完仍不够时会短暂失态
  先退后进:
  - 先让步换空间
  - 退到能看清你的距离
  - 用沉默施压
  - 把选择权丢回给你
  用行动代替解释:
  - 先做一件具体的事
  - 用递东西代替开口
  - 用靠近或离开代替解释
  - 动作比话先失控
  维持表面稳定:
  - 把场面维持成正常
  - 用程序和礼貌挡
  - 礼貌开始碎
  - 表面崩开仍想把场子圆回去
  破罐破摔:
  - 语气开始自嘲，说反正也不会更糟
  - 当众把一条规矩破给你看
  - 主动把最坏的结果说成定局
  - 把放弃自己的话说出口，说完盯着你看
  借力打力:
  - 先顺着你的话头往下走
  - 拿你说过的规矩反过来要求你
  - 把施压的人引到你面前
  - 借你的手把整个局面掀了
  以攻代守:
  - 先挑你话里的漏洞
  - 把问题原样问回你
  - 抢先摊牌，不给追问留时间
  - 恶语先出口，随即自己也愣住
contrast_line:
  外冷内热: 公开场合话少得像条款，私下里热得自己都讨厌。
  强势示弱: 习惯先把场面按住，真正怕的时候才会把声音放轻。
  端庄放浪: 身份要求她端着；卸下外壳后直白，且不觉得需要道歉。
  疏离黏人: 人前保持半步距离，一旦确认你不走就会黏上来。
  毒舌心软: 先用刻薄挡人，挡不住的时候心软得很快。
  市侩重义: 开口先谈划算，真正要守的是她认下的那一笔。
  精明糊涂: 算得清所有时点，偏偏在你面前会装不懂。
  老练纯情: 什么场子都见过，动心时仍会笨。
  妖艳羞怯: 打扮像随时能把人勾走，真被盯着看时先移开眼睛的反而是她。
  粗人细活: 满手粗话和茧子，收拾东西的那双手比谁都稳。
  健谈守口: 跟谁都能聊到打烊，最要紧的那件她一个字不说。
  泼辣胆小: 骂人不眨眼，打雷时第一个动作是抓住离她最近的人。
orientations:
- 对男性有稳定吸引，情境会放大
- 对女性有稳定吸引，情境会放大
- 吸引看对象和今夜是否被看见，不自动成立
- 偏同性，平时压着，压力下才意识到
- 偏异性，但只对特定对象放开
- 双性都吸引，只是今晚才被摆到眼前
- 浪漫心动常有，身体吸引来得慢，要信了才有
- 还没弄清自己被什么吸引，今晚是第一次认真想
suggestion_extras:
- 叫她的名字，{npc}刚刚那一下还悬着。
- 把外套或杯子递回去，不先谈条件。
- 问一句今晚她到底想在你这儿停多久。
- 承认你也紧张，把距离留在能退出的位置。
- 让座或把灯调回一档，先把场面稳住。
- 把她刚说过的那个词接回去，问她是不是认真的。
- 坐得离她近半步，不动手，等她自己决定距离。
- 先替她把明天的事排开，今晚就不谈明天。
- 告诉她你可以现在就走，看她留不留你。
- 把灯全打开，把选择还给她。
suggestion_player_first:
  递上一杯酒: 接过那杯酒，或把它放回原处。
  约在午夜: 答应留下来，或问她为什么是今晚。
  请求庇护: 让她把门锁上，或问她要躲的是谁。
  试探底线: 接那句不该问的，或把话题转开。
  递外套: 把外套递回去，或问她冷不冷。
  让出座位: 在她空出的位置坐下，或站着把距离留住。
  承认紧张: 承认你也紧张，或先不接这句。
  邀请留下: 答应再坐一会儿，或看一眼门。
  问一句不该问的: 回答那句不该问的，或问她为什么现在问。
  把灯调暗: 让灯维持这一档，或把它调回去。
  把伞让过去: 接过伞，或把伞推回去。
  先开口叫名字: 应她，或反过来叫{npc}的名字。
  分享一只耳机: 接过那只耳机，或让她把歌名告诉你。
  递纸巾: 接过纸巾，或先问她为什么随身带这些。
  留一盏灯: 走进那盏灯里，或问她为什么还没睡。
  接住掉落的东西: 说声谢谢，或问她是不是一直在看你。
  教一个动作: 照着试一遍，或让她手把手再教一次。
  把热的那份推过来: 接下那份，或把自己那份推回去。
  陪你等末班车: 让她陪着，或问她末班车之后去哪。
  替你挡下一通电话: 由她扣着，或把手机拿回来说自己来接。
  替她挽一次发: 抬手示意一下再落下，或问她习惯谁来替她挽。
  递一盏刚沏的茶: 把茶放到她手边，或提醒烫、让她再等等。
  教她一个身段: 先站到她侧身做一遍，或伸手虚扶她的腰背。
  为她描一次眉: 接过笔只描一笔就停，或先替她扶稳镜子。
  替她系松开的盘扣: 指尖停在扣眼上等她说好，或慢慢替她系上。
  借她一本书: 报出书名约在明天，或现在就去把书取来。
  雨里把伞偏过去: 让伞面继续偏向她，或朝她那边站近一步。
  对弈时让半子: 落子时松那半口气，或明说这局让你三分。
suggestion_default: 先应{npc}刚才那一下，不把今夜写成交易。
suggestion_nontrade_guard: 把外套或杯子递回去，不先谈条件。
