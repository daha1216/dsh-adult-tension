withdrawal:
  正面解决: 把话题扳回可执行的下一步，不再看你。
  谈判交换: 改口「到此为止」，把报价收回去。
  隐瞒拖延: 开始整理东西，用动作占住不回答的时间。
  寻求帮助: 把已经伸出的那句话缩回去，改口自己再想想。
  独自承担: 把肩重新端平，说这件事她自己能处理。
  转移风险: 把责任推到不在场的人身上，然后看表。
  收集证据: 把东西收进袋子，改口材料今晚先到此。
  先退后进: 往门口让半步，给双方一个能下台的缝。
  用行动代替解释: 开始做下一件无关的事，不再接话。
  维持表面稳定: 把场面话重新铺上，笑容先回来。
  破罐破摔: 把手里的东西一推，说今晚就这样吧。
  借力打力: 把你的话接过去，反手用在你身上。
  以攻代守: 反问一句把话头打回去，自己先不答。
pressure_response:
  正面解决:
  - 把未决说成可执行的步骤
  - 要一个时点
  - 把证据摊开逼问
  - 当场要求给或滚
  谈判交换:
  - 先问你要什么
  - 把请求折成报价
  - 加码并要求对等
  - 用更硬的条件把自己拉回来
  隐瞒拖延:
  - 用场面话垫着
  - 承认一半藏一半
  - 把关键时点含混过去
  - 准备起身离开
  寻求帮助:
  - 旁敲侧击地试你肯不肯
  - 把求助说成商量
  - 几乎把求字说出口
  - 短暂失态后羞耻地收回
  独自承担:
  - 坚持自己能处理
  - 把你挡在事务之外
  - 开始发抖仍不肯把担子放下
  - 身体先一步垮、嘴还在拒绝
  转移风险:
  - 把话题引到不在场的人
  - 要求你先表态
  - 把锅甩给制度或第三方
  - 用你当挡箭牌然后否认
  收集证据:
  - 核对细节
  - 要你看材料
  - 把材料拍在桌上
  - 材料砸完仍不够时会短暂失态
  先退后进:
  - 先让步换空间
  - 退到能看清你的距离
  - 用沉默施压
  - 把选择权丢回给你
  用行动代替解释:
  - 先做一件具体的事
  - 用递东西代替开口
  - 用靠近或离开代替解释
  - 动作比话先失控
  维持表面稳定:
  - 把场面维持成正常
  - 用程序和礼貌挡
  - 礼貌开始碎
  - 表面崩开仍想把场子圆回去
  破罐破摔:
  - 语气开始自嘲，说反正也不会更糟
  - 当众把一条规矩破给你看
  - 主动把最坏的结果说成定局
  - 把放弃自己的话说出口，说完盯着你看
  借力打力:
  - 先顺着你的话头往下走
  - 拿你说过的规矩反过来要求你
  - 把施压的人引到你面前
  - 借你的手把整个局面掀了
  以攻代守:
  - 先挑你话里的漏洞
  - 把问题原样问回你
  - 抢先摊牌，不给追问留时间
  - 恶语先出口，随即自己也愣住
contrast_line:
  外冷内热: 公开场合话少得像条款，私下里热得自己都讨厌。
  强势示弱: 习惯先把场面按住，真正怕的时候才会把声音放轻。
  端庄放浪: 身份要求她时刻端正体面，卸下防备后直白坦荡，从不觉得索求需要道歉。
  疏离黏人: 人前保持半步距离，一旦确认你不走就会黏上来。
  毒舌心软: 先用刻薄挡人，挡不住的时候心软得很快。
  市侩重义: 张口闭口先算利害，真到了关头，拿命去守的偏偏是她认下的那份情义。
  精明糊涂: 算得清所有时点，偏偏在你面前会装不懂。
  老练纯情: 风浪场面里周旋自如，一旦被戳中真心，手足无措得像初次动情。
  妖艳羞怯: 打扮像随时能把人勾走，真被盯着看时先移开眼睛的反而是她。
  粗人细活: 满手粗话和茧子，收拾东西的那双手比谁都稳。
  健谈守口: 跟谁都能聊到打烊，最要紧的那件她一个字不说。
  泼辣胆小: 骂人不眨眼，打雷时第一个动作是抓住离她最近的人。
  克制失控: 平日里规矩严整滴水不漏，真被碰到底线时比谁都失控。
  主导渴从: 在外面发号施令惯了，独处时最想要的是把决定权交出去。
  刻薄依恋: 嘴上字字带刺像在赶人，手心里却全是怕你真走的冷汗。
  世故笨拙: 在名利场上周旋得圆融体面，真到了动情处手足无措像个新手。
  高岭破防: 台前是令人仰望的清冷焦点，私下卸了防备，连瓶盖都要软声让你帮忙拧开。
  女骑羞赧: 战场上能斩断巨兽的剑士，被解开甲胄系带时羞得连头都不敢抬。
  傲沉易推: 嘴上逞强说着最难听的话，只要稍一靠近就慌得红透了耳根。
  御姐撒娇: 外表是成熟可靠的大姐姐，私下喝了点酒就抱着人不肯撒手。
  无口心热: 平时连三个字都懒得说，但只要你一转身，她就会下意识伸手抓住你的手指。
  大小姐笨拙: 名门出身的高岭之花，面对最简单的生活琐事笨拙得满脸通红。
  假小子娇羞: 平时拍肩称兄道弟大大咧咧，一旦被按在墙上认真叫名字，瞬间羞得语无伦次。
  武者破戒: 一生恪守清规戒律的剑客，初尝情欲滋味时比谁都失控敏感。
  禁欲破戒: 平日里恪守清规、不染尘俗，一旦尝到情欲滋味，索求与沉溺比谁都热烈失控。
  严苛沦陷: 在公事上吹毛求疵、训人毫不留情，被反扣住双手抵在桌前时，羞耻得眼尾泛红。
orientations:
- 对男性有稳定吸引，情境会放大
- 对女性有稳定吸引，情境会放大
- 吸引看对象和今夜是否被看见，不自动成立
- 偏同性，平时压着，压力下才意识到
- 偏异性，但只对特定对象放开
- 双性都吸引，只是今晚才被摆到眼前
- 浪漫心动常有，身体吸引来得慢，要信了才有
- 还没弄清自己被什么吸引，今晚是第一次认真想
suggestion_extras:
- 叫她的名字，{npc}刚刚那一下还悬着。
- 把外套或杯子递回去，不先谈条件。
- 问一句今晚她到底想在你这儿停多久。
- 承认你也紧张，把距离留在能退出的位置。
- 让座或把灯调回一档，先把场面稳住。
- 把她刚说过的那个词接回去，问她是不是认真的。
- 坐得离她近半步，不动手，等她自己决定距离。
- 先替她把明天的事排开，今晚就不谈明天。
- 告诉她你可以现在就走，看她留不留你。
- 把灯全打开，把选择还给她。
suggestion_player_first:
  递上一杯酒: 接过那杯酒，或把它放回原处。
  约在午夜: 答应留下来，或问她为什么是今晚。
  请求庇护: 让她把门锁上，或问她要躲的是谁。
  试探底线: 接那句不该问的，或把话题转开。
  递外套: 把外套递回去，或问她冷不冷。
  让出座位: 在她空出的位置坐下，或站着把距离留住。
  承认紧张: 承认你也紧张，或先不接这句。
  邀请留下: 答应再坐一会儿，或看一眼门。
  问一句不该问的: 回答那句不该问的，或问她为什么现在问。
  把灯调暗: 让灯维持这一档，或把它调回去。
  先开口叫名字: 应她，或反过来叫{npc}的名字。
  分享一只耳机: 接过那只耳机，或让她把歌名告诉你。
  递纸巾: 接过纸巾，或先问她为什么随身带这些。
  留一盏灯: 走进那盏灯里，或问她为什么还没睡。
  接住掉落的东西: 说声谢谢，或问她是不是一直在看你。
  教一个动作: 照着试一遍，或让她手把手再教一次。
  把热的那份推过来: 接下那份，或把自己那份推回去。
  陪你等末班车: 让她陪着，或问她末班车之后去哪。
  替你挡下一通电话: 由她扣着，或把手机拿回来说自己来接。
  替她挽一次发: 抬手示意一下再落下，或问她习惯谁来替她挽。
  递一盏刚沏的茶: 把茶放到她手边，或提醒烫、让她再等等。
  教她一个身段: 先站到她侧身做一遍，或伸手虚扶她的腰背。
  为她描一次眉: 接过笔只描一笔就停，或先替她扶稳镜子。
  替她系松开的盘扣: 指尖停在扣眼上等她说好，或慢慢替她系上。
  反手反锁包厢门: 接过她手里的包，或伸手覆在她还没松开门把的手上。
  雨里把伞偏过去: 让伞面继续偏向她，或朝她那边站近一步。
  对弈时让半子: 落子时松那半口气，或明说这局让你三分。
  递过半瓶干净水: 接过水喝一口，或推回去让她自己留着。
  用酒精棉按住渗血: 让她按着，或伸手接下棉球自己来。
  替她扶正防毒面罩: 帮她也检查面罩气密性，或示意自己没吸进毒气。
  侧身挡住通风口的风: 往她身边靠半步，或拉紧防雨布一起挡。
  替她拉上背后拉链: 伸手替她拉上拉链，或手指停在拉头上等她点头。
  借口魔力供给贴近: 伸手按住她的额头输送魔力，或轻声问她够不够。
  替她扶正猫耳发箍: 替她扶正发箍，或顺势揉一下她的发顶。
  递过宽大队服: 替她披上队服，或把拉链替她拉到领口。
  用嘴咬住发绳扎单马尾: 替她拢住后颈的发丝，或等她把头发扎好。
  下意识揪住你的后衣角: 停下脚步转过身看着她，或伸手覆在她攥紧的手背上。
  伸手捏了捏她的精灵耳: 手指停在泛红的耳尖上轻揉，或收回手问她是不是很敏感。
  把发烫的脸埋进你的掌心: 用拇指轻抚她的眼角，或扶着她的下巴让她抬起头来。
  分半张烤得焦黄的干烙馍: 把水囊递过去，或提醒他多吃一点垫肚子。
  替他拂去罗盘上的青铜尘土: 帮他稳住油灯照亮刻度，或轻声问他指到了哪一卦。
  把防身桃木小符塞进他袖口: 握住他的手指叮嘱别弄丢，或转过身警戒四周。
  用指尖替她抹匀眼角油彩: 帮她戴上羽毛面具，或轻声提醒她台下的第一排坐着谁。
  替她扣紧手腕上的皮质护腕: 确认搭扣没有松动，或握住她的手腕给她一点温度。
  递过斟满葡萄美酒的金樽: 就着酒樽与她同饮，或问她今夜在鬼市到底想找什么。
  替她挽紧被狂风吹散的红纱面罗: 帮她将面纱金扣别紧，或轻声提醒她外面沙暴越来越大。
  以指尖朱砂点向她眉心镇妖: 伸手扶住她摇摇欲坠的肩膀，或轻声唤她的真名唤回神智。
  将一支点燃的雪茄递到她唇边: 接过雪茄自己也吸一口，或伸手替她理好被风吹乱的风衣领口。
  递上一块干净白布替她拭刀: 帮她将刀收入白木刀鞘，或握住她冰凉发颤的手指。
  在防喷罩前替她理顺耳机线: 伸手帮她调整麦克风高度，或低声问她这段台词要不要先对一遍。
  将改好的满分试卷推到她面前: 确认试卷评分并给出下一步特训指令，或轻声问她身体记住了没有。
  按住她因为羞耻而发颤的尖长精灵耳: 手指轻抚她发烫的耳尖，或问她神殿的结界还能支撑多久。
  替她解开被眼泪浸湿的礼服束腰: 伸手替她解开束腰系带，或将她拉进怀里轻拍她的后背。
  当面卸下她沾满冰霜的秘银肩甲: 将卸下的肩甲放在桌上，或伸手覆在她冰凉发颤的肩膀上。
  替她擦去后颈渗出的细汗并拉上防窥帘: 伸手替她擦拭细汗，或把保姆车的暖风调大一档。
  伸手帮她托住沉重的大拖尾裙摆: 帮她托稳裙摆免得褶皱，或伸手扣住她的手腕拉近距离。
  用掌心温热她腕上冰凉的翡翠玉镯: 握紧她的皓腕替她揉搓取暖，或低声提醒她前厅的动静。
  替她摘下后颈沉重的鸽子蛋钻石项链: 替她摘下项链收进盒中，或扶住她的腰让她在沙发坐稳。
  伸手捏了捏她气鼓鼓泛红的脸颊: 伸手轻捏她的脸颊哄她，或把考核表拿过来重新审视。
  掀开厚重的毛毯将她整个人裹进怀里: 把毛毯裹紧将她拥入怀中，或轻抚她的发丝安慰她别怕。
suggestion_default: 先应{npc}刚才那一下，不把今夜写成交易。
suggestion_nontrade_guard: 把外套或杯子递回去，不先谈条件。
