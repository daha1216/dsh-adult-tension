# 中期剧情转折池（数据本体）。由 scripts/roll_opening.py --twist 读取。
# 契约：必须严格保持七类、顺序不变、每类非空；类内条目可自由增删。
信息类:
- 新证据出现
- 误传扩散
- 关键记录缺页
- 私密日记被第三人翻阅
- 匿名威胁信直接塞入房门
- 聊天记录云同步
- 监控回放流出
- 感染检测样本被污染
- 第三方的未读语音被当面外放
- 已作废的协议草稿留了底单
- 直播回放截屏在论坛爆火
- 家族长辈要求调阅特训监控
人事类:
- 关键岗位换人
- 旧人归来
- 自称知情的陌生人
- 失踪者有消息
- 对头升职
- 搜刮队带回感染者
- 门外出现第三方派出的盯梢车
- 关键证人临时反水
- 公会榜一金主突然线下找来
- 死对头战队队长亲自挖角
资源类:
- 核心物资或资金供给突然断供
- 替代品出现
- 藏匿资源被发现
- 意外之财
- 坐地涨价
- 保单突然生效
- 应急私用账户突然被冻结
- 用于脱身的第二套证件被注销
- 周转用贵重抵押物被掉包
- 魔力水晶突然耗尽开裂
制度类:
- 例外被撤
- 审查突至
- 规则临时收紧
- 新规追溯既往
- 行业或机构内部黑名单流出
- 避难所全面戒严
- 强制体检令即刻执行
- 封控核查范围临时扩大至本栋
- 保密协议被要求全员重签追责
时限类:
- 死线提前
- 预约被改期
- 今夜末班车船临时取消
- 闭馆清场
- 原定婚期突然提前定死
- 全城宵禁时点突然提前
- 门禁系统提前半小时落锁
- 接班换岗人员提前到场
- 晨检管家提前上楼敲门
关系类:
- 两名 NPC 私下接触
- 立场被试探
- 秘密互换
- 第三者登场
- 长辈介入调停
- 师命难违
- 彼此隐瞒的伤口被撞破
- 第三方的钥匙插进门锁转动
- 本该保密的两人关系被第三人当面叫破
- 共同隐瞒的把柄被误会为对方背叛
意外类:
- 突发意外事故封死既定退路
- 天气毁掉计划
- 整栋建筑或安全屋突然断电
- 体检误报
- 旧伤确诊
- 药效冲突
- 突发急性低血糖与体温骤降
- 房间暖气或中央空调失控升温
- 门锁意外卡死无法从内开启
- 魔药药效反噬导致身体过敏
