# 中期剧情转折池（数据本体）。由 scripts/roll_opening.py --twist 读取。
# 契约：必须严格保持七类、顺序不变、每类非空；类内条目可自由增删。
信息类:
- 新证据出现
- 误传扩散
- 关键记录缺页
- 日记被翻
- 匿名信到
- 聊天记录云同步
- 监控回放流出
- 旧照片流出
人事类:
- 盟友松动
- 旧人归来
- 关键岗位换人
- 自称知情的陌生人
- 失踪者有消息
- 旧搭档回归
- 对头升职
- 名角退隐
资源类:
- 断供
- 替代品出现
- 藏匿资源被发现
- 意外之财
- 坐地涨价
- 遗产到账
- 保单突然生效
- 老料难寻
制度类:
- 例外被撤
- 审查突至
- 规则临时收紧
- 新规追溯既往
- 黑名单流出
- 签证提速
- 新规一夜生效
- 老宅列入文保
时限类:
- 死线提前
- 行动窗口缩短
- 预约被改期
- 末班取消
- 闭馆清场
- 审批加急窗口
- 证人临时到案
- 婚期提前
- 宵禁提前
关系类:
- 两名 NPC 私下接触
- 立场被试探
- 秘密互换
- 第三者登场
- 说客上门
- 第三人正式表态
- 长辈介入调停
- 师命难违
意外类:
- 事故
- 天气毁掉计划
- 交通或通讯中断
- 停电
- 宠物闯入
- 体检误报
- 旧伤确诊
- 药效冲突
- 水淹绣坊
