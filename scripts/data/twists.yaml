# 中期剧情转折池（数据本体）。由 scripts/roll_opening.py --twist 读取。
# 契约：必须严格保持七类、顺序不变、每类非空；类内条目可自由增删。
信息类:
- 新证据出现
- 误传扩散
- 关键记录缺页
- 日记被翻
- 匿名信到
- 聊天记录云同步
- 监控回放流出
- 旧照片流出
- 感染检测样本被污染
- 避难所密电截获
- 第三方的未读语音被当面外放
- 已作废的协议草稿留了底单
- 匿名举报信副本送达当事人
- 直播回放截屏在论坛爆火
- 同人志未删减草稿误发官方群
人事类:
- 盟友松动
- 旧人归来
- 关键岗位换人
- 自称知情的陌生人
- 失踪者有消息
- 旧搭档回归
- 对头升职
- 名角退隐
- 搜刮队带回感染者
- 检疫长官突击换岗
- 接应人员在半路被带走调查
- 门外出现第三方派出的盯梢车
- 关键证人临时反水
- 公会榜一金主突然线下找来
- 死对头战队队长亲自挖角
资源类:
- 断供
- 替代品出现
- 藏匿资源被发现
- 意外之财
- 坐地涨价
- 遗产到账
- 保单突然生效
- 老料难寻
- 最后一箱消炎药变质
- 备用发电机柴油失窃
- 应急私用账户突然被冻结
- 用于脱身的第二套证件被注销
- 周转用贵重抵押物被掉包
- 魔力水晶突然耗尽开裂
- 同人志印厂机器过热罢工
制度类:
- 例外被撤
- 审查突至
- 规则临时收紧
- 新规追溯既往
- 黑名单流出
- 签证提速
- 新规一夜生效
- 老宅列入文保
- 避难所全面戒严
- 强制体检令即刻执行
- 封控核查范围临时扩大至本栋
- 特批豁免名单当夜作废
- 保密协议被要求全员重签追责
时限类:
- 死线提前
- 行动窗口缩短
- 预约被改期
- 末班取消
- 闭馆清场
- 审批加急窗口
- 证人临时到案
- 婚期提前
- 宵禁提前
- 防爆门落锁倒计时缩短
- 尸潮逼近警戒线提前
- 门禁系统提前半小时落锁
- 催收人员已乘电梯上楼
- 接班换岗人员提前到场
关系类:
- 两名 NPC 私下接触
- 立场被试探
- 秘密互换
- 第三者登场
- 说客上门
- 第三人正式表态
- 长辈介入调停
- 师命难违
- 搜刮队内部产生内讧
- 彼此隐瞒的伤口被撞破
- 第三方的钥匙插进门锁转动
- 本该保密的两人关系被第三人当面叫破
- 共同隐瞒的把柄被误会为对方背叛
意外类:
- 事故
- 天气毁掉计划
- 交通或通讯中断
- 停电
- 宠物闯入
- 体检误报
- 旧伤确诊
- 药效冲突
- 水淹绣坊
- 避难所排风管道逆流
- 防御电网短路失效
- 突发急性低血糖与体温骤降
- 房间暖气或中央空调失控升温
- 门锁意外卡死无法从内开启
- Cos服装绑带突然崩开
- 魔药药效反噬导致身体过敏
