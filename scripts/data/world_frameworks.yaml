        - 信任透支
        beats:
          trigger: 整理怪物观察笔记时发现图书馆抄本与营地留档对同一种怪的习性记载相反，两本的归档印都是当期的。
          objective: 在勘查队出营前定下以哪一本为准，并把改动写进能带走的那一本。
          choice: 是当场按营地的记录改掉抄本上的那一栏，还是先找当年归档的经手人问清哪一本先落笔。
          immediate: 两本记录当夜各自留一版，勘查队带走的那本上被改掉的一栏要落名；没被选中的那本不因此作废，也不去追究先前抄它的人。
          near: 勘查出勤按改过的那本配药与布陷阱，出事的账算在落名的人头上；往后归档要两本互校，同一种怪的习性不再只由一本书定。
        far_trigger: 勘查队按错的那一本配置了药量，第一次遭遇就有人被抬回来，两本记录谁先落笔成了营地内互相指认的凭据。
        far_consequence: 勘查出勤要按重审后的记录重排，涉事的两班当值在铺位续约时被要求各自说明为什么改了或没改那一栏。
        bindings:
        - activity: 整理怪物观察笔记
          place: 图书馆
          pair: 0
        exits:
