    themes:
    - 集中供暖里的个人休息权
    - 修补劳动如何换来共同生活的余裕
    - 封闭聚落中的自愿参与
    - 登记册与配额下的人情消耗
    - 体温依赖与尸潮围困中的取暖资格
    technology_boundary: 避难所保有轮班供暖、低功率照明、机械闸门和有限维修设备；燃料与零件有限，无无限能源或万能修复。闸门前是内部等候区，退出活动不等于放行到外部寒区。登记册、体温计与配给券存根是唯一的官方记录手段，没有电子身份系统或即时通信；废土驿站在被封路段之外，往返需按当次路况另行安排。
    bridge_status: bridge_required
    bridge_explanation: 废土驿站位于避难所封闭区域之外、被封路段另一侧，不是居住层内的房间。进入驿站活动必须另行写出队、按路况折返或经搜刮队带路的经过；不能从避难所内廊直接走到驿站柜台。
  检疫站旁的生活区:
    eras:
    - 感染爆发初期
    aesthetics:
    - 感染隔离区
    - 末日求生纪实
    rule: 检疫站旁保留独立生活区域，居民以真实通告而非传闻安排往来。体温异常按零容错处置：检测超过警戒线的人由诊疗侧按流程带离所属区域并单独观察，不经过生活区、不在原住处理，生活区只接到一张带编号的带离记录；瞒报伤口或检测结果的人，本人连同他所在那一队的全队口粮配额一并停发，直到整队完成复核为止，队里其余人须自行决定是否替他补上缺的那一份。
    social_rule: 检测与诊疗由专业人员负责，私人关系不能更改检疫记录。伤口一律要先报后处理，报过的人的配额与通行时段由诊疗侧统一留下记录，往后按记录走。
