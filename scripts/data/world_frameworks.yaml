    themes:
    - 同一支舞在台面上和台面下有两个价钱
    - 陪舞不陪身这条线由班主守着而不由上台的人守着
    - 花榜的名次看得见却换不了钱
    - 这一晚不在册子上才是这栋楼里唯一的私密
    technology_boundary: 全楼靠手摇电话、跑腿传话、纸面台面册与贴报墙运转，没有无线广播、没有录音与留声留影，谁在场、谁落过字只能靠纸面与见证人。台面上的钟点靠乐队与领班的纸剪节目条对齐，账目靠白账与台面册两本人工核对；衣服与乐谱全是手工缝制与抄写，跨街的消息最快要一夜。当夜的记录只存在纸张与人头上，改一笔要当着人在册子上改，撕下来的那一页不会自己不见。
    bridge_status: not_required
  片场棚与月份牌画室:
    eras:
    - 旧式民国都市
    aesthetics:
    - 青年漫写实
    - 暖色生活流
    - 克制冷峻
    rule: 片厂、画室和院线凭一张脸维持生意：片子里的脸、墙上的脸、广告上的脸各按一份合同分开算；合同科那一枚章认人不认话，落过章的就是公司资产，失期作废；本人同不同意不写在纸上，署名却要另外谈，同一个名字可以在本名、艺名和画上那个名字之间换着用；底片一律归厂，样照不出洗印间，带出去的就不再追。
    social_rule: 片厂不认本人不同意，只认合同科那一枚章；画室不问像不像，只问制版卖不卖得动；一个人可以有本名、艺名和画上那个名字；明星宿舍门口没有锁，可谁跟谁同车回来是第二天唯一的话题；跑片院线只认片子上的署名——片子红了是公司的，砸了是演员的。
    places:
      合同科案桌:
        details:
        - 长案上摊着待用印的合同一式两份，骑缝章压在右手边·日间
        - 案角码着已作废的旧约，红笔划掉的期日还看得见·午后
        profile:
          privacy: low
          visibility: high
          exits:
          - 案桌临着过道，交完纸从正门廊道出去
          witnesses:
          - 合同科经手人
          - 等盖章的别组干事
          affordances:
          - 签一份形象使用合同
          - 结束活动并离开
          pressure_modifiers:
          - 用印的排班时辰
          - 科长在不在楼下
      布景片场:
        details:
        - 搭到一半的街景墙后面露出灯架和电线，地上拖着标记走位的白线·日间
        - 反光板搁在景片边上，机位边留着一圈只准演员踩进去的空地·午后
        profile:
          privacy: low
          visibility: high
          exits:
          - 穿过景片墙就是棚门，棚门直通片厂大道
          witnesses:
          - 场务与灯工
          - 候场的其他演员
          affordances:
          - 棚里拍一组样片
          - 结束活动并离开
          pressure_modifiers:
          - 租棚按钟点算到几时
          - 日光从高窗漏进来的角度
      灯位高台:
        details:
        - 高台木板只容两人侧身立着，栏杆外垂着调灯用的绳·夜
        - 台下机位在等一个光，所有人都安静看台上那一点·深夜
        profile:
          privacy: medium
          visibility: medium
          exits:
          - 沿侧梯下到片场地面，再从布景背后绕出棚门
          witnesses:
          - 灯工
          - 在台下候着的助理导演
          affordances:
          - 棚里拍一组样片
          - 在灯位高台等一个光
          - 结束活动并离开
          pressure_modifiers:
          - 这一条光能等多久
          - 高台上还站得住几个人
      洗印间与底片柜:
        details:
        - 暗红罩灯下药水盆排成一列，晾片绳上夹着几段刚冲的负片·深夜
        - 底片柜的铜锁换成新的一把，柜面贴着登记用的小木牌·深夜
        profile:
          privacy: high
          visibility: low
          exits:
          - 洗印间出门是窄过道，过道尽头通洗印房后门
          witnesses:
          - 洗印间的老师傅
          affordances:
          - 把底片锁进柜子
          - 结束活动并离开
          pressure_modifiers:
          - 进柜登记要不要写名
          - 药水还能冲几卷
      月份牌画室:
        details:
        - 画架旁钉着一排试色小样，模特坐的圆凳还留着上一位的体温·日间
        - 长桌上铺着放大的照片和半张线稿，橡皮屑扫在一角·午后
        profile:
          privacy: medium
          visibility: medium
          exits:
          - 画室门对着走廊，走廊另一端是制版房的取稿窗口
          witnesses:
          - 画师
          - 送来样照的跑片伙计
          affordances:
          - 对着照片起月份牌稿
          - 点石印上墙
          - 结束活动并离开
          pressure_modifiers:
          - 交稿给制版的期日
          - 模特还肯坐几个钟点
      制版房:
