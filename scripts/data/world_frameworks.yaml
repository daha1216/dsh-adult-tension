        - activity: 茶憩厅里对一次号码
          place: 浴场茶憩厅与病友席
          pair: 3
      包时缸的客人溺了水:
        source: 帘里的钟点到了没人叩铃，帘外只有侍浴女工听见了那一声水响。
        engines:
        - 旧案重开
        - 攻守易位
        beats:
          trigger: '{npc}隔着布帘听了半刻，问你这一声水响之后，一个无名之人该怎么报官。'
          objective: 在开帘之前定下这一缸水算不算一桩案子
          choice: 可当场开帘救人再报官；可先唤管事来对着号牌核衣冠，或把缸边的铜号先收进袖里
          immediate: 开帘救人的那一刻匿名就到了头，收起的铜号是这桩案子唯一的名字
          near: 报官的笔录里只能写号，问名字的权限还在巡查员手里攥着
        far_trigger: 死因查到浴场的火与煤上时
        far_consequence: 救人的与核牌的各担各的，案子照走；把铜号收进袖里的那位，从此这桩旧案就攥在他手里。
        exits:
        - 把人和号牌都交巡查员与医官，自己退出案子
        - 把铜号挂回总板，就当这一声没听见
