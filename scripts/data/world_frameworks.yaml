      感染检疫隔离点:
        details:
        - 隔离点生活区外侧的取物引导牌对着等候线·午
        - 等候线外侧单设一条不带编号的复核通道，体温异常者只走这一条
        profile:
          privacy: low
          visibility: high
          exits:
