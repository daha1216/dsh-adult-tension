        beats:
          trigger: '{npc}看着时辰牌说这场只批到午夜，灯一断大帐和铁笼车厢都拆不完。'
          objective: 在断灯前排定撤场顺序，不丢装置也不丢人
          choice: 先拆大帐再抬铁笼车厢；把铁笼车厢留在场上过夜；跟场地看守谈多批一个时辰
          immediate: 先拆的那部分当场装车，没拆到的一律加锁并留人值夜
