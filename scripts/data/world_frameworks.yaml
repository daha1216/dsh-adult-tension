      两个身份两头都在催:
        source: 白天单位的排班与夜校的考核撞在同一周，两边都要本人亲自到场，任何一边的缺席都记在档上
        engines:
        - 身份风险
        - 第三方施压
        beats:
          trigger: '{npc}把两边的时间表并排摆出来，问你这一周先顾哪一头。'
          objective: 在不注销任何一边身份的前提下把这一周排开
          choice: 先向一边申请一次正式的改期；或两边的档都先不签，等下周再说
          immediate: 两边的记录都维持原样，未到场的那一次按各自流程留待补办。
          near: 两边都还会再催一次，先改期的那一边可以少记一次缺席。
        far_trigger: 两边同时要求本人到场的那个节点
        far_consequence: 同时缺席会同时触发两边的记录，先做过一次正式改期的那一边尚可挽回；两头瞒着不说则会同时失去两边的信任。
        exits:
        - 向其中一边正式申请改期并留下书面记录
        - 暂不签任何一边的档，退出这一周的安排
