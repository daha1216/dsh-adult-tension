      两个身份两头都在催:
        source: 白天是修理局在册的持证人员，夜里接的是不署名代接人转来的私活，两边的排期已经开始重叠。
        engines:
        - 身份风险
        - 对等试探
        beats:
          trigger: '{npc}把私活的施工单与本人的值班表摊在一起，两条排期撞在同一晚。'
          objective: 在两边撞上之前决定哪一头放掉、哪一头要如实说明
          choice: 可推掉私活并把损失讲清楚；可找同事替班而把私活留下；也可当场把两头都摊给主管看
          immediate: 当班的值守照常去，私活那单原封退回，本人不签任何一份不署名的施工单。
          near: 推掉私活断线替班欠人情，摊开说能把名字拿回来但可能进复核材料。
        far_trigger: 有人在两个场合同时叫出本人名字那一天
        far_consequence: 两头并着走到那天职业资格与私下信誉一起掉，提前放掉一头只丢算得出的一边。
        exits:
