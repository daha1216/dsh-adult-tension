          near: 查货人每趟都会翻一遍角落，认领的人从此带着这把刀的名字接货
        far_trigger: 下一趟查货在同一角落又摸到类似的刀痕
        far_consequence: 认下的人拿到这条线上的话事权，不认的人要在下一次交接时被重新验一遍来历
        bindings:
        - activity: 按暗号连报三次开门
          place: 理发店暗门后地下酒吧
          pair: 2
        exits:
        - 把刀留在原处不作解释，按暗号报完离场
        - 当场认领刀具并接下水槽后的清理责任
      非婚同居在查门夜被撞破:
        source: 两人同住的那间后屋只有一张床，清晨查门的人已经敲到隔壁，床铺和一屋子的私人物件来不及分开。
        engines:
        - 共处密闭
        - 名声保卫
        beats:
          trigger: '{npc}听见敲门声从隔壁传来，后屋里只有一张床、两个人的物件和不到一刻钟。'
          objective: 在门被敲响前决定这段关系对外算不算存在
          choice: 可把一个人的东西全收进柜子、当面认下只是同住省钱；可两人各开一扇门、从后巷分头走；也可以谁都不躲，开门时站在一处
          immediate: 收与不收都只争到几分钟，敲到这一间时谁站在门后是唯一还能定的事
          near: 查门的人会记住这一间开过几扇门，往后这条街上的熟人都会按那次的情形待他们
        far_trigger: 下一次查门时邻屋的人主动提起这一间
        far_consequence: 认下的两人从此被当成一家，不认的两人要在别处重新找一个不会同时出现的地方
        bindings:
        - activity: 按暗号连报三次开门
          place: 理发店暗门后地下酒吧
          pair: 2
        exits:
        - 收好物件开门应付查门，之后各自回各自班次
        - 从那扇后门分头走开，今夜不再见面
      两面将穿帮:
        source: 同一个人白天在报馆排字、夜里在库房对货，两边都开始有人问起对方那个钟点他在哪里。
        engines:
        - 两副面孔
        - 身份风险
        beats:
          trigger: '{npc}发现报馆同班和码头管事在同一天里都问过同一个钟点他在哪儿。'
          objective: 在两边对上之前决定放弃哪一个身份
          choice: 可把报馆那一班辞掉，从此只走货线；可把库房的名字换成别人的、自己退到只认暗号不进簿子；也可以两边都留着，先编一个过得去的说法应付过去
          immediate: 无论选哪一边，另一方当天就能感到这个人变了，问过话的同班会在排字房里多看他几眼
          near: 两边都留的人要靠一次次圆谎撑下去，撑不住的第一次就会是最后一次
        far_trigger: 报馆同班与码头管事在同一个钟点出现在同一条街上
        far_consequence: 被对上的人要么彻底换名换街，要么按被记下的那个名字接下两边的账
        bindings:
        - activity: 把手写引语并排比对末版清样
          place: 报馆夜班排字房
          pair: 1
        exits:
        - 退掉一边班次，只保留一种身份继续来往
        - 两边都不再回应，换一条街重新开始
      名声危机从报馆清样里翻出来:
        source: 旧账被记者写进了还没印的清样，配的是一段没有署名的转述，标题位置正好压在头版。
        engines:
        - 名声保卫
        - 信任透支
        beats:
          trigger: '{npc}在装版台上看到那段关于自己的转述，署名栏是空的，头版位置已经留出来了。'
          objective: 在清样上机器之前决定这段要不要留
          choice: 可请记者把转述改成实名并当面记一次；可只要求把这一段挪出头条、内容照旧；也可以什么都不说，让报纸自己承担
          immediate: 清样还在台子上，改一段就要重排一版，谁改的排字工当晚就会被人记住
          near: 印出去的转述会替当事人把话说完，之后再更正也只是多印一版
        far_trigger: 下一期报纸把这段转述写成系列的第二篇
        far_consequence: 被写过的人失去这条街上的老主顾，想要回名字得先找另一个愿意替他署名的人
        bindings:
        - activity: 把手写引语并排比对末版清样
          place: 报馆夜班排字房
          pair: 1
        exits:
        - 要求改为实名并当场重记一次
        - 不介入清样，把报纸承担的部分留给对方
      密室暗槽在排酒前三十秒:
        source: 库房暗槽的闸门只能开一次，绿灯熄灭到必须排空之间只剩三十秒，而今晚这一柜里有别人寄存的东西。
        engines:
        - 联邦探员突击封门搜查
        - 时限逼近
        beats:
          trigger: '{npc}的手已经扣在暗槽闸门上，绿灯随时会灭，柜里的东西有一样不是这一趟的货。'
          objective: 在三十秒里决定先排出什么、留下什么
          choice: 可照货位簿把整柜排空、连寄存的那一件一起走；可只排出账上有的部分，把寄存的压在槽底；也可以不开闸，让这一柜整柜落到查获清单上
          immediate: 闸门一开就收不回来，排出去的货当夜就散进街面，留下的那一件会在柜底留到最后一次清点
          near: 清点的人两天内就会问起这一柜为什么少了一件，问的时候不会背着人
        far_trigger: 下一次清点在同一号柜又对不上数
        far_consequence: 动过手的人要么把那一件补上，要么把自己的名字填进缺数的那一行
        bindings:
        - activity: 对着绿灯核一遍当夜货位
          place: 密歇根湖畔私酒卸货码头
          pair: 2
        exits:
        - 按货位簿排空整柜，寄存件一并注明去向
        - 不开闸，把这一柜整柜交给当夜清点的人
      比赛前夜乐手的手停在琴上:
        source: 码头工会办的比赛明晚开场，领奏的手从前天起就抬不到该有的高度，替位的人已经等在后台。
        engines:
        - 伤病互护
        - 对等试探
        beats:
          trigger: '{npc}在排练到第三遍时停下，右手停在琴键上方没有落下去，后台等着一个能替他的乐手。'
          objective: 在开赛前决定上台的是谁、由谁来说这句话
          choice: 可让他自己走上台去宣布换人；可两个人一起上台、把独奏段落拆成两半；也可以谁也不换，明晚照原谱上，弹到哪儿算哪儿
          immediate: 决定一出口后台那个替位的人当晚就得知道结果，乐队的合练时间只剩这一夜
          near: 拆开独奏的两个人要在几天内重新合出默契，换下去的人在下一场之前抬不起手就会失去位置
        far_trigger: 比赛当天领奏的手仍然抬不起来
        far_consequence: 上台的人从此拿到独奏的署名，让位的人要在养好手之前接受其他人先替他接话
        bindings:
        - activity: 试合一段旧曲
          place: 理发店暗门后地下酒吧
          pair: 1
        exits:
        - 当晚定下上台的人，其余人按原谱继续合练
        - 不再讨论换人，把决定留到开赛当天的后台
      遗嘱里那间酒吧的归属:
        source: 病床上的店主把地下酒吧写进了遗嘱，宣读安排在明天上午，而密歇根湖那批货的账页仍旧记在两个人名下。
        engines:
        - 遗产之争
        - 债务压力
        beats:
          trigger: '{npc}听说遗嘱明天上午宣读，而库房里那批货的账页还挂着两个名字。'
          objective: 在遗嘱宣读前把账页上的名字和将要继承的东西对上
          choice: 可当夜把两个名字一起请到库房，当面把账页摊开；可只把自己的那一份弄清楚，另一个名字留给遗嘱去分；也可以在宣读之前离开这条街，谁的账都不接
          immediate: 账页一旦摊开就收不回抽屉，请到库房的人会带着各自的见证人来
          near: 遗嘱宣读完的第二天，账页上的名字就要按继承的部分重新分，分不清的部分会挂回原点
        far_trigger: 宣读之后账页上的一个名字始终无人认领
        far_consequence: 无人认领的那一部分会由泊位管事按登记收走，剩下的人要用现金把它赎回来
        bindings:
        - activity: 在查获清单上读出对照名字
          place: 湖上巡警扣押泊位
          pair: 2
        exits:
        - 在宣读前把账页交给遗嘱执行的一方留档
        - 不接账页也不到场，按泊位流程退出这条货线
      后座雪茄与账本缺的那一页:
        source: 车行维修位上那本交货账本摊在防弹轿车后座，缺的那一页正是上码头那晚的出货数；他点着雪茄腾不出手，司机与修车人都在车外，递烟的这一刻他问缺页记了谁的名字。
        engines:
        - 黑帮教父暗账审计之夜
        - 两副面孔
        beats:
          trigger: '{npc}把账本摊在膝上，抬起夹雪茄的手等你坐进后排。'
          objective: 在账本递出去之前决定缺的那一页由谁来补
          choice: 照实说缺页在下码头那晚；把账本原样递过去让他自己翻
          immediate: 雪茄的烟没有散，账本还夹在他手里，车外的两个人都没回头
          near: 补上的一页写谁的名字，下一趟码头的暗号就换谁执掌
        far_trigger: 下一趟货到码头而缺页仍未补上
        far_consequence: 审计落在经手人头上就是一场不容分说的清算；当面补页则这一页成为你在他账上的第一笔字
        bindings:
        - activity: 替她把雪茄递到唇边
          place: 黑帮教父防弹老爷车
          pair: 2
        - activity: 辨认轿车修补痕
          place: 黑帮教父防弹老爷车
          pair: 0
        exits:
        - 把账本留在后座下车，补页之约作废
        - 写明缺页在码头那晚并签名，退出这趟交货
    legacy_sources:
      eras:
      - 一九二八芝加哥禁酒期
      aesthetics:
      - 禁酒令爵士黑帮
      - 芝加哥暗夜交锋
      - 黑色电影
      places:
      - 理发店暗门后地下酒吧
      - 密歇根湖畔私酒卸货码头
      - 黑帮教父防弹老爷车
      - 报馆夜班排字房
      - 湖上巡警扣押泊位
    themes:
    - 爵士合奏中给别人留空间
    - 禁酒年代普通劳动者的休息
    - 记者笔下名声与本人意图
    - 暗号与名单决定谁承担后果
    - 现金与署名撑起的灰色交易秩序
    technology_boundary: 1928年芝加哥使用电话、纸报、打字机、唱片和照片；没有便携磁带录音、即时发布或现代复古车展。地点名中的老爷车指当时仍使用的加装防护轿车，修车人与司机称其为轿车，改装不等于无敌。货位簿、暗号板与查获清单均为纸质，交接信息靠人嘴与纸面传递，打电话要到街角店铺或报馆电话间去打。
    bridge_status: not_required
  长安夜市与坊志:
    eras:
    - 盛唐长安百鬼夜行
    aesthetics:
    - 盛唐诡谲奇谭
    - 长安夜行风物
    - 工笔华服
    rule: 人、精怪与方士共同生活在坊市中，宵夜、营生和登记各循不同节奏；闭坊鼓六百响毕，坊门落锁，街心奔跑者不再就地立斩，改由巡夜队羁押至次日坊正候审；夜里有另一套规矩，强者若当场立规矩，须先自报所属坊与名籍，人、精怪、方士同名同待，事后由坊正核录方才作数；有些名字不能提，提了要有人担。
    social_rule: 只有当事人能确认自己的名籍，代写者不能代替签认；真名不是可以随口叫的称呼，而是名籍册上由本人按印的那一笔，神谕也不能替人解下这一笔，越权代认者须由坊正当众更正。
    places:
      长安地底暗渠方士石坛:
        details:
        - 暗渠石坛高出常水位，试灯只在靠梯的干台进行
        - 壁上三盏符灯对应不同支渠，反光会把颜色映到水面
        profile:
          privacy: medium
          visibility: low
          exits:
          - 沿值守人确认畅通的石梯回地面，不下水追灯
          witnesses:
          - 守渠方士
          affordances:
          - 试认水路灯号
          - 辨别符灯与水面倒影
          pressure_modifiers:
          - 水位与回声
          - 守渠人确认的灯位
      大雁塔顶避风藏经阁:
        details:
        - 大雁塔顶架空藏经阁的避风侧摆着借阅抄本
        - 窗缝风动纸角，钟响时守阁人准备收卷
        profile:
          privacy: medium
          visibility: low
          exits:
          - 顺塔内原梯下行至寺院，不从外檐绕行
          witnesses:
          - 守阁僧人
          affordances:
          - 共校坊市旧志
          - 比对旧街名与口述别称
          pressure_modifiers:
          - 借阅时段
          - 风势与抄本保存情况
      城隍庙后院:
        details:
        - 城隍庙后院灯棚架着用旧的竹路签
        - 灯匠在石案上重贴破损纸面，供行人试认回程图案
        profile:
          privacy: low
          visibility: high
          exits:
          - 经庙侧门回坊内街道，闭坊前各自归家
          witnesses:
          - 庙祝与自愿帮工的摊主
          affordances:
          - 修补灯市路签
          - 在灯下试认巷口图案
          pressure_modifiers:
          - 竹签与糨糊干燥时间
          - 各坊当夜获准开放范围
      平康坊顶层花魁琴房:
        details:
        - 顶层琴房的槅扇外就是坊墙，窗下能看见整条巷子的灯
        - 案上压着一份写了一半的曲牌与未署名的邀帖
        profile:
          privacy: high
          visibility: low
          exits:
          - 沿内梯下到后院，经角门由相熟的人领出
          witnesses:
          - 房内伺候的侍女
          affordances:
          - 在曲牌上当场改一段
          - 把邀帖当面退回或留下
          pressure_modifiers:
          - 琵琶声能传出多远
          - 坊内谁在打听这间房今晚有客
      朱雀大街悬灯长街:
        details:
        - 街两侧的灯棚一路挂到坊墙下，火把与灯笼交替排开
        - 街心留出一条空道，供给夜巡的马队与更鼓车通行
        profile:
          privacy: low
          visibility: high
          exits:
          - 就近拐入未落锁的坊门，或退回侧巷等巡队过完
          witnesses:
          - 沿街收摊的夜市摊主
          - 整队经过的金吾卫
          affordances:
          - 在空道两侧把货收完
          - 等巡队过完再横穿街心
          pressure_modifiers:
          - 更鼓已响到第几声
          - 街心空道是否已被封
      西市胡商货栈:
        details:
        - 货栈里堆着未清点的箱笼，胡商在柜前点着蜡记账
        - 后院的栅门通着一条仅容两人并行的窄巷
        profile:
          privacy: medium
          visibility: medium
          exits:
          - 从货栈正门走上西市街面，或走窄巷绕开巡队
          witnesses:
          - 守货栈的伙计
          affordances:
          - 当面对一份货单的来路
          - 把没结清的账留到下次
          pressure_modifiers:
          - 货栈打烊的时刻
          - 窄巷是否还有灯
      曲江池畔柳堤:
        details:
        - 堤上柳枝垂到水面，远处是尚未散尽的画舫灯火
        - 堤边石凳上留着一盏没人收走的纸灯
        profile:
          privacy: medium
          visibility: medium
          exits:
          - 沿堤走到曲江坊门，或原路折回城内
          witnesses:
          - 堤上散步的其他游人
          affordances:
          - 把没说完的话在堤上说尽
          - 把纸灯放回水里送走
          pressure_modifiers:
          - 城门与坊门的闭门时辰
          - 堤上还有多少人在
      西市后巷夜行医馆:
        details:
        - 医馆门面朝着西市，后门开在一条不通车马的窄巷里
        - 药柜最上一格锁着，案上压着一本只记症状不记姓名的诊册
        profile:
          privacy: high
          visibility: low
          exits:
          - 经后巷侧门离馆，不走过市街
          witnesses:
          - 坐堂大夫与打下手的人
          affordances:
          - 在不问来路的前提下处理伤口
          - 把当夜的记录只落在症状一栏
          pressure_modifiers:
          - 药箱里还剩多少熟艾与布条
          - 后巷的灯是否被人盯上
    pairs:
    - family: 权力与治理
      position: 同侪
      appellations:
      - 先生
      npc:
        role: 坊市书吏
        function: 受理摊主自报信息，核对坊门与摊位通知
        authority: 能暂停本人抄错的待发通知，名籍更正需本人及坊正确认
        resource: 旧坊图、分栏名册与已确认的开门时段
        limitation: 不能替人或精怪认定身份，也不能命令方士开水闸
        obligation: 把待核名字与可公开摊位消息分开
        exposure: 错发通知会使摊主错过开市，需向本人补救
      player:
        identity: 夜市灯彩匠
        baseline: 你知道一个小图案能让不识字的人认路，也愿请书吏解释旧称的来由。
        resources:
        - 路签修补包
        - 走过坊巷的记忆
