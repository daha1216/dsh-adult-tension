          objective: 核对预约并协商分时使用
          choice: 先联系另一组住户；提议另选日期不再争这一次
          immediate: 两组先各留出入通道，不把桌椅搬满来抢占空间。
          near: 策划人与另一组当面协商短时共用或分时，小聚会可留在原桌而不扩大。
