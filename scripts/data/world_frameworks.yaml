        - activity: 在擦身长凳上翻一次面
          place: 侍浴女工的擦身长凳
          pair: 0
      女士日的时栅改了:
        source: 性别分日的栅格改了一格，男客的钟点挪到了她当班的那一天。
        engines:
        - 名分悬置
        - 情感拉扯
        beats:
          trigger: '{npc}把改过的时栅木牌翻给你看，说改的这一格让两个本可永不相见的人落进了同一池雾。'
          objective: 在新的时栅立住之前，决定这一格改不改回去
          choice: 可把木牌翻回原样只当没看见；可顺着新栅把钟点换到同一天，或去柜台把这一格的来由问清
          immediate: 木牌翻回去就谁也没来过，立住了则下个时日两个号照旧同池
          near: 改栅的来由记在市政的告示上，浴场只管执行不问为什么
        far_trigger: 时栅再改一格、全城作息重排时
        far_consequence: 翻回去的人把那场相遇还给雾，名分上谁也没欠谁；立住新栅的，白天的礼法迟早找上这两件衣冠。
        exits:
        - 告假避开改栅的那一天，钟点让出去
        - 把木牌钉死成新栅，来由不问
        bindings:
        - activity: 租一缸包时的热水
          place: 包时独浴缸间
          pair: 0
        - activity: 打烊前管事来收号牌
          place: 更衣号房长廊
          pair: 2
      浴场要卖给了铁路公司:
        source: 清盘前的最后一夜，铁路公司的代理人明天来贴封条，「全场包时」的票只售一张。
        engines:
        - 时限逼近
        - 组织更迭
        beats:
          trigger: '{npc}把最后一张全场包时的票压在柜台上，说清盘的封条明早就到，这一夜整座浴场归一张票。'
          objective: 在封条贴上之前，把这一夜的钟点给出去、把该走的送走
          choice: 可买下这一夜自己定规矩；可把票让给等了三年的那枚号，或按章程把这一夜原样空着
          immediate: 票落到谁手里，打烊后整座浴场就归谁到天亮，总板也归谁核
          near: 封条一贴，号房里的衣冠三天内要各归各家，总板上的对应就此作废
        far_trigger: 铁路公司的封条换锁、号房清空那三天里
        far_consequence: 拿到那一夜的人把两个世界最后对了一回；让出去的，雾里从此再没有那个号；空着的，总板连同一整场匿名一起进废纸车。
        exits:
        - 把票钱散给煤行的老主顾，浴场的事不再沾
        - 收拾自己的号房，天亮前把衣冠领全
