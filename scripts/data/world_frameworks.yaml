          place: 社区诊所夜诊室
          pair: 6
      巡检犬的镇静剂见底:
        source: 巡检犬的镇静剂只剩两支，台账上还写着五支，犬只状态一不合格整段停检且没有替补犬。
        engines:
        - 资源锁定
        - 时限逼近
        beats:
          trigger: '{npc}在隔离段外把空药盒摊开，说照这个用量撑不过下半个月，而下半月正是雨季。'
          objective: 在药剂见底之前把犬只排班与台账口径对齐
          choice: 可如实补记台账并申请补货；可提议降低单次用量把班次撑到月底；也可直接停用犬只改为人工巡检
          immediate: 犬只当天不带进廊，用量与剩余支数按实际写进台账，不出借任何一支给别的队。
          near: 补货雨季前不一定到，省用量推高犬只风险，停用则整段改人工。
        far_trigger: 雨季第一场连续降雨到来那天
        far_consequence: 药剂没补上硬带犬进廊一旦受惊责任先落训导员，台账写实的人至少能说清去向。
        exits:
        - 停用犬只，整段改人工巡检
        - 如实补记台账，按规定申请补货后离场
        bindings:
