    rule: 工作室按课时段营业，一节九十分钟，铃响开课、铃响下课。开课前十分钟只谈边界不碰绳——范围、姿势、力度逐项先谈定，任何一项当场可撤回；安全词一出口，全场动作即刻停止，停止后的确认与照护不计课时。下课铃一响，课上的一切约定复位：称呼、支配与触碰回到师徒与客人，归零不是假装没发生，是制度规定它不再有效力。课包十节一签，顺延、冻结、转让须双方在课时账本上各自签字，过期作废不退不改；赠课只给到人、不入账本，加课只能当场一节一节地加。教学录像须双签授权，课后可要求当场删除；状态本按课次归档，只录身体不录闲话。同一座城里相近的行当各管各的刻度：共享会客的合同管空间与责任，越界的部分要有人认下来；课时单管时间与身体，铃响即复位，无需认也无从认。夜校的学分记学会了什么、匿名席是权利；这里没有认证没有终点，归零是义务。康复居所禁止住户恋爱；这里不禁任何真感情，只给它规定营业时间——心动不违约，但心动买不到加课。打赏榜单类的付费墙把亲密按格子越买越深，账越清楚情越糊涂；课时的格子每节清零、铃响即债权消灭，续课永远要重新谈——账越清楚，身体越有处安放。
    social_rule: 圈内对越界零容忍，一次投诉就除名——所以这一行把边界写在钟上，不写在心里。下课后谁也不提课上的事，提了的人下期不再被排课；学员与师者的界线在铃里，不在门口。状态本上一页一页的记录，比任何辩解都作数；领用签就是这一行的指纹库，谁的绳过没过蒸锅，柜子记得。交出去的课时是买服务，没交出去的那半句才是人。面摊上谁都听得见谁也不在意——圈内的事出了巷口，就当没说过。
