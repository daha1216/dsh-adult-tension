          immediate: 窄处不再安排双向同行，所有人知道返岸舷梯在哪；停泊许可到船主回船那一刻为止
          near: 以后的水边邀约能按各自舒适程度分组；船主回船后看到便条，落款的人要自己认下来
      标记夜空方位:
        places:
        - 山顶观星台
        pairs:
        - 1
        category: 信息交换
        action: '{npc}遮好白光屏幕，用手指示星图与天际线，请你找一组亮星；半山的接驳车最后一趟快到点了。'
        beats:
          trigger: '{npc}遮好白光屏幕，用手指示星图与天际线，请你找一组亮星；半山的接驳车最后一趟快到点了。'
          objective: 学会用一个可靠参照独立定向，并在云量变化时知道还能等多久
          choice: 试找亮星；不观测改下山；或在云多时只练星图方位；也可先定下等云的时间上限
          immediate: 玩家能复述一组方位；看不见的星群不记作观测成功；下山时刻一并说定
          near: 下次可自己架稳观测方向，不必依赖摄影师代找；错过接驳车只能沿步道走下来
    customs:
    - 观测点的留言簿鼓励记录当时的云量，不要求每页都有清晰照片。
    pressures:
      观测预约因天气调整:
        source: 场地管理者调整了观测开放时间
        engines:
        - 时限逼近
        - 资源锁定
        beats:
          trigger: '{npc}收到消息：场地管理者调整了观测开放时间。'
          objective: 确认能否改期及各自的行程
          choice: 另选室内展览，或分别继续旅程
          immediate: 本时段望远镜位关闭，但山下展厅与返程接驳仍开放。
          near: 摄影师愿等次日云隙，领队需决定是否增加一晚住宿，各自单独确认；多加的一晚按当日房价现结，谁多留谁自己付，等不到云隙就当这次没有观测。
        far_trigger: 改期超过一人的返程日期
        far_consequence: 观测改为独自完成，未参加者不承担额外住宿费，照片日后可另寄。
        exits:
        - 取消观测预约并沿山径回接驳点
        - 只看室内展览，不延长住宿
        bindings:
        - activity: 标记夜空方位
          place: 山顶观星台
          pair: 1
        - activity: 在山径岔口决定下撤时间
          place: 灯塔值守屋
          pair: 0
      回程票只剩一张:
        source: 船期一周只发两班，回程票只剩一张，改签要另付整程差价，多留一晚就得自己补房钱。
        engines:
        - 时限逼近
        - 资源锁定
        beats:
          trigger: '{npc}拿到票务回执，上面写着这一程只剩最后一个座位，改签窗口开着但差价要现结。'
          objective: 在开航前弄清谁走谁留，以及留下的那一晚怎么算
          choice: 让一个人先走；两人都改签；或当场订下留宿再定回程
          immediate: 座位先锁定不落名，改签差价与房费各自写下
          near: 开航前一刻必须落名，没落名的那张票退回票池，谁都可能被下一位买走
        far_trigger: 开航当日仍无人落名
        far_consequence: 座位被候补买走，留下的人要等下一班并自付多出的住宿，先走的人单独结账离岛
        exits:
        - 一人先走，另一人留宿等次班
        - 两人都改签到同一天，差价各付一半
        bindings:
        - activity: 在候车厅核对两张票
          place: 回程前的空车站
          pair: 0
      暴雪封路导致滞留:
        source: 暴雪把出岛公路封了，放行时间不定，服务区热水与卫生间是唯一不涨价的东西，滞留期间的住宿要自己解决。
        engines:
        - 时限逼近
        - 资源锁定
        beats:
          trigger: '{npc}站在封路告示牌下，路政员说今晚不会放行，而车上油只够撑到明早。'
          objective: 在被困的这一夜里把住处与去留各自定下来
          choice: 在服务区等放行；分开找能睡的地方；或掉头回上一个镇子
          immediate: 车留在服务区，人在哪个车位过夜各自说清
          near: 放行时间决定后面几程能不能接上，等下来的人会发现票已经过期
        far_trigger: 放行后原订的船班与车次已全部错过
        far_consequence: 整段行程重排，各自重新订票；提前改道的人损失小得多
        exits:
        - 放弃原路线，改走绕行公路
        - 留在原地等放行，接受行程缩短
        bindings:
        - activity: 在封路告示前商量去留
          place: 高速公路服务区
          pair: 0
        - activity: 在露营营位板上调整安排
          place: 露营营地
          pair: 1
      签证到期:
        source: 一次签的入境期限写在附页上，到期当天必须离境，逾期记录会跟着走，改签要重新面签。
        engines:
        - 时限逼近
        - 身份风险
        beats:
          trigger: '{npc}翻到附页，发现这次入境还剩不到两天，而原订的船在后天。'
          objective: 在期限前把离境这一段接上
          choice: 改签提前走；申请延期；或走陆路出境换更快的一程
          immediate: 离境日期被写定，续办的一栏先空着不去填
          near: 逾期一天就留记录，往后每次入境都要解释这一次
        far_trigger: 期限当日仍无离境安排
        far_consequence: 逾期成立，后续的入境与登记都要多走一轮审查；提前改签的只是损失差价
        exits:
        - 按期离境，未用完的行程作废
        - 当面申请延期，按批下的天数重新排
        bindings:
        - activity: 在面签窗口把材料摊开
          place: 签证面签候谈室
          pair: 1
      签证面签:
        source: 面签窗口当天只剩最后几个号，材料里凡是有别人名字的那一栏都要单独说明，答错一次就要重新排号。
        engines:
        - 身份风险
        - 时限逼近
        beats:
          trigger: '{npc}在候谈室被叫到号，窗口推回一页材料，指出上面有一栏是别人的名字。'
          objective: 在窗口关之前把这一栏说清或撤回
          choice: 当场解释；撤回那一栏重填；或取回材料改日再来
          immediate: 材料退回本人手上，号过了可以重取，这次不算失败
          near: 重填之后还要再排一次号，当天的名额未必还有
        far_trigger: 当日号放完仍未办妥
        far_consequence: 这一趟行程作废或改期，同行者各自决定等不等；材料备齐的可当日补办
        exits:
        - 撤回有争议的那一栏，当天办完
        - 取回全部材料，改日单独来办
        bindings:
        - activity: 在面签窗口把材料摊开
          place: 签证面签候谈室
          pair: 1
      冷战第三天:
        source: 两个人从第三天起只在必要的事上开口，房间照订同一间，行程照按原计划走，谁都不肯先提那天晚上。
        engines:
        - 信任透支
        - 共同秘密
        beats:
          trigger: '{npc}把行李放回同一间房，然后一句话也没说，等你先开口。'
          objective: 在不道歉也不翻旧账的前提下把这几天的行程走完
          choice: 先开口说正事；继续沉默；或干脆把住处分开算
          immediate: 住处维持原样，行程按表走，谁也不欠一句解释
          near: 同住一间的日子越久，第三方越容易把沉默读成关系还行
        far_trigger: 行程结束前仍无人先开口
        far_consequence: 这段沉默变成事实版本，回去之后往来的分寸再改就得靠一次正式的摊牌
        exits:
        - 其中一人先开口，把那天说完
        - 行程结束后各走各的，不再同路
        bindings:
        - activity: 补订一间加住房
          place: 海岛度假村
          pair: 1
      旅行结束前最后一晚:
        source: 最后一晚与明天那班船之间只隔几个小时，说出口的话没有第二天来兜底，天亮之后两个人各自回到原来的行程。
        engines:
        - 时限逼近
        - 体温依赖
        beats:
          trigger: '{npc}在收拾行李时停下来，问最后一晚到底算不算数。'
          objective: 在天亮前说清今晚的话算不算承诺
          choice: 把话说完；什么都不说；或约好回去之后再说
          immediate: 今晚的说法只停在今晚，明天照原样登船
          near: 天亮之后两个人都照原行程走，谁也别拿这一晚当留下的理由
        far_trigger: 分开之后一方拿这一晚去改变另一方的安排
        far_consequence: 原行程被打乱，说清过的人不必为此负责；没说清的就要再花一次机会
        exits:
        - 各自按时登船，把这一晚留在这里
        - 其中一人改签留下，把行程重排
        bindings:
        - activity: 在末班渡轮上说到底
          place: 最后一班渡轮
          pair: 0
      今夜话没说完:
        source: 话题每次都停在同一个地方，因为一旦往下说就要牵扯到回程安排，两个人各自把那半句收回去很多次了。
        engines:
        - 共同秘密
        - 信任透支
        beats:
          trigger: '{npc}说了一半又停住，低头去看手里那张已经被折软的时刻表。'
          objective: 在行程结束前把那半句说出来
          choice: 接着往下问；就此停住；或换个不提回程的话题
          immediate: 话停在哪里，这一晚就停在哪里，谁也不必把它补完
          near: 收回去的次数到了下一次就变成默认不提，此后开口的代价翻倍
        far_trigger: 一同出行结束仍无人把话补完
        far_consequence: 这半句话往后每次见面都会被绕开，最后变成两个人都说不清的旧账
        exits:
        - 当场把话说完，接受对方的回答
        - 一人把时刻表收起来，暗示这事不再谈
        bindings:
        - activity: 在候车厅核对两张票
          place: 回程前的空车站
          pair: 0
        - activity: 在游艇便条上补完半句话
          place: 私人游艇
          pair: 1
      谁也不欠谁:
        source: 两个人从出发起就把账分得很清，房费各付一半，饭钱轮着来，谁也没多花对方一分钱，于是谁也说不出口自己其实想要什么。
        engines:
        - 信任透支
        - 对等试探
        beats:
          trigger: '{npc}把小票推到桌子中间，一笔一笔对着算，问这一顿该谁付。'
          objective: 在账目之外说出一样不算钱的东西
          choice: 照分照付；主动多付一次；或留下一样不算钱的东西
          immediate: 账当场两清，账外那件事停在未提
          near: 分得越清，往后越难用欠一笔来把人留住，谁也找不到留下来的名义
        far_trigger: 整趟行程结束仍没有任何一笔账是含糊的
        far_consequence: 两个人回到各自的行程里再也没有往来的由头；主动含糊过一次的至少留下一个可以提起的由头
        exits:
        - 各自结清，行程结束不再联系
        - 留下一句说得清的承诺，作为下次见面的由头
        bindings:
        - activity: 在退房口排一次队
          place: 海岛度假村
          pair: 1
      体温依赖:
        source: 山里与甲板上的夜里都冷，两个人习惯了靠在同一个背风处取暖，习惯一旦养成就分不清是想靠还是只是冷。
        engines:
        - 体温依赖
        - 共同秘密
        beats:
          trigger: '{npc}把外套搭到两个人中间，问今晚还照昨天那样坐。'
          objective: 分清两个人是靠习惯还是真要走下去
          choice: 照旧靠着；把外套还回去；或干脆把话说开
          immediate: 外套在谁身上过夜就留在谁那儿，天亮再还
          near: 天气一回暖，靠在一起的理由就没了，剩下来的部分要重新说
        far_trigger: 行程结束、天暖之后两人仍只靠这个理由待在一起
        far_consequence: 一方发现另一方只是怕冷，关系当场作废；说清楚过的照各自的安排继续
        exits:
        - 把外套还回去，各自回舱睡觉
        - 当面说清不只是冷，从此照这个名义往来
        bindings:
        - activity: 在观星台等一次云隙
          place: 山顶观星台
          pair: 1
      渡船码头临时改用:
        source: 船方通知本次航行改靠另一处码头，到港后的接驳随之改变，改签要按新港的时刻表重排。
        engines:
        - 时限逼近
        - 资源锁定
        beats:
          trigger: '{npc}听到船上广播，请你一起向值班船员确认新的靠港点。'
          objective: 确认本船靠港点与到港后的交通，不在航行中离船
          choice: 查询新靠港点接驳；或靠港后各订后续班次，结束同行
          immediate: 船员确认本船改靠另一港，不能在航行中离船；先核对到港接驳。
          near: 长线接驳多花路费，同行者可各订后续车次，不互相留票。
        far_trigger: 新靠港地最后接驳车与后续预订冲突
        far_consequence: 须改签后续行程或自费留宿，原先约好的共同拍摄可能取消。
        exits:
        - 靠港后各自转乘，不再同行
        - 回客舱休息，将接驳查询交给船方服务台
        bindings:
        - activity: 记录港湾夜景
          place: 夜航渡轮
          pair: 0
        - activity: 试走停泊参观路线
          place: 私人游艇
          pair: 0
      灯塔窗口一线稳定带:
        source: 稳定带只在潮差两小时内贴岸成形，出海后信号断三十六小时，误一次就要等到下一个天文潮；报告窗口与替班人同时签字才算交付。
        engines:
        - 时限逼近
        - 资源锁定
        beats:
          trigger: '{npc}把台面上的潮汐表推过来，上面围着今夜那两小时画了一圈，而海面已经起风。'
          objective: 在两小时窗口闭合前决定报不报，并说清带不上去的代价归谁
          choice: 按表截止报告；改报下一个天文潮；或拿旧数据先顶一次
          immediate: 报告只签下一半，另一半的名字空着，出海指令暂不下达
          near: 窗口一关就只能等下一个天文潮，拿旧数据顶过去的一次，后面每一次实测都会被拿来对账
        far_trigger: 下一个天文潮到来前仍不更新
        far_consequence: 该窗口的数据转为存疑不参与后续比对，替班人不承担责任；按表停报的只是缺一次。
        exits:
        - 当场报下实测数据，两人各签各的部分
        - 收回报告离开值守屋，等下一个天文潮再来
        bindings:
        - activity: 整理公开灯塔照片
          place: 灯塔值守屋
          pair: 1
      只剩开船前十五分钟的甲板:
        source: 租船合同把输送责任写给上船的人，船一离码头未报备的东西就只能丢开，开船前十五分钟是最后一次点验。
        engines:
        - 资源锁定
        - 时限逼近
        beats:
          trigger: '{npc}跨过舷梯站在甲板口，把点验单递给你看，问还有哪一件要上船。'
          objective: 在解绳前把带上船的东西点完，并说清没带上的怎么算
          choice: 照单点验；丢下不必要的那件；或改签下一般船
          immediate: 点验单只签一人的名字，另一件留在码头寄存柜，船没开
          near: 离码头后未报备的东西不再找回，改签后那一般船的到港时间要重算
        far_trigger: 开船后才发现有东西没上船
        far_consequence: 本航次不负责返回取物，失物按码头寄存期限处理；改签的人只损失一段时间。
        exits:
        - 当场存包下船，不再回船上取物
        - 退回候船厅改签，把行李整件重拉一遍
        bindings:
        - activity: 记录港湾夜景
          place: 夜航渡轮
          pair: 1
