        - 配给断供
        beats:
          trigger: '{npc}把煤行的涨价单拍在柜台上，说这一冬的煤只够烧热两池，第三池今晚就得凉。'
          objective: 在有限的火里决定哪一池活着——处方池、公众池还是包时缸
          choice: 可把火全紧着处方池烧；可公众池减半价减半热，或包时缸的价往上翻三成
          immediate: 凉下去的那一池当晚挂出歇池木牌，烧着的两池汽都矮了半截
          near: 煤车三天来一趟，水位看天，减热的池子一冬天攒不下老主顾
        far_trigger: 煤荒拖到封港、水车井上冻那一周时
        far_consequence: 全力保处方池的，全城病痛记浴场一份情；减价减热的，客人流向别家，开春的煤账反倒更紧。
        exits:
        - 把包时缸整个停了，火只归两池
        - 接下煤行的高价先烧一个月，看煤荒过头没有
