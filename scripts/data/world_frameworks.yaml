        - 油桶用粉笔在桶壁上划着剩下的格数，一格代表一班电
        profile:
          privacy: medium
          visibility: medium
          exits:
          - 从后侧铁门退回楼栋院墙内侧，不翻越围挡
          witnesses:
          - 轮值的楼栋电工
          affordances:
          - 核一遍油桶上还剩几格
          - 记下这一班开机的起止钟点
          pressure_modifiers:
          - 油料余量还够几班
          - 哪几户必须在通电时段办事
      闭环小区临街快递分拣棚:
        details:
