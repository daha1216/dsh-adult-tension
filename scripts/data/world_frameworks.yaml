    themes:
    - 各行业共用一个钟点的代价
    - 工匠署名和维修劳动的差别
    - 雾城公共秩序里的小型照料
    technology_boundary: 场景取维多利亚中后期的机械钟、怀表、港口电报和煤气灯条件；不使用电子同步、数字病历或现代监控。港务正式船期须向有权部门确认，钟表匠只能校仪器；哥特气氛不赋予旧钟预言能力。封港大雾期间港务所靠泊登记与旅店铺位号牌为纸质封存，港务街零工按铜号牌先后派工，帽店靠蒸汽铜管升降试帽镜台，交易所对面的茶房是街区等行情与暗谈的公开场所；上述设施均不进任何私人账目。
    bridge_status: not_required
  明治洋裁与译书町:
    eras:
    - 明治东京
    aesthetics:
    - 和风物哀
    - 旧年代质感
    rule: 新式店铺与旧街坊并存，译书、洋裁和手工招牌改变日常；街面上礼数大于实话，铺号门帘挂了什么字样，客人就按什么身份待你，账目与新词都先落在可更换的标签上，翻脸之前没有人先撕破脸。
    social_rule: 译稿的改动与店铺定制需求都须由委托人确认；试衣间帘后那半分钟属于本人，铺里只记住帘子拉了几寸，不问里面换了什么，替人认下订货或代签校样者由行会共议处置。
    places:
      洋装裁缝铺:
        details:
        - 洋装裁缝铺裁桌上铺着同名却手感不同的布样
        - 脚踏缝纫机由店内裁缝使用，借来的样册不从书页上剪取材料
        - 铺后试衣间只挂一道布帘，帘杆上刻着几道深浅不同的旧痕量长·午
        profile:
          privacy: medium
          visibility: medium
          exits:
          - 归还借样后经店面门离开
          witnesses:
          - 铺内裁缝与掌柜
