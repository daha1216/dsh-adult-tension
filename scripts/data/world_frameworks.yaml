        - activity: 谈一份一卷一约
          place: 会客室与委托单抽屉
          pair: 0
        - activity: 当场封袋双签
          place: 底片柜与指纹封袋架
          pair: 0
        exits:
        - 按单交割，把这卷的记忆还给客人
        - 加洗权折价买断，袋子留在柜里
      花名对上了真名:
        source: 一张漏收的外卖单让花名和城里一位体面人挂上了钩，名册还在柜顶睡，倒计时从今晚开始。
        engines:
        - 秘密暴露倒计时
        - 名声保卫
        beats:
          trigger: '{npc}把那张外卖单压在名册底下，说花名和真名如今隔着一张收据的距离，今晚睡不睡得着就看它。'
          objective: 在花名与真名被对上之前，把这张单子从世上清出去
          choice: 可当面烧掉单子了事；可把名册整本挪柜换锁，或托人查清到底是谁漏收的单
          immediate: 单子在，倒计时就在；烧掉的那张换不来安稳——谁知道有没有第二张
          near: 体面人那边先坐不住，托的话一层层递进巷子；名册每挪一次，一整墙名字跟着挪一次
        far_trigger: 第二张对得上的单据出现或体面人正式找上门时
        far_consequence: 清干净的保住一墙花名也保住一位体面人；清不干净的那一夜，花名、卷号、真名在同一页上见了光——这一行二十年的口碑，够塌两回。
        bindings:
        - activity: 显影一位主人到场的卷
          place: 暗房与显影盘
          pair: 0
        - activity: 橱窗前接待一位生客
          place: 临街样片橱窗与接待卡座
          pair: 0
        exits:
        - 名册整本封柜停用，等风头过完再开
        - 把名册交由第三方封存，本人不再经手
      烧掉的卷要加洗一张:
        source: 七年前当面烧片成交的老客回来，要求从「已经烧掉」的那卷里加洗一张——他不信它真的烧了。
        engines:
        - 旧事追索
        - 信任透支
        beats:
          trigger: '{npc}把七年前那页烧片记录翻出来，灰烬袋的编号还在，她说老客明天就坐进卡座，问你这一关怎么过。'
          objective: 在老客坐进卡座之前，把「烧了就是烧了」这句话站住
          choice: 可拿登记簿和灰烬袋当面自证；可请当年的见证人再来一趟，或私了补一次等价的赠拍
          immediate: 灰烬袋摆出来，编号对上了，可「加洗一张」的要求还压在桌上；自证清白和给出交代是两回事
          near: 老客信了，这一页翻过去；不信的从此逢人便讲那卷「没烧干净」——口头资产比底片更不禁传
        far_trigger: 老客把「没烧干净」的说法讲给第三个人听时
        far_consequence: 自证到底的保住行规也伤了一段旧交；私了赠拍的开了口子，往后每一卷「已烧」都能被一张加洗撬开——这一行最重的承诺，从第一张破例起就不重了。
        bindings:
        - activity: 灯箱上一格一格选片
          place: 选片灯箱台
          pair: 0
        - activity: 器材间里倒一卷带
          place: 器材间与倒片台
          pair: 1
        exits:
        - 当面开柜亮出灰烬袋，婉拒到底
        - 以一次免费重拍抵那张加洗，换个两清
      封袋上少了一枚指纹:
        source: 昨夜那卷的封袋只有一枚指印，登记簿上却签着两个人的名——谁的手印没按上，谁也想不起。
        engines:
        - 记忆缺口
        - 身份风险
        beats:
          trigger: '{npc}把昨夜那只封袋举到日光灯下，袋口一行只有一枚指印，两个人的签名倒都齐齐落在登记簿上。'
          objective: 在这一卷入柜之前，把少的那一枚指纹想起来
          choice: 可两个人当面对一遍昨晚的每一步；可各自按一枚新印补封重签，或就这么入柜让登记簿替记忆背书
          immediate: 封袋重封，指印齐了，可谁也想不起昨晚断在哪一步；登记簿的白纸黑字压过了记不清的夜
          near: 想不起来的那段成了两个人共有的空白——补封的袋子守得住行规，守不住各自心里的那一格
        far_trigger: 同一批卷里第二只袋子也少了指印时
        far_consequence: 当面对齐的把那晚补成两个人共同的版本；靠登记簿背书的，往后每次开柜都要对一眼袋口——空白不会消，只会换个地方悬着。
        bindings:
        - activity: 当场封袋双签
          place: 私房布光间·内帘
          pair: 1
        - activity: 谈一份一卷一约
          place: 会客室与委托单抽屉
          pair: 2
        exits:
        - 这卷当面拆封重签，作废原先那行
        - 封袋原样入柜，登记簿加注存疑
      共用的暗房进了第三人:
        source: 四把钥匙的暗房，红灯亮着，帘后站着不该在的人，手里的显影夹没停。
        engines:
        - 共处密闭
        - 第三方施压
        beats:
          trigger: '{npc}在红灯下侧过身，让出半格显影盘的位置——帘后那个不该在的人手里的夹子，正伸向你的卷。'
          objective: 在药水走完之前，把不该在的人从这一盘前面请开
          choice: 可按行规请出去重锁门；可停下计时当面问清来路，或把自己的卷先捞出来止损
          immediate: 红灯下不许说话的规矩破了，计时钟还在走；被请出去的人记住了这间暗房，你的卷也记住了这双手
          near: 四把钥匙的去向当晚要对一遍；多出来的那道人影，往后每次排暗房都在
        far_trigger: 那人第二次出现在红灯下或钥匙对不上数时
        far_consequence: 换锁重配钥匙的把行规矩回来，共用暗房的信任从头再谈；没对清的，每一卷显影都可能多一双眼睛——显影必须主人在场这条规矩，就从这间暗房开始烂。
        bindings:
        - activity: 显影一位主人到场的卷
          place: 暗房与显影盘
          pair: 2
        - activity: 当场封袋双签
          place: 底片柜与指纹封袋架
          pair: 1
        exits:
        - 当场合影留证，暂停共用暗房
        - 四把钥匙收回统一排期，本人退出这间暗房
      车库交接扫进了记录仪:
        source: 交卷的三十秒，进口闸的行车记录仪正好在转——车牌归物业，影像归谁没人说得清。
        engines:
        - 定位共享
        - 嫉妒与独占
        beats:
          trigger: '{npc}隔着半开的车窗把纸袋递过来，压低声音说闸口的记录仪今晚一直在转，问这卷还交不交。'
          objective: 在影像落到不相干的人手里之前，把这次交割做完或做废
          choice: 可照交不误赌没人会翻；可改约白天当面交割，或先托物业按隐私流程把那段影像抹掉
          immediate: 纸袋在两只手之间停的那两秒进了存储；交割成的，归属已定，画面却多了一份谁也管不着的副本
          near: 记录仪的保存期就那么几天，可谁先开口去抹，谁就先承认那三十秒有讲究；同行知道了，眼红的话比影像传得快
        far_trigger: 影像保存期最后一天或有人调阅那段录像时
        far_consequence: 赌对的这一卷安安稳稳进了柜；赌错的，交割的画面成了旁人手里的谈资——底片归属争了半天，先流出去的反倒是车库那三十秒。
        bindings:
        - activity: 深夜车库交一卷底片
          place: 地下车库的取景车
          pair: 2
        - activity: 深夜车库交一卷底片
          place: 地下车库的取景车
          pair: 3
        exits:
        - 改约白天在橱窗卡座当面交割
        - 托物业按流程抹除影像，交割推迟
      引荐簿在卡座被拍了一角:
        source: 引荐人来排新约，随身簿子摊在卡座上，邻座的手机镜头压低了半寸。
        engines:
        - 名分悬置
        - 秘密暴露倒计时
        beats:
          trigger: '{npc}伸手去够卡座上摊开的引荐簿，邻座的手机跟着压低了半寸——她问你是先收簿子，还是先挡镜头。'
          objective: 在那一角拍进手机之前，把引荐簿从卡座上收回来
          choice: 可起身用背挡住镜头；可大方把簿子翻到空白页晃一眼，或过去请那部手机的主人当面删掉
          immediate: 簿子收进包里，那半寸镜头收没收走没人知道；邻座笑得客气，卡座的茶凉得快
          near: 拍没拍到悬着不落，引荐人排的新约照谈；圈里从此多一条「卡座上有镜头」的提醒
        far_trigger: 那一角照片出现在任何一块屏幕上时
        far_consequence: 挡住的这单照签，引荐簿照旧走街串巷；没挡住的，簿子里的花名对着镜头挨个对号——引荐人半辈子的信用和半个圈子的名字，一起押在那半寸上。
        bindings:
        - activity: 橱窗前接待一位生客
          place: 临街样片橱窗与接待卡座
          pair: 2
        - activity: 布一盏帘内的灯
          place: 棚灯白幕影棚
          pair: 2
        exits:
        - 引荐簿停用一周，新约全部改口传
        - 当场请对方删照并换卡座，新约暂停
      拆伙分柜有一卷两家都登记:
        source: 共用暗房的同行要拆伙，底片柜按卷号分家——有一卷，两家的登记簿上都有。
        engines:
        - 遗产之争
        - 对等试探
        beats:
          trigger: '{npc}把两本登记簿并排摊在倒片台上，同一个卷号各占一行，她说拆伙分柜就到这周，这一卷归谁。'
          objective: 在柜子分家之前，把这一卷从两本登记簿里择出来
          choice: 可按先登的簿子归先家；可当面开柜验封袋上的指纹定归属，或两家都不拿、封存待客认领
          immediate: 卷还在同一格铁柜里，登记簿先打起架来；谁的指纹在袋上，谁的话就硬半分
          near: 拆伙的日子定了，其他卷都分得利落，唯独这卷悬着；客人那边还没惊动，惊动了就是两边一起塌
        far_trigger: 柜子搬走那天或客人来问这一卷时
        far_consequence: 验指纹归卷的把行规矩回铁皮上，两家的交情还能剩一半；各执一词的，这一卷成了两家共同的黑洞——柜分了，把柄也一分为二，谁都不敢先动。
        bindings:
        - activity: 器材间里倒一卷带
          place: 器材间与倒片台
          pair: 3
        - activity: 灯箱上一格一格选片
          place: 选片灯箱台
          pair: 2
        exits:
        - 这一卷当面封存交第三方，两家都放弃
        - 按封袋指纹归属，另一家登记作废
      她说今晚必须显影:
        source: 病愈的客人等不了排期，站在暗房门口说今晚就要看到自己浮出来——药水、红灯、她攥着的那页医嘱。
        engines:
        - 时限逼近
        - 疗程依赖
        beats:
          trigger: '{npc}攥着那页医嘱站在暗房门口，说今晚必须显影——排期表上她要等的那一格，还有十一天。'
          objective: 在她的勇气用完之前，把这一卷在红灯下开出来
          choice: 可破例今晚开盘陪她显影；可按排期给她一段倒计时并先陪她试灯，或请医师那边出书面确认改期
          immediate: 药水一开，红灯下那三十秒谁也替不了她；医嘱那页纸被手汗攥皱，计时钟照走
          near: 今晚看到自己浮出来的人，往后的复诊和续拍都有了底气；没看到的，勇气这一关还得再攒一次
        far_trigger: 排期那一格到来或她再次站到暗房门口时
        far_consequence: 陪她显影的这一晚，比十一次复诊都管用——病愈的照片从这一卷真正开始；按规矩让她等的，等来了排期，也可能等散了那点攒了半年的勇气。
        bindings:
        - activity: 显影一位主人到场的卷
          place: 暗房与显影盘
          pair: 3
        - activity: 按下一次快门
          place: 私房布光间·内帘
          pair: 3
        exits:
        - 破例开盘显影，排期往后顺延
        - 改约复诊后的最近一格，今晚只试灯
      烧片仪式的门铃响了:
        source: 约好当面烧掉那一卷，她说烧之前要再拍一卷新的；新卷拍到一半，门铃响了——旧情人站在取景框外。
        engines:
        - 旧礼束身
        - 旧情重逢
        beats:
          trigger: '{npc}的新卷拍到一半，门铃响了——取景框外站着旧情人，说他是来见证烧片的那个人。'
          objective: 在烧片仪式变成三个人的事之前，把这一卷和这一晚按委托单走完
          choice: 可请他到卡座去等仪式如约进行；可让他进来当烧片的第二见证，或停拍改期把新卷封存
          immediate: 门铃一响，帘内的灯就淡了半档；新卷过到一半，旧卷还没进灰烬袋，两个人的约多出了一个见证人
          near: 烧片如约，灰烬入袋，见证人签下第二笔；改期的那卷新片悬在半途，旧情人知道的比说出口的多
        far_trigger: 灰烬袋封口或他第二次按响门铃时
        far_consequence: 让他见证的，烧掉的旧卷反倒把三个人拴成共守的一票；请他走的，仪式照旧，可新卷拍到一半响起的那道门铃，往后每一卷快门前都会再响一遍。
        bindings:
        - activity: 布一盏帘内的灯
          place: 棚灯白幕影棚
          pair: 3
        - activity: 按下一次快门
          place: 私房布光间·内帘
          pair: 2
        exits:
        - 烧片改期，新卷当场封袋入柜
        - 请旧情人作第二见证，仪式如约完成
    legacy_sources:
      eras:
      - 当代都市
      aesthetics:
      - 克制冷峻
      - 旧年代质感
      - 黑色电影
      places:
      - 临街样片橱窗与接待卡座
      - 棚灯白幕影棚
      - 私房布光间·内帘
      - 暗房与显影盘
      - 底片柜与指纹封袋架
      - 会客室与委托单抽屉
      - 选片灯箱台
      - 器材间与倒片台
      - 地下车库的取景车
    themes:
    - 影像的所有权：底片归谁，记忆归谁
    - 快门是合意的，显影是单方的
    - 把柄从不兑现，存在就是全部
    - 烧掉的卷才是干净的卷
    - 药水里浮出来的那三十秒
    technology_boundary: 当代栈以胶片工作流为限：机械机身、负片正片、暗房药水、指纹封袋、纸质委托单与名册并存；不预设直播、云盘、AI 修图、付费墙或即时传输——底片实体唯一，烧掉即绝版；手机只能拍照与打电话，拍不出底片里的内容；无任何自动执行条款——加洗要人手，销毁要人点，承诺兑现全靠人当面开口。全员明确成年：摄影师、客人、引荐人、同行皆为成年从业者与成年委托人，不写未成年线，不写亲友监护线。镜头语言写实不露骨——快门、布光与显影作仪式叙述，不作身体奇观叙述；把柄只存在于「存在本身」，从不兑现成画面描写；私密场景以规程与对话呈现，文字叙事级，不露骨；病愈叙事只写复诊与状态，不写诊断细节。非交易靠近的动作在布光间与暗房有最强落点：教一个动作、递纸巾、接住从灯架上滑落的反光板、把热的那份推过来、替她把袖口卷起一折再进药水、红灯下让她扶着你的手腕看显影、把晾干的底片亲手交回她掌心。
    bridge_status: not_required
