    themes:
    - 钟点换规矩：买下的从来不是池子，是一段不进任何规矩的时间。
    - 水温即人情：这条街不问你夜里谁来过，只问你明天的水开不开。
    - 老行当的最后一场雪：熬得过这个冬天，未必熬得过对面那块灯箱。
    technology_boundary: 千禧年前后以传呼机、公用电话、手写澡票、竹制柜牌与烧煤锅炉为媒介；没有智能手机、网络支付与实时定位，煤与水按供应站的手写单据配送，夜里的口信只能靠人递或传呼台留言；对面洗浴中心的卡拉OK与磁带柜是这条街看得见的「新世界」。此处没有妖术——「天亮失效」说的是包场钟点随封炉与水凉自然作废的行规，不是任何超自然力量。
