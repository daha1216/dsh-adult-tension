    themes:
    - 旅途节奏与观测耐心
    - 天气限制下仍成立的共同休假
    - 同行不等于同一张回程票
    - 票与房记录替人说出真实选择
    - 封路、签证与船期面前谁都不欠谁
    - 最后一晚说过的话算不算数
    technology_boundary: 当代民用渡轮、相机、手机船期查询和公共望远镜可用；云层不能被摄影器材消除，私人游艇只在船主同意的停泊参观时段进入，人物没有航行指挥权。封路、签证与船期由外部机构按公告执行，不能靠人情或财物当场改写，改签与延期一律走窗口且留下记录；行程记录（票根、房单、面签材料）是环境里可被第三方查阅的物件，不是心证或读心结果。
    bridge_status: not_required
  地方行业与公共记忆:
    eras:
    - 当代都市
    aesthetics:
    - 行当正剧
    - 市井烟火
    rule: 城市手艺与公共服务通过记录、展览和相互学习留下日常经验。一份未加保护层的原稿或底片摊上桌，就等于把牌全部亮出来：谁先看到、谁先复印、谁先流出去，决定这一手料往后归谁讲；摆出它的人多半已经在权力位上，而伸手去接的那个人才是被考的那一个。
