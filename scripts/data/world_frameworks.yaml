        bindings:
        - activity: 修整练习用具
          place: 壬生屯所阴暗道场
          pair: 1
        - activity: 教一个动作
          place: 壬生屯所阴暗道场
          pair: 1
        exits:
        - 交还木牌，取走个人工具离屯所
        - 将未修器具标清交管事，另约白日时段
      倒幕盟约名单险些遗落:
        source: 凭着手递书信往来的一份倒幕盟约名单险些遗落在鸭川町屋的转手信里，抄件与原件分装两封、收信人各不同；名单一旦落到桥番或屯所执事手上，凡经手递信的人都算知情不报。
        engines:
        - 秘密暴露倒计时
        - 身份风险
        beats:
          trigger: '{npc}在木牌箱旁翻出两封未署名的转手书信，其中一封的分量明显不对。'
          objective: 在名单落到第三个人手上之前弄清该把它交给谁
          choice: 当面交还屋主并要他认领；原封不动放回等收信人来取
          immediate: 两封书信都压在木牌箱底，递信的人与收信的人当天谁都没露面
          near: 名单还在京都流转，经手过的人各自心里都记着这一封
        far_trigger: 桥番或执事开始按名册追查经手书信的人
        far_consequence: 查到谁手上断过信就要按知情不报论处，连家眷一同受问；及时交还则可只作一次误投
        bindings:
        - activity: 辨认旧屋木纹
          place: 鸭川河畔町屋雨廊
          pair: 0
        exits:
        - 把两封书信原样交回屋主，退出这次传递
        - 将自己的名字从传递名单上销去，此后不再接这类手递
      演出帷幕即将拉开:
        source: 置屋下一场宴席的帷幕即将拉开，女将已在廊下催场，而里间那只寄存的玉镯还没清点；开席前点不出原物，就要按旧礼在席上当众追责。
        engines:
        - 时限逼近
        - 池田屋突袭前夜密函截获
        beats:
          trigger: '{npc}听见廊下女将催场的声音已经到了纸拉门外。'
          objective: 在帷幕拉开之前把里间的东西与手上的活儿都收拾干净
          choice: 当场清点并交出玉镯；先按她说的把手尾收妥再说
          immediate: 发绳与碎发收进纸篓，镯子重新绕回腕上，纸拉门拉开时廊下已开席
          near: 今夜的席面撑过去了，女将明早仍要点验寄存之物
        far_trigger: 女将清账日当面点验寄存之物
        far_consequence: 对外点不出原物就要按旧礼逐层追责，掌眼人从此再进不了置屋的里间；先说清来路则只赔一笔工钱与一年的交情
        bindings:
        - activity: 替她挽一次发
          place: 祗园艺伎置屋纸拉门后
          pair: 3
        - activity: 教她一个身段
          place: 祗园艺伎置屋纸拉门后
          pair: 3
        exits:
        - 把手镯交回女将当面清点，退出这一笔
        - 退出里间不再掌眼，只按旧礼以客身告辞
      洗刀水色变红的瞬间:
        source: 场角木盆里的洗刀水色变红的瞬间，正好与桥番夜里扣下长刀名牌是同一天；执事的队务名册上少了一笔出勤，两处记的是同一个人，只等次日开审对上。
        engines:
        - 旧案重开
        - 共同秘密
        beats:
          trigger: '{npc}把泡在场角木盆里的刀拎出来，水色已经泛红。'
          objective: 在两本册子对上之前弄清这一笔该怎么记
          choice: 把刀与白布一起交执事落册；先洗净木盆当无事发生
          immediate: 白布上的暗色擦不掉，木盆的水泼在场角，刀归回墙架
          near: 明日点验器具时这柄刀要过管事的手，桥番的扣留簿也会同日开审
        far_trigger: 奉行所开审而队务名册尚未销掉那一笔
        far_consequence: 两本册子对不上就要传执事与桥番同席问话，脱队的名由会落在队规上；先对平则只作一次桥禁处分
        bindings:
        - activity: 递上一块干净白布替她拭刀
          place: 壬生屯所阴暗道场
          pair: 1
        exits:
        - 认下桥禁处分，退回町屋一侧等开审
        - 把名牌交给执事带回屯所，两处各自落册
      池田屋突袭前夜密函截获:
        source: 池田屋突袭前夜的一封密函在四条大桥桥口被桥番截获，函中列着当夜出队的人名；持函者按桥禁先扣在羁所候审，只等奉行所开审，而名册上那几个名字还挂在屯所的出勤里。
        engines:
        - 刺客身份被同枕之人识破
        - 名额只能给一个人
        beats:
          trigger: '{npc}把截获的密函与扣下的名牌同时推到灯下，问你名单上的名字该不该念出来。'
          objective: 在开审之前决定替谁把名字从册子上抹掉、又把谁留在上面
          choice: 按桥番所见如实供出持函者；只认函不认人把事推回队里
          immediate: 密函封回原样压在扣留簿下，名牌暂不挂上墙钉
          near: 念出名字的人当夜就动不了身，留下的人要独自面对次日屯所的问话
        far_trigger: 奉行所次日开审而屯所名册当日销账
        far_consequence: 被念出名字的那一个从此与同席之人再难同枕；瞒住则要在队规与桥禁之间找一条两边都不追究的缝
        bindings:
        - activity: 桥番扣刀问夜
          place: 四条大桥桥番小屋
          pair: 2
        - activity: 用嘴咬住发绳扎单马尾
          place: 祗园艺伎置屋纸拉门后
          pair: 3
        exits:
        - 认下桥禁处分，退回町屋一侧等开审
        - 把密函原封交执事带回屯所，两处各自落册
      身契赎金差最后一笔:
        source: 置屋年季身契只剩一年可赎，账面还差最后一笔药钱；当家人允她以加接三年奉公抵差额，而借据在你手里，认不认这笔折算全看你今日落不落笔回执。
        engines:
        - 债务压力
        - 名分悬置
        beats:
          trigger: '{npc}把账页推到你面前，指尖停在还差的那一栏。'
          objective: 在加接三年与今日认账之间把折算的数目说清
          choice: 按原数写回执只收息；当场认下折算改契
          immediate: 账页合上时里间的当家人应了一声，席面的事谁都没再提
          near: 回执一日不落笔，她照旧出席陪席，赎身之议顺延一季
        far_trigger: 季末清账日当家人按加接三年的新契落册
        far_consequence: 新契一落册她再难脱身，你手里那张借据从此只值纸面数目；赶在落册前对清余数则可按年赎身，两边的名分都留在账上
        bindings:
        - activity: 核对年季身契的账页
          place: 神乐坂置屋
          pair: 4
        - activity: 用掌心温热她腕上冰凉的翡翠玉镯
          place: 祗园艺伎置屋纸拉门后
          pair: 3
        exits:
        - 写明只按原数收息的回执后告辞，改契之议交还当家人
        - 把借据副本留在案上供当家人核对，本人先退到玄关外
    legacy_sources:
      eras:
      - 文久幕末京都风云
      aesthetics:
      - 幕末残雨物哀
      - 和风物哀
      places:
      - 鸭川河畔町屋雨廊
      - 壬生屯所阴暗道场
      - 神乐坂置屋
    themes:
    - 旧木修缮里的取舍
    - 道场日用与公开身份的距离
    - 跨城艺事往来中的分寸
    - 桥禁、名册与旧礼之间的进退
    technology_boundary: 文久年间以木作手工具、油灯、纸帖和人递书信为主，不使用电灯或即时通信。神乐坂置屋作为江户的一处虚构艺事经纪住处，不借用后来成熟花街的规模设定；京都到江户的交往必须跨多日旅程。新增的祗园艺伎置屋与四条大桥桥番小屋同样靠纸簿、木牌与人力传递运转：桥禁靠桥番当面盘查与扣刀、次日由奉行所开审定夺，队务名册与桥番扣留簿均为手写，两处对不上只能靠传人问话，没有任何即时通传的手段。
    bridge_status: bridge_required
    bridge_explanation: 京都的鸭川、壬生与江户神乐坂不是同城地点。神乐坂活动只在明确经过多日旅程、寄信往返或另起江户停留段后进入；不能沿京都街巷直接抵达。祗园艺伎置屋纸拉门后设在京都一侧，与鸭川河畔町屋雨廊同在京都，两者之间按町内步行计；四条大桥桥番小屋位于桥头，从屯所或町屋前往均须写明走法与所费时辰。
  禁酒期爵士与报纸:
    eras:
    - 一九二八芝加哥禁酒期
    aesthetics:
    - 禁酒令爵士黑帮
    - 芝加哥暗夜交锋
    - 黑色电影
    rule: 爵士演出、码头工人和地方报纸共享街区，人们在监管与谋生之间寻找空间。湖畔码头、理发店暗门与报馆夜班共用一套暗号与交接手势，暗号连报三次错误即由码头管事按当夜名单带走送交湖上巡警，不再返回原班；私酒库房看绿灯行事，灯灭三十秒内未排空则整套货品、账页与经手人名一起落到查获清单上。
    social_rule: 采访和演出都需要本人同意，传闻不能直接充当指控。当场付现是唯一通行凭证，赊账、口头担保与人情垫付一律不被受理，欠款按周计息并登记在经手人名下，警方与帮派都只认现金与登记簿上的那个名字。
    places:
      理发店暗门后地下酒吧:
        details:
        - 理发店暗门后通往尚未开场的地下舞台
        - 钢琴旁的谱架被反复改调，来客须经店方允许
        - 暗号板挂在门内侧，连报三次错误的客人被请回前厅
        profile:
          privacy: medium
          visibility: medium
          exits:
          - 从店方确认可用的楼梯回理发店前厅离开
          witnesses:
          - 排练乐手与当班领班
          affordances:
          - 试合一段旧曲
          - 轮换领奏与伴奏
          - 核对当夜暗号与开门时段
          pressure_modifiers:
          - 乐手可排练时长
          - 场地方是否允许开门
          - 暗号是否已换过一轮
      密歇根湖畔私酒卸货码头:
        details:
        - 湖风吹过卸货码头休息棚
        - 普通工人的热咖啡壶放在远离吊货范围的长凳边
        - 库房门内侧挂着只亮绿灯的排空信号
        profile:
          privacy: low
          visibility: high
          exits:
          - 沿岸侧人行道离开，不穿过装卸吊臂
          witnesses:
          - 休班码头工人
          affordances:
          - 陪码头工人歇一班
          - 在休息棚喝咖啡听短故事
          - 跟着绿灯核一遍当夜货位
          pressure_modifiers:
          - 换班钟点
          - 受访者是否愿意谈工作
          - 绿灯何时熄灭
      黑帮教父防弹老爷车:
        details:
        - 当时仍在使用的防护轿车停在车行维修位
        - 厚车门旁放着修车人获准展示的铰链旧件
        - 后座夹层里锁着当夜要审的账页副本
        profile:
          privacy: medium
          visibility: medium
          exits:
          - 车辆停稳时从车行步行门离开，不随车出发
          witnesses:
          - 受雇修车人与司机
          affordances:
          - 辨认轿车修补痕
          - 比较照片与获准展示的旧件
          - 核对夹层里的账页副本
          pressure_modifiers:
          - 车主允许展示的部位
          - 司机接车时间
          - 司机的行程记忆
      报馆夜班排字房:
        details:
        - 凌晨的排字房只留两盏罩灯，铅字盘按末版顺序摆开
        - 当日清样叠在装版台角，未付印的段落另放一边
        - 废纸筐里的作废校样要到天亮才统一处理
        profile:
          privacy: medium
          visibility: medium
          exits:
          - 从装版台后的侧梯下到街面后巷，不带出未印清样
          witnesses:
          - 同班排字工与守夜校样
          affordances:
          - 核对一段引语是否照原话排出
          - 把作废校样单独收进废纸筐
          - 比对末版与早版的名次
          pressure_modifiers:
          - 末版截稿钟点
          - 当晚在场谁能看到清样
          - 废纸筐是否已被翻动
      湖上巡警扣押泊位:
        details:
        - 湖岸线外侧的巡逻船泊位设有没收货品的临时堆放区
        - 当日查获清单钉在泊位办公室外墙，署名一栏并不写全
        profile:
          privacy: low
          visibility: high
          exits:
          - 沿湖岸步道退到码头外栅栏，不靠近扣押船身
          witnesses:
          - 值岗巡警与送交货物的码头管事
          affordances:
          - 读当日查获清单的署名
          - 辨认送交货物的经手人
          pressure_modifiers:
          - 清单挂出的钟点
          - 管事是否在场交接
