      违规用药后的生理反噬:
        source: 为撑完连续夜班，本人私下加大剂量服用提神类药物，第二晚开始手抖、心悸、读数看串行。
        engines:
        - 成瘾戒断
        - 身份风险
        beats:
          trigger: '{npc}在社区诊所夜诊室把剩下半板药推过来，说最近手抖得连表针都对不准。'
          objective: 在反噬影响作业判断之前把这一段停掉并处理用药
          choice: 可当场如实说明用药情况；可只问处理方法不留下记录；也可先停班回去睡一晚
          immediate: 当晚不再单独进隔离段，手上剩下的药交不交出来由本人决定，排班先按本人说不适来调。
