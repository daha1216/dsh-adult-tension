        - 把这一桌的号牌摘掉，撤出大厅回三层账房
        - 不再接这一位客人的点单，把钟点让给别的班子
      台下那本账被念出来:
        source: 三楼小间里的排期被人在大厅里照着念了出来，念的时候台面上那一页还空着。
        engines:
        - 共同秘密
        - 两副面孔
        beats:
          trigger: '{npc}把台面册翻到空白的那一页压在你面前，说楼下有人把楼上的排期念出来了。'
          objective: 把台面上和台面下两本排期分开处置，不让念出来的那一本连累另一本
          choice: 可把念出来的那几晚从排期本上退掉；可只认台面册上落了字的那几行，或先把楼上那间小间锁起来停几天
          immediate: 台上那一页当夜继续空着，楼下念过的话不当账，排期本上相应几晚画掉
          near: 被念到的那几个人下一次进出都走窄梯；排期本画掉的页往后不补，谁再念这一页就得自己拿出落字的那一本
        far_trigger: 换榜那天大厅里又有人照着念出第三个人名时
        far_consequence: 把两本分开处置的人台面上的钟点照排；没分开的人被人拿念出来的那几晚对上台面册，对不上的一律按撤单算，月底的流水自己填。
        bindings:
        - activity: 核一遍当晚的白账
          place: 三层大班账房
          pair: 2
        - activity: 台下排一个人的档期
          place: 三层不对外小间
          pair: 3
        exits:
        - 把楼上那间小间锁起来，这一个月的档期只排台面上的
        - 交出排期本里自己经手的那几页，退出这一轮
      花榜的名次掉了两位:
        source: 新一期花榜贴出来，名字往下掉了两位，而看榜的人比上一期多了不少。
        engines:
        - 名声保卫
        - 嫉妒与独占
        beats:
          trigger: '{npc}在贴报墙前把那两期榜面对了一遍，指给你看名字挪下去的两行。'
          objective: 掉下去的名次不解释也不申辩，把能做的做在别处
          choice: 可站着听完就走不做任何回应；可当场把上一期揭过的那一角指出来，或回去照原样排钟点
          immediate: 名次照墙上的走，台面册上的钟点也照原样排，谁也不去向贴报人递话
          near: 下一期换榜前街上还会再说一遍；把钟点排满的人名字自己会往上走，去申辩过的人下一期掉得更快
        far_trigger: 连着两期榜面都往下掉而台面册上的钟点没有少时
        far_consequence: 不申辩的人按原钟点继续排，客人自己会回来找；把力气花在找贴报人身上的人下一期被挪到更后面，账房那边也开始把她的钟点排给新人。
        bindings:
        - activity: 花榜贴报墙前听闲话
          place: 花榜贴报墙
          pair: 3
        - activity: 在二层候场廊等下一场
          place: 二层候场廊
          pair: 2
        exits:
        - 换榜那天不出门，这一期榜面不再去看
        - 把台面上认得出的钟点排满，不再跟街上的说法
      化妆间帘子没拉严:
        source: 试衣帘只拉到大半，帘外有人停下脚步，帘里说的话大概被听去了一半。
        engines:
        - 秘密暴露倒计时
        - 共处密闭
        beats:
          trigger: '{npc}把帘子往里又拉了半寸，问你刚才那半句话是从哪一句开始说的。'
          objective: 弄清帘外站的是谁、听去了多少，再决定剩下的半句说不说
          choice: 可把帘子拉严把话说完；可退出帘外在廊上说个能过的话头，或当场停住等下一场开锣
          immediate: 廊上的换场时辰没有变，帘子里的事出了帘子只按能过的那一层讲
          near: 下一次搭扣松了她还来找你；听去半句的人往后在廊上照面，谁先开口谁就把这一句认下来了
        far_trigger: 同一个时辰廊上的人把帘里听来的半句带到贴报墙前时
        far_consequence: 当场把帘子拉严的人下一场照点上台；只讲了个能过的话头的人往后再换行头都要另找一间，管事也开始按场次查帘子拉没拉严。
        bindings:
        - activity: 在化妆间换行头
          place: 化妆间里侧试衣帘后
          pair: 1
        - activity: 台面上落一笔点单
          place: 大班台面册台
          pair: 3
        exits:
        - 换行头改到三层账房，不再走二层这一间
        - 下一场提前上台，把帘子后面的事先搁下
      后门走出去的人被看见:
        source: 从锅炉房后门出去的人被后巷里等车的人认了出来，第二天这台车又来停了一趟。
        engines:
        - 身份风险
        - 对等试探
        beats:
          trigger: '{npc}把锅炉房那本只记时辰不记名字的册子翻到今天，指给你看后门开过的那两笔。'
          objective: 弄清是哪一趟车看见了谁，再决定后门还开不开
          choice: 可照旧开后门并把这几个时辰记下去；可停几天改走横街正门，或让外面那台车换一处停车的地方
          immediate: 后门的闩当夜照插，出入册上只添时辰，谁走的这一笔谁自己认
          near: 那台车再来就该有人去问一趟；往后谁走这扇门都从锅炉房过，锅炉工照旧不问名字
        far_trigger: 那台车第三次停在后巷而册上多出第三个时辰时
        far_consequence: 照旧开后门的人还能按老规矩送人出去，但巷子里等车的人开始认脸；改走正门的那几天账上多出几笔明钟，谁走进来的街上都看得见。
        bindings:
        - activity: 从后门送一个人出去
          place: 衣帽间与锅炉房后门
          pair: 2
        - activity: 从后门送一个人出去
          place: 衣帽间与锅炉房后门
          pair: 0
        exits:
        - 后门这几天插上闩，人一律从正门走
        - 把出入册上那几个时辰划掉，这一阵不再记
      账房要抹掉某一晚:
        source: 楼上有人要账房把某一晚整晚抹掉，白账上会多出一笔对不上月底流水的差数。
        engines:
        - 组织更迭
        - 信任透支
        beats:
          trigger: '{npc}把白账摊开按住其中一页，问这一晚是抹掉还是在月底自己填上。'
          objective: 把这一晚从册子上拿掉，同时想清楚这笔差数月底由谁来填
          choice: 可当场抹掉并自己把差数记下；可只把这一页折起来留到月底再说，或把这一页交出去不做这一笔
          immediate: 抹掉的那一晚当夜从册子上消失，白账上对应的一行留着不销，月底自己填
          near: 月底对账时这一笔要当面说清；抹过一次的人下一回开口前会先被问一句谁填数，问过之后能不能再开口就不由自己了
        far_trigger: 月底结账时白账与台面册的差数超过三笔而没人认账时
        far_consequence: 自己填过差数的人在楼上的分量重一层，楼下的钟点也随她怎么排；把这一页交出去的人下一季不再进账房，排档的名册上换一个人来签字。
        bindings:
        - activity: 核一遍当晚的白账
          place: 三层大班账房
          pair: 0
        - activity: 台下排一个人的档期
          place: 三层大班账房
          pair: 3
        exits:
        - 把账房的钥匙交出去，只排台面上的钟点
        - 这一页留到月底，谁问都说到月底再说
      跑场茶室里有人先问了:
        source: 跑场茶室柜台上有人先搁下一支筹，问的是你手上这一班人，问的时间比你到得早。
        engines:
        - 旧事追索
        - 对等试探
        beats:
          trigger: '{npc}指着柜台上已经搁好的那支筹，问你这一班的行情是从谁那里先听去的。'
          objective: 弄清是谁在你之前把这一班的行情问了出去，再决定接不接这一场
          choice: 可把这一班的行情照实说一遍；可只应下缺人的那一场不多说，或把筹推回去这一班不掺和
          immediate: 应下的那一场当夜记进排期，先搁下的那支筹照旧留在柜台上等下一家
          near: 先问过的那个班子隔两天还会再来问一趟；把行情说实的人往后从茶室听来的话都能对上，推回去的人下一回柜台上的筹就未必还给他留着
        far_trigger: 同一个班子在同一个月的柜台上第三次先搁下筹时
        far_consequence: 照实说的人从茶室里听来的行情都还作数；把筹推回去两次的人在茶室就再也打听不到缺人，只能自己去横街上等班子来问。
        bindings:
        - activity: 跑场茶室打听缺不缺人
          place: 跑场中介茶室
          pair: 1
        - activity: 跑场茶室打听缺不缺人
          place: 跑场中介茶室
          pair: 2
        exits:
        - 从此不进这家茶室，缺人的场子由班子自己来问
        - 把这一班的行情摘出去，只接自己经手的场子
      陪舞不陪身那条线被念出来:
        source: 签约单最下面那一行被人当着两桌客人念了出来，念完还要大班当场给一句准话。
        engines:
        - 赌约生效
        - 旧礼束身
        beats:
          trigger: '{npc}把签约单转过来让最下面那一行朝着你，两桌客人都在等你开口。'
          objective: 当着两桌把这一行的分量说清楚，不说重也不说软
          choice: 可按签约单原文念一遍就收回去；可当场停乐作废这一场，或用一支曲子把话岔到别处
          immediate: 台面册上这一场照旧记着，签约单上那一行不动，作废与否当场见分晓
          near: 往后点单先看那一行的人多了，落字之前要多问一句；把这一行念软过的人再点单时客人会自己往下试
        far_trigger: 同一桌客人在同一季里第二次把那一行念出来时
        far_consequence: 按原文念回去的人台面上的钟点照排，客人点了字就守字；把话岔过去的人当晚还能开乐，往后每一场都要多留一个人在大厅上看着，钟点少了账上自然看得出来。
        bindings:
        - activity: 台面上落一笔点单
          place: 大班台面册台
          pair: 3
        - activity: 停乐清场作废一场
          place: 舞厅大厅乐台
          pair: 2
        exits:
        - 把这一桌的钟点退掉，今晚不再开乐
        - 把签约单收进账房，凭落字的那一本说话
      散场前她没回来:
        source: 台上点到她的钟点，人还没从后门回来，大厅里的乐台已经换到下一场。
        engines:
        - 时限逼近
        - 资源锁定
        beats:
          trigger: '{npc}把下一场的纸剪节目条按在半空，问你台上这一个钟点还留不留。'
          objective: 在这一场换完之前决定是等人还是把钟点让出去
          choice: 可让乐队按住这一场多等一支曲子；可当场把这一行划掉让下一场顶上，或调别的人来接这一个钟点
          immediate: 等人则厅里多留一根灯芯，让出去则台面册上这一行当夜划掉，两边都不补记
          near: 散场后天亮前从后门进来的人不用解释，走过正门的人第二天要当面认这一行；等过几回之后领班开始按人排钟点而不是按册子排
        far_trigger: 同一个人在同一个月的散场前第三次没有按时回来时
        far_consequence: 等过她的人下一班次还照原样留钟点，但领班开始把大厅最靠里的一桌留着不动；划过她的人往后开乐前先看人在不在，大厅的钟点排得越来越松，账上的空档自己显出来。
        bindings:
        - activity: 在二层候场廊等下一场
          place: 二层候场廊
          pair: 0
        - activity: 从后门送一个人出去
          place: 衣帽间与锅炉房后门
          pair: 1
        exits:
        - 今晚这一行划掉，人回来去账房自己认
        - 把下一场的钟点让出去，今晚不再等人
