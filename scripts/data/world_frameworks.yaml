        beats:
          trigger: '{npc}在重新分工前把你叫到修补台边，只问一句昨晚的话要不要往下说。'
          objective: 在重新分工前决定这件事说不说、说给谁听
          choice: 当夜把话说完；或先去谈明天的分工，也可以什么都不说各回各的班
