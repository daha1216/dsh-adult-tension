          trigger: '{npc}听说楼里已经有人提起这间屋住了两个人，当周的配送单还只写了那一个户号。'
          objective: 在被人当面问起之前决定要不要把登记改掉
          choice: 可主动去登记处加一个户号、把两个人的份额分开记；可什么都不改，照旧只报一个户号；也可以让另一个人先搬去别处住几周避一避
          immediate: 改与不改当周就看得出来，登记表上的户号直接决定下周这一户能领几份
          near: 配送名单每周重抄一次，改过的那一行会在下一次抄写时被同楼的人看见
        far_trigger: 下一轮领物时有人当场要求核对这一户住几个人
        far_consequence: 加过户号的人从此按一户两人登记，不改的人要用另一个地址把这份关系藏下去
        bindings:
        - activity: 远程合做一顿家常饭
          place: 家中厨房
          pair: 1
        exits:
        - 到登记处加上第二个户号，份额按实际人数重排
        - 维持原登记，另一个人暂时外住避开这一轮
      撤离名额只够两个人中的一个:
        source: 社区通知本栋本轮只有一个随车名额，撤离线分两批走，第二批什么时候开不由居民定。
        engines:
        - 名额只能给一个人
        - 时限逼近
        beats:
          trigger: '{npc}看到通知上写着本栋本轮只有一个随车名额，登记截止到当晚十点。'
          objective: 在登记截止前决定名额落在谁身上
          choice: 可当场把自己报上去并说明另一个人留下的安排；可两个人都不报，等第二批名额；也可以把名额让给对方，自己留在原地等下一轮
          immediate: 登记表一交就上报名单，十点之后加不进去，交表的人在这一栏签的是自己的名字
          near: 第二批什么时候开没有准信，留下的人这一段时间要按留守口径重新登记配给
        far_trigger: 第二批名单公布时仍只有一个名额
        far_consequence: 先走的人要替留下的人办好交接，两人从此各在一处，往后的往来只剩清单与短号电话
        bindings:
        - activity: 在落锁前核一遍进门的人
          place: 避难所入口防爆门
          pair: 2
        exits:
        - 按名单完成本轮的撤离登记与交接
        - 本轮不占名额，两人都留在原处重新登记
      旧伤在值夜班时复发:
        source: 以前落下的旧伤在连着几夜值班之后复发了，站着接电话都要扶住桌角，班次表上后面几夜还是他的名字。
        engines:
        - 伤病互护
        - 资源锁定
        beats:
          trigger: '{npc}发现他在夜里接电话时已经扶住桌角，后面几班的表上还写着他的名字。'
          objective: 在不空出这个班的前提下决定由谁替他接下去
          choice: 可当场替他把接下来的两班接过来并记进交接簿；可只把今夜接完，明夜的事留到交班再说；也可以照表不动，让他自己去找人换
          immediate: 接过来的班要写清是谁接的，交接簿上那一行往后每晚都会被上一个班的人看到
          near: 替班的人会在这一周里连着多值几夜，伤没好的人再回来时位置不一定还在
        far_trigger: 同一张班次表上再次出现替班记录
        far_consequence: 接下去的人要么把这段班次固定下来，要么在伤者回来时按新的排班重新让出位置
        bindings:
        - activity: 交接夜班服务问答
          place: 夜班值班室
          pair: 0
        exits:
        - 把当班事宜逐条交接清楚后按原班次回休息处
        - 不再接续后续班次，按正式流程申请调换
      旧疤在换防护服那天被看见:
        source: 换防护服的地方没有隔间，以往落下的一片旧疤在队里几个人面前露了出来，有人当场追问是哪一年的事。
        engines:
        - 秘密暴露倒计时
        - 咬痕瞒到了极点
        beats:
          trigger: '{npc}在换防护服的过道里被人瞥见那片旧疤，问话的人已经停下手里的事。'
          objective: 当场决定这段旧事说多少、由谁来说
          choice: 可当场把这处旧疤的来历说清楚；可只答一句是旧伤、其他不接；也可以什么都不答，穿好衣服先走出去
          immediate: 过道里停下来的那几个人都听到了这一句，接不接得住决定了这件事明天传成哪一种说法
          near: 换防护服的地方每周都要过一遍，看过的人下一次会先看这处
        far_trigger: 同一处旧疤被另一个人拿着说法传出去
        far_consequence: 说清的人从此不必再解释，不接的人要用一段新的说法把这件事盖回去
        bindings:
        - activity: 在分拣棚按待派件数重排收班
          place: 闭环小区临街快递分拣棚
          pair: 3
        exits:
        - 换好装备照原班次上工，不谈这段旧事
        - 申请换一个不在同一处更衣的班次
      这一轮的晋升名额只有一个:
        source: 生活区这边的登记岗位这一轮只提一个人，名单按当班次数与复核记录排，排在前面的两个人只差一次夜班。
        engines:
        - 名额只能给一个人
        - 组织更迭
        beats:
          trigger: '{npc}看到晋升名单贴出来，两个人只差一次夜班的记录，这一轮的评定就在这周末。'
          objective: 在评定前决定要不要为这一次夜班抢下来
          choice: 可主动接下周末那一班把记录补齐；可把夜班让给对方，用往后的记录慢慢追；也可以当面向负责评定的人问清排名的口径
          immediate: 名单一贴出来就有两个人知道自己差在哪一格，接不接那一班当天就要回话
          near: 评定完的那一周岗位就要重新分，没提上去的人还留在原来的位置上，位置本身没变
        far_trigger: 下一轮的评定口径改成按复核记录的准确率算
        far_consequence: 提上去的人从此负责排班，没提上去的人要在他排的表上继续值班
        bindings:
        - activity: 在分拣棚按待派件数重排收班
          place: 闭环小区临街快递分拣棚
          pair: 3
        exits:
        - 按当班记录接受本轮评定结果
        - 退出本轮评定，班次回到原表
      分拣棚这一轮要裁掉一个人:
        source: 站点这一轮按件数裁一个人，分拣棚里四个人的待派件数贴在墙上，最末那一位还差临街那一趟没有接。
        engines:
        - 组织更迭
        - 名额只能给一个人
        beats:
          trigger: '{npc}看到铁皮墙上贴出这一轮的件数与排名，最末一位就是棚里坐在靠门那侧的人。'
          objective: 在名单报到站点之前决定这一趟要不要接
          choice: 可把临街那一趟接下来补件数；可把趟次分给最末那一位，自己不加；也可以按原样走，让排名说话
          immediate: 件数当晚结账，接与不接都写在墙上那一栏，收班钟点照旧写在铁皮墙上
          near: 名单报到站点之后本周内定人，补过件数的人下一次排表会被排在前头
        far_trigger: 下一轮件数重排时同一栏里又出现两个人相差一趟
        far_consequence: 留下来的人要接走被裁那一位的临街线路，走的人从此不在站点的作息表上
        bindings:
        - activity: 在分拣棚按待派件数重排收班
          place: 闭环小区临街快递分拣棚
          pair: 3
        exits:
        - 按本轮件数结果接受岗位安排
        - 不参与本轮趟次分配，按原作息表上工
      离城前夜还在等一张通行复核:
        source: 出发的日子定在明早，通行复核还压在窗口没有下来，没有那张带编号的记录就出不了封控线。
        engines:
        - 时限逼近
        - 身份风险
        beats:
          trigger: '{npc}收拾好行李时才发现通行复核还压在窗口，明早的车不等这一张纸。'
          objective: 在发车前决定是等记录下来还是改期
          choice: 可整夜守在窗口等这一张编号；可先按没有记录的办法走到封控线，看能不能过；也可以把车票让出去，等下一轮再走
          immediate: 窗口每班重开一次，守夜的人要在队伍里等到天亮，改期的人当晚就要把住处与配送登记一起退回
          near: 记录什么时候下来由复核侧定，走不成的那一趟要按留守口径重新登记配给
        far_trigger: 下一轮通行复核仍因同一条伤口记录卡住
        far_consequence: 一直等的人要么等到整轮封控结束，要么用一个替人代签的办法把这张纸补出来
        bindings:
        - activity: 在落锁前核一遍进门的人
          place: 避难所入口防爆门
          pair: 2
        exits:
        - 本轮不出城，按留守口径重新登记住处与配给
        - 退出本轮排队，把通行复核交给下一班接续
      私藏的半份药被翻了出来:
        source: 压在米缸底下的半板药被同住的人翻了出来，这药不在配给册上，来源一查就能查到那本只记代号的换货账。
        engines:
        - 私藏救命药的把柄
        - 秘密暴露倒计时
        beats:
          trigger: '{npc}发现米缸底下的半板药不在配给册上，收药的人已经知道这间屋子藏了什么。'
          objective: 在被报到复核窗口之前决定这半份药怎么处理
          choice: 可当场把药交去窗口报清来源，自己承担这一条记录；可把药退回原处装作没翻到，等对方先开口；也可以连夜把这半份药转手给等着用的人，账上从此少一份
          immediate: 交上去就等于自己名下多一条可查的记录，不交则这半份药还压在米缸底下，翻过它的人手里已经握着一个把柄
          near: 复核窗口每班重开一次，这个把柄什么时候用由握着它的人定，用过一次这间屋子就再也没有能藏东西的地方
        far_trigger: 同一位翻过米缸的人在下一轮领物时提起这件事
        far_consequence: 交过药的人失去这一条外流的线，不交的人要用往后的每一次让步把这件事按住
        bindings:
        - activity: 远程合做一顿家常饭
          place: 家中厨房
          pair: 1
        exits:
        - 把私藏的药交复核窗口登记，按记录承担后果
        - 清空住处所有不在册的物品，此后不再接外流的货
      资源断供之后的第一轮分份:
        source: 外采线路停到第三周，配给册上的人数比实际领物的人少了好几个，掌勺的人要按现有数目把这一轮分完。
        engines:
        - 配给断供
        - 共同秘密
        beats:
          trigger: '{npc}把配给册和实际来领物的人对了一遍，册上少了三个户号，锅里的份数只够按册上数目分。'
          objective: 在锅空之前决定多出来的那几份算谁头上
          choice: 可照册分完，多出来的退回登记处；可按实际人数补上那三个户号，回头再说明来源；也可以当场把册子摊开让等着的人自己认领
          immediate: 分到谁手上当场就看得见，补过的那三个户号下一轮要连着自己的名字一起报上去
          near: 分份的口径往后每周都要重来一次，认领过一次的人下一周还得站到同一个位置上
        far_trigger: 下一轮分份时多出来的户号变成五个
        far_consequence: 摊开册子的人要么把这一套口径固定成规矩报上去，要么在下一次分份时被换掉
        bindings:
        - activity: 在发电机房对一遍还够几班的油
          place: 空置楼栋后侧发电机房
          pair: 1
        exits:
        - 按现有册子分完本轮份数，多出的部分退回登记处
        - 不再负责分份，把配给册交回生活区登记
      谁也不欠谁的那笔旧账:
        source: 上一轮封控里替对方垫过的那几个份额，两个人后来都没再提，直到这一轮断供，垫过的那一方自己先不够了。
        engines:
        - 债务压力
        - 对等试探
        beats:
          trigger: '{npc}把两个人的配给票并排放在案板上，垫过的那一方这一轮自己少了一份。'
          objective: 把垫过的那几个份额说清，或者当场决定不再算
          choice: 可当面把这笔份额结清，往后各记各的；可只承认这一次、以前的不再算；也可以一句都不提，照旧按现有数目过下去
          immediate: 当面结清的人当晚就按新的数目分，不提的人这一轮的缺口要自己从下一轮里让出来
          near: 断供还没解除，这一笔算不算会在每一轮分份时重新出现一次，算过的人往后都要按同一个口径来
        far_trigger: 下一轮断供时长再延长一周
        far_consequence: 算清的人从此按各自的账走，不算的人要在每一轮里都重新把这件事忍一遍
        bindings:
        - activity: 在发电机房对一遍还够几班的油
          place: 空置楼栋后侧发电机房
          pair: 1
        exits:
        - 把垫付的份额结清，往后各自按册登记
        - 不再提这一笔，按现有配给数目继续过
    legacy_sources:
      eras:
      - 感染爆发初期
      aesthetics:
      - 感染隔离区
      - 末日求生纪实
      places:
      - 感染检疫隔离点
      - 家中厨房
      - 夜班值班室
      - 空置楼栋后侧发电机房
      - 闭环小区临街快递分拣棚
      - 避难所入口防爆门
    themes:
    - 服务信息失真如何增加生活负担
    - 检疫边界内仍然可以选择自己的日常
    - 有限食材和夜班休息的互助
    - 看得见的配给口径决定谁承担风险
    - 复核记录上的编号与人的生活距离
    technology_boundary: 感染初期仍可使用手机、社区群、电话与公共告示；生活区与诊疗区有实体边界，联络员和校对员没有诊断或放行权。厨房交流采用远程语音，不假定隔窗递物天然满足防疫条件。配给凭纸质票册按周登记，复核以纸质带编号记录留档，封控楼栋的远程复课用手机免提与语音，没有集中播报或电子身份系统；防疫服与面罩按当日班次配发，不设个人专属装备。
    bridge_status: not_required
  废土驿站与修补集市:
    eras:
    - 废土末世
    aesthetics:
    - 废土粗粝
    - 末日求生纪实
    rule: 驿站提供修补、补给和消息交换，废墟以外仍有值得维护的生活习惯；欠下的修件与补给可以按次分期抵偿，但每一期都得当面结清，不许把旧账挪进下一次出发。规矩只对没有退路的人真正生效，明天的份今天不预先定下，伤口一旦当众暴露就等同被队伍弃下。
    social_rule: 共同物资要登记来源，交换可以拒绝，不以未知风险强迫同行；入夜后私自开门或对外放声等同替全所引尸，搜刮所得须全数上缴公库再按配给券兑出，券不入私账、不得私下转让。
    places:
      废土驿站:
        details:
        - 驿站维修桌上断电收音机旁摆着分格零件碟·午
        profile:
          privacy: low
          visibility: high
          exits:
          - 收好散件后从驿站门到集市道路
          witnesses:
          - 维修摊邻与货主
          affordances:
          - 修补旧收音机
          pressure_modifiers:
          - 电池余量和替件尺寸
      废弃搜刮药房:
        details:
        - 废弃药房外的旧招牌斜对着一条已走通的小路·昼
        profile:
          privacy: low
          visibility: medium
          exits:
          - 沿已确认外部小路回驿站，不穿入坍塌建筑
          witnesses:
          - 同行路线记录者
          affordances:
          - 重认药房外的返站路
          pressure_modifiers:
          - 残墙可见状况与最近踏查日期
      幸存者地下避难所:
        details:
        - 地下避难所交换桌上摆着补过的水壶和布包·晚
        profile:
          privacy: low
          visibility: high
          exits:
          - 经居住层内廊回自己铺位，出所按开放安排
          witnesses:
          - 交换摊主与借物者
          affordances:
          - 试换一件修过的物品
          - 递过半瓶干净水
          pressure_modifiers:
          - 物品状态与买卖双方需求
      避难所防爆闸门前:
        details:
        - 防爆闸的液压杆上凝着夜里的水汽，内侧墙上钉着清退名单·夜
        profile:
          privacy: medium
          visibility: medium
          exits:
          - 退回居住层内廊，出闸须值守人开锁
          witnesses:
          - 闸门值守人与排队候查者
          affordances:
          - 核对接头卡上的钢印
          - 把外套裹到同行的人身上
          - 卸下弹匣摊在车斗上
          pressure_modifiers:
          - 闸门开合时段与门外尸响
    pairs:
    - family: 服务与手艺
      position: 同侪
      appellations:
      - 直呼其名
      npc:
        role: 驿站工具维修人
        function: 诊断旧设备并用合适替件恢复有限功能
        authority: 可拒修超出能力的设备，不能挪用共用零件
        resource: 手工测量工具、拆机备件与修补台
        limitation: 修好接收不等于恢复发射，也不能凭外观保证电池寿命
        obligation: 交代修复范围并归还未用零件
        exposure: 夸大修复会让商旅错过可靠消息
        hidden: —
      player:
        identity: 水源路线记录员
        baseline: 你带回的广播接收位置帮他发现收音机本身有问题，他愿教你辨一个可换件
