          pressure_modifiers:
          - 食材余量与家庭作息
          - 本周配给票已用掉几张
      夜班值班室:
        details:
        - 非诊疗夜班联络室里电话旁放着待交接的服务问题·夜
        - 接班登记簿摊在桌角，未接完的号码单独画圈
        profile:
          privacy: medium
          visibility: medium
          exits:
          - 经生活区走廊回值班休息处，不进入诊疗区
          witnesses:
          - 接班生活服务员
          affordances:
          - 交接夜班服务问答
          - 把深夜来电的诉求逐条记进交接簿
          pressure_modifiers:
          - 夜班疲劳与电话接续数量
          - 交接簿上还画着几个圈
      空置楼栋后侧发电机房:
        details:
