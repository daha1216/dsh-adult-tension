          objective: 在一周之内把本人的响应记录与现场判断整理成可被核对的东西
          choice: 可当场调阅本人全部响应记录；可直接问评选口径与面谈顺序；也可把机会让给同班的老同事
          immediate: 两人照常搭班值当晚的夜班，面谈材料各自整理，工单不因争位置而互相压半拍。
