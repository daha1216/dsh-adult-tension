      抵押单上的名字被人代签:
        source: 抵押单的名字由店主照着旧笔迹代签，一旦认下来就等于替一个不在场的人背下这份欠额
        engines:
        - 身份风险
        - 信任透支
        beats:
          trigger: 店主把抵押单推过来，说上面的名字是照着旧笔迹代签的，问你愿不愿意认下这一笔。
          objective: 在开门前决定这份代签要不要认
          choice: 签一份自己的担保附在下面；只认物项不认金额；把单子交还店主让他另找签字的人
          immediate: 签与不签当场分出来，抵押物被锁进长凳下的柜子不再挪动。
          near: 不认这一笔，对方就失去抵押赎回的入口，欠额继续照旧滚下去。
        far_trigger: 赎回期限最后一夜而原签字人仍旧没有出现的时候
        far_consequence: 认下这一笔的人要替不在场者结清；不认则抵押物按行价公开处置并且再不退回。
        exits:
        - 把抵押物项一件件点清交还店主
        - 只做一次见证书面附注，不接手这笔欠额
        bindings:
        - activity: 隔着脱衣所的长凳把估价单推过来
          place: 站前钱汤脱衣所·长凳与体重秤前
          pair: 2
      素面雨廊上只剩一床铺盖:
        source: 町屋雨廊上原本该有两床铺盖，来人到的那晚只摊开了一床，谁睡廊下谁先开口就由这一床定下来
        engines:
        - 共处密闭
        - 时限逼近
        beats:
          trigger: 管理人只在雨廊内侧摊开一床铺盖，说另一床还压在阁楼上没拿下来。
          objective: 在下一班车开走前决定这一床怎么分
          choice: 两人把一床铺盖摊宽一起睡到天亮；自己睡廊下把铺位让出去；当场搬另一床下来各睡一边
          immediate: 一床铺盖铺开后当晚就分不出第三处落脚的位置。
          near: 退让的顺序决定谁睡廊下、谁先开第二天的口，这件事当天晚上就作数。
        far_trigger: 第二天早上阁楼上那一床铺盖还没被搬下来的时候
        far_consequence: 最后一班车开走后决定就变成长期安排，离开的人下回再来的廊下位置要另排。
        exits:
        - 当晚把铺盖叠好去找站前旅馆的房间
        - 托管理人退回自己的那份借住登记，天亮前离开町屋
        bindings:
        - activity: 在候车室并坐等一班车
          place: 京福线终点站前的通宵候车室
          pair: 3
        - activity: 在素面雨廊下摊开木样与铺盖
          place: 鸭川町屋素面雨廊
          pair: 3
      台帐上的腰带与廊下的腰带对不上:
        source: 台帐登载的腰带件数与廊下挂着的实物对不上，差额一旦当众说开就要认下谁带走了没登记的那一条
        engines:
        - 表面体面破裂
        - 名声保卫
        beats:
          trigger: 当家人把台帐摊在三叠茶席上，廊下挂着的腰带比登载的件数多出两条。
          objective: 在改记之前弄清多出来的两条腰带算谁的名分
          choice: 当场逐件点到廊下并报出差额；只核台帐不动实物；请当家人自己先点一遍再叫你
          immediate: 差额被圈在同一张纸上，廊下的实物当天不再挪动。
          near: 当家人要按圈出的差额当众改一次记，改记之后谁的名字留在上面跟着一起改。
        far_trigger: 置屋下一次清点在客人面前重开台帐的时候
        far_consequence: 逐件点清则当众改记一次把名分定死；只核台帐则差额留着，下回仍要重排一遍。
        exits:
        - 把誊抄的记录交当家人自己比对，就此退出这次核对
        - 收回自己那份记录稿不再对外提，止步在纸拉门里
        bindings:
        - activity: 在纸拉门后核对台帐与裤腰带
          place: 祗园艺妓置屋纸拉门后
          pair: 4
      午夜大浴场的名分与租期一起到期:
        source: 并床夜宿用的更衣柜租约到期，续约时要把不登记的关系并到同一张过夜单上，谁签谁的名下就多一笔欠费
        engines:
        - 共同秘密
        - 名分悬置
        beats:
          trigger: 值夜班的清洁工把两本更衣柜租约并成一叠，问要不要照旧多留一夜。
          objective: 决定这一夜的过夜费挂谁的名下结清
          choice: 按同一张租约留到天亮；只借半宿等首班车；当晚各自回自己的住处分开结账
          immediate: 铺位与租约合并到一张单子，天亮前不作废。
          near: 续约之后这段不登记的出入要有个名分，否则下一轮柜子转租出去。
        far_trigger: 柜子下个月转租出去而两人还没说清这段关系的时候
        far_consequence: 并单则欠费一起结；分开结则其中一方要先把柜子退掉再另找落脚的地方。
        exits:
        - 结清自己那份过夜费独自离场
        - 把这段关系交还成只留一个寄存柜，从此不再并单
        bindings:
        - activity: 在午夜大浴场并排过夜
          place: 洗浴中心相邻的午夜大浴场
          pair: 4
