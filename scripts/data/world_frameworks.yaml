    technology_boundary: 当代栈：微信排课小程序与纸质课时卡、课时账本并行，一切以纸本为准；教室监控只装公共区，学员可要求关闭；教学录像须双签授权，课后可要求当场删除；状态本纸质不上云。不预设
      AI 换脸、云端永久留存与生物识别门禁；「天亮失效」在本版写实化为下课归零的极端化——最后一课即关系契约的终点，不取妖术设定。全员明确成年：主理人、课后理疗师、老绳师、投诉受理事、学员与课程记录摄影师均为成年从业者与成年学员，不写未成年线，不写亲友监护线，「新手」一律指成年初学者。成年向元素从私教单间的刻度型隐私自然生长——课上世界与课后世界的人为切换就是张力本体，「想有一段不必归零的课时」；支配与服从仅在教学框架与安全规则内作背景，胁迫、欲望与权力不对等只作压力背景，文字叙事级不露骨。非交易靠近的动作在单间与理疗角有最强落点：替她扣紧手腕上的皮质护腕、教一个动作、用酒精棉按住渗血、替她擦去后颈渗出的细汗并拉上防窥帘、递纸巾。
    bridge_status: not_required
  量体尺与尺寸档案:
    eras:
    - 维多利亚雾都
    aesthetics:
    - 工笔华服
    - 行当正剧
    - 暗潮涌动
    rule: 这间铺子的软尺没有误差争议——数是真的，谁都不怀疑数，争的是谁有权知道、谁有权让它继续写下去；档册把号换回名字，知情权不靠任何人的裁量，只看簿子在谁手里。在这座把人变成一枚铜号的雾都里，只有这一间定制铺把人变回「一串只属于她的数字」。定制行当以三次试身交付一件衣：初量、毛样、光样。量体须亲手执尺、当面读数、当场落簿；读数落簿不可涂改——旧数不划掉，新数写在下面，身体的日子一页一页自己开口；胖瘦孕瞒得过全家，瞒不过一页上下相邻的两行。档册记身不记钱：钱的账在账房另一本，档册只写身体——「谁的名字在哪一页」本身就是亲密的等级。档册不出二楼；可档册会继承、会被默写、会被「献档合编」征走——档案的每次移动，都是一整墙身体知情权的移动。试身以三次回针为接触的合法刻度：毛样试身时针在布面之下走，第一针示意该收的收了，第二针示意布面之下还有余量，第三针落下之前客人随时可以叫停，叫停不收费也不记档——身体接触的合法性不在谁同意，在针数。代办量体的读数回铺当众誊档。成衣交割即两讫，但档册留底——再做第二件，永远要重新翻开那一页；裁页带走是行内最重的断交——那一页裁走，这间铺子从此「量不到她」。这门手艺与别处的规矩界线分明：课时铃的两端把边界写在钟上、铃响归零；这里没有下课铃——第三针是刻度不是终点，落簿的数永不归零，写下的日子永远有效力。片场棚与月份牌画室争的是署名与形象归属，影像复制品拍得出第二张；这里的档册是数字与身体史，是不可复制的原初记录——影像可以翻拍，旧数只此一行。舞厅大班与乐台后台的暗潮在台上台下之间流转，靠演出秩序压住；这里的暗潮压在柜子里——档册天天躺在二楼，谁都看得见，争的从来不是看不看，是让它继续写、停写，还是裁走。
    social_rule: 这条街不问「她最近怎么了」，只问「她还是不是老尺寸」。体面人家不自己取衣——替谁量体本身就是一种亲密的授权。街面以「合身」为最高恭维：夸容貌失礼，夸手艺等于夸穿的人的眼力。档册的暗记只有执尺人认得——外行拿到簿子，也只看得见一栏一栏的数。
    places:
