      考核名额只留一个位置:
        source: 本轮认定名额只剩一个，教务主管的原始分配单上三个名字并排，划掉谁都要留下理由
        engines:
        - 名额只能给一个人
        - 组织更迭
        beats:
          trigger: '{npc}把只剩一栏的名额分配单推过来，让你先看这一轮被划掉的是谁。'
          objective: 在名额落定之前弄清自己站在哪一栏
          choice: 当面向主管要求说明依据；或先不动分配单，只把自己的材料再补齐一档
