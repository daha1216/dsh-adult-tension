          place: 停工的老旧剧院后台
          pair: 4
      回流的人没有地方可去:
        source: 同段的老同事从外地回流，宿舍名额早已排满，他只能先借住在老旧小区按周结算的隔断间里。
        engines:
        - 资源锁定
        - 第三方施压
        beats:
          trigger: '{npc}带着一身行李站在公共厨房门口，说周转宿舍还要等两个月，问能不能先挤几晚。'
          objective: 在不把自家地址变成落脚点的前提下，给出一个他自己能站稳的办法
          choice: 可帮他问清临时安置的口径；可让他先住一晚并当面说明只此一晚；也可直接说不行但要指条可走的路
          immediate: 今晚睡哪儿定下来了，本人的地址不留成他的长期收发点，欠费与催收也不转到本人名下。
          near: 留一晚容易变成两个月，指路能把人情与风险分开，断然拒绝则旧线断掉。
