      处方页被借给了法庭:
        source: 法庭为一桩案子调走了处方页，「只写编号」的约定第一次被纸张自己打破。
        engines:
        - 身份风险
        - 信任透支
        beats:
          trigger: '{npc}把法庭的调令按在处方窗口内侧，说那几页只写编号的处方，明早就要过法官的手。'
          objective: 在传票按编号索人之前，弄清哪一页会对上哪一个人
          choice: 可照章程交页让编号自己站着；可连夜请医师把钟点重开一遍，或让管事把总板上对应的几枚先对不上
          immediate: 交出去的页上只有编号与病症，对不上总板它就只是一串铜字
          near: 法官手里握着编号，管事手里握着对应，两把钥匙不碰头就谁也开不了谁
        far_trigger: 法庭拿着编号第二次来传人时
        far_consequence: 编号站着没对上的，案子只能停在纸张上；对上的那一位，从此全城都知道她的病泡过哪一池。
        exits:
        - 把处方页全数交出，浴场退出这桩案子
        - 请医师撤回处方另立新页，旧页作废
