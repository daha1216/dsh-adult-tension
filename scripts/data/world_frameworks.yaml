    rule: 白天一票一柜：番台售票、票根进柜上手写本，一块柜牌换一个人；打烊后整池可包——不立合同、不押金、没有服务单、也不写寄存簿，价钱当面点给看池人，钟点从打烊起算、封炉即止。钟点之内，夜池的规矩由包场的人定：谁下池、外人进不进、几点封炉；封炉之后，夜里讲定的一切随水凉一起作废。这里没有网名与头像要对——白天认柜牌，打烊后认钟头。搓澡床照疗程单排床，先来后到，插床须经床上的人点头。
    social_rule: 这条街不问「夜里谁来过」，只问「水开不开」；看池人夜里收的钟点钱与白天卖的票一样干净——白天与打烊后是两种合法，不是一明一暗。番台上没有赊账，茶水台边全是人情；对面砍价不还价：还价就等于承认自己撑不过这个冬。
